<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>冲刺卷刷题</title><style>*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;max-width:860px;margin:0 auto;padding:16px;padding-bottom:90px;background:#e8f5e0;color:#2c3e50;font-size:17px;line-height:1.8;letter-spacing:0.3px}h1{font-size:22px;text-align:center;color:#2c3e50}.chapter-title{text-align:center;font-size:19px;font-weight:600;color:#3a6b3d;margin:12px 0}.stats{text-align:center;margin-bottom:16px;font-size:15px;color:#5a6b5c}.card{background:#f4fbf0;border-radius:10px;padding:18px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.04)}.q-title{font-weight:600;margin-bottom:14px;line-height:1.9;font-size:18px;color:#1a1a1a}.option{display:block;width:100%;text-align:left;padding:14px 16px;margin:10px 0;border:1px solid #cce8cd;border-radius:8px;background:#fbfef9;cursor:pointer;font-size:17px;line-height:1.6}.option:hover{background:#d8f0da;border-color:#8cc98f}.option.correct{background:#d4edda;border-color:#28a745;color:#155724}.option.wrong{background:#f8d7da;border-color:#dc3545;color:#721c24}.option.disabled{pointer-events:none;opacity:.85}.explanation{display:none;margin-top:12px;padding:12px 16px;background:#eef7ea;border-left:4px solid #8cc98f;border-radius:4px;font-size:16px;line-height:1.8;color:#444}.explanation.show{display:block}.tag{display:inline-block;font-size:13px;background:#d5eccf;color:#3a6b3d;padding:3px 10px;border-radius:10px;margin-bottom:10px}.sub-q{margin:14px 0;padding-left:8px;border-left:3px solid #b8e0b3}.nav-bar{display:none}.nav-btn{flex:1;padding:12px;background:#8cc98f;color:#fff;border:none;border-radius:8px;font-size:15px;cursor:pointer}.nav-btn:hover{background:#76b579}.nav-btn:disabled{background:#c5d5ea;cursor:not-allowed}.chapter-select{text-align:center;margin-bottom:16px}.chapter-select select{padding:10px 14px;font-size:16px;border-radius:8px;border:1px solid #b8e0b3;background:#fbfef9}.quiz-nav{position:fixed;bottom:0;left:0;right:0;background:#f4fbf0;padding:12px 16px;box-shadow:0 -2px 10px rgba(0,0,0,.06);display:flex;gap:10px;align-items:center;justify-content:space-between;z-index:100;max-width:860px;margin:0 auto}.next-btn{padding:14px 24px;background:#8cc98f;color:#fff;border:none;border-radius:8px;font-size:16px;cursor:pointer;flex:1}.next-btn:hover{background:#76b579}.next-btn:disabled{background:#cce8cd;cursor:not-allowed}.progress-text{font-size:15px;color:#5a6b5c;white-space:nowrap}@media(max-width:600px){body{padding:10px;padding-bottom:90px;font-size:16px}.card{padding:14px}.q-title{font-size:17px;line-height:1.85}.option{padding:14px;font-size:16px}.nav-bar{display:none}}{body{padding:8px;padding-bottom:90px}.card{padding:12px}.q-title{font-size:15px}.option{padding:12px;font-size:15px}.nav-bar{display:none}}html,body{overflow-x:hidden;touch-action:pan-y}
#quiz{touch-action:pan-y}.chapter-select{width:100%;max-width:100%;box-sizing:border-box;padding:0 0}
.chapter-select select{width:100%;max-width:100%;box-sizing:border-box;display:block}

.q-title img{max-width:100%;height:auto}</style></head><body><h1>药综冲刺卷</h1><div class="chapter-select"><select id="chapterSelect" onchange="switchChapter(this.value)"></select></div><div class="chapter-title" id="chapterTitle"></div><div class="stats" id="stats"></div><div id="quiz"></div><div class="nav-bar"><button class="nav-btn" id="prevBtn" onclick="prevChapter()">上一章</button><button class="nav-btn" id="nextBtn" onclick="nextChapter()">下一章</button></div><script>
var chapters=[
{
  name: "押题密卷（一）",
  questions: [
    // ===== 一、最佳选择题（1-40） =====
    {type:"最佳选择题",q:"1. 对医师在诊疗活动中为患者开具的处方，进行合法性、规范性和适宜性审核，并做出是否同意调配发药决定的药学技术服务，这项内容指的是",opts:["A.静脉药物配置","B.药物治疗管理","C.药学查房","D.处方审核","E.药学科普"],ans:"D",exp:"本题考查药学服务的主要内容。处方审核指药学专业技术人员运用专业知识与实践技能，对医师在诊疗活动中为患者开具的处方，进行合法性、规范性和适宜性审核，并做出是否同意调配发药决定的药学技术服务。"},
    {type:"最佳选择题",q:"2. 患者，男，55岁，因高血压服用雷米普利治疗，服药后出现持续性干咳，无法耐受，故停药，停药几天后症状消失，患者再次使用该药进行治疗，再次出现干咳，该不良反应与药物之间的关系为",opts:["A.肯定","B.很可能","C.可能","D.可能无关","E.无法评价"],ans:"A",exp:"本题考查药物不良反应因果关系评价。肯定：用药及反应发生时间顺序合理；停药以后反应停止，或迅速减轻或好转；再次使用，反应再现，并可能明显加重；有文献资料佐证；排除原患疾病等其他混杂因素影响。患者因服用雷米普利后出现持续性干咳，停药几天后症状消失，再次使用后再次出现干咳，因此为肯定。"},
    {type:"最佳选择题",q:"3. 新生儿使用氯霉素易导致灰婴综合征，主要是因为新生儿的药动学特点是",opts:["A.口服给药吸收快，血-脑屏障易通过","B.皮下或肌内注射吸收不规则","C.代谢过程中某些酶系统不足，药物代谢减慢","D.水溶性药物排出慢，易中毒","E.主要经肾排泄的药物排泄慢，易蓄积"],ans:"C",exp:"本题考查新生儿药动学特点。新生儿某些酶系统尚有不足，可使药物的代谢减慢，血浆半衰期延长，容易蓄积中毒，如新生儿使用氯霉素易导致灰婴综合征。"},
    {type:"最佳选择题",q:"4. 关于药物的乳汁分泌，下列说法正确的是",opts:["A.脂溶性低的药物更容易分布到乳汁中，如地西泮","B.由于乳汁pH比母体血浆高，弱酸性药物如青霉素G易进入乳汁","C.药物与血浆蛋白结合率高时，更易分布到乳汁中，如华法林","D.弱碱性药物如红霉素易于分布到乳汁中，因为乳汁pH比母体血浆低","E.青霉素G不易进入乳汁，因为其脂溶性高"],ans:"D",exp:"本题考查药物乳汁分泌。脂溶性高的药物易分布到乳汁中，如地西泮；由于乳汁的pH比母体血浆pH低，弱碱性药物如红霉素易于分布到乳汁中，而弱酸性药物如青霉素G则不易进入乳汁；蛋白结合率高的药物不易分布到乳汁中，如华法林。"},
    {type:"最佳选择题",q:"5. 患者，男，48岁，因慢性肾衰竭接受透析治疗，近期检查发现出现高磷血症，医嘱给予碳酸钙（属于磷结合剂类药物）治疗。关于该药物的服用时间，正确的是",opts:["A.空腹服用","B.餐前半小时服用","C.进食的同时服用","D.餐后1小时服用","E.睡前服用"],ans:"C",exp:"本题考查透析患者常用药物。磷不能通过透析而被充分地清除，因而蓄积于血液中，出现高磷血症，服用“磷结合剂”类的碳酸钙片，目的是为了防止过多的磷从胃肠道吸收。碳酸钙必须在进食的同时服用，否则无效。"},
    {type:"最佳选择题",q:"6. 患者，男，28岁，误服某农药后被家人立刻送往医院进行救治，医生可首先考虑的催吐治疗药物是",opts:["A.鞣酸溶液","B.烯丙吗啡","C.活性炭混悬液","D.生理盐水","E.阿扑吗啡"],ans:"E",exp:"本题考查中毒解救的一般救治措施。阿扑吗啡是一种有效的催吐剂，常用皮下注射，成人剂量0.1mg/kg，多可在3～5分钟后呕吐。但吗啡中毒时禁用阿扑吗啡催吐，否则会加重中枢抑制作用。"},
    {type:"最佳选择题",q:"7. 患者，男，32岁，因投食路边流浪猫被咬伤，关于其伤口处置及药物治疗的说法，正确的是",opts:["A.仅用清水冲洗伤口，无需消毒及其他处理","B.只需注射狂犬病疫苗，无需预防破伤风","C.首选甲硝唑治疗","D.β-内酰胺类药物不耐受时，可选择复方磺胺甲噁唑与甲硝唑联用","E.症状缓解后立即停用抗生素"],ans:"D",exp:"本题考查擦伤、割伤与咬伤的处置。猫狗咬伤者若β-内酰胺类药物不耐受，建议以一种覆盖需氧菌与一种覆盖厌氧菌的药物联合治疗，如复方磺胺甲噁唑+甲硝唑。症状和体征缓解后应继续使用抗生素至少1～2日。"},
    {type:"最佳选择题",q:"8. 患者，女，35岁，吃坚果时突发呼吸困难，诊断为气道异物梗阻。关于其处置的说法，正确的是",opts:["A.应立即常规使用抗炎药与抗生素预防感染","B.首选胸部冲击法，操作者站在患者身前实施急救","C.若现场无他人，患者可利用椅背进行腹部冲击自救","D.对于该成年患者，也可采用拍背法急救","E.气道异物取出必须通过开胸手术完成"],ans:"C",exp:"本题考查气道异物梗阻的处置。若现场无其他可施救人员，患者自己可利用椅背等水平光滑且固定的物体进行腹部冲击自救。"},
    {type:"最佳选择题",q:"9. 患者，女，28岁，口腔内出现多个圆形或椭圆形的溃疡，疼痛明显，影响进食和说话。既往有口腔溃疡发作史。体格检查：口腔黏膜可见多个溃疡，表面有黄色分泌物。诊断：复发性口腔溃疡。药师推荐用药后并指导患者该药不得长期使用，否则可引起局部组织萎缩。药师推荐的药物可能是",opts:["A.甲硝唑含漱液","B.氯己定含漱液","C.地塞米松粘贴片","D.利多卡因凝胶","E.聚维酮碘含漱液"],ans:"C",exp:"本题考查口腔溃疡的药物治疗。糖皮质激素局部长期频繁使用可引起局部组织萎缩，使由皮肤、黏膜等部位侵入的病原菌难以得到控制，引起继发性真菌感染等。"},
    {type:"最佳选择题",q:"10. 患者，男，32岁，因工作需要，每天长时间使用电脑和手机，近1个月来出现眼睛疲劳、干涩、视物模糊等症状，休息后症状可缓解。视力检查正常，眼底检查未见明显异常。诊断：干眼症。下列药物中，可以改善眼部干涩症状的是",opts:["A.山莨菪碱滴眼液","B.玻璃酸钠滴眼液","C.左氧氟沙星滴眼液","D.红霉素眼膏","E.色甘酸钠滴眼液"],ans:"B",exp:"本题考查干眼症的药物治疗。干眼症的治疗可以选择润滑眼表和促进修复的药物，如人工泪液：轻度可选用黏稠度较低的，如0.1%玻璃酸钠、聚乙二醇等。"},
    {type:"最佳选择题",q:"11. 患者，女，22岁，面部痤疮多发，包括丘疹、脓疱等多种类型。症状在月经前后会加重。痤疮导致皮肤瘙痒、疼痛，对患者的外貌和心理产生了一定影响，医师予以药物进行治疗。医师指导说明治疗前1个月、治疗期间及治疗结束后3个月内严格避孕，该患者应用的药物可能是",opts:["A.异维A酸","B.水杨酸","C.红霉素","D.过氧化苯甲酰","E.克林霉素"],ans:"A",exp:"本题考查痤疮的药物治疗。异维A酸有明确的致畸作用，育龄期女性患者及其配偶应在治疗前1个月、治疗期间及治疗结束后3个月内严格避孕。"},
    {type:"最佳选择题",q:"12. 患者，男，45岁，过去5年，体重逐渐增加，已超出正常范围。日常感觉体力下降，稍微活动就气喘吁吁，被诊断出高血压、高血脂等疾病。体检：身高175cm，体重95kg，腰围105cm。该患者的体重指数结果为",opts:["A.正常，BMI为21.0","B.超重，BMI为24.2","C.超重，BMI为26.3","D.肥胖，BMI为29.6","E.肥胖，BMI为31.0"],ans:"E",exp:"本题考查判断肥胖的指标。中国成年人正常BMI为18.5～23.9，24.0～27.9为超重，≥28.0为肥胖；BMI=体重/身高²=95÷1.75÷1.75=31.0kg/m²。"},
    {type:"最佳选择题",q:"13. 患者，女，48岁，近期因右上腹疼痛、恶心等症状就医，经检查诊断为胆石症，同时影像学检查显示存在胆道完全梗阻情况。针对该患者用药，以下应避免使用的是",opts:["A.头孢克洛","B.熊去氧胆酸","C.消炎利胆片","D.双氯芬酸","E.匹维溴铵"],ans:"B",exp:"本题考查胆石症与胆囊炎的用药注意事项与患者教育。熊去氧胆酸禁用于胆道完全梗阻和严重肝功能减退患者。"},
    {type:"最佳选择题",q:"14. 患者，男，45岁，近3个月来频繁出现阴茎勃起困难，影响性生活质量，前往男科就诊，诊断为勃起功能障碍（ED）。关于该患者治疗药物的选择，说法正确的是",opts:["A.口服雄激素（如十一酸睾酮）是ED治疗的首选方式","B.西地那非因起效最快，是ED治疗的唯一首选口服药","C.他达拉非不属于5型磷酸二酯酶抑制剂（PDE5i）类药物范畴","D.口服5型磷酸二酯酶抑制剂（PDE5i）是ED治疗的首选方式","E.对于所有ED患者，十一酸睾酮均可替代5型磷酸二酯酶抑制剂（PDE5i）进行治疗"],ans:"D",exp:"本题考查勃起功能障碍（ED）的药物治疗。口服PDE5i已成为ED治疗的首选方式，因其使用方便、安全、有效，也易被多数患者接受。"},
    {type:"最佳选择题",q:"15. 患者，女，32岁，诊断为白癜风，以下药物中，不用于白癜风治疗的是",opts:["A.卤米松乳膏","B.复方甘草酸苷片","C.他克莫司软膏","D.阿莫西林胶囊","E.泼尼松片"],ans:"D",exp:"本题考查白癜风的治疗药物。阿莫西林胶囊属于抗菌药物，一般不用于治疗白癜风。"},
    {type:"最佳选择题",q:"16. 患者，女，26岁，诊断为缺铁性贫血，服用铁剂治疗期间，为促进铁吸收，可合用的药物是",opts:["A.奥美拉唑","B.茶水","C.维生素C","D.牛奶","E.四环素"],ans:"C",exp:"本题考查缺铁性贫血患者教育。维生素C可有效促进铁吸收，提升缺铁性贫血治疗效果。奥美拉唑、茶水、牛奶、四环素会抑制铁吸收。"},
    {type:"最佳选择题",q:"17. 患者，女，19岁，哮喘病史4年，花粉过敏。作为药师，可以优先考虑为该患者推荐的最有效控制哮喘呼吸道炎症的药物是",opts:["A.沙丁胺醇雾化吸入剂","B.泼尼松片","C.沙丁胺醇片","D.二丙酸倍氯米松干粉吸入剂","E.达特罗吸入粉雾剂"],ans:"D",exp:"本题考查哮喘的药物治疗。糖皮质激素是最有效的控制哮喘呼吸道炎症的药物，吸入为首选途径。常用的吸入性糖皮质激素有二丙酸倍氯米松、布地奈德、环索奈德、丙酸氟替卡松等。"},
    {type:"最佳选择题",q:"18. 患者，男，68岁，因“反复咳嗽、咳脓性痰伴气短加重1周”入院。既往90日内因肺部感染住院并使用抗菌药物静脉滴注，肺功能示极重度慢阻肺（FEV1占预计值25%）。诊断为肺部感染，慢性阻塞性肺疾病急性发作。以下抗感染药物首选的是",opts:["A.阿莫西林-克拉维酸","B.多西环素","C.克拉霉素","D.头孢他啶","E.头孢克洛"],ans:"D",exp:"本题考查慢阻肺急性加重期的治疗。有铜绿假单胞菌感染风险，用药包括β-内酰胺类（头孢他啶、头孢吡肟、哌拉西林/他唑巴坦、头孢哌酮/舒巴坦）、喹诺酮类等。"},
    {type:"最佳选择题",q:"19. 患者，男，67岁，有2型糖尿病病史5年，空腹血糖控制在6.1～7.8mmol/L，糖化血红蛋白6.5%。近期诊断为高血压，血压波动在150/95mmHg左右，同时经心电图及动态心电监测确诊患有二度房室传导阻滞（心室率48次/分）。在选择降压药物时，该患者应避免使用的是",opts:["A.氢氯噻嗪","B.卡托普利","C.缬沙坦","D.美托洛尔","E.硝苯地平"],ans:"D",exp:"本题考查高血压的治疗药物。β受体拮抗剂的禁忌证为二至三度房室传导阻滞、哮喘。"},
    {type:"最佳选择题",q:"20. 患者，男，68岁，患高血压10年，合并慢性肾脏病3期（估算肾小球滤过率eGFR 45ml/min·1.73m²），近期血压控制不佳（155/90mmHg），且既往服用ACEI类药物后出现干咳。该患者适宜选择的降压药物是",opts:["A.氢氯噻嗪片","B.硝苯地平控释片","C.沙库巴曲缬沙坦片","D.美托洛尔缓释片","E.氨氯地平片"],ans:"C",exp:"本题考查高血压的治疗药物。血管紧张素受体脑啡肽酶抑制剂（ARNI）沙库巴曲缬沙坦，适用于慢性肾脏病、老年高血压患者。"},
    {type:"最佳选择题",q:"21. 患者，女，54岁，有高血压病史，近日体检发现血尿酸、血脂异常，经生活方式干预3个月后，复查化验结果：TC 6.9mmol/L，TG 1.6mmol/L，LDL-C 4.3mmol/L，SUA 480μmol/L。该患者首选的调脂药是",opts:["A.普罗布考","B.非诺贝特","C.阿托伐他汀","D.阿昔莫司","E.考来烯胺"],ans:"C",exp:"本题考查血脂异常的药物治疗。他汀类药物适用于高胆固醇血症、混合型高脂血症和ASCVD的防治。阿托伐他汀、瑞舒伐他汀可在每日任何固定时间服药。"},
    {type:"最佳选择题",q:"22. 患者，男，52岁，因“发作性胸痛3日”就诊。胸痛多在凌晨2点发作，持续5～10分钟，含服硝酸甘油可缓解。动态心电图示发作时ST段抬高，冠状动脉造影未见固定狭窄病变。诊断为变异型心绞痛。该患者的一线治疗药物应选择",opts:["A.阿司匹林肠溶片（100mg/d）","B.美托洛尔缓释片（47.5mg/d）","C.硝酸甘油舌下片（0.5mg/次）","D.卡托普利片（25mg/次，每日3次）","E.硝苯地平控释片（30mg/d）"],ans:"E",exp:"本题考查心绞痛的药物治疗。对变异型心绞痛或以冠状动脉痉挛为主的心绞痛，钙通道阻滞剂是一线治疗药物。"},
    {type:"最佳选择题",q:"23. 患者，男，62岁，诊断为稳定型冠心病，行冠状动脉介入治疗后，关于抗血小板治疗的说法，正确的是",opts:["A.双联抗血小板治疗仅需持续3个月，之后可单用替格瑞洛","B.双联抗血小板治疗应选择阿司匹林（100mg，qd）+氯吡格雷（75mg，qd），持续12个月，之后单用替格瑞洛","C.双联抗血小板治疗至少持续12个月，待药物洗脱支架完全内皮化后，若阿司匹林不耐受可选择氯吡格雷","D.稳定型冠心病患者介入治疗后，长期单用替格瑞洛抗血小板治疗即可","E.介入治疗后抗血小板治疗应首选氯吡格雷+替格瑞洛"],ans:"C",exp:"本题考查稳定型心绞痛的治疗。稳定型冠心病患者如果行冠状动脉介入治疗，需进行阿司匹林+氯吡格雷（或替格瑞洛）的双联抗血小板治疗至少持续12个月，待药物洗脱支架被完全内皮化；此后一般选择阿司匹林，如果阿司匹林不能耐受可以选择氯吡格雷。"},
    {type:"最佳选择题",q:"24. 患者，女，68岁，长期服用华法林抗凝治疗，某日志记服药，次日想起时正确的处理方式是",opts:["A.补服2倍剂量华法林","B.补服1次当日剂量后继续常规服用","C.无需补服，按常规剂量继续服用","D.补服1次剂量，之后剂量加倍服用","E.暂停服药1天，第3天开始常规服用"],ans:"C",exp:"本题考查华法林漏服的处理。掌握药物剂量，按时服药：忘服1次华法林，当日记起则即时补服；第二天才想起，则无需补服。"},
    {type:"最佳选择题",q:"25. 患者，男，66岁，诊断为短暂性脑缺血发作（TIA），同时患有机械心脏瓣膜病合并心房颤动。针对该患者预防脑卒中，应推荐使用的药物是",opts:["A.阿司匹林","B.华法林","C.尿激酶","D.胺碘酮","E.美托洛尔"],ans:"B",exp:"本题考查脑卒中的治疗。对合并瓣膜性心房颤动（即中至重度二尖瓣狭窄或机械心脏瓣膜病合并心房颤动）的TIA患者，推荐使用华法林抗凝治疗以降低卒中风险。"},
    {type:"最佳选择题",q:"26. 容易造成共济失调、视物模糊、齿龈增生、镇静等不良反应的药物是",opts:["A.佐匹克隆","B.苯妥英钠","C.阿米替林","D.氟西汀","E.多奈哌齐"],ans:"B",exp:"本题考查抗癫痫药物的主要不良反应。苯妥英钠为抗癫痫药，主要不良反应有共济失调、视物模糊、齿龈增生、镇静作用等，有效治疗血药浓度为10～20μg/ml。"},
    {type:"最佳选择题",q:"27. 患者，女，32岁，诊断为抑郁症，正在服用抗抑郁药物治疗。近期出现体重上升、嗜睡、口干等不适症状，药师结合药物不良反应特点分析，可能因服用以下哪种药物导致",opts:["A.米氮平","B.曲唑酮","C.文拉法辛","D.氟西汀","E.丁螺环酮"],ans:"A",exp:"本题考查常用抗抑郁药物的主要不良反应。米氮平的主要不良反应有嗜睡、镇静、口干、体重增加、食欲增加、头晕和疲乏。"},
    {type:"最佳选择题",q:"28. 患者，男，48岁，间断胸骨后灼烧痛伴餐后上腹胀、嗳气2个月，诊断为重度反流性食管炎。该患者适宜首选的治疗药物是",opts:["A.氢氧化铝","B.法莫替丁","C.奥美拉唑","D.多潘立酮","E.铝碳酸镁"],ans:"C",exp:"本题考查胃食管反流病的药物治疗。PPI（如奥美拉唑）可产生显著而持久的抑酸效果，是GERD治疗的首选药物。"},
    {type:"最佳选择题",q:"29. 患者，男，28岁，有磺胺类药物过敏史，3个月前出现腹泻，多为稀糊状，间断为黏液及脓血便，每日8～12次，有里急后重感。经结肠镜检查确诊为轻型溃疡性结肠炎，该患者适宜首选的治疗药物是",opts:["A.诺氟沙星","B.美沙拉秦","C.柳氮磺吡啶","D.泼尼松","E.洛哌丁胺"],ans:"B",exp:"本题考查溃疡性结肠炎的药物治疗。氨基水杨酸类药物适用于UC活动期的诱导缓解和缓解期的维持治疗，是轻、中型UC治疗的主要药物。柳氮磺吡啶是美沙拉嗪的前体药物，禁用于对磺胺类药物过敏的患者。"},
    {type:"最佳选择题",q:"30. 属于pH依赖型药物，释放部位为回肠末端和结肠的溃疡性结肠炎治疗药物是",opts:["A.奥沙拉秦","B.巴柳氮","C.柳氮磺吡啶","D.5-ASA栓剂","E.美沙拉秦缓释颗粒"],ans:"E",exp:"本题考查溃疡性结肠炎的药物治疗。5-ASA缓、控释制剂美沙拉秦肠溶片、缓释颗粒为pH依赖型药物，释放部位为回肠末端和结肠。"},
    {type:"最佳选择题",q:"31. 患者，女，48岁，患有胃溃疡，需使用黏膜保护剂治疗，以下属于内源性黏膜保护剂的是",opts:["A.硫糖铝","B.铝碳酸镁","C.米索前列醇","D.枸橼酸铋钾","E.氢氧化铝"],ans:"C",exp:"本题考查消化性溃疡的药物治疗。内源性黏膜保护剂：米索前列醇、吉法酯、替普瑞酮、瑞巴派特等。"},
    {type:"最佳选择题",q:"32. 患者，女，45岁，因胃溃疡需抑酸治疗，关于钾离子竞争性酸阻滞剂（P-CAB）的说法，正确的是",opts:["A.P-CAB不可逆性结合质子泵，受饮食影响大","B.我国上市的P-CAB仅有替戈拉生","C.P-CAB类药物比PPI起效慢、持续时间短","D.伏诺拉生属于P-CAB类新型抑酸剂，可任意时间服用","E.凯普拉生未在我国上市，且不属于P-CAB类"],ans:"D",exp:"本题考查钾离子竞争性酸阻滞剂的作用特点。钾离子竞争性酸阻滞剂属于新型抑酸剂，其可逆性与质子泵的静息泵和活性泵结合，可任意时间服用，不受饮食影响。伏诺拉生、替戈拉生已在我国上市，凯普拉生未在我国上市。P-CAB类药物比PPI起效更快、持续时间更长、抑酸效果更强。"},
    {type:"最佳选择题",q:"33. 患者，女，66岁，患2型糖尿病，长期服用二甲双胍500mg tid、阿卡波糖50mg tid治疗。药师应告知患者长期服用二甲双胍时宜补充",opts:["A.维生素B6","B.维生素C","C.维生素B12","D.维生素A","E.烟酸"],ans:"C",exp:"本题考查糖尿病的治疗方案。长期使用二甲双胍者应注意维生素B12缺乏的可能性，宜补充维生素B12。"},
    {type:"最佳选择题",q:"34. 患者，女，58岁，患2型糖尿病，肾功能不全，eGFR为25ml/(min·1.73m²)，以下降糖药物应用于该患者无需调整剂量的是",opts:["A.胰岛素","B.二甲双胍","C.那格列奈","D.阿卡波糖","E.艾塞那肽"],ans:"C",exp:"本题考查肾功能不全患者的降糖药物选择。那格列奈应用于肾功能不全的糖尿病患者无需调整剂量。"},
    {type:"最佳选择题",q:"35. 痛风急性发作期在无用药禁忌证的前提下，首选的治疗药物是",opts:["A.别嘌醇","B.碳酸氢钠","C.丙磺舒","D.秋水仙碱","E.阿司匹林"],ans:"D",exp:"本题考查痛风急性发作期的药物治疗。痛风急性发作期在无用药禁忌证的前提下，首选秋水仙碱，推荐在痛风发作12小时内尽早使用，超过36小时后疗效显著降低。"},
    {type:"最佳选择题",q:"36. 患者，男，60岁，因痛风咨询用药，关于非布司他的说法，错误的是",opts:["A.不良反应包括肝功能损害、恶心、皮疹等，用药需从小剂量开始","B.正在接受硫唑嘌呤治疗的患者禁用","C.有心血管疾病病史者需谨慎使用，随访监测心血管事件","D.可安全用于既往有颅内静脉血栓形成（CVT）病史的患者","E.用药期间应定期监测肝功能"],ans:"D",exp:"本题考查痛风的用药注意事项。非布司他不建议用于既往有颅内静脉血栓形成（CVT）病史或近期有CVT发作的患者。"},
    {type:"最佳选择题",q:"37. 关于类风湿关节炎患者使用糖皮质激素的原则，说法错误的是",opts:["A.长期规律口服小剂量地塞米松片控制炎症","B.尽可能小剂量、短期使用","C.在治疗过程中注意补充钙剂和维生素D","D.用药过程中应监测血压及血糖变化","E.可关节腔注射液素，1年内不宜超过3～4次"],ans:"A",exp:"本题考查类风湿关节炎的药物治疗。激素治疗RA的原则是尽可能小剂量、短期使用，不推荐单用或长期大量使用糖皮质激素尤其是长效糖皮质激素。"},
    {type:"最佳选择题",q:"38. 适用于伴有前列腺体积增大的良性前列腺增生症（BPH）患者，同时阻断I型和II型5α还原酶的同工酶，显效快，服用1个月即可观察到症状缓解的药物是",opts:["A.托特罗定","B.奥昔布宁","C.度他雄胺","D.非那雄胺","E.多沙唑嗪"],ans:"C",exp:"本题考查良性前列腺增生症的药物治疗。度他雄胺同时阻断Ⅰ型和Ⅱ型5α还原酶的同工酶，显效快，服用1个月即可观察到症状缓解。"},
    {type:"最佳选择题",q:"39. 慢性肾脏病（CKD）并发肾性贫血患者应使用的治疗药物是",opts:["A.氯化钾","B.人促红素","C.碳酸氢钠","D.氢氧化铝","E.司维拉姆"],ans:"B",exp:"本题考查慢性肾脏病的药物治疗。建议所有透析和非透析的CKD患者，当Hb<100g/L时开始使用红细胞生成刺激剂（ESAs）如人促红素治疗。"},
    {type:"最佳选择题",q:"40. 对于抗肿瘤药物使用时出现的恶心、呕吐，乳腺癌患者禁止使用的止吐药是",opts:["A.甲氧氯普胺","B.昂丹司琼","C.地塞米松","D.苯海拉明","E.阿瑞匹坦"],ans:"A",exp:"本题考查抗肿瘤药的典型不良反应及处理。乳腺癌患者禁止使用甲氧氯普胺止吐，因为甲氧氯普胺抑制催乳素抑制因子，引起催乳素不断分泌，促进乳腺小叶增生，不但不利于乳腺癌的治疗，还会增加乳腺癌复发的几率。"},

    // ===== 二、配伍选择题（41-85） =====
    {type:"配伍选择题",subs:[
      {q:"41. 含有β-内酰胺环，极易裂解而失效，不宜与酸性较强的葡萄糖注射液配伍的药物是",opts:["A.瑞替普酶","B.多烯磷脂酰胆碱","C.苯妥英钠","D.红霉素","E.青霉素"],ans:"E",exp:"青霉素结构中含有β-内酰胺环，极易裂解而失效，不宜与酸性较强的葡萄糖注射液配伍。"},
      {q:"42. 属于弱酸强碱盐，与酸性的葡萄糖注射液配伍可析出沉淀的药物是",opts:["A.瑞替普酶","B.多烯磷脂酰胆碱","C.苯妥英钠","D.红霉素","E.青霉素"],ans:"C",exp:"苯妥英钠属于弱酸强碱盐，与酸性的葡萄糖注射液配伍可析出苯妥英沉淀。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"43. 患者，男，55岁，消化性溃疡病史5年，近日病情加重，表现为活动性消化性溃疡症状，患者为预防心血管疾病自行服用阿司匹林，属于",opts:["A.过度治疗用药","B.有禁忌证用药","C.无适应证用药","D.慎用","E.正常用药情况"],ans:"B",exp:"有禁忌证用药：忽略药品说明书的提示；忽略病情和患者的基础疾病。如活动性消化性溃疡患者禁用阿司匹林，否则易造成胃出血甚至胃穿孔。"},
      {q:"44. 患者，女，62岁，高血压、2型糖尿病，脂质肾病，该患者因车祸重伤，若必须使用脂肪乳，属于",opts:["A.过度治疗用药","B.有禁忌证用药","C.无适应证用药","D.慎用","E.正常用药情况"],ans:"D",exp:"“慎用”是指一般不轻易使用，但“慎用”不等于“不能使用”。脂肪乳用于急性肝损伤、急性胰腺炎、脂质肾病、脑卒中、高脂血症患者，容易出现脂质紊乱，遇到必须使用时，应严密监测患者甘油三酯水平。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"45. 需考虑浓度问题，浓度20%及以上的注射液属于高警示药品的是",opts:["A.茶碱类药物（口服）","B.葡萄糖注射液","C.阿托品注射液（1mg/支）","D.灭菌注射用水（10ml）","E.阿维A胶囊"],ans:"B",exp:"高渗葡萄糖注射液（浓度20%或以上）属于高警示药品。"},

    ]},
    {type:"配伍选择题",subs:[
      {q:"79. 属于超长效胰岛素类似物，皮下注射给药，作用持续时间长达196小时，可每周给药一次的药物是",opts:["A.(重组)人胰岛素注射液","B.甘精胰岛素注射液","C.地特胰岛素注射液","D.精蛋白(重组)人胰岛素混合注射液(50R)","E.依柯胰岛素注射液"],ans:"E",exp:"依柯胰岛素注射液属于超长效胰岛素类似物，皮下注射给药，作用持续时间长达196小时，可每周给药一次。"},
      {q:"80. 静脉应用可抢救糖尿病酮症酸中毒和高血糖高渗性昏迷的药物是",opts:["A.(重组)人胰岛素注射液","B.甘精胰岛素注射液","C.地特胰岛素注射液","D.精蛋白(重组)人胰岛素混合注射液(50R)","E.依柯胰岛素注射液"],ans:"A",exp:"（重组）人胰岛素注射液静脉应用，可抢救糖尿病酮症酸中毒和高血糖高渗性昏迷。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"81. 用于重症类风湿关节炎，可引起高血压、齿龈增生、多毛的DMARDs是",opts:["A.羟氯喹","B.环孢素","C.甲氨蝶呤","D.阿达木单抗","E.利妥昔单抗"],ans:"B",exp:"环孢素用于重症类风湿关节炎（RA），主要不良反应有高血压、肝肾毒性、神经系统损害、继发性感染、肿瘤以及胃肠道反应、齿龈增生、多毛等。"},
      {q:"82. 抗风湿药中，与DMARDs相比，起效快、抑制骨质破坏作用明显的TNF-α拮抗剂是",opts:["A.羟氯喹","B.环孢素","C.甲氨蝶呤","D.阿达木单抗","E.利妥昔单抗"],ans:"D",exp:"肿瘤坏死因子（TNF-α）拮抗剂包括依那西普、英夫利西单抗和阿达木单抗。与DMARDs相比，起效快、抑制骨质破坏的作用明显、患者总体耐受性好。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"83. 可导致患者沿静脉出现迂回线状色素沉着和皮肤迅速晒黑的抗肿瘤药物是",opts:["A.多柔比星","B.氟尿嘧啶","C.吉非替尼","D.利妥昔单抗","E.奥沙利铂"],ans:"B",exp:"氟尿嘧啶可致患者沿静脉出现迂回线状色素沉着和皮肤迅速晒黑而无灼痛或红斑。"},
      {q:"84. 可能会导致乙肝再激活，用药前进行乙肝病毒筛查，不应对活动性乙肝患者应用的抗肿瘤药物是",opts:["A.多柔比星","B.氟尿嘧啶","C.吉非替尼","D.利妥昔单抗","E.奥沙利铂"],ans:"D",exp:"利妥昔单抗可能会导致乙肝再激活，用药前进行乙肝病毒筛查，不应对活动性乙肝患者应用利妥昔单抗。"},
      {q:"85. 易引起外周神经毒性，遇冷刺激毒性加重的抗肿瘤药物是",opts:["A.多柔比星","B.氟尿嘧啶","C.吉非替尼","D.利妥昔单抗","E.奥沙利铂"],ans:"E",exp:"奥沙利铂遇冷刺激时毒性加重，应嘱患者避免冷饮冷食，避免暴露于低温或接触冰冷物体。"}
    ]},

    // ===== 三、综合分析选择题（86-95） =====
    {type:"最佳选择题",q:"86. 关于社区获得性肺炎的常见或核心病原体，不包括的是",opts:["A.耐甲氧西林金黄色葡萄球菌","B.肺炎支原体","C.肺炎链球菌","D.流感嗜血杆菌","E.金黄色葡萄球菌"],ans:"A",exp:"社区获得性肺炎常见或核心的病原体有肺炎支原体、肺炎链球菌、流感嗜血杆菌、肺炎衣原体、肺炎克雷伯菌及金黄色葡萄球菌。耐甲氧西林金黄色葡萄球菌为不常见或罕见病原体。"},
    {type:"最佳选择题",q:"87. 该患者经验性抗感染治疗适宜选用的药物是",opts:["A.阿莫西林-克拉维酸钾","B.诺氟沙星","C.甲氧苄啶-磺胺甲噁唑","D.阿奇霉素","E.米诺环素"],ans:"E",exp:"该患者有青霉素过敏史，故阿莫西林-克拉维酸钾禁用；患者16岁，沙星类药物禁止使用；社区获得性肺炎的常用治疗药物中无磺胺类；由于大环内酯类药物耐药率特别高，在经验抗感染中不单独使用。针对青年无基础疾病或怀疑支原体/衣原体感染患者可口服多西环素或米诺环素。"},
    {type:"最佳选择题",q:"88. 关于该患者的治疗意见，下列说法错误的是",opts:["A.若病原学检查结果为产β-内酰胺酶的流感嗜血杆菌，可以考虑使用头孢唑林","B.患者在体温正常2～3天且临床症状一切平稳后可以考虑停药","C.应在初始治疗后72小时对病情进行评估","D.抗感染治疗不必以胸部X片结果作为停药的指征","E.经验抗感染一般不使用糖皮质激素进行辅助治疗"],ans:"A",exp:"若病原学检查结果为产β-内酰胺酶的流感嗜血杆菌，可以考虑使用阿莫西林-克拉维酸钾或第二、三代头孢菌素进行静脉途径治疗。该患者青霉素过敏，可以考虑第二、三代头孢菌素进行治疗，头孢唑林为第一代头孢菌素，与青霉素有交叉过敏反应，不宜使用。"},
    {type:"最佳选择题",q:"89. 该患者出现哮喘急性发作首选的药物是",opts:["A.孟鲁司特钠咀嚼片","B.特布他林片","C.沙丁胺醇气雾剂","D.泼尼松片","E.噻托溴铵吸入粉雾剂"],ans:"C",exp:"吸入的短效β2受体激动剂包括沙丁胺醇、特布他林气雾剂、溶液等，能够迅速缓解支气管痉挛，通常在数分钟内起效，疗效可维持数小时，是缓解轻至中度哮喘急性症状的首选药物。"},
    {type:"最佳选择题",q:"90. 经评估该患者病情为第2级，需长期用药控制哮喘发作，首选的治疗方案是",opts:["A.低剂量沙美特罗气雾剂","B.低剂量布地奈德气雾剂","C.规律使用沙丁胺醇片","D.规律使用泼尼松片","E.规律使用茶碱片"],ans:"B",exp:"哮喘第2级首选控制药物为使用低剂量吸入型糖皮质激素（ICS）如布地奈德吸入剂或按需使用低剂量ICS-福莫特罗。"},
    {type:"最佳选择题",q:"91. 使用上题选择的药物进行治疗，最可能出现的不良反应是",opts:["A.骨骼肌震颤","B.低血压","C.低血钾","D.失眠","E.口腔念珠菌感染"],ans:"E",exp:"吸入型糖皮质激素（ICS）在口咽部的不良反应包括声音嘶哑、咽部不适和念珠菌感染。吸药后应及时用清水含漱口咽部。"},
    {type:"最佳选择题",q:"92. 对该患者的用药指导说法正确的是",opts:["A.阿莫西林胶囊分别于早餐前和晚餐前半小时口服","B.甲硝唑片分别于早餐、中餐、晚餐前半小时和睡前口服","C.雷贝拉唑应早餐后和晚餐后半小时口服","D.枸橼酸铋钾分别于早餐后和睡前口服","E.阿莫西林胶囊于餐后立即口服"],ans:"E",exp:"根除幽门螺杆菌治疗方案中，2种抗生素应餐后立即口服，可提高药物在胃部存留时间和浓度，发挥局部抗菌作用。PPI和铋剂分别于早餐和晚餐前0.5h口服。"},
    {type:"最佳选择题",q:"93. 该患者根除幽门螺杆菌治疗的疗程是",opts:["A.1周","B.2周","C.4周","D.2个月","E.3个月"],ans:"B",exp:"目前推荐含有铋剂的四联方案（2种抗生素+PPI+铋剂）作为主要的经验性根除H.pylori治疗方案，疗程14日。"},
    {type:"最佳选择题",q:"94. 药师应告知患者在服用维生素D、碳酸钙基础上，可加服",opts:["A.泼尼松龙","B.阿仑膦酸钠","C.艾司奥美拉唑","D.苯妥英钠","E.氟西汀"],ans:"B",exp:"阿仑膦酸钠为双膦酸盐类药物，该类药物是目前临床上应用最为广泛的抗骨质疏松症药物。"},
    {type:"最佳选择题",q:"95. 对于骨质疏松症的用药指导与患者教育，说法错误的是",opts:["A.钙剂应选择清晨、睡前各用1次，效果更好","B.服用阿仑膦酸钠应餐中服用","C.适度运动，少饮咖啡和碳酸饮料","D.食管炎为双膦酸盐类药物的主要不良反应","E.大量连续应用维生素D可发生中毒"],ans:"B",exp:"口服双膦酸盐应于早晨空腹给药。为避免对食管和胃的刺激，建议用足量水送服，服药时保持上身直立的坐位或站位，服后30分钟内不宜进食和卧床。"},

    // ===== 四、多项选择题（96-100） =====
    {type:"多项选择题",q:"96. 某驾驶员近期因身体不适服用药物，可能影响其安全驾驶的药物有",opts:["A.布洛芬","B.氯苯那敏","C.右美沙芬","D.奥美拉唑","E.二甲双胍"],ans:"ABCD",exp:"布洛芬可引起头晕、头痛、耳鸣等症状；氯苯那敏可能抑制中枢神经，致嗜睡、不自主颤抖等反应；右美沙芬引起头晕、嗜睡和乏力等症状；奥美拉唑可引起疲乏、嗜睡等症状，均会影响驾驶安全。二甲双胍一般不会影响驾驶员安全。"},
    {type:"多项选择题",q:"97. 因消化不良出现食欲不振的患者可使用的治疗药物有",opts:["A.铝碳酸镁","B.维生素B₁","C.维生素B₆","D.干酵母","E.蒙脱石散"],ans:"BCD",exp:"消化不良出现食欲不振可使用增加食欲的药物有维生素B₁、维生素B₆、干酵母。"},
    {type:"多项选择题",q:"98. 下列关于血脂异常的说法中，正确的有",opts:["A.ASCVD患者需要在医生的指导下长期甚至终生接受调脂治疗，不能因为LDL-C暂时达标就停止治疗","B.洛伐他汀可在每日任何固定时间服用","C.辛伐他汀应避免与克拉霉素同时应用","D.应用他汀类药物治疗，应监测肌酸激酶、肝肾功能","E.生活方式干预是一种最佳成本/效益比和风险/获益比的治疗措施"],ans:"ACDE",exp:"洛伐他汀、辛伐他汀等短半衰期的他汀类药物建议在晚间或睡前服用；阿托伐他汀与瑞舒伐他汀可在每日任何固定时间服用。辛伐他汀、洛伐他汀应避免与大环内酯类抗菌药物（阿奇霉素除外）合用。"},
    {type:"多项选择题",q:"99. 可以用于治疗良性前列腺增生伴发膀胱过度活动症、储尿期症状为主的药物有",opts:["A.达泊西汀","B.奥昔布宁","C.托特罗定","D.索利那新","E.米拉贝隆"],ans:"BCDE",exp:"M受体拮抗剂奥昔布宁、托特罗定、索利那新，用于针对伴发膀胱过度活动症的良性前列腺增生患者。β3受体激动剂米拉贝隆，可选择性刺激膀胱的β3受体，舒张逼尿肌，用于以膀胱储尿期症状为主的中、重度LUTS患者。"},
    {type:"多项选择题",q:"100. 关于噻托溴铵干粉吸入剂的使用，下列说法正确的有",opts:["A.向上打开防尘帽，然后打开吸嘴，从包装中取出1粒胶囊，放入中央室内","B.合上吸嘴直至听到“咔嗒”声","C.手持吸入器使吸嘴向上，将刺孔按钮完全按下1次","D.将肺内空气尽量呼出，口唇含住吸嘴，缓慢深吸气，将药物吸入体内","E.吸入药物后必须用清水漱口5遍，去除上咽部残留的药物"],ans:"ABCDE",exp:"噻托溴铵干粉吸入剂（吸乐装置）的正确使用包括以上步骤，吸入药物后必须用清水漱口5遍。"}
  ]
},
  {
  name: "押题密卷（二）",
  questions: [
    // ===== 一、最佳选择题（1-40） =====
    {type:"最佳选择题",q:"1. 关于看似听似（LASA）药品管理，下列说法错误的是",opts:["A.医师录入医嘱时，应关注读音相似药品，建议在形成处方界面核对药品名称、剂型和规格","B.原则上禁止口头医嘱，若抢救时使用口头医嘱，LASA药品无特殊要求，无需复述","C.护士发药时应遵守“5R”原则，对LASA药品给药前尽量保留原包装或标识","D.药剂科摆放LASA药品应合理分存，补充药品时核对全称、商品名等规避混淆","E.药师调配LASA药品应执行“四查十对”、双人核对，发药时告知患者或陪护人员"],ans:"B",exp:"本题考查LASA药品管理。原则上禁止口头医嘱，如必须使用（例如抢救或手术时），医师应慢速、清楚地口述出药品的全称、商品名、剂型、剂量、给药途径等，对于LASA药品应特别注意，接受口头医嘱者应复述所听内容，得到确认后方可执行医嘱。"},
    {type:"最佳选择题",q:"2. 沟通是建立、维持并增进药师与患者专业性关系的途径。药师要明确交流的目的，能够把握谈话的主题与深度，开始交流时，多用开放性问题，下列属于开放性问题的是",opts:["A.您有过自行减量或者加量服用药物吗","B.您通常是怎样服用这些药物的","C.您服用过抗过敏药来治疗过敏反应吗","D.您可以演示一下您是怎么使用这个吸入器的吗","E.您是什么时间停止服用这个药的"],ans:"B",exp:"本题考查药师沟通技能。开始交流时，多用开放性问题，如“您目前在使用什么药物呢？”“您通常是怎样服用这些药物的？”等。在交流了开放性问题后或者对方总是偏离话题时，药师可以提一些有针对性的或只需回答“是与否”的封闭性问题来完善整个谈话内容。"},
    {type:"最佳选择题",q:"3. 患者，女，25岁，既往体健，近期有流感患者接触史，随后出现发热、头痛、肌痛、全身不适。查体：T39.2℃。该患者最可能出现的血象变化是",opts:["A.中性粒细胞增多","B.中性粒细胞减少","C.红细胞增多","D.嗜酸性粒细胞增多","E.嗜碱性粒细胞减少"],ans:"B",exp:"本题考查血常规检查数值增减的临床意义。该患者近期有流感患者接触史，出现的症状与流感症状相似，疑似感染流感病毒，中性粒细胞减少主要见于病毒感染。"},
    {type:"最佳选择题",q:"4. 患者，男，53岁，患有高胆固醇血症，服用阿托伐他汀治疗后，近日检查出现肝酶异常，停药一段时间后肝酶降低到正常范围内，排除其他因素影响，该不良反应与他汀类药物之间的因果关系应评价为",opts:["A.肯定","B.很可能","C.可能","D.可能无关","E.待评价"],ans:"B",exp:"本题考查药物不良反应因果关系评价。很可能：无重复用药史，余同“肯定”。该患者停药后肝酶恢复正常，但无再次用药史，故评价为很可能。"},
    {type:"最佳选择题",q:"5. 关于溺水处置措施，下列说法正确的是",opts:["A.胸外按压时，成人胸骨下陷应控制在至少6cm","B.人工呼吸采用仰头抬颏法开放气道时，无需清除口中异物","C.心肺复苏循环中，胸外按压和人工呼吸比例为20:2","D.5个心肺复苏循环后需重新判断脉搏及呼吸，评估时间5～10秒","E.糖皮质激素对溺水有明确治疗作用"],ans:"D",exp:"本题考查溺水的处置。胸外按压使胸骨下陷至少5cm（成人），但不超过6cm；如无颈部创伤，可采用仰头抬颏法开放气道，清除患者口中可见的异物和呕吐物；按压和呼吸比例为30:2；5个循环后重新判断脉搏及呼吸，评估时间5～10秒；糖皮质激素、外源性肺表面活性物质或巴比妥类药物对溺水无作用。"},
    {type:"最佳选择题",q:"6. 关于中毒后药物的拮抗解毒，下列属于物理性拮抗剂的是",opts:["A.二巯丙醇置换金属螯合物","B.弱酸中和强碱","C.药用炭吸附中毒物质","D.阿托品拮抗有机磷中毒症状","E.毛果芸香碱拮抗颠茄碱类中毒"],ans:"C",exp:"本题考查中毒后药物的拮抗解毒。物理性拮抗剂：如药用炭等可吸附中毒物质，鸡蛋清液可吸附砷、沉淀汞，牛乳可缓和硫酸铜、氯酸盐等化学物质的胃肠道刺激作用。"},
    {type:"最佳选择题",q:"7. 患者，女，45岁，近日因受凉出现腹部绞痛，可使用的药物是",opts:["A.氢溴酸山莨菪碱","B.加巴喷丁","C.塞来昔布","D.对乙酰氨基酚","E.佐米曲普坦"],ans:"A",exp:"本题考查疼痛的药物治疗。由于平滑肌痉挛引起的腹痛可用氢溴酸山莨菪碱，可明显缓解胃肠绞痛、胆道痉挛。"},
    {type:"最佳选择题",q:"8. 患者，男，23岁，近日出现发热、咳嗽、伴有鼻塞等症状，诊断为普通感冒。下列药物不宜使用的是",opts:["A.对乙酰氨基酚","B.布洛芬","C.伪麻黄碱","D.酚麻美敏","E.头孢呋辛"],ans:"E",exp:"本题考查普通感冒的治疗。抗菌药物的使用必须有明确指征，并且该类药物对成人和儿童的普通感冒无效，不宜使用。"},
    {type:"最佳选择题",q:"9. 下列关于烫伤，说法错误的是",opts:["A.对局部较小面积轻度烫伤，可在家中施治","B.对中等或大面积烫伤患者，镇痛镇静时轻伤员可口服止痛片或肌注哌替啶、吗啡等","C.烫伤后应立即脱去或剪开被热液浸湿的衣物","D.轻至中度烫伤可口服“烧伤饮料”或含盐饮料","E.伤员脱离事故现场后可用塑料布包扎或覆盖创面"],ans:"E",exp:"本题考查烫伤的用药指导与患者教育。伤员脱离事故现场后，应注意对其创面的保护，防止再次污染。可用纱布、三角巾或清洁被单、衣服等进行简单包扎。切忌用塑料布包扎或覆盖创面，因其不透气，可致使创面发生浸渍而加速感染。"},
    {type:"最佳选择题",q:"10. 患者，男，28岁，近期由于天气变化出现咳嗽、喘息等症状，持续2周仍未好转，遂前往医院就诊。诊断为急性支气管炎，疑似细菌感染，为明确诊断，可监测的实验室检查指标是",opts:["A.PCT","B.Hb","C.ALT","D.BUN","E.CK"],ans:"A",exp:"本题考查急性支气管炎的治疗。当急性支气管炎的诊断不确定时，检测降钙素原（PCT）有助于决定抗菌药物的使用。"},
    {type:"最佳选择题",q:"11. 患者，女，60岁，右侧胸背部出现带状分布水疱伴疼痛，确诊带状疱疹，发病48小时，既往肾功能正常，抗病毒治疗应首选的药物是",opts:["A.炉甘石洗剂","B.伐昔洛韦片","C.夫西地酸乳膏","D.甲钴胺片","E.布洛芬缓释胶囊"],ans:"B",exp:"本题考查带状疱疹的抗病毒治疗。目前临床使用抗病毒药物多选择伐昔洛韦、泛昔洛韦、膦甲酸钠氯化钠注射液、溴夫定等，治疗疗程7～10天。"},
    {type:"最佳选择题",q:"12. 患者，女，45岁，近3个月在咳嗽、打喷嚏时，会不自主出现尿液漏出情况，经诊断为轻至中度压力性尿失禁。该患者优先选择的治疗方式是",opts:["A.米拉贝隆治疗","B.手术治疗","C.盐酸米多君治疗","D.阴道局部雌激素治疗","E.盆底肌训练"],ans:"E",exp:"本题考查尿失禁的治疗。轻至中度的压力性尿失禁以非手术治疗为主，如盆底肌训练、生物反馈、辅助电刺激或电磁联合治疗。"},
    {type:"最佳选择题",q:"13. 患者，男，35岁，有冠心病病史，在过去3个月和妻子在房事过程中多次感到阴茎勃起困难，为不影响夫妻间未来几十年的生活，鼓足勇气前来医院就诊。医生开具药物后，提示若出现短暂的眩光、监视，有任何视觉障碍时，停药及时就诊，该药物可能是",opts:["A.伐地那非","B.非那雄胺","C.利多卡因","D.特拉唑嗪","E.曲马多"],ans:"A",exp:"本题考查勃起功能障碍的用药注意事项。西地那非、伐地那非可致视觉异常，主要表现为眩光、蓝视。这些不良反应通常是轻微、短暂的。发生任何视觉障碍时，首先建议患者停药，并去眼科就诊。"},
    {type:"最佳选择题",q:"14. 患者，男，62岁，有吸烟史40年，因受凉后出现咳嗽、咳痰伴呼吸困难入院，完善相关检查确诊为慢性阻塞性肺疾病，经治疗后症状好转拟出院，稳定期适宜使用的治疗方案是",opts:["A.长期吸入特布他林气雾剂","B.长期单独使用氟替卡松气雾剂","C.长期单独使用茶碱片","D.长期口服泼尼松片","E.长期规律吸入维兰特罗+格隆溴铵吸入剂"],ans:"E",exp:"本题考查慢性阻塞性肺疾病的治疗。LABA和LAMA优于短效药物。与单药治疗相比，LABA+LAMA联合治疗可显著提高FEV1，并减轻症状，还可显著减少急性加重。"},
    {type:"最佳选择题",q:"15. 关于稳定期慢阻肺患者支气管舒张剂的使用，说法错误的是",opts:["A.吸入支气管舒张剂是症状管理关键，推荐吸入而非口服","B.LABA和LAMA优于短效药物，且复方制剂常作为初始长效治疗首选","C.与单药治疗比，LABA+LAMA联合治疗能显著提高FEV1、减少急性加重","D.联合给药时，多个吸入装置治疗比单一吸入装置更简便有效","E.茶碱在稳定期慢阻肺患者中可发挥一定支气管舒张作用"],ans:"D",exp:"本题考查慢性阻塞性肺疾病的治疗。联合给药可以采用单一吸入装置或多个吸入装置治疗。单一吸入装置比多个吸入装置更加简便和有效。"},
    {type:"最佳选择题",q:"16. 患者，女，28岁，处于妊娠早期，同时患有哮喘，因喘息症状就诊，医生拟选用抗胆碱药物缓解症状，下列说法正确的是",opts:["A.可放心使用，抗胆碱药物对妊娠早期无影响","B.妊娠早期妇女应慎用抗胆碱药物","C.无需考虑患者妊娠情况，正常使用抗胆碱药物","D.同时使用β2受体激动剂与抗胆碱药物","E.联合使用糖皮质激素后可随意用抗胆碱药物"],ans:"B",exp:"本题考查哮喘的治疗。妊娠早期妇女、青光眼与前列腺增生的哮喘患者应慎用抗胆碱药物。"},
    {type:"最佳选择题",q:"17. 患者，女，32岁，哮喘急性发作，出现喘息、气急症状。缓解其轻至中度哮喘急性症状的首选药物是",opts:["A.布地奈德","B.泼尼松","C.孟鲁司特","D.沙美特罗","E.沙丁胺醇"],ans:"E",exp:"本题考查哮喘的治疗。短效β2受体激动药（SABA）能够迅速缓解支气管痉挛，通常在数分钟内起效，疗效可维持数小时，是缓解轻至中度哮喘急性症状的首选药物。"},
    {type:"最佳选择题",q:"18. 患者，男，42岁，青光眼病史11年。2年前因胸口痛、胸闷前来医院就诊，后诊断为稳定型心绞痛。针对该患者后续可能出现心绞痛急性发作时的紧急用药，不适宜选择的药物是",opts:["A.硝苯地平","B.伊伐布雷定","C.比索洛尔","D.曲美他嗪","E.硝酸甘油"],ans:"E",exp:"本题考查稳定型心绞痛的药物治疗。针对心绞痛急性发作，如患者有青光眼病史，禁用硝酸酯类药物，会加重病情，甚至诱发闭角型青光眼。"},
    {type:"最佳选择题",q:"19. 对不适合溶栓并经过严格筛选的缺血性脑卒中患者，特别是高纤维蛋白原血症者可选用的药物是",opts:["A.尿激酶","B.替奈普酶","C.阿替普酶","D.胰酶","E.巴曲酶"],ans:"E",exp:"本题考查缺血性脑卒中急性期的治疗。对不适合溶栓并经过严格筛选的缺血性脑卒中患者，特别是高纤维蛋白原血症者可选用降纤治疗。降纤药物包括降纤酶、巴曲酶、蚓激酶、蕲蛇酶等。"},
    {type:"最佳选择题",q:"20. 对于脑出血患者的药物治疗，说法错误的是",opts:["A.颅内压升高者，应卧床并适度抬高床头，必要时应给予甘露醇静脉滴注","B.当急性脑出血患者收缩压>220mmHg时，应积极使用静脉降压药物降低血压","C.“160/90mmHg”可作为参考的降压目标值，降压治疗期间每隔5～15分钟进行1次血压监测","D.可用于降低颅内压的药物有甘露醇、呋塞米、甘油果糖","E.确诊后应积极给予止血药"],ans:"E",exp:"本题考查脑出血的药物治疗。由于止血药物治疗脑出血临床疗效尚不确定，且可能增加血栓栓塞的风险，不推荐常规使用。"},
    {type:"最佳选择题",q:"21. 患者，女，67岁，出现认知功能障碍5年，诊断为阿尔茨海默病，可选用改善认知功能的药物不包括",opts:["A.美金刚","B.奥昔布宁","C.多奈哌齐","D.仑卡奈单抗","E.卡巴拉汀"],ans:"B",exp:"本题考查阿尔茨海默病的药物治疗。改善认知功能的药物有胆碱酯酶抑制剂（如多奈哌齐、卡巴拉汀、加兰他敏）、非竞争性N-甲基天门冬氨酸受体拮抗剂（美金刚）。阿尔茨海默病患者避免使用抗胆碱药物（如颠茄、苯海拉明、去氯羟嗪、奥昔布宁等）。"},
    {type:"最佳选择题",q:"22. 患者因使用SSRI类抗抑郁药疗效不佳，需换用MAOIs，其中氟西汀需停药多久才能换用MAOIs",opts:["A.1周","B.2周","C.3周","D.5周","E.6周"],ans:"D",exp:"本题考查抑郁症的用药注意事项与患者教育。应注意氟西汀需停药5周才能换用MAOIs；其他SSRIs需停药2周再换用。"},
    {type:"最佳选择题",q:"23. 关于抑郁症治疗及相关药物注意事项，说法错误的是",opts:["A.抑郁症治疗一般不主张联用两种以上抗抑郁药","B.抑郁症急性期治疗至少3个月，症状消失后巩固期治疗4-9个月","C.5-羟色胺综合征主要发生在SSRIs与单胺氧化酶抑制剂合用时","D.SSRI停药后可能出现戒断反应风险，氟西汀风险高于帕罗西汀","E.抗焦虑、抗抑郁药物引起嗜睡时，从事驾驶需谨慎"],ans:"D",exp:"本题考查抑郁症的用药注意事项与患者教育。SSRIs停药后出现戒断反应风险的顺序依次为：氟伏沙明和帕罗西汀>西酞普兰>舍曲林>氟西汀。氟西汀风险低于帕罗西汀。"},
    {type:"最佳选择题",q:"24. 可快速缓解胃溃疡患者的胃部不适症状，但对溃疡的愈合几乎无作用，通常与其他抑酸治疗方法同时应用的药物是",opts:["A.奥美拉唑","B.伏诺拉生","C.铝碳酸镁","D.巴柳氮","E.美沙拉秦"],ans:"C",exp:"本题考查胃溃疡的药物治疗。铝碳酸镁为外源性黏膜保护剂，可中和胃酸、降低胃蛋白酶活性和增强黏膜屏障作用，快速缓解溃疡患者的胃部不适症状，但对各处溃疡的愈合几乎无作用。"},
    {type:"最佳选择题",q:"25. 患者，男，52岁，因胃食管反流病（GERD）使用H2受体拮抗剂治疗，同时因其他疾病服用经CYP1A2代谢的药物。以下药物中，最可能因抑制肝药酶导致该代谢药物血药浓度升高的是",opts:["A.西咪替丁","B.雷尼替丁","C.法莫替丁","D.尼扎替丁","E.罗沙替丁"],ans:"A",exp:"本题考查胃食管反流病的药物治疗。西咪替丁抑制肝药酶的作用最强，不作为H2RA中优先选用的品种。西咪替丁可抑制CYP1A2、CYP2C9和CYP2D6等多种肝药酶，影响许多经这些酶代谢的药物并升高其血药浓度。"},
    {type:"最佳选择题",q:"26. 患者，女，56岁，诊断为胃食管反流病，经标准剂量PPI治疗后症状未缓解，合并食管裂孔疝，以下关于其PPI剂量调整及治疗的说法，错误的是",opts:["A.PPI剂量调整间隔至少为2周，直至症状控制","B.合并食管裂孔疝的GERD患者，PPI剂量通常需要加倍","C.单剂量PPI治疗无效时，可直接换用H2受体拮抗剂治疗","D.若出现夜间酸突破，优化对策为睡前给予H2RA","E.达到症状控制剂量后，需再治疗至少8周保证食管黏膜较高愈合率"],ans:"C",exp:"本题考查胃食管反流病的药物治疗。单剂量PPI治疗无效可改用双倍剂量；一种PPI无效可尝试换用另一种PPI，而非直接换用H2受体拮抗剂。"},
    {type:"最佳选择题",q:"27. 释放部位在结肠，分次口服，3～4次/d，属于5-ASA前体药物的是",opts:["A.美沙拉秦","B.柳氮磺吡啶","C.泼尼松","D.甲氨蝶呤","E.英夫利西单抗"],ans:"B",exp:"本题考查溃疡性结肠炎的治疗。5-ASA前体药物包括柳氮磺吡啶、巴柳氮、奥沙拉秦。"},
    {type:"最佳选择题",q:"28. 患者，女，66岁，身高156cm，体重61kg，空腹血糖7.8mmol/L，餐后血糖11.2mmol/L，糖化血红蛋白8.7%，诊断为2型糖尿病。经生活方式干预，未能有效控制血糖，肝肾功能未见异常，初始治疗首选的药物是",opts:["A.二甲双胍","B.吡格列酮","C.阿卡波糖","D.格列齐特","E.西格列汀"],ans:"A",exp:"本题考查2型糖尿病的药物治疗方案。如果单纯生活方式干预不能使血糖控制达标，应开始单药治疗。2型糖尿病首选且目前最常用的治疗药物是二甲双胍。"},
    {type:"最佳选择题",q:"29. 抑制骨破坏，能明显缓解骨痛，适宜伴骨痛的骨质疏松症患者的药物是",opts:["A.鲑降钙素","B.雷洛昔芬","C.特立帕肽","D.葡萄糖酸钙","E.阿仑膦酸钠"],ans:"A",exp:"本题考查原发性骨质疏松症的药物治疗。降钙素能抑制破骨细胞的生物活性、减少破骨细胞数量，从而减少骨量丢失并增加骨量；还能明显缓解骨痛，对骨质疏松症及骨折引起的骨痛有效。"},
    {type:"最佳选择题",q:"30. 患者，男，42岁，有痛风史，昨夜第一跖趾关节出现红、肿、热、痛症状，经对乙酰氨基酚治疗1周后缓解。为长期控制痛风症状，予以药物降尿酸治疗，用药可能引起皮肤过敏反应及肝、肾功能损伤，严重者可发生致死性剥脱性皮炎等超敏反应综合征的药物是",opts:["A.丙磺舒","B.别嘌醇","C.苯溴马隆","D.秋水仙碱","E.非布司他"],ans:"B",exp:"本题考查降尿酸治疗。别嘌醇可引起皮肤过敏反应及肝、肾功能损伤，严重者可发生致死性剥脱性皮炎等超敏反应综合征。"},
    {type:"最佳选择题",q:"31. 患者，女，55岁，因2型糖尿病接受药物治疗，医生考虑使用促胰岛素分泌多肽/胰高血糖素样肽-1受体激动剂，以下属于该类药物且需每周1次给药的是",opts:["A.替尔泊肽","B.二甲双胍","C.胰岛素","D.格列美脲","E.阿卡波糖"],ans:"A",exp:"本题考查糖尿病的治疗药物。替尔泊肽属于促胰岛素分泌多肽/胰高血糖素样肽-1受体激动剂，且给药频率为每周1次。"},
    {type:"最佳选择题",q:"32. 患者，女，38岁，诊断为2型糖尿病，同时合并超重（BMI 28.5kg/m²），希望在降糖同时能辅助减轻体重。以下降糖药物中，兼具减重效果，可优先考虑选用的是",opts:["A.瑞格列奈","B.格列美脲","C.甘精胰岛素","D.达格列净","E.伏格列波糖"],ans:"D",exp:"本题考查糖尿病的治疗药物。如果患者需要降低体重，则选择具有减重效果的降糖药物（SGLT-2i或GLP-1受体激动剂）。达格列净属于SGLT-2i。"},
    {type:"最佳选择题",q:"33. 患者，男，76岁，有高血压病史，因近来排尿困难，尿分叉前往医院，医生诊断为前列腺增生症。使用药物治疗后出现性功能减退、射精障碍、瘙痒、皮疹、乳腺增大。考虑此现象与下列哪种药物有关",opts:["A.奥昔布宁","B.米拉贝隆","C.非那雄胺","D.特拉唑嗪","E.普适泰"],ans:"C",exp:"本题考查前列腺增生症的药物治疗。5α还原酶抑制剂，爱普列特、非那雄胺、度他雄胺的主要不良反应为性功能减退、射精障碍、瘙痒、皮疹、乳腺增大。"},
    {type:"最佳选择题",q:"34. 患者，男，67岁，eGFR<15ml/(min·1.73m²)需进行透析治疗。出现高磷血症，医生处方用药包括碳酸钙片，每日3次，建议患者的最佳服药时间是",opts:["A.空腹","B.清晨、睡前","C.餐中","D.餐后1小时","E.任何固定时间"],ans:"C",exp:"本题考查磷结合剂的服药时间。透析治疗时碳酸钙作为口服磷结合剂进行降磷治疗必须餐中服用，否则无效。"},
    {type:"最佳选择题",q:"35. 伴发膀胱过度活动症的前列腺增生患者，应用治疗药物索利那新，该药主要的不良反应是",opts:["A.便秘","B.体位性低血压","C.齿龈增生","D.心动过缓","E.性功能减退"],ans:"A",exp:"本题考查前列腺增生症的药物治疗。M受体拮抗剂如奥昔布宁、索利那新、托特罗定的不良反应有口干、尿潴留、便秘等。"},
    {type:"最佳选择题",q:"36. 患者，女，45岁，半年前出现关节晨僵、手关节及膝关节疼痛，诊断为类风湿关节炎。当类风湿关节炎确诊后，可选的白介素-6拮抗剂是",opts:["A.沙利鲁单抗","B.甲氨蝶呤","C.阿那白滞素","D.柳氮磺吡啶","E.环孢素"],ans:"A",exp:"本题考查类风湿关节炎的治疗药物。白介素-6（IL-6）拮抗剂包括托珠单抗和沙利鲁单抗。"},
    {type:"最佳选择题",q:"37. 患者，女，32岁，确诊为重症系统性红斑狼疮（SLE），目前病情处于重症阶段，能够靶向结合CD20，导致B细胞凋亡的治疗药物是",opts:["A.贝利尤单抗","B.硫唑嘌呤","C.利妥昔单抗","D.羟氯喹","E.环磷酰胺"],ans:"C",exp:"本题考查系统性红斑狼疮的治疗药物。利妥昔单抗为人鼠嵌合抗CD20单克隆抗体，能靶向结合CD20导致B细胞凋亡，可用于难治性、复发性或重症SLE。"},
    {type:"最佳选择题",q:"38. 肿瘤的二级预防强调早期发现、诊断和治疗，以下属于肿瘤二级预防的是",opts:["A.倡导健康饮食，减少红肉摄入预防肿瘤","B.为适龄女性接种HPV疫苗预防宫颈癌","C.对肺癌高危人群进行低剂量CT定期筛查","D.开展肿瘤患者康复期心理支持活动","E.在工厂作业区安装净化设备减少职业暴露"],ans:"C",exp:"本题考查肿瘤的预防。对肺癌高危人群用低剂量CT定期筛查，属于二级预防的早期筛检。"},
    {type:"最佳选择题",q:"39. 为预防异环磷酰胺引起的出血性膀胱炎，可在环磷酰胺给药后0小时、4小时、8小时静脉滴注的药物是",opts:["A.甲氧氯普胺","B.洛哌丁胺","C.右雷佐生","D.昂丹司琼","E.美司钠"],ans:"E",exp:"本题考查抗肿瘤药物的典型不良反应及处理。环磷酰胺和异环磷酰胺可引起出血性膀胱炎，治疗时需同步给予美司钠。"},
    {type:"最佳选择题",q:"40. 化疗前血常规检查患者白细胞计数<2.0×10⁹/L或粒细胞计数<1.0×10⁹/L可给予",opts:["A.促红细胞生成素","B.促血小板生成素","C.人粒细胞巨噬细胞刺激因子（GM-CSF）","D.干扰素-α","E.肿瘤坏死因子-α"],ans:"C",exp:"本题考查抗肿瘤药物的典型不良反应及处理。当白细胞计数下降至<2.0×10⁹/L或粒细胞<1.0×10⁹/L时，应使用人粒细胞刺激因子（G-CSF）或人粒细胞巨噬细胞刺激因子（GM-CSF）治疗。"},

    {type:"配伍选择题",subs:[
      {q:"41. 需在不超过25℃处贮存，因温度高易变软的常用药品是",opts:["A.复方角菜酸酯栓","B.头孢地尼","C.乳酶生片","D.门冬酰胺酶","E.静注人免疫球蛋白"],ans:"A",exp:"栓剂硬度受气温影响大，温度高易变软，应放置在温度不超过25℃处。"},

    {type:"配伍选择题",subs:[

      {q:"45. 患者，男，55岁，因肺部感染需静脉给药治疗，处方为“注射用头孢曲松钠2g iv qd”，其中外文缩写“iv”的中文含义是",opts:["A.静脉注射","B.皮下注射","C.生理盐水","D.标记（标明用法）","E.必要时（长期备用）"],ans:"A",exp:"“iv”的中文含义是静脉注射。"}

    {type:"配伍选择题",subs:[
      {q:"46. 患者，男，35岁，诊断为轻度社区获得性肺炎，选用抗菌药物治疗时，开具处方的医师应具备的最低资格是",opts:["A.初级职称医师","B.中级及以上职称医师","C.高级职称医师（经培训考核）","D.初级职称药师","E.高级护师"],ans:"A",exp:"轻度/局部感染用药，属于非限制使用级，初级职称医师、基层执业助理医师及乡村医生具有资格。"},
      {q:"47. 患者，女，60岁，因严重感染伴免疫低下，病原菌仅对特殊使用级抗菌药物敏感，需选用特殊使用级抗菌药物治疗，且需用价格昂贵的新药，开具处方的医师应具备的最低资格是",opts:["A.初级职称医师","B.中级及以上职称医师","C.高级职称医师（经培训考核）","D.初级职称药师","E.高级护师"],ans:"C",exp:"严重感染、免疫低下者、病原菌只对限制使用级或特殊使用级抗菌药物敏感时使用。特殊使用级抗菌药物，高级职称医师（经培训考核）具有资格。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"48. 在哺乳期用药安全性分级中，属于L1级的药物是",opts:["A.青霉素","B.厄他培南","C.利巴韦林","D.阿奇霉素","E.金刚烷胺"],ans:"A",exp:"青霉素属于L1级。"},
      {q:"49. 在哺乳期用药安全性分级中，属于L4级的药物是",opts:["A.青霉素","B.厄他培南","C.利巴韦林","D.阿奇霉素","E.金刚烷胺"],ans:"C",exp:"利巴韦林属于L4级。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"50. 可导致胎儿肢体、耳、内脏畸形的药物是",opts:["A.沙利度胺","B.雄激素","C.叶酸拮抗剂","D.氨茶类烷化剂","E.叶酸"],ans:"A",exp:"沙利度胺可引起胎儿肢体、耳、内脏畸形。"},
      {q:"51. 能引起胎儿性发育异常的药物是",opts:["A.沙利度胺","B.雄激素","C.叶酸拮抗剂","D.氨茶类烷化剂","E.叶酸"],ans:"B",exp:"雌激素、孕激素、雄激素可引起胎儿性发育异常。"},
      {q:"52. 可造成颅面部畸形、腭裂的药物是",opts:["A.沙利度胺","B.雄激素","C.叶酸拮抗剂","D.氨茶类烷化剂","E.叶酸"],ans:"C",exp:"叶酸拮抗剂可导致颅面部畸形、腭裂。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"53. 患者因职业暴露接触铅尘发生铅中毒，应选用的特异性解毒剂是",opts:["A.谷胱甘肽","B.依地酸钙钠","C.阿托品","D.烯丙吗啡","E.氟马西尼"],ans:"B",exp:"依地酸钙钠用于铅中毒。"},
      {q:"54. 患者因吸入一氧化碳中毒，适用的解毒药物是",opts:["A.谷胱甘肽","B.依地酸钙钠","C.阿托品","D.烯丙吗啡","E.氟马西尼"],ans:"A",exp:"谷胱甘肽用于氟化物、一氧化碳、重金属等中毒。"},

    ]},
    {type:"配伍选择题",subs:[
      {q:"56. 患者，男，36岁，因食用油炸食物过多，腹泻且粪便中带有油滴，经检查为胆汁分泌不足，可使用的药物是",opts:["A.多潘立酮","B.维生素B6","C.铝碳酸镁","D.胃蛋白酶","E.复方阿嗪米特"],ans:"E",exp:"胆汁分泌不足者：复方阿嗪米特肠溶片1～2片，1日3次，餐后用药。"},
      {q:"57. 患者，女，40岁，因消化不良出现上腹饱胀、嗳气伴恶心、呕吐，建议使用的药物是",opts:["A.多潘立酮","B.维生素B6","C.铝碳酸镁","D.胃蛋白酶","E.复方阿嗪米特"],ans:"A",exp:"当功能性消化不良患者出现恶心和呕吐时，建议使用多潘立酮进行治疗。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"58. 某缺铁性贫血并伴有慢性腹泻的患者，经实验室检查Hb 58g/L，首选的治疗药物是",opts:["A.硫酸亚铁","B.琥珀酸亚铁","C.羧基麦芽糖铁","D.维生素B12","E.维生素C"],ans:"C",exp:"Hb 58g/L即重度贫血，且该患者伴有慢性腹泻，应给予注射铁剂，如第三代铁剂羧基麦芽糖铁、异麦芽糖酐铁等。"},
      {q:"59. 口服铁剂中的标准制剂，是一种无机铁剂，胃肠道不良反应最明显，主要表现为腹痛、恶心、呕吐或便秘的药物是",opts:["A.硫酸亚铁","B.琥珀酸亚铁","C.羧基麦芽糖铁","D.维生素B12","E.维生素C"],ans:"A",exp:"硫酸亚铁是口服铁剂中的标准制剂，是一种无机铁剂，胃肠道不良反应最明显。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"60. 可用于多囊卵巢综合征的女性提高胰岛素敏感性，还具有改善血脂代谢、抗炎等作用的药物是",opts:["A.罗格列酮","B.司美格鲁肽","C.短效复方口服避孕药","D.螺内酯","E.地塞米松"],ans:"A",exp:"噻唑烷二酮类胰岛素增敏剂不仅能提高胰岛素敏感性，还具有改善血脂代谢、抗炎、保护血管内皮细胞功能等作用，常见药物如吡格列酮、罗格列酮。"},
      {q:"61. 可用于多囊卵巢综合征合并严重肥胖的女性，皮下注射治疗可以减重的药物是",opts:["A.罗格列酮","B.司美格鲁肽","C.短效复方口服避孕药","D.螺内酯","E.地塞米松"],ans:"B",exp:"减肥药物：奥利司他口服，减少脂肪吸收。还可考虑使用GLP-1受体激动剂，如利拉鲁肽、度拉糖肽和司美格鲁肽等药物来减轻BMI较高的成年PCOS患者体重。"},
      {q:"62. 可用于多囊卵巢综合征缓解高雄激素表型（多毛症、痤疮和男性样脱发）的首选药物是",opts:["A.罗格列酮","B.司美格鲁肽","C.短效复方口服避孕药","D.螺内酯","E.地塞米松"],ans:"C",exp:"缓解高雄激素表型是治疗的主要目的。短效复方口服避孕药（COC），建议作为青春期和育龄期PCOS女性高雄激素血症及多毛症、痤疮的首选治疗药物。"}
    ]},
    {type:"配伍选择题",subs:[

  questions: [
    // ===== 一、最佳选择题（1-40） =====
    {type:"最佳选择题",q:"1. 切忌直接静脉注射，应于临用前稀释，否则不仅引起剧痛，且致心脏停搏。静脉滴注的浓度不宜过高，一般不宜超过0.2%～0.4%的药物是",opts:["A.氯化钠注射液","B.葡萄糖注射液","C.硫酸镁注射液","D.氯化钾注射液","E.茶碱注射液"],ans:"D",exp:"本题考查护士用药咨询。氯化钾注射液切忌直接静脉注射，应于临用前稀释，否则不仅引起剧痛，且致心脏停搏。静脉滴注的浓度不宜过高，一般不宜超过0.2%～0.4%，心律失常可用0.6%～0.7%。"},
    {type:"最佳选择题",q:"2. 患者，男，72岁，拟行右膝人工关节置换术，术前发现有耐甲氧西林金黄色葡萄球菌定植的可能，围手术期适宜选择的抗菌药物是",opts:["A.阿奇霉素","B.头孢唑林","C.头孢他啶","D.氨曲南","E.万古霉素"],ans:"E",exp:"本题考查围手术期抗菌药物的预防性应用原则。对某些手术部位感染会引起严重后果者，如人工心脏瓣膜置换术、人工关节置换术等，若术前发现有MRSA定植的可能或者该医疗机构MRSA发生率高，可选用万古霉素、去甲万古霉素预防感染。"},
    {type:"最佳选择题",q:"3. 患者，女，25岁，婚后1年，平时月经周期是30天，现发现月经已推迟10天，经检查后得知已妊娠，患者自述20日前曾应用复方感冒灵。在此阶段，药物对胎儿的影响是",opts:["A.产生形态或功能上的异常","B.中枢神经系统发育受影响","C.死亡、流产或发育成正常个体","D.心脏及胃肠发育受影响","E.骨骼及肌肉发育受影响"],ans:"C",exp:"本题考查药物对妊娠期不同阶段胎儿的影响。细胞增殖早期为受精后18天左右，此阶段期间胚胎的所有细胞尚未进行分化，对药物无选择性表现，致畸作用无特异性地影响细胞，其结果为胚胎死亡、流产或存活而发育成正常个体。"},
    {type:"最佳选择题",q:"4. 患者，男，50岁，因原发性高血压长期服用美托洛尔，血压维持良好，病情稳定。近日因自觉症状好转，患者自行突然停药。停药2天后，患者出现血压反跳性升高，并伴有出汗、头痛等症状，遂急诊就医。此现象属于哪种类型的药源性疾病",opts:["A.C型药源性疾病","B.A型药源性疾病","C.E型药源性疾病","D.B型药源性疾病","E.D型药源性疾病"],ans:"A",exp:"本题考查药源性疾病分类。C型是由长期用药引起的药源性疾病，还包括停药反应。如长期使用β受体拮抗剂患者突然停药引起药源性高血压。"},
    {type:"最佳选择题",q:"5. 患者，女，52岁，近日因头晕、眼花、乏力就诊，Hb 87g/L，诊断为缺铁性贫血。按医嘱服用硫酸亚铁，服药后患者出现恶心、呕吐、排黑便的情况，已排除其他疾病因素。停用硫酸亚铁后症状消失。数日后改用右旋糖酐铁，再次出现恶心、呕吐、排黑便的症状。患者出现的胃肠道不良反应与铁剂之间的因果关系应评价为",opts:["A.肯定","B.很可能","C.可能","D.可能无关","E.无法评价"],ans:"A",exp:"本题考查药品不良反应因果关系评价结果。肯定：用药及反应发生时间顺序合理；停药以后反应停止；再次使用，反应再现；有文献资料佐证；排除原患疾病等其他混杂因素影响。该患者服用铁剂后出现胃肠道不良反应，停药后症状消失，再次用此类药物后反应复现，可判断为肯定。"},
    {type:"最佳选择题",q:"6. 患者，男，22岁，业余篮球运动员，在比赛跳跃落地时不慎右踝关节内翻扭伤。伤后立即出现剧烈疼痛、局部明显肿胀，无法站立或负重。体格检查可见踝关节外侧淤青、压痛明显，活动受限，但无开放性伤口或骨折征象。作为现场急救人员，处理措施错误的是",opts:["A.立即进行热敷促进血液循环","B.使用弹性绷带加压包扎","C.抬高患肢减少肿胀","D.局部冰敷15～20分钟","E.避免患肢活动"],ans:"A",exp:"本题考查扭伤的处置。在受伤后的初期，采取“RICE”原则（休息、冷敷、压迫、抬高）可以有效减轻肿胀和疼痛。早期热敷会加重肿胀。"},
    {type:"最佳选择题",q:"7. 患者，男，28岁，有抑郁症病史，摄入大量酒精后出现昏迷被紧急送医，可使用的解救药物是",opts:["A.美西律","B.氟马西尼","C.纳洛酮","D.美托洛尔","E.乙酰胺"],ans:"C",exp:"本题考查中毒解救。纳洛酮是阿片样物质的特异性拮抗剂，能解除酒精中毒引起的中枢神经系统抑制，并能促进乙醇在体内转化，缩短昏迷时间，有催醒作用。"},
    {type:"最佳选择题",q:"8. 对口腔黏膜有麻醉作用，产生麻木感觉，服药时需整片吞服，不可嚼碎的镇咳药是",opts:["A.愈创甘油醚","B.氨溴索","C.羧甲司坦","D.苯丙哌林","E.氨溴特罗"],ans:"D",exp:"本题考查镇咳药的用药指导。苯丙哌林对口腔黏膜有麻醉作用，产生麻木感觉，服药时需整片吞服，不可嚼碎。"},
    {type:"最佳选择题",q:"9. 患者，女，25岁，因扁桃体发炎出现扁桃体充血、肿大，同时还伴有咳嗽、声音嘶哑和流鼻涕等卡他症状，青霉素皮试(+)。该患者宜使用的治疗方案是",opts:["A.青霉素V钾250mg qid po，10天","B.阿莫西林500mg bid po，10天","C.头孢呋辛酯500mg bid po，10天","D.阿奇霉素500mg qd po，疗程3天","E.克林霉素300mg tid po，疗程5～7天"],ans:"E",exp:"本题考查急性扁桃体炎的治疗。青霉素过敏者的备选方案：①阿奇霉素500mg qd po，疗程3天；②克林霉素300mg tid po，疗程5～7天。"},
    {type:"最佳选择题",q:"10. 患者，女，35岁，感冒后发热、头痛、全身肌肉酸痛，服用对乙酰氨基酚缓解症状。根据对乙酰氨基酚的用药安全，成人服用对乙酰氨基酚用于退热和镇痛的一日安全剂量分别不宜超过",opts:["A.0.3g，0.6g","B.4.0g，2.0g","C.2.0g，4.0g","D.2.0g，2.0g","E.5.0g，7.0g"],ans:"D",exp:"本题考查发热的治疗。成人服用对乙酰氨基酚用于退热时，一日安全剂量不宜超过2g；用于镇痛时，建议每日不宜超过2g的安全剂量范围。"},
    {type:"最佳选择题",q:"11. 患者，女，29岁，因月经量多、头晕、乏力就诊，化验结果为Hb 71g/L，诊断为缺铁性贫血，患者同时伴有慢性腹泻，医生开具右旋糖酐铁治疗。该药适宜的给药方式是",opts:["A.恒速静脉滴注","B.快速静脉注射","C.口服，每次300mg，一日3次","D.先少量缓慢静脉滴注，观察无过敏反应后，再继续静脉滴注余下剂量","E.先静脉注射负荷剂量，再静脉滴注余下剂量"],ans:"D",exp:"本题考查缺铁性贫血的治疗。该患者伴有慢性腹泻，宜静脉补铁，首次用药前先给予试验剂量，同时应预备治疗过敏反应的应急措施，若1小时内无过敏反应再给予足量治疗。"},
    {type:"最佳选择题",q:"12. 患者，女，68岁，既往有心律失常（QT间期延长）、青霉素过敏史。因受凉后咳嗽、咳黄脓痰，伴发热3天入院。查体：体温39.3℃，血压142/88mmHg，心率102次/分，左肺可闻及湿性啰音。化验结果：白细胞计数14.2×10⁹/L，中性粒细胞百分比85%。胸部X线：左肺下叶渗出影。该患者经验性抗感染适宜选用的药物是",opts:["A.阿奇霉素","B.阿莫西林","C.莫西沙星","D.多西环素","E.头孢曲松"],ans:"E",exp:"本题考查社区获得性肺炎经验性抗感染治疗。该患者有青霉素过敏史避免使用阿莫西林，有QT间期延长史避免使用阿奇霉素、莫西沙星。头孢曲松为第三代头孢菌素，与青霉素的交叉过敏发生率较低，可谨慎选择。"},
    {type:"最佳选择题",q:"13. 下列关于退热药物的说法中，正确的是",opts:["A.布洛芬可能引起胎儿动脉导管早闭、胎儿心脏缺陷及唇腭裂等，不可用于妊娠期和哺乳期","B.布洛芬等非选择性非甾体抗炎药的各种制剂均应在餐后服药","C.对乙酰氨基酚安全性高，无明确致畸性，可在正常剂量范围内长期用于妊娠期","D.高血压、心力衰竭的患者禁止使用布洛芬","E.解热镇痛药用于解热一般不宜超过3天"],ans:"E",exp:"本题考查发热的治疗。解热镇痛药用于退热一般不超过3天，如症状未缓解应及时就医，不得自行长期服用。布洛芬进入乳汁的浓度很低，可安全用于哺乳期。对乙酰氨基酚可在正常剂量范围内短期使用于妊娠期。有高血压、心力衰竭的患者，如必须使用布洛芬，应短期低剂量服用，并密切监测血压和心功能。"},
    {type:"最佳选择题",q:"14. 患者，男，57岁，季节性过敏性鼻炎病史5年，3天前受凉后出现流涕、鼻塞、咳嗽、咳痰、低热、头痛等不适症状，在医院发热门诊完成了鼻拭子检查，排除了甲型流感和乙型流感，诊断为普通感冒。关于该患者的治疗，下列说法正确的是",opts:["A.起病24小时内不宜含服锌含片","B.对乙酰氨基酚宜长期用于普通感冒的发热","C.若痰多而黏稠，首选右美沙芬","D.若使用含右美沙芬的复方制剂，需告知服药期间应避免驾驶","E.为更有效地缓解咳嗽，应尽早使用抗菌药物治疗"],ans:"D",exp:"本题考查感冒的治疗。右美沙芬可引起嗜睡，服药期间应避免驾驶。锌含片推荐用于普通感冒治疗。对乙酰氨基酚和非甾体抗炎药建议短期用于普通感冒的发热及疼痛。若痰多而黏稠，不宜使用右美沙芬。抗菌药物对普通感冒无效。"},
    {type:"最佳选择题",q:"15. 流行性感冒是由流感病毒引起的急性呼吸道传染病，其传播速度快、季节性流行特征明显，可导致严重的公共卫生负担。为降低流感感染风险及并发症发生率，科学预防尤为重要。下列关于流感的预防措施，说法正确的是",opts:["A.药物预防可以代替疫苗接种","B.通常接种流感疫苗1周后，可产生具有保护水平的抗体","C.为保证受种者在流感高发季节前获得免疫保护，最好在10月底前完成免疫接种","D.所有无禁忌证的人群均可接种流感疫苗","E.在母乳喂养期，母亲接种流感疫苗对母亲和婴儿都是不安全的"],ans:"C",exp:"本题考查流感的预防。药物预防不能代替疫苗接种。通常接种流感疫苗2～4周后，可产生具有保护水平的抗体，6～8个月后抗体滴度开始衰减。对于≥6月龄且无禁忌证的人群均可接种流感疫苗。在母乳喂养期，母亲接种流感疫苗对母亲和婴儿都是安全的。为保证受种者在流感高发季节前获得免疫保护，最好在10月底前完成免疫接种。"},
    {type:"最佳选择题",q:"16. 当临床考虑急性支气管炎患者患有流感或百日咳时，应立即采取的措施是",opts:["A.使用阿比多尔治疗流感、阿莫西林治疗百日咳","B.使用金刚烷胺治疗流感、阿奇霉素治疗百日咳","C.使用扎那米韦治疗流感、阿莫西林治疗百日咳","D.使用奥利司他治疗流感、阿奇霉素治疗百日咳","E.使用玛巴洛沙韦治疗流感、复方磺胺甲噁唑治疗百日咳"],ans:"E",exp:"本题考查急性支气管炎的治疗。当临床考虑患有流感或百日咳时，应立即使用神经氨酸酶抑制剂（如奥司他韦、扎那米韦）或玛巴洛沙韦治疗流感，大环内酯类药物（如阿奇霉素）或复方磺胺甲噁唑治疗百日咳，同时患者还需要隔离5天。"},
    {type:"最佳选择题",q:"17. 用于胆石症的非手术治疗，属于钙通道阻滞剂，不可掰开嚼碎，避免卧位服用的药物是",opts:["A.熊去氧胆酸片","B.鹅去氧胆酸片","C.匹维溴铵片","D.山莨菪碱片","E.消炎利胆片"],ans:"C",exp:"本题考查胆石症与胆囊炎的治疗。匹维溴铵为一种对胃肠道平滑肌有高度选择性解痉作用的钙通道阻滞剂，阻断Ca²⁺进入肠壁平滑肌细胞而达到解痉作用，进餐时需整片吞服，不可咀嚼或掰碎，不宜卧位或睡前服用。"},
    {type:"最佳选择题",q:"18. 关于腹泻的药物治疗，说法错误的是",opts:["A.急性细菌性腹泻患者，可使用盐酸小檗碱或抗生素","B.宜使用口服补液盐预防和纠正脱水","C.有严重腹痛的炎性或血性腹泻患者，应加用洛哌丁胺","D.宜使用蒙脱石散吸附毒素，增强黏液屏障功能","E.益生菌应避免与蒙脱石散同时服用"],ans:"C",exp:"本题考查腹泻的治疗。洛哌丁胺应避免用于伴发热或明显腹痛等疑似炎性腹泻以及血性腹泻的患者。"},
    {type:"最佳选择题",q:"19. 患者，女，30岁，因外阴瘙痒、分泌物增多伴鱼腥臭味就诊，诊断为细菌性阴道炎，可考虑使用的药物不包括",opts:["A.替硝唑片","B.甲硝唑阴道栓","C.克林霉素胶囊","D.克霉唑栓","E.甲硝唑片"],ans:"D",exp:"本题考查细菌性阴道炎的治疗。克霉唑栓属于抗真菌药，用于外阴阴道假丝酵母菌病的治疗。"},
    {type:"最佳选择题",q:"20. 患者，女，28岁，处于哺乳期，近期患上乳腺炎。局部皮肤红肿但无皮损，自觉疼痛并伴有发热症状，由于一些特殊原因，无法继续母乳喂养。可以选择具有回乳作用的药物是",opts:["A.对乙酰氨基酚","B.己烯雌酚","C.25%硫酸镁","D.甲硝唑","E.头孢美唑"],ans:"B",exp:"本题考查哺乳期乳腺炎的治疗。无法或不宜继续母乳喂养的患者，应给予回乳处理，可以口服己烯雌酚，或肌内注射苯甲酸雌二醇，也可以口服中药，如炒麦芽。"},
    {type:"最佳选择题",q:"21. 患者，男，25岁，支气管哮喘，长期使用ICS+LABA维持治疗，近几个月哮喘症状得到控制且肺功能稳定，可考虑的药物减量方案中，说法正确的是",opts:["A.先减少ICS使用次数，再减少激素用量","B.先停止使用LABA，再减少激素用量","C.先停止使用LABA，再加大ICS剂量","D.先减少激素用量，再减少使用次数，以最低剂量的LABA维持治疗","E.先减少激素用量，再减少使用次数，以最低剂量的ICS维持治疗"],ans:"E",exp:"本题考查哮喘的降级治疗。推荐的药物减量方案：通常是首先减少糖皮质激素用量（口服或吸入），再减少使用次数（如每日2次减至每日1次），然后再减去与激素合用的控制药物，以最低剂量ICS维持，直到最终停止治疗。"},
    {type:"最佳选择题",q:"22. 患者，男，45岁，冠状动脉粥样硬化性心脏病史8年，下列检查指标与该疾病的关联度最高的是",opts:["A.LDL-C","B.Hb","C.AMY","D.ALT","E.BUN"],ans:"A",exp:"本题考查冠心病的检查指标。LDL-C为低密度脂蛋白胆固醇，是动脉粥样硬化的主要致病因子，与冠心病的发生率呈正相关。"},
    {type:"最佳选择题",q:"23. 患者，女，56岁，高血压、冠心病，长期服用硝酸异山梨酯、瑞舒伐他汀、阿司匹林、培哚普利等药物。该患者服用的药物中，需提醒患者每日保证8～12小时无药或低药浓度的药物是",opts:["A.美托洛尔","B.培哚普利","C.阿司匹林","D.瑞舒伐他汀","E.硝酸异山梨酯"],ans:"E",exp:"本题考查冠心病的治疗。长期使用硝酸酯类药物应该采用偏心给药的方法，保证每天8～12小时的无硝酸酯或低硝酸酯浓度时间。"},
    {type:"最佳选择题",q:"24. 患者，男，65岁，突发左侧肢体无力，言语不清。有高血压病史5年，无特殊服药史。有吸烟史40年，每年50包。起病1小时30分钟入急诊科，无头痛、呕吐。查体：BP 176/98mmHg，P 76次/分，律齐。神经系统检查：构音障碍，左侧同向性偏盲，左侧肢体重度无力、浅触觉消失。入院诊断：急性缺血性脑卒中。针对患者的情况，目前最主要恢复脑血流的措施是",opts:["A.注射用阿替普酶0.4mg/kg iv.gtt","B.氯吡格雷片75mg qd po","C.阿司匹林肠溶片100mg qd po","D.阿司匹林肠溶片300mg st po","E.注射用阿替普酶0.9mg/kg iv.gtt"],ans:"E",exp:"本题考查缺血性脑卒中的治疗。静脉溶栓是目前最主要恢复脑血流的措施。阿替普酶0.9mg/kg（最大剂量为90mg）静脉滴注，其中10%在最初1分钟内静脉推注，其余持续滴注1小时。"},
    {type:"最佳选择题",q:"25. 患者，女，30岁，因反复发作性意识丧失伴肢体抽搐1年就诊，发作时表现为突然愣神、动作停止、双眼凝视，持续约30秒后自行缓解，发作后对过程无记忆，每月发作2～3次，无全身强直-阵挛发作，诊断为部分性发作癫痫。患者目前处于备孕期，可酌情选用的抗癫痫药物是",opts:["A.苯巴比妥","B.苯妥英钠","C.丙戊酸钠","D.拉莫三嗪","E.卡马西平"],ans:"D",exp:"本题考查癫痫的治疗。育龄期妇女酌情选用奥卡西平、拉莫三嗪、左乙拉西坦治疗癫痫；孕前3个月和孕初3个月每日加用叶酸2.5～5mg。"},
    {type:"最佳选择题",q:"26. 患者，女，69岁，近1个月因家庭琐事出现入睡困难，白天有头昏、疲倦等不适感，尝试非药物治疗无改善，进行药物治疗时由于不良反应原因，不推荐患者使用的药物是",opts:["A.唑吡坦","B.佐匹克隆","C.咪达唑仑","D.扎来普隆","E.阿戈美拉汀"],ans:"C",exp:"本题考查抗失眠药物的合理应用。老年失眠患者首选非药物治疗手段，而药物治疗推荐使用非苯二氮䓬类药物如唑吡坦、佐匹克隆、右佐匹克隆和扎来普隆或褪黑素受体激动剂如阿戈美拉汀。咪达唑仑属于苯二氮䓬类药物，主要的不良反应为嗜睡、头昏、乏力等，长期用药有成瘾性。"},
    {type:"最佳选择题",q:"27. 患者，男，63岁，诊断为抑郁症，使用药物后出现心前区不适，心电图结果显示QT间期延长，考虑与药物有关。可导致心电图QT间期延长的抗抑郁药是",opts:["A.米氮平","B.艾司唑仑","C.普萘洛尔","D.吗氯贝胺","E.氟哌噻吨美利曲辛"],ans:"E",exp:"本题考查抗抑郁药的不良反应。氟哌噻吨美利曲辛可导致心电图QT间期延长，不推荐用于心肌梗死的恢复早期、各种程度的心脏传导阻滞或心律失常及冠状动脉缺血患者。"},
    {type:"最佳选择题",q:"28. 患者，男，72岁，患有阿尔茨海默病，给予卡巴拉汀每日3mg治疗。药师对该患者的用药指导，正确的是",opts:["A.每晚睡前口服","B.每日清晨空腹口服","C.每日两次餐前服用","D.每日早晚空腹口服","E.每日早晚与食物同服"],ans:"E",exp:"本题考查痴呆的患者与照料者教育。卡巴拉汀需要于早晨和晚上与食物同服，用药前检查心电图，注意血压和心律/率。"},
    {type:"最佳选择题",q:"29. 患者，男，32岁。由于长期进餐不规律，近期出现空腹时胃痛难忍，自行服用非甾体抗炎药后无缓解，遂来医院就诊，诊断为十二指肠溃疡，Hp(+)。该患者适宜选择的治疗药物不包括",opts:["A.泮托拉唑","B.克林霉素","C.阿莫西林","D.枸橼酸铋钾","E.米索前列醇"],ans:"B",exp:"本题考查十二指肠溃疡的治疗。根除幽门螺杆菌四联疗法：2种抗生素+PPI+铋剂。抗菌药物可首选阿莫西林，同时需与克拉霉素/四环素/左氧氟沙星/甲硝唑等药物联用，不包括克林霉素。"},
    {type:"最佳选择题",q:"30. 患者，男，35岁，因反复黏液脓血便伴腹痛、发热1个月，加重3天入院，每日排血便10余次，伴显著里急后重，心率110次/分，诊断为重症溃疡性结肠炎。该患者目前病情危重，需尽快控制炎症反应，首选的治疗药物是",opts:["A.口服氨基水杨酸制剂","B.局部用氨基水杨酸制剂","C.静脉使用糖皮质激素","D.静脉使用抗胆碱药","E.口服止泻药"],ans:"C",exp:"本题考查重症溃疡性结肠炎的治疗。重症UC患者首选静脉使用激素。"},
    {type:"最佳选择题",q:"31. 患者，男，52岁，因反复腹胀、乏力、食欲减退、伴双下肢水肿1周入院，既往有慢性乙型肝炎病史20余年，未规律抗病毒治疗。查体可见面色晦暗、肝掌阳性、前胸散在蜘蛛痣，腹部膨隆，移动性浊音阳性，双下肢凹陷性水肿。实验室检查提示：HBsAg阳性、HBeAg阴性、HBV DNA 5.6×10⁵IU/mL，ALT 68U/L，AST 89U/L，诊断为失代偿性乙型肝炎后肝硬化。推荐该患者使用的抗病毒药物是",opts:["A.恩替卡韦","B.聚乙二醇干扰素α","C.拉米夫定","D.阿德福韦","E.利巴韦林"],ans:"A",exp:"本题考查特殊人群的抗乙肝病毒治疗。失代偿性乙型肝炎后肝硬化患者推荐使用恩替卡韦或富马酸替诺福韦酯长期治疗，禁用聚乙二醇干扰素α治疗。"},
    {type:"最佳选择题",q:"32. 患者，男，40岁，近日易感疲劳，怕冷，经检查血清TSH增高，TT₃、FT₄降低，诊断为甲状腺功能减退症，医师开具左甲状腺素钠片100μg qd po治疗。关于左甲状腺素钠片的最佳服药时间及用药疗程，说法正确的是",opts:["A.早餐后半小时，终生服药","B.早餐前1小时，终生服药","C.早餐后1小时，终生服药","D.早餐前半小时，症状缓解可停药","E.早餐前1小时，症状缓解可停药"],ans:"B",exp:"本题考查甲减的治疗。甲减主要的推荐治疗药物为左甲状腺素（L-T4），需要终生服药。左甲状腺素钠片应于早餐前1小时，空腹将1日剂量一次性用水送服。"},
    {type:"最佳选择题",q:"33. 1型糖尿病患者需依赖胰岛素维持生命，也必须使用胰岛素控制高血糖，并降低糖尿病并发症的发生风险。推荐1型糖尿病患者优先使用",opts:["A.重组人胰岛素，静脉注射","B.德谷胰岛素，每日一次皮下注射","C.门冬胰岛素，经胰岛素泵持续皮下输注","D.精蛋白（重组）人胰岛素混合注射液（30R），皮下注射","E.精蛋白锌重组赖脯胰岛素混合注射液（50R），皮下注射"],ans:"C",exp:"本题考查糖尿病的治疗。推荐1型糖尿病患者优先使用每日多次胰岛素注射（MDI）或持续皮下胰岛素输注（CSII）方案进行治疗。"},
    {type:"最佳选择题",q:"34. 患者，女，28岁，因双手近端指间关节、腕关节对称性肿痛伴晨僵1小时以上持续6周就诊，诊断为类风湿关节炎。患者目前处于备孕期，医生在制定治疗方案时需考虑药物对妊娠的影响。已知某药物在妊娠毒性分级为X级（禁用），且用于类风湿关节炎治疗时需常规补充叶酸以减少不良反应。该药物是",opts:["A.硫唑嘌呤","B.来氟米特","C.阿达木单抗","D.环磷酰胺","E.甲氨蝶呤"],ans:"E",exp:"本题考查类风湿关节炎的治疗。甲氨蝶呤可致流产、畸胎，影响生育力，故妊娠期禁用。长期使用甲氨蝶呤会导致叶酸缺乏，需要额外补充叶酸。"},
    {type:"最佳选择题",q:"35. 患者，男，50岁，患类风湿关节炎，近期疼痛明显，前来药房咨询。药师给予的正确建议是",opts:["A.不可联合服用NSAIDs和DMARDs","B.改善病情的抗风湿药服用1周无效，应立即停药","C.单一传统合成DMARDs治疗未达标时，可联合另一种DMARDs","D.建议患者长期使用糖皮质激素","E.可采用两种NSAIDs联合应用"],ans:"C",exp:"本题考查类风湿关节炎的治疗。避免同时服用≥2种NSAIDs，但是可以NSAIDs联合DMARDs。单一传统合成DMARDs治疗未达标时，可视具体情况改用生物制剂，也可联合2种DMARDs进行治疗。"},
    {type:"最佳选择题",q:"36. 患者，男，68岁，因进行性排尿困难、尿频、夜尿增多就诊，诊断为良性前列腺增生症。患者有高血压病史，目前服用氨氯地平控制血压，医生考虑加用多沙唑嗪以改善排尿症状，但需告知其可能的不良反应是",opts:["A.便秘","B.体位性低血压","C.齿龈增生","D.心动过缓","E.性功能减退"],ans:"B",exp:"本题考查良性前列腺增生症的治疗。α受体拮抗剂如多沙唑嗪的主要不良反应是体位性低血压。"},
    {type:"最佳选择题",q:"37. 伴发膀胱过度活动症的良性前列腺增生症患者，在应用α₁受体拮抗剂的基础上宜加用的药物是",opts:["A.坦索罗辛","B.奥昔布宁","C.米多君","D.度他雄胺","E.非那雄胺"],ans:"B",exp:"本题考查良性前列腺增生症的治疗。α₁受体拮抗剂与M受体拮抗剂（如奥昔布宁）合用：主要用于临床表现为伴发膀胱过度活动症的良性前列腺增生症患者。"},
    {type:"最佳选择题",q:"38. 慢性肾脏病的患者并发肾性贫血，当Hb<100g/L时宜选择的药物是",opts:["A.阿法骨化醇","B.骨化三醇","C.红细胞生成刺激剂","D.依折麦布","E.阿托伐他汀"],ans:"C",exp:"本题考查慢性肾脏病的并发症管理。建议所有透析和非透析的CKD患者，当Hb<100g/L时开始红细胞生成刺激剂治疗。"},
    {type:"最佳选择题",q:"39. 蒽环类药物容易引起急、慢性心脏毒性，可导致左心室功能受损、心衰等。在使用蒽环类药物化疗期间，可推荐用于预防心脏毒性发生的药物是",opts:["A.阿托品","B.右雷佐生","C.普萘洛尔","D.硝苯地平","E.维拉帕米"],ans:"B",exp:"本题考查抗肿瘤药物的典型不良反应。蒽环类药物引起的心脏毒性呈剂量累积性，可选择维生素、辅酶Q、谷胱甘肽或右雷佐生预防或治疗。"},
    {type:"最佳选择题",q:"40. 患者，女，62岁，因结肠癌术后辅助化疗接受卡培他滨联合奥沙利铂治疗，用药2周后出现双手掌和足底对称性红斑、肿胀、脱屑伴疼痛，局部皮肤紧绷，活动受限，诊断为手足综合征。下列药物中，最容易引起手足综合征的是",opts:["A.博来霉素","B.卡培他滨","C.奥沙利铂","D.顺铂","E.异环磷酰胺"],ans:"B",exp:"本题考查抗肿瘤药物的典型不良反应。卡培他滨可引起手足综合征，应穿戴宽松的鞋袜和手套，避免反复揉搓手脚，避免长时间阳光直射等。"},

    // ===== 二、配伍选择题（41-85） =====
    {type:"配伍选择题",subs:[
      {q:"41. 属于高警示药品的镇痛药是",opts:["A.吗啡注射液","B.胺碘酮注射液","C.硝普钠注射液","D.浓氯化钾注射液","E.高锰酸钾外用制剂"],ans:"A",exp:"吗啡注射液属于高警示药品的镇痛药/阿片类药物。"},
      {q:"42. 属于高警示药品的抗心律失常药是",opts:["A.吗啡注射液","B.胺碘酮注射液","C.硝普钠注射液","D.浓氯化钾注射液","E.高锰酸钾外用制剂"],ans:"B",exp:"胺碘酮注射液属于高警示药品的抗心律失常药。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"43. 属于CYP3A4抑制剂，不与阿托伐他汀合用的药物是",opts:["A.克拉霉素","B.氯吡格雷","C.利福平","D.苯妥英钠","E.苯巴比妥"],ans:"A",exp:"克拉霉素属于CYP3A4抑制剂，不与阿托伐他汀合用。"},
      {q:"44. 属于CYP2C8抑制剂，不与奥美拉唑合用的药物是",opts:["A.克拉霉素","B.氯吡格雷","C.利福平","D.苯妥英钠","E.苯巴比妥"],ans:"B",exp:"氯吡格雷属于CYP2C8抑制剂，不与奥美拉唑合用。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"45. 对一个具体问题提供的信息简明扼要，内容广泛，使用方便，具备该特点的药学信息是",opts:["A.文摘数据库","B.临床实践指南","C.实验研究结果","D.病例报道","E.评价性研究结果"],ans:"B",exp:"三级信息的优点：①对一个具体问题提供的信息简明扼要；②内容广泛，使用方便；③有的还提供疾病与药物治疗的基础知识。三级信息资源包括医药图书、光盘或在线数据库、药学应用软件以及临床实践指南、系统评价或综述性文章等。"},
      {q:"46. 可方便地对一级信息的数据和文献进行筛选，所提供信息量有限，具备该特点的药学信息是",opts:["A.文摘数据库","B.临床实践指南","C.实验研究结果","D.病例报道","E.评价性研究结果"],ans:"A",exp:"二级信息的优点：读者利用索引或文摘服务可方便地对一级信息的数据和文献进行筛选。缺点：索引或文摘服务所提供信息量有限。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"47. 肝功能不全患者，评分为A级，给药方案宜调整为",opts:["A.无需调整剂量","B.用正常患者80%的剂量","C.用正常患者50%的剂量","D.用正常患者25%的剂量","E.换用可进行有效监测的药物"],ans:"C",exp:"CTP评分5～6分，肝功能分级为A级（轻度肝功能不全），用正常患者50%的维持剂量。"},

      {q:"84. 累积剂量超过300mg或联合放疗都可使肺毒性发生风险增高或程度加重，应定期行胸部X线或肺功能检查的药物是",opts:["A.奥沙利铂","B.利妥昔单抗","C.氟尿嘧啶","D.博来霉素","E.顺铂"],ans:"D",exp:"导致肺毒性的典型化疗药物如博来霉素，累积剂量超过300mg或联合放疗都可使肺毒性发生风险增高或程度加重。应定期行胸部X线或肺功能检查。"},
      {q:"85. 主要导致肾小管间质损伤、血清肌酐水平升高，临床表现为多尿、尿酸化功能障碍的药物是",opts:["A.奥沙利铂","B.利妥昔单抗","C.氟尿嘧啶","D.博来霉素","E.顺铂"],ans:"E",exp:"铂类药物中顺铂为可引起肾毒性的典型代表，其主要导致肾小管间质损伤、血清肌酐水平升高，临床表现为多尿、尿酸化功能障碍等。"}

    // ===== 三、综合分析选择题（86-95） =====
    {type:"最佳选择题",q:"86. 尤其适用于老年人，临床上治疗焦虑障碍应用广泛的药物是",opts:["A.曲唑酮","B.普萘洛尔","C.丁螺环酮","D.帕罗西汀","E.阿米替林"],ans:"D",exp:"帕罗西汀属于选择性5-羟色胺再摄取抑制剂（SSRIs），该药是临床上治疗焦虑障碍应用广泛的一种药物。SSRIs能减轻焦虑或焦虑伴发的抑郁症状，尤其适用于老年人。"},
    {type:"最佳选择题",q:"87. 患者使用上题选用的抗焦虑药物后，2天前因淋雨出现发热，体温高达39℃，经实验室和胸部X线检查，临床诊断为社区获得性肺炎，不宜选用的抗菌药物是",opts:["A.阿莫西林","B.氨苄西林","C.利奈唑胺","D.头孢呋辛","E.多西环素"],ans:"C",exp:"利奈唑胺能选择性抑制单胺氧化酶，禁止与选择性5-HT再摄取抑制剂合用。"},
    {type:"最佳选择题",q:"88. 仅能改善患者焦虑的各种躯体性症状的药物是",opts:["A.沙丁胺醇","B.普萘洛尔","C.氟哌噻吨美利曲辛","D.甲巯咪唑","E.丙硫氧嘧啶"],ans:"B",exp:"β受体拮抗剂的代表药物为普萘洛尔，主要用于解除焦虑障碍的各种躯体性症状，如心悸、震颤、心动过速等。"},
    {type:"最佳选择题",q:"89. 该患者最可能的临床诊断是",opts:["A.支气管哮喘","B.胃溃疡","C.胃食管反流病","D.慢性阻塞性肺病","E.肠易激综合征"],ans:"C",exp:"反酸、烧心为胃食管反流病的特征性临床表现。"},
    {type:"最佳选择题",q:"90. 该患者首选的治疗药物是",opts:["A.沙丁胺醇气雾剂","B.米索前列醇","C.多潘立酮","D.罗氟司特","E.奥美拉唑"],ans:"E",exp:"针对胃食管反流病，抑酸药尤其是拉唑类药物可作为首选。"},
    {type:"最佳选择题",q:"91. 该患者用药一段时间后再次就诊，复查肾功能提示：估算的肾小球滤过率34.6ml/(min·1.73m²)，需要调整治疗方案。下列合理的调整是",opts:["A.停用二甲双胍片","B.停用阿卡波糖片","C.停用依那普利片","D.停用阿托伐他汀钙胶囊","E.停用硝苯地平控释片"],ans:"A",exp:"二甲双胍不经肝脏代谢，直接以原型经肾脏排泄，当肾功能受损时，易发生二甲双胍和乳酸在体内堆积，增加乳酸性酸中毒风险。当估算的肾小球滤过率<45ml/(min·1.73m²)时应考虑停药。"},
    {type:"最佳选择题",q:"92. 经生活方式调整和口服降糖药治疗后，患者血糖仍控制不佳。经医生评估，需注射给予胰岛素或胰岛素类似物，该患者宜加用的基础胰岛素是",opts:["A.重组人胰岛素，皮下注射","B.门冬胰岛素，餐后立即皮下注射","C.甘精胰岛素，每日一次皮下注射","D.度拉糖肽，每周一次皮下注射","E.精蛋白锌重组赖脯胰岛素混合注射液(25R)，皮下注射"],ans:"C",exp:"甘精胰岛素属于长效胰岛素类似物，可用于提供基础胰岛素，皮下注射，1次/日，每日固定时间给药，且无明显作用高峰，尤其适用于老年人。"},
    {type:"最佳选择题",q:"93. 该患者向药师咨询胰岛素的用药注意事项，药师给予的正确回答是",opts:["A.未开封的胰岛素制剂应在25℃环境下贮存","B.使用中的胰岛素笔芯应在2℃-8℃环境下贮存","C.通常每3-5周调整一次给药剂量，每次调整1-4U直至空腹血糖达标","D.开封后的胰岛素笔芯最多可保存4-6个月","E.每次注射时应变换注射部位，两次注射点要至少间隔2cm"],ans:"E",exp:"每次注射时应变换注射部位，两次注射点要至少间隔2cm，以确保胰岛素稳定吸收，同时防止发生皮下脂肪营养不良。"},
    {type:"最佳选择题",q:"94. 该患者每日钙推荐摄入的总量为",opts:["A.50～100mg","B.200～400mg","C.600～800mg","D.1000～1200mg","E.2000～4000mg"],ans:"D",exp:"50岁及以上人群每日钙推荐摄入量为1000～1200mg。"},
    {type:"最佳选择题",q:"95. 阿仑膦酸钠正确的给药方案是",opts:["A.2.5mg 口服，每日一次","B.10mg 口服，每日一次","C.10mg 口服，隔日一次","D.60mg 口服，每日一次","E.70mg 口服，隔日一次"],ans:"B",exp:"阿仑膦酸钠可每日1次，1次10mg或每周1次，1次70mg，空腹用水送服。"},

    // ===== 四、多项选择题（96-100） =====
    {type:"多项选择题",q:"96. 下列关于中文含义及缩写，对应正确的有",opts:["A.循证医学-EBM","B.治疗药物监测-TDM","C.药物治疗管理-MTM","D.药物不良反应-ADR","E.药物不良事件-ADE"],ans:"ABCDE",exp:"本题考查药学服务新进展。①循证医学的英文缩写为EBM。②治疗药物监测的英文缩写为TDM。③药物治疗管理的英文缩写为MTM。④药物不良反应的英文缩写为ADR。⑤药物不良事件的缩写为ADE。"},
    {type:"多项选择题",q:"97. 下列属于影响药品质量因素中药品因素的有",opts:["A.湿度","B.水解","C.氧化","D.温度","E.药品的包装材料"],ans:"BCE",exp:"本题考查影响药品质量的因素。①湿度属于环境因素。②水解属于药品因素。③氧化属于药品因素。④温度属于环境因素。⑤药品的包装材料属于药品因素。"},
    {type:"多项选择题",q:"98. 下列关于护士用药咨询的内容，说法正确的有",opts:["A.青霉素不宜用氯化钠注射液溶解，极易裂解失效","B.红霉素不宜选用氯化钠注射液溶解，易产生胶状不溶物","C.头孢曲松钠不宜与含钙注射液直接混合，可能产生白色浑浊","D.万古霉素滴注速度不宜过快","E.盐酸多巴胺不宜与呋塞米注射液配伍，易形成白色沉淀"],ans:"BCD",exp:"本题考查护士用药咨询。①青霉素不宜用葡萄糖注射液溶解，极易裂解失效。②红霉素不宜选用氯化钠注射液溶解，易产生胶状不溶物。③头孢曲松钠不宜与含钙注射液直接混合，因可产生头孢曲松钙的白色细微浑浊或沉淀。④万古霉素不宜肌内注射或直接静脉注射，因滴注速度过快可致由组胺引起的非免疫性剂量相关反应（即“红人综合征”）。⑤盐酸多巴胺与呋塞米注射液配伍后溶液呈碱性，使多巴胺氧化而形成黑色聚合物沉淀。"},
    {type:"多项选择题",q:"99. 透析患者常用的治疗药物包括",opts:["A.碳酸钙","B.骨化三醇","C.琥珀酸亚铁","D.维生素C","E.人促红素"],ans:"ABCDE",exp:"本题考查透析患者用药。透析患者常用药物包括磷结合剂（碳酸钙）、维生素D及其类似物（骨化三醇、阿法骨化醇）、铁剂、维生素B和维生素C、缓泻药、人促红细胞生成素、非甾体抗炎药。"},
    {type:"多项选择题",q:"100. 下列关于急救的处理原则及一般方法，说法正确的有",opts:["A.出血患者要及时止血，可根据出血部位与程度选用直接压迫法、止血带绑扎法等","B.对于气道异物梗阻患者，运用海姆立克急救法快速排除异物，恢复气道通畅","C.对于骨折或疑似骨折部位，就地取材，利用夹板、树枝、衣物等进行有效固定","D.确保施救环境安全，避免施救者与伤病员受到二次伤害","E.确保患者气道通畅，无任何防护直接用手清除患者口腔内存在的异物"],ans:"ABCD",exp:"本题考查急救的处理原则及一般方法。确保患者气道通畅，迅速用手指缠上纱布或戴上手套清除患者口腔内存在的异物，并采用仰头抬颏法打开气道。E选项错误，其余选项均正确。"}
  ]

    {type:"最佳选择题",q:"4. 癫痫、帕金森病及精神疾病患者避免使用的药物是",opts:["A.双氯芬酸钠","B.吡罗昔康","C.吲哚美辛","D.塞来昔布","E.对乙酰氨基酚"],ans:"C",exp:"吲哚美辛可兴奋中枢，加重癫痫、帕金森病及精神疾病患者病情，应避免使用。"},
    {type:"最佳选择题",q:"5. 为阿司匹林与对乙酰氨基酚以酯键结合的中性化合物，有解热镇痛作用，不良反应较阿司匹林小，患者易于耐受，很少引起胃肠出血的非甾体抗炎药是",opts:["A.双氯芬酸钠","B.吡罗昔康","C.二氟尼柳","D.塞来昔布","E.贝诺酯"],ans:"E",exp:"贝诺酯为阿司匹林与对乙酰氨基酚以酯键结合的中性化合物，有解热镇痛作用，不良反应较阿司匹林小，很少引起胃肠出血。"},
    {type:"最佳选择题",q:"6. 平喘药中多索茶碱有效且比较安全的血药浓度范围是",opts:["A.1～5μg/ml","B.5～10ng/ml","C.10～20μg/ml","D.5～20μg/ml","E.20～40μg/ml"],ans:"C",exp:"多索茶碱有效且比较安全的血药浓度范围是10～20μg/ml。"},
    {type:"最佳选择题",q:"7. 应用高剂量的β2受体激动剂可导致的严重不良反应是",opts:["A.低镁血症","B.低钙血症","C.低钾血症","D.高钙血症","E.高钾血症"],ans:"C",exp:"高剂量β2受体激动剂可导致低钾血症。"},
    {type:"最佳选择题",q:"8. 与考来烯胺、氢氧化铝同服时，吸收率会显著降低的药物是",opts:["A.熊去氧胆酸","B.多潘立酮","C.伏诺拉生","D.乳果糖","E.多烯磷脂酰胆碱"],ans:"A",exp:"考来烯胺、氢氧化铝可吸附熊去氧胆酸，使其吸收率显著降低。"},
    {type:"最佳选择题",q:"9. 是WHO推荐的低渗配方，用于预防和治疗轻度脱水的是",opts:["A.口服补液盐I","B.口服补液盐II","C.口服补液盐III","D.蒙脱石散","E.复方地芬诺酯"],ans:"C",exp:"口服补液盐III是WHO推荐的低渗配方，用于预防和治疗轻度脱水。"},
    {type:"最佳选择题",q:"10. 利福昔明若有极少量被吸收时，尿液会变成",opts:["A.淡蓝色","B.淡绿色","C.深黄色","D.粉红色","E.棕色"],ans:"D",exp:"利福昔明极少量被吸收时，尿液会变成粉红色。"},

    {type:"最佳选择题",q:"12. 患者，男，54岁，高胆固醇血症治疗期间出现血小板减少和Q-Tc间期延长，最有可能使用的调血脂药是",opts:["A.普伐他汀","B.非诺贝特","C.依折麦布","D.普罗布考","E.阿昔莫司"],ans:"D",exp:"普罗布考可引起血小板减少和Q-Tc间期延长。"},
    {type:"最佳选择题",q:"13. 不属于作用于心血管系统离子通道的药物是",opts:["A.普鲁卡因胺","B.苯妥英钠","C.奎尼丁","D.普萘洛尔","E.索他洛尔"],ans:"D",exp:"普萘洛尔属于β受体拮抗剂，不作用于离子通道。"},
    {type:"最佳选择题",q:"14. 非二氢吡啶类CCB对窦房结和房室结处的钙通道具有选择性，其扩张血管强度弱于二氢吡啶类CCB。属于非二氢吡啶类CCB的是",opts:["A.马尼地平","B.尼群地平","C.氨氯地平","D.地尔硫䓬","E.拉西地平"],ans:"D",exp:"地尔硫䓬属于非二氢吡啶类CCB。"},
    {type:"最佳选择题",q:"15. 因其注射液中含有苯甲醇，禁用于儿童肌内注射的药物是",opts:["A.胺碘酮","B.苯妥英钠","C.普鲁卡因胺","D.维拉帕米","E.普罗帕酮"],ans:"B",exp:"苯妥英钠注射液中含有苯甲醇，禁用于儿童肌内注射。"},
    {type:"最佳选择题",q:"16. 用维生素B12治疗巨幼红细胞性贫血，48h内应该监测的电解质是",opts:["A.钠","B.钾","C.锂","D.钙","E.镁"],ans:"B",exp:"维生素B12治疗巨幼红细胞性贫血时，48h内应监测血钾，以防低钾血症。"},
    {type:"最佳选择题",q:"17. 常用溶栓药物中，血浆消除半衰期最长的药物是",opts:["A.尿激酶","B.阿替普酶","C.重组链激酶","D.替奈普酶","E.重组人尿激酶原"],ans:"D",exp:"替奈普酶血浆消除半衰期最长，可达20～24分钟。"},

    {type:"最佳选择题",q:"95. 关于痛风患者健康的生活方式，说法错误的是",opts:["A.加强锻炼，控制体重","B.增加碱性食物的摄取","C.戒烟限酒（啤酒、白酒）","D.增加高嘌呤食物的摄入","E.每日饮水2000～3000ml"],ans:"D",exp:"痛风患者应避免高嘌呤食物，而非增加摄入。"},

    // ===== 四、多项选择题（96-100） =====
    {type:"多项选择题",q:"96. 药品贮存温度、光照及湿度是影响药品质量的重要因素，因此，应严格按照药品贮藏要求贮存药品。下列关于药品贮存要求的说法，错误的是",opts:["A.避光，指避免日光直射","B.阴凉处，指避光不超过25℃","C.常温（室温），指10℃-30℃","D.遮光，指用不透光的容器包装","E.凉暗处，指温度为2℃-10℃"],ans:"BE",exp:"阴凉处指不超过20℃；凉暗处指避光并不超过20℃。BE错误。"},
    {type:"多项选择题",q:"97. 药师在向患者交代阿仑膦酸钠片（70mg/片）的正确用法时，正确的有",opts:["A.每周服用一次","B.服药时间必须为早餐后半小时","C.用一整杯白开水（175-250ml）送服","D.服药后半小时内避免躺卧","E.可用牛奶或果汁送服以减轻胃部刺激"],ans:"ACD",exp:"阿仑膦酸钠应每周一次，早餐前至少30分钟用200ml温开水送服，服后30分钟内不宜进食和卧床。不可用牛奶或果汁送服。"},
    {type:"多项选择题",q:"98. 下列关于急救的处理原则及一般方法，说法正确的有",opts:["A.出血患者要及时止血，可根据出血部位与程度选用直接压迫法、止血带绑扎法等","B.对于气道异物梗阻患者，运用海姆立克急救法快速排除异物，恢复气道通畅","C.对于骨折或疑似骨折部位，就地取材，利用夹板、树枝、衣物等进行有效固定","D.确保施救环境安全，避免施救者与伤病员受到二次伤害","E.对于脊柱损伤患者，要使其端坐，以保持脊柱的稳定性"],ans:"ABCD",exp:"脊柱损伤患者应保持脊柱稳定，不能使其端坐，应平卧硬板。E错误。"},
    {type:"多项选择题",q:"99. 患者，女，63岁，机械瓣膜置换术后合并房颤，使用华法林抗凝治疗，可减弱华法林抗凝作用的药物有",opts:["A.螺内酯","B.圣约翰草提取物","C.口服避孕药","D.抗血小板药","E.丹参、当归"],ans:"BC",exp:"圣约翰草提取物和口服避孕药可减弱华法林抗凝作用。螺内酯、抗血小板药、丹参当归可增强华法林作用。"},
    {type:"多项选择题",q:"100. 有关脑梗死急性期的溶栓治疗禁忌证包括",opts:["A.近2周内进行过大型外科手术者","B.既往有过颅内出血者","C.收缩压≥180mmHg或舒张压≥100mmHg","D.血小板计数<100×10^9/L者","E.血糖<2.8mmol/L"],ans:"ABCDE",exp:"以上均为脑梗死急性期溶栓治疗的禁忌证。"}
  ]
},
  {
  name: "押题密卷（五）",
  questions: [
    // ===== 一、最佳选择题（1-40） =====
    {type:"最佳选择题",q:"1. 药学服务新进展中药物评价的内容不包括",opts:["A.质量","B.安全性","C.有效性","D.经济性","E.患者用药史"],ans:"E",exp:"药物评价包括质量、安全性、有效性及经济性。患者用药史不属于药物评价内容。"},
    {type:"最佳选择题",q:"2. 患者，男，57岁，近期由于胃部不适在规律服用伊托必利，下列药物中不宜与其合用的是",opts:["A.青霉素","B.舒肝丸","C.头孢拉定","D.异烟肼","E.可乐定"],ans:"B",exp:"舒肝丸主要功效为疏肝解郁，可舒张胃部平滑肌，而伊托必利为促胃动力药可收缩胃部平滑肌，两者作用特点相反，合用可降低彼此药效。"},
    {type:"最佳选择题",q:"3. 下列关于门诊处方调配，说法不正确的是",opts:["A.仔细阅读处方，按照药品顺序逐一调配","B.对麻醉药品等特殊管理药品分别登记账卡","C.必须在每种药品外包装上都加贴特别提示签进行详细说明","D.对需要特殊保存的药品加贴醒目标签以提示患者注意","E.调配好一张处方的所有药品后再调配下一张处方，以免发生差错"],ans:"C",exp:"有条件的医疗单位，尽量在每种药品外包装上分别加贴用法、用量、贮存条件等标签，并非必须。"},
    {type:"最佳选择题",q:"4. 关于慢性肾脏病（CKD）患者的健康管理，说法错误的是",opts:["A.推荐优质低蛋白饮食（如瘦肉、鸡蛋、牛奶），蛋白质摄入量一般为0.8g/(kg·d)","B.避免高脂食物的摄入，热量摄入推荐30～35kcal/(kg·d)","C.适当控制内脏、海鲜类等高嘌呤饮食摄入","D.伴有高血压患者在降压治疗过程中要注意降压幅度不可过快","E.初次服用α受体拮抗剂控制血压的老年患者，应给予负荷剂量"],ans:"E",exp:"老年患者用降压药时应慎用α受体拮抗剂等易致体位性低血压和跌倒的药物，必须使用时建议首剂减半量，同时做好用药指导。"},
    {type:"最佳选择题",q:"5. 高警示药品根据其安全级别进行“金字塔式”管理，C级高警示药品存放标识正确的是",opts:["A.红底","B.蓝底","C.黄底","D.白底","E.橙底"],ans:"B",exp:"A级高警示药品为红底，B级为橙底，C级为蓝底。"},
    {type:"最佳选择题",q:"6. 老年共病患者的最优化药物处方应该是以患者为中心，并全面考虑患者整体情况，确定合适的近期治疗和远期治疗目标。共病管理和药疗需遵循的原则不包括",opts:["A.在安宁疗护阶段，主要是根除病因，提高生活质量","B.当老年人突发急症时，应当确定优先治疗原则","C.起始剂量小、缓慢滴定增量","D.药疗之前首先考虑非药物治疗方案","E.药物管理是老年人慢性病管理和连续医疗中最重要的内容之一"],ans:"A",exp:"在安宁疗护阶段，主要是恰当的对症治疗，而一些用于一级预防和对因治疗的药物不会让患者获益，可以停用。"},
    {type:"最佳选择题",q:"7. 关于药物治疗方案制定的一般原则，说法错误的是",opts:["A.应考虑患者的依从性，保证治疗的有效性","B.应充分考虑患者的机体状况，尽可能避免患者出现药源性疾病","C.应考虑治疗总成本，而不是单一的药费，避免患者因经济负担影响治疗","D.选择合适的给药途径，通常口服和外用（比如透皮给药）比注射给药方便","E.尽可能联合给药，提高药物的治疗效果"],ans:"E",exp:"保证患者的用药安全是药物治疗的前提，在制定药物治疗方案时，应选择合理的联合用药，而不是尽可能联合给药。"},
    {type:"最佳选择题",q:"8. 患者，女，65岁，近期出现清晨起床全身肌肉僵硬、紧张和无规律的痉挛，偶尔疼痛难忍。该患者可以优先选择的药物为",opts:["A.罗通定","B.卡马西平","C.乙哌立松","D.氨基葡萄糖","E.阿托品"],ans:"C",exp:"针对肌肉紧张、僵硬和痉挛的慢性疼痛患者，可以酌情联合乙哌立松、替扎尼定、巴氯芬等肌松药。"},
    {type:"最佳选择题",q:"9. 关于普通感冒的描述，说法错误的是",opts:["A.不推荐对乙酰氨基酚联合布洛芬用于儿童退热","B.2岁及2岁以上儿童睡前可在胸部和颈部涂抹含樟脑的软膏缓解鼻塞","C.鼻塞的儿童可以使用生理盐水冲洗鼻腔","D.12个月以下婴儿不应服用蜂蜜","E.普通感冒常规使用抗菌药物治疗"],ans:"E",exp:"普通感冒通常由病毒引起，不应常规使用抗菌药物。"},
    {type:"最佳选择题",q:"10. 患者，女，31岁，孕21周，昨晚进食大量海鲜后出现身痒难耐，皮肤呈广泛性荨麻疹样表现，色红，尚无渗出液，入院就诊，检查后确诊为急性过敏性荨麻疹。使用西替利嗪后症状无减轻，可以酌情使用的药物是",opts:["A.奥洛他定","B.奥马珠单抗","C.苯海拉明","D.非索非那定","E.帕博利珠单抗"],ans:"B",exp:"妊娠期使用奥马珠单抗具有安全性，无致畸性，可在抗组胺药物疗效不佳时酌情使用。"},
    {type:"最佳选择题",q:"11. 患者，女，35岁，因消化不良就诊。患者进食后容易出现腹胀、腹泻等症状，近期症状加重，体重逐渐下降。进行了一系列检查，包括肝功能、腹部超声等，结果为肝胆疾病引起的消化酶不足性消化不良。建议使用的药物为",opts:["A.艾司奥美拉唑","B.多酶片","C.二甲硅油","D.干酵母","E.多潘立酮"],ans:"B",exp:"胰腺分泌功能不足或由于胃肠、肝胆疾病引起的消化酶不足者：多酶片用于消化不良和增进食欲。"},
    {type:"最佳选择题",q:"12. 炎热的天气里，在饮食、行为活动等方面应格外注意，防止中暑的发生。下列说法错误的是",opts:["A.抵御中暑最好的措施就是预防，即保持凉爽","B.工作或运动强度过大的人，有可能脱水，更易中暑","C.高温炎热天气，若运动量小，无需额外补充水分","D.大量出汗后应补充身体所需要的盐分与矿物质","E.若感到头晕，须立即停止活动并休息"],ans:"C",exp:"高温天气里，不论运动量大小，都需要增加液体的摄入，不应等到口渴时才喝水。"},
    {type:"最佳选择题",q:"13. 患者，男，51岁，近期出现皮肤大面积红色斑块，覆盖有银白色鳞屑，瘙痒难耐伴有灼热及疼痛。前往医院就诊后诊断为寻常型银屑病。下列药物中，适宜该患者使用的是",opts:["A.阿达帕林","B.米诺环素","C.柳氮磺吡啶","D.依曲替酸","E.甲氧沙林"],ans:"D",exp:"银屑病常使用甲氨蝶呤、糖皮质激素、维A酸类药（如阿维A酯、阿维A、依曲替酸）、免疫抑制剂、生物制剂等。"},
    {type:"最佳选择题",q:"14. 患者，女，54岁，支气管哮喘病史12年。3年前由于乳腺癌规律抗肿瘤治疗，近期出现剧烈癌痛。患者不可以使用的第三阶梯镇痛药物是",opts:["A.吗啡","B.布洛芬","C.可待因","D.二氢可待因","E.曲马多"],ans:"A",exp:"吗啡禁用于支气管哮喘的患者，会引起呼吸抑制，加重支气管哮喘的病情。"},
    {type:"最佳选择题",q:"15. 患者，女，67岁，高血压伴慢性阻塞性肺病9年。医生推荐患者使用了一种新型支气管舒张剂，该药物起效快，每日仅需使用一次，但该患者在吸入使用2周后出现了间断性咳嗽的不良反应，该药物最有可能是",opts:["A.卡托普利","B.沙丁胺醇","C.噻托溴铵","D.舒达特罗","E.罗氟司特"],ans:"D",exp:"舒达特罗是一种新型LABA，起效快，每日1次，但部分患者在吸入后会出现咳嗽。"},
    {type:"最佳选择题",q:"16. 关于原发性高血压患者降压药物应用基本原则，说法正确的是",opts:["A.年轻、病程较短的高血压患者降压速度应稍慢，将血压逐渐降至目标水平","B.老年人、病程较长、有合并症的患者，降压速度可稍快，以尽快保护靶器官组织","C.老年人优先选择长效降压药物，以有效、平稳地控制24小时血压","D.单药治疗血压控制不达标者可联用机制相同的降压药","E.血压控制平稳后患者可自行逐渐停药，切忌突然停药"],ans:"C",exp:"优先使用长效降压药物，以有效、平稳地控制24小时血压。年轻、病程较短者降压速度可稍快；老年人、病程较长者降压速度稍慢。"},
    {type:"最佳选择题",q:"17. 患者，男，62岁，有吸烟史25年，诊断为高血压、高脂血症。使用苯磺酸氨氯地平、阿司匹林、辛伐他汀治疗，半年后复查血脂结果：TC5.2mmol/L，TG1.6mmol/L，LDL-C3.1mmol/L，HDL-C1.2mmol/L。关于该患者调脂药物治疗方案的说法，正确的是",opts:["A.辛伐他汀可在每日任何固定时间服用","B.血脂控制达标后应立即停用辛伐他汀","C.辛伐他汀与苯磺酸氨氯地平合用时，日剂量不超过40mg","D.辛伐他汀避免与克拉霉素合用","E.用药期间应监测血脂、血清淀粉酶、肝功能、肾功能"],ans:"D",exp:"辛伐他汀、洛伐他汀为CYP3A4底物药物，大环内酯类抗菌药物（阿奇霉素除外）为CYP3A4抑制剂，避免合用。辛伐他汀与苯磺酸氨氯地平合用时日剂量不能超过20mg。"},
    {type:"最佳选择题",q:"18. 患者，男，58岁，诊断为心房颤动，为控制心室率可选择的治疗方案不正确的是",opts:["A.卡维地洛片25mg，bid","B.琥珀酸美托洛尔缓释片47.5mg，qd","C.比索洛尔片5mg，tid","D.维拉帕米缓释片240mg，qd","E.地高辛片0.25mg，qd"],ans:"C",exp:"比索洛尔为长效制剂，一般一日给药一次，用于房颤患者心室率控制剂量为2.5～10mg，qd。"},
    {type:"最佳选择题",q:"19. 患者，男，72岁，近期在服用药物治疗帕金森病、缺铁性贫血。医师告知患者某药物与铁剂不能同服，服药时间至少间隔2～3小时。作为药师，推断该药物为",opts:["A.左旋多巴","B.司来吉兰","C.金刚烷胺","D.恩他卡朋","E.苯海索"],ans:"D",exp:"恩他卡朋在胃肠道能与铁剂形成螯合物，与铁剂的服药间隔至少为2～3小时。"},
    {type:"最佳选择题",q:"20. 患者，男，81岁，阿尔茨海默病5年。医生告知患者家属，给该患者的某一个治疗用药中不宜与右美沙芬合用，可引起幻觉或失眠等问题，该药物最有可能是",opts:["A.辛伐他汀","B.铝碳酸镁","C.多奈哌齐","D.美金刚","E.多奈单抗"],ans:"D",exp:"美金刚不良反应有幻觉、神志不清、头晕、头痛、腹泻、便秘和疲倦等，需避免与金刚烷胺、氯胺酮和右美沙芬同时使用。"},
    {type:"最佳选择题",q:"21. 患者，女，46岁，因家庭变故出现急性焦虑，给予艾司唑仑进行治疗。下列关于该患者用药交代的说法，不正确的是",opts:["A.不能过量使用，避免与酒精或其他能引起嗜睡的药物合用","B.用药期间不宜从事驾驶、仪器操作或其他需要集中精神才能完成的工作","C.阿普唑仑存在症状反跳和戒断综合征的风险，不能突然停止使用","D.小剂量起始，滴定增量，长期规律用药","E.用药后容易跌倒，应做好预防跌倒和跌倒后的处理措施"],ans:"D",exp:"苯二氮䓬类药物对急性期焦虑患者可考虑短期使用，一般治疗时间不超过2～3周，不宜长期规律用药。"},
    {type:"最佳选择题",q:"22. 患者，男，55岁，慢性咽炎多年，近期新诊断为Barrett食管。关于该患者治疗方案的说法，正确的是",opts:["A.初始治疗首选H2受体拮抗剂，剂量通常需要加倍","B.初始治疗首选质子泵抑制剂，剂量通常需要加倍","C.到达有效控制症状的剂量后，抑酸治疗完成8周疗程即可停药","D.当抑酸药物治疗效果不佳时，可换用抗酸药物","E.待症状缓解、初始治疗完成后，应按需维持治疗"],ans:"B",exp:"Barrett食管初始治疗首选质子泵抑制剂，剂量通常需要加倍。重度食管炎通常需要长疗程维持治疗。"},
    {type:"最佳选择题",q:"23. 患者，女，48岁，诊断为进展期白癜风。关于该患者的治疗及用药教育，下列说法错误的是",opts:["A.初始治疗可使用泼尼松片15mg，每天分1～3次口服，连续服用1.5～2个月","B.如该患者使用复方甘草酸苷，需注意监测血压、电解质等指标","C.通过长期规律用药，可达到抑制疾病进展进而逆转白癜风，达到彻底治愈的目的","D.白癜风稳定期应避免系统使用糖皮质激素治疗","E.该患者平时应适当增加户外锻炼及接受日光浴"],ans:"C",exp:"白癜风的治疗目的在于给予局部异常的黑素细胞再生黑素的能力、抑制疾病继续发展，但该病无治愈终点。"},
    {type:"最佳选择题",q:"24. 患者，女，21岁，患甲状腺功能亢进症，服用甲巯咪唑20mg bid治疗。药师应告知患者，抗甲状腺药物治疗的疗程一般为",opts:["A.1～3个月","B.3～6个月","C.6～12个月","D.12～18个月","E.18～24个月"],ans:"E",exp:"抗甲状腺药物治疗疗程一般为18～24个月。"},
    {type:"最佳选择题",q:"25. 抑制骨破坏，能明显缓解骨痛，适用于伴骨痛的骨质疏松症患者的药物是",opts:["A.依降钙素","B.阿仑膦酸钠","C.雷洛昔芬","D.葡萄糖酸钙","E.特立帕肽"],ans:"A",exp:"降钙素类药物能明显缓解骨痛，对骨质疏松症及骨折引起的骨痛有效。"},
    {type:"最佳选择题",q:"26. 患者，男，57岁，患有痛风，服用苯溴马隆降尿酸治疗。近期体检发现高血压，未服药时血压维持在150/95mmHg左右，建议服药控压，适宜该患者的降压药是",opts:["A.哌唑嗪","B.氢氯噻嗪","C.呋塞米","D.氯沙坦钾","E.利血平-氨苯蝶啶"],ans:"D",exp:"对于合并有高血压的痛风患者，必要时可选择兼具降压和降尿酸作用的血管紧张素Ⅱ受体拮抗剂（氯沙坦）。"},
    {type:"最佳选择题",q:"27. 患者，女，16岁，近日因排尿困难就诊，患者自述有尿频、尿急、尿痛、排尿不适、下腹痛等症状，且尿液比平时浑浊并有异味。查体：体温37.2℃，耻骨上有轻度压痛。血常规示：白细胞500/μL，临床考虑急性膀胱炎。关于该患者经验性抗感染治疗的说法，正确的是",opts:["A.最常见的病原菌为大肠埃希菌，可用阿莫西林-克拉维酸","B.最常见的病原菌为肺炎克雷伯菌，可用莫西沙星","C.最常见的病原菌为非白假丝酵母菌，可用伊曲康唑","D.最常见的病原菌为铜绿假单胞菌，可用头孢曲松","E.最常见的病原菌为金黄色葡萄球菌，可用万古霉素"],ans:"A",exp:"膀胱炎致病菌多为大肠埃希菌，约占75%以上。急性膀胱炎的短程疗法可选用磺胺甲噁唑-甲氧苄啶、呋喃妥因、磷霉素氨丁三醇、阿莫西林-克拉维酸等。"},
    {type:"最佳选择题",q:"28. 患者，男，80岁，患有良性前列腺增生症，常出现尿频、排尿困难，排尿后尿不尽、残余尿增多现象，诊断为充盈性尿失禁，给予阿夫唑嗪治疗。药师应告知患者药物的主要不良反应是",opts:["A.尿路感染","B.心动过速","C.毛发竖立","D.直立性低血压","E.卧位和坐位时高血压"],ans:"D",exp:"α肾上腺素受体拮抗剂如阿夫唑嗪的不良反应为头晕、头痛、直立性低血压。"},
    {type:"最佳选择题",q:"29. 患者，男，72岁，因排尿困难、尿频和尿不尽感就诊，诊断为良性前列腺增生症。该患者不宜选用的联合用药是",opts:["A.特拉唑嗪+非那雄胺","B.非那雄胺+奥昔布宁","C.多沙唑嗪+特托罗定","D.坦索罗辛+度他雄胺","E.阿夫唑嗪+索利那新"],ans:"B",exp:"α1受体拮抗剂和5α还原酶抑制剂合用可用于前列腺体积较大的患者。α1受体拮抗剂与M受体拮抗剂合用用于伴发膀胱过度活动症的患者。非那雄胺+奥昔布宁不是常规联合方案。"},
    {type:"最佳选择题",q:"30. 患者，男，70岁，诊断为慢性肾脏病4期，纠正代谢性酸中毒常用的药物是",opts:["A.口服碳酸钙","B.口服氯化铵","C.口服氢氧化铝","D.口服骨化三醇","E.口服碳酸氢钠"],ans:"E",exp:"纠正代谢性酸中毒常用的药物为口服碳酸氢钠。"},
    {type:"最佳选择题",q:"31. 患者，女，52岁，自述乏力、食欲缺乏，查体发现其毛发干枯、指甲扁平，诊断为缺铁性贫血。该患者宜首选的治疗方法是",opts:["A.肌注蔗糖铁100mg qd","B.口服多糖铁复合物1粒qd","C.肌注异麦芽糖酐铁0.5g bid","D.口服维生素C 0.1g tid","E.肌注维生素B12 100μg qd"],ans:"B",exp:"口服铁剂是治疗缺铁性贫血的首选方法。宜选用二价铁剂。"},
    {type:"最佳选择题",q:"32. 下列可用于黑色素瘤的常用靶向治疗药物是",opts:["A.达拉非尼+曲美替尼","B.利妥昔单抗+贝林妥欧单抗","C.艾伏尼布","D.克唑替尼","E.吉非替尼"],ans:"A",exp:"针对靶点BRAF V600，可选用达拉非尼+曲美替尼联合治疗黑色素瘤。"},
    {type:"最佳选择题",q:"33. 患者，男，70岁，近期出现前胸部点状斑疹，逐渐发展为片状，并覆有鳞屑，伴瘙痒感。前往医院就诊后诊断为花斑癣。该患者可以使用的治疗药物不包括",opts:["A.酮康唑洗剂","B.含他康唑乳膏","C.联苯苄唑乳膏","D.伊曲康唑胶囊","E.特比萘芬乳膏"],ans:"E",exp:"花斑癣患者口服特比萘芬片、特比萘芬乳膏均治疗无效。"},
    {type:"最佳选择题",q:"34. 以下治疗类风湿关节炎的生物制剂中，分类与其代表药物不对应的是",opts:["A.肿瘤坏死因子(TNF-α)拮抗剂：依那西普","B.白介素-6(IL-6)拮抗剂：托珠单抗","C.白介素-1(IL-1)拮抗剂：阿那白滞素","D.抗CD20单抗：阿达木单抗","E.JAK通路抑制剂：托法替布"],ans:"D",exp:"抗CD20单抗为利妥昔单抗，阿达木单抗属于TNF-α拮抗剂。"},
    {type:"最佳选择题",q:"35. 患者，男，14岁，近期由于学业压力大，出现视物模糊、眼睛酸痛等症状。关于该患者视疲劳的治疗，说法错误的是",opts:["A.如果为干眼导致的视疲劳，可以使用玻璃酸钠滴眼液","B.如果为睫状肌收缩功能问题引起的视疲劳，可以使用七叶洋地黄双苷滴眼液","C.如果该患者出现近视的前兆，推荐使用1%阿托品滴眼液延缓近视进展","D.如果为眼部微血管痉挛，可以使用托吡卡胺滴眼液","E.患者如果眼部干涩，可使用促进泪液分泌药如地夸磷索钠"],ans:"C",exp:"低浓度(0.01%)的阿托品滴眼液可有效延缓近视进展，而非1%。"},
    {type:"最佳选择题",q:"36. 下列不属于病毒性乙型肝炎常用的药物是",opts:["A.干扰素α","B.去羟肌苷","C.复方甘草酸苷","D.恩替卡韦","E.谷胱甘肽"],ans:"B",exp:"去羟肌苷为治疗艾滋病的核苷酸类逆转录酶抑制剂。"},
    {type:"最佳选择题",q:"37. 患者，女，32岁，18岁时曾无明显诱因突发右侧肢体抽搐，伴双眼向右凝视，口角向右歪斜，呼之能应，不能对答，大小便失禁，持续时间1分钟左右，发作间隔7天左右，诊断为癫痫。给予卡马西平、苯妥英钠口服控制病情，症状缓解后出院。接下来十年间反复发作并进行相关治疗。患者在病情稳定没有复发3年后，前来医院咨询备孕事宜，关于医生对该患者的建议，正确的是",opts:["A.只要规律服用卡马西平、苯妥英钠控制病情，可以备孕","B.建议调整用药，可以考虑使用拉莫三嗪","C.不建议怀孕，因为抗癫痫药妊娠毒性都很强","D.建议在停药后2年备孕","E.如确定要备孕，可以大剂量使用烟酸来预防胎儿相关毒性反应"],ans:"B",exp:"备孕癫痫患者应尽量调整为致畸风险低的药物，如拉莫三嗪。"},
    {type:"最佳选择题",q:"38. 患者，女，52岁，长期缺乏维生素B12导致周围神经系统损伤。维生素B12注射剂每次肌内注射50～200μg，每支规格标识为0.1mg，每次可应用的量是",opts:["A.1/4～1/2支","B.1/2～2支","C.2支以上","D.2～3支","E.3～5支"],ans:"B",exp:"0.1mg=100μg，因此50～200μg即0.5～2支。"},
    {type:"最佳选择题",q:"39. 关于围绝经期综合征的激素治疗，下列说法错误的是",opts:["A.生活方式干预需要在激素治疗的同时进行，对绝经综合征的女性来说非常重要","B.启动激素治疗应尽早开始，并有效预防骨质疏松症、动脉硬化等疾病","C.有子宫的女性在激素治疗过程中无需加用孕激素","D.对于年龄为60岁以上的女性，不建议进行绝经激素治疗","E.仅为改善泌尿生殖系统绝经综合征，建议首选阴道局部雌激素治疗"],ans:"C",exp:"有子宫的女性在补充雌激素时，应加用孕激素以保护子宫内膜。"},
    {type:"最佳选择题",q:"40. 患者，男，42岁，近期由于工作压力及家庭纠纷不堪重负，服用了大量阿普唑仑。关于该患者的中毒解救，不宜使用的药物是",opts:["A.硫酸镁","B.氟马西尼","C.间羟胺","D.硫酸钠","E.去甲肾上腺素"],ans:"A",exp:"苯二氮䓬类药物中毒，避免使用硫酸镁导泻，可能加重病情。"},

    // ===== 二、配伍选择题（41-85） =====
    {type:"配伍选择题",subs:[
      {q:"41. 实验研究结果属于",opts:["A.零级信息","B.一级信息","C.二级信息","D.三级信息","E.四级信息"],ans:"B",exp:"一级信息资源即原创性论著，包括实验研究结果、病例报道以及评价性或描述性的研究结果。"},
      {q:"42. 中国国家处方集属于",opts:["A.零级信息","B.一级信息","C.二级信息","D.三级信息","E.四级信息"],ans:"D",exp:"三级信息资源包括医药图书（工具书、教科书、手册等）、光盘或在线数据库、药学应用软件以及临床实践指南、系统评价或综述型文章等。中国国家处方集属于三级信息。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"43. 在CYP3A的代谢通路中使敏感底物的AUC增加≥5倍的是",opts:["A.辛伐他汀","B.伏立康唑","C.非洛地平","D.卡马西平","E.他克莫司"],ans:"B",exp:"强抑制剂定义为：在特定的代谢通路中使敏感底物的AUC增加≥5倍。属于CYP3A强抑制剂的是伏立康唑。"},
      {q:"44. 在CYP3A的代谢通路中使敏感底物的AUC减少≥80%的是",opts:["A.辛伐他汀","B.伏立康唑","C.非洛地平","D.卡马西平","E.他克莫司"],ans:"D",exp:"强诱导剂的定义为：在特定的代谢通路中使敏感底物的AUC减少≥80%。属于CYP3A强诱导剂的是卡马西平。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"45. 按照兴奋剂管理，且静脉注射属于高警示药品的是",opts:["A.异维A酸","B.氨茶碱","C.胰岛素","D.普萘洛尔","E.等渗氯化钠"],ans:"D",exp:"β受体拮抗剂（洛尔）能消除运动员比赛前的紧张心理，按照兴奋剂管理。静脉注射属于高警示药品。"},
      {q:"46. 普通片剂不属于高警示药品，而注射途径被列入高警示药品的是",opts:["A.异维A酸","B.氨茶碱","C.胰岛素","D.普萘洛尔","E.等渗氯化钠"],ans:"B",exp:"茶碱（静脉途径）为高警示药品，普通片剂非高警示药品。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"47. 适宜清晨给药，可迅速在肠道发挥作用的盐类泻药是",opts:["A.胰酶","B.赛庚啶","C.硫酸镁","D.奥利司他","E.比沙可啶"],ans:"C",exp:"盐类泻药可迅速在肠道发挥作用，适宜清晨给药，如硫酸镁。"},
      {q:"48. 适宜进餐时服用，可减少脂肪的吸收率的药物是",opts:["A.胰酶","B.赛庚啶","C.硫酸镁","D.奥利司他","E.比沙可啶"],ans:"D",exp:"奥利司他适宜进餐时服用，可减少脂肪的吸收率。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"49. 可导致骨质疏松、脱钙，严重者发生骨折，影响生长发育的药物是",opts:["A.维生素A","B.氯霉素","C.阿米卡星","D.糖皮质激素","E.磺胺嘧啶"],ans:"D",exp:"糖皮质激素在影响钙盐吸收的同时还影响骨骼钙盐代谢，导致骨质疏松、脱钙，严重者发生骨折，影响生长发育。"},
      {q:"50. 可导致婴幼儿良性颅压增高、囟门隆起的药物是",opts:["A.维生素A","B.氯霉素","C.阿米卡星","D.糖皮质激素","E.磺胺嘧啶"],ans:"A",exp:"四环素、维生素A等可致婴幼儿良性颅压增高、囟门隆起等。"},
      {q:"51. 可抑制甲状腺激素合成，造成生长发育障碍的药物是",opts:["A.维生素A","B.氯霉素","C.阿米卡星","D.糖皮质激素","E.磺胺嘧啶"],ans:"E",exp:"对氨基水杨酸、磺胺类可抑制甲状腺激素合成，造成生长发育障碍。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"52. 服用华法林的患者，应定期监测的生化指标是",opts:["A.肌酸激酶","B.嗜酸性粒细胞","C.嗜碱性粒细胞","D.国际标准化比值","E.血清淀粉酶"],ans:"D",exp:"应用华法林治疗时必须监测国际标准化比值（INR），并根据INR数值调整华法林用量。"},
      {q:"53. 服用辛伐他汀的患者，应定期监测的生化指标是",opts:["A.肌酸激酶","B.嗜酸性粒细胞","C.嗜碱性粒细胞","D.国际标准化比值","E.血清淀粉酶"],ans:"A",exp:"服用羟甲戊二酰辅酶A还原酶抑制剂（他汀类药物），或他汀类药和贝特类药联合应用可增加肌病的发生危险，表现为肌酸激酶升高。"},
      {q:"54. 服用头孢拉定的患者，血常规检查常出现增多的指标是",opts:["A.肌酸激酶","B.嗜酸性粒细胞","C.嗜碱性粒细胞","D.国际标准化比值","E.血清淀粉酶"],ans:"B",exp:"应用头孢拉定、头孢氨苄、头孢呋辛钠、头孢哌酮等抗生素可导致嗜酸性粒细胞增多。"}
