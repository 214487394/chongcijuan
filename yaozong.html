    ]},

    // ===== 三、综合分析选择题（86-95） =====
    {type:"最佳选择题",q:"86. 医生对患者进行经验抗感染可以考虑使用的药物是",opts:["A.磺胺嘧啶","B.阿奇霉素","C.加替沙星","D.头孢呋辛酯","E.阿米卡星"],ans:"D",exp:"针对社区获得性肺炎的经验抗感染，由于毒性较大及疗效极差，一般不使用磺胺类、氨基糖苷类药物；患者有糖尿病史，不宜选用加替沙星；大环内酯类药物不单独用于肺炎患者的经验性感染治疗，由于耐药率高。故可选用头孢呋辛酯。"},
    {type:"最佳选择题",q:"87. 该患者近期不宜使用的降糖药物是",opts:["A.二甲双胍","B.阿卡波糖","C.格列美脲","D.胰岛素","E.罗格列酮"],ans:"E",exp:"噻唑烷二酮类胰岛素增敏剂如罗格列酮、吡格列酮可引起水肿、上呼吸道感染等不良反应。"},
    {type:"最佳选择题",q:"88. 该患者在使用了常规经验抗感染药物后72h评估病情，发现症状改善不明显，药物效果较差，结合患者的综合情况，在病原学检查结果出来前，可以调整的药物治疗方案是",opts:["A.头孢他啶","B.头孢曲松","C.氯霉素","D.克拉霉素","E.诺氟沙星"],ans:"A",exp:"患者为医院护工，在初始经验抗感染效果不佳的情况下可以考虑铜绿假单胞菌感染，常用药物有头孢他啶、头孢吡肟、头孢哌酮-舒巴坦、亚胺培南、美罗培南等。"},
    {type:"最佳选择题",q:"89. 用于房颤患者血栓栓塞风险评估的指标是",opts:["A.Beers标准","B.CHA2DS2-VASc评分","C.CAT评分","D.CTP评分","E.改良Centor评分"],ans:"B",exp:"对所有房颤患者应用CHA2DS2-VASc评分进行血栓栓塞危险因素评估。"},
    {type:"最佳选择题",q:"90. 经评估，该患者血栓栓塞事件发生风险高，予以达比加群酯进行治疗。关于该患者的用药注意事项，说法正确的是",opts:["A.用药前及用药过程中应监测肾功能，肌酐清除率<30ml/min不推荐使用","B.达比加群酯易引起出血，用药期间应常规监测凝血功能","C.达比加群酯易受药物和食物的影响","D.达比加群酯半衰期长，一周使用一次","E.不宜长期使用达比加群酯，待病情稳定后宜用阿司匹林代替达比加群酯"],ans:"A",exp:"房颤患者应定期复查肾功能，及时调整抗凝治疗方案。肌酐清除率<30ml/min不推荐使用达比加群酯。达比加群酯应用过程中无需常规监测凝血功能；受食物和其他药物的影响小。"},
    {type:"最佳选择题",q:"91. 使用达比加群酯如出现出血，可逆转达比加群酯抗凝活性的药物是",opts:["A.维生素K1","B.鱼精蛋白","C.依达赛珠单抗","D.依洛尤单抗","E.血凝酶"],ans:"C",exp:"依达赛珠单抗能逆转达比加群酯的抗凝活性。"},
    {type:"最佳选择题",q:"92. 经饮食控制和生活方式干预，未能有效控制血糖，该患者可首选的治疗药物是",opts:["A.二甲双胍","B.格列本脲","C.阿卡波糖","D.格列齐特","E.西格列汀"],ans:"A",exp:"2型糖尿病的首选治疗药物是二甲双胍，若无禁忌证，二甲双胍应一直保留在糖尿病的药物治疗方案中。"},
    {type:"最佳选择题",q:"93. 患者近日下肢水肿明显，活动后呼吸困难，应避免选用的药物是",opts:["A.瑞格列奈","B.吡格列酮","C.阿卡波糖","D.沙格列汀","E.艾塞那肽"],ans:"B",exp:"吡格列酮为噻唑烷二酮类胰岛素增敏剂，主要不良反应有肝功能异常、头痛、上呼吸道感染、水肿、体重增加，该类药物与骨折和心力衰竭风险增加有关。"},
    {type:"最佳选择题",q:"94. 该患者可能使用的常见紧急避孕药是",opts:["A.米索前列醇","B.炔诺酮","C.复方左炔诺孕酮","D.戈舍瑞林","E.雷洛昔芬"],ans:"C",exp:"常见紧急避孕药有0.75或1.5mg规格的左炔诺孕酮紧急避孕药，是目前女性最容易也无需处方即可获得的，需在无保护性生活后72h内服用。"},
    {type:"最佳选择题",q:"95. 关于使用复方避孕药后可能出现的不良反应，下列说法错误的是",opts:["A.类早孕反应","B.月经样突破性出血","C.体重增加","D.皮肤褐斑","E.低血压"],ans:"E",exp:"避孕药常见不良反应有类早孕反应、阴道流血、月经量减少或停经、乳房胀痛、体重增加及皮肤褐斑、血压轻微升高等。低血压不是其常见不良反应。"},

    // ===== 四、多项选择题（96-100） =====
    {type:"多项选择题",q:"96. 关于处方的概念和意义，正确的有",opts:["A.处方是医疗活动中关于药品调剂的重要书面文件","B.处方是药品消耗及药品经济收入结账的凭证和原始依据","C.药师具有审核、调配处方权，但无诊断权和修改处方权","D.因调配处方所造成的医疗差错，医师和药师分别负有相等的法律责任","E.处方包括医疗机构病区用药医嘱单"],ans:"ABCE",exp:"处方具有法律性、技术性、经济性。医师具有诊断权和开具处方权，但无调配处方权；药师具有审核、调配处方权，但无诊断权和修改处方权。因开具处方或调配处方所造成的医疗差错或事故，医师和药师分别负有相应的法律责任。处方包括纸质处方、电子处方和医疗机构病区用药医嘱单。"},
    {type:"多项选择题",q:"97. 患者，女，32岁，在户外露营时被蜘蛛咬伤，出现局部红肿、瘙痒。可使用的药物有",opts:["A.氯雷他定片","B.炉甘石洗剂","C.西替利嗪片","D.肝素钠乳膏","E.丁酸氢化可的松乳膏"],ans:"ABCE",exp:"昆虫叮咬可以适当选择外用止痒、消肿药物，炉甘石洗剂可以使用。中度患者加服抗组胺药物，氯雷他定片、西替利嗪片可以使用。重度患者可使用糖皮质激素，丁酸氢化可的松乳膏可以使用。肝素钠乳膏用于早期冻疮、皲裂、溃疡、湿疹及浅表性静脉炎和软组织损伤，不用于昆虫叮咬。"},
    {type:"多项选择题",q:"98. 对于脑梗死患者的治疗，可采用的神经保护与改善脑循环的药物包括",opts:["A.丁基苯肽","B.胞二磷胆碱","C.依达拉奉","D.尼卡地平","E.巴曲酶"],ans:"ABC",exp:"神经保护与改善脑循环的药物目前常用的有丁基苯酞、胞二磷胆碱、依达拉奉。尼卡地平为常用的静脉降压药物；巴曲酶是降纤药物，可用于高纤维蛋白原血症的治疗。"},
    {type:"多项选择题",q:"99. 关于多潘立酮治疗胃食管反流病的用药注意事项，说法正确的有",opts:["A.对于食管下括约肌压力降低、食管动力减弱和胃排空延迟的患者可单独使用多潘立酮","B.中至重度肝功能不全、胃肠道出血、机械性肠梗阻、胃肠穿孔、分泌催乳素的垂体肿瘤患者禁用","C.长期使用多潘立酮可出现乳房胀痛或溢乳现象","D.可引起心电图QT间期轻度延长","E.与氟康唑、伏立康唑、红霉素、克拉霉素、胺碘酮等药物合用会增加尖端扭转型室性心动过速的风险"],ans:"BCDE",exp:"胃食管反流病患者单独使用促动力药物疗效差，PPI效果不佳时，可考虑联合应用促动力药物。中至重度肝功能不全、胃肠道出血、机械性肠梗阻、胃肠穿孔、分泌催乳素的垂体肿瘤患者禁用多潘立酮。长期服用可出现乳房胀痛或溢乳现象。多潘立酮可引起心电图QT间期轻度延长，禁止与显著抑制CYP3A4酶并可能引起QT间期延长的药物合用。"},
    {type:"多项选择题",q:"100. 关于糖尿病的用药注意事项与患者教育，说法正确的有",opts:["A.每次注射胰岛素时应变换注射部位，两次注射点要至少间隔2cm","B.未开启的胰岛素应冷冻保存，冷藏后的胰岛素不可再应用","C.使用中的胰岛素笔芯不宜冷藏，可与胰岛素笔一起使用或随身携带","D.使用中的胰岛素笔芯不宜冷藏，在室温下最长可保存半年时间","E.生活方式干预是2型糖尿病的基础治疗措施，应贯穿于糖尿病治疗的始终"],ans:"ACE",exp:"每次注射胰岛素时应变换注射部位，两次注射点要至少间隔2cm。未开启的胰岛素应冷藏保存，冷冻后的胰岛素不可再应用。使用中的胰岛素笔芯不宜冷藏，可与胰岛素笔一起使用或随身携带，在室温下最长可保存4～6周。生活方式干预是2型糖尿病的基础治疗措施，应贯穿于糖尿病治疗的始终。"}
  ]
},
  {
  name: "押题密卷（六）",
  questions: [
    // ===== 一、最佳选择题（1-40） =====
    {type:"最佳选择题",q:"1. 患儿，男，1岁，为治疗佝偻病，每日需补充维生素D50μg，则每日需补充维生素D多少单位",opts:["A.200U","B.400U","C.800U","D.2000U","E.4000U"],ans:"D",exp:"维生素D每40000U=1mg，即每400U=10μg。每50μg=2000U。"},
    {type:"最佳选择题",q:"2. 药师调配处方时应做到“四查十对”，下列说法中，错误的是",opts:["A.查处方，对科别、姓名、年龄","B.查药品，对药名、剂型、规格、数量","C.查配伍禁忌，对药品性状、用法与用量","D.查用药合理性，对临床诊断","E.查医师资质，对用药适宜性"],ans:"E",exp:"“四查十对”：查处方，对科别、姓名、年龄；查药品，对药名、剂型、规格、数量；查配伍禁忌，对药品性状、用法与用量；查用药合理性，对临床诊断。"},
    {type:"最佳选择题",q:"3. 下列关于家庭保健的说法，错误的是",opts:["A.针对急病，家庭药箱需准备常见的急救用药如硝酸甘油、沙丁胺醇气雾剂","B.常见小病尽量不选择使用任何药物","C.常用眼用制剂打开后使用≤4周","D.家中进行雾化吸入前后需漱口","E.家庭药箱需远离儿童触及区域"],ans:"B",exp:"家庭药箱的配备原则为急病急用、小病便用、避免药物资源浪费，并非常见小病尽量不使用任何药物。"},
    {type:"最佳选择题",q:"4. 根据药品的适宜服用时间，建议餐前服用的药物是",opts:["A.二甲双胍","B.熊去氧胆酸","C.多潘立酮","D.西咪替丁","E.吲哚美辛"],ans:"C",exp:"多潘立酮餐前服用。二甲双胍、熊去氧胆酸餐中服用。西咪替丁、吲哚美辛餐后服用。"},
    {type:"最佳选择题",q:"5. 下列关于老年人药效学的说法，错误的是",opts:["A.与青年人相比，老年人作用于中枢神经系统的药物更敏感","B.β受体拮抗剂与沙丁胺醇合用可增加两者药效","C.老年人身体内环境稳定调节功能降低","D.同龄老年人个体间的用药剂量可相差数倍之多","E.老年人主动脉的弹性下降"],ans:"B",exp:"沙丁胺醇为β2受体激动剂，与β受体拮抗剂合用可使两者药效均降低。"},
    {type:"最佳选择题",q:"6. 患者，男，66岁，严重肾功能衰竭3年，每周透析2～3次。近期寻得合适的肾源，并成功进行了肾移植手术。手术后，该患者身体状况逐渐好转，下列用药指导中，错误的是",opts:["A.环孢素受食物影响小","B.他克莫司建议空腹给药","C.吗替麦考酚酯建议与食物同服","D.咪唑立宾建议保持固定的给药方案","E.西罗莫司不得压碎、咀嚼或掰开"],ans:"C",exp:"吗替麦考酚酯建议空腹给药。"},
    {type:"最佳选择题",q:"7. 关于对患者的疾病管理和健康教育，下列说法错误的是",opts:["A.对于高血压患者，应告知低盐饮食","B.对于记忆力差的老年患者，可使用分时药盒","C.对于糖尿病患者，从饮食、运动上严格管理，戒烟限酒，监测血糖","D.对于近期睡眠障碍的老年患者，建议使用长效苯二氮䓬类镇静催眠药","E.对于骨质疏松症患者，在补钙治疗的同时应告知其适当增加户外运动，多晒太阳"],ans:"D",exp:"对于睡眠障碍的患者，建议使用短效非苯二氮䓬类镇静催眠药。"},
    {type:"最佳选择题",q:"8. 关于骨折与扭伤，下列说法不正确的是",opts:["A.骨折通常会出现剧烈疼痛","B.针对扭伤，通常使用非甾体抗炎药口服或外用","C.如遇到骨折患者，尽量使患者的患肢不要承重或改变姿势","D.开放性骨折可能需要预防性给予抗生素及按需接种破伤风疫苗","E.骨折的治疗药物较少，可常规使用强效广谱抗生素进行治疗"],ans:"E",exp:"骨折与扭伤的治疗药物较少，主要为镇痛药物，如非甾体抗炎药口服或外用等。开放性骨折有发生骨髓炎的风险，可能需要预防性给予抗生素并按需接种破伤风疫苗，但不常规使用强效广谱抗生素。"},
    {type:"最佳选择题",q:"9. 患者，女，16岁，近日出现发热、腹泻伴有脓血便，血常规检查：白细胞计数11.2×10^9/L。该患者可使用的药物是",opts:["A.洛哌丁胺","B.诺氟沙星","C.莫沙必利","D.膳食纤维","E.口服补液盐III"],ans:"E",exp:"18岁以下禁用喹诺酮类（诺氟沙星）。洛哌丁胺对于伴发热或明显腹痛等疑似炎性腹泻以及血性腹泻的患者应避免使用。莫沙必利、膳食纤维用于治疗便秘。口服补液盐III可用于腹泻补液。"},
    {type:"最佳选择题",q:"10. 患者，女，25岁，近日因过度用眼出现眼皮痉挛，眼部不适。该患者可使用的药物是",opts:["A.色甘酸钠滴眼液","B.利巴韦林滴眼液","C.山莨菪碱滴眼液","D.氧氟沙星滴眼液","E.玻璃酸钠滴眼液"],ans:"C",exp:"抗胆碱能滴眼液如山莨菪碱滴眼液能减轻眼部平滑肌及血管痉挛，改善局部微循环。"},
    {type:"最佳选择题",q:"11. 患者，女，32岁，皮肤瘙痒，出现“风疙瘩”，诊断为急性荨麻疹，该患者可首选的治疗药物是",opts:["A.奥马珠单抗","B.甲氧沙林","C.羟氯喹","D.左西替利嗪","E.泼尼松"],ans:"D",exp:"荨麻疹首选第二代非镇静抗组胺药，包括西替利嗪、左西替利嗪、氯雷他定、依巴斯汀、咪唑斯汀、奥洛他定等。"},
    {type:"最佳选择题",q:"12. 患者，男，41岁，BMI 30.7kg/m²，脂肪肝，伴有3级高血压、2型糖尿病。患者使用了某药物一段时间后出现皮脂溢出增多、胃肠胀气、油样便，引起该症状的药物是",opts:["A.厄贝沙坦","B.谷胱甘肽","C.二甲双胍","D.奥利司他","E.熊去氧胆酸"],ans:"D",exp:"奥利司他15%～30%的患者可出现不良反应，包括皮脂溢出增多、胃肠胀气、便急、便失禁和油样便。"},
    {type:"最佳选择题",q:"13. 患者，男，69岁，糖尿病病史15年，慢性支气管炎病史20年，有滥用抗生素史，4周前因肺部感染入住重症监护病房，且痰培养结果为产ESBL肠杆菌科细菌。本次因受凉后咳嗽、咳黄脓痰，伴发热4天入院。查体：体温39.2℃，双肺可闻及湿性啰音。实验室检查结果：白细胞计数17.1×10^9/L，中性粒细胞百分比88%。胸部X线：双肺下叶渗出影。入院诊断：社区获得性肺炎。青霉素皮试(+)。该患者经验性抗感染适宜选择的治疗药物是",opts:["A.头孢呋辛+阿奇霉素","B.左氧氟沙星+多西环素","C.万古霉素","D.哌拉西林-他唑巴坦","E.亚胺培南-西司他丁"],ans:"E",exp:"针对该患者既往痰培养结果，可判断此次仍然感染产ESBL肠杆菌科细菌，应选择能抗产ESBL肠杆菌科细菌的药物，该患者有青霉素过敏史，不宜选择哌拉西林-他唑巴坦，可选择碳青霉烯类如亚胺培南-西司他丁。"},
    {type:"最佳选择题",q:"14. 患者，男，70岁，有慢性阻塞性肺疾病病史10年，为改善肺功能和呼吸困难症状，减少COPD急性加重风险，在病情稳定期每日2次吸入给药且起效特别快的支气管舒张剂是",opts:["A.福莫特罗","B.萨达特罗","C.噻托溴铵","D.奥达特罗","E.特布他林"],ans:"A",exp:"福莫特罗起效快，一日2次给药。"},
    {type:"最佳选择题",q:"15. 患者，男，67岁，晨起出现头痛、呕吐、偏瘫、失语、共济失调等症状，紧急就医，诊断为缺血性脑卒中。下列情况中，可进行静脉溶栓治疗的是",opts:["A.近2周内进行过大的外科手术","B.既往有颅内出血","C.近3个月内有脑卒中或心肌梗死病史","D.血小板计数>300×10^9/L","E.严重心、肝、肾功能不全"],ans:"D",exp:"静脉溶栓的禁忌证包括：近2周内进行过大的外科手术、既往有颅内出血、近3个月内有脑卒中或心肌梗死病史、严重心、肝、肾功能不全、血小板计数<100×10^9/L等。血小板计数>300×10^9/L不在禁忌范围内。"},
    {type:"最佳选择题",q:"16. 患者，男，56岁，冠心病病史11年。晚餐后散步途中突然出现心前区绞痛，放射到左后肩。该患者可以首选的药物是",opts:["A.单硝酸异山梨酯","B.伐地那非","C.阿司匹林","D.硝酸异山梨酯","E.利伐沙班"],ans:"D",exp:"冠心病急性发作时首选硝酸酯类药物，但是单硝酸异山梨酯不适宜治疗心绞痛急性发作，适于慢性长期治疗。硝酸异山梨酯可用于急性发作。"},
    {type:"最佳选择题",q:"17. 患者，女，72岁，冠心病病史12年，高血压病史24年，右心衰竭2年。下列药物中，该患者不适宜选用的是",opts:["A.维拉帕米","B.沙库巴曲缬沙坦","C.螺内酯","D.依普利酮","E.比索洛尔"],ans:"A",exp:"维拉帕米、地尔硫䓬有心功能抑制作用，可加重心衰患者病情，禁用于心衰患者。"},
    {type:"最佳选择题",q:"18. 关于心房颤动的抗凝治疗方案，下列说法错误的是",opts:["A.普通肝素使用时必须监测凝血功能，以APTT结果来调整剂量","B.低分子肝素一般选择肌内注射，需注意切忌皮下注射","C.华法林在治疗2～3日后测定INR，稳定在2.0～3.0之间","D.利伐沙班对轻中度肾功能不全的患者可正常使用，无需调整剂量","E.达比加群酯无需常规监测凝血功能"],ans:"B",exp:"普通肝素及低分子肝素选择皮下注射，避免肌内注射，因肌注后易形成局部血肿影响吸收。"},
    {type:"最佳选择题",q:"19. 患者，男，63岁，高血压病史14年。某日清晨醒后发现左侧肢体不能活动，急送医院，血压为190/110mmHg，头颅CT检查结果为脑出血。当患者同时伴有颅内压升高时，应给予的药物是",opts:["A.拉贝洛尔静脉滴注","B.氨基己酸静脉滴注","C.硝酸甘油舌下含服","D.甘露醇静脉滴注","E.呋塞米嚼碎服用"],ans:"D",exp:"颅内压升高者，需要脱水降颅压时，应给予甘露醇静脉滴注。"},
    {type:"最佳选择题",q:"20. 关于癫痫患者的药物治疗原则，说法错误的是",opts:["A.应依据癫痫发作类型和综合征分类选择抗癫痫药物","B.小剂量起始，滴定增量，长期规律用药","C.初始药物治疗尽可能联合用药，减轻药物的不良反应","D.应逐渐停药，注意一次只能撤停一种药","E.个体化给药，有条件者应测定药物的血浆浓度"],ans:"C",exp:"初始药物治疗为单药治疗，至少2种或2种以上的单药治疗失败后再考虑联合治疗。"},
    {type:"最佳选择题",q:"21. 患者，女，45岁，近期因家庭琐事罹患轻度焦虑，并因此出现间歇性失眠。有关患者的用药教育和指导，说法正确的是",opts:["A.首选唑吡坦，不宜选用苯二氮䓬类药物","B.以抗焦虑药物为主，必要时在睡前加用镇静催眠药物","C.服用文拉法辛治疗，并关注低血压、性欲亢进等不良反应","D.服用坦度螺酮治疗，起效快，通常可在数分钟至数小时内缓解情绪症状","E.服用β受体激动剂治疗，快速缓解心悸、震颤、心动过速等躯体性症状"],ans:"B",exp:"焦虑障碍患者存在失眠时，以抗焦虑药物为主，必要时在睡前加用镇静催眠药物。"},
    {type:"最佳选择题",q:"22. 患者，男，34岁，由于工作原因进食不规律，喜食烧烤、油炸食品等路边摊。1个月前频繁出现空腹时腹痛，同时有恶心、厌食、腹胀，前往医院就诊后查13C呼气试验阳性，诊断为十二指肠溃疡，Hp（+）。该患者在进行抗Hp四联疗法几天后，出现尿液变色，最有可能引起该症状的药物是",opts:["A.阿莫西林","B.克拉霉素","C.奥美拉唑","D.甲硝唑","E.枸橼酸铋钾"],ans:"D",exp:"根除方案中甲硝唑可引起尿液变色，与酒精可发生“双硫仑样反应”。"},
    {type:"最佳选择题",q:"23. 患者，女，42岁，胆石症3年，近半年来间断性下腹痛，大量饮水后症状可缓解。前来医院就诊，B超显示胆结石直径小，胆囊功能较好。医生推荐患者使用可显著降低胆汁中胆固醇，利于结石中胆固醇逐渐溶解，且可加速胆固醇从胆囊向肠道排泄清除的药物是",opts:["A.熊去氧胆酸","B.匹维溴铵","C.头孢曲松","D.消炎利胆片","E.奥利司他"],ans:"A",exp:"熊去氧胆酸可抑制肝脏胆固醇的合成，显著降低胆汁中胆固醇，利于结石中胆固醇逐渐溶解且可加速胆固醇从胆囊向肠道排泄清除。"},
    {type:"最佳选择题",q:"24. 患者，女，26岁，近半年来食欲亢进，多汗，体重明显减轻，伴有乏力、心悸，查FT3、FT4偏高，TSH<0.1mU/L，临床诊断为甲状腺功能亢进症。该患者可选用的治疗药物不包括",opts:["A.甲巯咪唑","B.卡比马唑","C.普萘洛尔","D.丙硫氧嘧啶","E.左甲状腺素钠"],ans:"E",exp:"左甲状腺素钠为甲减的治疗药物，不用于甲亢。"},
    {type:"最佳选择题",q:"25. 胰岛素治疗是控制高血糖的重要手段。关于胰岛素起始治疗的条件，说法错误的是",opts:["A.1型糖尿病患者在发病时就需要胰岛素治疗","B.新发2型糖尿病患者如有明显的高血糖症状、发生酮症或酮症酸中毒时需要胰岛素治疗","C.新诊断的糖尿病患者分型困难，与1型糖尿病难以鉴别时需要胰岛素治疗","D.2型糖尿病患者在生活方式干预和口服降糖药治疗的基础上，仍未达到控制目标时需要胰岛素治疗","E.在糖尿病病程中（新诊断的2型糖尿病除外），出现无明显诱因的体重显著下降时需要胰岛素治疗"],ans:"E",exp:"在糖尿病病程中(包括新诊断的2型糖尿病)，出现无明显诱因的体重显著下降时应该尽早使用胰岛素治疗。"},
    {type:"最佳选择题",q:"26. 在原发性骨质疏松症的药物治疗中，说法错误的是",opts:["A.降钙素对骨质疏松症及骨折引起的骨痛有效","B.肌注鱼降钙素前需停用钙剂和维生素D数周","C.双膦酸盐类药物可导致一过性“流感样”症状","D.有食管裂孔疝、消化性溃疡者不宜应用双膦酸盐类药物","E.地舒单抗为短效作用药物，不存在“药物假期”"],ans:"B",exp:"皮下或肌注鲑鱼降钙素前需补充钙剂和维生素D数日，而非停用。"},
    {type:"最佳选择题",q:"27. 对尿路感染的患者进行用药指导与教育，下列说法错误的是",opts:["A.多饮水、勤排尿","B.注意会阴部清洁","C.推荐应用氨基糖苷类药物","D.服用磺胺类药物时应多喝水","E.选择对尿路选择性强的药物"],ans:"C",exp:"氨基糖苷类抗菌药物有肾毒性，应慎用。"},
    {type:"最佳选择题",q:"28. 患者，男，56岁，有闭角型青光眼病史，近日出现不能控制的尿频、尿急、夜尿增多的现象，诊断为急迫性尿失禁，给予米拉贝隆治疗。药师应告知患者该药物的主要不良反应是",opts:["A.直立性低血压","B.尿潴留","C.视物模糊、心动过速","D.鼻咽炎和尿路感染","E.性功能降低"],ans:"D",exp:"米拉贝隆属于β3肾上腺素受体激动剂，不良反应包括高血压、鼻咽炎和尿路感染等。"},
    {type:"最佳选择题",q:"29. 患者，男，69岁，患冠心病伴慢性肾脏病，GFR<30ml/(min·1.73m²)，该患者服用他汀类药物，最易引起的风险是",opts:["A.肺病","B.肌病","C.溃疡病","D.高血脂","E.白内障"],ans:"B",exp:"CKD患者是他汀类引起肌病的高危人群，尤其在GFR<30ml/min患者中，应避免大剂量应用。"},
    {type:"最佳选择题",q:"30. 患者，男，41岁，诊断为早泄，可首选的治疗药物是",opts:["A.甲睾酮","B.他达拉非","C.度洛西汀","D.曲唑酮","E.达泊西汀"],ans:"E",exp:"达泊西汀是国内唯一获批早泄适应证的口服药物。"},
    {type:"最佳选择题",q:"31. 患者，女，29岁，因缺铁性贫血予以硫酸亚铁片进行治疗，患者服药后出现明显不适拒绝继续服药，拟考虑注射治疗，可选择的治疗药物是",opts:["A.乳酸亚铁","B.亚叶酸钙","C.富马酸亚铁","D.葡萄糖酸亚铁","E.羧基麦芽糖铁"],ans:"E",exp:"胃肠道反应重或经胃肠不能吸收，或需快速补铁的情况下，可以选择静脉补铁治疗。静脉注射铁剂有第二代铁剂如低分子量右旋糖酐铁和蔗糖铁、第三代铁剂如羧基麦芽糖铁和异麦芽糖酐铁。"},
    {type:"最佳选择题",q:"32. 可引起尿频、尿急、尿痛及尿出血等不良反应，需采取美司钠减轻症状的抗肿瘤药物是",opts:["A.奥沙利铂","B.环磷酰胺","C.卡培他滨","D.氟尿嘧啶","E.伊立替康"],ans:"B",exp:"环磷酰胺可引起出血性膀胱炎，需使用美司钠进行治疗。"},
    {type:"最佳选择题",q:"33. 患者，男，42岁，皮肤干燥、湿疹样皮疹、剧烈瘙痒、红肿和脱屑等症状持续4个月，遂来就医，诊断为特应性皮炎。该患者适宜选择的外用治疗药物是",opts:["A.芬太尼透皮贴剂","B.特比萘芬乳膏","C.氯雷他定片","D.丙酸氟替卡松乳膏","E.炉甘石洗剂"],ans:"D",exp:"糖皮质激素目前仍是我国治疗特应性皮炎的一线药物。"},
    {type:"最佳选择题",q:"34. 患者，男，68岁，帕金森病史7年，长期规律使用复方左旋多巴控制病情。近期出现病情反复的症状，前往医院复查后诊断为帕金森剂峰异动症。下列有关治疗方案的调整，说法正确的是",opts:["A.增加每次复方左旋多巴的剂量","B.加用艾司唑仑控制症状","C.将复方左旋多巴常释剂换成缓释剂","D.停用复方左旋多巴数日，症状改善后继续用药","E.加用金刚烷胺改善症状"],ans:"E",exp:"针对剂峰异动症，可减少每次复方左旋多巴的剂量、同时加用金刚烷胺或普拉克索或恩他卡朋。"},
    {type:"最佳选择题",q:"35. 患者，女，35岁，乙肝病史3年，规律使用恩替卡韦进行治疗。近期发现自己怀孕，遂前往医院咨询医生用药情况。关于该患者的用药方案调整，下列说法正确的是",opts:["A.无需调整用药，继续使用恩替卡韦","B.将恩替卡韦换成干扰素α","C.将恩替卡韦换成富马酸丙酚替诺福韦","D.将恩替卡韦换成富马酸替诺福韦酯","E.在使用恩替卡韦的基础上，加用干扰素α"],ans:"D",exp:"针对妊娠女性，可以使用富马酸替诺福韦酯进行治疗，安全性较高。"},
    {type:"最佳选择题",q:"36. 对于疾病终末期的患者，安宁疗护或终末期照护中的药物管理原则，说法正确的是",opts:["A.应先考虑对因治疗，再考虑对症治疗","B.尽可能联合用药，并优先选择新药","C.患者有权选择符合本人意愿的医疗方案","D.停用有不良反应的药品","E.按规律服用他汀类药物，并额外补充保健品"],ans:"C",exp:"与患方的沟通十分重要，患者有权选择符合本人意愿的医疗方案。"},
    {type:"最佳选择题",q:"37. 患者，女，69岁，高血压病史4年，心力衰竭病史1年。长期服用依那普利、美托洛尔、螺内酯联合控制症状，并定期监测血钾。近2周无明显诱因出现刺激性干咳，无法耐受，医师建议改用沙库巴曲缬沙坦继续治疗。有关药师给予的用药指导，说法正确的是",opts:["A.停用螺内酯36小时后再开始服用，起始剂量100mg，每日2次","B.停用美托洛尔36小时后再开始服用，起始剂量100mg，每日2次","C.停用依那普利36小时后再开始服用，起始剂量100mg，每日2次","D.停用美托洛尔12小时后再开始服用，起始剂量2.5mg，每日2次","E.停用依那普利12小时后再开始服用，起始剂量2.5mg，每日2次"],ans:"C",exp:"如果从ACEI转换成ARNI，必须在停止ACEI治疗>36小时之后才能开始应用。"},
    {type:"最佳选择题",q:"38. 患者，女，28岁，身高165cm，体重73.5kg，因多毛、月经紊乱就医，诊断为多囊卵巢综合征，医师处方二甲双胍缓释片。患者在药房拿药后对使用该药有疑问，药师向其介绍二甲双胍的作用，说法不正确的是",opts:["A.可增加胰岛素敏感性，改善胰岛素抵抗","B.可降低血胰岛素水平而矫正高雄激素状态","C.可改善卵巢排卵功能、提高促排卵疗效","D.在一定程度上可降低体重","E.可调整月经周期、预防子宫内膜增生"],ans:"E",exp:"二甲双胍不能调整月经周期、预防子宫内膜增生。PCOS患者调整月经周期应定期合理使用激素类药物。"},
    {type:"最佳选择题",q:"39. 关于女性使用避孕药的注意事项，说法不正确的是",opts:["A.如需更换避孕方法，建议在月经来潮后的5天内开始使用新避孕方法，否则需要在一段时间内合用避孕措施","B.有吸烟、偏头痛、高血压等情况的女性不建议使用复方口服避孕药，一般首选宫内节育系统、皮下埋植剂和绝育术","C.左炔诺孕酮等紧急避孕药在肥胖女性中的效果较差甚至无效","D.短效复方口服避孕药于停药3个月后可妊娠，长效复方口服避孕药建议停药更长时间后妊娠","E.年龄≥50岁者在其末次月经周期后继续采取避孕措施1年，50岁以下的女性在其末次月经周期后继续采取避孕措施2年"],ans:"D",exp:"短效复方口服避孕药于停药后即可妊娠，但妊娠期间禁用本品。长效复方口服避孕药建议停药一定时间后妊娠较为安全。"},
    {type:"最佳选择题",q:"40. 患者，男，50岁，误食大量含亚硝酸盐食物后出现头痛、头晕、呼吸急促，全身皮肤黏膜呈蓝灰色，诊断为高铁血红蛋白血症，可使用的解毒剂是",opts:["A.青霉胺","B.小剂量亚甲蓝","C.维生素K1","D.硫代硫酸钠","E.纳洛酮"],ans:"B",exp:"亚甲蓝(美蓝)用于氰化物中毒，小剂量可治疗高铁血红蛋白血症(亚硝酸盐中毒等)。"},

    // ===== 二、配伍选择题（41-85） =====
    {type:"配伍选择题",subs:[
      {q:"41. 静脉注射速度过快，可见面部潮红、出汗、胸闷、血压下降，甚至虚脱等，提示应予注意，并尽量选择肌内注射的药物是",opts:["A.奥沙利铂","B.维生素K","C.红霉素","D.瑞替普酶","E.头孢曲松钠"],ans:"B",exp:"维生素K静脉注射速度过快，可见面部潮红、出汗、胸闷、血压下降，甚至虚脱等，提示应予注意，并尽量选择肌内注射。"},
      {q:"42. 静脉滴注时可溶解于5%葡萄糖注射液40～100ml中，静脉滴注时间宜控制在0.4～0.5小时，与复方乳酸钠葡萄糖注射液直接混合，可出现白色细微浑浊或沉淀的药物是",opts:["A.奥沙利铂","B.维生素K","C.红霉素","D.瑞替普酶","E.头孢曲松钠"],ans:"E",exp:"头孢曲松钠不宜与含钙注射液(葡萄糖酸钙注射液、氯化钙注射液、复方氯化钠注射液、乳酸钠林格注射液、复方乳酸钠葡萄糖注射液)直接混合，因可产生头孢曲松钙的白色细微浑浊或沉淀。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"43. 患者，男，56岁，高血压病史8年。近期由于血压反复升高，自行使用苯磺酸氨氯地平和维拉帕米进行治疗，这种情况属于",opts:["A.慎用","B.合理用药","C.过度治疗用药","D.重复用药","E.无适应证用药"],ans:"D",exp:"“重复用药”是指同时联用两种或两种以上同一机制的药物、使用的几种药物含有相同成分且剂量总和超过正常限额。氨氯地平维拉帕米同属钙通道阻滞剂，不宜同时使用。"},
      {q:"44. 患者，女，61岁，既往有脑卒中病史，癫痫病史。近期由于出现记忆力减退、丢三落四等情况前来就诊，诊断为阿尔茨海默病，早晚使用卡巴拉汀治疗，这种情况属于",opts:["A.慎用","B.合理用药","C.过度治疗用药","D.重复用药","E.无适应证用药"],ans:"A",exp:"胆碱酯酶抑制剂多奈哌齐、卡巴拉汀、加兰他敏慎用于哮喘、癫痫或COPD患者。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"45. 卡那霉素注射剂要求储存在阴凉处，对应的温度为",opts:["A.15℃-35℃","B.2℃-8℃","C.10℃-30℃","D.不超过20℃"],ans:"D",exp:"如标明“阴凉处”贮存，则应贮存在不超过20℃的环境中。"},
      {q:"46. 右旋糖酐铁口服液要求常温条件下储存，对应的温度为",opts:["A.15℃-35℃","B.2℃-8℃","C.10℃-30℃","D.不超过20℃"],ans:"C",exp:"一般药品贮存于常温(10℃～30℃)即可。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"47. 患者，女，71岁，患有蚕豆病，若使用磺胺甲噁唑-甲氧苄啶，可能产生的药源性疾病类型是",opts:["A.A型药源性疾病","B.B型药源性疾病","C.C型药源性疾病","D.D型药源性疾病","E.E型药源性疾病"],ans:"B",exp:"B型药源性疾病一般为剂量不相关的药源性疾病，是与药物本身药理作用无关的异常反应，临床表现包括变态反应、特异质反应。蚕豆病为葡萄糖-6-磷酸脱氢酶缺乏，不宜使用伯氨喹、磺胺等药物。"},
      {q:"48. 患者，男，42岁，因转移性非小细胞肺癌使用吉非替尼治疗，2天后出现恶心、呕吐、腹泻的症状，此症状随剂量增加而加重，这种情况属于何种药源性疾病类型",opts:["A.A型药源性疾病","B.B型药源性疾病","C.C型药源性疾病","D.D型药源性疾病","E.E型药源性疾病"],ans:"A",exp:"A型药源性疾病为剂量相关的药源性疾病，是致病药物本身的药理作用增强和持续发展的结果。抗肿瘤药物常见的不良反应如消化道反应随剂量增加而加重，归属于A型药源性疾病。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"49. 属于细胞毒性T淋巴细胞相关抗原4-免疫球蛋白的药物是",opts:["A.甲氨蝶呤","B.托法替布","C.阿巴西普","D.利妥昔单抗","E.阿达木单抗"],ans:"C",exp:"细胞毒性T淋巴细胞相关抗原4-免疫球蛋白(CTLA4-Ig)阿巴西普，用于治疗病情较重或TNF-α拮抗剂反应欠佳的患者。"},
      {q:"50. 属于抗CD20单抗的药物是",opts:["A.甲氨蝶呤","B.托法替布","C.阿巴西普","D.利妥昔单抗","E.阿达木单抗"],ans:"D",exp:"抗CD20单抗的代表药物为利妥昔单抗，主要用于TNF-α拮抗剂疗效欠佳的活动性类风湿关节炎。"},
      {q:"51. 口服、肌注或静注均有效，多采用每周1次给药的药物是",opts:["A.甲氨蝶呤","B.托法替布","C.阿巴西普","D.利妥昔单抗","E.阿达木单抗"],ans:"A",exp:"甲氨蝶呤(MTX)口服、肌注或静注均有效，多采用每周1次给药，常用剂量为7.5～25mg/w。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"52. 甲状腺功能异常的患者可根据何种指标来调整给药方案",opts:["A.CrCl","B.APTT","C.CRP","D.TSH","E.RBC"],ans:"D",exp:"TSH为促甲状腺激素，在甲亢时该指标降低，甲减时该指标升高。"},
      {q:"53. 高热、疑似感染的患者可根据何种指标来调整给药方案",opts:["A.CrCl","B.APTT","C.CRP","D.TSH","E.RBC"],ans:"C",exp:"CRP为C反应蛋白，初步用于鉴别细菌性感染与非细菌性感染。"},
      {q:"54. 肾功能障碍的患者可根据何种指标来调整给药方案",opts:["A.CrCl","B.APTT","C.CRP","D.TSH","E.RBC"],ans:"A",exp:"CrCl为肌酐清除率，肾功能障碍的患者可根据肌酐清除率来调整给药方案。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"55. 可能带来严重神经精神事件风险，包括抑郁、自残、自杀倾向的药物是",opts:["A.鼻用减充血剂","B.鼻用第二代抗组胺药","C.口服第一代抗组胺药","D.肥大细胞膜稳定剂","E.白三烯受体拮抗剂"],ans:"E",exp:"白三烯受体拮抗剂的安全性和耐受性良好。但美国FDA增加黑框警告：此类药可能带来严重神经精神事件风险，包括抑郁、自残、自杀倾向。"},
      {q:"56. 疗程过长或用药过频可导致反跳性鼻黏膜充血，易发生药物性鼻炎的药物是",opts:["A.鼻用减充血剂","B.鼻用第二代抗组胺药","C.口服第一代抗组胺药","D.肥大细胞膜稳定剂","E.白三烯受体拮抗剂"],ans:"A",exp:"鼻用减充血剂的常见不良反应有鼻腔干燥、烧灼感和针刺感等，疗程过长或用药过频可导致反跳性鼻黏膜充血，易发生药物性鼻炎。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"57. 患者，女，72岁，因重症肺炎入住重症监护病房，经验性抗感染适宜选择的药物是",opts:["A.替考拉宁","B.多西环素+左氧氟沙星","C.莫西沙星","D.阿莫西林-克拉维酸钾+阿奇霉素","E.克林霉素+阿米卡星"],ans:"D",exp:"对于需要入住重症监护室的重症CAP患者，推荐以β-内酰胺类为基础的联合方案，联合大环内酯类或喹诺酮类。"},
      {q:"58. 患者，男，69岁，因肺部感染入院治疗，经验性抗感染治疗3天效果不佳，痰培养结果为耐甲氧西林金黄色葡萄球菌，适宜选择的药物是",opts:["A.替考拉宁","B.多西环素+左氧氟沙星","C.莫西沙星","D.阿莫西林-克拉维酸钾+阿奇霉素","E.克林霉素+阿米卡星"],ans:"A",exp:"耐甲氧西林金黄色葡萄球菌感染所导致的社区获得性肺炎可选用万古霉素、替考拉宁、利奈唑胺抗感染治疗。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"59. 患者，女，61岁，2小时前出现心绞痛症状，诊断为冠状动脉痉挛导致的变异型心绞痛，适宜选择的药物是",opts:["A.美托洛尔","B.硝酸甘油","C.曲美他嗪","D.伊伐布雷定","E.地尔硫䓬"],ans:"E",exp:"CCB为变异型心绞痛的一线治疗药物，可以选用地平类药物或维拉帕米、地尔硫䓬。"},
      {q:"60. 患者，男，80岁，帕金森病史7年，1小时前出现急性心绞痛发作，不适宜选择的药物是",opts:["A.美托洛尔","B.硝酸甘油","C.曲美他嗪","D.伊伐布雷定","E.地尔硫䓬"],ans:"C",exp:"曲美他嗪可促进葡萄糖的氧化供能，改善心肌缺血及左心功能，但禁用于帕金森病、其他类型的震颤等运动障碍者。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"61. 患者，男，51岁，TC8.2mmol/L，TG1.2mmol/L，针对患者的血脂异常，适宜首选的药物是",opts:["A.苯扎贝特","B.阿托伐他汀","C.烟酸缓释片","D.依折麦布","E.英克司兰"],ans:"B",exp:"总胆固醇正常值应<5.2mmol/L，三酰甘油正常值应<1.7mmol/L，该患者为高胆固醇血症，首选他汀类药物进行治疗。"},
      {q:"62. 患者，女，47岁，TC4.4mmol/L，TG4.3mmol/L，针对患者的血脂异常，适宜选用的药物是",opts:["A.苯扎贝特","B.阿托伐他汀","C.烟酸缓释片","D.依折麦布","E.英克司兰"],ans:"A",exp:"该患者为高三酰甘油血症，首选贝特类药物进行治疗。"},
      {q:"63. 患者，男，62岁，TC6.2mmol/L，TG1.6mmol/L，经首选调脂药物治疗后效果不佳，可联用的口服药物是",opts:["A.苯扎贝特","B.阿托伐他汀","C.烟酸缓释片","D.依折麦布","E.英克司兰"],ans:"D",exp:"针对高胆固醇血症的患者，首选他汀类药物如效果不佳，可联合使用依折麦布。英克司兰为注射给药。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"64. 不宜晚间服用，不良反应有幻觉、精神紊乱的药物是",opts:["A.左旋多巴","B.恩他卡朋","C.普拉克索","D.文拉法辛","E.金刚烷胺"],ans:"E",exp:"金刚烷胺不宜晚间服用，不良反应有幻觉、精神紊乱。"},
      {q:"65. 尤其适用于早发型帕金森病患者的病程初期，体位性低血压、幻觉、食欲亢进、性欲亢进等不良反应发生率较高的药物是",opts:["A.左旋多巴","B.恩他卡朋","C.普拉克索","D.文拉法辛","E.金刚烷胺"],ans:"C",exp:"普拉克索尤其适用于早发型帕金森病患者的病程初期，体位性低血压、足踝部水肿和精神异常的发生率较高。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"66. 在溃疡性结肠炎的治疗药物中，属于5-ASA前体药物，可用于葡萄糖-6-磷酸脱氢酶缺乏症患者的是",opts:["A.柳氮磺吡啶","B.奥沙拉秦","C.环孢素A","D.英夫利昔单抗","E.泼尼松"],ans:"B",exp:"奥沙拉秦为5-ASA的前体药物，无磺胺结构，可安全用于葡萄糖-6-磷酸脱氢酶缺乏症患者，该类患者禁用柳氮磺吡啶。"},
      {q:"67. 在溃疡性结肠炎的治疗药物中，属于生物制剂，作为目前较为有效的诱导及维持缓解的药物是",opts:["A.柳氮磺吡啶","B.奥沙拉秦","C.环孢素A","D.英夫利昔单抗","E.泼尼松"],ans:"D",exp:"英夫利昔单抗属于单克隆抗体，是目前较为有效的诱导及维持缓解的药物。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"68. 合并慢性肾脏病（CKD）或心力衰竭的2型糖尿病患者，无论其糖化血红蛋白是否达标，若无禁忌证，都应在二甲双胍的基础上加用的药物是",opts:["A.恩格列净","B.罗格列酮","C.格列本脲","D.那格列奈","E.伏格列波糖"],ans:"A",exp:"合并慢性肾脏病(CKD)或心力衰竭的2型糖尿病患者，无论其糖化血红蛋白是否达标，若无禁忌证，都应在二甲双胍的基础上加用钠-葡萄糖协同转运蛋白-2抑制剂(SGLT-2i)，代表药物有卡格列净、恩格列净、达格列净。"},
      {q:"69. 有心力衰竭（NYHA心功能分级II级以上）、活动性肝病、严重骨质疏松或有骨折病史的2型糖尿病患者应禁用的药物是",opts:["A.恩格列净","B.罗格列酮","C.格列本脲","D.那格列奈","E.伏格列波糖"],ans:"B",exp:"噻唑烷二酮类胰岛素增敏剂(TZDs)的使用与骨折和心力衰竭风险增加相关，有心力衰竭、活动性肝病、严重骨质疏松或有骨折病史的患者应禁用本类药物。TZDs的代表药物有罗格列酮、吡格列酮。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"70. 属于新型降尿酸药，主要用于预防和治疗血液系统恶性肿瘤患者的急性HUA的药物是",opts:["A.秋水仙碱","B.非布司他","C.普瑞凯布","D.苯溴马隆","E.拉布立海"],ans:"E",exp:"拉布立海是一种重组尿酸氧化酶，主要用于预防和治疗血液系统恶性肿瘤患者的急性HUA，尤其适用于放疗或化疗所致的HUA。"},
      {q:"71. 属于新型降尿酸药，可用于其他药物疗效不佳或存在禁忌证的成年难治性痛风患者的药物是",opts:["A.秋水仙碱","B.非布司他","C.普瑞凯布","D.苯溴马隆","E.拉布立海"],ans:"C",exp:"普瑞凯希是一种聚乙二醇重组尿酸氧化酶，适用于大部分难治性痛风，可用于其他药物疗效不佳或存在禁忌证的成年难治性痛风患者。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"72. 老年患者尿路感染时慎用，应谨防出现QT间期延长、诱发老年患者出现谵妄的抗菌药物是",opts:["A.甲硝唑","B.呋喃妥因","C.阿莫西林","D.头孢氨苄","E.左氧氟沙星"],ans:"E",exp:"喹诺酮类禁用于18岁以下儿童，并应注意肝功能，可使QT间期延长而致心律失常，可能诱发老年患者出现谵妄。"},
      {q:"73. 妊娠38周以上的足月妊娠期女性尿路感染时禁止使用，避免新生儿发生溶血性贫血的抗菌药物是",opts:["A.甲硝唑","B.呋喃妥因","C.阿莫西林","D.头孢氨苄","E.左氧氟沙星"],ans:"B",exp:"呋喃妥因禁用于妊娠38周以上的足月妊娠期女性，避免新生儿发生溶血性贫血。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"74. 用药期间应密切关注肾毒性，应给予充分水化和碱化尿液的药物是",opts:["A.顺铂","B.奥沙利铂","C.博来霉素","D.氟尿嘧啶","E.利妥昔单抗"],ans:"A",exp:"铂类药物中的顺铂是可引起肾毒性的典型代表，充分的水化和碱化尿液可以预防肾毒性发生。"},
      {q:"75. 用药期间应密切关注肺毒性，一旦出现，应停药、吸氧并尽早给予糖皮质激素的药物是",opts:["A.顺铂","B.奥沙利铂","C.博来霉素","D.氟尿嘧啶","E.利妥昔单抗"],ans:"C",exp:"导致肺毒性的典型化疗药物如博来霉素，累积剂量超过300mg或联合放疗都可使肺毒性发生风险增高或程度加重。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"76. 患者，男，58岁，患类风湿关节炎。应用氯喹时，因氯喹起效缓慢，药师应告知患者至少需坚持服用的疗程是",opts:["A.1周","B.4周","C.2个月","D.6个月","E.12个月"],ans:"D",exp:"氯喹起效慢，至少连服6个月后才能确定是否有效。"},
      {q:"77. 患者，男，60岁，患骨质疏松。应用地舒单抗时，药师应告知患者可间隔多长时间给药一次",opts:["A.1周","B.4周","C.2个月","D.6个月","E.12个月"],ans:"D",exp:"地舒单抗每6个月使用1次，皮下注射。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"78. 患者，女，56岁，有癫痫病史，自行吞服大量苯巴比妥出现昏迷，为促进苯巴比妥排泄，宜使用的解救药物是",opts:["A.氯化铵溶液","B.淀粉溶液","C.高锰酸钾溶液","D.阿扑吗啡溶液","E.碳酸氢钠溶液"],ans:"E",exp:"苯巴比妥中毒应以5%碳酸氢钠溶液静脉滴注以碱化尿液，加速排泄。"},
      {q:"79. 患者，男，33岁，有吸毒史，因突发躁狂、震颤伴意识紊乱被紧急送医，血液检测有苯丙胺类物质存在，为促进苯丙胺类物质排泄，宜使用的解救药物是",opts:["A.氯化铵溶液","B.淀粉溶液","C.高锰酸钾溶液","D.阿扑吗啡溶液","E.碳酸氢钠溶液"],ans:"A",exp:"苯丙胺类物质中毒应口服氯化铵或给予维生素C酸化尿液以促进毒物排出。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"80. 在疾病的治疗期间应确保足够的水化，为避免尿路结石的发生，宜增加每日进水量的药物是",opts:["A.磺胺嘧啶","B.索磷布韦","C.熊去氧胆酸","D.氯膦酸二钠","E.二羟丙茶碱"],ans:"A",exp:"磺胺类药物容易引起结晶尿，故需要足量的饮水来加速尿液排泄。"},
      {q:"81. 在用于治疗骨质疏松时，可致水、电解质紊乱，故应注意补充液体，使一日的尿量达2000ml以上的药物是",opts:["A.磺胺嘧啶","B.索磷布韦","C.熊去氧胆酸","D.氯膦酸二钠","E.二羟丙茶碱"],ans:"D",exp:"阿仑膦酸钠、帕屈膦酸钠、氯膦酸二钠在用于治疗骨质疏松时，可致水、电解质紊乱，故应注意补充液体，使一日的尿量达2000ml以上。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"82. 丙戊酸钠可用于失神发作，本药的有效治疗血药浓度为",opts:["A.4-12μg/ml","B.2.5-15μg/ml","C.10-20μg/ml","D.10-40μg/ml","E.50-100μg/ml"],ans:"E",exp:"丙戊酸钠的有效治疗血药浓度为50～100μg/ml。"},
      {q:"83. 卡马西平可用于全面强直-阵挛性发作，本药的有效治疗血药浓度为",opts:["A.4-12μg/ml","B.2.5-15μg/ml","C.10-20μg/ml","D.10-40μg/ml","E.50-100μg/ml"],ans:"A",exp:"卡马西平的有效治疗血药浓度为4～12μg/ml。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"84. 需皮下注射给药，且用药不应超过24个月，禁用于有骨骼放疗史患者的药物是",opts:["A.替勃龙","B.特立帕肽","C.鲑降钙素","D.唑来膦酸","E.阿仑膦酸钠"],ans:"B",exp:"特立帕肽属于甲状旁腺素类似物，剂量和用法为20μg/d，皮下注射；用药不应超过24个月。禁用于Paget病或有骨骼放疗史的患者。"},
      {q:"85. 需静脉滴注给药，且给药时间应大于15分钟，CrCl<35ml/min不推荐使用的药物是",opts:["A.替勃龙","B.特立帕肽","C.鲑降钙素","D.唑来膦酸","E.阿仑膦酸钠"],ans:"D",exp:"唑来膦酸属于双膦酸盐类，剂量和用法为4mg或5mg，静脉滴注，给药时间>15min；用于治疗，每年1次。CrCl<35ml/min不推荐使用。"}
    ]},

    // ===== 三、综合分析选择题（86-95） =====
    {type:"最佳选择题",q:"86. 患者，女，27岁，因“头痛1天伴恶心呕吐”到急诊科就诊。追问病史，患者既往有多次类似发作史，休息后头痛症状可缓解。患者既往身体健康，否认食物及药物过敏史。血常规检查正常，肝肾功能正常，头颅CT检查未见明显异常。临床诊断：反复性偏头痛。根据患者的临床诊断，适宜选用的治疗药物是",opts:["A.地西泮","B.罗通定","C.卡马西平","D.山莨菪碱","E.氨基葡萄糖"],ans:"B",exp:"偏头痛急性可给予佐米曲普坦、舒马曲普坦；含有咖啡因的对乙酰氨基酚复方制剂、阿司匹林、罗通定、双氯芬酸、麦角胺咖啡因等是常用的治疗药物。"},
    {type:"最佳选择题",q:"87. 若患者出现肌肉及关节的轻度疼痛，建议使用",opts:["A.盐酸阿米替林片","B.佐米曲普坦分散片","C.盐酸消旋山莨菪碱注射液","D.复方磷酸可待因口服溶液","E.双氯芬酸钠二乙胺乳胶剂"],ans:"E",exp:"双氯芬酸钠二乙胺乳胶剂用于缓解肌肉、软组织和关节的轻至中度疼痛。"},
    {type:"最佳选择题",q:"88. 药师对患者进行用药指导和教育，说法错误的是",opts:["A.解热镇痛药用于镇痛一般不超过5天","B.该患者的药物治疗以外用、口服给药为主","C.尽量使用最大有效剂量，及时控制症状","D.避免含有相同成分的多种镇痛药物同时服用","E.外用解热镇痛药时，避免长期大面积使用"],ans:"C",exp:"药物治疗以外用、口服给药为主，尽量使用最低有效剂量，避免含有相同成分的多种镇痛药物同时服用。"},
    {type:"最佳选择题",q:"89. 患者，女，54岁，有青光眼、哮喘病史，因关节疼痛服用阿司匹林后，出现喘息、呼吸急促被紧急送医。立即予以沙丁胺醇气雾剂进行治疗。阿司匹林所致的哮喘除使用沙丁胺醇外，还应联合应用的药物是",opts:["A.罗氟司特","B.异丙托溴铵","C.特布他林","D.孟鲁司特","E.沙美特罗"],ans:"D",exp:"孟鲁司特为白三烯受体拮抗剂，可减轻哮喘症状、改善肺功能、延缓哮喘的恶化，尤其适用于伴有过敏性鼻炎、阿司匹林哮喘、运动性哮喘患者的治疗。"},
    {type:"最佳选择题",q:"90. 患者使用药物治疗期间可能出现的不良反应不包括",opts:["A.低血钾","B.心律紊乱","C.骨骼肌震颤","D.抑郁情绪","E.低血压"],ans:"D",exp:"沙丁胺醇为短效β2受体激动剂，不良反应包括骨骼肌震颤、低血钾、心律紊乱等。孟鲁司特可能带来严重神经精神事件风险，包括抑郁、自残、自杀倾向。"},
    {type:"最佳选择题",q:"91. 该患者未规律用药和严格进行疾病管理导致病情反复，经评估确诊为中度持续性哮喘，需长期维持治疗，宜选择的治疗药物是",opts:["A.噻托溴铵","B.特布他林","C.福莫特罗-布地奈德","D.孟鲁司特","E.沙美特罗"],ans:"C",exp:"ICS和LABA具有协同的抗炎和平喘作用，尤其适用于中至重度持续哮喘患者的长期治疗。目前在我国临床上应用的复合制剂有不同规格的福莫特罗-布地奈德干粉吸入剂、沙美特罗-替卡松干粉吸入剂和福莫特罗-倍氯米松气雾剂。"},
    {type:"最佳选择题",q:"92. 患者，男，68岁，高血压病史12年，2型糖尿病11年，慢性肾脏病2期，支气管哮喘病史3年，冠心病史18年。近期由于反复发作的头痛、头晕、胸闷、气喘等不适前来医院就诊。入院检查：T37.8℃，P130次/分，BP145/114mmHg，TC7.9mmol/L，TG1.7mmol/L，GFR50ml/min，空腹血糖8.7mmol/L。入院检查过程中该患者出现昏迷，呼之不应、呼吸急促等症状加重的情况，考虑高血压伴脑卒中，紧急送往ICU进行对症支持治疗。对该患者进行紧急降压治疗，可以选用的药物是",opts:["A.尼群地平","B.硝苯地平","C.呋塞米","D.氨氯地平","E.尼卡地平"],ans:"E",exp:"针对昏迷的患者，可以考虑的静脉降压药物有尼卡地平、拉贝洛尔。"},
    {type:"最佳选择题",q:"93. 该患者进行血脂控制需将重心放在LDL-C上，目标值应在",opts:["A.<5.2mmol/L","B.<3.4mmol/L","C.<2.6mmol/L","D.<1.8mmol/L","E.<1mmol/L"],ans:"D",exp:"该患者既往有高血压、糖尿病、冠心病，属于很高危人群，LDL-C的推荐调脂目标应在<1.8mmol/L。"},
    {type:"最佳选择题",q:"94. 患者，男，49岁，冠心病史8年，哮喘病史4年，长期使用阿托伐他汀钙、氯吡格雷进行冠心病的二级预防。近期患者出现频繁咳嗽、胸痛、喘息等症状，餐后容易出现胃灼热、反流等不适，前来医院后诊断为胃食管反流病。该患者冠心病急性发作时使用的可能会加重胃食管反流病的药物是",opts:["A.阿托伐他汀钙","B.硝酸甘油","C.氯吡格雷","D.沙丁胺醇","E.雷尼替丁"],ans:"B",exp:"会降低食管下括约肌压力的常用药物有地平类降压药、抗胆碱药物、硝酸酯类药物等。"},
    {type:"最佳选择题",q:"95. 该患者进行胃食管反流病治疗，不宜使用的药物是",opts:["A.奥美拉唑","B.泮托拉唑","C.铝碳酸镁","D.雷尼替丁","E.伊托必利"],ans:"A",exp:"氯吡格雷是前体药，需经过CYP2C19等多种酶转化为活性代谢物。PPI(尤其是奥美拉唑)可抑制CYP2C19，从而降低氯吡格雷的疗效，导致心血管血栓栓塞不良事件的风险。"},

    // ===== 四、多项选择题（96-100） =====
    {type:"多项选择题",q:"96. 下列药品中，需要在冷处贮存的有",opts:["A.阿仑膦酸钠片","B.止咳糖浆","C.盐酸曲马多","D.人促红素","E.胰岛素笔芯（未开封）"],ans:"DE",exp:"①阿仑膦酸钠片常温(10～30℃)保存即可。②止咳糖浆不宜冷处贮存，会使得药物黏稠从而影响药效。③盐酸曲马多常温保存即可。④人促红素冷处贮存，且运输过程中不宜振摇。⑤胰岛素笔芯未开封需要冷处贮存。"},
    {type:"多项选择题",q:"97. 妊娠期妇女由于新生命的孕育，其心血管、消化、内分泌等系统都将出现各种各样的生理变化，这些变化导致在此生命阶段药物的吸收、分布、代谢及排泄都可能与正常人有所不同。关于妊娠期妇女的药动学特点，说法错误的有",opts:["A.胃酸分泌减少，胃肠活动减弱，使口服药物吸收减慢","B.血浆容积增加，用药剂量相同时，血药浓度高于非妊娠期妇女","C.白蛋白生成速度加快，结合型药物浓度增加，药物起效减慢","D.蛋白结合能力的下降使药物游离型浓度增高，药物转运到肝脏代谢的量减少","E.妊娠期肾血流、肾小球滤过率和肌酐清除率均有所增加，使药物经肾脏的消除加快"],ans:"BCD",exp:"①妊娠时胃酸分泌减少，胃肠活动减弱，使口服药物吸收减慢。②妊娠期妇女血浆容积增加，一般而言，用药剂量相同时，妊娠期妇女的血药浓度低于非妊娠期妇女。③妊娠期虽然生成白蛋白的速度加快，但因血容量增加使血浆白蛋白浓度降低，同时某些药物的蛋白结合能力下降，造成药物游离型浓度增高。④蛋白结合能力的下降使药物游离型浓度增高，则药物被转运到肝脏代谢的量增多。⑤妊娠期肾血流、肾小球滤过率和肌酐清除率均有所增加，使药物经肾脏的消除加快。"},
    {type:"多项选择题",q:"98. 下列药物及食物中，心房颤动患者在规律使用华法林时，可增强华法林效果的有",opts:["A.氯吡格雷","B.维生素K","C.西兰花","D.苯巴比妥","E.葡萄糖"],ans:"AE",exp:"①抗血小板药物可增强华法林效果。②华法林为维生素K拮抗剂，维生素K可减弱华法林效果。③西兰花、菠菜、花菜等绿色蔬菜可减弱华法林效果。④苯巴比妥为肝药酶诱导剂，可减弱华法林效果。⑤葡萄柚、大蒜、芒果、洋葱等可增强华法林效果。"},
    {type:"多项选择题",q:"99. 在胃溃疡的治疗药物中，属于外源性黏膜保护剂的有",opts:["A.米索前列醇","B.瑞巴派特","C.硫糖铝","D.枸橼酸铋钾","E.铝碳酸镁"],ans:"CDE",exp:"属于外源性黏膜保护剂的有：各类铝镁剂(硫糖铝、铝碳酸镁)、铋剂；属于内源性黏膜保护剂的有：米索前列醇、吉法酯、替普瑞酮、瑞巴派特等。"},
    {type:"多项选择题",q:"100. 静脉滴注时间应控制在1小时以上且在滴注过程中必须遮光的药物有",opts:["A.莫西沙星","B.培氟沙星","C.万古霉素","D.左氧氟沙星","E.对氨基水杨酸钠"],ans:"ABDE",exp:"①静脉滴注时间应控制在1小时以上的药物有林可霉素、克林霉素、多黏菌素B、氯霉素、红霉素、甲砜霉素、磷霉素、环丙沙星、氧氟沙星、左氧氟沙星、莫西沙星、培氟沙星、异烟肼、对氨基水杨酸钠、卡泊芬净、氟康唑等。②少数注射药物性质不稳定，遇光易变色，因此在贮存或滴注过程中必须遮光，如对氨基水杨酸钠、硝普钠、放线菌素D、长春新碱、尼莫地平、左氧氟沙星、培氟沙星、莫西沙星等。万古霉素滴注过程中无需遮光。"}
  ]
},
  {
  name: "押题密卷（七）",
  questions: [
    // ===== 一、最佳选择题（1-40） =====
    {type:"最佳选择题",q:"1. 通过重整患者的医嘱药物或药疗方案，评估药物治疗的有效性、安全性和经济性，核查患者的用药依从性的过程为",opts:["A.个体化药物治疗","B.用药教育","C.药物治疗管理","D.药物评价","E.药物警戒"],ans:"C",exp:"药物治疗管理（MTM）是通过重整患者的医嘱药物或药疗方案，评估药物治疗的有效性、安全性和经济性，核查患者的用药依从性。"},
    {type:"最佳选择题",q:"2. 遇光易分解，可产生有毒的氢氰酸及普鲁士蓝等，在贮存过程中应避免接触光线的药物是",opts:["A.维生素A","B.硝普钠","C.亚硝酸钠","D.维生素K","E.普鲁卡因"],ans:"B",exp:"注射用硝普钠遇光易分解，可产生有毒的氢氰酸及普鲁士蓝等。"},
    {type:"最佳选择题",q:"3. 患者，男，22岁，因发热、全身乏力、头痛、鼻塞流涕就诊，诊断为普通感冒，医生处方：复方感冒灵片4片 tid po、维C银翘片2片 tid po。该处方属于",opts:["A.用法、用量不适宜","B.有配伍禁忌","C.有禁忌证用药","D.重复用药","E.无适应证用药"],ans:"D",exp:"复方感冒灵片、维C银翘片均含有对乙酰氨基酚、马来酸氯苯那敏。含有相同主要成分的复方制剂联用属于重复用药。"},
    {type:"最佳选择题",q:"4. 药师在发放药品时应对患者进行用药指导。下列用药指导中，说法不正确的是",opts:["A.阿仑膦酸钠片服药时间必须为服药当天第一次进食或饮水前至少半小时","B.口崩片应将药片置于舌上，用唾液润湿并以舌轻压，崩解后随唾液吞服","C.苯海拉明等抗过敏药服药后避免驾车或从事高空作业","D.糖肽类药物有明显光毒性，使用后避免过度暴露于阳光下","E.胰岛素注射液未开封时应放置冰箱冷藏保存，避免冻结，开始使用后则置于室温保存"],ans:"D",exp:"喹诺酮类药物使用后避免过度暴露于阳光下，以免发生光敏感性/光毒性。糖肽类药物无明显光毒性。"},
    {type:"最佳选择题",q:"5. 患者，男，85岁，恶性肿瘤晚期，终末期缓解口干症状适宜选择的药物是",opts:["A.阿托品","B.吗啡","C.氟哌啶醇","D.泼尼松","E.毛果芸香碱"],ans:"E",exp:"终末期患者的口干可使用毛果芸香碱，每次口服5mg，3次/日。"},
    {type:"最佳选择题",q:"6. 根据《医疗机构药物警戒体系建设专家共识（2022年）》，药物警戒的工作内容不包括",opts:["A.开展药品上市前I期临床试验","B.疑似药品不良反应的监测与管理","C.药品遴选与引进管理","D.超说明书用药的监测与管理","E.高警示药品使用的监测与管理"],ans:"A",exp:"药物警戒的工作内容包括疑似药品不良反应的监测与管理、用药错误及其风险监测与管理、药源性疾病相关药品的监测与管理、药品遴选与引进管理、药物滥用的监测与管理、超说明书用药的监测与管理、高警示药品使用的监测与管理、药品质量问题的监测与管理、附条件批准和应急特批药品的监测与管理。开展药品上市前I期临床试验属于药物评价内容。"},
    {type:"最佳选择题",q:"7. 患者，女，35岁，既往有荨麻疹病史，因鼻窦炎急性发作自行使用青霉素V钾片治疗3天后出现皮疹、瘙痒，服用氯雷他定治疗后瘙痒明显缓解。该患者皮疹、瘙痒症状与青霉素V钾片的因果关系是",opts:["A.肯定","B.很可能","C.可能","D.可能无关","E.无法评价"],ans:"C",exp:"判定“可能”的条件有：用药与反应发生时间关系密切；同时有文献资料佐证；引发ADR的药品不止一种，或原患疾病病情进展因素不能除外。患者先用青霉素V钾片后出现皮疹、瘙痒，时间关系密切；皮疹、瘙痒符合青霉素已知的不良反应类型；但荨麻疹病史也可能出现皮疹、瘙痒症状，不能排除原疾病病情进展。"},
    {type:"最佳选择题",q:"8. 药源性疾病按照病因分为四类。下列属于A型药源性疾病的是",opts:["A.使用布洛芬出现胃溃疡","B.使用抗蛇毒血清出现过敏反应","C.长期使用美托洛尔突然停药出现心悸、头晕","D.妊娠期女性服用己烯雌酚所娩女婴在青春期罹患阴道腺癌","E.长期使用鲑鱼降钙素注射液增加癌症的风险"],ans:"A",exp:"A型药源性疾病为剂量相关的药源性疾病，是致病药物本身的药理作用增强和持续发展的结果，能够预测；其发生率高，但死亡率低。例如非甾体抗炎药引起的药源性消化道疾病随着剂量增加、疗程延长而加重。过敏反应为B型药源性疾病。停药反应为C型药源性疾病。D型药源性疾病是由药物致癌、致畸、致突变作用导致的药源性疾病。"},
    {type:"最佳选择题",q:"9. 下列关于肝功能不全患者药动学特点，说法不正确的是",opts:["A.肝脏的首过效应降低使主要在肝脏内代谢清除的药物生物利用度提高","B.药物的血浆蛋白结合率降低，血中结合型药物减少，游离型药物增加，使药理作用降低","C.主要通过肝脏代谢清除的药物的代谢速度和程度降低，清除半衰期延长，血药浓度增高，长期用药还可引起蓄积性中毒","D.需要在体内代谢后才具有药理活性的前体药药理效应降低","E.肝脏疾病时首过消除明显的药物要减少口服药物剂量，并延长给药间隔"],ans:"B",exp:"在肝脏疾病时，肝脏的蛋白质合成功能减退，血浆中白蛋白浓度下降，使药物的血浆蛋白结合率降低，血中结合型药物减少，而游离型药物增加使药理作用加强，同时不良反应也可能相应增加，尤其对于蛋白结合率高的药物，其影响更为显著。"},
    {type:"最佳选择题",q:"10. 发现患者无意识且无呼吸或仅有濒死样呼吸，应即刻启动心肺复苏流程。下列关于胸外按压的操作，说法错误的是",opts:["A.施救者两手掌相重叠，十指相扣，掌心翘起","B.按压深度至少5cm，频率100～120次/分","C.按压与人工呼吸比例为30：2","D.按压部位为胸骨中下1/3交界处","E.每次按压后无需等待胸壁回弹直接进行下一次按压"],ans:"E",exp:"有效的胸外按压：①施救者两手掌根重叠，十指相扣，掌心翘起，按压患者胸骨中下1/3交界处；②按压深度至少5cm（成人），频率每分钟100～120次，确保每次按压后胸壁充分回弹，按压30次后进行2次人工呼吸；③如此反复，形成不间断的心肺复苏循环。"},
    {type:"最佳选择题",q:"11. 关于轻微擦伤的紧急处理，说法不正确的是",opts:["A.可用过氧化氢和碘伏交替冲洗创面","B.持续出血需使用1%利多卡因加肾上腺素注射或直接用于伤口处","C.清除伤口内肉眼可见的异物","D.外用喷昔洛韦软膏预防感染","E.必要时注射破伤风抗毒素"],ans:"D",exp:"应去除肉眼可见的所有异物，在清除异物过程中可使用过氧化氢和碘伏交替多次冲洗。然后涂抹莫匹罗星软膏或复方多黏菌素B软膏，并以创可贴或无菌纱布进行覆盖。喷昔洛韦软膏为抗病毒药，不用于预防细菌感染。"},
    {type:"最佳选择题",q:"12. 患者，男，3岁，误服大量对乙酰氨基酚出现肝损伤，可使用的解救药物是",opts:["A.乙酰半胱氨酸","B.阿托品","C.维生素K1","D.乙酰水杨酸","E.碘解磷定"],ans:"A",exp:"乙酰半胱氨酸是2011年被美国FDA批准用来治疗对乙酰氨基酚所致肝损伤的解毒药物，也是唯一的特异性解毒剂，还可以用于儿童患者。"},
    {type:"最佳选择题",q:"13. 患者，女，27岁，妊娠9周，近期出现发热、鼻塞流涕、咳嗽咳痰症状，诊断为普通感冒。可缓解感冒症状且可安全用于该患者的药物是",opts:["A.维生素E","B.右美沙芬","C.葡萄糖酸锌","D.愈创木酚甘油醚","E.双氯芬酸钠"],ans:"C",exp:"孕期避免使用阿司匹林、双氯芬酸、苯海拉明和布洛芬等。妊娠3个月内禁用愈创木酚甘油醚和右美沙芬。维生素E不建议用于成人普通感冒。葡萄糖酸锌等锌含片可缓解普通感冒咳嗽、流涕症状，推荐用于成人普通感冒患者。"},
    {type:"最佳选择题",q:"14. 患者，男，23岁，有花粉过敏史，一旦接触花粉出现鼻痒、鼻塞、打喷嚏、流涕症状，诊断为间歇性过敏性鼻炎。该患者一线治疗药物不包括",opts:["A.非索非那定胶囊","B.氯苯那敏片","C.奥洛他定鼻喷雾剂","D.西替利嗪片","E.盐酸氮䓬斯汀鼻喷剂"],ans:"B",exp:"间歇性过敏性鼻炎一线治疗药物有口服第二代抗组胺药（如非索非那定、西替利嗪、氯雷他定）、鼻用抗组胺药（如奥洛他定、氮䓬斯汀）。氯苯那敏片为口服第一代抗组胺药。"},
    {type:"最佳选择题",q:"15. 患者，女，30岁，频繁发作多发性口腔溃疡，每次发作持续半月余，伴有剧烈疼痛。为促进溃疡愈合宜使用的药物是",opts:["A.重组牛碱性成纤维细胞生长因子凝胶","B.氯己定含漱液","C.利多卡因喷剂","D.神经生长因子注射液","E.环孢素胶囊"],ans:"A",exp:"促进口腔溃疡愈合药物有重组人表皮生长因子凝胶、外用溶液，重组牛碱性成纤维细胞生长因子凝胶、外用溶液等。"},
    {type:"最佳选择题",q:"16. 患者，男，55岁，因反复出现食欲不佳、饱胀感伴嗳气自行前往药店购买“吗丁啉”，药师对其用药指导说法不正确的是",opts:["A.吗丁啉的通用名为多潘立酮","B.适用于功能性消化不良伴恶心、呕吐","C.用药前应排除心脏病，有QT间期延长病史不建议使用","D.胃肠道出血、机械性肠梗阻、胃肠穿孔、分泌催乳素的垂体肿瘤患者禁用","E.建议联用克拉霉素以提高疗效"],ans:"E",exp:"多潘立酮可引起QT间期延长，导致心律失常，因此不宜与红霉素等可能延长QT间期的CYP3A4酶强抑制剂（如氟康唑、伏立康唑、克拉霉素、胺碘酮、泰利霉素等）联用。"},
    {type:"最佳选择题",q:"17. 患者，女，52岁，主诉自绝经后经常感阴道干涩、烧灼感，近期出现淡黄色白带并伴尿频、尿急、尿痛，就医后诊断为萎缩性阴道炎，适宜选择的治疗药物是",opts:["A.克霉唑栓","B.雌三醇乳膏","C.阿奇霉素胶囊","D.伊曲康唑胶囊","E.莫西沙星片"],ans:"B",exp:"萎缩性阴道炎可使用阴道雌激素制剂，充分的雌激素治疗可恢复正常阴道酸性pH及微生物菌群，使阴道上皮增厚、阴道分泌物增加，有效改善外阴阴道干涩或不适症状。临床常用的阴道雌激素制剂有普罗雌烯阴道胶丸、雌三醇乳膏、结合雌激素乳膏等。"},
    {type:"最佳选择题",q:"18. 患者，女，56岁，一年前已绝经，出现间断潮热、盗汗、乏力等绝经症状，否认个人及家族高血压、糖尿病、骨折及血栓病史，不希望有月经样出血。该患者宜使用的治疗方案是",opts:["A.连续使用戊酸雌二醇片","B.连续使用地屈孕酮片","C.阴道局部雌激素方案","D.替勃龙方案","E.单纯雌激素方案"],ans:"D",exp:"替勃龙适用于绝经1年以上，且服药期间不希望有月经样出血的女性。单雌激素方案（戊酸雌二醇）适用于子宫已切除的女性。单孕激素方案（地屈孕酮）适用于绝经过渡期早期尚未出现低雌激素症状，但有排卵障碍性异常子宫出血的女性。雌、孕激素序贯方案适用于有完整子宫，仍希望有月经样出血的女性。"},
    {type:"最佳选择题",q:"19. 患者，女，66岁，感冒后腰部皮肤相继出现灼热、疼痛、不规则红斑、疱疹，诊断为带状疱疹。关于该患者的药物治疗和注意事项，说法不正确的是",opts:["A.使用膦甲酸钠氯化钠注射液，疗程7天","B.使用阿昔洛韦注射液，疗程7天","C.饭后服用布洛芬胶囊减轻疼痛","D.口服甲钴胺胶囊减轻疼痛","E.如皮损消退仍有神经痛可外贴利多卡因贴剂"],ans:"B",exp:"目前临床使用抗病毒药物多选择伐昔洛韦、泛昔洛韦、膦甲酸钠氯化钠注射液、溴夫定等，治疗疗程7～10天。选用传统阿昔洛韦治疗疗程为10～14天。故B错误。"},
    {type:"最佳选择题",q:"20. 患者，男，62岁，有慢性肾脏病史，血钾5.8mmol/L，GFR 28ml/(min·1.73m²)，诊断为高血压，使用苯磺酸氨氯地平治疗，血压控制不达标，适宜联用的利尿剂是",opts:["A.氢氯噻嗪","B.呋塞米","C.螺内酯","D.美托洛尔","E.氨苯蝶啶"],ans:"B",exp:"患者血钾偏高，GFR 28ml/min，应选用袢利尿剂如呋塞米，既能利尿又能降低血钾。噻嗪类利尿剂在肾功能不全时效果差。螺内酯、氨苯蝶啶为留钾利尿剂，高钾血症禁用。"},
    {type:"最佳选择题",q:"21. 患者，女，48岁，有冠心病家族史，因血脂异常使用阿托伐他汀进行治疗。药师对该患者的用药交代，说法不正确的是",opts:["A.可在每日任何固定时间给药","B.血脂达标可停用阿托伐他汀","C.避免与吉非罗齐联用","D.用药期间应监测血脂、肌酸激酶、肝功能、肾功能","E.用药期间避免食用葡萄糖或葡萄糖汁"],ans:"B",exp:"ASCVD患者或者ASCVD高危、超（极）高危患者需要在医生、药师的指导下长期甚至终生接受调脂治疗，不能因为LDL-C暂时达标就停止治疗。"},
    {type:"最佳选择题",q:"22. 患者，男，60岁，因活动后出现胸骨后压榨性疼痛休息后缓解就诊，心电图显示：ST段压低，心肌缺血，心率为52次/分。该患者禁用的药物是",opts:["A.硝酸异山梨酯","B.阿司匹林","C.维拉帕米","D.贝那普利","E.非洛地平"],ans:"C",exp:"非二氢吡啶类药物（包括维拉帕米、地尔硫䓬）对心肌细胞的钙离子通道阻断作用更明显，可降低心率（负性频率）和心肌收缩力（负性肌力），不宜用于已有严重心动过缓、高度房室传导阻滞及病态窦房结综合征的患者。"},
    {type:"最佳选择题",q:"23. 患者，女，65岁，有高血压病史5年，因急性心绞痛发作入院治疗，病情缓解后出院。对于该患者预防心肌梗死、改善预后的治疗药物不包括",opts:["A.阿司匹林","B.瑞舒伐他汀","C.福辛普利","D.华法林","E.美托洛尔"],ans:"D",exp:"预防心肌梗死并改善预后的药物主要包括抗血小板药物、调脂药物、β受体拮抗剂和ACEI/ARB。华法林属于抗凝药物。"},
    {type:"最佳选择题",q:"24. 患者，男，62岁，因抑郁症使用药物治疗，治疗过程中应注意控制药物剂量。过量服用会出现阿托品中毒样症状的是",opts:["A.多塞平","B.阿戈美拉汀","C.舍曲林","D.文拉法辛","E.米氮平"],ans:"A",exp:"三环类药物（TCAs）中毒主要表现为神经、心血管和外周抗胆碱能症状（阿托品中毒样症状），出现昏迷、痉挛发作、心律失常等，一次吞服2.5g即可致死。多塞平属于三环类抗抑郁药。"},
    {type:"最佳选择题",q:"25. 患者，男，63岁，有高血压病史，曾进行基因检测为CYP2C19功能缺失等位基因携带者，10小时前突发短暂性脑缺血发作，ABCD评分4分，卒中高复发风险高，目前宜使用的治疗方案是",opts:["A.阿司匹林","B.氯吡格雷","C.阿司匹林 + 氯吡格雷","D.阿司匹林 + 替格瑞洛","E.氯吡格雷 + 替格瑞洛"],ans:"D",exp:"CYP2C19功能缺失等位基因携带者，推荐给予替格瑞洛联合阿司匹林治疗21日，此后继续使用替格瑞洛单药治疗。"},
    {type:"最佳选择题",q:"26. 患者，女，72岁，有高血压病史10年，突发头痛、呕吐，右侧肢体偏瘫、感觉障碍，紧急入院，脑CT示：脑出血，血压200/110mmHg，该患者宜选用的降压药物是",opts:["A.氨氯地平片","B.尼卡地平注射液","C.美托洛尔片","D.甘露醇注射液","E.沙库巴曲缬沙坦片"],ans:"B",exp:"当急性脑出血患者收缩压>220mmHg时，应积极使用静脉降压药物降低血压；当患者收缩压>180mmHg时，可使用静脉降压药物控制血压。可选用拉贝洛尔、尼卡地平等静脉药物。"},
    {type:"最佳选择题",q:"27. 患者，男，66岁，半年来逐渐出现手指震颤、步态不稳并伴嗅觉减退、便秘、从平躺位或坐位起身时出现明显头晕现象，确诊为帕金森病。除抗帕金森治疗外，针对患者体位性低血压症状首选的治疗药物是",opts:["A.特拉唑嗪","B.多潘立酮","C.米拉贝隆","D.酚妥拉明","E.米多君"],ans:"E",exp:"帕金森病出现体位性低血压的患者首选α肾上腺素受体激动剂米多君治疗，该药也最有效；也可使用屈昔多巴和选择性外周多巴胺受体拮抗剂多潘立酮。"},
    {type:"最佳选择题",q:"28. 患者，女，42岁，诊断为癫痫，使用药物治疗3个月后复查，血小板计数92×10^9/L（正常范围（100～300）×10^9/L），血浆纤维蛋白原1.8g/L（正常范围2～4g/L）。考虑为药物所致，可导致上述不良反应的抗癫痫药物是",opts:["A.卡马西平","B.苯妥英钠","C.丙戊酸钠","D.苯巴比妥","E.地西泮"],ans:"C",exp:"丙戊酸钠（镁）可致血小板减少，低纤维蛋白原血症。应用丙戊酸盐者应增加凝血功能检测。"},
    {type:"最佳选择题",q:"29. 患者，男，50岁，因上腹痛就诊，胃镜显示胃溃疡，13C呼气试验结果为阳性，青霉素皮试阴性。医师为该患者制定高剂量双联根除幽门螺杆菌方案，合理的是",opts:["A.阿莫西林胶囊1g bid+法莫替丁40mg bid","B.甲硝唑胶囊2g qd+奥美拉唑40mg bid","C.克拉霉素1g bid+阿莫西林胶囊1g bid","D.阿莫西林胶囊1g tid+雷贝拉唑片20mg bid","E.泮托拉唑片40mg bid+枸橼酸铋钾220mg bid"],ans:"D",exp:"高剂量双联方案是阿莫西林（≥3g/d，如1g/次，3次/日或0.75g/次，4次/日）联合艾司奥美拉唑或雷贝拉唑（双倍标准剂量，2次/日或标准剂量，4次/日），疗程14日。高剂量双联方案可作为Hp感染初次和再次（补救）根除治疗方案。"},
    {type:"最佳选择题",q:"30. 患者，男，30岁，近期频繁腹泻伴脓血便，诊断为溃疡性结肠炎，予以美沙拉秦肠溶片进行治疗。关于该药的特点，说法正确的是",opts:["A.用药期间应补充叶酸","B.美沙拉秦在结肠水解为奥沙拉秦起效","C.美沙拉秦在肠道被吸收发挥全身作用","D.随餐嚼碎服用可减轻头痛、恶心、疲乏等不良反应","E.美沙拉秦通常被设计成前体药或缓控释制剂"],ans:"E",exp:"5-ASA（美沙拉秦）口服可在胃和小肠被迅速吸收，因此临床应用的口服5-ASA被设计成在肠道释放的前体药物或缓、控释制剂。柳氮磺吡啶用药期间应补充叶酸。奥沙拉秦为美沙拉秦的前体药物。美沙拉秦肠溶片应于餐前1小时整片吞服。"},
    {type:"最佳选择题",q:"31. 患者，女，32岁，近一个月出现食欲亢进、多汗、心慌，脖子变粗就诊，查体：心率129次/分，甲状腺功能检查示：FT3、FT4升高，TSH降低，诊断为甲状腺功能亢进症，予以甲巯咪唑30mg/d进行治疗。对该患者的用药指导，说法不正确的是",opts:["A.FT3、FT4降至接近或达到正常范围时可进入减量期","B.在药物减量过程中定期监测患者心率、体重、白细胞计数、甲状腺激素水平","C.以TSH正常作为停用抗甲状腺药物的目标","D.应避免间断服药","E.治疗疗程一般为18～24个月"],ans:"C",exp:"甲亢患者使用抗甲状腺药物不能用TSH作为治疗目标，因TSH的变化滞后于甲状腺激素4～6周。"},
    {type:"最佳选择题",q:"32. 患者，男，70岁，诊断为2型糖尿病，经生活方式和口服降糖药联合治疗，血糖仍未达到控制目标，开始胰岛素治疗。为避免低血糖风险，宜使用平稳降糖的胰岛素制剂是",opts:["A.谷赖胰岛素","B.精蛋白（重组）人胰岛素","C.甘精胰岛素","D.地特胰岛素","E.德谷-门冬双胰岛素"],ans:"C",exp:"甘精胰岛素、德谷胰岛素无血药浓度峰值，避免低血糖风险。"},
    {type:"最佳选择题",q:"33. 充足的维生素D可增加肠钙吸收、促进骨骼矿化、保持肌力，对于防治骨质疏松症具有重要作用。下列关于维生素D的特点，说法不正确的是",opts:["A.维生素D不足可导致继发性甲状旁腺功能亢进，增加骨吸收，从而引起或加重骨质疏松","B.维生素D用于骨质疏松症防治时，剂量可为1200～2000IU/d","C.老年人、肾功能减退患者适合选择活性维生素D及其类似物","D.阿法骨化醇、骨化三醇、艾地骨化醇属于活性维生素D及其类似物","E.应用维生素D制剂应定期监测血钙和尿钙浓度"],ans:"B",exp:"维生素D用于骨质疏松症防治时，剂量可为800～1200IU/d，而非1200～2000IU/d。"},
    {type:"最佳选择题",q:"34. 患者，男，53岁，职业为货车司机，有肾结石病史10年，高尿酸血症病史5年，半月前因痛风急性发作进行药物治疗。病情缓解后降尿酸治疗宜选择的药物是",opts:["A.秋水仙碱","B.别嘌醇","C.非布司他","D.丙磺舒","E.苯溴马隆"],ans:"C",exp:"秋水仙碱是痛风急性发作时的抗炎止痛药物。丙磺舒、苯溴马隆为促进尿酸排泄药物，适用于无肾结石的患者。别嘌醇可致眩晕，不适用于需驾驶的患者。非布司他是抑制尿酸生成的药物，可用于有泌尿系统结石史的患者。"},
    {type:"最佳选择题",q:"35. 患者，女，55岁，有消化性溃疡病史，因双手指关节肿胀、疼痛伴晨僵就诊，实验室检查：血沉增快，类风湿因子阳性，诊断为类风湿关节炎。为尽快改善该患者关节症状，适宜选择的药物是",opts:["A.甲氨蝶呤","B.布洛芬","C.柳氮磺吡啶","D.塞来昔布","E.来氟米特"],ans:"D",exp:"NSAIDs能快速减轻类风湿关节炎的症状，对有消化性溃疡病史的患者宜服用选择性COX-2抑制剂如塞来昔布。甲氨蝶呤、柳氮磺吡啶、来氟米特等DMARDs不具备即刻止痛和抗炎作用。"},
    {type:"最佳选择题",q:"36. 患者，女，62岁，有系统性红斑狼疮病史，出现狼疮危象时，宜选择的治疗方案是",opts:["A.羟氯喹","B.美洛昔康","C.泼尼松 + 布洛芬","D.甲泼尼龙 + 环磷酰胺","E.甲泼尼龙 + 羟氯喹"],ans:"D",exp:"狼疮危象宜用糖皮质激素冲击联合免疫抑制剂进行治疗，激素冲击治疗为静脉滴注甲泼尼龙500～1000mg/d，连续使用3日为一个疗程，冲击治疗后改口服泼尼松0.5～1mg/(kg·d)或等效剂量的其他糖皮质激素，免疫抑制剂常选用环磷酰胺。"},
    {type:"最佳选择题",q:"37. 患者，女，58岁，有慢性肾脏病史，定期复查GFR 45ml/(min·1.73m²)，尿蛋白(++)，降低尿蛋白可使用的药物是",opts:["A.依折麦布","B.螺内酯","C.阿替洛尔","D.非洛地平","E.呋塞米"],ans:"B",exp:"慢性肾脏病控制蛋白尿可应用ACEI、ARB和盐皮质激素受体拮抗剂如螺内酯。"},
    {type:"最佳选择题",q:"38. 患者，男，69岁，有慢性肾脏病史10年，血钾急性升高时宜使用的治疗药物是",opts:["A.司美格鲁肽注射液","B.氨苯蝶啶片","C.碳酸氢钠注射液","D.胰岛素注射液 + 葡萄糖注射液","E.氢氯噻嗪片"],ans:"D",exp:"慢性肾脏病血钾急性升高时，使用胰岛素和葡萄糖治疗。"},
    {type:"最佳选择题",q:"39. 患者，男，46岁，因结肠癌使用药物治疗后出现血压升高、蛋白尿，导致这些症状的药物是",opts:["A.甲氨蝶呤","B.多柔比星","C.贝伐珠单抗","D.纳武利尤单抗","E.长春新碱"],ans:"C",exp:"贝伐珠单抗可导致高血压、蛋白尿及急性肾损伤。"},
    {type:"最佳选择题",q:"40. 世界卫生组织指出，每年至少1/3的肿瘤是可以预防的。属于肿瘤一级预防的是",opts:["A.某女性服用小剂量阿司匹林预防直肠癌","B.某社区开展宫颈癌筛检","C.某单位定期组织健康体检","D.有乳腺癌家族史女性定期进行钼靶检查","E.对结肠癌患者提供营养和锻炼指导"],ans:"A",exp:"一级预防主要包括针对健康个体和健康公众的社会措施，如改变不良卫生习惯、保持健康生活方式，合理营养膳食结构，研究、鉴定环境中的危险因素，以及建立疫苗接种和化学预防方法。小剂量阿司匹林有预防直肠癌发生的作用属于化学预防。普查、筛检、定期健康检查等属于二级预防。三级预防又称临床预防或康复性预防。"},

    {type:"配伍选择题",subs:[
      {q:"41. “雷米封”对应的药品通用名称是",opts:["A.利福平","B.盐酸普鲁卡因","C.异烟肼","D.利多卡因","E.脂肪乳注射液"],ans:"C",exp:"雷米封为异烟肼的别名。"},

    // ===== 三、综合分析选择题（86-95） =====
    {type:"最佳选择题",q:"86. 患者，男，59岁，平素经常出现恶心、呕吐、腹胀、腹泻，大便呈油性。因右上腹持续疼痛入院，体格检查，中上腹压痛，murphy征阳性，体温37.6℃，实验室检查：白细胞计数16.9×10^9/L，中性粒细胞百分比93%，B超显示多发性胆囊结石，胆囊体积增大，胆囊炎性改变。该患者经验性抗感染治疗首选的药物是",opts:["A.亚胺培南-西司他丁","B.阿奇霉素 + 甲硝唑","C.克林霉素 + 庆大霉素","D.头孢他啶 + 甲硝唑","E.莫西沙星"],ans:"D",exp:"急性胆囊炎可首选第三代头孢菌素（如头孢他啶、头孢曲松）与甲硝唑联用，也可选用头孢哌酮-舒巴坦、哌拉西林-他唑巴坦。对于严重感染而危及生命的患者也可选用亚胺培南-西司他丁钠、美罗培南等。"},
    {type:"最佳选择题",q:"87. 针对该患者胆源性消化不良症状，适宜选择的治疗药物是",opts:["A.复方阿嗪米特肠溶片","B.美沙拉秦肠溶片","C.干酵母片","D.多潘立酮片","E.泮托拉唑肠溶片"],ans:"A",exp:"慢性胆囊炎患者易出现消化不良症状。可应用复方阿嗪米特或其他胰酶制剂等，提高消化道内胰酶浓度，增强消化功能，改善腹胀症状及营养水平。"},
    {type:"最佳选择题",q:"88. 患者，女，50岁，因发热、腰痛、尿频、尿急、尿痛就诊，查体：体温38.2℃，血常规：白细胞计数14.8×10^9/L，中性粒细胞百分比81.3%，C反应蛋白93.9mg/L，尿常规：白细胞(++)、白细胞计数260个/μl、细菌计数50个/μl，诊断为急性肾盂肾炎。该患者适宜选择的经验性抗感染治疗方案是",opts:["A.左氧氟沙星500mg qd iv.gtt，热退后用药3日改为口服给药，总疗程14天","B.阿莫西林-克拉维酸1g qd iv.gtt，热退后用药3日改为口服给药，总疗程14天","C.亚胺培南-西司他丁500mg q6h iv.gtt，总疗程7天","D.两性霉素B 50mg qd iv.gtt，总疗程10天","E.阿奇霉素500mg qd iv.gtt，热退后用药3日改为口服给药，总疗程14天"],ans:"A",exp:"急性肾盂肾炎经验治疗宜选氨苄西林、阿莫西林、第一、二、三代头孢菌素类，可选哌拉西林-他唑巴坦、氨苄西林-舒巴坦、阿莫西林-克拉维酸、氟喹诺酮类、碳青霉烯类。病情较轻者，可在门诊口服药物治疗10～14天，通常90%可治愈。严重感染全身中毒症状明显者，需住院静脉给药治疗，可于热退后继续用药3日再改为口服抗菌药物，完成2周疗程。阿莫西林-克拉维酸为时间依赖型抗菌药物，不能仅一天给药一次。"},
    {type:"最佳选择题",q:"89. 该患者使用上述治疗方案的注意事项，说法正确的是",opts:["A.用药前需做皮试","B.有QT间期病史者应慎用","C.用药期间应适当增加日光浴","D.用药期间应限制饮水","E.停服抗菌药物3天后需进行尿细菌定量培养"],ans:"B",exp:"喹诺酮类可使QT间期延长而致心律失常；可致光敏反应；无需皮试，用药期间应多饮水。尿培养须在应用抗生素之前或停用抗菌药物7天以后留取，留取时建议留晨尿或尿液在膀胱中保留时间大于6小时。"},
    {type:"最佳选择题",q:"90. 患者，男，58岁，有高血压病史5年、冠心病史2年，长期使用美托洛尔缓释片、单硝酸异山梨酯片、阿司匹林肠溶片。近期复诊查血压129/88mmHg，心率60次/分。实验室检查：空腹血糖6.1mmol/L，餐后血糖7.5mmol/L，TC 5.2mmol/L，LDL-C 2.8mmol/L，TG 1.7mmol/L，HDL-C 1.0mmol/L。根据该患者复诊检查结果，应加用的药物是",opts:["A.氨氯地平","B.非诺贝特","C.格列美脲","D.瑞舒伐他汀","E.曲美他嗪"],ans:"D",exp:"冠心病患者LDL-C控制目标应<1.8mmol/L。该患者LDL-C不达标，应加用他汀类药物。"},
    {type:"最佳选择题",q:"91. 患者加用上述药物后，可能出现的不良反应是",opts:["A.心率加快","B.肌肉疼痛","C.低血糖","D.肢体震颤","E.足踝部水肿"],ans:"B",exp:"他汀类常见不良反应包括肝毒性，表现为ALT、AST升高；肌毒性，表现为肌肉疼痛，肌酸激酶（CK）升高。"},
    {type:"最佳选择题",q:"92. 为进一步降低心血管风险，增加患者依从性，考虑换用每半年注射一次的调脂药物是",opts:["A.依洛尤单抗","B.托珠单抗","C.阿利西尤单抗","D.英克司兰","E.英夫利西单抗"],ans:"D",exp:"英克司兰作用持久，每注射1次，疗效可维持6个月。"},
    {type:"最佳选择题",q:"93. 患者，女，67岁，有缺血性脑卒中病史，半年前查空腹血糖受损，采取控制饮食、适量运动，近期复查血糖：空腹血糖7.2mmol/L，餐后血糖10.3mmol/L，糖化血红蛋白7.1%，诊断为2型糖尿病。该患者首选的降糖药物是",opts:["A.(重组)人胰岛素","B.利司那肽","C.利格列汀","D.恩格列净","E.罗格列酮"],ans:"B",exp:"推荐有缺血性脑卒中病史的2型糖尿病患者，降糖药首选有获益证据的GLP-1受体激动剂如利司那肽。"},
    {type:"最佳选择题",q:"94. 患者在使用上述药物期间容易出现的不良反应是",opts:["A.低血糖","B.恶心、呕吐、腹泻","C.肌痛、关节痛、腹痛、头痛","D.泌尿生殖系统感染","E.上呼吸道感染、水肿、体重增加"],ans:"B",exp:"利司那肽等胰高血糖素样肽-1受体激动剂常见不良反应是恶心、呕吐、腹泻。"},
    {type:"最佳选择题",q:"95. 该患者经上述药物治疗后复查血糖控制不达标，考虑联合用药，首选加用的降糖药物是",opts:["A.门冬胰岛素","B.瑞格列奈","C.格列美脲","D.二甲双胍","E.替尔泊肽"],ans:"D",exp:"2型糖尿病的二联治疗一般是在单药治疗的基础上加用一种其他类别的降糖药，通常是加用二甲双胍（除非已予二甲双胍起始治疗或有二甲双胍禁忌证）。"},

    // ===== 四、多项选择题（96-100） =====
    {type:"多项选择题",q:"96. 药物评价是药学服务的内容。下列关于药物评价，说法正确的有",opts:["A.药物的临床评价可分为上市前评价、上市后再评价两个阶段，新药必须经过四期临床试验","B.新药上市前要经过I、II临床试验，批准上市后要经过III、IV临床试验","C.在临床试验中，药物的有效性和安全性是评价的关键内容","D.上市后再评价仅对新药在更广泛的人群、更复杂的用药条件、更长期的用药时间、更多样的用药方案以及用药时与停药后的各项临床指标进行监查","E.药物经济学评价是通过成本分析对比不同药物治疗方案或药物治疗方案与其他治疗方案的优势"],ans:"ACE",exp:"新药必须经过四期临床试验，即上市前要经过三期（I期、Ⅱ期和Ⅲ期）临床试验；批准上市后要经过IV期临床试验。上市后再评价是对药物在更广泛的人群、更复杂的用药条件、更长期的用药时间、更多样的用药方案以及用药时与停药后的各项临床指标进行监查，这样的评价既包括临床试验完成的“新药”，也包括所有在市场上销售的“老药”。"},
    {type:"多项选择题",q:"97. 关于发热使用解热镇痛药的注意事项，说法正确的有",opts:["A.非选择性非甾体抗炎药宜在餐后服药，肠溶制剂宜空腹或餐后2小时服用","B.妊娠期、哺乳期发热均可使用对乙酰氨基酚","C.妊娠期、哺乳期发热均禁用布洛芬","D.有高血压、心功能不全史的患者禁用布洛芬","E.有阿司匹林过敏史、活动性消化道溃疡或出血的患者禁用布洛芬"],ans:"ABE",exp:"布洛芬可能引起胎儿动脉导管早闭，并与自发性流产、胎儿心脏缺陷及唇腭裂等风险相关，所以应禁用于妊娠早期和晚期。进入乳汁的浓度很低，目前认为可安全用于哺乳期发热和镇痛。布洛芬引起水钠潴留，故有高血压、心功能不全史的患者应慎用，如必须使用布洛芬，应短期低剂量服用，并密切监测血压和心功能。"},
    {type:"多项选择题",q:"98. 患者，男，48岁，因流感使用玛巴洛沙韦，药师在发药时交代避免与玛巴洛沙韦同时服用的药物有",opts:["A.氢氧化铝","B.硫酸亚铁","C.硫酸镁","D.氯化钠","E.碳酸钙"],ans:"ABCE",exp:"玛巴洛沙韦应避免与乳制品及其他钙强化饮料、含高价阳离子的泻药、抗酸药或口服营养补充剂（如铁、镁、硒或锌）同时服用。"},
    {type:"多项选择题",q:"99. 患者，男，46岁，三个月前因急性心肌梗死入院抢救，经系统性治疗出院。近期出现心境低落、厌世、自残倾向，诊断为抑郁症。该患者应避免选择的抗抑郁药有",opts:["A.曲唑酮","B.丁螺环酮","C.文拉法辛","D.氟哌噻吨美利曲辛","E.氯米帕明"],ans:"ABDE",exp:"曲唑酮是5-HT受体拮抗和再摄取抑制剂（SARIs），心脏病患者慎用，心肌梗死恢复初期不推荐使用本品。丁螺环酮为5-HT1A受体部分激动剂，心、肝、肾功能不全慎用。氟哌噻吨美利曲辛不推荐用于心肌梗死恢复早期、各种程度的心脏传导阻滞或心律失常及冠状动脉缺血患者。氯米帕明为三环类药物（TCAs），严重心脏病、近期有心肌梗死急性发作史禁用。"},
    {type:"多项选择题",q:"100. 部分肿瘤被认为与病毒有关。下列关于肿瘤和病毒的病因关系，说法正确的有",opts:["A.肝癌与乙型肝炎病毒（HBV）感染有关","B.肝癌与丙型肝炎病毒（HCV）感染有关","C.鼻咽癌、Burkitt淋巴瘤及霍奇金淋巴瘤与单纯疱疹病毒（HSV）感染有关","D.宫颈癌与人乳头瘤病毒（HPV）感染有关","E.卡波西肉瘤、B细胞淋巴瘤等与艾滋病病毒（HIV）感染有关"],ans:"ABDE",exp:"鼻咽癌、Burkitt淋巴瘤及霍奇金淋巴瘤与人类疱疹病毒（EBV）感染有关，而非单纯疱疹病毒（HSV）。"}
  ]
},
  {
  name: "押题密卷（八）",
  questions: [
    // ===== 一、最佳选择题（1-40） =====
    {type:"最佳选择题",q:"1. 关于药品贮存和保管的注意事项，说法不正确的是",opts:["A.维生素A、维生素B2、维生素B6等对紫外线敏感药品应遮光保存","B.乳酶生片、愈美颗粒应置凉暗处保存","C.双歧杆菌乳杆菌三联活菌片、静注人免疫球蛋白等需要2℃-8℃保存","D.易燃、易爆、强腐蚀性等危险性药品应当另设仓库单独贮存","E.阿替利珠单抗注射液、贝伐珠单抗注射液用药前应充分摇匀"],ans:"E",exp:"单抗类药物如阿替利珠单抗注射液、贝伐珠单抗注射液在摇晃或者掉落时，液体内部受到机械冲击力和相关流体力学变化的影响，导致液体空化，因此不宜振摇。"},
    {type:"最佳选择题",q:"2. 一旦发生用药错误可导致患者死亡，应重点监护和管理的药物不包括",opts:["A.20%葡萄糖注射液","B.普萘洛尔注射液","C.肾上腺素注射液","D.重组人胰岛素注射液","E.阿托品注射液（规格0.5mg）"],ans:"E",exp:"高警示药品分为A级、B级和C级。A级风险最高，是指一旦发生用药错误可导致患者死亡，应重点监护和管理。20%葡萄糖注射液、普萘洛尔注射液、肾上腺素注射液、重组人胰岛素注射液、阿托品注射液（规格≥5mg/支）均为A级高警示药品。阿托品注射液（规格0.5mg）未列入高警示药品目录。"},
    {type:"最佳选择题",q:"3. 药师接收待审核处方，应对处方进行合法性、规范性、用药适宜性审核。下列属于处方合法性审核的是",opts:["A.是否注明临床诊断","B.处方医师签名或加盖的专用签章与备案留样是否一致","C.抗菌药物是否依据分级管理制度由具有相应处方权资质的医师开具","D.处方用药与临床诊断是否相符","E.是否存在配伍禁忌"],ans:"C",exp:"处方合法性审核内容包括：①处方开具人是否根据《医师法》取得医师资格，并执业注册。②处方开具时，处方医师是否根据《处方管理办法》在执业注册地点取得处方权。③麻醉药品、第一类精神药品、医疗用毒性药品、放射性药品等药品处方，是否由具有相应处方权资质的医师开具。④抗菌药物及抗肿瘤药物是否依据分级管理制度由具有相应处方权资质的医师开具。⑤终止妊娠药物的处方，是否由具有相应处方权资质的医师开具。"},
    {type:"最佳选择题",q:"4. 药师应对抗菌药物处方进行适宜性审核，下列属于合理处方的是",opts:["A.阿莫西林克拉维酸钾每日给药一次","B.头孢曲松和葡萄糖酸钙注射液同管路输注","C.16岁肺炎患者使用莫西沙星注射液","D.阴道炎患者联合使用克林霉素胶囊和甲硝唑片","E.卡泊芬净选择生理盐水作为溶媒"],ans:"E",exp:"卡泊芬净应选择生理盐水作为溶媒。阿莫西林克拉维酸钾为时间依赖型抗菌药物，不应常规选择每天1次给药。头孢曲松和葡萄糖酸钙注射液存在配伍禁忌，不得同管路输注。18岁以下儿童禁用莫西沙星等喹诺酮类药物。克林霉素已能覆盖厌氧菌，应避免与硝基咪唑类药物不必要的合用。"},
    {type:"最佳选择题",q:"5. 药学信息按照其来源通常分为三级。下列不属于一级信息的是",opts:["A.实验研究结果","B.病例报道","C.《中国药学杂志》","D.《新编药物学》","E.评价性研究结果"],ans:"D",exp:"一级信息资源即原创性论著，包括实验研究结果、病例报道以及评价性或描述性的研究结果，如《中国药学杂志》、《临床药物治疗杂志》等。《新编药物学》为三级信息资源。"},
    {type:"最佳选择题",q:"6. 与氯化钠注射液混合可导致疗效降低，适宜选用注射用水或5%葡萄糖注射液溶解的药物是",opts:["A.多烯磷脂酰胆碱","B.奥沙利铂","C.瑞替普酶","D.氟罗沙星","E.青霉素"],ans:"B",exp:"奥沙利铂与氯化钠注射液生成二氯二氨铂，使疗效降低。多烯磷脂酰胆碱注射液用氯化钠注射液溶解可产生浑浊。氟罗沙星应用氯化钠、氯化钙等注射液溶解，可出现结晶。瑞替普酶、青霉素不得用葡萄糖注射液溶解。"},
    {type:"最佳选择题",q:"7. 患者，男，48岁，多次复查电解质水平提示血钙水平偏低。可导致血钙降低的原因不包括",opts:["A.甲状旁腺功能亢进症","B.骨质软化症","C.长期低钙饮食","D.小肠吸收不良综合征","E.甲状旁腺功能减退症"],ans:"A",exp:"血钙降低主要原因有：①成骨作用增强，甲状旁腺功能减退症。②吸收减少，佝偻病、骨质软化症等。③摄入不足，长期低钙饮食。④吸收不良，小肠吸收不良综合征等。甲状旁腺功能亢进症可导致高钙血症。"},
    {type:"最佳选择题",q:"8. 下列可判定为药品不良反应，应该填写《药品不良反应/不良事件报告》并按规定上报的情形是",opts:["A.肾服胰酶肠溶片出现口腔溃疡","B.使用三倍正常剂量对乙酰氨基酚出现肝损伤","C.使用磷酸奥司他韦75mg出现恶心、呕吐","D.开服用非洛地平缓释片出现头晕、心悸","E.餐前漏服瑞格列奈出现血糖升高"],ans:"C",exp:"药品不良反应（ADR）定义为合格药品在正常用法用量下出现的与用药目的无关的有害反应。嚼服胰酶肠溶片、掰开服用非洛地平缓释片、漏服瑞格列奈均为非正常用法。使用三倍正常剂量对乙酰氨基酚为非正常用量。"},
    {type:"最佳选择题",q:"9. 妊娠期用药需考虑对胎儿的影响。下列关于胎儿的药动学特点，说法不正确的是",opts:["A.多数药物以被动转运方式顺浓度差进行胎盘转运","B.药物经胎盘转运的速度受胎盘因素和药物因素影响，一般情况下妊娠中期转运较慢，孕初3个月和妊娠末期3个月转运较快","C.CYP3A亚家族是肝脏中表达最丰富的CYP，成人中最主要表达CYP3A4，胎儿肝脏首要表达CYP3A7","D.分子量小、脂溶性高、蛋白结合率高的药物更快通过胎盘","E.药物在胎儿体内代谢、转化成极性大的可溶性代谢物，不易被胎盘转运至母体血液中排泄"],ans:"D",exp:"药物的相对分子质量、脂溶性、蛋白结合率及胎盘血流量、生物膜厚度等多种因素影响药物的通透速度，分子量小、脂溶性高、蛋白结合率低的药物更快通过胎盘。"},
    {type:"最佳选择题",q:"10. 患者，男，49岁，肾移植术后，为抑制排斥反应使用免疫抑制剂。下列药物中有明显胃肠道反应，建议餐中服用的是",opts:["A.环孢素","B.硫唑嘌呤","C.吗替麦考酚酯","D.西罗莫司","E.泼尼松"],ans:"B",exp:"硫唑嘌呤建议与食物同服以减轻胃肠道不适症状。环孢素、西罗莫司可选择餐前或餐后给药，但用药时间要求一致。吗替麦考酚酯空腹给药。泼尼松等糖皮质激素在清晨8时服用。"},
    {type:"最佳选择题",q:"11. 患者，男，18岁，中午打球时出现头晕、恶心、肌肉痉挛，诊断为中暑，关于该患者的处理措施不正确的是",opts:["A.立即停止运动，前往阴凉处或有空调的室内","B.饮用水或运动饮料，但不要饮用含酒精或咖啡因的饮料","C.立即口服布洛芬有利于身体快速降温","D.在颈部、腋下和腹股沟区放置冰袋或凉毛巾","E.如出现抽搐可予地西泮5mg静脉给药或肌注"],ans:"C",exp:"对于中暑退热剂治疗无效，因为与发热不同，热射病的发病机制并不涉及下丘脑体温调定点改变；对乙酰氨基酚和非甾体抗炎药（如布洛芬）等退热剂可能加重热射病的并发症，例如急性肾损伤、肝衰竭和弥散性血管内凝血。"},
    {type:"最佳选择题",q:"12. 中毒药物不明、砷化物、硝酸银等药物中毒常用的洗胃液，应避免使用热溶液以防止血管扩张的是",opts:["A.5%葡萄糖注射液","B.3%稀酸溶液","C.1:5000高锰酸钾溶液","D.1%肥皂水","E.0.9%氯化钠注射液"],ans:"E",exp:"1%～2%氯化钠溶液或生理盐水常用于毒物不明的急性中毒；可用于砷化物、硝酸银等药物中毒，与之形成腐蚀性较小的氯化物，应避免使用热溶液以防止血管扩张。"},
    {type:"最佳选择题",q:"13. 患儿，女，10岁，因持续性过敏性鼻炎长期使用丙酸氟替卡松鼻喷剂，可能出现的不良反应是",opts:["A.抑郁","B.鼻出血","C.鼻部息肉","D.眼睛干涩","E.心悸"],ans:"B",exp:"丙酸氟替卡松鼻喷剂可导致鼻刺激和鼻出血。"},
    {type:"最佳选择题",q:"14. 患者，男，25岁，反复发作口腔溃疡，症状明显，影响进食、说话，可选用的治疗药物不包括",opts:["A.苯佐卡因凝胶","B.西吡氯铵含漱液","C.地塞米松软膏","D.秋水仙碱片","E.尼可地尔片"],ans:"E",exp:"某些药物如阿司匹林和其他非甾体抗炎药、细胞毒性药物、尼可地尔、β受体拮抗剂、柳氮磺吡啶可引起口腔溃疡。苯佐卡因凝胶可止痛。西吡氯铵含漱液为消毒防腐药。地塞米松软膏为糖皮质激素。沙利度胺、秋水仙碱、孟鲁司特、己酮可可碱等也可用于口腔溃疡的治疗。"},
    {type:"最佳选择题",q:"15. 关于比沙可啶肠溶片的特点和用药注射事项，说法不正确的是",opts:["A.在肠道内形成高渗状态，吸收水分，增加体积，刺激蠕动","B.服药前后2小时不服牛奶或抗酸剂","C.长期服用可导致结肠黑变病，建议短期、间断服用","D.禁用于<6岁儿童及妊娠期女性","E.必须整片吞服，不得嚼碎或溶解后服用"],ans:"A",exp:"比沙可啶为刺激性泻药，作用于肠神经系统，增强肠道动力和刺激肠道分泌。在肠道内形成高渗状态，吸收水分，增加体积，刺激蠕动为渗透性泻药的特点。"},
    {type:"最佳选择题",q:"16. 患者，女，30岁，有青霉素过敏史，妊娠12周，无明显不适，常规产检时筛查发现：尿白细胞计数150个/μL，尿细菌数2×10^5cfu/ml。关于该患者正确的治疗方式是",opts:["A.无需抗感染治疗","B.使用阿莫西林-克拉霉素注射液","C.使用磷霉素氨丁三醇片","D.使用复方磺胺甲噁唑片","E.使用甲硝唑注射液"],ans:"C",exp:"妊娠期无症状菌尿应给予抗菌药物彻底根治，抗菌药物的选择可为阿莫西林-克拉维酸、头孢氨苄、磷霉素氨丁三醇。"},
    {type:"最佳选择题",q:"17. 患者，女，28岁，已婚，有备孕计划，因近一年月经周期不规律就诊，确诊为多囊卵巢综合征。为调整月经周期宜首选的治疗方案是",opts:["A.周期性使用屈螺酮-炔雌醇片","B.周期性使用地屈孕酮","C.连续使用螺内酯片","D.连续使用二甲双胍片","E.使用左炔诺孕酮宫内节育系统"],ans:"B",exp:"周期性使用孕激素是青春期、围绝经期PCOS女性调整月经周期的首选，也可用于育龄期有妊娠计划的PCOS女性。推荐使用天然孕激素或地屈孕酮。"},
    {type:"最佳选择题",q:"18. 患者，男，25岁，诊断为单纯疱疹，关于该患者的治疗方案，说法正确的是",opts:["A.首选阿昔洛韦片0.2g tid po","B.病情严重对阿昔洛韦耐药时应用伐昔洛韦","C.水疱未破时使用喷昔洛韦乳膏或糠酸莫米松乳膏","D.可局部外用2%硫酸锌溶液或1%醋酸铝溶液湿敷","E.反复感染单纯疱疹病毒可致癌"],ans:"D",exp:"单纯疱疹局部治疗忌用糖皮质激素软膏，应以收敛、干燥和预防感染为主，可外用2%硫酸锌溶液或1%醋酸铝溶液湿敷。对首次发作的患者，可用阿昔洛韦，0.2g每日5次口服，或0.4g，每日3次口服，疗程7～10天。严重的单纯疱疹且对阿昔洛韦耐药的患者，可考虑系统应用膦甲酸钠治疗。应消除对HSV感染导致癌症的误解。"},
    {type:"最佳选择题",q:"19. 患者，女，49岁，诊断为中度斑块状银屑病，可使用的生物制剂是",opts:["A.阿那白滞素","B.阿达木单抗","C.利妥昔单抗","D.沙利鲁单抗","E.他克莫司"],ans:"B",exp:"阿达木单抗可用于银屑病的治疗，我国批准的适应证是需要系统治疗的成人中、重度斑块状银屑病以及对局部治疗和光疗反应不佳或不适于该类治疗的4岁及以上儿童与青少年重度斑块状银屑病。"},
    {type:"最佳选择题",q:"20. 患儿，男，2岁，面部及腿部皮肤反复出现红斑、伴丘疹，因患儿反复搔抓就诊，诊断为轻度湿疹，可使用的药物是",opts:["A.地奈德乳膏","B.曲安奈德乳膏","C.卤米松乳膏","D.阿昔洛韦乳膏","E.夫西地酸软膏"],ans:"A",exp:"轻度湿疹建议选择弱效糖皮质激素如氢化可的松、地奈德乳膏。中度湿疹建议选择中效糖皮质激素如曲安奈德乳膏。重度肥厚性皮损建议选择强效糖皮质激素如哈西奈德、卤米松、丙酸氯倍他索等。"},
    {type:"最佳选择题",q:"21. 患者，女，40岁，因家庭琐事心烦易怒、脱发严重，头顶发缝逐渐变宽前往药店进行咨询。药师对该患者的用药指导说法不正确的是",opts:["A.保持头发清洁，常用指腹按摩头皮","B.2%米诺地尔涂抹在脱发区域头皮，每日2次，每次1ml","C.口服螺内酯片，每日40mg","D.口服非那雄胺片，每次1mg，每日1次","E.口服九味肝泰胶囊，每次4粒，每日2次"],ans:"D",exp:"非那雄胺仅适用于男性患者，该药通过特异性抑制Ⅱ型5α还原酶，进而减少双氢睾酮的生成和对毛囊的破坏。推荐剂量为1mg/d，1次/日。"},
    {type:"最佳选择题",q:"22. 患者，女，38岁，因头晕、乏力、心悸就诊，实验室检查：Hb72g/L，诊断为缺铁性贫血，予以多糖铁复合物进行治疗。关于该药的用法用量和作用特点，说法不正确的是",opts:["A.可迅速提高血清铁和血红蛋白水平","B.吸收率受食物成分影响，避免与食物同服","C.对胃肠道黏膜无刺激和腐蚀作用","D.每次1～2粒，每日一次","E.每粒胶囊含元素铁150mg，含铁量为46%"],ans:"B",exp:"多糖铁复合物以分子形式被吸收，吸收率不受胃酸减少、食物成分的影响。"},
    {type:"最佳选择题",q:"23. 患者，男，72岁，有慢性阻塞性肺疾病病史3年，每年至少出现一次急性加重导致住院，近期复诊查肺功能评估：FEV1/FVC<70%，50%≤FEV1<80%，血嗜酸性粒细胞352/μl，该患者目前宜使用的治疗方案是",opts:["A.噻托溴铵吸入粉雾剂","B.倍氯米松-福莫特罗气雾剂","C.糠酸氟替卡松-维兰特罗干粉剂","D.布地奈德-福莫特罗-格隆溴铵气雾剂","E.布地奈德气雾剂+罗氟司特片+阿奇霉素"],ans:"D",exp:"血嗜酸性粒细胞≥300/μl，考虑使用LABA+LAMA+ICS，如布地奈德-福莫特罗-格隆溴铵气雾剂。ICS规律治疗会增加肺炎的风险，尤其是在重度慢阻肺患者中。不建议对慢阻肺患者采用LABA+ICS联合给药。LABA+LAMA+ICS组合已被证明优于LABA+ICS。"},
    {type:"最佳选择题",q:"24. 关于老年高血压的特点和治疗，说法不正确的是",opts:["A.老年高血压治疗的主要目标是收缩压达标","B.65-79岁老年人血压≥140/90mmHg应开始药物治疗，降压目标<140/90mmHg，如可耐受，可降至<130/80mmHg","C.≥80岁老年人，收缩压≥150/90mmHg可开始药物治疗，降压目标<150/90mmHg，如患者可耐受，可降至<140/90mmHg","D.一般以小剂量单药起始治疗，逐步增加药物剂量或联合治疗直至收缩压达标","E.开始药物治疗的老年患者应在2-4周内逐步降压达标"],ans:"E",exp:"开始药物治疗的老年高血压患者应在4～12周内逐步降压达标。"},
    {type:"最佳选择题",q:"25. 患者，男，50岁，诊断为高胆固醇血症，医师处方：辛伐他汀20mg qn。服药半年后查TC 5.2mmol/L，LDL-C 3.3mmol/L，肝脏转氨酶升高，调整治疗方案不正确的是",opts:["A.改为辛伐他汀10mg qn","B.换用另一种代谢途径的他汀类","C.改为辛伐他汀20mg qod","D.换用依折麦布10mg qd","E.换用高纯度ω-3脂肪酸"],ans:"E",exp:"如果应用某种他汀类后发生肝酶增高等不良反应，可采用换用另外一种代谢途径的他汀类、减少剂量、隔日服用或换用非他汀类药物或小剂量他汀与非他汀类药物联合应用等方法处理。高纯度ω-3脂肪酸主要用于治疗高三酰甘油（TG）血症。"},
    {type:"最佳选择题",q:"26. 患者，男，66岁，既往有痛风、胰腺炎病史，近期诊断为高血压、血脂异常，使用阿托伐他汀10mg qn治疗半年后，复查血脂TC 5.0mmol/L，TG 4.9mmol/L，适宜联用的调脂药有",opts:["A.依折麦布","B.非诺贝特","C.烟酸缓释片","D.吉非罗齐","E.考来烯胺"],ans:"B",exp:"他汀类与贝特类联合应用能有效降低LDL-C和TG水平，升高HDL-C水平。他汀类药物禁忌与吉非罗齐（吉非贝齐）合用。依折麦布、考来烯胺主要降低胆固醇。"},
    {type:"最佳选择题",q:"27. 患者，男，72岁，有冠心病史，平素未规律服药，因突发胸痛两小时且服用硝酸甘油三次后无改善而就诊，诊断为非ST段抬高型心肌梗死（NSTEMI）。关于该患者目前的治疗方案，说法正确的是",opts:["A.尽早整片吞服阿司匹林肠溶片300mg，禁止嚼碎服用","B.尽早开始他汀类药物治疗，LDL-C目标值<2.6mmol/L","C.静脉滴注单硝酸异山梨酯注射液","D.尽早开始ACEI或ARB治疗","E.足量β受体拮抗剂与硝酸酯类药物治疗仍不能控制缺血症状应联用维拉帕米"],ans:"D",exp:"长期应用ACEI或ARB治疗能降低心血管事件发生率，若无禁忌证（如低血压、肾衰竭或双侧肾动脉狭窄），UA/NSTEMI患者应在24小时内开始ACEI或ARB的治疗。UA/NSTEMI急性期使用阿司匹林为首剂口服非肠溶制剂或嚼服肠溶制剂300mg，随后75～100mg，qd，长期维持。UA/NSTEMI患者均应尽早（24小时内）开始他汀类药物治疗，LDL-C目标值<1.8mmol/L。单硝酸异山梨酯注射剂起效缓慢，不适宜用于缓解急性发作症状。"},
    {type:"最佳选择题",q:"28. 冠心病患者要坚持长期药物治疗、控制缺血症状、降低心肌梗死的发生率和死亡率。关于冠心病二级预防的“ABCDE”方案，说法不正确的是",opts:["A.“C”指控制胆固醇和戒烟","B.“B”指β受体拮抗剂和血压控制","C.“D”指控制饮食和糖尿病","D.“A”指阿哌沙班和ACEI","E.“E”指健康教育和运动"],ans:"D",exp:"冠心病二级预防包括服用一种或两种抗血小板药物、β受体拮抗剂、他汀类药物和ACEI/ARB，严格控制危险因素，进行有计划及适当的运动锻炼。“A”指阿司匹林和ACEI。"},
    {type:"最佳选择题",q:"29. 患者，女，65岁，有高血压、冠心病史，1月前行冠脉支架植入术（PCI），口服阿司匹林和氯吡格雷，近日查心电图确诊为心房颤动，CHA2DS2-VASc-60评分5分，首选的抗凝药物是",opts:["A.依诺肝素","B.替格瑞洛","C.华法林","D.利伐沙班","E.普通肝素"],ans:"D",exp:"对于冠状动脉支架植入的房颤患者，如有服用抗凝药物指征，联合抗血小板治疗时应首选直接口服抗凝药物（DOAC），如达比加群酯、利伐沙班、阿哌沙班、艾多沙班。"},
    {type:"最佳选择题",q:"30. 患者，男，33岁，诊断为重度抑郁症，足量、足疗程使用氟西汀效果仍不佳，可换用的药物是",opts:["A.氟伏沙明","B.美托洛尔","C.西酞普兰","D.度洛西汀","E.氯硝西泮"],ans:"D",exp:"抑郁症患者足量和足够长的疗程（>4～6周）如仍无效，可考虑换药。氟西汀是选择性5-HT再摄取抑制剂（SSRIs）。度洛西汀是5-HT/NE再摄取抑制剂（SNRIs），对SSRIs无效的严重抑郁症患者也有效。"},
    {type:"最佳选择题",q:"31. 患者，男，68岁，3年前确诊为帕金森病，服用多巴丝肼进行治疗。近期出现剂末恶化现象。关于对该患者的处理方法，说法不正确的是",opts:["A.不增加多巴丝肼的每日总剂量，适当增加每日服药次数，减少每次服药剂量","B.适当增加每日总剂量，每次服药剂量不变，而增加每日服药次数","C.加用恩他卡朋","D.加用普拉克索","E.加用加兰他敏"],ans:"E",exp:"对剂末恶化的处理方法为：（1）不增加服用复方左旋多巴的每日总剂量，而适当增加每日服药次数，减少每次服药剂量；或适当增加每日总剂量，每次服药剂量不变，而增加每日服药次数；（2）由常释剂换用缓、控释剂以延长左旋多巴的作用时间，更适宜在早期出现剂末恶化，尤其发生在夜间时为较佳选择，剂量需增加20%～30%；（3）加用长半衰期的DAs，如普拉克索、罗匹尼罗、卡麦角林、阿扑吗啡、溴隐亭，若已用一种DAs而疗效减退，可尝试换用另一种DAs；（4）加用对纹状体产生持续性DA能刺激的COMTI，如恩他卡朋、托卡朋；（5）加用MAO-BI，如雷沙吉兰、司来吉兰；（6）避免饮食（含蛋白质）对左旋多巴吸收及通过血-脑屏障的影响，宜在餐前1小时或餐后1.5小时服药，调整蛋白质饮食可能有效。加兰他敏是用于治疗阿尔茨海默病。"},
    {type:"最佳选择题",q:"32. 患者，女，53岁，因餐后明显上腹痛疼痛就诊，胃镜检查显示：胃窦小弯侧有一约6mm溃疡，13C呼气试验阳性。予以阿莫西林、甲硝唑、伏诺拉生、枸橼酸铋钾进行根除幽门螺杆菌（HP）治疗。关于伏诺拉生的特点和注意事项，说法不正确的是",opts:["A.CYP3A4抑制剂如克拉霉素可升高伏诺拉生血药浓度","B.根除HP治疗的用法用量为20mg bid","C.应在餐前半小时服用","D.用于胃溃疡的治疗疗程最多为8周","E.比PPI起效更快、作用更强、抑酸效果更持久"],ans:"C",exp:"伏诺拉生为钾离子竞争性酸阻滞剂（P-CAB），其可逆性与质子泵的静息泵和活性泵结合，可任意时间服用，不受饮食影响，十二指肠溃疡治疗疗程最多6周，胃溃疡治疗限制在8周。P-CAB比PPI起效更快、持续时间更长、抑酸效果更强。"},
    {type:"最佳选择题",q:"33. 患者，女，29岁，因病毒性乙肝使用药物治疗后出现发热、乏力，可导致该流感样症状的抗乙肝病毒药物是",opts:["A.富马酸替诺福韦酯","B.干扰素α","C.阿德福韦","D.恩替卡韦","E.富马酸丙酚替诺福韦"],ans:"B",exp:"干扰素α不良反应主要包括流感样症候群、骨髓抑制、精神异常、甲状腺功能异常、自身免疫性疾病和少见的肾损害、心血管并发症、视网膜病变、听力下降等。"},
    {type:"最佳选择题",q:"34. 患者，女，26岁，诊断为甲状腺功能减退症，予以左甲状腺素钠片进行治疗。下列药物中可导致左甲状腺素钠游离血药浓度升高的是",opts:["A.阿司匹林","B.考来烯胺","C.硫酸亚铁","D.胺碘酮","E.卡马西平"],ans:"A",exp:"水杨酸盐（如阿司匹林）、双香豆素、大剂量呋塞米（250mg）、氯贝丁酯等药物可将左甲状腺素从其血浆蛋白结合位点上置换出来，导致左甲状腺素的游离型血药浓度升高。"},
    {type:"最佳选择题",q:"35. 患者，女，67岁，有2型糖尿病史，近期诊断为骨质疏松症。长期使用有骨折风险，应避免用于该患者的降糖药是",opts:["A.噻唑烷二酮类药物","B.钠-葡萄糖协同转运蛋白-2抑制剂","C.双胍类","D.促胰岛素分泌剂","E.α-葡萄糖苷酶抑制剂"],ans:"A",exp:"噻唑烷二酮类药物胰岛素增敏剂增加骨折和心力衰竭的风险。"},
    {type:"最佳选择题",q:"36. 患者，男，74岁，有心力衰竭、慢性肾功能不全病史，实验室检查：eGFR 35ml/(min·1.73m²)，糖耐量试验：12.2mmol/L，诊断为2型糖尿病。该患者无需减量可正常使用的降糖药是",opts:["A.二甲双胍","B.吡格列酮","C.利格列汀","D.胰岛素","E.卡格列净"],ans:"C",exp:"eGFR 35ml/(min·1.73m²)为CKD3期。利格列汀在CKD4～5期时都无需减量。eGFR<45ml/(min·1.73m²)禁用二甲双胍，不建议用卡格列净。吡格列酮禁用于心力衰竭患者。胰岛素对CKD3期以上患者需减量。"},
    {type:"最佳选择题",q:"37. 患者，男，73岁，有心房颤动病史，长期使用华法林，诊断为骨质疏松症，禁用的抗骨质疏松药物是",opts:["A.阿仑膦酸钠","B.鲑降钙素","C.特立帕肽","D.四烯甲萘醌","E.碳酸钙"],ans:"D",exp:"四烯甲萘醌与华法林合用可影响抗凝药的效果，因此服用华法林的患者禁忌使用该药物。"},
    {type:"最佳选择题",q:"38. 患者，男，42岁，因急性痛风性关节炎发作使用秋水仙碱。对于该患者的用药交代，说法错误的是",opts:["A.在痛风发作12小时内尽早使用","B.出现恶心、呕吐、腹泻、腹痛等胃肠道反应时，应立即停药","C.建议与克拉霉素、维拉帕米等药物同时使用以提高疗效","D.使用时须注意监测血常规","E.使用时须监测肝功能，氨基转移酶升高超过正常参考值上限2倍时须停药"],ans:"C",exp:"已应用CYP3A4或磷酸化糖蛋白抑制剂（如环孢素、克拉霉素、维拉帕米等）者避免使用秋水仙碱。"},
    {type:"最佳选择题",q:"39. 患者，男，62岁，因双手指关节肿痛、活动不便就诊，完善相关检查确诊为类风湿关节炎，立即给予泼尼松10mg进行治疗。下列描述错误的是",opts:["A.清晨8时口服","B.用药期间需补充钙剂和维生素D","C.用药期间监测血压及血糖变化","D.泼尼松能迅速减轻关节疼痛、肿胀","E.使用泼尼松能明显改善症状时无需加用其他抗风湿药物"],ans:"E",exp:"小剂量糖皮质激素（每日泼尼松10mg或等效的其他激素）可缓解多数患者症状，并作为DMARDs起效前的“桥梁”作用，或NSAIDs疗效不满意时的短期干预措施，必须纠正单用激素治疗RA的倾向，用激素时应同时服用DMARDs。"},
    {type:"最佳选择题",q:"40. 患者，男，52岁，有系统性红斑狼疮病史10年，长期使用糖皮质激素、免疫抑制剂治疗，近期症状恶化，可使用的生物制剂是",opts:["A.阿巴西普","B.霉酚酸酯","C.利妥昔单抗","D.阿利西尤单抗","E.环磷酰胺"],ans:"C",exp:"对难治/复发性重症系统性红斑狼疮，可考虑利妥昔单抗治疗。我国现有治疗系统性红斑狼疮的生物制剂有利妥昔单抗、贝利尤单抗、泰它西普。"},

    // ===== 二、配伍选择题（41-85） =====
    {type:"配伍选择题",subs:[
      {q:"41. 长期使用可导致嗜酸性粒细胞减少的药物是",opts:["A.青霉素","B.红霉素","C.泼尼松","D.头孢他啶","E.利奈唑胺"],ans:"C",exp:"长期应用肾上腺皮质激素（如泼尼松）、烟酸、甲状腺素等可致嗜酸性粒细胞减少。"},
      {q:"42. 可导致丙氨酸氨基转移酶（ALT）升高的药物是",opts:["A.青霉素","B.红霉素","C.泼尼松","D.头孢他啶","E.利奈唑胺"],ans:"B",exp:"氯丙嗪、异烟肼、奎宁、水杨酸、利福平、红霉素、氟康唑、他汀类等可致丙氨酸氨基转移酶（ALT）升高。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"43. 患者，男，62岁，诊断为糖尿病，误服双倍剂量格列齐特后出现心悸、冷汗、震颤等低血糖反应，经口服葡萄糖后缓解。此用药错误的分级是",opts:["A.C级","B.D级","C.E级","D.F级","E.G级"],ans:"C",exp:"E级是指错误造成患者暂时性伤害，需要采取处置措施。"},
      {q:"44. 患者，女，45岁，因乳腺癌进行化疗，由于医师计算错误导致氟尿嘧啶剂量超量200%，出现骨髓抑制，需住院进行升白细胞治疗。此用药错误的分级是",opts:["A.C级","B.D级","C.E级","D.F级","E.G级"],ans:"D",exp:"F级是指错误对患者的伤害导致患者住院或延长患者住院时间。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"45. 可用于心绞痛的治疗，亦列入兴奋剂目录，运动员赛内和赛外均禁用的代谢调节剂是",opts:["A.曲美他嗪","B.硝酸甘油","C.美托洛尔","D.苯海拉明","E.氨氯地平"],ans:"A",exp:"曲美他嗪可用于心绞痛的治疗。作为代谢调节剂，列入兴奋剂目录，运动员赛内和赛外均禁用。"},
      {q:"46. 能消除运动员比赛前的紧张心理，射击、体操、滑雪、赛车等项目的运动员禁用的药物是",opts:["A.曲美他嗪","B.硝酸甘油","C.美托洛尔","D.苯海拉明","E.氨氯地平"],ans:"C",exp:"β受体拮抗剂如比索洛尔、艾司洛尔、美托洛尔，消除比赛前的紧张心理，增加运动耐力，增强平衡功能。"},
      {q:"47. 可导致视物模糊，驾驶员驾驶慎用的药物是",opts:["A.曲美他嗪","B.硝酸甘油","C.美托洛尔","D.苯海拉明","E.氨氯地平"],ans:"B",exp:"血管扩张药二氢麦角碱和硝酸甘油可导致视物模糊，驾驶员驾驶慎用。苯海拉明等抗组胺药可能抑制中枢神经，致嗜睡、眩晕、头痛、乏力和不自主颤抖等反应。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"48. 患者，女，72岁，有恶性肿瘤病史，大剂量使用甲氨蝶呤导致中毒，需使用的解救药物是",opts:["A.亚甲蓝","B.亚叶酸钙","C.青霉胺","D.氟马西尼","E.纳洛酮"],ans:"B",exp:"甲氨蝶呤过量、甲氧苄啶急性中毒使用亚叶酸钙解救。"},
      {q:"49. 患者，男，66岁，摄入大量劣质加工肉类后出现亚硝酸盐中毒，宜使用的解救药物是",opts:["A.亚甲蓝","B.亚叶酸钙","C.青霉胺","D.氟马西尼","E.纳洛酮"],ans:"A",exp:"小剂量亚甲蓝可治疗高铁血红蛋白血症（亚硝酸盐中毒等）。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"50. 患者，女，31岁，哺乳期，诊断为流行性感冒，为不影响哺乳适宜选择的抗流感病毒药物是",opts:["A.金刚烷胺","B.奥利司他","C.玛巴洛沙韦","D.奥司他韦","E.对乙酰氨基酚"],ans:"D",exp:"哺乳期流感患者如果需要继续母乳喂养，应首选口服奥司他韦治疗。"},
      {q:"51. 患者，男，39岁，出差后突发高热、全身乏力伴咳嗽，就医后诊断为流行性感冒，在48小时内单次服用的抗流感病毒药物是",opts:["A.金刚烷胺","B.奥利司他","C.玛巴洛沙韦","D.奥司他韦","E.对乙酰氨基酚"],ans:"C",exp:"病毒RNA聚合酶抑制剂玛巴洛沙韦在症状出现后48小时内单次服用。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"52. 患者，女，28岁，妊娠25周，诊断为外阴阴道假丝酵母菌病，适宜选择的治疗药物是",opts:["A.甲硝唑片","B.克霉唑栓","C.伊曲康唑胶囊","D.头孢泊肟酯片","E.头孢泊肟酯片"],ans:"B",exp:"妊娠期外阴阴道假丝酵母菌病可阴道局部用药如克霉唑。"},
      {q:"53. 患者，女，30岁，哺乳期，诊断为哺乳期乳腺炎，适宜选择的治疗药物是",opts:["A.甲硝唑片","B.克霉唑栓","C.伊曲康唑胶囊","D.头孢泊肟酯片","E.头孢泊肟酯片"],ans:"D",exp:"在取得药物敏感试验结果前，推荐经验性使用耐酶青霉素类（如苯唑西林钠）、第一代头孢菌素（如头孢拉定）/第二代头孢菌素或头霉素类（如头孢美唑）；若青霉素或头孢菌素过敏时，建议使用大环内酯类（如红霉素、阿奇霉素）或林可酰胺类抗生素（如克林霉素）。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"54. 患者，女，55岁，右侧腰部突发灼热、疼痛，继之出现簇集性水疱，诊断为带状疱疹，针对明显疼痛症状可选用的止痛药物是",opts:["A.泼尼松片","B.夫西地酸乳膏","C.复方甘草酸苷片","D.阿米替林胶囊","E.卤米松乳膏"],ans:"D",exp:"带状疱疹轻至中度疼痛可用对乙酰氨基酚、布洛芬缓释胶囊，建议饭后服用。中至重度疼痛临床多选用治疗神经病理性疼痛类药物如加巴喷丁、普瑞巴林胶囊；三环类抗抑郁药如阿米替林、多塞平等可以治疗不同时期的疼痛。"},
      {q:"55. 患者，男，58岁，有白癜风病史，稳定期适宜使用的免疫调节药物是",opts:["A.泼尼松片","B.夫西地酸乳膏","C.复方甘草酸苷片","D.阿米替林胶囊","E.卤米松乳膏"],ans:"C",exp:"白癜风系统治疗常用的免疫调节剂如复方甘草酸苷片，中老年患者使用时注意监测血压、电解质。"},
      {q:"56. 患者，男，56岁，因甲周红肿、疼痛伴脓性分泌物就诊，诊断为甲沟炎，局部治疗宜选用的药物",opts:["A.泼尼松片","B.夫西地酸乳膏","C.复方甘草酸苷片","D.阿米替林胶囊","E.卤米松乳膏"],ans:"B",exp:"甲沟炎局部外用治疗选择使用碘伏、双氧水（过氧化氢）、生理盐水冲洗创面后局部外用抗生素药膏，如夫西地酸乳膏、莫匹罗星乳膏、复方多黏菌素B乳膏等。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"57. 患者，女，62岁，诊断为胆石症，溶解胆结石可使用的药物是",opts:["A.匹维溴铵","B.熊去氧胆酸","C.诺氟沙星","D.利那洛肽","E.地奥司明"],ans:"B",exp:"熊去氧胆酸抑制肝脏胆固醇的合成，显著降低胆汁中胆固醇及胆固醇酯的含量和胆固醇的饱和指数，从而有利于结石中胆固醇逐渐溶解；同时还可促进液态胆固醇晶体复合物形成，后者可加速胆固醇从胆囊向肠道排泄清除。"},
      {q:"58. 患者，男，68岁，诊断为功能性慢性腹泻，可使用的药物是",opts:["A.匹维溴铵","B.熊去氧胆酸","C.诺氟沙星","D.利那洛肽","E.地奥司明"],ans:"A",exp:"解痉止痛类药是治疗功能性慢性腹泻的重要药物，选择性肠道平滑肌钙离子拮抗剂和离子通道调节剂可以缓解平滑肌痉挛，主要包括动力调节药曲美布汀、胃肠道解痉药匹维溴铵、复方枸橼酸阿尔维林等。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"59. 患者，男，28岁，长时间使用电子产品出现视疲劳，为改善睫状肌功能可选用的药物是",opts:["A.七叶洋地黄双苷滴眼液","B.红霉素眼膏","C.非尼拉敏/萘甲唑林滴眼液","D.地夸磷索钠滴眼液","E.玻璃酸钠滴眼液"],ans:"A",exp:"七叶洋地黄双苷滴眼液可改善睫状肌收缩功能和增加睫状肌血流量以减轻眼部不适。"},
      {q:"60. 患者，女，52岁，主诉眼干、眼红、刺激感并伴畏光、视物模糊，诊断为干眼症，为促进泪液分泌可选用的药物是",opts:["A.七叶洋地黄双苷滴眼液","B.红霉素眼膏","C.非尼拉敏/萘甲唑林滴眼液","D.地夸磷索钠滴眼液","E.玻璃酸钠滴眼液"],ans:"D",exp:"目前国内临床促进泪液分泌的主要药物是促进黏蛋白分泌的P2Y2受体激动剂地夸磷索钠，其作用机制是刺激眼表上皮细胞分泌黏蛋白，对水液和脂质分泌也具有一定促进作用。"},
      {q:"61. 患者，男，20岁，晨起右眼眼睑结痂、眼部烧灼感、砂砾感，查体：右眼结膜充血、有水样分泌物，下拉下眼睑可见黏液样分泌物，诊断为病毒性结膜炎，可缓解症状的药物是",opts:["A.七叶洋地黄双苷滴眼液","B.红霉素眼膏","C.非尼拉敏/萘甲唑林滴眼液","D.地夸磷索钠滴眼液","E.玻璃酸钠滴眼液"],ans:"C",exp:"目前尚无治疗病毒性结膜炎的局部用或全身用特异性抗病毒药物。以下措施可能缓解症状：①局部用抗组胺药/减充血剂，有非处方药物（非尼拉敏/萘甲唑林、酮替芬、奥洛他定等）。②热敷或冷敷。③非抗生素类润滑剂。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"62. 患者，女，48岁，因哮喘进行药物治疗，用药过程中出现心悸、手抖，导致该反应的药物是",opts:["A.布地奈德气雾剂","B.倍氯米松-福莫特罗气雾剂","C.阿地溴铵吸入粉雾剂","D.孟鲁司特钠咀嚼片","E.罗氟司特片"],ans:"B",exp:"β2受体激动药包括短效的沙丁胺醇、特布他林，长效的沙美特罗、福莫特罗等，不良反应包括骨骼肌震颤、低血钾、心律紊乱等。"},
      {q:"63. 患者，男，72岁，有慢性阻塞性肺疾病史，在药物治疗过程中出现口干，导致该反应的药物是",opts:["A.布地奈德气雾剂","B.倍氯米松-福莫特罗气雾剂","C.阿地溴铵吸入粉雾剂","D.孟鲁司特钠咀嚼片","E.罗氟司特片"],ans:"C",exp:"阿地溴铵等抗胆碱药可导致口干。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"64. 患者，男，70岁，有心力衰竭、双侧肾动脉狭窄病史，诊断为高血压，绝对禁用的药物是",opts:["A.β受体拮抗剂","B.二氢吡啶类钙通道阻滞剂","C.血管紧张素受体脑啡肽酶抑制剂","D.α受体拮抗剂","E.噻嗪类利尿剂"],ans:"C",exp:"双侧肾动脉狭窄禁用血管紧张素转换酶抑制剂（ACEI）、血管紧张素Ⅱ受体拮抗剂（ARB）、血管紧张素受体脑啡肽酶抑制剂（ARNI）。心力衰竭禁用非二氢吡啶类钙通道阻滞剂，慎用二氢吡啶类钙通道阻滞剂、α受体拮抗剂。"},
      {q:"65. 患者，男，65岁，有前列腺增生病史，近期诊断为高血压、高脂血症，宜选用的降压药物是",opts:["A.β受体拮抗剂","B.二氢吡啶类钙通道阻滞剂","C.血管紧张素受体脑啡肽酶抑制剂","D.α受体拮抗剂","E.噻嗪类利尿剂"],ans:"D",exp:"α受体拮抗剂不作为常用的降压药物使用，适用于高血压合并良性前列腺增生症、原发性震颤、血糖或血脂异常、难治性高血压，也可用于合并周围血管疾病、哮喘的患者。"},
      {q:"66. 患者，女，62岁，因冠心病、高血压长期服用药物，近期考虑调整药物治疗方案。在停药前应逐渐减少，不得突然停用的药物是",opts:["A.β受体拮抗剂","B.二氢吡啶类钙通道阻滞剂","C.血管紧张素受体脑啡肽酶抑制剂","D.α受体拮抗剂","E.噻嗪类利尿剂"],ans:"A",exp:"长期应用β受体拮抗剂突然停药可发生反跳现象的撤药综合征，剂量应在停药前逐渐减少。"}
    ]},
    {type:"配伍选择题",subs:[

    {type:"最佳选择题",q:"86. 奥利司他适宜的服药时间是",opts:["A.餐前半小时","B.餐中","C.清晨空腹","D.餐后至少半小时","E.睡前顿服"],ans:"B",exp:"奥利司他应进餐时服用。"},
    {type:"最佳选择题",q:"87. 奥利司他的常见不良反应是",opts:["A.恶心、呕吐、头晕","B.胃肠胀气、排便急、便失禁和油样便","C.腹胀、便秘","D.口腔金属味觉","E.失眠"],ans:"B",exp:"15%～30%使用奥利司他的患者可出现不良反应，包括皮脂溢出增多、胃肠胀气、便急、便失禁和油样便。禁用于慢性吸收不良综合征、胆汁淤积症。"},
    {type:"最佳选择题",q:"88. 患者难以忍受奥利司他上述不良反应，可考虑换用的减重方案是",opts:["A.司美格鲁肽0.25mg qw iv.","B.阿托伐他汀10mg po qn","C.司美格鲁肽0.25mg qd ih.","D.二甲双胍0.5g tid po","E.司美格鲁肽0.25mg qw ih."],ans:"E",exp:"GLP-1受体激动剂属肠促胰素类药物，主要通过增加葡萄糖依赖性胰岛素分泌、降低胰高血糖素分泌，减缓胃排空，增加饱腹感，从而降低血糖。司美格鲁肽注射液是全球首个用于肥胖症体重管理的GLP-1受体激动剂，皮下注射，每周1次给药。"},
    {type:"最佳选择题",q:"89. 该患者控制心室率可考虑使用的药物是",opts:["A.维拉帕米","B.胺碘酮","C.地尔硫䓬","D.非洛地平","E.索他洛尔"],ans:"B",exp:"当心房颤动患者使用β受体拮抗剂、非二氢吡啶类CCB、强心苷类药物联合应用仍不能有效控制心室率时，可将胺碘酮作为药物控制心室率的最后一项选择，但应注意不良反应风险。"},
    {type:"最佳选择题",q:"90. 患者使用上述治疗药物可能出现的不良反应不包括",opts:["A.甲状腺功能紊乱","B.牙龈增生","C.肺毒性","D.QT间期延长","E.肝损害"],ans:"B",exp:"长期应用胺碘酮可影响甲状腺功能、肺毒性、QT间期延长、肝损害等。可导致牙龈增生的药物有环孢素、地平类降压药、苯妥英钠。"},
    {type:"最佳选择题",q:"91. 为预防脑卒中宜采取的治疗方案是",opts:["A.阿司匹林肠溶片100mg qd po","B.达比加群酯150mg bid po","C.氯吡格雷片300mg qd po","D.氯吡格雷片75mg qd po","E.华法林片3mg qd po"],ans:"D",exp:"对非心源性TIA患者，建议给予口服抗血小板药物而非抗凝药物预防脑卒中复发及其他心血管事件的发生。阿司匹林（50～325mg/d）或氯吡格雷（75mg/d）单药治疗均可以作为首选抗血小板药物。该患者有哮喘病史，避免使用阿司匹林。"},
    {type:"最佳选择题",q:"92. 该患者在就诊过程中出现左侧肢体无力，并逐渐加重，不能站立，医生发现其说话迟钝含混，随即查BP170/105mmHg，血常规基本正常，行头部MRI检查后，诊断为急性脑梗死。该患者首选的治疗方案是",opts:["A.阿司匹林肠溶片100mg qd","B.阿司匹林300mg st","C.阿替普酶0.9mg/kg iv.gtt","D.依诺肝素4000U ih.","E.替奈普酶0.9mg/kg iv.gtt"],ans:"C",exp:"对缺血性脑卒中发病4.5小时内的患者，无溶栓禁忌证应尽快静脉给予阿替普酶或替奈普酶溶栓治疗。阿替普酶0.9mg/kg（最大剂量为90mg）静脉滴注，其余持续滴注1h；或替奈普酶0.25mg/kg（最大剂量25mg），静脉注射。"},
    {type:"最佳选择题",q:"93. 为改善患者神经功能缺损程度和预后，考虑使用的药物是",opts:["A.依达拉奉","B.巴曲酶","C.甘油果糖","D.多塞平","E.美托洛尔"],ans:"A",exp:"理论上，神经保护药物可改善缺血性脑卒中患者预后，动物研究也显示神经保护药物可改善神经功能缺损程度。但临床上研究结论尚不一致，疗效还有待进一步证实。目前常用的神经保护药物有丁基苯酞、胞二磷胆碱、依达拉奉等。"},
    {type:"最佳选择题",q:"94. 患者目前使用的药物中，可能诱发或加重胃食管反流病的是",opts:["A.沙坦","B.氯吡格雷","C.阿托伐他汀","D.美托洛尔","E.单硝酸异山梨酯"],ans:"E",exp:"二氢吡啶类钙通道阻滞剂、抗胆碱药物、硝酸酯类、巴比妥类药物、苯二氮䓬类药物、多巴胺、雌激素、孕酮、四环素、茶碱等降低食管下括约肌的压力。阿司匹林、双膦酸盐类、其他非甾体抗炎药（NSAIDs）、铁剂、奎尼丁、氯化钾直接刺激食管黏膜。"},
    {type:"最佳选择题",q:"95. 针对反流性食管炎，医师予以泮托拉唑钠肠溶片40mg qd进行治疗，1个月后反流症状基本消失，后续正确的处理措施是",opts:["A.反流性食管炎已治愈，可停用泮托拉唑","B.在症状出现时使用泮托拉唑，症状缓解即停药","C.在症状出现时使用法莫替丁，症状缓解即停药","D.继续使用泮托拉唑，每日1次，长期维持","E.每日睡前使用法莫替丁，长期维持"],ans:"D",exp:"抑酸治疗停药后症状复发、重度食管炎（LA-C、D级）、Barrett食管患者通常需要PPI或P-CAB长疗程维持治疗，依据病情可用标准剂量或标准剂量的半量，每日1次长期维持或隔日1次间歇给药。"},

    {type:"多项选择题",q:"97. 患者，男，38岁，化工厂工作人员，近期出现乏力、易紧张、失眠等神经衰弱症状，并伴眼睑震颤，诊断为慢性汞中毒，驱汞治疗药物有",opts:["A.二巯丙磺钠","B.二巯丙醇","C.青霉胺","D.二巯丁二钠","E.巯乙胺"],ans:"ABCD",exp:"驱汞治疗药物有二巯丙磺钠、二巯丙醇、青霉胺、二巯丁二钠。巯乙胺用于急性四乙基铅中毒的解救。"},
    {type:"多项选择题",q:"98. 对于痰培养结果为（产ESBL）肠杆菌细菌的社区获得性肺炎患者首选抗感染药物有",opts:["A.美罗培南","B.万古霉素","C.哌拉西林他唑巴坦","D.头孢哌酮舒巴坦","E.左氧氟沙星"],ans:"ACD",exp:"肠杆菌科细菌（产ESBL）首选亚胺培南、美罗培南、厄他培南、哌拉西林-他唑巴坦、头孢哌酮-舒巴坦。"},
    {type:"多项选择题",q:"99. 丙型病毒性肝炎患者可使用的抗丙肝病毒药物有",opts:["A.干扰素α","B.阿德福韦","C.利巴韦林","D.拉米夫定","E.达拉他韦"],ans:"ACE",exp:"丙肝抗病毒治疗药物包括：①直接作用抗病毒药物如阿舒瑞韦、达诺瑞韦、达拉他韦、艾尔巴韦、索磷布韦等。②干扰素α。③利巴韦林。阿德福韦、拉米夫定为抗乙肝病毒药物。"},
    {type:"多项选择题",q:"100. 患者，男，78岁，因骨质疏松症使用地舒单抗进行治疗。关于该药的特点和注意事项，说法正确的有",opts:["A.每次60mg，皮下注射，每6个月1次","B.用药期间应补充叶酸和维生素B12","C.低钙血症者禁用","D.一旦停用，需要序贯双膦酸盐类或其他药物","E.为保证疗效，应与双膦酸盐联合用药"],ans:"ACD",exp:"①地舒单抗用法用量为60mg，每6个月1次，皮下注射。②同时需要给予钙剂和维生素D以治疗或预防低钙血症，已发生低钙血症者禁用。③本药为短效作用药物，不存在“药物假期”，一旦停用，需要序贯双膦酸盐类或其他药物，以防止骨密度下降或骨折风险增加。④不应与双膦酸盐合并用药。"}
  ]
},
  {
  name: "押题密卷（九）",
  questions: [
    // ===== 一、最佳选择题（1-40） =====
    {type:"最佳选择题",q:"1. 在药物代谢动力学/药物效应动力学原理指导下，应用现代先进的药物监测、药物基因组学分析技术进行治疗药物监测（TDM），通过测定患者体内的药物暴露、药理标志物或药效指标，利用定量药理模型，以药物治疗窗为基准，药师与临床医师一起制订和调整适合患者的个体化给药方案，属于",opts:["A.药物重整","B.药物警戒","C.药物治疗管理","D.个体化药物治疗","E.循证医学在药物治疗中的应用"],ans:"D",exp:"个体化药物治疗是指在药物代谢动力学/药物效应动力学原理指导下，应用现代先进的药物监测、药物基因组学分析技术进行治疗药物监测（TDM），通过测定患者体内的药物暴露、药理标志物或药效指标，利用定量药理模型，以药物治疗窗为基准，药师与临床医师一起制订和调整适合患者的个体化给药方案。"},
    {type:"最佳选择题",q:"2. 沟通是建立、维持并增进药师与患者专业性关系的途径。关于药师与患者沟通的基本方法与要点，说法正确的有",opts:["A.认真聆听，不随意打断与患者的谈话","B.谈话过程中尽量避免使用专业的医学术语，以免造成患者难理解","C.尽可能提供更多的宣传材料及延长谈话时间","D.利用微信公众号编制用药指导的视频，待患者回家后进一步跟随练习，巩固特殊给药装置的使用准确性","E.注意保护隐私，尽可能在私密的环境里与患者交流"],ans:"C",exp:"药师与患者沟通时需注意控制谈话时间与所提供信息量，与患者的谈话时间不宜过长，一次性提供的信息也不宜过多，可以准备一些宣传资料，咨询时发给患者，方便患者阅读。"},
    {type:"最佳选择题",q:"3. 患者，女，59岁，糖尿病病史8年，为减少出现低血糖或高血糖症状的隐患，应避免使用的药物是",opts:["A.加替沙星","B.异烟肼","C.阿昔洛韦","D.人促红细胞生成素","E.头孢米诺"],ans:"A",exp:"加替沙星可能由于其促进胰岛B细胞释放胰岛素的作用而引起血糖降低；但该效应持续还可能导致糖尿病患者耗竭胰岛素，随后可引发血糖升高。糖尿病患者用药后，因为前述加替沙星所导致的效应影响，则表现出血糖的明显波动，引发低血糖和高血糖的频繁变化。而该药物对糖尿病患者的肾功能也有损害风险，因此糖尿病患者禁用加替沙星。"},
    {type:"最佳选择题",q:"4. 下列信息中属于二级信息的是",opts:["A.国家基本药物处方集","B.中国知网","C.中国药学杂志","D.中国国家处方集","E.实验研究结果"],ans:"B",exp:"文摘数据库或全文数据库（如中国知网、万方医学网）是获取文献信息的常用二级信息资源。三级信息资源包括医药图书（工具书、教科书、手册等）、光盘或在线数据库、药学应用软件以及临床实践指南、系统评价或综述型文章等。中国药学杂志、实验研究结果属于一级信息。"},
    {type:"最佳选择题",q:"5. 关于老年人药动学方面的改变，说法错误的是",opts:["A.年龄相关的胃肠道生理改变会影响药物吸收，但大多数药物是通过被动扩散吸收，故衰老对药物吸收的影响很小","B.老年人体内总含水量下降而脂肪成分增加，水溶性药物如阿司匹林随年龄增加，分布容积明显下降，血药浓度升高","C.肝代谢的I相反应不受年龄因素的影响","D.肝代谢的II相反应不受年龄因素的影响","E.老年人应用以肾脏排泄为主的药物时，应个体化调整剂量以避免蓄积中毒"],ans:"C",exp:"肝代谢主要包括I相反应（氧化反应，如羟基化和脱烃反应）和II相反应（结合反应）。年龄相关的I相反应降低主要是因为肝脏体积减小，而不是由于肝脏代谢酶活性降低；II相反应不受年龄因素的影响。"},
    {type:"最佳选择题",q:"6. 患者，女，55岁，身高165cm，体重50kg，临床诊断慢性肾衰竭尿毒症期，拟行同种异体肾移植手术。术后选用他克莫司降低移植排异反应。以下用药指导正确的是",opts:["A.高脂饮食可增加药物的血药浓度","B.建议空腹给药，2次用药应间隔12h","C.同服葡萄糖汁可降低药物的血药浓度","D.每日一次，给药时间建议为早上8点左右","E.建议患者保持固定的给药方案，可选择餐前或餐后给药"],ans:"B",exp:"他克莫司的服药建议为建议患者空腹给药，即餐前1小时或餐后2小时服用，2次用药应间隔12小时。葡萄柚或葡萄柚汁可导致他克莫司的血药浓度升高，高脂饮食可导致他克莫司的血药浓度降低。"},
    {type:"最佳选择题",q:"7. 一名运动员在比赛中扭伤踝关节，局部肿胀明显，无法负重。现场急救时，错误的做法是",opts:["A.立即进行热敷促进血液循环","B.使用弹性绷带加压包扎","C.抬高患肢减少肿胀","D.局部冰敷15～20分钟","E.避免患肢活动"],ans:"A",exp:"在受伤后的初期，采取“RICE”原则（休息、冷敷、压迫、抬高）可以有效减轻肿胀和疼痛。早期热敷会加重肿胀。"},
    {type:"最佳选择题",q:"8. 患者，男，13岁，手指因不小心被热水壶烫伤，局部有较轻微的红肿，可使用的药物是",opts:["A.京万红软膏","B.复方地西泮片","C.盐酸哌替啶注射液","D.红霉素软膏","E.地奥司明片"],ans:"A",exp:"对局部较小面积轻度烫伤，可在家中施治，在清洁创面后，外涂京万红软膏、（美宝）润湿烧伤膏等。"},
    {type:"最佳选择题",q:"9. 患儿，女，8岁，因发热（体温38.6℃）、头痛、鼻塞、流清涕、咳嗽、无痰就诊。实验室检查：白细胞、中性粒细胞计数正常。临床诊断为普通感冒。为减轻该患儿不适，可选的药物是",opts:["A.阿司匹林","B.尼美舒利","C.美洛昔康","D.双氯芬酸钠","E.氨酚那敏"],ans:"E",exp:"患儿出现发热、头痛、鼻塞等感冒症状，可选择复方感冒制剂氨酚那敏。"},
    {type:"最佳选择题",q:"10. 关于预防流感，下列表述最正确的是",opts:["A.流感疫苗是预防流感最有效的手段，药物预防可以代替疫苗接种","B.通常接种流感疫苗6周后，可产生具有保护水平的抗体，6-8个月后抗体滴度开始衰减","C.为保证受种者在流感高发季节前获得免疫保护，最好在10月底前完成免疫接种","D.6月龄至5岁儿童、60岁及以上老年人为优先接种流感疫苗的对象，医务人员除外","E.在母乳喂养期，母亲接种流感疫苗对母亲和婴儿都是不安全的"],ans:"C",exp:"流感疫苗是预防流感最有效的手段，可以显著降低接种者罹患流感和发生严重并发症的风险。药物预防不能代替疫苗接种，只能作为未接种疫苗或接种疫苗后尚未获得免疫能力的重症流感高危人群的紧急临时预防措施。通常接种流感疫苗2～4周后，可产生具有保护水平的抗体，6～8个月后抗体滴度开始衰减。6月龄至5岁儿童、60岁及以上老年人、慢性病患者、医务人员等都属于优先接种流感疫苗的对象。在母乳喂养期，母亲接种流感疫苗对母亲和婴儿都是安全的。"},
    {type:"最佳选择题",q:"11. 引起急性细菌性扁桃体炎最主要的病原体是",opts:["A.大肠埃希菌","B.结核分枝杆菌","C.幽门螺杆菌","D.伤寒沙门菌","E.A组β溶血性链球菌"],ans:"E",exp:"非病毒性因素<15%，而20%～30%免疫功能正常的儿童和5%～15%的成人可发生急性细菌性扁桃体炎，最主要的病原体均是A组β溶血性链球菌，即化脓性链球菌。"},
    {type:"最佳选择题",q:"12. 一名过敏性鼻炎患者初次使用糖皮质激素鼻喷剂治疗时，以下操作方法正确的是",opts:["A.抬头并将喷嘴对准鼻中隔快速按压","B.低头并用右手喷左鼻孔，喷嘴对准外侧鼻壁","C.先深吸气，然后快速用力将药物吸入","D.喷药后立即平躺5分钟以促进吸收","E.使用前不需摇匀药瓶"],ans:"B",exp:"使用糖皮质激素鼻喷剂时应低头，用右手喷左鼻孔并将喷嘴对准外侧鼻壁（避免喷向鼻中隔），喷药后应轻轻呼吸而非用力吸气。"},
    {type:"最佳选择题",q:"13. 患者，男，65岁，因“发热、咳嗽伴气促3天”就诊。有慢阻肺病史（FEV1占预计值35%），近2周口服泼尼松10mg/天。体温38.5℃，呼吸24次/分，白细胞计数12×10^9/L，胸部CT示右下肺实变影，诊断社区获得性肺炎。该患者最适宜的抗感染方案是",opts:["A.阿莫西林-克拉维酸口服","B.左氧氟沙星单药静脉滴注","C.头孢曲松联合阿奇霉素静脉给药","D.哌拉西林-他唑巴坦","E.多西环素口服"],ans:"D",exp:"患者存在铜绿假单胞菌感染高风险（近期使用糖皮质激素），需覆盖包括铜绿假单胞菌的广谱方案（哌拉西林-他唑巴坦）。"},
    {type:"最佳选择题",q:"14. 患者，男，55岁，因慢性胰腺炎导致胰腺分泌功能不足，近期出现脂肪泻和消瘦。医生开具胰酶片补充治疗。关于胰酶片的使用方法，正确的是",opts:["A.饭前30分钟整片吞服，每日3次","B.饭时嚼碎服用，每日4次","C.饭后立即整片吞服，每日2次","D.进餐时整片吞服，不可咀嚼","E.空腹时溶于温水后服用，每日3次"],ans:"D",exp:"胰酶片应在进餐时整片吞服，不可咀嚼或压碎，以避免胃酸破坏酶活性。"},
    {type:"最佳选择题",q:"15. 患者，男，35岁，因长期久坐和便秘，近期出现便后肛门肿物脱出伴少量出血，疼痛轻微。肛门检查发现齿状线以上黏膜充血，脱出物可自行回纳。针对该患者的痔疮症状，适宜的治疗方案是",opts:["A.立即行手术治疗","B.口服地奥司明片","C.局部注射硬化剂","D.长期使用含可的松的痔疮栓","E.静脉注射抗生素"],ans:"B",exp:"地奥司明是治疗痔疮的内服药。"},
    {type:"最佳选择题",q:"16. 患者，女，30岁，患者因阴道瘙痒、白带增多就诊，诊断为细菌性阴道病。可考虑使用的药物不包括",opts:["A.乳酸菌阴道胶囊","B.甲硝唑阴道栓","C.克林霉素胶囊","D.克霉唑栓","E.甲硝唑片"],ans:"D",exp:"克霉唑栓属于抗真菌药，用于外阴阴道假丝酵母菌病的治疗。细菌性阴道病可阴道局部用甲硝唑阴道栓（片）、2%克林霉素软膏；全身用药可选择甲硝唑、替硝唑、克林霉素等；还可辅助使用阴道局部乳杆菌制剂。"},
    {type:"最佳选择题",q:"17. 患者，女，28岁，哺乳期，产后3周出现右侧乳房红肿、疼痛伴发热（体温38.8℃），血常规显示白细胞计数13×10^9/L。诊断为急性哺乳期乳腺炎。针对该患者的治疗，以下措施错误的是",opts:["A.立即停止哺乳以减少感染风险","B.口服头孢拉定抗感染治疗","C.局部冷敷缓解肿胀，哺乳前热敷按摩","D.使用对乙酰氨基酚退热止痛","E.继续排空乳汁（如哺乳或吸乳器）"],ans:"A",exp:"哺乳期乳腺炎患者无需停止哺乳，事实上频繁哺乳是消除肿胀、防止乳汁淤积的最好方式。"},
    {type:"最佳选择题",q:"18. 患者，男，72岁。既往有高血压病史，现血压控制良好，因前列腺增生症就诊，经查：IPSS评分<8分。患者口述近期失眠，易醒，起夜频繁。该患者宜使用的药物是",opts:["A.多沙唑嗪","B.坦索罗辛","C.托特罗定","D.奥昔布宁","E.普适泰"],ans:"B",exp:"对于有轻度（IPSS<8分）至中度（IPSS为8～19分）的BPH/LUTS患者，建议单用α1受体拮抗剂作为初始治疗。该患者为老年高血压患者，使用多沙唑嗪易出现直立性低血压的不良反应，同时由于该患者失眠易醒，起夜频繁，睡前服用并不能减轻该患者直立性低血压的不良反应。坦索罗辛在血管不良事件方面与安慰剂组相比无差异。"},
    {type:"最佳选择题",q:"19. 患者，女，65岁，右侧胸背部出现簇集性水疱伴剧烈疼痛3天，体查可见沿肋间神经分布的成簇水疱，部分破溃结痂。该患者最合适的治疗方案是",opts:["A.仅口服对乙酰氨基酚止痛","B.单用炉甘石洗剂外涂","C.口服伐昔洛韦","D.静脉注射糖皮质激素","E.仅用红外线物理治疗"],ans:"C",exp:"尽早的抗病毒治疗可以有效缩短病程，促进皮损愈合，有效减少新发皮损，降低病毒侵袭的可能。"},
    {type:"最佳选择题",q:"20. 患者，男，65岁，有消化性溃疡、糖尿病史，因头晕、头痛就诊，体检和实验室检查结果为血压172/96mmHg，血尿酸540μmol/L，血钾3.2mmol/L。可选用的降压药为",opts:["A.利血平","B.氯沙坦钾","C.氢氯噻嗪","D.吲达帕胺","E.呋塞米"],ans:"B",exp:"氯沙坦钾属于ARB类药物，可引起血钾升高，患者血钾偏低，可以选用。利血平可引起消化道溃疡、抑郁，现很少单独使用，常在一些复方制剂中用于控制难治性高血压。吲达帕胺、氢氯噻嗪可引起血尿酸升高，高尿酸血症者不宜服用。"},
    {type:"最佳选择题",q:"21. 患者，男，57岁，近期体检发现血尿酸、血脂异常，化验结果：TC 4.7mmol/L，TG 7.5mmol/L，LDL-C 3.3mmol/L，血尿酸505μmol/L，应首选的调脂药物为",opts:["A.考来替泊","B.瑞舒伐他汀","C.非诺贝特","D.依洛尤单抗","E.烟酸"],ans:"C",exp:"高尿酸血症不宜选择烟酸类药物。根据该患者血脂检查结果可知三酰甘油水平升高，胆固醇水平正常，宜选择主要降三酰甘油的药物，首选贝特类药物如非诺贝特。"},
    {type:"最佳选择题",q:"22. 心房颤动患者应用华法林抗凝治疗时，需要监测INR，并控制INR值范围为",opts:["A.1.0～1.5","B.1.5～2.0","C.2.0～3.0","D.3.0～4.0","E.4.0～5.5"],ans:"C",exp:"华法林的有效治疗窗较窄，抗凝作用易受多种食物和药物的影响，在用药过程中需频繁监测凝血功能及INR。INR 2.0～3.0时可有效预防卒中事件，并不明显增加出血风险。"},
    {type:"最佳选择题",q:"23. 患者，男，49岁。高血压病史11年，吸烟史31年，日均2盒烟。患者4h前出现头晕，眼前发黑，口齿不利，说话含糊，右手抬不起等症状，紧急送医，诊断为缺血性脑卒中急性期。查体：血压198/114mmHg，心率86次/分。针对该患者的降压措施，药物使用正确的是",opts:["A.拉贝洛尔","B.氨氯地平","C.阿替普酶","D.阿司匹林","E.氯吡格雷"],ans:"A",exp:"血压持续升高至收缩压>200mmHg或舒张压>110mmHg，或伴有严重心功能不全、主动脉夹层、高血压脑病的患者，可予降压治疗，并严密观察血压变化。可选用拉贝洛尔、尼卡地平等静脉药物。"},
    {type:"最佳选择题",q:"24. 患者，男，49岁，高血压病史12年，2个月前因脑出血入院，现正进行康复治疗。对于该患者的患者教育，说法错误的是",opts:["A.急性绝对卧床休息，并抬高床头15°～30°，以减少脑部血流量","B.避免情绪激动、剧烈运动、排便用力","C.坚持使用降压药，劳逸结合、戒烟忌酒","D.避免进行锻炼，以免脑出血复发","E.积极控制高血压，坚持服药、劳逸结合"],ans:"D",exp:"脑出血病情平稳后，锻炼越早、疗效越好。"},
    {type:"最佳选择题",q:"25. 适用于伴有睡眠障碍或焦虑障碍的抑郁症患者，常可导致体重增加的药物是",opts:["A.曲唑酮","B.米氮平","C.丁螺环酮","D.吗氯贝胺","E.度洛西汀"],ans:"B",exp:"米氮平适用于各种类型抑郁症的急性期及维持期治疗，特别是治疗伴有睡眠障碍或焦虑障碍的抑郁症、伴有焦虑激越或焦虑躯体化的抑郁症患者。米氮平起效比SSRIs快，安全性、耐受性好，最常见的不良反应是体重增加，偶见直立性低血压。"},
    {type:"最佳选择题",q:"26. 具有抗抑郁和助眠双重作用，禁与强效CYP1A2抑制剂（如氟伏沙明、环丙沙星）合用的药物是",opts:["A.阿米替林","B.帕罗西汀","C.文拉法辛","D.氟伏沙明","E.阿戈美拉汀"],ans:"E",exp:"阿戈美拉汀既是褪黑素受体激动剂也是5-羟色胺受体拮抗剂，因此具有抗抑郁和助眠双重作用，能够改善抑郁症相关性失眠，缩短睡眠潜伏期，增加睡眠连续性。乙肝病毒携带者/患者、丙肝病毒携带者/患者、肝功能损害患者或氨基转移酶升高超过正常范围上限者禁用，禁与强效CYP1A2抑制剂（如氟伏沙明、环丙沙星）合用。"},
    {type:"最佳选择题",q:"27. 患者，男，73岁，既往有前列腺增生病史，近期因“双侧肢体抖动、动作缓慢1年余，加重半年”入院。患者主诉：1年前出现休息时右手抖动，站立时较前费力，自行服用活血药物；半年前右手抖动时间延长，有时左手也抖动，与家人交流减少，自行服用补钙制剂。诊断结论：晚发型帕金森病。针对患者病情，宜选用的治疗药物是",opts:["A.苯海索","B.司来吉兰","C.恩他卡朋","D.普拉克索","E.复方左旋多巴"],ans:"E",exp:"晚发型或伴有智能减退的帕金森病患者，一般首选复方左旋多巴治疗。随着症状加重，疗效减退时可添加多巴胺受体激动剂、MAO-B抑制剂或COMT抑制剂治疗。尽量不应用抗胆碱药物，尤其针对老年男性患者。"},
    {type:"最佳选择题",q:"28. 患者，女，60岁，哮喘病史20余年。一周前出现记忆力下降，对子女偶有认不出的现象。经检查，该患者有痴呆家族病史。对该患者应选择的治疗药物是",opts:["A.加兰他敏","B.多奈哌齐","C.卡巴拉汀","D.帕罗西汀","E.美金刚"],ans:"E",exp:"该患者有哮喘病史，应慎用胆碱酯酶抑制剂如多奈哌齐、卡巴拉汀、加兰他敏，可选用美金刚。"},
    {type:"最佳选择题",q:"29. 患者，男，58岁，近期诊断为胃食管反流病，建议在调整生活方式的前提下进行药物治疗，首选的治疗药物是",opts:["A.西咪替丁片","B.硫糖铝混悬液","C.多潘立酮片","D.铝碳酸镁凝胶剂","E.艾司奥美拉唑肠溶胶囊"],ans:"E",exp:"艾司奥美拉唑肠溶胶囊为质子泵抑制剂（PPI），可作为胃食管反流病的首选治疗药物。"},
    {type:"最佳选择题",q:"30. 关于抑酸药物和抗酸药物的用药注意事项，说法错误的是",opts:["A.PPI的肠溶片或肠溶胶囊不可咀嚼或压碎","B.长期使用较高剂量PPI可使骨折风险升高，尤其是老年患者","C.H2RA用于夜间酸突破时，在日间PPI的基础上睡前加服单次剂量","D.抗酸药物与其他药物合用时通常需要间隔2～3小时","E.含铝的抗酸药可导致腹泻，用药期间可足量饮水以避免脱水"],ans:"E",exp:"含铝的抗酸药可导致便秘，用药期间可足量饮水以避免；出现便秘症状的患者可同时服用缓泻药。"},
    {type:"最佳选择题",q:"31. 患者，男，62岁，身高1.72m，体重60kg，近半年来，饮食及饮水量明显增加，体重却持续减轻，经检测，空腹血糖9.0mmol/L，临床诊断为2型糖尿病患者，自述有前列腺炎病史，下列药物会增加泌尿系统感染风险的是",opts:["A.格列齐特","B.吡格列酮","C.二甲双胍","D.卡格列净","E.罗格列酮"],ans:"D",exp:"卡格列净的不良反应为低血压、泌尿与生殖系统感染、酮症酸中毒。"},
    {type:"最佳选择题",q:"32. 患者，女，59岁，诊断为2型糖尿病，经生活方式干预，未能有效控制血糖，予以二甲双胍进行药物治疗，药师应告知患者长期用药宜补充",opts:["A.维生素A","B.维生素B1","C.维生素B12","D.维生素D","E.叶酸"],ans:"C",exp:"二甲双胍可抑制维生素B12的吸收，所以长期服用二甲双胍需补充维生素B12。"},
    {type:"最佳选择题",q:"33. 患者，男，45岁，因多食、消瘦、畏热、多汗、易激动就诊，经实验室检查诊断为甲亢。该患者使用可临时控制甲状腺毒症且需监测血药浓度的药物是",opts:["A.碘化钾","B.碳酸锂","C.甲巯咪唑","D.普萘洛尔","E.丙硫氧嘧啶"],ans:"B",exp:"碳酸锂可抑制甲状腺激素分泌，主要用于对常用ATD和碘剂均不耐受的患者临时控制甲状腺毒症。服用碳酸锂时应监测药物浓度。"},
    {type:"最佳选择题",q:"34. 患者，女，36岁，长时间易疲劳、怕冷、体重增加，经实验室检查，诊断为甲状腺功能减退症。建议使用的药物是",opts:["A.碘化钾","B.甲巯咪唑","C.丙硫氧嘧啶","D.左甲状腺素","E.糖皮质激素"],ans:"D",exp:"甲减的治疗目标是将血清TSH和甲状腺激素水平恢复到正常范围内。主要的推荐治疗药物为左甲状腺素（L-T4），需要终生服药。"},
    {type:"最佳选择题",q:"35. 患者，男，72岁，高血压、冠心病病史10年。确诊糖尿病后，现使用二甲双胍、达格列净控制，近期血糖监测发现糖化血红蛋白数值为8.3%。为避免血糖波动过大，可以首选的药物是",opts:["A.罗格列酮","B.短效胰岛素","C.门冬胰岛素","D.地特胰岛素","E.德谷胰岛素"],ans:"E",exp:"患者糖尿病治疗2种药物联合用药后，血糖仍未控制在正常水平，可以选择胰岛素，德谷胰岛素为长效胰岛素类似物，没有血药浓度峰值，亦用于提供基础胰岛素。"},
    {type:"最佳选择题",q:"36. 类风湿关节炎（RA）一经确诊，应尽早使用DMARDs治疗。单一传统合成DMARDs治疗未达标时，可联合另一种或两种传统合成DMARDs进行治疗，可选用的联合方案不包括",opts:["A.MTX+羟氯喹","B.MTX+雷公藤","C.MTX+来氟米特","D.MTX+阿昔莫司","E.MTX+柳氮磺吡啶"],ans:"D",exp:"单一传统合成DMARDs治疗未达标时，建议：①应用生物制剂；②联合另一种或两种传统合成DMARDs进行治疗，可选用的联合方案有：a.MTX+柳氮磺吡啶；b.MTX+羟氯喹（或氯喹）；c.MTX+来氟米特；d.MTX+雷公藤。③一种DMARDs联合一种生物制剂进行治疗。联合用药时，可适当减少其中每种药物的剂量。"},
    {type:"最佳选择题",q:"37. 患者，男，68岁，有慢性肾脏病史10年，近期复查诊断为尿毒症合并继发性甲状旁腺功能亢进症，拟进行血液透析，为降低甲状旁腺激素水平，适宜选择的药物是",opts:["A.甲巯咪唑","B.司维拉姆","C.丙硫氧嘧啶","D.骨化三醇","E.特立帕肽"],ans:"D",exp:"慢性肾脏病伴严重或进行性继发性甲状腺功能亢进症的患者可使用活性维生素D及其类似物、拟钙剂，但非透析患者不建议常规使用。临床常用活性维生素D及其类似物包括骨化三醇、阿法骨化醇和帕立骨化醇。甲巯咪唑、丙硫氧嘧啶是抗甲状腺药物。特立帕肽是甲状旁腺素类似物，为治疗骨质疏松症的药物。司维拉姆是磷结合剂，可降低血磷。"},
    {type:"最佳选择题",q:"38. 使用后可导致痤疮样皮疹的抗肿瘤药物是",opts:["A.吉非替尼","B.卡培他滨","C.环磷酰胺","D.奥沙利铂","E.伊立替康"],ans:"A",exp:"痤疮样皮疹是EGFR抑制剂如吉非替尼、厄洛替尼突出的皮肤不良反应。"},
    {type:"最佳选择题",q:"39. 肿瘤患者使用伊立替康数日后一旦出现大便性状改变甚至水样便，应尽早给予",opts:["A.美司钠","B.右雷佐生","C.奥沙利铂","D.阿瑞匹坦","E.洛哌丁胺"],ans:"E",exp:"肿瘤患者使用伊立替康数日后一旦出现大便性状改变甚至水样便，应尽早口服洛哌丁胺胶囊。"},
    {type:"最佳选择题",q:"40. 关于癌症疼痛患者止痛药物使用原则的说法，不正确的是",opts:["A.按阶梯给药","B.提倡无创的给药方式，能口服尽量口服","C.疼痛时用药，不痛时不需用药","D.应个体化用药","E.注意预防药物的不良反应"],ans:"C",exp:"癌症疼痛患者止痛药物使用时应按时给药，而不是按需给药。"},

    // ===== 二、配伍选择题（41-85） =====
    {type:"配伍选择题",subs:[
      {q:"41. 药物剂型选择与临床疗效的关系非常密切。不同的药物剂型，药理作用也不相同。例如硫酸镁静脉注射可用于治疗先兆子痫，而口服用于导泻，外用湿敷则消肿。硫酸镁注射液属于高警示药品。属于高警示药品，可作为治疗严重先兆子痫治疗药物的是",opts:["A.甲氨蝶呤片","B.胰岛素注射液","C.凝血酶冻干粉","D.硫酸镁注射液","E.硝普钠注射液"],ans:"D",exp:"硫酸镁静脉注射可用于治疗先兆子痫，属于高警示药品。"},
      {q:"42. 可以用于治疗类风湿关节炎的高警示药品是",opts:["A.甲氨蝶呤片","B.胰岛素注射液","C.凝血酶冻干粉","D.硫酸镁注射液","E.硝普钠注射液"],ans:"A",exp:"甲氨蝶呤口服可以用于治疗类风湿关节炎，属于高警示药品。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"43. 可导致单纯红细胞再生障碍性贫血，搬运时避免振动的药物是",opts:["A.呋塞米","B.氯化钾","C.利巴韦林","D.降纤酶","E.促红细胞生成素"],ans:"E",exp:"人促红细胞生成素可引起单纯红细胞再生障碍性贫血。搬运时振动可能会改变人促红细胞生成素的二级结构，导致先前隐藏的抗原决定簇暴露或产生具有免疫原性的结构，使促红细胞生成素具有抗原性，导致一些促红细胞生成素制剂较易刺激人体产生抗体，从而出现单纯红细胞再生障碍性贫血。"},
      {q:"44. 使用前必须皮内注射0.1ml进行皮试的药物是",opts:["A.呋塞米","B.氯化钾","C.利巴韦林","D.降纤酶","E.促红细胞生成素"],ans:"D",exp:"降纤酶：用药前应做皮试，以本品0.1ml用0.9%氯化钠注射液稀释至1ml，皮内注射0.1ml。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"45. 可引起低血糖反应，出现头晕、心慌等症状，驾驶员慎用的药物是",opts:["A.复方磺胺甲噁唑","B.头孢克洛","C.诺氟沙星","D.阿莫西林","E.格列美脲"],ans:"E",exp:"磺酰脲类等降糖药，可引起低血糖反应，出现头晕、心慌等症状，驾驶员慎用。"},

    {type:"最佳选择题",q:"94. 可抑制粒细胞浸润，推荐在痛风发作12小时内尽早使用的药物是",opts:["A.碳酸氢钠","B.秋水仙碱","C.非布司他","D.苯溴马隆","E.他克莫司"],ans:"B",exp:"痛风急性发作期治疗目的是迅速控制关节炎症状。急性期应卧床休息，抬高患肢、局部冷敷。尽早给予药物控制急性发作，越早治疗效果越佳。秋水仙碱或非甾体抗炎药（NSAIDs）是急性痛风性关节炎发作的一线治疗药物。秋水仙碱通过抑制白细胞趋化、吞噬作用及减轻炎性反应而发挥止痛作用。推荐在痛风发作12小时内尽早使用，超过36小时后疗效显著降低。"},

    // ===== 四、多项选择题（96-100） =====
    {type:"多项选择题",q:"96. 药品贮存温度、光照及湿度是影响药品质量的重要因素，因此，应严格按照药品贮藏要求贮存药品。下列关于药品贮存要求的说法，错误的是",opts:["A.避光，指避免日光直射","B.阴凉处，指避光不超过25℃","C.常温（室温），指10℃-30℃","D.遮光，指用不透光的容器包装","E.凉暗处，指温度为2℃-10℃"],ans:"BE",exp:"①避光，指避免日光直射。②如标明“阴凉处”贮存则应贮存在不超过20℃的环境中。③遮光指用不透光的容器包装。④一般药品贮存于常温（10℃～30℃）即可。⑤如标明在“凉暗处”贮存，则贮存温度不超过20℃并避光保存。如标明在“冷处”贮存，则应贮存在2℃～10℃环境中。"},
    {type:"多项选择题",q:"97. 药师在向患者交代阿仑膦酸钠片（70mg/片）的正确用法时，正确的有",opts:["A.每周服用一次","B.服药时间必须为早餐后半小时","C.用一整杯白开水（175-250ml）送服","D.服药后半小时内避免躺卧","E.可用牛奶或果汁送服以减轻胃部刺激"],ans:"ACD",exp:"阿仑膦酸钠片（规格70mg/片），在交代用法用量时，应向患者强调每周一次；还应告知服药时间必须为服药当天第一次进食或饮水前至少半小时；为尽快将药物送至胃部，降低对食管的刺激，服药时推荐用一整杯白开水（175～250ml）送服；还应注意服药后半小时避免躺卧。之所以要强调使用白开水送服是因为其他饮料（包括矿泉水、牛奶）、食物和一些药物可能会降低阿仑膦酸钠的吸收。"},
    {type:"多项选择题",q:"98. 下列关于急救的处理原则及一般方法，说法正确的有",opts:["A.出血患者要及时止血，可根据出血部位与程度选用直接压迫法、止血带绑扎法等","B.对于气道异物梗阻患者，运用海姆立克急救法快速排除异物，恢复气道通畅","C.对于骨折或疑似骨折部位，就地取材，利用夹板、树枝、衣物等进行有效固定","D.确保施救环境安全，避免施救者与伤病员受到二次伤害","E.对于脊柱损伤患者，要使其端坐，以保持脊柱的稳定性"],ans:"ABCD",exp:"搬运脊柱损伤患者时要采用正确的担架搬运法，保持脊柱的稳定性，E选项错误。"},
    {type:"多项选择题",q:"99. 患者，女，63岁，机械瓣膜置换术后合并房颤，使用华法林抗凝治疗，可减弱华法林抗凝作用的药物有",opts:["A.螺内酯","B.圣约翰草提取物","C.口服避孕药","D.抗血小板药","E.丹参、当归"],ans:"ABC",exp:"①增强华法林抗凝作用的常用药物有：抗血小板药、非甾体抗炎药、鱼油及某些中药（丹参、当归、银杏等）；常见食物有：大蒜、洋葱、葡萄柚、芒果等。②减弱华法林抗凝作用的常用药物有：维生素K、苯巴比妥、雌激素、糖皮质激素、口服避孕药、螺内酯及某些中药（人参、西洋参、圣约翰草等）；常见食物有：西兰花、白菜、韭菜、莴苣、菠菜、花菜、甘蓝等。"},
    {type:"多项选择题",q:"100. 有关脑梗死急性期的溶栓治疗禁忌证包括",opts:["A.近2周内进行过大型外科手术者","B.既往有过颅内出血者","C.收缩压≥180mmHg或舒张压≥100mmHg","D.血小板计数<100×10^9/L者","E.血糖<2.8mmol/L"],ans:"ABCDE",exp:"禁忌证：①对于既往有颅内出血；②近2周内进行过大型外科手术；③近1周内有不可压迫部位的动脉穿刺；④近3个月内有严重头颅外伤史或卒中史；⑤近3周内有胃肠或泌尿系统出血；⑥口服抗凝药（华法林）且INR>1.7；⑦颅内肿瘤、大颅内动脉瘤；⑧血小板计数<100×10^9/L；⑨血糖<2.8mmol/L或>22.22mmol/L；⑩收缩压≥180mmHg或舒张压≥100mmHg。"}
