.q-title img{max-width:100%;height:auto}</style></head><body><h1>西药一冲刺卷</h1><div class="chapter-select"><select id="chapterSelect" onchange="switchChapter(this.value)"></select></div><div class="chapter-title" id="chapterTitle"></div><div class="stats" id="stats"></div><div id="quiz"></div><div class="nav-bar"><button class="nav-btn" id="prevBtn" onclick="prevChapter()">上一章</button><button class="nav-btn" id="nextBtn" onclick="nextChapter()">下一章</button></div><script>
var chapters=[
 {
  name: "押题密卷（一）",
  questions: [
    // ===== 一、最佳选择题（1-40） =====
    {type:"最佳选择题",q:"化学药具有明确的化学结构和药理作用机制，以下不属于化学药的是",opts:["A.从天然产物中提取得到的有效单体化合物","B.通过发酵方式得到的抗生素","C.半合成方式得到的天然产物","D.半合成抗生素","E.利用细胞制备而成的物质"],ans:"E",exp:"利用细胞制备而成的物质属于生物制品，不属于化学药。"},
    {type:"最佳选择题",q:"关于药品的商品名称的说法，错误的是",opts:["A.由制药企业自己进行选择","B.与商标一样，可以申请专利保护","C.是药学研究人员和医务人员常用的共同名称","D.同一药物可以有多个不同的商品名称","E.“络活喜”为药品的商品名称"],ans:"C",exp:"药品通用名是药学研究人员和医务人员使用的共同名称，商品名不是。"},
    {type:"最佳选择题",q:"药用辅料是指生产药品和调配处方时所用的赋形剂和附加剂。以下不属于药用辅料的功能的是",opts:["A.可提高药物的稳定性","B.可降低药物生产的费用成本","C.可提高患者用药的顺应性","D.可降低药物的不良反应","E.可使药物在不同部位释放"],ans:"B",exp:"加入辅料会产生费用成本，不能降低生产成本。"},
    {type:"最佳选择题",q:"属于药品包装材料、容器的生物安全检查项目的是",opts:["A.密封性","B.水蒸气透过量","C.滴出量","D.微生物限度","E.抗拉强度"],ans:"D",exp:"微生物限度属于生物安全检查项目。"},
    {type:"最佳选择题",q:"药物制剂的稳定性变化一般包括化学、物理、生物学三个方面。以下不属于化学方面稳定性变化的是",opts:["A.水解沉淀","B.氧化变色","C.异构化反应","D.片剂崩解迟缓","E.光解反应"],ans:"D",exp:"片剂崩解迟缓属于物理方面稳定性变化。"},
    {type:"最佳选择题",q:"以下操作中，不能提高药物稳定性的是",opts:["A.将头孢菌素类抗生素制备为注射用无菌粉针剂","B.将异丙嗪制成β-环糊精包合物","C.对湿热不稳定的药物采用干法制粒压片工艺","D.制备药物的操作过程中尽量使用金属器皿","E.维生素C用微晶纤维素和乳糖直接压片并包衣"],ans:"D",exp:"金属离子能催化氧化反应，操作过程应避免使用金属器皿。"},
    {type:"最佳选择题",q:"具有高灵敏度、高选择性、高效能的特点，是分析混合物最有效的方法是",opts:["A.紫外-可见分光光度法","B.高效液相色谱法","C.红外分光光度法","D.荧光分光光度法","E.化学鉴别法"],ans:"B",exp:"高效液相色谱法属于色谱法，是分析混合物的最有效手段。"},
    {type:"最佳选择题",q:"关于药物含量或效价测定的说法，错误的是",opts:["A.对于化学原料药，其含量限度通常用有效成分所占的重量百分数表示","B.用《中国药典》规定的分析方法测定药物含量时，数值可能达到100%以上","C.炔诺酮的含量限度为97.0%~102.0%，是指炔诺酮的真实含量达到102.0%","D.当含量限度未规定上限时，是指不超过101.0%","E.对于药物制剂，含量限度用API含量占标示量的百分率表示"],ans:"C",exp:"102.0%是方法允许偏差，并非真实含量。"},
    {type:"最佳选择题",q:"以下不属于原料药稳定性重点考察项目的是",opts:["A.性状","B.熔点","C.含量","D.吸湿性","E.崩解时限"],ans:"E",exp:"崩解时限是片剂或胶囊剂的稳定性重点考察项目。"},
    {type:"最佳选择题",q:"药品监督管理部门根据监管需要对质量可疑药品进行的抽查检验是",opts:["A.评价抽检","B.标准复核","C.指定检验","D.放行检验","E.监督抽检"],ans:"E",exp:"监督抽检是对质量可疑药品进行的抽查检验。"},
    {type:"最佳选择题",q:"细胞是构成人体最基本的结构和功能单位，细胞器位于",opts:["A.细胞膜上","B.细胞质中","C.细胞核内","D.膜蛋白内","E.细胞壁上"],ans:"B",exp:"细胞器位于细胞质中。"},
    {type:"最佳选择题",q:"糖、脂肪、氨基酸为能源物质，它们在体内分解代谢的共同产物是",opts:["A.脂肪酸","B.乙酰CoA","C.胆固醇","D.CO2和H2O","E.乳糖"],ans:"B",exp:"三大营养物质分解代谢最终都产生乙酰CoA，进入柠檬酸循环。"},
    {type:"最佳选择题",q:"原核细胞型微生物无核膜、核仁，细胞器很不完善，只有核糖体。以下不属于原核细胞型微生物的是",opts:["A.细菌","B.支原体","C.立克次体","D.真菌","E.螺旋体"],ans:"D",exp:"真菌属于真核细胞型微生物。"},
    {type:"最佳选择题",q:"对不良环境有极强抗性的细菌特殊结构是",opts:["A.细胞壁","B.荚膜","C.鞭毛","D.菌毛","E.芽孢"],ans:"E",exp:"芽孢是细菌对不良环境有极强抗性的休眠体。"},
    {type:"最佳选择题",q:"引发肾功能不全的病因不包括",opts:["A.肾血流量减少","B.肾小球滤过膜通透性改变","C.肾小球有效滤过压降低","D.肾小球滤过面积增大","E.近曲小管功能障碍"],ans:"D",exp:"肾小球滤过面积减少可导致肾功能不全，增大不是病因。"},
    {type:"最佳选择题",q:"吲哚美辛肠溶片的处方组成中，包衣材料为",opts:["A.硬脂酸镁","B.十二烷基硫酸钠","C.邻苯二甲酸酯","D.丙烯酸Ⅱ号树脂","E.乙烯-醋酸乙烯共聚物"],ans:"D",exp:"丙烯酸Ⅱ号树脂为肠溶衣材料。"},
    {type:"最佳选择题",q:"崩解剂是指促使片剂在胃药液中迅速破裂成细小颗粒的辅料，以下不能作为崩解剂的是",opts:["A.干淀粉","B.低取代羟丙基纤维素","C.交联羧甲基纤维素钠","D.交联聚维酮","E.甲基纤维素"],ans:"E",exp:"甲基纤维素主要作为黏合剂和包衣材料。"},
    {type:"最佳选择题",q:"小分子物质在流体静压的作用下通过亲水膜孔蛋白进行跨膜转运，又称水溶性扩散的方式是",opts:["A.单纯扩散","B.滤过","C.主动转运","D.易化扩散","E.膜动转运"],ans:"B",exp:"滤过又称水溶性扩散。"},
    {type:"最佳选择题",q:"血浆蛋白结合率会影响药物在体内的分布，以下关于血浆蛋白结合率的说法，错误的是",opts:["A.血浆蛋白结合率指血浆中结合药物浓度占总药物浓度的百分数","B.药物与血浆蛋白结合主要借助共价键","C.游离药物与结合药物在体内呈动态平衡","D.结合型药物不能透入脑脊液","E.药物与血浆蛋白结合会影响其肾小球滤过率"],ans:"B",exp:"药物与血浆蛋白结合主要借助范德瓦耳斯力、氢键或离子键，不是共价键。"},
    {type:"最佳选择题",q:"因苯环上有多个吸电子基，导致无苯环氧化代谢产物的药物是",opts:["A.","B.","C.","D.","E."],optImgs:["images/y11-q20-A.png","images/y11-q20-B.png","images/y11-q20-C.png","images/y11-q20-D.png","images/y11-q20-E.png"],ans:"C",exp:"丙磺舒苯环上有多个吸电子取代基，苯环不被氧化。"},
    {type:"最佳选择题",q:"属于胺类药物水解代谢反应的是",opts:["A.","B.","C.","D.","E."],optImgs:["images/y11-q21-A.png","images/y11-q21-B.png","images/y11-q21-C.png","images/y11-q21-D.png","images/y11-q21-E.png"],ans:"D",exp:"局部麻醉药丙胺卡因在体内酰胺键水解，生成邻甲苯胺，故属于酰胺类药物水解代谢。"},
    {type:"最佳选择题",q:"酶抑制作用是指某些化学物质能抑制肝微粒体药物代谢酶的活性，减慢其他药物的代谢速率。以下药物具有肝药酶抑制作用的是",opts:["A.苯妥英钠","B.氟伏沙明","C.利福平","D.苯巴比妥","E.卡马西平"],ans:"B",exp:"氟伏沙明对CYP1A2、CYP2C19具有抑制作用，其余为肝药酶诱导剂。"},
    {type:"最佳选择题",q:"静脉注射某一单室模型药物，体内药物剩余分数为10%时所经历的半衰期个数为",opts:["A.1","B.2","C.3.32","D.4","E.6.64"],ans:"C",exp:"药物剩余10%表明代谢了90%，需要3.32个半衰期。"},
    {type:"最佳选择题",q:"某药物的表观分布容积约为6.9L。关于该药物在体内的分布情况，说法正确的是",opts:["A.药物主要分布在脂肪组织中","B.药物主要分布在细胞内","C.药物主要分布在血浆中","D.药物的血浆蛋白结合率低","E.药物主要蓄积在器官中"],ans:"C",exp:"表观分布容积很小，说明主要分布在血浆中。"},
    {type:"最佳选择题",q:"对于生物等效性及其研究方法，说法错误的是",opts:["A.筛选受试者时的排除标准应主要基于安全性方面考虑","B.生物等效性研究方法按照评价效力，优先顺序为药动学研究、药效学研究、临床研究和体外研究","C.多次给药时，试验给药之间应有1倍半衰期以上的清洗期","D.如果给药前血药浓度大于Cmax的5%，则该受试者数据不应纳入等效性评价","E.对于口服常释制剂，通常需进行空腹和餐后生物等效性研究"],ans:"C",exp:"清洗期一般为待测物7倍半衰期以上，不是1倍。"},
    {type:"最佳选择题",q:"某药物在体内不需要代谢，直接经肾脏排泄，临床常规剂量为每天60mg。已知肾功能正常时肌酐清除率为120ml/min，某患者为40ml/min，该患者服用此药时每天给药剂量为",opts:["A.180mg","B.30mg","C.20mg","D.60mg","E.120mg"],ans:"C",exp:"剂量调整公式：40/120×60=20mg。"},
    {type:"最佳选择题",q:"拟胆碱药氯贝胆碱与乙酰胆碱M受体结合，用于手术腹胀气、尿潴留。其作用机制是",opts:["A.与M受体以共价键结合，产生激动作用","B.与M受体以离子键结合，产生激动作用","C.与M受体以氢键结合，产生激动作用","D.与M受体以离子-偶极作用结合，产生激动作用","E.与M受体以范德瓦耳斯力作用结合，产生激动作用"],ans:"B",exp:"氯贝胆碱与M受体以离子键结合产生激动作用。"},
    {type:"最佳选择题",q:"药物可通过非靶标机制发挥作用，以下不属于药物的非靶标作用机制的是",opts:["A.糖尿病患者补充胰岛素","B.注射甘露醇产生利尿作用","C.环孢素用于器官移植的排斥反应","D.磺胺类药物通过抑制敏感细菌体内叶酸的代谢产生抗菌作用","E.氢氯噻嗪抑制肾小管Na+-Cl-转运体发挥利尿作用"],ans:"D",exp:"磺胺类药物通过抑制叶酸代谢属于靶标机制。"},
    {type:"最佳选择题",q:"各种利尿剂的效价强度和最大效应的比较如图所示，以下说法错误的是",img:"images/y11-q29.png",opts:["A.呋塞米的效能最大","B.环戊噻嗪的效价强度最大","C.环戊噻嗪的效价强度约为氢氯噻嗪的30倍","D.氯噻嗪的效价强度最小","E.增加环戊噻嗪的用量可使其达到呋塞米的效能"],ans:"E",exp:"无论剂量如何增加，环戊噻嗪都不能达到呋塞米的效能。"},
    {type:"最佳选择题",q:"约50%亚洲人饮酒后出现面部潮红、心率加快、出汗等不良反应，其原因是",opts:["A.CYP2C19缺乏","B.乙醇脱氢酶缺乏","C.受体活性降低","D.乙醛脱氢酶缺乏","E.N-乙酰基转移酶缺乏"],ans:"D",exp:"乙醛脱氢酶缺乏导致乙醛蓄积，出现不良反应。"},
    {type:"最佳选择题",q:"根据内源性糖皮质激素分泌功能的昼夜节律，短效激素可的松和氢化可的松的最佳给药方式是",opts:["A.每日晚上19:00一次服用全天剂量","B.每日清晨7-8时一次服用全天剂量","C.隔日清晨7-8时一次服用全天剂量","D.日低夜高给药剂量","E.晚间临睡前一次服用全天剂量"],ans:"B",exp:"短效激素在每日清晨7-8时一次服用，与内源性分泌节律重合。"},
    {type:"最佳选择题",q:"药物的光敏反应与药物的化学结构有关，不同化学结构的药物对光波长的敏感程度不同。最常见引起光敏反应的抗菌药物是",opts:["A.青霉素类","B.四环素类","C.大环内酯类","D.β-内酰胺类","E.磺胺类"],ans:"B",exp:"四环素类药物是最常见的引起光敏反应的抗菌药物。"},

    {type:"多项选择题",q:"常用的碳青霉烯类抗生素包括",opts:["A.法罗培南","B.比阿培南","C.氨曲南","D.厄他培南","E.舒巴坦"],ans:"BD",exp:"比阿培南、厄他培南属于碳青霉烯类抗生素；氨曲南属于单环β-内酰胺类；舒巴坦属于青霉烷砜类。"}

 {
  name: "押题密卷（四）",
  questions: [
    // ===== 一、最佳选择题（1-40） =====
    {type:"最佳选择题",q:"1. 关于颗粒剂的分类和特点说法不正确的是",opts:["A.混悬颗粒临用前加水振摇，以混悬液的形式服用","B.泡腾颗粒有利于溶出，可增加难溶性药物的溶解度","C.肠溶颗粒可防止药物在胃内分解失效","D.颗粒剂的药物应与辅料均匀混合","E.颗粒剂制备时可根据需要加入黏合剂、分散剂、矫味剂等辅料"],ans:"B",exp:"泡腾颗粒中的药物应易溶于水，不适用于难溶性药物的制备。难溶性药物可制备混悬颗粒，临用前加水振摇，分散成混悬液供口服。"},
    {type:"最佳选择题",q:"2. 适用于胆囊炎和慢性胰腺炎患者的肠内营养粉剂是",opts:["A.标准型肠内营养粉剂","B.高蛋白型肠内营养粉剂","C.低脂型肠内营养粉剂","D.低糖型肠内营养粉剂","E.低电解质肠内营养粉剂"],ans:"C",exp:"低脂型肠内营养粉剂相对于标准型肠内营养粉剂，含有较少的脂肪和较多的碳水化合物，适用于需要限制脂肪摄入的胆囊炎和慢性胰腺炎患者。"},
    {type:"最佳选择题",q:"3. 下列关于口服液体制剂的质量要求和注意事项说法不正确的是",opts:["A.口服溶液剂应当澄清，不得浑浊变色","B.口服溶液剂可加入适当的pH调节剂和黏度调节剂","C.口服混悬剂稳定性较差，应当遮光密封保存","D.口服混悬剂使用前需摇匀，以保证足量服用","E.口服纳米乳剂应当透明，且无分层现象"],ans:"C",exp:"口服混悬剂应放在低温避光的环境中保存，避免其发生不可逆的变化。口服溶液剂应当澄清，不得有霉败、异臭、变色、浑浊及沉淀等现象。"},
    {type:"最佳选择题",q:"4. 使用环氧乙烷与惰性气体混合，在高压舱室内进行的灭菌方法是",opts:["A.干热灭菌法","B.过滤除菌法","C.热压灭菌法","D.气体灭菌法","E.辐射灭菌法"],ans:"D",exp:"环氧乙烷属于化学灭菌剂，通过形成气体杀灭微生物，属于化学灭菌法中的气体灭菌法。"},
    {type:"最佳选择题",q:"5. 诺氟沙星注射液与氨苄西林注射液配伍发生沉淀的原因是",opts:["A.pH值改变","B.溶剂组成改变","C.离子作用","D.盐析作用","E.缓冲容量"],ans:"A",exp:"诺氟沙星注射液pH值通常为3.5~4.5，氨苄西林注射液pH值通常为8.0~10.0，两者配伍发生沉淀，原因是pH值改变。"},
    {type:"最佳选择题",q:"6. 关于乳状液型注射液的特点和应用，说法不正确的是",opts:["A.药物吸收快，生物利用度高","B.可减少刺激性和毒副作用","C.静脉给药型的乳剂可具有靶向作用，提高疗效","D.不得用于椎管注射","E.应用广泛，配伍方便"],ans:"E",exp:"乳状液型注射液中加入其他药物配伍应慎重，有可能引起粒子的粒径增大，或产生破乳；不得用于椎管注射。"},
    {type:"最佳选择题",q:"7. 下列关于脂质体的组成和质量要求的说法，不正确的是",opts:["A.脂质体的膜材料通常由磷脂和胆固醇组成","B.长循环脂质体通常使用聚乙二醇进行表面修饰","C.为保持对靶点的识别，长循环脂质体的聚乙二醇末端可以连接抗体或配体","D.脂质体的物理稳定性主要用渗漏率表示，与包封率无关","E.脂质体的化学稳定性需要考察磷脂氧化指数"],ans:"D",exp:"脂质体的物理稳定性主要用渗漏率表示，即在贮存期间脂质体的包封率变化情况，与包封率有关。"},
    {type:"最佳选择题",q:"8. 粒径小于1μm，可用于制成混悬液，理论载药量接近100%的微粒制剂是",opts:["A.纳米晶","B.微囊","C.微球","D.纳米粒","E.亚微乳"],ans:"A",exp:"药物纳米晶指小于1μm的药物晶体颗粒，仅需添加少量稳定剂或保护剂，理论载药量可接近100%。"},
    {type:"最佳选择题",q:"9. 制备时需使用高分子材料，可置于结膜囊内缓慢释放药物的眼用制剂是",opts:["A.眼膏剂","B.眼膜剂","C.眼用凝胶剂","D.眼用乳膏剂","E.眼丸剂"],ans:"B",exp:"眼膜剂是指原料药物与高分子聚合物（成膜材料）制成的无菌药膜，可置于结膜囊内缓慢释放药物。"},
    {type:"最佳选择题",q:"10. 下列关于鼻用制剂的质量要求，说法不正确的是",opts:["A.多剂量水性介质鼻用制剂应当具有足够的抑菌性能","B.鼻用制剂多剂量包装容器应配有完整的滴管或适宜的给药装置","C.鼻用混悬液溶液应澄清，不得有沉淀和异物","D.鼻用粉雾剂的粉末粒径大多应在30~150μm之间","E.单剂量包装的鼻用半固体制剂应做装量差异检查"],ans:"C",exp:"鼻用溶液应澄清，不得有沉淀和异物；鼻用混悬液可能含沉淀物，经振摇应易分散。"},
    {type:"最佳选择题",q:"11. 下列药物从来源分类，属于天然产物的简化物的是",opts:["A.普鲁卡因","B.蒿甲醚","C.吗啡","D.洛伐他汀","E.多巴胺"],ans:"A",exp:"可卡因经结构简化，除去五元环，得到β-优卡因，继续将杂环简化得到苯甲酸酯类局麻药普鲁卡因。"},
    {type:"最佳选择题",q:"12. 玻璃药包材是药品包装的主要材料，关于其特点，下列说法不正确的是",opts:["A.化学稳定性高，与药物相容性好","B.表面光滑，易于清洗","C.易于造型，品种规格多样","D.廉价易得，可回收再生","E.耐酸耐碱，理化性质稳定"],ans:"E",exp:"玻璃药包材与水、碱性物质长期接触或刷洗、加热灭菌，会使其内壁表面发毛或透明度降低，且能使玻璃水解。"},
    {type:"最佳选择题",q:"13. 维生素A结构中含有连续的双键系统，光照下易变质，因此适宜的稳定性方法是",opts:["A.制成固体制剂","B.制成微囊化制剂","C.改变溶剂","D.驱送氧气","E.采用直接压片工艺"],ans:"B",exp:"对于维生素A这类对光不稳定的药物，合适的方法包括遮光和制成微囊或包合物。"},
    {type:"最佳选择题",q:"14. 为正确使用《中国药典》，避免标准不一，前后矛盾，需对共性问题做统一规定，此一项规定原则之总集是为",opts:["A.通则","B.凡例","C.指导原则","D.总则","E.通用方法"],ans:"B",exp:"凡例是为正确使用《中国药典》，对品种正文和通用技术要求，以及药品质量检验和检定中有关的共性问题的统一规定和基本要求。"},
    {type:"最佳选择题",q:"15. 受体数量和密度增加，敏感性不变的生理现象称为",opts:["A.受体下调","B.异源脱敏","C.受体上调","D.同源脱敏","E.受体增敏"],ans:"C",exp:"受体增敏是指长期应用拮抗药，造成受体数量或敏感性提高。若受体脱敏或增敏仅涉及受体数量或密度的变化，则分别称为受体下调或上调。"},
    {type:"最佳选择题",q:"16. 从作用机制来看，属于配体门控离子通道的开放药的是",opts:["A.阿托品","B.异丙肾上腺素","C.依那普利","D.奥沙西泮","E.甘露醇"],ans:"D",exp:"奥沙西泮属于苯二氮䓬类镇静催眠药，通过与GABA受体α亚基结合，增强GABA受体与GABA的亲和力及氯离子通道的开放频率。"},
    {type:"最佳选择题",q:"17. 下列关于药物作用时-效关系中的作用残留时间，说法不正确的是",opts:["A.作用残留时间是指时-效曲线降到有效效应线以下所需的时间","B.在作用残留时间之内，药物仍可能存在部分作用","C.对于多剂量给药，在前次给药的作用残留时间内再次给药，可能会产生蓄积现象","D.制定连续用药方案需要考虑作用残留时间等药理参数","E.口服抗凝药和强心苷类药物，给药时需要特别注意作用残留时间"],ans:"A",exp:"作用残留时间是指曲线从降到有效效应线以下到作用完全消失之间的时间。"},
    {type:"最佳选择题",q:"18. 去甲肾上腺素滴注可增加利多卡因血药浓度，原因是",opts:["A.去甲肾上腺素抑制肝药酶，减少利多卡因的代谢","B.去甲肾上腺素与利多卡因竞争同一血浆蛋白结合位点","C.去甲肾上腺素占据肠道上皮P-gp，减少利多卡因对肠道的排泄","D.去甲肾上腺素降低肝血流量，减少利多卡因的代谢","E.去甲肾上腺素通过组织结合位点置换作用，增加游离利多卡因的比例"],ans:"D",exp:"静脉滴注去甲肾上腺素可降低肝血流量，减少利多卡因的代谢，同时减少肝脏将药物从血流直接提取并从胆道排出的概率。"},
    {type:"最佳选择题",q:"19. 美芬妥英PM（慢代谢）者服用药物时，需特别警惕不良反应发生的药物不包括",opts:["A.地西泮","B.奥沙西泮","C.奥美拉唑","D.甲苯磺丁脲","E.双氯芬酸"],ans:"B",exp:"奥沙西泮为地西泮的代谢产物，可不经氧化代谢，以原型或葡萄糖醛酸结合形式排泄。"},
    {type:"最佳选择题",q:"20. 喹诺酮类药物普遍会产生光敏化反应，下列药物中光毒性反应最弱的是",opts:["A.环丙沙星","B.司帕沙星","C.左氧氟沙星","D.诺氟沙星","E.莫西沙星"],ans:"E",exp:"喹诺酮类药物光毒反应强弱顺序为：司帕沙星＞洛美沙星＞氟罗沙星＞托氟沙星＞环丙沙星＞依诺沙星＞诺氟沙星＞氧氟沙星＞左氧氟沙星＞加替沙星和莫西沙星。"},
    {type:"最佳选择题",q:"21. 从机制方面划分，药物红细胞毒性的具体原因不包括",opts:["A.抑制血红素和珠蛋白合成","B.细胞膜性质改变，红细胞机械脆性增加","C.影响红细胞能量代谢","D.抑制还原型谷胱甘肽生成","E.影响铁的转化，形成高铁血红蛋白"],ans:"D",exp:"药物的红细胞毒性包括抑制血红素和珠蛋白合成、影响红细胞膜通透性、影响能量代谢、影响铁转化等。"},
    {type:"最佳选择题",q:"22. 结合在芳环上会增加药物毒性和活性，可通过酯化或成醚降低毒性，但活性也会下降的基因是",opts:["A.烃基","B.羟基","C.羰基","D.硫醚","E.酰胺"],ans:"B",exp:"羟基取代在芳环上会使分子解离度增加，活性和毒性均增强；将羟基酰化成酯或烃化成醚，活性多降低。"},
    {type:"最佳选择题",q:"23. 对映异构体对药物活性会产生显著的影响，左旋体具有利尿作用，右旋体抗利尿的药物是",opts:["A.依托唑啉","B.哌西那多","C.奎宁","D.扎考必利","E.萘普生"],ans:"A",exp:"利尿药依托唑啉的左旋体具有利尿作用，右旋体则有抗利尿作用。"},
    {type:"最佳选择题",q:"24. 氟哌啶醇属于非三环类抗精神病药物，其结构式如下，关于氟哌啶醇下列说法不正确的是",img:"images/y14-q24.png",opts:["A.氟哌啶醇属于丁酰苯类抗精神病药物","B.氟哌啶醇化学性质不稳定，受光照颜色会加深","C.氟哌啶醇可与乳糖发生加成反应，因此本品的片剂处方中应避免使用乳糖","D.氟哌啶醇可发生羰基还原、脱水反应和葡萄糖醛酸结合等代谢反应","E.氟哌啶醇的还原代谢产物具有抗精神病活性"],ans:"C",exp:"氟哌啶醇可能与乳糖中的杂质5-羟甲基-2-糠醛发生加成反应，从而影响片剂稳定性，因此片剂处方中避免使用乳糖。"},
    {type:"最佳选择题",q:"25. 下列关于肾上腺素的作用和理化性质，说法不正确的是",opts:["A.肾上腺素为儿茶酚胺类结构，具有邻二酚羟基","B.肾上腺素在中性或碱性水溶液中不稳定，遇碱性肠液能分解","C.肾上腺素在光照下聚合成肾上腺素红，进而氧化成醌","D.肾上腺素可经儿茶酚-O-甲基转移酶和单胺氧化酶催化代谢","E.肾上腺素是内源性活性物质，可用于过敏性休克的急救"],ans:"C",exp:"肾上腺素与空气或日光接触易氧化成醌，脱氢后生成肾上腺素红，进而聚合成棕色多聚体。"},
    {type:"最佳选择题",q:"26. 异丙托溴铵结构式如下，属于抗胆碱药物，下列关于异丙托溴铵的说法不正确的是",img:"images/y14-q26.png",opts:["A.异丙托溴铵属于阿托品的衍生物，具有季铵结构","B.异丙托溴铵通过气雾剂吸入后可产生局部的支气管扩张效应","C.异丙托溴铵主要用于缓解与COPD相关的支气管痉挛与治疗哮喘","D.异丙托溴铵的疗效持续时间很短，因此需每天给药4次","E.异丙托溴铵的副作用包括视物模糊、口干和头痛等"],ans:"C",exp:"异丙托溴铵主要用于缓解与COPD相关的支气管痉挛，用于治疗哮喘很少。"},
    {type:"最佳选择题",q:"27. 由特非那定结构改造得到，具有二苯甲氧基和羰基结构，且具有活性代谢产物卡瑞斯汀的是",opts:["A.咪唑斯汀","B.左卡巴斯汀","C.依美斯汀","D.依巴斯汀","E.氨草斯汀"],ans:"D",exp:"依巴斯汀是将特非那定分子中二苯羟甲基替换为二苯甲氧基，并将羟基换为羰基，得到的生物电子等排体药物，活性代谢产物为卡瑞斯汀。"},
    {type:"最佳选择题",q:"28. 对胃酸分泌和幽门螺杆菌的腺酶均有显著的不可逆抑制作用，对幽门螺杆菌有多重抑制作用的药物是",opts:["A.兰索拉唑","B.瑞普拉生","C.伏诺拉生","D.泮托拉唑","E.雷贝拉唑"],ans:"E",exp:"雷贝拉唑对基础胃酸和刺激引起的胃酸分泌均有抑制作用，体外试验显示其比奥美拉唑和兰索拉唑有更强的抗幽门螺杆菌活性。"},
    {type:"最佳选择题",q:"29. Na⁺-Cl⁻协转运抑制剂是利尿药中常见的类型，以下关于该类药物的说法不正确的是",opts:["A.Na⁺-Cl⁻协转运抑制剂又称为噻嗪类利尿药","B.该类药物2位的氢原子和7位磺酰胺具有酸性，有利于分子成盐制备注射剂","C.该类药物6位以吸电子基团取代，可增加利尿作用","D.将3,4位的双键饱和，利尿作用消失","E.3位以烷基取代时可增加作用时间"],ans:"D",exp:"3,4位的双键饱和的衍生物较原化合物的利尿作用强10倍，而不是消失。"},
    {type:"最佳选择题",q:"30. 下列药物通过松弛平滑肌发挥药效，属于α₁肾上腺素能受体拮抗剂的是",opts:["A.拉贝洛尔","B.特拉唑嗪","C.可乐定","D.异丙肾上腺素","E.麻黄碱"],ans:"B",exp:"特拉唑嗪属于α₁肾上腺素能受体拮抗剂，可拮抗肾上腺素能受体激活，引起前列腺平滑肌松弛。"},
    {type:"最佳选择题",q:"31. 磷酸二酯酶5抑制剂（PDE5Is）是治疗勃起功能障碍的一线药物，关于此类药物，下列说法不合理的是",opts:["A.首个上市的PDE5Is是枸橼酸西地那非","B.PDE5抑制剂普遍口服吸收迅速，但生物利用度差别较大","C.PDE5抑制剂普遍经过肝脏代谢，以代谢产物的形式排泄","D.他达拉非的半衰期较其他同类药物更短","E.合用CYP3A4抑制剂往往会对PDE5抑制剂的药动学表现产生较大影响"],ans:"D",exp:"他达拉非的作用持续时间较长（＜36小时），半衰期为18小时，并非更短。"},
    {type:"最佳选择题",q:"32. 甲氨蝶呤是临床常用的抗代谢抗肿瘤药，关于其性质和作用机制，下列说法不正确的是",opts:["A.甲氨蝶呤是二氢叶酸还原酶抑制剂，属于抗叶酸抗代谢药","B.甲氨蝶呤可使四氢叶酸不能转化为二氢叶酸，从而影响辅酶F的生成","C.甲氨蝶呤在强酸性溶液中不稳定，酰胺键会水解失活","D.甲氨蝶呤对胸腺嘧啶合成酶也有抑制作用","E.甲氨蝶呤过量中毒可使用亚叶酸钙解救"],ans:"B",exp:"甲氨蝶呤几乎是不可逆地和二氢叶酸还原酶结合，使二氢叶酸不能转化为四氢叶酸，从而影响辅酶F的生成。"},
    {type:"最佳选择题",q:"33. 下列关于剂型因素对口服吸收的影响，说法不正确的是",opts:["A.口服液体制剂吸收快而完全，生物利用度高","B.口服乳剂中的表面活性剂可增加胃肠道黏膜的通透性，促进药物吸收","C.多晶型药物的口服混悬剂会因晶型改变而影响生物利用度","D.散剂中的药物粒径、溶出速度等因素会影响药物的生物利用度","E.胶囊剂性质稳定，长期保存不影响药物释放和吸收"],ans:"E",exp:"胶囊剂受温湿度影响较大，胶囊的保存时间和条件也会影响药物的释放，贮藏的相对湿度对胶囊的崩解性有较大影响。"},
    {type:"最佳选择题",q:"34. 经皮给药吸收的程度受多种因素影响，下列关于经皮给药吸收的影响因素说法不正确的是",opts:["A.角质层堵塞物去除或厚度减少，可增加药物吸收的速度和程度","B.角质层和其下的活性表皮层均为类脂质屏障，有利于脂溶性药物渗透吸收","C.亲油性高的药物相对于亲水性高的药物更容易在角质层蓄积","D.当前的经皮给药技术可控制药物的释放速度","E.微针技术可在皮肤上形成孔道，但不触及神经"],ans:"B",exp:"角质层具有类脂膜的通透性，其下的活性表皮层是水性组织，脂水分配系数适中的药物具有较好的透皮渗透系数。"},
    {type:"最佳选择题",q:"35. 下列属于代谢后水溶解性减小，脂溶性增加，用于外源性物质去活化反应的例子是",opts:["A.吗啡通过羟基与葡萄糖醛酸结合","B.保泰松羟基化代谢后生成羟布宗","C.沙丁胺醇与硫酸结合后活性降低","D.对氨基水杨酸代谢后生成对乙酰氨基水杨酸","E.卡马西平环氧化水解得到二羟基代谢物"],ans:"D",exp:"乙酰化反应将体内亲水性的氨基结合形成水溶性更小的酰胺，一般是体内外来物的去活化反应，如对氨基水杨酸乙酰化后得到对乙酰氨基水杨酸。"},
    {type:"最佳选择题",q:"36. 清除率是单室模型静脉注射的重要药动学参数，以下说法正确的是",opts:["A.清除率用k表示，数值越大，代表药物消除越快","B.清除率代表单位时间从体内消除的含药血浆体积","C.对某一正常个体，清除率是确定的，肝肾功能损害时，清除率增加","D.总清除率等于各步骤清除率相乘，若直接相加会造成重复","E.肌酐清除率可用于估算肝功能是否正常"],ans:"B",exp:"清除率用Cl表示，代表单位时间从体内消除的含药血浆体积，数值越大代表药物清除越快；肝肾功能损害时Cl会变小；总清除率等于各清除途径的清除率之和。"},
    {type:"最佳选择题",q:"37. 已知某药物静脉注射符合线性药动学单室模型特征，半衰期为1.5h，表观分布容积25L，静脉注射100mg时，血药浓度-时间曲线下面积（AUC）数值为",opts:["A.1.92","B.2.67","C.8.66","D.11.55","E.26.18"],ans:"C",exp:"k=0.693/1.5=0.462 h⁻¹，AUC=X₀/(kV)=100/(0.462×25)=8.66 mg·h·L⁻¹。"},
    {type:"最佳选择题",q:"38. 下列关于剂量依赖性药动学的特征，说法不正确的是",opts:["A.剂量依赖性药动学在高剂量下，表观消除速率常数比低剂量下更小","B.一旦消除过程达到饱和后，血药浓度会急剧增大","C.通常采用米氏方程描述该药动学过程","D.高剂量下该药动学特征更接近零级过程","E.该药动学的血药浓度-时间曲线具有下凹双曲线形状"],ans:"E",exp:"若血药浓度-时间曲线可用米氏方程描述，则其lgC-t曲线呈现明显的“上凸”形状。"},
    {type:"最佳选择题",q:"39. 静息电位是细胞生物电活动的基础和重要组成部分，下列关于静息电位的形成机制，说法不正确的是",opts:["A.细胞膜两侧具有浓度差，可引起离子的跨膜流动","B.细胞膜两侧的浓度差可维持离子泵的活性","C.细胞膜钾离子通透性高，存在持续开放的钾通道","D.钠泵通过消耗ATP，逆浓度差转运钠离子和钾离子","E.通过离子泵的转运，使得细胞膜内电位负值增大"],ans:"B",exp:"细胞膜两侧离子的浓度差由细胞膜中离子泵的活动所形成和维持，而不是浓度差维持离子泵的活性。"},
    {type:"最佳选择题",q:"40. 酶是人体内特异的生物催化剂，下列关于酶的说法不正确的是",opts:["A.酶分为单纯酶和结合酶两类，结合酶含有辅助因子","B.核酶的化学本质为蛋白质，主要作用于核酸","C.同工酶的结构与性质不同，催化的化学反应相同","D.酶结构中与底物结合并参与底物转化的区域称为活性中心","E.活性中心的必需基团包括结合基团与催化基团两类"],ans:"B",exp:"核酶和脱氧核酶是具有高效、特异催化作用的核糖核酸和脱氧核糖核酸，主要作用于核酸，化学本质不是蛋白质。"},

    // ===== 三、综合分析选择题（91-95） =====
    {type:"最佳选择题",q:"91. 机体维持血钾水平稳定的机制不包括",opts:["A.通过细胞膜Na⁺-K⁺泵，改变钾离子的细胞内外分布","B.通过细胞内外的H⁺-K⁺交换，影响细胞内外液钾的分布","C.通过肾小管上皮细胞内外跨膜电位的改变影响肾排钾量","D.通过醛固酮和集合管尿液的流速，调节肾排钾量","E.通过结肠及出汗排钾"],ans:"D",exp:"机体维持血钾稳定机制包括Na⁺-K⁺泵、H⁺-K⁺交换、肾小管跨膜电位、醛固酮和远端小管尿流速度、结肠及出汗排钾。"},
    {type:"最佳选择题",q:"92. 根据氯化钾的表观分布容积，下列说法正确的是",opts:["A.氯化钾在血浆中的分布较多","B.氯化钾在外周循环中分布较多","C.氯化钾在细胞和组织内部分布较多","D.氯化钾在红细胞和血浆蛋白中分布较多","E.氯化钾在中枢系统的分布较外周更多"],ans:"C",exp:"V=2L/kg×70kg=140L，远大于体液总体积，说明多分布于细胞组织。"},
    {type:"最佳选择题",q:"93. 某低钾血症患者体重70kg，血钾浓度为130mg/L，静脉滴注含3000mg氯化钾（含1574mg钾离子）的注射液后，若不考虑肾排泄，则血钾浓度为",opts:["A.136mg/L","B.141mg/L","C.146mg/L","D.151mg/L","E.156mg/L"],ans:"B",exp:"C=1574/140≈11mg/L，加原有130mg/L得141mg/L。"},
    {type:"最佳选择题",q:"94. β-内酰胺类抗生素对革兰阳性菌的抗菌机制主要是",opts:["A.抑制转肽酶的作用，阻碍黏肽合成，最终导致细菌的破裂溶解","B.选择性地与细菌胞浆膜中的磷脂结合，使膜通透性增加","C.抑制细菌的30S核糖体亚单位，从而抑制细菌蛋白质合成","D.干扰细菌的叶酸合成，从而影响核酸的合成","E.抑制细菌DNA依赖的RNA多聚酶，阻碍mRNA的合成"],ans:"A",exp:"β-内酰胺类抗生素抑制转肽酶，阻碍黏肽合成。"},
    {type:"最佳选择题",q:"95. 第四代头孢菌素药物头孢吡肟结构如下，其对革兰阳性菌和革兰阴性菌均有高度活性的原因是",img:"images/y14-q95.png",opts:["A.具有独特的头孢噻嗪母核","B.7位的氨基侧链具有甲基唑唑结构","C.具有带正电的季铵基团","D.具有6R,7R的独特手性构型","E.7位的氨基侧链具有甲氧亚胺乙酰基结构"],ans:"C",exp:"头孢吡肟含有正电荷的季铵基团，能使药物迅速穿透细菌细胞壁并与PBPs结合。"},

    // ===== 四、多项选择题（96-100） =====
    {type:"多项选择题",q:"96. 小剂量口服滴丸剂的质量检查项目包括",opts:["A.溶散时限","B.沉降容积比","C.无菌","D.含量均匀度","E.渗漏率"],ans:"AD",exp:"滴丸剂需检查性状、丸重差异、圆整度和溶散时限，小剂量滴丸剂还应进行含量均匀度检查。"},
    {type:"多项选择题",q:"97. 下列关于吸入制剂使用注意事项的说法，正确的有",opts:["A.吸入装置的使用需要专人指导，如使用不当可能影响治疗效果","B.哮喘和COPD患者，可在急性症状缓解后自行改用口服制剂接续治疗","C.吸入性糖皮质激素可能导致声音嘶哑和口腔真菌感染","D.吸入装置应定期清洁和更换，以确保功能正常","E.儿童和老人可能需要特殊设计的吸入装置或特别指导与监控"],ans:"ACDE",exp:"哮喘和COPD患者需要坚持长期规范治疗，不能随意停药或更改剂量。"},
    {type:"多项选择题",q:"98. 盐酸普鲁卡因注射液若出现发黄的现象，其内部可能发生的化学反应有",opts:["A.水解反应","B.还原反应","C.脱羧反应","D.缩合反应","E.氧化反应"],ans:"ACE",exp:"盐酸普鲁卡因注射液易发生酯键水解，对氨基苯甲酸还会继续氧化，同时可发生脱羧反应生成有毒苯胺，进而氧化生成有色物质。"},
    {type:"多项选择题",q:"99. 止吐药按作用机制分类，有多种不同类型，下列药物中具有止吐效果的包括",opts:["A.昂丹司琼","B.异丙嗪","C.红霉素","D.地塞米松","E.多潘立酮"],ans:"ABDE",exp:"红霉素具有恶心、呕吐的胃肠道副作用，不具有止吐效果。"},
    {type:"多项选择题",q:"100. 下列药物分布情形，由药物与特定组织亲和力强导致的有",opts:["A.使用碳酸氢钠碱化体液，促进巴比妥类药物从脑细胞向外转运","B.碘在甲状腺中浓度比其他组织中高约10000倍","C.磺胺嘧啶在脑脊液的分布比例较磺胺噻唑更高","D.氯喹在肝脏中浓度比血浆中高约700倍","E.四环素与钙形成的络合物沉积于骨骼和牙齿"],ans:"BDE",exp:"B、D、E均属于药物与特定组织亲和力强导致的选择性分布；A属于体液pH值影响；C属于血浆蛋白结合影响。"}
  ]
},
 {
  name: "押题密卷（五）",
  questions: [
    // ===== 一、最佳选择题（1-40） =====
    {type:"最佳选择题",q:"1. 关于合剂描述有误的是",opts:["A.单剂量灌装的合剂也可称口服液","B.用饮用水提取饮片，用纯化水制备成口服液","C.合剂一般检查相对密度、pH值","D.合剂中若含有中药成分，为矫正口感含蔗糖量一般高于20%","E.合剂应密封、阴凉处保存"],ans:"D",exp:"合剂若加蔗糖，除另有规定外，含蔗糖量一般不高于20%。"},
    {type:"最佳选择题",q:"2. 吐温20的HLB值为15.7，其适用的情况主要是",opts:["A.可在混悬液中作增溶剂","B.可在乳剂中作O/W型乳化剂","C.可在乳剂中作W/O型乳化剂","D.可在混悬液中作助悬剂","E.可在溶液剂中作潜溶剂"],ans:"B",exp:"HLB值在8~16的表面活性剂可用作O/W型乳化剂。吐温20的HLB值为15.7，适合作O/W型乳化剂。"},
    {type:"最佳选择题",q:"3. 对于热原的去除说法正确的是",opts:["A.热原大多是由革兰氏阳性菌产生的一种内毒素","B.热原为细菌细胞壁的毒性蛋白","C.设置隔沫装置去除热原的原因是由于热原的不挥发性","D.热原对热不够稳定","E.热原在水溶液中不带有电荷，可被活性炭吸附"],ans:"C",exp:"热原本身没有挥发性，但溶于水，蒸馏时可随水蒸气雾滴进入蒸馏水中，故蒸馏水器均应有完好的隔沫装置。"},
    {type:"最佳选择题",q:"4. 罗拉匹坦乳状液型注射剂的处方中包含：精制大豆油，注射用卵磷脂，泊洛沙姆，油酸钠，注射用甘油，注射用水。关于其处方中说法有误的是",opts:["A.处方中渗透压调节剂可换成更安全的氯化钠或葡萄糖","B.处方中油酸钠可发挥反絮凝效果增加制剂的稳定性","C.罗拉匹坦乳状液型注射液主要用于静脉注射给药","D.处方中应用两种乳化剂","E.注射用水为分散介质"],ans:"A",exp:"注射型乳剂的等渗调节剂选择需谨慎，氯化钠和葡萄糖通常不推荐作为首选。罗拉匹坦乳状液型注射剂的处方中，渗透压调节剂为甘油。"},
    {type:"最佳选择题",q:"5. 关于新型靶向脂质体描述有误的是",opts:["A.温敏脂质体在相变温度时会加快药物的释放速度","B.前体脂质体可避免脂质体之间可能出现的相互聚集","C.免疫脂质体的脂质表面会联接抗体","D.pH敏感脂质体常选用二棕榈酸磷脂或十七烷酸磷脂为膜材料制备","E.长循环脂质体利用PEG修饰以增加与单核-巨噬细胞的亲和力"],ans:"E",exp:"长循环脂质体聚乙二醇（PEG）修饰可增加脂质体的柔顺性和亲水性，从而降低与单核-巨噬细胞的亲和力，延长循环时间。"},
    {type:"最佳选择题",q:"6. 氧化锌糊剂的处方组成主要包括：氧化锌，淀粉，羊毛脂，凡士林。关于其说法有误的是",opts:["A.羊毛脂、凡士林为油溶性基质","B.淀粉及固体粉末含量不超过25%","C.处方中含有的粉末可以吸收分泌液","D.处方中基质不属于水性凝胶基质","E.本处方在冬季时可用5%液状石蜡代替部分凡士林调节硬度"],ans:"B",exp:"糊剂是指大量的原料药物固体粉末（一般25%以上）均匀地分散在适宜的基质中所组成的半固体外用制剂。本品中固体粉末成分占50%。"},
    {type:"最佳选择题",q:"7. 以下剂型中，不属于在开启后使用期不得超过4周的是",opts:["A.眼用制剂","B.耳用制剂","C.鼻用制剂","D.涂膜剂","E.冲洗剂"],ans:"E",exp:"冲洗剂开启后应立即使用，未用完的应弃去。涂剂、涂膜剂、多剂量眼用制剂、鼻用制剂、耳用制剂在开启后使用期一般不超过4周。"},
    {type:"最佳选择题",q:"8. 某些药物发生代谢活化或产生其他新的作用，转化为保留活性、毒副作用小的代谢物，这样的代谢产物可成为新的药物或先导化合物。下列不属于从代谢产物中发现的药物是",opts:["A.磺胺类抗菌药物","B.奥沙西泮","C.布洛芬","D.非索非那定","E.诺阿司咪唑"],ans:"C",exp:"布洛芬是通过化合物筛选得到的药物，而非代谢途径发现。"},
    {type:"最佳选择题",q:"9. 下列关于药物制剂的化学稳定性，说法有误的是",opts:["A.水解和氧化是药物降解的两个主要途径","B.有些药物可能同时或相继产生两种或两种以上的降解反应","C.通过水解降解的药物主要是含酰胺基和酚羟基药物","D.青霉素和头孢菌素类药物易被水解","E.维生素C含有烯醇羟基易被氧化"],ans:"C",exp:"水解是药物降解的主要途径，属于这类降解的药物主要有酯类（包括内酯）、酰胺类（包括内酰胺）等。含有酚羟基药物的降解途径主要是氧化。"},
    {type:"最佳选择题",q:"10. 有关于口服固体制剂崩解时限的检查，说法有误的是",opts:["A.崩解时限检查法属于特性检查法","B.崩解时限检查法能够反映药物的有效性","C.崩解时限检查中，不溶性包衣材料或破碎的胶囊壳可不通过筛网","D.规定如有1片不能完全崩解，应另取6片复试","E.滴丸剂应在15分钟内全部溶散"],ans:"E",exp:"滴丸剂应在30分钟内全部溶散。"},
    {type:"最佳选择题",q:"11. 形成离子-偶极、偶极-偶极相互作用的常见基团不包括",opts:["A.羰基类","B.酰胺类","C.酯类","D.酮类","E.羟基类"],ans:"E",exp:"离子-偶极、偶极-偶极相互作用通常见于羰基类化合物，如酰胺、酯、酰卤、酮等。"},
    {type:"最佳选择题",q:"12. 一名65岁患者因肺炎接受广谱抗生素治疗5天后，出现水样腹泻、腹痛和发热。实验室检查显示艰难梭菌毒素阳性，诊断为抗生素相关性腹泻，后续发展为伪膜性肠炎，后续处理中使用了免疫球蛋白进行静脉注射，出现荨麻疹现象，治疗过程中出现的不良反应分别是",opts:["A.停药反应、毒性反应","B.继发反应、变态反应","C.后遗反应、特异质反应","D.副作用、变态反应","E.二重感染、特异质反应"],ans:"B",exp:"应用广谱抗生素导致伪膜性肠炎属于继发反应（二重感染）；静脉注射免疫球蛋白出现荨麻疹属于变态反应。"},
    {type:"最佳选择题",q:"13. 根据统计，大约有三分之一的临床用药物是酶抑制剂，药物通过抑制酶的活性获得治疗效果，下列不属于可逆性抑制剂的药物是",opts:["A.依那普利","B.阿司匹林","C.吗氯贝胺","D.奥美拉唑","E.瑞普拉生"],ans:"D",exp:"奥美拉唑属于不可逆的酶抑制剂，与质子泵共价结合。"},
    {type:"最佳选择题",q:"14. 以下药理学参数中，无法反映药物安全性的是",opts:["A.斜率","B.最小有效量","C.LD50","D.安全范围","E.TI"],ans:"B",exp:"最小有效量是指引起药理效应的最小药物剂量，与药物的安全性无关。"},
    {type:"最佳选择题",q:"15. 若单胺氧化酶抑制药和三环类抗抑郁药同时使用，可引起严重的血压升高、高热、惊厥，这种相互作用属于",opts:["A.药代动力学中的作用于同一部位或受体的协同作用","B.药效动力学中的作用于同一部位或受体的协同作用","C.药代动力学中的作用于不同部位或受体的拮抗作用","D.药效动力学中的作用于不同部位或受体的拮抗作用","E.药效动力学中对作用部位的增敏作用"],ans:"B",exp:"单胺氧化酶抑制药和三环类抗抑郁药同用属于药效动力学方面的相互作用，属于作用于同一部位的协同作用。"},
    {type:"最佳选择题",q:"16. 蛋白质为生物大分子物质，具有三维空间结构，有关于蛋白质的各级结构描述有误的是",opts:["A.蛋白质的一级结构是由遗传信息决定的","B.蛋白质的基本单位氨基酸的连接方式为肽键","C.蛋白质的二级结构肽链局部的空间位置连接方式为氢键","D.蛋白质的二级结构包含α-螺旋、β-折叠、β-转角、β-卷曲","E.蛋白质的四级结构由各亚基组成"],ans:"D",exp:"蛋白质二级结构的基本形式为α-螺旋、β-折叠、β-转角和无规卷曲等。"},
    {type:"最佳选择题",q:"17. 关于核酸的基本单位描述有误的是",opts:["A.DNA的基本组成是核糖核苷酸，RNA的基本组成是脱氧核糖核苷酸","B.DNA和RNA共用的碱基是A、G、C","C.尿嘧啶只存在于核糖核酸中","D.核苷酸的戊糖结构分为核糖和脱氧核糖两种","E.戊糖和磷酸以磷酸二酯键连接"],ans:"A",exp:"DNA的基本组成是脱氧核糖核苷酸，RNA的基本组成是核糖核苷酸。"},
    {type:"最佳选择题",q:"18. 酮体是脂肪酸在肝中不完全氧化的中间产物，有关于酮体的生成和利用说法有误的是",opts:["A.乙酰乙酸、β-羟丁酸和丙酮共同构成酮体","B.在血糖低时，肝脏可利用酮体供能","C.酮体的主要原料是乙酰CoA","D.酮体生成的关键酶是HMG-CoA合酶","E.脑和骨骼肌等组织可利用酮体"],ans:"B",exp:"酮体是脂肪酸在肝中氧化分解的正常产物，但其在肝不能进一步氧化分解，需转运至肝外彻底氧化利用。"},
    {type:"最佳选择题",q:"19. 发热不是体温调节障碍，其体温调节功能正常，只是由于调定点上移，将体温调节到较高水平。干扰素属于",opts:["A.发热激活物","B.外致热原","C.体内产物发热激活物","D.内生致热原","E.药物代谢物"],ans:"D",exp:"干扰素属于内生致热原。"},
    {type:"最佳选择题",q:"20. 引起消化道系统毒副作用的药物不包括",opts:["A.甲氨蝶呤","B.糖皮质激素","C.阿仑膦酸钠","D.阿司匹林","E.肾上腺素"],ans:"E",exp:"肾上腺素通常不直接引起显著的消化系统毒性。"},
    {type:"最佳选择题",q:"21. 用药个体遗传异常、过敏体质或机体状态异常时，用药则出现相应毒性作用，这属于影响药物的机体因素，下列叙述有误的是",opts:["A.肼屈嗪慢乙酰化者更易发生红斑狼疮","B.氯霉素导致灰婴综合征是由于新生儿肝脏葡萄糖醛酸结合能力尚未充分发育","C.G-6-PD酶缺失时，在服用磺胺类药物会导致溶血反应","D.嗜酒患者应用硝酸酯类药物导致血压骤降是由于酒精属于肝药酶诱导剂","E.HIV感染患者服用复方磺胺甲噁唑会导致皮疹和严重的皮肤不良反应"],ans:"D",exp:"酒精对交感神经和血管运动中枢等有抑制作用，代谢产物乙醛可抑制中枢收缩血管，并直接扩张外周血管，进一步加重血管舒张。硝酸酯类药物通过释放一氧化氮直接松弛血管平滑肌，两者协同导致血压下降，而不是因为酒精属于肝药酶的诱导剂。"},
    {type:"最佳选择题",q:"22. 关于地西泮的代谢说法有误的是",opts:["A.1位N-去甲基代谢产物为去甲西泮","B.3位羟基化的代谢产物为替马西泮","C.1位N-去甲基，3位羟基化的代谢产物为奥沙西泮","D.地西泮的代谢产物中，仅奥沙西泮具有活性","E.地西泮的活性代谢物适用于老年患者或肝肾功能不全的患者"],ans:"D",exp:"地西泮的代谢产物去甲西泮、替马西泮、奥沙西泮均已广泛用于临床，并非仅奥沙西泮具有活性。"},
    {type:"最佳选择题",q:"23. 具有苯甲酰胺结构，结构和甲氧氯普胺结构相似，含有吗啉环的药物是",opts:["A.","B.","C.","D.","E."],optImgs:["images/y15-q23-A.png","images/y15-q23-B.png","images/y15-q23-C.png","images/y15-q23-D.png","images/y15-q23-E.png"],ans:"B",exp:"吗氯贝胺具有苯甲酰胺结构，与舒必利和甲氧氯普胺结构相似，且含有吗啉环结构，选项B符合条件。"},
    {type:"最佳选择题",q:"24. 关于COX-2选择性抑制药昔布类药物叙述有误的是",opts:["A.COX-2比COX-1空间宽阔，且这两种酶的生理性质有很大区别","B.昔布类药物由于具有空间较大的三环结构，故作用于COX-2","C.罗非昔布由于选择性过强，使PGI增加，出现血管栓塞风险","D.由于心血管事件的发生，罗非昔布、伐地昔布撤市","E.艾瑞昔布为治疗关节痛的一线药物"],ans:"C",exp:"COX-2抑制药抗炎作用强，使得PGI2减少，打破正常情况下的TXA2和PGI2的平衡状态，从而产生心血管事件。"},
    {type:"最佳选择题",q:"25. 关于齐留通（5-脂氧合酶抑制剂）的药理特点及临床应用，以下哪项描述是错误的",img:"images/y15-q25.png",opts:["A.通过抑制5-脂氧合酶减少白三烯合成，从而缓解哮喘炎症","B.能增加普萘洛尔、茶碱、华法林在血浆中浓度","C.其代谢产物具有活性","D.N-羟基脲结构是药效基因","E.齐留通口服吸收迅速，其S-异构体代谢和消除迅速"],ans:"C",exp:"齐留通口服吸收迅速，其代谢主要在肝脏，主要产物为无活性的葡萄糖醛酸苷化物。"},
    {type:"最佳选择题",q:"26. 下列组胺H1受体拮抗药物中，不属于活性更高、毒副作用更低的活性代谢物的是",opts:["A.非索非那定","B.诺阿司咪唑","C.地氯雷他定","D.茶苯海明","E.卡瑞斯汀"],ans:"D",exp:"茶苯海明与具有中枢兴奋作用的8-氯茶碱结合成盐，为克服苯海拉明的嗜睡和中枢抑制副作用，不属于活性代谢物。"},
    {type:"最佳选择题",q:"27. 胺碘酮是一种广谱抗心律失常药，具有复杂的电生理效应，以下关于胺碘酮描述有误的是",img:"images/y15-q27.png",opts:["A.胺碘酮能选择性扩张冠状动脉","B.胺碘酮的代谢反应主要是N-去甲基","C.胺碘酮的主要代谢物也具有电生理活性","D.胺碘酮由于含有碘原子，易在体内蓄积","E.胺碘酮可影响体内甲状腺素的代谢"],ans:"B",exp:"胺碘酮在肝脏代谢，代谢反应主要为N-去乙基化。"},
    {type:"最佳选择题",q:"28. 香豆素类抗凝药可以抑制维生素K环氧还原酶，从而影响凝血因子的活性，有关于香豆素类药物华法林钠的结构特征及临床应用，叙述有误的是",img:"images/y15-q28.png",opts:["A.口服吸收完全，血浆蛋白结合率约99.5%","B.S-异构体的抗凝活性是R-异构体的4倍，药用其外消旋体","C.生物利用度高","D.该结构含有一个手性中心","E.其S-异构体和R-异构体的代谢途径相同"],ans:"E",exp:"华法林钠在体内的代谢因构型不同而有所区别，S-异构体经丙酮侧链还原而代谢，R-异构体则在母核7位上进行羟基化。"},
    {type:"最佳选择题",q:"29. 药用Z-异构体，具有肠肝循环现象，可进行N-脱甲基代谢和羟基化代谢的雌激素类药物是",opts:["A.","B.","C.","D.","E."],optImgs:["images/y15-q29-A.png","images/y15-q29-B.png","images/y15-q29-C.png","images/y15-q29-D.png","images/y15-q29-E.png"],ans:"D",exp:"他莫昔芬在肝内代谢，给药后由CYP3A4进行脱甲基化得到其主要的代谢物N-脱甲基他莫昔芬，还可被CYP2D6代谢得到次要的代谢物4-羟基他莫昔芬。"},
    {type:"最佳选择题",q:"30. 格列美脲属于高效、长效口服降糖药，其长效的原因是",img:"images/y15-q30.png",opts:["A.结构中的二氢吡咯环增加药物稳定性","B.引入的甲酰基增加药物稳定性","C.甲基处在环己烷的平伏键上，阻碍代谢","D.乙基占据吡咯甲酰的主要代谢位点","E.环己烷的引入使得格列美脲比格列本脲更长效"],ans:"C",exp:"格列美脲是格列本脲分子中的苯甲酰胺基被二氢吡咯甲酰基替代的衍生物，同时环己基被4-甲基环己基取代物，甲基处在环己烷的平伏键上，占据主代谢位点，因而长效。"},
    {type:"最佳选择题",q:"31. 肝脏内的谷胱甘肽是一种重要的内源性抗氧化剂和解毒分子，有关于其叙述有误的是",opts:["A.谷胱甘肽和药物结合会增加其亲核性","B.谷胱甘肽由谷氨酸-半胱氨酸-甘氨酸组成","C.谷胱甘肽属于三肽化合物","D.谷胱甘肽可用于对乙酰氨基酚的中毒解救","E.谷胱甘肽和酰卤的反应是体内解毒的反应"],ans:"A",exp:"谷胱甘肽的亲核性（巯基-SH）在反应中被消耗，形成共轭物后亲核性减弱。"},
    {type:"最佳选择题",q:"32. 药物的解离度对药物的吸收及药物的转运影响很大，下列说法有误的是",opts:["A.解离型药物由于离子降的原因很难跨过生物膜","B.药物在不同pH环境中解离程度不一定相同","C.在pH值较高的环境，酸性药物解离多","D.应用抗酸药物提高胃液pH值，碱性药物的吸收率会降低","E.每个药物都有固定的解离常数"],ans:"D",exp:"对于碱性药物，在pH相对提高的环境中，分子型多，吸收率会提高。"},
    {type:"最佳选择题",q:"33. 下列关于注射途径与药物吸收的关系，描述有误的是",opts:["A.油剂、混悬型注射剂较水溶液吸收慢","B.临床治疗中常选择动脉注射将药物运送至全身而广泛发挥治疗作用","C.组织血流量对吸收有影响","D.鞘内注射一般可把药物送到中枢神经系统内","E.静脉滴注不存在吸收过程"],ans:"B",exp:"动脉注射可将药物输送至该动脉分布部位而发挥局部作用并减少全身反应。"},
    {type:"最佳选择题",q:"34. 在药动学模型中，对于房室模型和生理药动学(PBPK)的主要区别，描述有误的是",opts:["A.房室模型的参数来源基于血药浓度相关，PBPK基于生理数据","B.房室模型无解剖学对应，PBPK基于真实器官","C.两种模型均可实现外推，广泛应用于各种属间的药动学研究","D.PBPK有利于分析药物在作用部位的量-效关系","E.房室模型计算量小"],ans:"C",exp:"房室参数因种属差异需重新拟合难以实现外推，PBPK可以进行种属间或不同人群的外推。"},
    {type:"最佳选择题",q:"35. 在生物等效性研究的受试者选择中，以下情况为合理条件的是",opts:["A.年龄在24周岁以上","B.主要拟用于老年人群，应尽可能多地入选55岁以上的受试者","C.入选受试者的例数应具有足够的行为学效力","D.如果研究药物拟用于两种性别的人群，研究入选的受试者应有适当的性别比例","E.体重不作为生物等效性研究的受试者选择的特征"],ans:"D",exp:"受试者的选择应符合：年龄在18周岁以上；应涵盖一般人群的特征；如果研究药物拟用于两种性别的人群，研究入选的受试者应有适当的性别比例；如果研究药物主要拟用于老年人群，应尽可能多地入选60岁以上的受试者；入选受试者的例数应使生物等效性评价具有足够的统计学效力。"},
    {type:"最佳选择题",q:"36. 下列关于生物利用度的说法，正确的是",opts:["A.生物利用度仅仅强调药物进入体循环的程度，与吸收速度无关","B.相对生物利用度是以非静脉制剂为参比制剂计算的结果","C.绝对生物利用度的参比制剂为已上市的原研药","D.生物利用度的吸收速度可用血药浓度-时间曲线下面积(AUC)表示","E.口服制剂的绝对生物利用度一定低于静脉制剂"],ans:"B",exp:"生物利用度包括药物进入体循环的速度和程度；相对生物利用度以非静脉制剂为参比；绝对生物利用度的参比制剂为静脉注射制剂；AUC反映吸收程度，吸收速度常用Tmax或Cmax表示；口服制剂的绝对生物利用度可能因首过效应低于静脉制剂，但不绝对。"},
    {type:"最佳选择题",q:"37. 已知某药物静脉注射后初始血药浓度为24mg/L，1.5小时后浓度降至12mg/L，3小时后降至6mg/L，4.5小时后降至3mg/L。则血药浓度从18mg/L降到4.5mg/L所需的时间为",opts:["A.1.5小时","B.3小时","C.4.5小时","D.2小时","E.3.5小时"],ans:"B",exp:"药物浓度每1.5小时下降一半，半衰期为1.5小时。从18mg/L降至4.5mg/L，下降为原来的1/4，需要2个半衰期，即3小时。"},
    {type:"最佳选择题",q:"38. 某药物具有线性动力学特征，表观分布容积为15L，静脉注射150mg后经过一个小时测得血药浓度为5mg/L，则静脉注射600mg后一个小时测血药浓度值为",opts:["A.5mg/L","B.10mg/L","C.15mg/L","D.20mg/L","E.25mg/L"],ans:"D",exp:"静脉注射150mg后零时刻血药浓度为150÷15=10mg/L，经过一个小时降为5mg/L，说明半衰期是1小时。静脉注射600mg后零时刻血药浓度为600÷15=40mg/L，经过一个半衰期，还剩20mg/L。"},
    {type:"最佳选择题",q:"39. 当碱性药物中毒时，服用氯化铵解毒的原理是",opts:["A.降低尿液pH，减少碱性药物重吸收","B.降低尿液pH，促进碱性药物通过细胞膜空隙滤过","C.升高尿液pH，减少碱性药物的肾小管分泌","D.升高尿液pH，增加碱性药物的重吸收","E.降低尿液pH，促进碱性药物的肾小管重吸收"],ans:"A",exp:"氯化铵可酸化尿液，降低尿液pH。碱性药物在酸性环境中解离度增加，分子型药物减少，导致肾小管重吸收减少，加速药物排泄。"},
    {type:"最佳选择题",q:"40. 下列关于非线性药动学的说法，正确的是",opts:["A.药物的消除速率与血药浓度始终成正比","B.剂量增加时，AUC与剂量呈线性增加关系","C.药物代谢酶或转运体饱和是其主要原因","D.半衰期不随剂量变化而改变","E.药物的表观分布容积随剂量增加而减小"],ans:"C",exp:"非线性药动学的核心机制是代谢酶或转运体饱和，使消除过程从一级转为零级动力学。"},

    // ===== 二、配伍选择题（41-90） =====
    {type:"配伍选择题",subs:[
      {q:"41. 对湿热敏感的药物应该避免湿法制粒过程，需要省掉制粒步骤，适用的黏合剂为",opts:["A.羟丙基甲基纤维素","B.羧甲基淀粉钠","C.羟丙基纤维素","D.乙基纤维素","E.羧甲基纤维素钠"],ans:"C",exp:"羟丙基纤维素可作粉末直接压片黏合剂，适用于对湿热敏感的药物，可避免湿法制粒或干燥过程，简化工艺，直接压片省去制粒步骤。"},
      {q:"42. 能够适用于可压性较差的药物的黏合剂是",opts:["A.羟丙基甲基纤维素","B.羧甲基淀粉钠","C.羟丙基纤维素","D.乙基纤维素","E.羧甲基纤维素钠"],ans:"E",exp:"羧甲基纤维素钠适用于可压性较差的药物，是解决可压性差药物成型问题的有效黏合剂，尤其适合疏松粉末或湿热敏感药物。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"43. 含有EudragitRL100，EudragitRS100、乙基纤维素以及聚山梨酯20的处方是",opts:["A.依托度酸缓释片（不溶性骨架片）","B.硝酸甘油缓释片（溶蚀性骨架片）","C.二甲双胍缓释片（亲水凝胶骨架片）","D.茶碱微孔膜缓释小片（膜控缓释小片）","E.硝苯地平渗透泵片（渗透泵片）"],ans:"D",exp:"EudragitRL100，EudragitRS100为常见的包衣膜材料，乙基纤维素为其中一种包衣材料，聚山梨酯20为致孔剂，以两种包衣液判断此处方为膜控型缓释小片。"},
      {q:"44. 含有羟丙基甲基纤维素K100M和羟丙甲纤维素E5M的处方是",opts:["A.依托度酸缓释片（不溶性骨架片）","B.硝酸甘油缓释片（溶蚀性骨架片）","C.二甲双胍缓释片（亲水凝胶骨架片）","D.茶碱微孔膜缓释小片（膜控缓释小片）","E.硝苯地平渗透泵片（渗透泵片）"],ans:"C",exp:"羟丙基甲基纤维素K100M，羟丙基甲基纤维素E5M为亲水凝胶骨架材料，故判断此处方为二甲双胍缓释片。"},
      {q:"45. 含有硬脂酸和十六醇的处方是",opts:["A.依托度酸缓释片（不溶性骨架片）","B.硝酸甘油缓释片（溶蚀性骨架片）","C.二甲双胍缓释片（亲水凝胶骨架片）","D.茶碱微孔膜缓释小片（膜控缓释小片）","E.硝苯地平渗透泵片（渗透泵片）"],ans:"B",exp:"硬脂酸和十六醇为溶蚀型骨架材料，故判断此处方为硝酸甘油缓释片。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"46. 处方中含有甘露醇、水解明胶的制剂是",opts:["A.罗替戈汀混悬型注射液","B.维生素C注射液","C.氟比洛芬乳状液型注射液","D.注射用辅酶A无菌冻干制剂","E.丹参酮IIA磺酸钠注射用浓溶液"],ans:"D",exp:"注射用辅酶A为冻干粉针剂，处方中的甘露醇、水解明胶等作为填充剂（赋形剂）。"},
      {q:"47. 处方中仅用丙二醇当作溶剂的制剂是",opts:["A.罗替戈汀混悬型注射液","B.维生素C注射液","C.氟比洛芬乳状液型注射液","D.注射用辅酶A无菌冻干制剂","E.丹参酮IIA磺酸钠注射用浓溶液"],ans:"E",exp:"丹参酮IIA磺酸钠为主药，吐温80为增溶剂，丙二醇为溶剂，将水溶性差的丹参酮ⅡA制成注射用浓溶液。"},
      {q:"48. 处方中含有卵磷脂、二油酰基磷脂酰丝氨酸的制剂是",opts:["A.罗替戈汀混悬型注射液","B.维生素C注射液","C.氟比洛芬乳状液型注射液","D.注射用辅酶A无菌冻干制剂","E.丹参酮IIA磺酸钠注射用浓溶液"],ans:"C",exp:"氟比洛芬酯乳状性注射液的处方中：精制大豆油为油溶剂，卵磷脂为乳化剂、二油酰基磷脂酰丝氨酸作为稳定剂，可维持注射剂质量。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"49. 生理盐水灌肠剂属于",opts:["A.刺激性灌肠剂","B.高渗性灌肠剂","C.润滑性灌肠剂","D.等渗性灌肠剂","E.保留性灌肠剂"],ans:"D",exp:"生理盐水属于等渗性灌肠剂，氯化钠是形成等渗溶液的物质，纯化水为溶剂。等渗溶液增加肠内容物的体积，通过机械性扩张刺激肠壁促进排便。"},
      {q:"50. 油性灌肠剂属于",opts:["A.刺激性灌肠剂","B.高渗性灌肠剂","C.润滑性灌肠剂","D.等渗性灌肠剂","E.保留性灌肠剂"],ans:"C",exp:"油性灌肠剂属于润滑性灌肠剂，本品润滑粪便并软化硬结便，适用于严重便秘或术后恢复期。"},
      {q:"51. 甘油灌肠剂属于",opts:["A.刺激性灌肠剂","B.高渗性灌肠剂","C.润滑性灌肠剂","D.等渗性灌肠剂","E.保留性灌肠剂"],ans:"A",exp:"甘油灌肠剂属于刺激性灌肠剂，甘油润滑肠道，同时刺激肠黏膜促进排便。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"52. 当栓剂应用混合脂肪酸甘油酯作为基质时，适宜的抗氧化剂为",opts:["A.叔丁基对羟基茴香醚（BHA）","B.硫代硫酸钠","C.环糊精类衍生物","D.甘油明胶","E.巴西棕榈蜡"],ans:"A",exp:"混合脂肪酸甘油酯为油脂性基质，适用的抗氧剂也应该为油溶性抗氧剂，如叔丁基对羟基茴香醚(BHA)等。"},
      {q:"53. 起全身治疗作用的栓剂，适宜选用的吸收促进剂为",opts:["A.叔丁基对羟基茴香醚（BHA）","B.硫代硫酸钠","C.环糊精类衍生物","D.甘油明胶","E.巴西棕榈蜡"],ans:"C",exp:"通过与阴道或直肠接触而起全身治疗作用的栓剂，可利用非离子型表面活性剂、脂肪酸、脂肪醇和脂肪酸酯、尿素、水杨酸钠、羟甲基纤维素钠、环糊精类衍生物等作为药物的吸收促进剂。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"54. 针对无菌产品如注射剂，需进行的生物检查法是",opts:["A.装量差异","B.结晶性检查","C.渗透压","D.溶出","E.降压物质检查"],ans:"E",exp:"《中国药典》通则的生物学检查法中收载有无菌检查法、异常毒性检查法、热原检查法、细菌内毒素检查法、升压物质检查法、降压物质检查法、组胺类物质检查法、过敏反应检查法、溶血与凝聚检查法。注射剂需要检查渗透压，但渗透压不属于生物学检查法。"},
      {q:"55. 凡检查含量均匀度的制剂，一般不再检查的是",opts:["A.装量差异","B.结晶性检查","C.渗透压","D.溶出","E.降压物质检查"],ans:"A",exp:"凡检查含量均匀度的制剂，一般不再检查重(装)量差异。"},
      {q:"56. 水溶解度低但渗透性高的亲脂性药物，其限速因素是",opts:["A.装量差异","B.结晶性检查","C.渗透压","D.溶出","E.降压物质检查"],ans:"D",exp:"BCSⅡ类为水溶解度较低但渗透性高的亲脂性分子药物，药物的溶出是吸收的限速过程，可通过增加溶解度和溶出速度的方法，改善药物的吸收。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"57. 盐酸四环素略有引湿性、遇光色变深，四环素胶囊要求的贮存条件是",opts:["A.密闭、遮光、常温","B.密封、遮光、凉暗","C.密封、遮光、阴凉","D.密封、遮光、冷处","E.密封、遮光、干燥"],ans:"E",exp:"盐酸四环素略有引湿性、遇光色渐变深，盐酸四环素片及胶囊要求遮光、密封、在干燥处保存。"},
      {q:"58. 生化药品门冬酰胺酶注射剂的贮存条件是",opts:["A.密闭、遮光、常温","B.密封、遮光、凉暗","C.密封、遮光、阴凉","D.密封、遮光、冷处","E.密封、遮光、干燥"],ans:"D",exp:"门冬酰胺酶是从大肠埃希菌中提取制备的具有酰胺基水解作用的酶，注射剂要求遮光、密封，冷处保存。"},
      {q:"59. 门冬酰胺片剂的贮存条件是",opts:["A.密闭、遮光、常温","B.密封、遮光、凉暗","C.密封、遮光、阴凉","D.密封、遮光、冷处","E.密封、遮光、干燥"],ans:"C",exp:"门冬酰胺片剂要求遮光、密封、在阴凉处保存。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"60. ISO9000系列标准中，《质量管理体系一要求》的标识序号为",opts:["A.ISO 9000","B.ISO 9001","C.ISO 9004","D.ISO 19011","E.ISO 9014"],ans:"B",exp:"ISO9001《质量管理体系一要求》：规定质量管理体系要求，用于证实组织具有稳定提供满足顾客要求及适用法律法规要求的产品和服务的能力，目的在于增强顾客满意度。"},
      {q:"61. ISO9000系列标准中，《质量管理体系一组织的质量一实现持续成功指南》的标识序号为",opts:["A.ISO 9000","B.ISO 9001","C.ISO 9004","D.ISO 19011","E.ISO 9014"],ans:"C",exp:"ISO 9004《质量管理体系一组织的质量一实现持续成功指南》：提供质量管理体系的有效性和效率的指南。"},
      {q:"62. ISO9000系列标准中，《管理体系审核指南》的标识序号为",opts:["A.ISO 9000","B.ISO 9001","C.ISO 9004","D.ISO 19011","E.ISO 9014"],ans:"D",exp:"ISO 19011《管理体系审核指南》：提供了管理体系审核的指南，包括审核原则、审核方案和管理体系的审核实施，以及评价参与审核过程的人员能力的指南。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"63. 阿昔洛韦属于1g能在溶剂1000～不到10000ml中溶解的药物，其溶解度属于",opts:["A.不溶","B.极微溶解","C.微溶","D.略溶","E.溶解"],ans:"B",exp:"“极微溶解”是指溶质1g(ml)能在溶剂1000～不到10000ml中溶解。"},
      {q:"64. 头孢拉定属于1g能在溶剂10～不到30ml中溶解的药物，其溶解度属于",opts:["A.不溶","B.极微溶解","C.微溶","D.略溶","E.溶解"],ans:"E",exp:"“溶解”是指溶质1g(ml)能在溶剂10～不到30ml中溶解。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"65. 可以反应药物内在活性的药理学参数是",opts:["A.HLB","B.logP","C.NO","D.N2","E.Emax"],ans:"E",exp:"最大效应(Emax)，也称效能，反映了药物的内在活性。"},
      {q:"66. 既可应用为气雾剂的抛射剂，又属于靶细胞的第二信使的是",opts:["A.HLB","B.logP","C.NO","D.N2","E.Emax"],ans:"C",exp:"NO分子小，脂溶性高，能通过生物膜快速扩散，且NO可以作为第二信使参与细胞内的信号转导。N2仅作为气雾剂的抛射剂。"},
      {q:"67. 影响药物口服吸收的药物理化因素包括",opts:["A.HLB","B.logP","C.NO","D.N2","E.Emax"],ans:"B",exp:"影响药物吸收的理化因素包括脂溶性和解离度，药物的脂溶性可用脂水分配系数logP表示。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"68. 属于条件致病菌，革兰氏阴性杆菌的是",opts:["A.葡萄糖球菌","B.脑膜炎奈瑟菌","C.大肠埃希菌","D.痢疾杆菌","E.白喉杆菌"],ans:"C",exp:"大肠埃希菌属于条件致病菌、染色属性为革兰阴性杆菌，一般情况下不致病，当改变寄生部位侵入某些器官时，可导致阑尾炎、胆囊炎、腹膜炎、泌尿系统感染等。"},
      {q:"69. 主要通过飞沫传播，属于革兰氏阴性球菌的是",opts:["A.葡萄糖球菌","B.脑膜炎奈瑟菌","C.大肠埃希菌","D.痢疾杆菌","E.白喉杆菌"],ans:"B",exp:"脑膜炎奈瑟菌属于革兰阴性球菌，主要经飞沫传播。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"70. 药物引起的骨髓抑制通常见于药物使用后1～3周，下列属于可能会引起骨髓抑制的药物是",opts:["A.氯霉素","B.替罗非班","C.保泰松","D.硝苯地平","E.螺内酯"],ans:"A",exp:"常见的致骨髓抑制药物有氯霉素、多柔比星、卡铂、环磷酰胺、长春碱类等。"},
      {q:"71. 能够通过免疫学机制引起药源性血小板减少症的药物是",opts:["A.氯霉素","B.替罗非班","C.保泰松","D.硝苯地平","E.螺内酯"],ans:"B",exp:"替罗非班与血小板表面糖蛋白GPⅡb/Ⅲa结合，引起糖蛋白GPⅡb/Ⅲa构象改变，被机体中自然存在的抗体所识别，从而引起非班类血小板减少症。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"72. 庚氟奋乃近比氟奋乃近作用时间更长，引入的位阻基团是",opts:["A.烃基","B.季铵","C.巯基","D.羧酸","E.卤素"],ans:"A",exp:"庚氟奋乃近比氟奋乃近多引入了庚烷，属于烃基，烃基属于位阻基团，加强了药物结构的稳定性。"},
      {q:"73. 有较强还原能力，还可与α,β-不饱和酮发生加成反应的基团是",opts:["A.烃基","B.季铵","C.巯基","D.羧酸","E.卤素"],ans:"C",exp:"巯基有较强的亲核性，可与α,β-不饱和酮发生加成反应，还可与重金属作用生成不溶性的硫醇盐，故可作为解毒药，如二巯丙醇。"},
      {q:"74. 既可以成盐，又可以成酯的是",opts:["A.烃基","B.季铵","C.巯基","D.羧酸","E.卤素"],ans:"D",exp:"羧酸与金属离子成盐可增加水溶性，羧酸可以和羟基成酯来增加药物脂溶性，增加药物的吸收。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"75. “脒基团”部分由脒基部分连以硝基构成的H2受体拮抗药是",opts:["A.","B.","C.","D.","E."],optImgs:["images/y15-q75~77-A.png","images/y15-q75~77-B.png","images/y15-q75~77-C.png","images/y15-q75~77-D.png","images/y15-q75~77-E.png"],ans:"B",exp:"雷尼替丁结构中的脒基部分通过硝基修饰来消除碱性。"},
      {q:"76. “脒基团”部分由氨磺酰基脒组成的H2受体拮抗药是",opts:["A.","B.","C.","D.","E."],optImgs:["images/y15-q75~77-A.png","images/y15-q75~77-B.png","images/y15-q75~77-C.png","images/y15-q75~77-D.png","images/y15-q75~77-E.png"],ans:"C",exp:"法莫替丁结构中含氮的平面极性基团为氨磺酰基脒，确保在生理pH值为中性而提高了法莫替丁的活性。"},
      {q:"77. “脒基团”部分由氰基胍基组成的H2受体拮抗药是",opts:["A.","B.","C.","D.","E."],optImgs:["images/y15-q75~77-A.png","images/y15-q75~77-B.png","images/y15-q75~77-C.png","images/y15-q75~77-D.png","images/y15-q75~77-E.png"],ans:"A",exp:"西咪替丁化学结构由咪唑五元环、含硫醚的四原子链和末端取代胍三个部分构成。此外，不可离子化的氰基胍基是提高受体亲和力和拮抗活性的关键。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"78. 由稠合的三环酰胺结构与奎宁环相连，为第二代5-HT3受体拮抗剂是",opts:["A.","B.","C.","D.","E."],optImgs:["images/y15-q78~80-A.png","images/y15-q78~80-B.png","images/y15-q78~80-C.png","images/y15-q78~80-D.png","images/y15-q78~80-E.png"],ans:"A",exp:"盐酸帕洛诺司琼为第二代5-HT3受体拮抗剂，其化学结构与第一代5-HT3受体拮抗剂不同，由一个稠合的三环酰胺结构与奎宁环相连。"},
      {q:"79. 属于吲哚衍生物，吲哚环经羟基化后再进一步形成葡萄糖醛酸和硫酸的结合产物的5-HT3受体拮抗剂是",opts:["A.","B.","C.","D.","E."],optImgs:["images/y15-q78~80-A.png","images/y15-q78~80-B.png","images/y15-q78~80-C.png","images/y15-q78~80-D.png","images/y15-q78~80-E.png"],ans:"D",exp:"托烷司琼属于吲哚衍生物，代谢主要为吲哚环羟基化后，再进一步形成葡萄糖醛酸和硫酸的结合产物，然后经尿或胆汁排泄。"},
      {q:"80. 属于吲唑衍生物的5-HT3受体拮抗剂是",opts:["A.","B.","C.","D.","E."],optImgs:["images/y15-q78~80-A.png","images/y15-q78~80-B.png","images/y15-q78~80-C.png","images/y15-q78~80-D.png","images/y15-q78~80-E.png"],ans:"C",exp:"格拉司琼属于吲唑衍生物的5-HT3受体拮抗剂。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"81. 头孢氨苄C3位为氯替代得到的可口服的半合成头孢菌素是",opts:["A.","B.","C.","D.","E."],optImgs:["images/y15-q81~83-A.png","images/y15-q81~83-B.png","images/y15-q81~83-C.png","images/y15-q81~83-D.png","images/y15-q81~83-E.png"],ans:"E",exp:"头孢克洛是头孢氨苄C3位氯原子替代得到的可口服的半合成头孢菌素。"},
      {q:"82. 属于碳头孢结构，结构改造过程中将原本的-S-用-CH2-取代得到的化合物是",opts:["A.","B.","C.","D.","E."],optImgs:["images/y15-q81~83-A.png","images/y15-q81~83-B.png","images/y15-q81~83-C.png","images/y15-q81~83-D.png","images/y15-q81~83-E.png"],ans:"C",exp:"氯碳头孢属于碳头孢结构，相当于头孢克洛结构中的-S-被-CH2-取代得到的化合物。"},
      {q:"83. 3位为2-羟乙基-3-氨基吡唑基鎓盐的化合物是",opts:["A.","B.","C.","D.","E."],optImgs:["images/y15-q81~83-A.png","images/y15-q81~83-B.png","images/y15-q81~83-C.png","images/y15-q81~83-D.png","images/y15-q81~83-E.png"],ans:"D",exp:"头孢噻利3位为2-羟乙基-3-氨基吡唑基鎓盐，属于第四代头孢。"}

    {type:"配伍选择题",subs:[
      {q:"84. 单糖类、氨基酸、季铵盐类药物在小肠的转运过程属于",opts:["A.主动转运","B.易化扩散","C.膜动转运","D.滤过","E.单纯扩散"],ans:"B",exp:"在小肠上皮细胞、脂肪细胞、血-脑屏障血液侧的细胞膜中，单糖类、氨基酸、季铵盐类药物的转运属于易化扩散。"},
      {q:"85. 弱酸性与弱碱性药物自肾小管分泌的转运过程是",opts:["A.主动转运","B.易化扩散","C.膜动转运","D.滤过","E.单纯扩散"],ans:"A",exp:"主动转运是指药物逆浓度梯度或逆电化学梯度的跨细胞膜转运，弱酸性与弱碱性药物自肾小管分泌，以及药物自肝细胞转运等都是主动转运过程。"},
      {q:"86. P-糖蛋白借助ATP将化疗药物外排的转运过程是",opts:["A.主动转运","B.易化扩散","C.膜动转运","D.滤过","E.单纯扩散"],ans:"A",exp:"主动转运方式中，部分转运蛋白可将药物由细胞内转运至细胞外，如P-糖蛋白、乳腺癌耐药蛋白、肺耐药蛋白、多药耐药蛋白等。"}

    {type:"配伍选择题",subs:[

      {q:"88. 能通过氧化S-脱烷基生成硫醚和羰基化合物的是",opts:["A.","B.","C.","D.","E."],optImgs:["images/y15-q87~88-A.png","images/y15-q87~88-B.png","images/y15-q87~88-C.png","images/y15-q87~88-D.png","images/y15-q87~88-E.png"],ans:"B",exp:"6-甲基巯嘌呤在代谢过程中可发生硫醚的S-脱烷基代谢。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"89. 抗癫痫药卡马西平属于前药，结构中7元含氮杂草环含有烯烃结构，最后代谢为无活性物质所需要的酶是",opts:["A.CYP2C19","B.CYP2D6","C.CYP3A4","D.黄素单加氧酶","E.mEH(环氧化物水解酶)"],ans:"E",exp:"抗癫痫药卡马西平是前体药物，经CYP代谢后生成有药理活性的卡马西平-10,11-环氧化物，再经mEH(微粒体环氧化物水解酶)代谢成无活性的产物。"},
      {q:"90. 三环类抗抑郁药代谢所需要的酶是",opts:["A.CYP2C19","B.CYP2D6","C.CYP3A4","D.黄素单加氧酶","E.mEH(环氧化物水解酶)"],ans:"B",exp:"CYP2D6酶能够代谢的三环类抗抑郁药主要是去甲替林、地昔帕明、氟西汀。"}
    ]},

    // ===== 三、综合分析选择题（91-95） =====
    {type:"最佳选择题",q:"91. 已知用于肝动脉化疗的微球通常为100～300μm，则伊立替康微球属于",opts:["A.普通注射微球","B.栓塞性微球","C.磁性微球","D.生物靶向性微球","E.脂质微球"],ans:"B",exp:"栓塞性微球注射于癌变部位的动脉血管内，微球随血流可以阻滞在瘤体周围的毛细血管内，甚至可使小动脉暂时栓塞，既可切断肿瘤的营养供给，也可使载药的微球滞留在病变部位，提高局部浓度，延长作用时间，因此，栓塞性微球一般粒径较大，视栓塞部位不同，粒径大小为30～800μm不等。"},
    {type:"最佳选择题",q:"92. 微球的载体材料可选用可降解材料，下列不属于可生物降解的材料是",opts:["A.聚乳酸(PLA)","B.聚乳酸-羟乙酸(PLGA)","C.明胶","D.聚酰胺","E.葡聚糖"],ans:"D",exp:"微球的可生物降解的骨架材料主要有两大类，天然聚合物如淀粉、白蛋白、明胶、壳聚糖、葡聚糖等；合成聚合物如聚乳酸(PLA)、聚丙交酯、聚乳酸-羟乙酸(PLGA)、聚丙交酯-乙交酯(PLCG)、聚己内酯、聚羟丁酸等。聚酰胺属于非生物降解材料，多用于微囊的囊材。"},
    {type:"最佳选择题",q:"93. 伊立替康是在7-乙基-10-羟基喜树碱(SN-38)结构中引入羧酰基哌啶基哌啶侧链的药物，在体内经代谢生成SN-38而起作用，其结构式为",opts:["A.","B.","C.","D.","E."],optImgs:["images/y15-q93-A.png","images/y15-q93-B.png","images/y15-q93-C.png","images/y15-q93-D.png","images/y15-q93-E.png"],ans:"B",exp:"含有羰酰基哌啶基哌啶侧链，两个哌啶环结构相连的只有B选项。"},
    {type:"最佳选择题",q:"94. 氟康唑口服吸收可达90%，含有两个弱碱性的三氮唑环和一个亲脂性的2,4-二氟苯基，下列符合其结构特征的是",opts:["A.","B.","C.","D.","E."],optImgs:["images/y15-q94-A.png","images/y15-q94-B.png","images/y15-q94-C.png","images/y15-q94-D.png","images/y15-q94-E.png"],ans:"B",exp:"结构中含有两个弱碱性的三氮唑环和一个亲脂性的2,4-二氟苯基，使其具有一定的水溶解度。这种结构使氟康唑口服吸收可达90%，且不受食物、抗酸药、组胺H2受体拮抗剂类抗溃疡药物的影响。"},
    {type:"最佳选择题",q:"95. 唑类抗真菌药是目前临床上治疗真菌感染的主流药物，其作用机制主要是使真菌细胞膜重要成分合成受阻，关于真菌细胞膜与细胞壁的特殊性描述有误的是",opts:["A.真菌和细菌的细胞膜上主要区别是真菌含固醇而细菌不含固醇","B.甾醇是构成真菌细胞膜的重要成分","C.真菌和哺乳动物细胞膜的区别是真菌含胆固醇","D.真菌细胞壁不含肽聚糖","E.真菌细胞壁由多糖和蛋白质组成"],ans:"C",exp:"甾醇是构成真菌细胞膜的重要成分，真菌与哺乳动物之间的区别是哺乳动物细胞膜的甾醇是胆固醇，而真菌中则是麦角甾醇。"},

    // ===== 四、多项选择题（96-100） =====
    {type:"多项选择题",q:"96. 下列有关乳剂的不稳定现象，叙述正确的有",opts:["A.分层又名乳析，是由于分散相和分散介质之间的密度差而形成","B.乳剂中的电解质和离子型乳化剂是产生絮凝的主要原因","C.转相是由乳化剂性质发生改变引起的，向乳剂中加入相反的乳化剂也可转相","D.乳滴合并破裂是不可逆的过程","E.酸败是由于受到微生物影响使其中的防腐剂变质的现象"],ans:"ABCD",exp:"分层、絮凝、转相、合并与破裂、酸败是乳剂的不稳定现象。酸败是乳剂受外界因素及微生物的影响，使其中的油、乳化剂等发生变质的现象，不是防腐剂变质。"},
    {type:"多项选择题",q:"97. 单剂量包装的混悬剂需要进行的质量要求检查项目包括",opts:["A.沉降容积比","B.重新分散性","C.含量均匀度","D.絮凝度","E.流变学"],ans:"ABCDE",exp:"混悬剂需要进行检查的项目包括：沉降容积比、重新分散性、微粒大小、絮凝度、流变学。其次，单剂量包装的混悬剂还需检查含量均匀度。"},
    {type:"多项选择题",q:"98. 由乳酸、甘油、生糖氨基酸转变为葡萄糖或糖原的过程称为糖异生，糖异生的生理意义主要包括",opts:["A.饥饿情况下维持血糖浓度恒定","B.加速糖原合成、抑制糖原分解","C.回收乳酸能量，补充肝糖原","D.是三大营养物质的代谢枢纽","E.调节酸碱平衡"],ans:"ACE",exp:"糖异生的生理意义包括：①饥饿情况下维持血糖浓度恒定；②回收乳酸能量，补充肝糖原；③调节酸碱平衡。加速糖原合成、抑制糖原分解是胰岛素的降糖机制。三羧酸循环是三大营养物质代谢联系的枢纽。"},
    {type:"多项选择题",q:"99. 能够引起红人综合征的药物主要包括",opts:["A.磺胺类","B.替考拉宁","C.万古霉素","D.苯巴比妥","E.利福平"],ans:"BCE",exp:"红人综合征是注射或口服某些药物(如万古霉素、替考拉宁、利福平)后所出现的不良反应。"},
    {type:"多项选择题",q:"100. 药物的化学结构对药物的吸收、转运都有重大影响，下列属于药物化学结构对吸收和转运影响的项目包括",opts:["A.解离度","B.脂水分配系数","C.氢键","D.亲水亲油平衡值","E.极性表面积(PSA)"],ans:"ABCE",exp:"药物的水溶解性和脂溶性是药物吸收的重要影响因素。解离度、脂水分配系数、氢键和极性表面积(PSA)均会因药物化学结构的不同而影响药物的吸收和转运。亲水亲油平衡值是衡量表面活性剂亲水性和亲脂性的参数，通常不用于药物吸收和转运影响因素的评价。"}
  ]
},
 {
  name: "押题密卷（六）",
  questions: [
    // ===== 一、最佳选择题（1-40） =====
    {type:"最佳选择题",q:"1. 关于药品名称的叙述，错误的是",opts:["A.化学药品制剂名称的基本形式为“原料药名称+给药途径+剂型名称”","B.药品的通用名称是药物物质或活性成分的名称","C.药品的英文化学名称即国际非专有名称","D.阿托伐他汀钙片的商品名称为立普妥","E.药品的通用名称不能取得专利和行政保护"],ans:"C",exp:"药品的英文通用名称即国际非专有名称(INN)。通用名称在药典、产品信息、宣传材料、药品监管和科学文献中使用，不能取得专利和行政保护。"},
    {type:"最佳选择题",q:"2. β受体拮抗剂氧烯洛尔...该药物的化学骨架名称为",img:"y16-q2.png",opts:["A.芳基丙酸","B.芳氧丙醇胺","C.苯乙醇胺","D.苯磺酰脲","E.烯丙基"],ans:"B",exp:"β受体拮抗剂的化学骨架名称为芳氧丙醇胺。"},
    {type:"最佳选择题",q:"3. 属于药品包装材料的化学性能检查的项目是",opts:["A.密封性","B.细菌内毒素","C.水蒸气透过量","D.重金属","E.溶血细胞毒性"],ans:"D",exp:"材料的化学性能检查：浸出物、还原性物质、重金属、蒸发残渣、pH值、紫外吸收度等。使用性能检查：密封性、水蒸气透过量等。生物安全检查：微生物限度、异常毒性等。"},
    {type:"最佳选择题",q:"4. 《中国药典》检查项下，主要用于检查药品纯度的是",opts:["A.特性检查法","B.溶出度与释放度测定法","C.含量均匀度检查法","D.生物学检查法","E.限量检查法"],ans:"E",exp:"限量检查是指按规定的方法检查药品中的杂质是否超过限量规定，限量检查是药品纯度检查的重要组成部分。"},
    {type:"最佳选择题",q:"5. 关于蛋白质的结构与功能，说法错误的是",opts:["A.氨基酸是组成蛋白质的基本结构单位","B.蛋白质分子中的氨基酸之间是通过肽键相连的","C.构成蛋白质的氨基酸主要为D-α-氨基酸","D.蛋白质的变性是由于其空间构象被破坏，引起功能活性丧失","E.变性蛋白质在复性后构象复原，活性即能恢复"],ans:"C",exp:"构成天然蛋白质的氨基酸仅有20种，除甘氨酸外，蛋白质中的氨基酸均属L-α-氨基酸。"},
    {type:"最佳选择题",q:"6. 只存在于DNA中，不存在于RNA中的碱基是",opts:["A.胸腺嘧啶(T)","B.尿嘧啶(U)","C.鸟嘌呤(G)","D.腺嘌呤(A)","E.胞嘧啶(C)"],ans:"A",exp:"胸腺嘧啶(T)一般而言只存在于DNA中，不存在于RNA中；而尿嘧啶(U)只存在于RNA中，不存在于DNA中。"},
    {type:"最佳选择题",q:"7. 下列关于柠檬酸循环的说法，正确的是",opts:["A.柠檬酸循环发生在细胞的细胞核中","B.柠檬酸循环不产生ATP","C.1分子乙酰CoA进入柠檬酸循环后，生成1分子CO2","D.每循环一次，有1次脱羧反应","E.柠檬酸循环的第一个限速步骤是1分子乙酰CoA与1分子草酰乙酸缩合成柠檬酸"],ans:"E",exp:"柠檬酸循环的第一个限速步骤是乙酰CoA与草酰乙酸缩合成柠檬酸。柠檬酸循环在线粒体基质，产生ATP，每循环一次生成2分子CO2，有2次脱羧反应。"},
    {type:"最佳选择题",q:"8. 溶出速度因能直接影响药物起效时间、药效强度和持续时间，故比崩解更能反映制剂质量的本质。以下关于溶出速度的描述，错误的是",opts:["A.固体药物的溶出速度主要受扩散控制，可用Noyes-Whitney方程表示","B.溶出介质的体积小，溶液中的药物浓度高，溶出速度慢","C.孔隙率越高，表面积越大，溶出速度越快","D.一般稳定型的结晶熵值最小、熔点高、溶解度大、溶出速度快","E.加入表面活性剂促进粉末表面的润湿，提高药物的溶出"],ans:"D",exp:"一般稳定型的结晶熵值最小、熔点高、溶解度小、溶出速度慢。"},
    {type:"最佳选择题",q:"9. 关于影响药物胃肠道吸收的因素，说法正确的是",opts:["A.首过消除可使药物作用减弱，也可使药物作用增强","B.弱碱性药物易在胃吸收，弱酸性药物易在小肠吸收","C.溴丙胺太林会减少地高辛在肠内的溶解与吸收","D.高纤维食物可增加亲脂性药物的溶解，从而增加亲脂性药物的吸收","E.高脂食物会减弱脂溶性药物的吸收"],ans:"A",exp:"大多数情况下代谢物无活性，首过消除将使药物作用减弱；但如果代谢物具有显著性，则首过消除可能使药物作用增强。弱酸性药物易在胃吸收，弱碱性药物易在小肠吸收。溴丙胺太林通过减慢肠蠕动来增加地高辛在肠内的溶解与吸收。高纤维食物减少亲脂性药物的吸收。高脂食物增加脂溶性药物的吸收。"},
    {type:"最佳选择题",q:"10. 关于药物在眼部吸收的说法，正确的是",opts:["A.结膜是限制眼表给药时的药物吸收进入眼内的主要因素","B.亲脂性很高的药物分子才容易透过角膜","C.亲水性药物的分子量越大，渗透系数越高","D.低渗溶液易引发角膜组织膨胀而引起疼痛","E.为降低眼部给药药物流失，可通过加入聚山梨酯来增加眼用液体制剂的黏度"],ans:"D",exp:"低渗溶液易引发角膜组织膨胀而引起疼痛。角膜是限制眼表给药时的药物吸收进入眼内的主要因素。药物分子需具有适宜的亲水亲脂性才容易透过角膜。亲水性药物的渗透系数与其分子量相关，分子量增大，渗透系数降低。聚山梨酯不能增加黏度，增黏剂可用羧甲基纤维素钠、聚乙烯醇。"},
    {type:"最佳选择题",q:"11. 排泄是体内药物或其代谢物排出体外的过程。关于排泄的说法错误的是",opts:["A.药物与血浆蛋白结合程度较高时，可使肾小球滤过的药量减少","B.水溶性药物在肾小管重吸收多","C.肾小管分泌需载体参与，有饱和现象","D.相对分子质量大于0.5kDa的化合物可随胆汁排出","E.酸化尿液使弱碱性药物在肾小管中大部分解离，重吸收少，排泄增加"],ans:"B",exp:"水溶性药物在肾小管重吸收少，易随尿排出。"},
    {type:"最佳选择题",q:"12. 下列关于药代动力学房室模型的说法，正确的是",opts:["A.单室模型中各组织药物浓度变化速率相同，但实际浓度可不等","B.双室模型的周边室包括心、肝等血流丰富的组织","C.采样时间不足不影响多室模型的判定","D.房室划分取决于药物的吸收和消除速率","E.非线性药动学与房室模型无关"],ans:"A",exp:"同一房室内各个部位的药物浓度变化速率相近，但不代表浓度一定相等。中央室包括血液及血流供应充沛的组织如心、肝、肾等；周边室代表血流供应较少的组织。采样时间不足可能导致多室模型被误判为单室。房室个数主要取决于药物分布行为，而非吸收和消除速率。非线性药动学也基于房室模型概念。"},
    {type:"最佳选择题",q:"13. 下列不良反应中，属于特异质反应的是",opts:["A.长期服用中枢性降压药可乐定后突然停药，次日血压显著升高","B.假性胆碱酯酶缺乏者，应用骨骼肌松弛药琥珀胆碱后，出现呼吸暂停反应","C.长期应用某种药物后，产生强迫性连续或定期用药的行为","D.阿托品用于解除胃肠痉挛时，引发口干、心悸、便秘等症状","E.长期使用庆大霉素后出现耳鸣、听力减退"],ans:"B",exp:"特异质反应多是先天遗传异常所致的反应，如假性胆碱酯酶缺乏者应用琥珀胆碱后出现呼吸暂停。A是停药反应，C是依赖性，D是副作用，E是耳毒性。"},
    {type:"最佳选择题",q:"14. 下列关于NO作为信号分子的描述，正确的是",opts:["A.仅具备第一信使特征，无法作用于自身细胞","B.只能通过旁分泌作用于邻近细胞，不能进行自分泌","C.因子小、脂溶性高，既能自分泌又能旁分泌，兼具第一和第二信使特征","D.作为第二信使时，不能对邻近细胞中的靶分子发生作用","E.与其他信号分子不同，不具备信息传递作用"],ans:"C",exp:"NO分子小，脂溶性高，能通过生物膜快速扩散，具备自分泌和旁分泌作用。NO生成后能对自身细胞和邻近细胞中的靶分子发生作用，既有第一信使特征，也有第二信使特征。"},
    {type:"最佳选择题",q:"15. 某新型抗肿瘤药物设计为双位点作用分子...该药物与靶标结合的主要键合类型及其对应的键能特征描述最准确的是",opts:["A.范德瓦耳斯力与疏水键协同作用，均为不可逆结合","B.共价键主导不可逆结合，辅以非共价键协同作用","C.离子键与共价键联合作用，破坏酶活性中心结构","D.氢键与半胱氨酸残基结合，增强共价键的稳定性","E.疏水键破坏水分子层，为不可逆结合"],ans:"B",exp:"题干中“半胱氨酸残基形成共价键”、“范德瓦耳斯力及疏水键可逆结合”说明既有共价键又有非共价键，且共价键使酶构象改变，为主导。"},
    {type:"最佳选择题",q:"16. 在离体豚鼠回肠实验中，药物A单独使用时可使肠道平滑肌收缩(Emax=100%)，药物B以10^-6 mol/L浓度预处理后，药物A的最大效应降至60%；若增加药物B浓度至10^-4 mol/L，药物A的最大效应降至20%，再继续增加药物A的剂量也恢复不了原有的Emax。下列关于药物B作用类型的推断，正确的是",opts:["A.竞争性拮抗药，通过可逆结合受体降低激动药亲和力","B.非竞争性拮抗药，通过不可逆结合受体减少可激活受体数量","C.部分激动药，内在活性α=0.2，与激动药竞争结合位点","D.反向激动药，激活受体后产生与激动药相反的生理效应","E.完全激动药，内在活性α=1，与部分激动药竞争结合位点"],ans:"B",exp:"药物B使激动药A的最大效应下降，且增加A剂量不能恢复，符合不可逆性非竞争性拮抗药特征。"},
    {type:"最佳选择题",q:"17. 下列关于药物相互作用的描述，正确的是",opts:["A.丙磺舒与青霉素合用，因丙磺舒抑制肾小管分泌，使青霉素排泄加快，疗效降低","B.利福平与口服避孕药合用，因利福平诱导CYP3A4、使避孕药代谢减慢，避孕失败风险降低","C.红霉素与辛伐他汀合用，因红霉素抑制CYP3A4及P-gp，使辛伐他汀血药浓度显著升高，增加疾病风险","D.环磷酰胺与利福平合用，因环磷酰胺诱导肝药酶，使利福平代谢加快，抗结核疗效减弱","E.苯妥英钠与西咪替丁合用，因西咪替丁诱导CYP3A4，使苯妥英钠代谢加快，血药浓度降低"],ans:"C",exp:"红霉素与辛伐他汀合用，因红霉素对CYP3A4的抑制作用，同时抑制P-gp，减少其胆汁排泄，双重作用致辛伐他汀血药浓度显著攀升。A丙磺舒应使青霉素排泄减慢；B利福平诱导CYP3A4使避孕药代谢加快；D环磷酰胺损害肠黏膜吸收功能减少利福平吸收；E西咪替丁抑制CYP3A4使苯妥英钠代谢减慢。"},
    {type:"最佳选择题",q:"18. 下列关于遗传药理学与临床用药的描述，正确的是",opts:["A.异烟肼快代谢者因乙酰化酶活性高，易发生多发性神经炎，需补充维生素B6","B.CYP2C19弱代谢型患者使用奥美拉唑时，需将剂量增加至常规量的2倍以保证疗效","C.CYP2D6弱代谢型患者使用可待因时，因无法有效生成吗啡，镇痛作用显著减弱","D.葡萄糖-6-磷酸脱氢酶缺乏者服用伯氨喹后，因红细胞氧化损伤减轻，需增加剂量以维持抗疟效果","E.CYP4F2纯合子患者使用华法林时，因凝血因子代谢加快，需增加初始用药剂量"],ans:"C",exp:"可待因需由CYP2D6催化生成吗啡而发挥镇痛作用，抑制该酶有可能使可待因的镇痛作用减弱。异烟肼慢代谢者易发生多发性神经炎。CYP2C19弱代谢型对奥美拉唑代谢减慢，应降低剂量。G-6-PD缺乏者服用伯氨喹易发生溶血性贫血，需禁用。CYP4F2纯合子对华法林代谢减慢，需降低剂量。"},
    {type:"最佳选择题",q:"19. 通过引起细胞功能紊乱导致毒性的药物是",opts:["A.地塞米松活化糖皮质激素受体及下游信号通路，导致淋巴细胞凋亡及致畸","B.紫杉醇与微管蛋白结合，影响细胞骨架蛋白聚合或解聚","C.非那西丁对肝细胞产生化学损伤，进而使肝组织出现变性和坏死","D.四环素通过干扰肝细胞的代谢过程，导致肝内脂肪堆积形成脂肪肝","E.磺胺类药物可使红细胞中的血红蛋白转变成高铁血红蛋白引起高铁血红蛋白血症"],ans:"A",exp:"地塞米松作为外源性配体活化糖皮质激素受体及下游信号通路，导致淋巴细胞凋亡及致畸，属于药物引起细胞功能紊乱导致的毒性。"},
    {type:"最佳选择题",q:"20. 结构中含有苯基哌嗪片段，代谢产生亚胺-醌和氯代对醌，产生肝脏毒性而撤市的是",opts:["A.","B.","C.","D.","E."],optImgs:["y16-q20-A.png","y16-q20-B.png","y16-q20-C.png","y16-q20-D.png","y16-q20-E.png"],ans:"C",exp:"非三环类抗抑郁药奈法唑酮结构中含有苯基哌嗪片段，因分子中缺乏其他可被代谢的位点，仍可生成4-位羟化代谢物，后者可氧化为具有亲电性的亚胺-醌以及N-去芳基化生成氯代对醌，从而产生肝毒性反应。该药已因此不良反应于2003年撤市。"},
    {type:"最佳选择题",q:"21. 在环己巴比妥分子结构的氮原子上引入甲基后生成海索比妥，关于海索比妥相较于环己巴比妥的描述错误的是",opts:["A.脂溶性有所提高","B.脂水分配系数(logP)增大","C.氮原子上的甲基具有供电子效应，使药物不易解离","D.pKa值增大","E.生理pH值环境下离子型占比高"],ans:"E",exp:"甲基的引入通过改变电子效应和脂溶性，使海索比妥的pKa增大、脂溶性提高，logP增大，不易解离，在生理pH下更易以分子型存在。"},
    {type:"最佳选择题",q:"22. 氯胺酮S-(+)-对映异构体具有麻醉作用，R-(-)-对映异构体则产生中枢兴奋作用，出现这种现象的原因是",opts:["A.药物的几何异构对活性的影响，对映体异构体之间产生相同的药理活性，但强弱不同","B.药物的手性结构对活性的影响，其中一种对映体具有药理活性，另一对映体具有毒性作用","C.药物的手性结构对活性的影响，对映体异构体之间产生相同的药理活性，但强弱不同","D.药物的几何异构对活性的影响，其中一种对映体具有药理活性，另一对映体具有毒性作用","E.药物的构象异构体对活性的影响，对映体异构体之间产生相同的药理活性，但强弱不同"],ans:"B",exp:"R、S均为氯胺酮的手性异构体，氯胺酮的S-(+)-对映体产生安眠镇痛作用，R-(-)-对映体产生中枢兴奋作用，中枢兴奋作用于麻醉作用来说就是属于毒性作用。"},
    {type:"最佳选择题",q:"23. 苯二氮䓬类药物的基本结构如下，关于该类药物的构效关系和应用的说法，错误的是",img:"y16-q23.png",opts:["A.属于GABA受体的调节剂，GABA受体属于配体门控离子通道受体","B.1,2位酰胺键在酸性条件下水解开环，会引起药物失活","C.地西泮的代谢产物奥沙西泮具有活性","D.将七元亚胺内酰胺环用三氮唑环取代，即可得到第一类精神药品三唑仑","E.3位引入羟基后，在活性降低的同时，副作用也降低"],ans:"D",exp:"苯二氮䓬类药物的七元亚胺内酰胺为活性必需基团，不可取代；唑仑类药物是在七元亚胺内酰胺的1,2位并上1,2,4-三氮唑环得到的，三唑仑亦如此。"},
    {type:"最佳选择题",q:"24. 吲哚美辛...关于其说法错误的是",img:"y16-q24.png",opts:["A.含有吲哚乙酸，为芳基乙酸类药物","B.与葡萄糖醛酸的结合是其代谢的主要方式","C.5位甲氧基的存在可以有效防止该药在体内的代谢","D.口服吸收迅速，Tmax为2~3小时","E.为非选择性的COX抑制剂"],ans:"B",exp:"吲哚美辛经代谢失活，大约50%被代谢为5位O-去甲基化的代谢物，有10%代谢物与葡萄糖醛酸结合，故主要依赖于O-去甲基化的代谢。"},
    {type:"最佳选择题",q:"25. 孟鲁司特钠是选择性白三烯受体拮抗剂，适用于哮喘的长期治疗与预防。下列关于孟鲁司特钠特点和临床使用的说法，错误的是",opts:["A.通过与气道白三烯受体选择性结合，阻断过敏介质介导的气道收缩、支气管痉挛等，来改善呼吸道炎症，使气道通畅","B.口服吸收迅速而完全，Tmax为3小时","C.顺式异构体无治疗作用","D.稳定性好，常将其颗粒剂溶于热水中服用","E.在体内几乎完全被代谢"],ans:"D",exp:"孟鲁司特钠稳定性差，对光、湿、热均不稳定，一旦溶于水并见光会快速分解，因此孟鲁司特钠颗粒不能溶于水等遮光性差的液体中服用。"},
    {type:"最佳选择题",q:"26. 下列关于组胺H2受体拮抗剂的构效关系及代谢特点，描述正确的是",opts:["A.碱性芳杂环上的取代基需为中性基团以增强与受体的结合力","B.柔性链中氧原子的存在可增加链的柔性，提升药物活性","C.西咪替丁的咪唑环可与细胞色素P450酶系的血红素铁竞争性结合，抑制其活性","D.雷尼替丁脒基部分通过硝基修饰来增强其碱性","E.法莫替丁的代谢产物均具有与原型药物相当的H2受体拮抗活性"],ans:"C",exp:"西咪替丁是细胞色素P450酶系的可逆抑制剂，是由于西咪替丁的咪唑环和细胞色素P450酶系蛋白上His残基的咪唑环与血红素铁(Fe2+)发生竞争结合。碱性芳杂环需以阳离子形式与受体结合。2位硫原子可增加链的柔性。雷尼替丁脒基部分通过硝基修饰来消除其碱性。除尼扎替丁外，H2受体拮抗药的代谢物均无活性。"},
    {type:"最佳选择题",q:"27. 下列关于HMG-CoA还原酶抑制药的描述，正确的是",opts:["A.洛伐他汀因分子中不含内酯结构，故体外即具有HMG-CoA还原酶抑制活性","B.辛伐他汀在洛伐他汀十氢萘环侧链引入甲基，导致其亲脂性降低且活性减弱","C.普伐他汀钠将内酯环开环成钠盐，并在十氢萘环2位引入巯基，增强亲水性以减少副作用","D.氟伐他汀作为首个全合成他汀类药物，以吡啶环替代洛伐他汀的双环结构","E.瑞舒伐他汀在嘧啶环上引入甲磺酰基，通过形成氢键增强与HMG-CoA还原酶的结合"],ans:"E",exp:"瑞舒伐他汀为全合成他汀，分子中的双环结构改造为多取代的嘧啶环，嘧啶环上引入的甲磺酰基作为氢键接受体，能与HMG-CoA还原酶形成氢键。洛伐他汀含内酯结构，体外无活性。辛伐他汀引入甲基使亲脂性提高，活性略强。普伐他汀引入羟基而非巯基。氟伐他汀用吲哚环替代双环。"},
    {type:"最佳选择题",q:"28. 下列关于抗心绞痛药物的描述，正确的是",opts:["A.硝酸甘油舌下含服起效快，主要活性代谢物为单硝酸异山梨酯","B.硝酸异山梨酯的代谢产物5-单硝酸异山梨酯因脂溶性高致头痛","C.硝苯地平遇光稳定，氧化为吡啶环后活性增强","D.尼莫地平易透过血脑屏障，选择性扩张脑血管","E.地尔硫䓬顺式1-异构体活性最高，临床常用此构型"],ans:"D",exp:"尼莫地平脂溶性高，可透过血脑屏障，选择性扩张脑血管。硝酸甘油主要活性代谢物为二硝酸代谢物。5-单硝酸异山梨酯水溶性大，头痛副作用主要由硝酸异山梨酯本身脂溶性高引起。硝苯地平遇光易降解，氧化为吡啶环后活性降低。地尔硫䓬顺式d-异构体(2S,3S-构型)活性最高。"},
    {type:"最佳选择题",q:"29. 以下关于肾上腺糖皮质激素类药物的构效关系，描述错误的是",opts:["A.在甾体激素中Δ'位引入双键可使醋酸氢化可的松的抗炎活性增大4倍，且不增加钠潴留作用","B.6α-氟代衍生物通过阻止6位氧化代谢失活，从而增强药物活性","C.9α-氟代衍生物单独使用时可增强抗炎活性但不增加钠潴留作用","D.21位羟基酯化可增加口服吸收率，并提高外用制剂的溶解性","E.16α-甲基衍生物通过立体位阻妨碍17位氧化代谢，进而增强抗炎活性"],ans:"C",exp:"纯9α-氟代衍生物会同时增加抗炎活性和钠潴留作用，无实用价值。"},
    {type:"最佳选择题",q:"30. 下列关于抗肿瘤药物的说法，正确的是",opts:["A.异环磷酰胺代谢产生的单氯乙基环磷酰胺具有神经毒性，需联用美司钠预防神经毒性","B.卡莫司汀因脂溶性低无法透过血脑屏障，仅适用于治疗实体瘤","C.多烯他赛通过10位去乙酰基和13位侧链修饰，水溶性优于紫杉醇且抗肿瘤谱更广","D.奥沙利铂作为拓扑异构酶I抑制剂，是首个对结肠癌有效的铂类药物","E.培美曲塞仅抑制二氢叶酸还原酶，对非小细胞肺癌疗效显著"],ans:"C",exp:"多烯他赛是紫杉醇的半合成衍生物，水溶性优于紫杉醇，且抗肿瘤谱更广。异环磷酰胺主要毒性为出血性膀胱炎，需联用美司钠。卡莫司汀脂溶性高，可透过血脑屏障。奥沙利铂属于铂类烷化剂，并非拓扑异构酶I抑制剂。培美曲塞是多靶点抗代谢药。"},
    {type:"最佳选择题",q:"31. 关于口服缓控释固体制剂的体外释放行为评价与临床应用，下列叙述错误的是",opts:["A.体外释放度试验中，缓释制剂的取样时间点至少需设置5个，控释制剂至少需设置3个","B.释放介质首选水性介质(如水、缓冲液)，难溶性药物可添加表面活性剂调节","C.临床用药时，无刻痕的缓控释制剂严禁压碎或咀嚼，以免破坏释药结构","D.体外释放度测定时，需考察不同转速对释放行为的影响，通常不推荐过高或过低转速","E.缓释制剂取样点设置中，首点取样时间应在0.5-2小时，用于考察药物是否有突释"],ans:"A",exp:"缓释制剂从释药曲线图中至少选出3个取样时间点；控释制剂取样点不得少于5个。"},
    {type:"最佳选择题",q:"32. 关于增加药物溶解度和溶出速度的方法，下列说法正确的是",opts:["A.药物溶解过程均为吸热过程，故升温一定能增加溶解度","B.所有药物的粒径减小至0.1μm以下时，溶解度均会显著增加","C.药物的无定型晶型比稳定型晶型溶解度更大，溶出速度更快","D.助溶剂通过形成胶束增加药物溶解度，如聚山梨酯类的作用机制","E.溶解度和溶出速度排序：无水物>水合物>有机溶剂化物"],ans:"C",exp:"无定型晶型的药物晶格排列无序，能量更高，故溶解度和溶出速度均大于稳定型晶型。温度对溶解度的影响取决于溶解过程是吸热还是放热。难溶性药物在粒径≤0.1μm时溶解度增加。助溶剂通过形成络合物增加溶解度，增溶剂通过形成胶束。多数情况下，溶解度和溶出速度的顺序排列为：水合物<无水物<有机溶剂化物。"},
    {type:"最佳选择题",q:"33. 关于口服混悬剂的特点与质量要求，下列说法正确的是",opts:["A.沉降容积比F=H/H0，F值越大，混悬剂稳定性越差","B.微粒大小必须严格控制在0.5~10μm范围内，超出此范围则不符合质量要求","C.絮凝度β=F/F∞，β值越大，表明絮凝效果越好","D.重新分散性要求沉降物经振摇后2小时内完全重新分散","E.混悬剂的长效作用主要归因于药物在分散介质中溶解度极高"],ans:"C",exp:"絮凝度β值越大，表明絮凝后沉降物容积增加越多，絮凝效果越好。沉降容积比F值越大，混悬剂稳定性越好。混悬剂微粒大小一般在0.5~10μm，但根据临床需求可调整，并非“必须严格控制”。重新分散性要求沉降物经振摇后应很快重新分散。混悬剂的长效作用源于难溶性药物的低溶解度，导致药物溶出速度缓慢。"},
    {type:"最佳选择题",q:"34. 氯化钠原料中含有微量的钙盐，当与25%枸橼酸钠注射液配伍时往往产生枸橼酸钙的悬浮微粒而浑浊，其原因是",opts:["A.配合量的影响","B.成分纯度的影响","C.混合顺序的影响","D.盐析作用的影响","E.离子作用的影响"],ans:"B",exp:"由于药物的纯度不够，某些制剂在配伍时会发生异常现象。如氯化钠原料中含有微量的钙盐，当与25%枸橼酸钠注射液配伍时往往产生枸橼酸钙的悬浮微粒而浑浊。"},
    {type:"最佳选择题",q:"35. 下列关于注射剂灭菌法的说法，错误的是",opts:["A.干热灭菌法适用于耐高温的玻璃器皿，需在180℃加热2小时才能破坏热原","B.湿热灭菌法中热压灭菌的F0值对不耐热药物应不低于8分钟","C.辐射灭菌法常用60Co产生的γ射线，可用于所有塑料制品的灭菌","D.过滤除菌法选用0.22μm孔径滤膜，适用于热不稳定溶液的除菌","E.气体灭菌法常用环氧乙烷，但不建议用于干粉类注射剂灭菌"],ans:"C",exp:"能够耐辐射的医疗器械、生产辅助用品、药品包装材料、原料药及成品等均可用辐射灭菌法，并非所有制品。"},
    {type:"最佳选择题",q:"36. 下列关于微球的说法，错误的是",opts:["A.微球粒径范围一般为1~250μm","B.微球可作为抗肿瘤药物载体，使药物可以缓慢释放","C.生物可降解材料PLGA是制备微球的常用载体","D.粒径小于3μm的微球静脉注射后主要被肺截获","E.微球需要进行体外释放度的测定"],ans:"D",exp:"肺部毛细血管直径为3~11μm，粒径>3μm的微球静脉注射后可被肺有效截获。而3μm以下的微球会很快被网状内皮系统的巨噬细胞清除，故主要集中于肝、脾等网状内皮系统丰富的组织。"},
    {type:"最佳选择题",q:"37. 下列关于微囊的说法，错误的是",opts:["A.微囊可通过包裹技术提高易氧化药物(如β-胡萝卜素)的稳定性，减少光、氧的影响","B.液态药物(如挥发油)制成微囊后可实现固态化，便于制剂的生产和储存","C.微囊的释药速率与囊壁厚度成反比","D.微囊的释药速率与药物在囊材中的溶解度成反比","E.阿司匹林与氯苯那敏分别包囊后可避免降解，体现微囊减少药物配伍变化的特点"],ans:"D",exp:"囊材相同时，药物在介质中的溶解度愈小，释放愈慢，故微囊的释药速率与药物在囊材中的溶解度成正比。囊材相同时，囊壁越厚释药越慢。"},
    {type:"最佳选择题",q:"38. 下列关于软膏剂、乳膏剂与糊剂的说法，正确的是",opts:["A.混悬型糊剂的固体成分需预先粉碎成最细粉","B.乳膏剂油相基质中添加的吐温80可作为O/W型乳化剂，同时改善药物的透皮吸收","C.制备W/O型乳膏剂时，可选用十二烷基硫酸钠作为乳化剂以稳定油包水体系","D.用于寻常型痤疮治疗的乳膏剂必须满足无菌要求，且不得添加透皮促进剂","E.乳膏剂中添加的甘油仅作为防腐剂使用，不能起到保湿作用"],ans:"B",exp:"吐温80(聚山梨酯80)属于O/W型乳化剂。混悬型糊剂的固体成分需预先粉碎成细粉。十二烷基硫酸钠属于O/W型乳化剂，不能稳定油包水体系。寻常型痤疮不属于烧伤或创面，无需要求无菌。甘油在乳膏剂中主要作为保湿剂。"},
    {type:"最佳选择题",q:"39. 质量要求中不需要进行微生物限度检查的制剂是",opts:["A.眼用制剂","B.软膏剂","C.贴剂","D.栓剂","E.灌肠剂"],ans:"A",exp:"眼用制剂是指直接用于眼部发挥治疗作用的无菌制剂，无菌制剂需进行无菌检查而非微生物限度检查。"},
    {type:"最佳选择题",q:"40. 下列关于吸入制剂的说法，正确的是",opts:["A.吸入粉雾剂必须使用抛射剂作为动力，以确保药物雾化至肺部","B.吸入气雾剂的抛射剂必须使用氟氟烷烃类(如氟利昂)，以保证雾化效果","C.吸入喷雾剂的雾粒粒径应全部小于5μm，以实现肺部的有效沉积","D.吸入液体制剂使用前其pH值应调节至3~10，以适应呼吸道生理环境","E.可转变成蒸气的制剂需添加乙醇作为溶液剂，以提高药物的挥发性"],ans:"D",exp:"吸入液体制剂使用前其pH值应在3~10范围内。吸入粉雾剂通过患者主动吸入或装置产生的气流分散药物，无需抛射剂。氢氟烷烃类是目前最有应用前景的吸入气雾剂的抛射剂，氯氟烷烃类(如氟利昂)现已不用。吸入制剂中原料药物粒度大小通常应控制在10μm以下，其中大多数应在5μm以下。可转变成蒸气的制剂通过热量使药物汽化，无需添加乙醇作为潜溶剂。"},

    // ===== 二、配伍选择题（41-90） =====
    {type:"配伍选择题",subs:[
      {q:"41. 第3类残留溶剂为低潜在毒性的溶剂，药品生产中可正常使用，其残留量也无需严格控制，限量与干燥失重相当，均为",opts:["A.0.001%","B.0.1%","C.0.5%","D.1%","E.5%"],ans:"C",exp:"残留溶剂分为三类，1类为具有不可接受的毒性或对环境造成危害的溶剂，在药品生产中应避免使用；第2类为高毒性溶剂，在药物制剂的生产中应限制其使用，在制剂中的残留量限度约为0.001%；第3类为低潜在毒性的溶剂，残留量限度为0.5%。"},
      {q:"42. 炽灼残渣检查法是检查药品中能与硫酸生成硫酸盐的无机杂质，通常与硫酸在700~800℃炽灼至恒重后，称量其遗留的残渣量，限量通常为",opts:["A.0.001%","B.0.1%","C.0.5%","D.1%","E.5%"],ans:"B",exp:"炽灼残渣限量通常为0.1%。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"43. 被动防御模式的质量管理模式是",opts:["A.质量保证模式","B.质量研究模式","C.质量控制模式","D.全面质量管理模式","E.质量分析模式"],ans:"C",exp:"质量控制模式是质量管理部门通过对生产的过程监控和产品的抽样检验，发现异常检验结果（OOS）或过程出现偏差后，通过调查原因，制定、实施并跟踪纠正预防措施（CAPA），以保证产品质量的稳定，这种质量管理的初级模式是被动防御模式。"},
      {q:"44. 为主动管理模式，企业更加注重预防而非纠正的质量管理模式是",opts:["A.质量保证模式","B.质量研究模式","C.质量控制模式","D.全面质量管理模式","E.质量分析模式"],ans:"A",exp:"质量保证模式也称统计质量控制模式，是企业管理的发展阶段，质量管理的目标是减少质量问题发生的可能性，主要通过建立质量保证体系来预防质量问题的发生。在这个阶段，企业开始转变为主动管理模式，注重预防而非纠正。"},
      {q:"45. 以质量为中心，强调全员参与、全过程控制和全面改进的管理方式和理念，为企业管理发展的高级阶段的质量管理模式是",opts:["A.质量保证模式","B.质量研究模式","C.质量控制模式","D.全面质量管理模式","E.质量分析模式"],ans:"D",exp:"全面质量管理模式是企业管理发展的高级阶段，是以质量为中心，强调全员参与、全过程控制和全面改进的管理方式和理念。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"46. 作为细菌的运动器官，可帮助细菌向营养物质处移动，逃离有害环境的是",opts:["A.细胞壁","B.菌毛","C.鞭毛","D.细胞膜","E.芽孢"],ans:"C",exp:"鞭毛是细菌的运动器官，可帮助细菌向营养物质处移动，逃离有害环境。"},
      {q:"47. 参与细菌的呼吸过程、细菌结构成分的生物合成，以及细菌细胞分裂的是",opts:["A.细胞壁","B.菌毛","C.鞭毛","D.细胞膜","E.芽孢"],ans:"D",exp:"细胞膜参与菌体内外物质交换、参与细菌的呼吸过程、参与细菌结构成分的生物合成，以及细菌细胞分裂。"}
    ]},
    {type:"配伍选择题",subs:[
