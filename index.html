    * {

    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #e8f5e0;
      color: #2c3e50;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px;
      line-height: 1.8;

    h1 {

    .menu a {

      background: #f4fbf0;
      border-radius: 12px;
      padding: 20px 24px;
      text-decoration: none;
      color: #2c3e50;
      font-size: 19px;
      font-weight: 600;

      border: 1px solid #cce8cd;
      transition: background 0.2s, transform 0.1s;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .menu a:hover {
      background: #d8f0da;
      border-color: #8cc98f;
    }
    .menu a:active {
      transform: scale(0.99);
    }
    .menu a .arrow {
      color: #8cc98f;
      font-size: 22px;
      font-weight: 400;
    }
    .footer {
