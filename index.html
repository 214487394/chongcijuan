ze:16px;border-radius:8px;border:1px solid #b8e0b3;background:#fbfef9}.quiz-nav{position:fixed;bottom:0;left:0;right:0;background:#f4fbf0;padding:12px 16px;box-shadow:0 -2px 10px rgba(0,0,0,.06);display:flex;gap:10px;align-items:center;justify-content:space-between;z-index:100;max-width:860px;margin:0 auto}.next-btn{padding:14px 24px;background:#8cc98f;color:#fff;border:none;border-radius:8px;font-size:16px;cursor:pointer;flex:1}.next-btn:hover{background:#76b579}.next-btn:disabled{background:#cce8cd;cursor:not-allowed}.progress-text{font-size:15px;color:#5a6b5c;white-space:nowrap}@media(max-width:600px){body{padding:10px;padding-bottom:90px;font-size:16px}.card{padding:14px}.q-title{font-size:17px;line-height:1.85}.option{padding:14px;font-size:16px}.nav-bar{display:none}}{body{padding:8px;padding-bottom:90px}.card{padding:12px}.q-title{font-size:15px}.option{padding:12px;font-size:15px}.nav-bar{display:none}}html,body{overflow-x:hidden;touch-action:pan-y}

var chapters=[
 {
  name: "押题密卷（一）",
  questions: [
    // ===== 一、最佳选择题（1-40） =====
    {type:"最佳选择题",q:"化学药具有明确的化学结构和药理作用机制，以下不属于化学药的是",opts:["A.从天然产物中提取得到的有效单体化合物","B.通过发酵方式得到的抗生素","C.半合成方式得到的天然产物","D.半合成抗生素","E.利用细胞制备而成的物质"],ans:"E",exp:"利用细胞制备而成的物质属于生物制品，不属于化学药。"},
    {type:"最佳选择题",q:"关于药品的商品名称的说法，错误的是",opts:["A.由制药企业自己进行选择","B.与商标一样，可以申请专利保护","C.是药学研究人员和医务人员常用的共同名称","D.同一药物可以有多个不同的商品名称","E.“络活喜”为药品的商品名称"],ans:"C",exp:"药品通用名是药学研究人员和医务人员使用的共同名称，商品名不是。"},
    {type:"最佳选择题",q:"药用辅料是指生产药品和调配处方时所用的赋形剂和附加剂。以下不属于药用辅料的功能的是",opts:["A.可提高药物的稳定性","B.可降低药物生产的费用成本","C.可提高患者用药的顺应性","D.可降低药物的不良反应","E.可使药物在不同部位释放"],ans:"B",exp:"加入辅料会产生费用成本，不能降低生产成本。"},
    {type:"最佳选择题",q:"属于药品包装材料、容器的生物安全检查项目的是",opts:["A.密封性","B.水蒸气透过量","C.滴出量","D.微生物限度","E.抗拉强度"],ans:"D",exp:"微生物限度属于生物安全检查项目。"},
    {type:"最佳选择题",q:"药物制剂的稳定性变化一般包括化学、物理、生物学三个方面。以下不属于化学方面稳定性变化的是",opts:["A.水解沉淀","B.氧化变色","C.异构化反应","D.片剂崩解迟缓","E.光解反应"],ans:"D",exp:"片剂崩解迟缓属于物理方面稳定性变化。"},
    {type:"最佳选择题",q:"以下操作中，不能提高药物稳定性的是",opts:["A.将头孢菌素类抗生素制备为注射用无菌粉针剂","B.将异丙嗪制成β-环糊精包合物","C.对湿热不稳定的药物采用干法制粒压片工艺","D.制备药物的操作过程中尽量使用金属器皿","E.维生素C用微晶纤维素和乳糖直接压片并包衣"],ans:"D",exp:"金属离子能催化氧化反应，操作过程应避免使用金属器皿。"},
    {type:"最佳选择题",q:"具有高灵敏度、高选择性、高效能的特点，是分析混合物最有效的方法是",opts:["A.紫外-可见分光光度法","B.高效液相色谱法","C.红外分光光度法","D.荧光分光光度法","E.化学鉴别法"],ans:"B",exp:"高效液相色谱法属于色谱法，是分析混合物的最有效手段。"},
    {type:"最佳选择题",q:"关于药物含量或效价测定的说法，错误的是",opts:["A.对于化学原料药，其含量限度通常用有效成分所占的重量百分数表示","B.用《中国药典》规定的分析方法测定药物含量时，数值可能达到100%以上","C.炔诺酮的含量限度为97.0%~102.0%，是指炔诺酮的真实含量达到102.0%","D.当含量限度未规定上限时，是指不超过101.0%","E.对于药物制剂，含量限度用API含量占标示量的百分率表示"],ans:"C",exp:"102.0%是方法允许偏差，并非真实含量。"},
    {type:"最佳选择题",q:"以下不属于原料药稳定性重点考察项目的是",opts:["A.性状","B.熔点","C.含量","D.吸湿性","E.崩解时限"],ans:"E",exp:"崩解时限是片剂或胶囊剂的稳定性重点考察项目。"},
    {type:"最佳选择题",q:"药品监督管理部门根据监管需要对质量可疑药品进行的抽查检验是",opts:["A.评价抽检","B.标准复核","C.指定检验","D.放行检验","E.监督抽检"],ans:"E",exp:"监督抽检是对质量可疑药品进行的抽查检验。"},
    {type:"最佳选择题",q:"细胞是构成人体最基本的结构和功能单位，细胞器位于",opts:["A.细胞膜上","B.细胞质中","C.细胞核内","D.膜蛋白内","E.细胞壁上"],ans:"B",exp:"细胞器位于细胞质中。"},
    {type:"最佳选择题",q:"糖、脂肪、氨基酸为能源物质，它们在体内分解代谢的共同产物是",opts:["A.脂肪酸","B.乙酰CoA","C.胆固醇","D.CO2和H2O","E.乳糖"],ans:"B",exp:"三大营养物质分解代谢最终都产生乙酰CoA，进入柠檬酸循环。"},
    {type:"最佳选择题",q:"原核细胞型微生物无核膜、核仁，细胞器很不完善，只有核糖体。以下不属于原核细胞型微生物的是",opts:["A.细菌","B.支原体","C.立克次体","D.真菌","E.螺旋体"],ans:"D",exp:"真菌属于真核细胞型微生物。"},
    {type:"最佳选择题",q:"对不良环境有极强抗性的细菌特殊结构是",opts:["A.细胞壁","B.荚膜","C.鞭毛","D.菌毛","E.芽孢"],ans:"E",exp:"芽孢是细菌对不良环境有极强抗性的休眠体。"},
    {type:"最佳选择题",q:"引发肾功能不全的病因不包括",opts:["A.肾血流量减少","B.肾小球滤过膜通透性改变","C.肾小球有效滤过压降低","D.肾小球滤过面积增大","E.近曲小管功能障碍"],ans:"D",exp:"肾小球滤过面积减少可导致肾功能不全，增大不是病因。"},
    {type:"最佳选择题",q:"吲哚美辛肠溶片的处方组成中，包衣材料为",opts:["A.硬脂酸镁","B.十二烷基硫酸钠","C.邻苯二甲酸酯","D.丙烯酸Ⅱ号树脂","E.乙烯-醋酸乙烯共聚物"],ans:"D",exp:"丙烯酸Ⅱ号树脂为肠溶衣材料。"},
    {type:"最佳选择题",q:"崩解剂是指促使片剂在胃药液中迅速破裂成细小颗粒的辅料，以下不能作为崩解剂的是",opts:["A.干淀粉","B.低取代羟丙基纤维素","C.交联羧甲基纤维素钠","D.交联聚维酮","E.甲基纤维素"],ans:"E",exp:"甲基纤维素主要作为黏合剂和包衣材料。"},
    {type:"最佳选择题",q:"小分子物质在流体静压的作用下通过亲水膜孔蛋白进行跨膜转运，又称水溶性扩散的方式是",opts:["A.单纯扩散","B.滤过","C.主动转运","D.易化扩散","E.膜动转运"],ans:"B",exp:"滤过又称水溶性扩散。"},
    {type:"最佳选择题",q:"血浆蛋白结合率会影响药物在体内的分布，以下关于血浆蛋白结合率的说法，错误的是",opts:["A.血浆蛋白结合率指血浆中结合药物浓度占总药物浓度的百分数","B.药物与血浆蛋白结合主要借助共价键","C.游离药物与结合药物在体内呈动态平衡","D.结合型药物不能透入脑脊液","E.药物与血浆蛋白结合会影响其肾小球滤过率"],ans:"B",exp:"药物与血浆蛋白结合主要借助范德瓦耳斯力、氢键或离子键，不是共价键。"},
    {type:"最佳选择题",q:"因苯环上有多个吸电子基，导致无苯环氧化代谢产物的药物是",opts:["A.普萘洛尔","B.氯丙嗪","C.丙磺舒","D.保泰松","E.苯妥英"],ans:"C",exp:"丙磺舒苯环上有多个吸电子取代基，苯环不被氧化。"},
    {type:"最佳选择题",q:"属于胺类药物水解代谢反应的是",opts:["A.硝基还原反应","B.环氧化物水解","C.酰胺水解","D.葡萄糖醛酸结合","E.芳环羟基化"],ans:"D",exp:"局部麻醉药丙胺卡因在体内酰胺键水解，生成邻甲苯胺，故属于酰胺类药物水解代谢。"},
    {type:"最佳选择题",q:"酶抑制作用是指某些化学物质能抑制肝微粒体药物代谢酶的活性，减慢其他药物的代谢速率。以下药物具有肝药酶抑制作用的是",opts:["A.苯妥英钠","B.氟伏沙明","C.利福平","D.苯巴比妥","E.卡马西平"],ans:"B",exp:"氟伏沙明对CYP1A2、CYP2C19具有抑制作用，其余为肝药酶诱导剂。"},
    {type:"最佳选择题",q:"静脉注射某一单室模型药物，体内药物剩余分数为10%时所经历的半衰期个数为",opts:["A.1","B.2","C.3.32","D.4","E.6.64"],ans:"C",exp:"药物剩余10%表明代谢了90%，需要3.32个半衰期。"},
    {type:"最佳选择题",q:"某药物的表观分布容积约为6.9L。关于该药物在体内的分布情况，说法正确的是",opts:["A.药物主要分布在脂肪组织中","B.药物主要分布在细胞内","C.药物主要分布在血浆中","D.药物的血浆蛋白结合率低","E.药物主要蓄积在器官中"],ans:"C",exp:"表观分布容积很小，说明主要分布在血浆中。"},
    {type:"最佳选择题",q:"对于生物等效性及其研究方法，说法错误的是",opts:["A.筛选受试者时的排除标准应主要基于安全性方面考虑","B.生物等效性研究方法按照评价效力，优先顺序为药动学研究、药效学研究、临床研究和体外研究","C.多次给药时，试验给药之间应有1倍半衰期以上的清洗期","D.如果给药前血药浓度大于Cmax的5%，则该受试者数据不应纳入等效性评价","E.对于口服常释制剂，通常需进行空腹和餐后生物等效性研究"],ans:"C",exp:"清洗期一般为待测物7倍半衰期以上，不是1倍。"},
    {type:"最佳选择题",q:"某药物在体内不需要代谢，直接经肾脏排泄，临床常规剂量为每天60mg。已知肾功能正常时肌酐清除率为120ml/min，某患者为40ml/min，该患者服用此药时每天给药剂量为",opts:["A.180mg","B.30mg","C.20mg","D.60mg","E.120mg"],ans:"C",exp:"剂量调整公式：40/120×60=20mg。"},
    {type:"最佳选择题",q:"拟胆碱药氯贝胆碱与乙酰胆碱M受体结合，用于手术腹胀气、尿潴留。其作用机制是",opts:["A.与M受体以共价键结合，产生激动作用","B.与M受体以离子键结合，产生激动作用","C.与M受体以氢键结合，产生激动作用","D.与M受体以离子-偶极作用结合，产生激动作用","E.与M受体以范德瓦耳斯力作用结合，产生激动作用"],ans:"B",exp:"氯贝胆碱与M受体以离子键结合产生激动作用。"},
    {type:"最佳选择题",q:"药物可通过非靶标机制发挥作用，以下不属于药物的非靶标作用机制的是",opts:["A.糖尿病患者补充胰岛素","B.注射甘露醇产生利尿作用","C.环孢素用于器官移植的排斥反应","D.磺胺类药物通过抑制敏感细菌体内叶酸的代谢产生抗菌作用","E.氢氯噻嗪抑制肾小管Na+-Cl-转运体发挥利尿作用"],ans:"D",exp:"磺胺类药物通过抑制叶酸代谢属于靶标机制。"},
    {type:"最佳选择题",q:"各种利尿剂的效价强度和最大效应的比较如图所示，以下说法错误的是",opts:["A.呋塞米的效能最大","B.环戊噻嗪的效价强度最大","C.环戊噻嗪的效价强度约为氢氯噻嗪的30倍","D.氯噻嗪的效价强度最小","E.增加环戊噻嗪的用量可使其达到呋塞米的效能"],ans:"E",exp:"无论剂量如何增加，环戊噻嗪都不能达到呋塞米的效能。"},
    {type:"最佳选择题",q:"约50%亚洲人饮酒后出现面部潮红、心率加快、出汗等不良反应，其原因是",opts:["A.CYP2C19缺乏","B.乙醇脱氢酶缺乏","C.受体活性降低","D.乙醛脱氢酶缺乏","E.N-乙酰基转移酶缺乏"],ans:"D",exp:"乙醛脱氢酶缺乏导致乙醛蓄积，出现不良反应。"},
    {type:"最佳选择题",q:"根据内源性糖皮质激素分泌功能的昼夜节律，短效激素可的松和氢化可的松的最佳给药方式是",opts:["A.每日晚上19:00一次服用全天剂量","B.每日清晨7-8时一次服用全天剂量","C.隔日清晨7-8时一次服用全天剂量","D.日低夜高给药剂量","E.晚间临睡前一次服用全天剂量"],ans:"B",exp:"短效激素在每日清晨7-8时一次服用，与内源性分泌节律重合。"},
    {type:"最佳选择题",q:"药物的光敏反应与药物的化学结构有关，不同化学结构的药物对光波长的敏感程度不同。最常见引起光敏反应的抗菌药物是",opts:["A.青霉素类","B.四环素类","C.大环内酯类","D.β-内酰胺类","E.磺胺类"],ans:"B",exp:"四环素类药物是最常见的引起光敏反应的抗菌药物。"},

    {type:"最佳选择题",q:"下列药物引起的毒性反应中，不属于神经系统毒性的是",opts:["A.氨基糖苷类抗生素导致前庭和耳蜗毒性","B.长春新碱引起的骨髓抑制","C.长春新碱抑制微管合成，导致周围神经病","D.苯妥英钠导致癫痫发作","E.胺碘酮导致髓鞘损害"],ans:"B",exp:"长春新碱引起的骨髓抑制属于血液系统毒性。"},

    {type:"最佳选择题",q:"苯二氮䓬类药物具有生物利用度高，作用时间长的特点，是由于",opts:["A.1,2位酰胺键在酸性条件下水解开环，在碱性条件下重新环合","B.3位羟基引入活性提高，半衰期延长","C.䓬环脂溶性大，提高药物稳定性","D.4,5位亚胺键在酸性条件下水解开环，在碱性条件下重新环合","E.三氮唑环脂溶性大，提高药物稳定性"],ans:"D",exp:"4,5位亚胺键开环反应可逆，碱性条件下重新环合，故生物利用度高，作用时间长。"},
    {type:"最佳选择题",q:"关于艾司佐匹克隆的作用特点，说法错误的是",opts:["A.是佐匹克隆的S-(+)-异构体","B.具有良好的短效催眠作用","C.左旋体会产生毒副作用","D.连续多次使用会产生蓄积作用","E.口服吸收迅速，Tmax为0.5~2小时"],ans:"D",exp:"艾司佐匹克隆代谢物无活性，连续多次给药无蓄积作用。"},
    {type:"最佳选择题",q:"关于醋酸可的松滴眼液处方分析，说法错误的是",opts:["A.羧甲基纤维素钠为助悬剂，配液前需精制","B.本处方可以加入适量阳离子型表面活性剂","C.硼酸作为pH与等渗调节剂","D.硝酸苯汞作为抑菌剂","E.注射用水为分散介质"],ans:"B",exp:"本滴眼液中不能加入阳离子型表面活性剂，因与羧甲基纤维素钠有配伍禁忌。"},
    {type:"最佳选择题",q:"可的松为糖皮质激素类药物，关于其结构特点与性质，说法错误的是",opts:["A.基本结构是含有Δ4-3,20-二酮和21-羟基、11位和17α位羟基孕甾烷","B.该类药物具有钠潴留的副作用，会导致水肿","C.本身以活性形式存在，无需经肝脏转化即发挥效应","D.为天然存在的糖皮质激素类药物","E.口服易吸收，Tmax约为1小时"],ans:"C",exp:"可的松本身无活性，必须先在肝内转化成氢化可的松才有效。"},

    // ===== 四、多项选择题（96-100） =====
    {type:"多项选择题",q:"遇光不稳定的药品需要在遮光条件下贮藏，以下需要遮光贮藏的药品有",opts:["A.苯磺酸氨氯地平片","B.硝苯地平片","C.盐酸异丙嗪片","D.维生素A软胶囊","E.异烟肼片"],ans:"ABCDE",exp:"以上药品均遇光不稳定，需要遮光贮藏。"},
    {type:"多项选择题",q:"不易透过血-脑屏障和胎盘屏障的药物类型有",opts:["A.脂溶性低","B.分子量大","C.解离度大","D.解离度小","E.脂溶性高"],ans:"ABC",exp:"脂溶性低、分子量大、解离度大的药物不易透过血-脑屏障和胎盘屏障。"},
    {type:"多项选择题",q:"药物与机体结合的部位就是药物作用的靶点，大多数药物通过靶标机制发挥作用。已知药物作用靶点包括",opts:["A.酶","B.受体","C.离子通道","D.角质层","E.淋巴液"],ans:"ABC",exp:"药物作用靶点包括酶、受体、离子通道、核酸、免疫系统、基因等。"},
    {type:"多项选择题",q:"含有苯胺、苯酚等结构的药物，如对乙酰氨基酚，在体内代谢后生成能与蛋白共价结合产物而引发特质性毒性。生成的毒性物质有",opts:["A.p-醌","B.o-醌","C.亚胺-醌","D.次甲基-醌","E.氢醌"],ans:"ABCDE",exp:"以上均为对乙酰氨基酚代谢产生的毒性物质。"},
    {type:"多项选择题",q:"胶囊剂对内容物有一定的要求，以下不能制成胶囊剂的药物有",opts:["A.稀乙醇溶液药物","B.含有醛类物质的药物","C.O/W型乳状液型药物","D.含有挥发性成分的药物","E.对酸不稳定的药物"],ans:"ABCD",exp:"对酸不稳定的药物可制成肠溶胶囊，不是不能制成胶囊剂。"}

];
var currentChapter=0,answered=0,correct=0;
function initChapterSelect(){var sel=document.getElementById('chapterSelect');sel.innerHTML='';for(var i=0;i<chapters.length;i++){var opt=document.createElement('option');opt.value=i;opt.textContent=chapters[i].name;sel.appendChild(opt);}}
function switchChapter(index){currentChapter=parseInt(index);answered=0;correct=0;renderChapter();document.getElementById('chapterSelect').value=currentChapter;}
function prevChapter(){if(currentChapter>0)switchChapter(currentChapter-1);}
function nextChapter(){if(currentChapter<chapters.length-1)switchChapter(currentChapter+1);}
function updateNavButtons(){document.getElementById('prevBtn').disabled=(currentChapter===0);document.getElementById('nextBtn').disabled=(currentChapter===chapters.length-1);}
var currentQuestionIndex=0;

function renderChapter(){
  var ch=chapters[currentChapter];
  document.getElementById('chapterTitle').textContent=ch.name;
  var flat=[];
  for(var i=0;i<ch.questions.length;i++){
    var item=ch.questions[i];
    if(item.subs){
      for(var j=0;j<item.subs.length;j++){
        flat.push({type:'配伍选择题',q:item.subs[j].q,opts:item.subs[j].opts,ans:item.subs[j].ans});
      }
    }else{
      flat.push(item);
    }
  }
  ch._flat=flat;
  currentQuestionIndex=0;
  answered=0;
  correct=0;
  renderOneQuestion();
  updateNavButtons();
}

function renderOneQuestion(){
  var ch=chapters[currentChapter];
  var flat=ch._flat;
  var quiz=document.getElementById('quiz');
  quiz.innerHTML='';
  document.getElementById('stats').textContent='已答 '+answered+' / '+flat.length+' 题，正确 '+correct+' 题';
  var oldBar=document.getElementById('quiz-nav-bar');
  if(oldBar)oldBar.remove();
  if(currentQuestionIndex>=flat.length){
    quiz.innerHTML='<div class="card" style="text-align:center;padding:40px 20px;"><h2>🎉 本章已完成！</h2><p>共 '+flat.length+' 题，答对 '+correct+' 题</p></div>';
    showNextBar('chapter-end');
    return;
  }
  var item=flat[currentQuestionIndex];
  var card=document.createElement('div');
  card.className='card';
  var tag=document.createElement('div');
  tag.className='tag';
  tag.textContent=item.type+'  ·  第 '+(currentQuestionIndex+1)+' / '+flat.length+' 题';
  card.appendChild(tag);
  var title=document.createElement('div');
  title.className='q-title';
  title.textContent=item.q;
  card.appendChild(title);
  var ansArr=item.ans.split('');
  var isMulti=ansArr.length>1;
  var selected=[];
  var allButtons=[];
  for(var k=0;k<item.opts.length;k++){
    (function(opt){
      var btn=document.createElement('button');
      btn.className='option';
      btn.textContent=opt;
      var letter=opt.charAt(0);
      btn.onclick=function(){
        if(btn.classList.contains('disabled'))return;
        if(isMulti){
          var idx=selected.indexOf(letter);
          if(idx===-1){selected.push(letter);btn.style.background='#d0e3ff';btn.style.borderColor='#4a90e2';}
          else{selected.splice(idx,1);btn.style.background='';btn.style.borderColor='';}
        }else{judgeOne([letter]);}
      };
      allButtons.push(btn);
      card.appendChild(btn);
    })(item.opts[k]);
  }
  if(isMulti){
    var submitBtn=document.createElement('button');
    submitBtn.textContent='提交答案';
    submitBtn.style.cssText='margin-top:12px;padding:12px 20px;background:#4a90e2;color:#fff;border:none;border-radius:8px;font-size:15px;cursor:pointer;width:100%;';
    submitBtn.onclick=function(){
      if(selected.length===0){alert('请至少选择一个选项');return;}
      judgeOne(selected);
      submitBtn.disabled=true;
      submitBtn.style.background='#c5d5ea';
    };
    card.appendChild(submitBtn);
  }
  var expDiv=document.createElement('div');
  expDiv.className='explanation';
  expDiv.textContent=item.exp?'解析：'+item.exp:'';
  card.appendChild(expDiv);
  quiz.appendChild(card);

  function judgeOne(chosen){
    var isCorrect=false;
    if(isMulti){
      if(chosen.length===ansArr.length){
        var sc=chosen.slice().sort().join('');
        var sa=ansArr.slice().sort().join('');
        isCorrect=(sc===sa);
      }
    }else{
      isCorrect=ansArr.indexOf(chosen[0])!==-1;
    }
    for(var i=0;i<allButtons.length;i++){
      var b=allButtons[i];
      var letter=b.textContent.charAt(0);
      if(ansArr.indexOf(letter)!==-1)b.classList.add('correct');
      if(!isCorrect&&chosen.indexOf(letter)!==-1&&ansArr.indexOf(letter)===-1)b.classList.add('wrong');
      b.classList.add('disabled');
      b.style.background='';
      b.style.borderColor='';
    }
    if(isCorrect){
      correct++;
      answered++;
      expDiv.classList.add('show');
      document.getElementById('stats').textContent='已答 '+answered+' / '+flat.length+' 题，正确 '+correct+' 题';
      showNextBar(true);
      var countdown=3;
      var btn=document.querySelector('.quiz-nav .next-btn:last-child');
      var timer=setInterval(function(){
        countdown--;
        if(btn)btn.textContent='即将跳转… '+countdown;
        if(countdown<=0){clearInterval(timer);currentQuestionIndex++;renderOneQuestion();}
      },500);
    }else{
      answered++;
      document.getElementById('stats').textContent='已答 '+answered+' / '+flat.length+' 题，正确 '+correct+' 题';
      expDiv.classList.add('show');
      showNextBar(false);
    }
  }
}

function showNextBar(mode){
  var oldBar=document.getElementById('quiz-nav-bar');
  if(oldBar)oldBar.remove();
  var bar=document.createElement('div');
  bar.className='quiz-nav';
  bar.id='quiz-nav-bar';
  var flat=chapters[currentChapter]._flat;
  if(mode==='chapter-end'){
    var progress=document.createElement('div');
    progress.className='progress-text';
    progress.textContent='本章完成';
    bar.appendChild(progress);
    var prevBtn=document.createElement('button');
    prevBtn.className='next-btn';
    prevBtn.textContent='上一章';
    prevBtn.disabled=(currentChapter===0);
    prevBtn.onclick=function(){prevChapter();};
    bar.appendChild(prevBtn);
    var nextBtn=document.createElement('button');
    nextBtn.className='next-btn';
    nextBtn.textContent='下一章';
    nextBtn.disabled=(currentChapter===chapters.length-1);
    nextBtn.onclick=function(){nextChapter();};
    bar.appendChild(nextBtn);
    document.body.appendChild(bar);
    return;
  }
  var isLast=(currentQuestionIndex>=flat.length-1);
  if(isLast){
    var progress=document.createElement('div');
    progress.className='progress-text';
    progress.textContent='本章最后一题';
    bar.appendChild(progress);
    var prevBtn=document.createElement('button');
    prevBtn.className='next-btn';
    prevBtn.textContent='上一题';
    prevBtn.disabled=(currentQuestionIndex===0);
    prevBtn.onclick=function(){if(currentQuestionIndex>0){currentQuestionIndex--;renderOneQuestion();}};
    bar.appendChild(prevBtn);
    var nextChapterBtn=document.createElement('button');
    nextChapterBtn.className='next-btn';
    nextChapterBtn.textContent='下一章';
    nextChapterBtn.disabled=(currentChapter===chapters.length-1);
    nextChapterBtn.onclick=function(){nextChapter();};
    bar.appendChild(nextChapterBtn);
    document.body.appendChild(bar);
    return;
  }
  var autoNext=(mode===true);
  var progress=document.createElement('div');
  progress.className='progress-text';
  progress.textContent=(currentQuestionIndex+1)+' / '+flat.length;
  bar.appendChild(progress);
  var prevBtn=document.createElement('button');
  prevBtn.className='next-btn';
  prevBtn.textContent='上一题';
  prevBtn.disabled=(currentQuestionIndex===0);
  prevBtn.onclick=function(){if(currentQuestionIndex>0){currentQuestionIndex--;renderOneQuestion();}};
  bar.appendChild(prevBtn);
  var nextBtn=document.createElement('button');
  nextBtn.className='next-btn';
  nextBtn.textContent=autoNext?'即将跳转…':'下一题';
  nextBtn.disabled=autoNext;
  nextBtn.onclick=function(){currentQuestionIndex++;renderOneQuestion();};
  bar.appendChild(nextBtn);
  document.body.appendChild(bar);
}
// ===== 全局滑动手势：右划上一题，左划下一题 =====
(function () {
  var touchStartX = 0, touchStartY = 0, isHorizontal = false;
  document.addEventListener('touchstart', function (e) {
    var target = e.target;
    if (target.closest && target.closest('#quiz')) {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
      isHorizontal = false;
    } else {
      touchStartX = 0;
      touchStartY = 0;
      isHorizontal = false;
    }
  }, { passive: true });
  document.addEventListener('touchmove', function (e) {
    if (touchStartX === 0 && touchStartY === 0) return;
    var dx = e.touches[0].clientX - touchStartX;
    var dy = e.touches[0].clientY - touchStartY;
    if (!isHorizontal && Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy)) {
      isHorizontal = true;
    }
    if (isHorizontal) {
      e.preventDefault();
    }
  }, { passive: false });
  document.addEventListener('touchend', function (e) {
    if (touchStartX === 0 && touchStartY === 0) { isHorizontal = false; return; }
    var endX = e.changedTouches[0].clientX;
    var endY = e.changedTouches[0].clientY;
    var dx = endX - touchStartX;
    var dy = endY - touchStartY;
    if (Math.abs(dx) > 50 && Math.abs(dy) < 80) {
      var flat = chapters[currentChapter] && chapters[currentChapter]._flat;
      if (flat) {
        if (dx > 0) {
          if (currentQuestionIndex > 0) { currentQuestionIndex--; renderOneQuestion(); }
        } else {
          if (currentQuestionIndex < flat.length - 1) { currentQuestionIndex++; renderOneQuestion(); }
        }
      }
    }
    touchStartX = 0;
    touchStartY = 0;
    isHorizontal = false;
  }, { passive: true });
})();
// ===== 滑动手势结束 =====
window.scrollTo(0, 0);
document.documentElement.scrollLeft = 0;
document.body.scrollLeft = 0;
initChapterSelect();
switchChapter(0);
</script></body></html>
