      {q:"81. 作为首个上市的拟多肽类HIV蛋白酶抑制剂，通过竞争性抑制HIV-1蛋白酶活性阻断病毒蛋白前体裂解，且需与其他抗病毒药物联合使用的药物是",opts:["A.齐多夫定","B.奈韦拉平","C.沙奎那韦","D.泛昔洛韦","E.伐昔洛韦"],ans:"C",exp:"沙奎那韦属于拟多肽衍生物，是第一个上市用于治疗HIV感染的高效、高选择性的HIV蛋白酶抑制药，作用于HIV繁殖的后期，临床上与其他药物合用治疗严重的HIV感染。齐多夫定属于核苷类逆转录酶抑制药。奈韦拉平属于专一性HIV非核苷类逆转录酶抑制药。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"82. 含有PVPP与MCC的处方是",opts:["A.维生素C泡腾片","B.妇痛宁滴丸","C.盐酸二甲双胍缓释片","D.甲氧氯普胺口崩片","E.硝苯地平软胶囊"],ans:"D",exp:"在甲氧氯普胺口崩片的处方中以PVPP和MCC（微晶纤维素）作为崩解剂。"},
      {q:"83. 需添加甘油作为增塑剂以改善膜材柔韧性，同时发挥保湿功能的制剂是",opts:["A.维生素C泡腾片","B.妇痛宁滴丸","C.盐酸二甲双胍缓释片","D.甲氧氯普胺口崩片","E.硝苯地平软胶囊"],ans:"E",exp:"在硝苯地平软胶囊的处方中，主药不溶于植物油，因而采用PEG400作为分散介质。PEG400易吸湿，使胶丸壁硬化，故在囊材中加入甘油（增塑剂兼有保湿作用）。"},
      {q:"84. 以聚乙二醇和硬脂酸为基质，且在制备过程中需用到二甲基硅油的处方是",opts:["A.维生素C泡腾片","B.妇痛宁滴丸","C.盐酸二甲双胍缓释片","D.甲氧氯普胺口崩片","E.硝苯地平软胶囊"],ans:"B",exp:"妇痛宁滴丸处方中，当归油为主药，聚乙二醇和硬脂酸为基质，在制备过程中采用二甲基硅油作为冷凝剂。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"85. 在维生素C注射液的处方中，为避免注射时刺激性大引起的疼痛可加入",opts:["A.吐温80","B.碳酸氢钠","C.氯化钠","D.甘露醇","E.半胱氨酸"],ans:"B",exp:"在维生素C注射液加碳酸氢钠或碳酸钠，中和部分维生素C成钠盐，以避免疼痛。"},
      {q:"86. 在复方柴胡注射液处方中，为了增加挥发油在水中的溶解度添加的附加剂是",opts:["A.吐温80","B.碳酸氢钠","C.氯化钠","D.甘露醇","E.半胱氨酸"],ans:"A",exp:"在复方柴胡注射液处方中，吐温80是增溶剂，增加挥发油在水中的溶解度。氯化钠起到调节等渗的作用。"},
      {q:"87. 在注射用辅酶A(无菌冻干制剂)的处方中，作为抗氧剂的是",opts:["A.吐温80","B.碳酸氢钠","C.氯化钠","D.甘露醇","E.半胱氨酸"],ans:"E",exp:"在注射用辅酶A（无菌冻干制剂）的处方中，辅酶A易被空气、过氧化氢、碘、高锰酸盐等氧化成无活性的二硫化物，故在制剂中加入半胱氨酸等抗氧剂。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"88. 地塞米松涂剂的处方为地塞米松，二甲基亚砜，甘油，乙醇，纯化水。二甲基亚砜的作用是",opts:["A.增溶剂","B.增塑剂","C.保湿剂","D.吸收促进剂","E.润湿剂"],ans:"D",exp:"地塞米松涂剂的处方中地塞米松为主药，二甲基亚砜具有促进药物透皮吸收作用，甘油为保湿剂，乙醇和纯化水为溶剂。"},
      {q:"89. 痤疮涂膜剂的处方为沉降硫，硫酸锌，氯霉素，樟脑酯，甘油，PVA(05-88)，乙醇，纯化水。其中甘油的作用是",opts:["A.增溶剂","B.增塑剂","C.保湿剂","D.吸收促进剂","E.润湿剂"],ans:"B",exp:"痤疮涂膜剂处方中甘油为增塑剂，PVA为成膜材料，乙醇和纯化水为溶剂。"},
      {q:"90. 醋酸可的松滴眼液处方为醋酸可的松(微晶)，吐温80，硝酸苯汞，硼酸，羧甲基纤维素钠，注射用水。其中吐温80的作用是",opts:["A.增溶剂","B.增塑剂","C.保湿剂","D.吸收促进剂","E.润湿剂"],ans:"E",exp:"醋酸可的松滴眼液为混悬液型滴眼液，处方中吐温80为润湿剂、硝酸苯汞为抑菌剂、羧甲基纤维素钠为助悬剂。"}
    ]},

    // ===== 三、综合分析选择题（91-95） =====
    {type:"最佳选择题",q:"91. 该患者用药方案中，属于磺酰脲类促胰岛素分泌药的制剂是",opts:["A.二甲双胍缓释片","B.阿卡波糖片","C.格列齐特缓释胶囊","D.门冬胰岛素注射液","E.二甲双胍肠溶片"],ans:"C",exp:"格列齐特属于磺酰脲类促胰岛素分泌药。二甲双胍缓释片和肠溶片为双胍类，阿卡波糖为α-葡萄糖苷酶抑制剂，门冬胰岛素为速效胰岛素。"},
    {type:"最佳选择题",q:"92. 关于二甲双胍肠溶片的剂型特点，下列说法正确的是",opts:["A.肠溶包衣可避免药物在胃内降解，减少胃肠道刺激","B.需咀嚼后吞服以加快药物释放","C.释药部位主要在胃内，吸收速度快于普通片","D.与缓释片相比，生物利用度降低50%以上","E.包衣材料为聚乙烯醇(PVA)"],ans:"A",exp:"肠溶片的包衣材料(如丙烯酸树脂)可抵抗胃酸破坏，使药物在肠道释放，减少胃内刺激，符合二甲双胍肠溶片的临床应用需求。"},
    {type:"最佳选择题",q:"93. 格列齐特缓释胶囊常用的缓释骨架材料是",opts:["A.羟丙基甲基纤维素(HPMC)","B.醋酸纤维素酞酸酯(CAP)","C.交联聚维酮(PVPP)","D.微粉硅胶","E.十二烷基硫酸钠(SDS)"],ans:"A",exp:"格列齐特缓释胶囊的缓释骨架材料常用羟丙基甲基纤维素(HPMC)，属于亲水性凝胶骨架材料，通过吸水膨胀形成缓释屏障。醋酸纤维素酞酸酯为肠溶性包衣材料；交联聚维酮为崩解剂；微粉硅胶为助流剂；十二烷基硫酸钠为表面活性剂。"},
    {type:"最佳选择题",q:"94. 该药物的生物半衰期t1/2约为",opts:["A.1.5小时","B.2.0小时","C.2.2小时","D.2.5小时","E.3.0小时"],ans:"C",exp:"从方程求消除速率常数k：lgC=-0.1355t+2.176，斜率=-0.1355。根据单室模型静脉注射公式lgC=-k/2.303 t+lgC0，斜率=-k/2.303，因此k=0.1355×2.303≈0.312h^-1。计算半衰期t1/2=0.693/k=0.693÷0.312≈2.22h。"},
    {type:"最佳选择题",q:"95. 关于该药物的绝对生物利用度(F)，下列说法正确的是",opts:["A.可通过口服给药的Tmax与静脉注射的Tmax比值计算","B.反映药物在胃肠道内的代谢稳定性","C.需以静脉注射制剂为参比制剂，比较吸收进入体循环的相对量","D.分布容积(V)反映组织蓄积，与生物利用度无直接关联","E.描述的是相对生物利用度(以其他非静脉制剂为参比)"],ans:"C",exp:"绝对生物利用度定义为以静脉制剂为参比制剂，评估非血管给药途径(如口服)吸收进入体循环的相对量。生物利用度需比较AUC(吸收程度)，不是Tmax。生物利用度反映全身暴露量，与胃肠道代谢稳定性无直接定量关系。分布容积(V)反映组织蓄积，与生物利用度无直接关联。E选项描述的是相对生物利用度。"},

    // ===== 四、多项选择题（96-100） =====
    {type:"多项选择题",q:"96. 关于《中国药典》中药物含量或效价测定方法的描述，正确的是",opts:["A.含量测定方法主要有化学分析法和仪器分析法","B.效价测定方法主要用生物活性测定法","C.色谱分析法因具有灵敏度高、专属性强的特点，适用于组分复杂、含量限度较宽的药物制剂的分析","D.高效液相色谱法具有精密度高、准确性好的特点，是原料药含量测定的首选方法","E.除另有规定外，抗生素微生物检定法的可信限率不得大于5%"],ans:"ABCE",exp:"滴定分析法具有精密度高、准确性好的特点，是原料药含量测定的首选方法。色谱分析法因具有灵敏度高、专属性强的特点，适用于组分复杂、含量限度较宽的药物制剂的分析。其他选项均为正确描述。"},
    {type:"多项选择题",q:"97. 属于药物结构在体内发生第1相生物转化反应的有",opts:["A.","B.","C.","D.","E."],optImgs:["y16-q97-A.png","y16-q97-B.png","y16-q97-C.png","y16-q97-D.png","y16-q97-E.png"],ans:"BCE",exp:"观察代谢反应式，A选项前后反应式将-OH转变为-OCH3，发生的是甲基化的结合反应，属于II相生物转化。B选项前后结构中硫醚转变为亚砜，是氧化反应，属于I相生物转化。C选项氨基上的H去掉一个，加一个-OH，发生氧化代谢，属于I相生物转化。D选项前后结构的转变为结合了一个硫酸基，为与硫酸的结合反应，属于II相生物转化。E选项己烯雌酚的双键烯烃，转变为己烯雌酚环氧化物，发生了烯烃的氧化，属于I相生物转化。"},
    {type:"多项选择题",q:"98. 盐酸麻黄碱...关于其结构特点和临床应用的说法，正确的是",img:"y16-q98.png",opts:["A.分子中含有1个手性碳原子，共有2个光学异构体","B.赤藓糖型为麻黄碱，苏阿糖型为伪麻黄碱","C.分子中含有邻二酚羟基，口服易被肠道吸收","D.麻黄碱是多种毒品的合成中间体，被列为“易制毒品”","E.临床上使用的伪麻黄碱作鼻充血减轻剂"],ans:"BDE",exp:"盐酸麻黄碱分子中含有2个手性碳原子，共有4个光学异构体；一对为赤藓糖型对映异构体，称为麻黄碱，另一对为苏阿糖型，称为伪麻黄碱；麻黄碱虽口服易被肠道吸收，但分子中不含邻二酚羟基结构；麻黄碱为二类精神药品，同时又是多种毒品的合成中间体，因此被列为“易制毒品”；伪麻黄碱广泛用作鼻充血减轻剂，也是很多复方感冒药的主要成分。"},
    {type:"多项选择题",q:"99. 同一电解质因用量不同可在混悬剂中起絮凝或反絮凝作用，以下可作为絮凝剂或反絮凝剂的有",opts:["A.酒石酸氢盐","B.硬脂酸镁","C.磷酸盐","D.三氯化铝","E.聚维酮（PVP）"],ans:"ACD",exp:"枸橼酸盐、枸橼酸氢盐、酒石酸氢盐、磷酸盐和一些氯化物(如三氯化铝)等，既可作絮凝剂亦可作反絮凝剂。通常阴离子的絮凝作用大于阳离子，离子的价数越高，絮凝、反絮凝作用越强。硬脂酸镁属于润滑剂，主要用于固体制剂。聚维酮(PVP)属于高分子助悬剂，主要用于增加混悬剂黏度。"},
    {type:"多项选择题",q:"100. 下列关于贴剂的说法，正确的有",opts:["A.贴剂的背衬层常用铝塑复合膜材料","B.药物贮库层需将药物制成过饱和混悬液以控制释放速率","C.控释膜的渗透性和厚度是影响药物释放速率的关键因素","D.胶黏膜必须使用天然树脂作为黏合剂，不可采用合成材料","E.保护层多为防粘纸或塑料膜，需允许水分透过以保持皮肤湿润"],ans:"ABC",exp:"胶黏膜可以是天然树胶，也可以用合成树脂。保护层是一种可剥离衬垫膜，起防粘和保护制剂的作用，通常为防粘纸、塑料或金属材料，当除去时，应不会引起贮库及粘贴层等的剥离。贴剂的保护层，活性成分不能透过，通常水也不能透过。"}
  ]
},
{
  name: "押题密卷（七）",
  questions: [
    // ===== 一、最佳选择题（1-40） =====
    {type:"最佳选择题",q:"1. 关于药品名称，说法正确的是",opts:["A.药品的商品名称是新药开发者向世界卫生组织提出的名称","B.一个药物只有一个商品名称","C.制剂名称为“商品名称+通用名称”","D.药品的商品名称是药典中使用的名称","E.药品的商品名称通常针对的是药物的最终产品"],ans:"E",exp:"药品的商品名称通常是针对药物的最终产品，由制药企业自己进行选择。药品的通用名称是新药开发者向世界卫生组织提出的名称；一个药物只有一个药品的通用名称；制剂名称为“原料药名称+剂型名称”；药品的通用名称是药典中使用的名称。"},
    {type:"最佳选择题",q:"2. 磺胺嘧啶的基本结构骨架为",img:"y17-q2.png",opts:["A.苯乙醇胺","B.芳氧丙醇胺","C.苯磺酰脲","D.对氨基苯磺酰胺","E.芳基丙酸"],ans:"D",exp:"由化学结构可知，磺胺嘧啶的基本结构骨架为对氨基苯磺酰胺。"},
    {type:"最佳选择题",q:"3. 影响药物制剂稳定性的非处方因素不包括",opts:["A.温度","B.金属离子","C.离子强度","D.湿度","E.氧气"],ans:"C",exp:"非处方因素为外界因素，如温度、金属离子、湿度和空气等，离子强度为处方因素。"},
    {type:"最佳选择题",q:"4. 用高效液相色谱法测定药物含量时，特性量值一般按纯度（%）计的标准物质是",opts:["A.标准品","B.对照品","C.对照药材","D.对照提取物","E.参考品"],ans:"B",exp:"对照品是指采用理化方法进行鉴别、检查或含量测定时所用的标准物质，其特性量值一般按纯度（%）计。"},
    {type:"最佳选择题",q:"5. 关于药品稳定性试验的说法，有误的是",opts:["A.考察原料药物或药物制剂在温度、湿度、光线的影响下随时间变化的规律","B.可通过试验建立药品的有效期","C.影响因素试验适用于考察药物与药物、药物与辅料、药物与其直接接触的包装容器间的相容性试验","D.加速试验中溶液剂、混悬剂、注射液等含有水性介质的制剂可不要求相对湿度","E.对拟冷冻贮藏的药品，长期试验可在温度-5℃±5℃的条件下至少放置12个月"],ans:"E",exp:"对拟冷冻贮藏的药品，长期试验可在温度-20℃±5℃的条件下至少放置12个月。"},
    {type:"最佳选择题",q:"6. 钠泵的生电作用是指",opts:["A.每分解一分子ATP可使3个Na+移出胞外，2个K+移入胞内，使膜内电位的负值增大的过程","B.每分解一分子ATP可使2个Na+移出胞外，2个K+移入胞内，使膜内电位的正值增大的过程","C.每分解一分子ATP可使2个Na+和2个K+同时移入胞内，使膜内电位的正值增大的过程","D.每分解一分子ATP可使2个Na+和3个K+移出胞外，使膜内电位的负值增大的过程","E.每分解一分子ATP可使细胞膜内外的Na+和K+的数量相等"],ans:"A",exp:"每分解一分子ATP可使3个Na+移出胞外，2个K+移入胞内，有一个净正电荷移至膜外，结果使膜内电位的负值增大，这个过程称为钠泵的生电作用。"},
    {type:"最佳选择题",q:"7. 细菌产生外毒素和内毒素两类毒素，在细菌致病作用中最为重要。关于细菌毒素说法正确的是",opts:["A.内毒素是革兰阳性菌细胞壁的脂多糖","B.内毒素是对热敏感的蛋白质","C.外毒素毒性强于内毒素","D.内毒素是由活菌合成并释放到菌体外","E.外毒素一般不具有免疫原性"],ans:"C",exp:"外毒素毒性强于内毒素。内毒素是革兰阴性菌细胞壁的脂多糖；外毒素是对热敏感的蛋白质，由活菌合成并释放到菌体外；外毒素一般具有很强的免疫原性。"},
    {type:"最佳选择题",q:"8. 不属于高钾血症形成原因的是",opts:["A.肾衰竭","B.碱中毒","C.高血糖合并胰岛素不足","D.缺氧时细胞ATP生成不足","E.组织分解如挤压综合征时"],ans:"B",exp:"高钾血症可能的原因包括：钾排出减少（如肾衰竭）、细胞内钾转移到细胞外（如酸中毒、高血糖合并胰岛素不足）、组织分解（如溶血、挤压综合征）、缺氧时细胞ATP生成不足等。碱中毒会导致低钾血症。"},
    {type:"最佳选择题",q:"9. 药物的化学结构对药物的吸收、转运都产生重要的影响，下列说法有误的是",opts:["A.药物吸收性和脂溶性呈近似于抛物线的变化规律","B.P值越大，则药物的脂溶性越高","C.化合物形成氢键的能力越高，意味着与水结合能力越差","D.药物分子的极性表面积通常可用作药物递膜性的评价指标","E.吸入性的全身麻醉药属于结构非特异性药物"],ans:"C",exp:"化合物形成氢键的能力越高，意味着与水结合能力越好，故水溶性增加。"},
    {type:"最佳选择题",q:"10. 若处方中无显著影响药物吸收的辅料，通常其口服制剂无生物利用度问题的药物是",opts:["A.卡马西平","B.阿替洛尔","C.氢氯噻嗪","D.去甲替林","E.苯妥英"],ans:"D",exp:"BCS I类属于水溶解度和渗透性均较大的两亲性分子药物，若处方中无显著影响药物吸收的辅料，通常其口服制剂无生物利用度问题，典型代表药物有普萘洛尔、美托洛尔、依那普利、地尔硫䓬和去甲替林。"},
    {type:"最佳选择题",q:"11. 巴比妥类或水杨酸类药物中毒时，可采取的措施为",opts:["A.酸化尿液，药物呈解离型，重吸收减少，促进排泄","B.酸化尿液，药物呈分子型，重吸收增多，促进排泄","C.碱化尿液，药物呈分子型，重吸收减少，促进排泄","D.碱化尿液，药物呈解离型，重吸收减少，促进排泄","E.碱化尿液，药物呈分子型，重吸收增多，促进排泄"],ans:"D",exp:"碱化尿液则使弱酸性药物在肾小管中大部分解离，重吸收少，排泄增加。临床上可通过调节尿液pH值作为解救药物中毒的措施之一，例如巴比妥类或水杨酸类等弱酸性药物中毒，给予碳酸氢钠碱化尿液可加速其排泄。"},
    {type:"最佳选择题",q:"12. A药和B药在体内以代谢和排泄两种形式消除，两药物血药浓度与时间的关系如图所示，关于两种药物体内描述正确的是",img:"y17-q12.png",opts:["A.A药体内消除比B药慢","B.A药消除速率常数k比B药大","C.A药消除半衰期t1/2比B药大","D.A药的清除率比B药小","E.A药表观分布容积比B药大"],ans:"B",exp:"由图可知，A药的浓度衰减更快，消除一半所用的时间比B药少，因此半衰期A药<B药，消除速率常数k=0.693/半衰期，所以消除速率常数和清除率均为A药>B药。"},
    {type:"最佳选择题",q:"13. 患者，男，60kg，静脉注射某药100mg，血药浓度为5μg/ml，已知该药的半衰期为6.93h，则该药的清除率为",opts:["A.1.5L/h","B.2L/h","C.2.5L/h","D.10L/h","E.20L/h"],ans:"B",exp:"表观分布容积V=X/C=100/5=20L，消除速率常数k=0.693/半衰期=0.693/6.93=0.1h⁻¹，Cl=kV=0.1×20=2L/h。"},
    {type:"最佳选择题",q:"14. 为了使药物较快达到所需要的血药浓度，临床上常先给予一个较大的负荷剂量，属于多剂量静脉注射首次给药是否给予负荷剂量的血药浓度-时间曲线是",opts:["A.","B.","C.","D.","E."],optImgs:["y17-q14-A.png","y17-q14-B.png","y17-q14-C.png","y17-q14-D.png","y17-q14-E.png"],ans:"B",exp:"B选项为多剂量静脉注射首次给药是否给予负荷剂量的血药浓度-时间曲线，体现了首剂加倍原则。"},
    {type:"最佳选择题",q:"15. 某临床试验机构进行某仿制药片剂的生物利用度评价试验，以原研片剂为参比制剂。该药物符合线性动力学特征，单剂量给药，仿制药制剂与原研制剂均给药60mg，测得血药浓度-时间曲线下面积分别为48.6(μg·h/L)和48.0(μg·h/L)。则该仿制药",opts:["A.绝对生物利用度约为98.8%","B.绝对生物利用度约为101.2%","C.相对生物利用度约为98.8%","D.相对生物利用度约为101.2%","E.相对生物利用度约为80.1%"],ans:"D",exp:"题干中无静脉注射，均为口服片剂，则为相对生物利用度。Ft=(AUC仿制/剂量仿制)/(AUC原研/剂量原研)×100%=(48.6/60)/(48.0/60)×100%=101.2%。"},
    {type:"最佳选择题",q:"16. 生物等效性研究的总体设计中，半衰期较长的药物可选择",opts:["A.两制剂、单次给药、交叉试验设计","B.两制剂、单次给药、平行试验设计","C.两制剂、单次给药、重复试验设计","D.单制剂、单次给药、重复试验设计","E.单制剂、单次给药、平行试验设计"],ans:"B",exp:"生物等效性研究的总体设计中，对于半衰期较长的药物，可选择两制剂、单次给药、平行试验设计，即每个制剂分别在具有相似人口学特征的两组受试者中进行试验。"},
    {type:"最佳选择题",q:"17. 在给药方案设计中，某些药物的安全性比较好，治疗窗范围较大，一般情况下药物的稳态血药浓度很少能触及药物的最低中毒浓度(MTC)，其给药方案可以根据",opts:["A.半衰期制订给药方案","B.平均稳态血药浓度制订给药方案","C.稳态血药浓度范围制订给药方案","D.最小稳态血药浓度制订给药方案","E.峰浓度和达峰时间制订给药方案"],ans:"D",exp:"某些药物的安全性比较好，治疗窗范围较大，一般情况下药物的稳态血药浓度很少能触及药物的最低中毒浓度（MTC），其给药方案可以根据其最小稳态血药浓度进行设计，此时设定最小有效浓度（MEC）为最小稳态血药浓度。"},
    {type:"最佳选择题",q:"18. 常见于过敏体质患者，反应性质与药物原有效应和剂量无关，用药理性拮抗药解救无效的是",opts:["A.变态反应","B.特异质反应","C.后遗效应","D.生理依赖性","E.继发反应"],ans:"A",exp:"变态反应常见于过敏体质患者，反应性质与药物原有效应和剂量无关，用药理性拮抗药解救无效；反应的严重程度差异很大，从轻微的皮疹、发热至造血系统抑制、肝肾功能损害、休克等。"},
    {type:"最佳选择题",q:"19. 能引起等效反应(一般采用50%效应量)的相对剂量或浓度称为",opts:["A.效能","B.阈剂量(浓度)","C.效价强度","D.治疗指数","E.半数致死量(浓度)"],ans:"C",exp:"效价强度是指能引起等效反应（一般采用50%效应量）的相对剂量或浓度。效价强度用于作用性质相同的药物之间的等效剂量或浓度的比较，其值越小则强度越大。"},
    {type:"最佳选择题",q:"20. 药物的光敏反应分为光毒性反应和光变态反应，不具有光毒性反应的药物为",opts:["A.多西环素","B.红霉素","C.氯丙嗪","D.金霉素","E.洛美沙星"],ans:"B",exp:"药物的光敏反应分为光毒性反应和光变态反应，常见的药物有四环素类如多西环素和金霉素、喹诺酮类如洛美沙星、吩噻嗪类如氯丙嗪。红霉素不具有光敏反应。"},
    {type:"最佳选择题",q:"21. 关于超敏反应(变态反应)，说法正确的是",opts:["A.I型过敏反应又称为速发型过敏反应，由特异性IgG抗体介导发生","B.I型过敏反应是由抗体IgE与细胞膜表面相应抗原或半抗原结合介导发生","C.III型过敏反应是以细胞溶解或组织损伤为主的病理性免疫反应，如输血反应","D.III型过敏反应又称细胞介导型超敏反应","E.IV型过敏反应是效应T细胞再次接触相同抗原后所介导"],ans:"E",exp:"IV型超敏反应又称迟发型超敏反应，为细胞介导型，是效应T细胞再次接触相同抗原后所介导。I型超敏反应主要由特异性IgE抗体介导产生。II型超敏反应是由抗体IgG、IgM与细胞膜表面相应抗原或半抗原结合，引起以细胞溶解或组织损伤为主的病理性免疫反应。III型超敏反应又称免疫复合物型。"},
    {type:"最佳选择题",q:"22. 临床使用的大部分药物属于结构特异性药物，药物需和靶标相互作用后才能产生活性。下列说法错误的是",opts:["A.活性主要依赖于药物分子特异的化学结构","B.特定化学结构与特定靶点相互作用后才能产生活性","C.化学结构发生变化直接影响该药物的药效学性质","D.活性与药物分子和靶点的相互作用和相互匹配有关","E.全身麻醉药为结构特异性药物"],ans:"E",exp:"结构非特异性药物的活性主要取决于药物分子的理化性质，如全身麻醉药的麻醉作用与药物的脂水分配系数有关。"},
    {type:"最佳选择题",q:"23. 在体内发生脱乙酰基代谢，副作用低，没有精神依赖性，使用常规剂量时次日清晨不产生后遗效应的药物是",opts:["A.","B.","C.","D.","E."],optImgs:["y17-q23-A.png","y17-q23-B.png","y17-q23-C.png","y17-q23-D.png","y17-q23-E.png"],ans:"D",exp:"酒石酸唑吡坦副作用低，没有精神依赖性；使用常规剂量时，次日清晨不产生后遗效应；停药后失眠的复发率很低，不具有苯二氮䓬类药物的一些不良反应，在体内代谢生成脱乙酰基扎来普隆。"},
    {type:"最佳选择题",q:"24. 属于非羧酸类非甾体抗炎药的是",opts:["A.吲哚美辛","B.布洛芬","C.依托度酸","D.阿司匹林","E.美洛昔康"],ans:"E",exp:"非羧酸类非甾体抗炎药有昔康类如美洛昔康，昔布类如塞来昔布。"},
    {type:"最佳选择题",q:"25. 本身无环氧合酶抑制活性，在体内代谢后产生对环氧合酶-2选择性抑制作用的非酸性前体药物是",opts:["A.瑞芬太尼","B.洛索洛芬","C.舒林酸","D.萘丁美酮","E.贝诺酯"],ans:"D",exp:"萘丁美酮为非酸性的前体药物，其本身无环氧合酶抑制活性。小肠吸收后，经肝脏首过消除为活性代谢物6-甲氧基-2-萘乙酸起作用。"},
    {type:"最佳选择题",q:"26. 因能延长心脏Q-T间隔，导致罕见的、可危及生命的室性心律失常而被停用的全胃肠促动力药物是",opts:["A.甲氧氯普胺","B.多潘立酮","C.西沙必利","D.伊托必利","E.莫沙必利"],ans:"C",exp:"西沙必利是全胃肠促动力药，对各种胃肠动力障碍疾病均有良好疗效。上市后的不良反应监测中发现西沙必利可延长心脏Q-T间隔，导致罕见的、可危及生命的室性心律失常。现已相继被各国停用。"},
    {type:"最佳选择题",q:"27. 不可逆质子泵抑制药的基本结构如图，关于其作用机制及构效关系，说法有误的是",img:"y17-q27.png",opts:["A.由吡啶环、甲基亚磺酰基及苯并咪唑三部分组成","B.不可逆抑制H+,K+-ATP酶","C.4位引入强吸电子取代基，药物解离能力越强","D.甲基亚磺酰基的硫原子为手性原子","E.具较弱的碱性，在碱性环境中不易解离并处于非活性状态"],ans:"C",exp:"4位引入强给电子取代基，药物解离能力越强，对质子泵抑制作用越快。"},
    {type:"最佳选择题",q:"28. 氟伐他汀钠是第一个通过全合成得到的他汀类药物，该药的药效基团为",img:"y17-q28.png",opts:["A.吲哚环","B.嘧啶环","C.十氢萘环","D.3-羟基-6-内酯环","E.3,5-二羟基戊酸"],ans:"E",exp:"无论是对天然还是合成的HMG-CoA还原酶抑制药，药效团均为3,5-二羟基羧酸，又称为3,5-二羟基戊酸。"},
    {type:"最佳选择题",q:"29. 芳构化酶抑制剂可以显著降低体内雌激素水平，用于治疗雌激素依赖型疾病如乳腺癌。下列属于非甾体芳构化酶抑制药的是",opts:["A.","B.","C.","D.","E."],optImgs:["y17-q29-A.png","y17-q29-B.png","y17-q29-C.png","y17-q29-D.png","y17-q29-E.png"],ans:"C",exp:"非甾体芳构化酶抑制药有阿那曲唑和来曲唑。甾体芳构化酶抑制药的代表药物有依西美坦和福美司坦。"},
    {type:"最佳选择题",q:"30. 是第一个应用于临床的碳酸酐酶抑制剂，可降低青光眼患者的眼内压，主要用于治疗青光眼的药物是",opts:["A.氢氯噻嗪","B.透明质酸钠","C.乙酰唑胺","D.螺内酯","E.氨苯蝶啶"],ans:"C",exp:"乙酰唑胺是第一个应用于临床的碳酸酐酶抑制剂，具有使房水生成减少的作用，可降低青光眼患者的眼内压，因此现主要用于治疗青光眼。"},
    {type:"最佳选择题",q:"31. 关于大环内酯类抗生素，说法正确的是",opts:["A.大环内酯类抗生素可作用于敏感细菌的70S核糖体亚基，从而抑制细菌的蛋白质合成","B.红霉素在胃酸中稳定强，可口服","C.克拉霉素又称为6-O-甲基红霉素，增加了药物在酸中的稳定性","D.依托红霉素在酸中不稳定并不适于口服","E.罗红霉素是第一个环内含氮的15元环大环内酯类抗生素"],ans:"C",exp:"克拉霉素是红霉素6-羟基经甲基化得到甲氧基，故称6-O-甲基红霉素，6-羟基甲基化后，增加了药物在酸中的稳定性。大环内酯类抗生素作用于敏感细菌的50S核糖体亚基。红霉素在酸中不稳定。依托红霉素在酸中较稳定并适于口服。阿奇霉素是第一个环内含氮的15元环大环内酯类抗生素。"},
    {type:"最佳选择题",q:"32. 关于口服肠内营养粉剂的特点和质量要求，说法有误的是",opts:["A.主要用于无法正常进食或需要额外营养支持的患者","B.高蛋白型肠内营养粉剂适合手术后恢复、烧伤或肌肉消耗严重的患者","C.低脂型肠内营养粉剂含有大量膳食纤维，可防止便秘","D.应优选生物利用度高、过敏风险低的高质量蛋白质","E.具备良好的储存稳定性，不易受湿气、温度或光线的影响"],ans:"C",exp:"纤维增强型肠内营养粉剂含有膳食纤维，有助于促进肠道健康，防止便秘。低脂型肠内营养粉剂适合脂肪代谢障碍的患者。"},
    {type:"最佳选择题",q:"33. 根据药物的分散状态，液体制剂可分为均相分散系统和非均相分散系统。属于热力学稳定体系，扩散慢，能透过滤纸但不能透过半透膜的是",opts:["A.低分子溶液剂","B.高分子溶液剂","C.溶胶剂","D.乳剂","E.混悬剂"],ans:"B",exp:"高分子溶液剂属于真溶液，热力学稳定体系，扩散慢，能透过滤纸，不能透过半透膜。"},
    {type:"最佳选择题",q:"34. 不可作为增加药物溶解度方法的是",opts:["A.合并使用膜渗透增强剂","B.难溶性弱酸、弱碱可制成盐而增加其溶解度","C.药物活性成分与合适的共晶试剂形成一种新晶型","D.制备固体分散体","E.利用包合技术制成环糊精及其衍生物"],ans:"A",exp:"增加药物溶解度方法有：加入增溶剂；加入助溶剂；制成盐类；使用混合溶剂；制成共晶；制备固体分散体；包合技术。膜渗透增强剂的机制与药物溶解度无关。"},
    {type:"最佳选择题",q:"35. 酊剂是指将原料药物用规定浓度的乙醇提取或溶解而制成的澄清液体制剂。酊剂中乙醇的最低含量为",opts:["A.10%(V/V)","B.20%(V/V)","C.30%(V/V)","D.40%(V/V)","E.60%(V/V)"],ans:"C",exp:"酊剂中乙醇的最低含量为30%(V/V)。"},
    {type:"最佳选择题",q:"36. 灭菌法是指杀灭或除去所有微生物繁殖体和芽孢的方法或技术。下列说法错误的是",opts:["A.干热空气灭菌法适用于耐高温但不宜用湿热灭菌法灭菌的物品","B.湿热灭菌法为灭菌中最有效、应用最广泛的灭菌方法","C.流通蒸汽灭菌法是指采用高压饱和水蒸汽加热灭菌的方法","D.热压灭菌法常用灭菌温度为121℃，对于耐热品首选过度杀灭","E.过滤除菌法常用于气体、热不稳定溶液的除菌"],ans:"C",exp:"流通蒸汽不能有效杀灭细菌孢子，一般可作为不耐热无菌产品的辅助处理手段。热压灭菌法是指采用高压饱和水蒸汽加热灭菌的方法。"},
    {type:"最佳选择题",q:"37. 在水中不稳定的药物，尤其是对湿热敏感的抗生素和生物制品在临床上要求快速起效，可将其制成",opts:["A.溶液型注射液","B.乳状液型注射液","C.混悬型注射液","D.注射用无菌粉末","E.肠溶片剂"],ans:"D",exp:"注射用无菌粉末在临用前需经灭菌注射用水或生理盐水等溶解后才可注射，主要适用于水中不稳定药物，尤其是对湿热敏感的抗生素和生物制品。"},
    {type:"最佳选择题",q:"38. 在大量电解质的输液中能被电解质盐析出来，以致胶体粒子凝聚而产生沉淀的药物是",opts:["A.地西泮","B.两性霉素B","C.肾上腺素","D.硫喷妥钠","E.四环素"],ans:"B",exp:"两性霉素B注射液，只能加入5%葡萄糖注射液中静脉滴注。如果在大量电解质的输液中则能被电解质盐析出来，以致胶体粒子凝聚而产生沉淀。"},
    {type:"最佳选择题",q:"39. 关于贴剂的说法，错误的是",opts:["A.发现副作用可随时中断给药","B.不存在皮肤的代谢与贮库作用","C.背衬层用来防止药物的挥发和流失","D.按结构不同，可分为黏胶分散型、周边黏胶骨架型与贮库型","E.给药部位应为清洁、干燥、几乎无毛发的皮肤"],ans:"B",exp:"贴剂药物吸收的个体差异和给药部位的差异较大，存在皮肤的代谢与贮库作用。"},
    {type:"最佳选择题",q:"40. 硝酸甘油舌下片的处方组成有：硝酸甘油、微晶纤维素、乳糖、聚乙烯吡咯烷酮、硬脂酸镁、含水乙醇。规格为每片含硝酸甘油0.3mg。处方中可使硝酸甘油的蒸气压下降，挥发减慢，提高药物稳定性的成分为",opts:["A.微晶纤维素","B.乳糖","C.聚乙烯吡咯烷酮","D.硬脂酸镁","E.乙醇"],ans:"C",exp:"加入聚乙烯吡咯烷酮或PEG类可使硝酸甘油的蒸气压下降，挥发减慢，提高药物稳定性。"},

    // ===== 二、配伍选择题（41-90） =====
    {type:"配伍选择题",subs:[
      {q:"41. 国家药品标准没有规定的中药材标准、中药饮片炮制规范和中药配方颗粒标准，国家药品标准实施后自行废止的是",opts:["A.国家药品标准","B.药品注册标准","C.省级中药标准","D.企业药品标准","E.局颁标准"],ans:"C",exp:"省级中药标准包括省、自治区、直辖市人民政府药品监督管理部门制定的国家药品标准没有规定的中药材标准、中药饮片炮制规范和中药配方颗粒标准，自国家药品标准实施后自行废止。"},
      {q:"42. 属于非法定标准，药品出厂放行的规程规定有放行的标准和条件，其中产品质量应符合",opts:["A.国家药品标准","B.药品注册标准","C.省级中药标准","D.企业药品标准","E.局颁标准"],ans:"D",exp:"企业药品标准仅在本企业的药品生产质量管理中发挥作用，属于非法定标准。出厂放行规程规定有放行的标准和条件，其中产品质量应当符合企业依据国家药品标准或药品注册标准制定的“企业药品标准”或称“企业内控标准”。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"43. 《中国药典》中，用于评价药品安全性的检查项目为",opts:["A.游离水杨酸","B.崩解时限","C.微生物限度","D.溶解度","E.干燥失重"],ans:"C",exp:"生物学检查法主要用于评价药品的安全性，如非无菌产品的微生物限度检查法和无菌产品的无菌检查法、热原或细菌内毒素检查法等。"},
      {q:"44. 《中国药典》中，特性检查可用于评价药品均一性，属于特性检查的项目为",opts:["A.游离水杨酸","B.崩解时限","C.微生物限度","D.溶解度","E.干燥失重"],ans:"B",exp:"特性检查法主要用于检查药品的均一性，如崩解时限、溶出度与释放度、结晶性等。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"45. 维系蛋白质三级结构最主要的动力是",opts:["A.肽键","B.疏水作用","C.氢键","D.离子键","E.3',5'-磷酸二酯键"],ans:"B",exp:"疏水作用是维系蛋白质三级结构最主要的动力。除疏水作用外，维系蛋白质三级结构的动力还有氢键、盐键(离子键)、范德瓦耳斯力和二硫键等。"},
      {q:"46. DNA一级结构碱基顺序的键合类型为",opts:["A.肽键","B.疏水作用","C.氢键","D.离子键","E.3',5'-磷酸二酯键"],ans:"E",exp:"DNA的一级结构即指4种核苷酸按照一定的排列顺序，通过3',5'-磷酸二酯键连接形成的多聚核苷酸，又可称为碱基顺序。"},
      {q:"47. 去甲肾上腺素与β2-肾上腺素受体的键合类型为",opts:["A.肽键","B.疏水作用","C.氢键","D.离子键","E.3',5'-磷酸二酯键"],ans:"D",exp:"去甲肾上腺素结构中的氨基在体内质子化成铵盐后，与β2-肾上腺素受体形成离子键作用。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"48. 在血管间隙内起着保护作用，是在初级免疫后最先形成的抗体是",opts:["A.IgA","B.IgG","C.IgD","D.IgE","E.IgM"],ans:"E",exp:"IgM是在初级免疫后最先形成的抗体(暴露了新的抗原)，在血管间隙内起着保护作用。"},
      {q:"49. 保护组织对抗细菌、病毒和毒素，在新生儿抗感染免疫中起重要作用，是唯一可通过胎盘的抗体是",opts:["A.IgA","B.IgG","C.IgD","D.IgE","E.IgM"],ans:"B",exp:"IgG保护组织对抗细菌、病毒和毒素，是唯一可通过胎盘的抗体，在新生儿抗感染免疫中起重要作用。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"50. P-糖蛋白将药物由细胞内转运至细胞外的过程为",opts:["A.滤过","B.单纯扩散","C.主动转运","D.易化扩散","E.膜动转运"],ans:"C",exp:"主动转运是指药物可从低浓度或低电位一侧向高浓度或高电位一侧的转运过程，例如有的转运蛋白可将药物由细胞内转运至细胞外，如P-糖蛋白。"},
      {q:"51. 大分子物质排出细胞的过程为",opts:["A.滤过","B.单纯扩散","C.主动转运","D.易化扩散","E.膜动转运"],ans:"E",exp:"胞吐又称外排或出胞，是指胞质内的大分子物质以外泌囊泡形式排出细胞的过程，胞吐属于膜动转运。"},
      {q:"52. 细胞内Na+向细胞外转运的过程为",opts:["A.滤过","B.单纯扩散","C.主动转运","D.易化扩散","E.膜动转运"],ans:"C",exp:"主动转运是指药物可从低浓度或低电位一侧向高浓度或高电位一侧的转运过程，例如，细胞内Na+向细胞外转运。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"53. 属于氧化脱卤素代谢的是",opts:["A.","B.","C.","D.","E."],optImgs:["y17-q53-54-A.png","y17-q53-54-B.png","y17-q53-54-C.png","y17-q53-54-D.png","y17-q53-54-E.png"],ans:"C",exp:"卤素主要是F、Cl、Br、I，可发生氧化脱卤素代谢的为C选项，氯霉素的代谢。"},
      {q:"54. 属于氧化脱烷基代谢的是",opts:["A.","B.","C.","D.","E."],optImgs:["y17-q53-54-A.png","y17-q53-54-B.png","y17-q53-54-C.png","y17-q53-54-D.png","y17-q53-54-E.png"],ans:"D",exp:"烷基包括甲基、乙基、丙基等，可发生氧化脱烷基代谢的是D选项，利多卡因N-脱乙基代谢。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"55. 反映药物在体内的暴露，与药物吸收分数F正相关的参数为",opts:["A.MRT","B.Cmax","C.Cl","D.k","E.AUC"],ans:"E",exp:"口服给药的药-时曲线下面积(AUC)反映药物在体内的暴露，它与药物的吸收分数F正相关。"},
      {q:"56. 反映药物消除的快慢，数值越大则消除越慢的参数是",opts:["A.MRT","B.Cmax","C.Cl","D.k","E.AUC"],ans:"A",exp:"MRT代表了药物在体内的平均滞留时间的长短，是一个反映速度的函数。MRT越长，表示药物被机体消除得越慢。k和Cl越大，则消除越快。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"57. 存在于细胞核内，配体结合后也以二聚体形式发挥作用的受体为",opts:["A.前列腺素受体","B.胰岛素受体","C.生长因子受体","D.N型乙酰胆碱受体","E.甲状腺素受体"],ans:"E",exp:"甲状腺素受体存在于细胞核内，配体结合后也以二聚体形式发挥作用。"},
      {q:"58. 属于G-蛋白偶联受体的是",opts:["A.前列腺素受体","B.胰岛素受体","C.生长因子受体","D.N型乙酰胆碱受体","E.甲状腺素受体"],ans:"A",exp:"G-蛋白偶联受体是目前发现的种类最多的受体，如许多激素的受体、M胆碱受体、肾上腺素受体、多巴胺受体、5-HT受体、前列腺素受体及一些多肽类受体等。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"59. 氨基糖苷类抗生素应避免与高效利尿药合用，属于",opts:["A.作用于同一部位的协同作用","B.作用于同一部位的拮抗作用","C.作用于不同部位的协同作用","D.作用于不同部位的拮抗作用","E.对作用部位的增敏作用"],ans:"A",exp:"氨基糖苷类抗生素可进入内耳外淋巴液，产生耳毒性，因此除非必要，应避免与高效利尿药或其他耳毒性药物合用。上述例子属于作用于同一部位的协同作用。"},
      {q:"60. 长期使用抗凝药合用甲状腺素时，要防止自发性出血的危险，属于",opts:["A.作用于同一部位的协同作用","B.作用于同一部位的拮抗作用","C.作用于不同部位的协同作用","D.作用于不同部位的拮抗作用","E.对作用部位的增敏作用"],ans:"E",exp:"甲状腺素使抗凝药与受体部位的亲和力增加，从而使抗凝作用增强，对长期使用抗凝药治疗动脉粥样硬化的患者，甲状腺素具有重要临床意义，但也要防止自发性出血的危险。上述例子属于对作用部位的增敏作用。"},
      {q:"61. 镇静催眠药与氯丙嗪合用时适当减少剂量，属于",opts:["A.作用于同一部位的协同作用","B.作用于同一部位的拮抗作用","C.作用于不同部位的协同作用","D.作用于不同部位的拮抗作用","E.对作用部位的增敏作用"],ans:"A",exp:"氯丙嗪可增强麻醉药、镇静催眠药、镇痛药及乙醇的作用，上述药物与氯丙嗪合用时，应适当减少剂量，以免加深对中枢神经系统的抑制。上述例子属于作用于同一部位的协同作用。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"62. 中效类糖皮质激素泼尼松的服药时间为",opts:["A.临睡前","B.凌晨","C.19:00","D.每日清晨","E.隔日清晨"],ans:"E",exp:"中效类糖皮质激素泼尼松或泼尼松龙给药方式采用每隔一日，早晨7~8时给药1次。"},
      {q:"63. 哮喘患者服用沙丁胺醇缓释片的时间为",opts:["A.临睡前","B.凌晨","C.19:00","D.每日清晨","E.隔日清晨"],ans:"A",exp:"晚间临睡前口服沙丁胺醇缓释片16mg，测得次日早晨6时的血药浓度为(17.3±5.3)ng/ml，而其有效浓度为20ng/ml，因此可获得较好疗效。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"64. 曲格列酮是由色满酮母核和噻唑烷二酮相连接，该母核在CYP2C8和CYP3A4的作用下，发生单电子氧化，形成强亲电试剂o-次甲基-醌和p-醌，进而与蛋白质以共价键结合。该药物是",opts:["A.普拉洛尔","B.曲格列酮","C.舒多昔康","D.佐美酸","E.非尔氨酯"],ans:"B",exp:"曲格列酮在CYP2C8和CYP3A4作用下发生单电子氧化，形成强亲电试剂，与蛋白质共价结合产生毒性。"},
      {q:"65. 非尔氨酯首先在体内被酯酶水解并在醛脱氢酶催化下生成醛基氨甲酸酯，然后生成强亲电性的2-苯基丙烯醛，易与蛋白的亲核基团发生迈克尔加成，产生特质性毒性。该药物是",opts:["A.普拉洛尔","B.曲格列酮","C.舒多昔康","D.佐美酸","E.非尔氨酯"],ans:"E",exp:"非尔氨酯代谢生成2-苯基丙烯醛，产生特质性毒性。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"66. 喹诺酮类药物司帕沙星对金黄色葡萄球菌的抑制活性比类似物环丙沙星强16倍，其原因",opts:["A.药物的解离程度对药物活性的影响","B.药物的电荷分布对药物活性的影响","C.药物的几何异构对药物活性的影响","D.药物的构象异构对药物活性的影响","E.药物的手性异构对药物活性的影响"],ans:"B",exp:"司帕沙星对金黄色葡萄球菌抑制活性比类似物环丙沙星强16倍的原因是5位氨基和8位F均是给电子基团，增加了4位羰基氧上的电荷密度，增加了对酶的抑制作用。"},
      {q:"67. 己烯雌酚两个酚羟基排列的空间距离和雌二醇的二个羟基的距离近似，表现出与雌二醇相同的生理活性，其原因为",opts:["A.药物的解离程度对药物活性的影响","B.药物的电荷分布对药物活性的影响","C.药物的几何异构对药物活性的影响","D.药物的构象异构对药物活性的影响","E.药物的手性异构对药物活性的影响"],ans:"C",exp:"己烯雌酚反式异构体与雌二醇骨架不同，但两个酚羟基排列的空间距离和雌二醇的二个羟基的距离近似，表现出与雌二醇相同的生理活性，属于几何异构。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"68. 在体内经氧化生成羟基化的活性代谢物，代谢后可生成新手性中心的药物是",opts:["A.氟西汀","B.吗氯贝胺","C.可待因","D.利培酮","E.依替唑仑"],ans:"D",exp:"帕利哌酮是利培酮经氧化生成羟基化的活性代谢物，生成了新的手性中心，药用为外消旋体。"},
      {q:"69. 在体内主要发生N-脱烷基代谢，代谢后半衰期长达330h的药物是",opts:["A.氟西汀","B.吗氯贝胺","C.可待因","D.利培酮","E.依替唑仑"],ans:"A",exp:"氟西汀主要的代谢产物均为N-去甲氟西汀，氟西汀半衰期约为70小时，而其代谢产物半衰期约为330小时，口服吸收良好，进食不影响药物的生物利用度。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"70. 体外无活性，吸收后在体内经肝脏代谢生成活性产物的双二甲氨基甲酸酯前药是",opts:["A.肾上腺素","B.沙丁胺醇","C.异丙托溴铵","D.盐酸班布特罗","E.茶碱"],ans:"D",exp:"将特布他林苯环上两个酚羟基酯化制成的双二甲氨基甲酸酯前药为盐酸班布特罗，吸收后在体内经肝脏代谢成为有活性的特布他林而发挥作用。"},
      {q:"71. 为黄嘌呤衍生物，用药期间应监测血药浓度的是",opts:["A.肾上腺素","B.沙丁胺醇","C.异丙托溴铵","D.盐酸班布特罗","E.茶碱"],ans:"E",exp:"茶碱为黄嘌呤衍生物，有效血药浓度与中毒时的血药浓度相差不大，故在用药期间应监测其血药浓度。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"72. 骨架为1,2-苯并噻嗪结构，含有烯醇型羟基药效团，第一个上市的昔康类药物是",opts:["A.","B.","C.","D.","E."],optImgs:["y17-q72-74-A.png","y17-q72-74-B.png","y17-q72-74-C.png","y17-q72-74-D.png","y17-q72-74-E.png"],ans:"A",exp:"吡罗昔康骨架为1,2-苯并噻嗪结构，含有烯醇型羟基药效团，是第一个上市的昔康类药物。"},
      {q:"73. 为3位苯甲酰基布洛芬，消炎作用较布洛芬强，且副作用小的药物是",opts:["A.","B.","C.","D.","E."],optImgs:["y17-q72-74-A.png","y17-q72-74-B.png","y17-q72-74-C.png","y17-q72-74-D.png","y17-q72-74-E.png"],ans:"B",exp:"酮洛芬为3位苯甲酰基布洛芬，消炎作用较布洛芬强，副作用小。"},
      {q:"74. 存在联苯四氮唑结构，但不含咪唑环的AII受体拮抗药是",opts:["A.","B.","C.","D.","E."],optImgs:["y17-q72-74-A.png","y17-q72-74-B.png","y17-q72-74-C.png","y17-q72-74-D.png","y17-q72-74-E.png"],ans:"E",exp:"选项中存在联苯四氮唑结构，但不含咪唑环的药物只有缬沙坦。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"75. 存在噻吩和丙烯酸结构，不经CYP代谢，基本以原型药物形式排泄的药物是",opts:["A.甲苯磺丁脲","B.那格列奈","C.盐酸吡格列酮","D.卡格列净","E.磷酸西他列汀"],ans:"B",exp:"选项中存在噻吩和丙烯酸结构的药物只有依普罗沙坦。"},
      {q:"76. 存在螺环结构，能提高与受体疏水结合能力的药物是",opts:["A.甲苯磺丁脲","B.那格列奈","C.盐酸吡格列酮","D.卡格列净","E.磷酸西他列汀"],ans:"E",exp:"选项中存在螺环结构的药物只有厄贝沙坦。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"77. 通过竞争性结合二肽基肽酶-4活化部位，增加患者的胰高血糖素样肽-1水平，进而发挥降糖活性的药物是",opts:["A.亚胺培南","B.伊马替尼","C.克拉维酸","D.伊曲康唑","E.奥司他韦"],ans:"C",exp:"二肽基肽酶-4抑制药(也称为列汀类药物)通过竞争性结合二肽基肽酶-4活化部位，降低酶的催化活性，从而增加患者的胰高血糖素样肽-1水平，进而发挥降糖活性。"},
      {q:"78. 对K+-ATP通道具有“快开”和“快闭”作用，使胰岛素的分泌达到餐时胰岛素迅速升高，餐后及时回落到基础分泌状态的药物是",opts:["A.亚胺培南","B.伊马替尼","C.克拉维酸","D.伊曲康唑","E.奥司他韦"],ans:"E",exp:"非磺酰脲类促胰岛素分泌药对K+-ATP通道具有“快开”和“快闭”作用，显著较其他口服降糖药起效迅速，作用时间短，使胰岛素的分泌达到模拟人体生理模式——餐时胰岛素迅速升高，餐后及时回落到基础分泌状态，被称为“餐时血糖调节剂”，如那格列奈。"},
      {q:"79. 是一种“自杀性”的酶抑制剂，可与β-内酰胺类抗生素联合使用的药物是",opts:["A.亚胺培南","B.伊马替尼","C.克拉维酸","D.伊曲康唑","E.奥司他韦"],ans:"B",exp:"克拉维酸是一种“自杀性”的酶抑制药。临床上使用克拉维酸和阿莫西林组成的复方制剂，也可与其他β-内酰胺类抗生素联合使用，可使头孢菌素类增效2~8倍。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"80. 根据药物层处方组成分析，氯化钾是作为",opts:["A.助推剂","B.前解剂","C.包衣材料","D.致孔剂","E.渗透压活性物质"],ans:"E",exp:"硝苯地平为主药，氯化钾和氯化钠为渗透压活性物质。"},
      {q:"81. 根据包衣液处方组成分析，PEG4000是作为",opts:["A.助推剂","B.前解剂","C.包衣材料","D.致孔剂","E.渗透压活性物质"],ans:"D",exp:"醋酸纤维素为包衣材料，PEG4000为致孔剂，三氯甲烷和甲醇为包衣液溶剂。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"82. 阿拉伯胶在鱼肝油口服乳的处方中是作为",opts:["A.黏合剂","B.天然高分子囊材","C.半合成高分子囊材","D.助悬剂","E.乳化剂"],ans:"E",exp:"鱼肝油乳剂中鱼肝油为主药和油相，阿拉伯胶为乳化剂。"},
      {q:"83. 阿拉伯胶在口服混悬液中是作为",opts:["A.黏合剂","B.天然高分子囊材","C.半合成高分子囊材","D.助悬剂","E.乳化剂"],ans:"D",exp:"助悬剂是指能增加混悬剂中分散介质的黏度，降低药物微粒的沉降速度或增加微粒亲水性的附加剂，阿拉伯胶在口服混悬液中作为助悬剂。"},
      {q:"84. 阿拉伯胶在复方甲地孕酮微囊注射液中是作为",opts:["A.黏合剂","B.天然高分子囊材","C.半合成高分子囊材","D.助悬剂","E.乳化剂"],ans:"B",exp:"复方甲地孕酮微囊注射液的囊材是明胶和阿拉伯胶，为天然高分子囊材。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"85. 紫杉醇白蛋白纳米粒处方中白蛋白为",opts:["A.pH调节剂","B.稳定剂","C.等渗调节剂","D.载体材料","E.抑菌剂"],ans:"D",exp:"紫杉醇为主药，白蛋白为载体材料。以有机溶剂溶解紫杉醇，与白蛋白水溶液高压均质化，去除有机溶剂，冷冻干燥，得紫杉醇白蛋白纳米粒。"},
      {q:"86. 注射用重组人白介素-2处方中聚山梨酯80为",opts:["A.pH调节剂","B.稳定剂","C.等渗调节剂","D.载体材料","E.抑菌剂"],ans:"B",exp:"注射用重组人白介素-2处方中，重组人白介素-2和人血清白蛋白为主药；磷酸盐缓冲液为pH调节剂；甘露醇为冻干保护剂；聚山梨酯80为稳定剂，防止蛋白质凝聚与变性。"},
      {q:"87. 既能保护滋润皮肤，还能软化附着物，促使药物渗透到皮肤深部而起作用的剂型为",opts:["A.糊剂","B.酊剂","C.粉雾剂","D.乳膏剂","E.贴剂"],ans:"B",exp:"苔藓样变为主时，可选用软膏剂、酊剂等，其中酊剂既能保护滋润皮肤，还能软化附着物，促使药物渗透到皮肤深部而起作用。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"88. 有安抚、冷却、止痒及蒸发作用，可改善皮肤的血液循环，消除患处的肿胀与炎症的剂型为",opts:["A.涂膜剂","B.灌肠剂","C.贴剂","D.吸入粉雾剂","E.吸入气雾剂"],ans:"C",exp:"皮肤疾病急性期无渗液时，用洗剂或粉雾剂，有安抚、冷却、止痒及蒸发作用，可改善皮肤的血液循环，消除患处的肿胀与炎症。"},
      {q:"89. 给药剂量大，可用于多肽和蛋白质类药物的给药形式为",opts:["A.涂膜剂","B.灌肠剂","C.贴剂","D.吸入粉雾剂","E.吸入气雾剂"],ans:"D",exp:"吸入粉雾剂由患者主动吸入，给药剂量大，可用于多肽和蛋白质类药物的给药。吸入气雾剂阀门系统可限制剂量，不适合大剂量药物。"},
      {q:"90. 不适用于肠梗阻、肠穿孔、急性腹痛、炎症性肠病急性期、肛裂或肛周感染患者的给药形式为",opts:["A.涂膜剂","B.灌肠剂","C.贴剂","D.吸入粉雾剂","E.吸入气雾剂"],ans:"B",exp:"使用前，首先检查灌肠剂的有效期和包装完整性，不适用于肠梗阻、肠穿孔、急性腹痛、炎症性肠病急性期、肛裂或肛周感染患者。"}
    ]},

    // ===== 三、综合分析选择题（91-95） =====
    {type:"最佳选择题",q:"91. 根据背景材料可知，该紫杉醇制剂的剂型为",opts:["A.微囊注射液","B.白蛋白纳米粒","C.口服混悬剂","D.注射用脂质体","E.注射用微球"],ans:"D",exp:"以卵磷脂与胆固醇为脂质体制备材料，脂质体作为药物载体，具有靶向性，可增强药物治疗作用又可以减低药物毒性，所以为注射用紫杉醇脂质体。"},
    {type:"最佳选择题",q:"92. 紫杉烷类抗肿瘤药紫杉醇来源于",opts:["A.植物来源的天然产物","B.微生物的代谢产物","C.天然配体","D.筛选得到的药物","E.设计得到的药物"],ans:"A",exp:"紫杉醇是从美国西海岸红豆杉树皮中分离出来的一种二萜化合物类抗癌药，因此属于植物来源的天然产物。"},
    {type:"最佳选择题",q:"93. 由背景资料可知，紫杉醇为微管抑制剂，在抑制肿瘤微管蛋白的同时也抑制神经细胞的微管，产生较为严重的神经炎副作用，主要的原因",opts:["A.药物与非治疗靶标结合产生的毒副作用","B.药物“一靶多能”引起的毒副作用","C.药物与非治疗部位靶标结合产生的毒副作用","D.药物选择性差异引起的毒副作用","E.药物代谢产物引发的毒副作用"],ans:"C",exp:"紫杉醇为微管抑制剂，在抑制肿瘤微管蛋白的同时也抑制神经细胞的微管，靶标结合选择性高，但该靶标分布于多个作用部位，所以其产生毒副作用的原因是药物与非治疗部位靶标结合产生的毒副作用。"},
    {type:"最佳选择题",q:"94. 丙酸氟替卡松服用后可避免全身性糖皮质激素副作用，其原因是",img:"y17-q94-95.png",opts:["A.丙酸氟替卡松为前药，在体内代谢后生成无毒性的代谢产物","B.丙酸氟替卡松17位羧酸酯可水解失活，避免全身性副作用","C.丙酸氟替卡松9位F原子可降低糖皮质激素副作用","D.丙酸氟替卡松16位引入甲基，可降低副作用，从而避免全身性副作用","E.丙酸氟替卡松1，2位引入双键，活性增强的同时消除了全身性副作用"],ans:"B",exp:"丙酸氟替卡松的分子结构中存在17位羧酸酯结构，进入体内后，酯键水解，失去活性，因此能避免皮质激素的全身作用。"},
    {type:"最佳选择题",q:"95. 关于丙酸氟替卡松吸入气雾剂说法正确的是",img:"y17-q94-95.png",opts:["A.抛射剂是喷射药物的动力，为高沸点液体","B.应置阴凉处贮存","C.为防止罐体爆炸，因此使用前不可振摇储药罐","D.为非无菌制剂","E.吸入结束后用清水漱口即可"],ans:"D",exp:"吸入气雾剂和吸入粉雾剂为非无菌制剂，其他吸入制剂为无菌制剂。抛射剂是气雾剂喷射药物的动力，为低沸点液体。气雾剂应置凉暗处贮存。使用前充分振摇储药罐，使抛射剂和药物充分混合。激素类药物吸入结束后应刷牙。"},

    // ===== 四、多项选择题（96-100） =====
    {type:"多项选择题",q:"96. 必须经过指定的药品检验机构检验，检验合格的才准予销售或进口的药品是",opts:["A.《中国药典》收载的化学药品","B.国务院规定的其他药品","C.国家药品监督管理部门规定的血液制品","D.国家药品监督管理部门规定的疫苗","E.首次在中国销售的药品"],ans:"BCDE",exp:"指定检验指国家法律或国家药品监督管理部门规定某些药品在销售前或进口时，必须经过指定的药品检验机构检验，检验合格的才准予销售或进口的强制性药品检验。指定检验的药品包括：①首次在中国销售的药品；②国家药品监督管理部门规定的生物制品，如疫苗、血液制品；③国务院规定的其他药品。"},
    {type:"多项选择题",q:"97. 柠檬酸循环即三羧酸循环，是由线粒体内一系列酶促反应构成的循环反应系统，柠檬酸循环反应过程中的关键限速步骤有",opts:["A.乙酰CoA与草酰乙酸缩合成柠檬酸","B.异柠檬酸氧化脱羧转变为α-酮戊二酸","C.延胡索酸加水生成苹果酸","D.α-酮戊二酸氧化脱羧生成琥珀酰CoA","E.苹果酸脱氢生成草酰乙酸"],ans:"ABD",exp:"柠檬酸循环反应过程中，乙酰CoA与草酰乙酸缩合成柠檬酸是第一个限速步骤，异柠檬酸氧化脱羧转变为α-酮戊二酸是第二个限速步骤，α-酮戊二酸氧化脱羧生成琥珀酰CoA是第三个限速步骤。"},

var currentChapter=0,answered=0,correct=0;
function initChapterSelect(){var sel=document.getElementById('chapterSelect');sel.innerHTML='';for(var i=0;i<chapters.length;i++){var opt=document.createElement('option');opt.value=i;opt.textContent=chapters[i].name;sel.appendChild(opt);}}
function switchChapter(index){currentChapter=parseInt(index);answered=0;correct=0;renderChapter();document.getElementById('chapterSelect').value=currentChapter;}
function prevChapter(){if(currentChapter>0)switchChapter(currentChapter-1);}
function nextChapter(){if(currentChapter<chapters.length-1)switchChapter(currentChapter+1);}
function updateNavButtons(){document.getElementById('prevBtn').disabled=(currentChapter===0);document.getElementById('nextBtn').disabled=(currentChapter===chapters.length-1);}
var currentQuestionIndex=0;

function renderChapter(){
  var ch=chapters[currentChapter];
  document.getElementById('chapterTitle').textContent=ch.name;
  var flat=[];
  for(var i=0;i<ch.questions.length;i++){
    var item=ch.questions[i];
    if(item.subs){
      for(var j=0;j<item.subs.length;j++){
        flat.push({type:'配伍选择题',q:item.subs[j].q,opts:item.subs[j].opts,ans:item.subs[j].ans,optImgs:item.subs[j].optImgs,img:item.subs[j].img});
      }
    }else{
      flat.push(item);
    }
  }
  ch._flat=flat;
  currentQuestionIndex=0;
  answered=0;
  correct=0;
  renderOneQuestion();
  updateNavButtons();
}

function renderOneQuestion(){
  var ch=chapters[currentChapter];
  var flat=ch._flat;
  var quiz=document.getElementById('quiz');
  quiz.innerHTML='';
  document.getElementById('stats').textContent='已答 '+answered+' / '+flat.length+' 题，正确 '+correct+' 题';
  var oldBar=document.getElementById('quiz-nav-bar');
  if(oldBar)oldBar.remove();
  if(currentQuestionIndex>=flat.length){
    quiz.innerHTML='<div class="card" style="text-align:center;padding:40px 20px;"><h2>🎉 本章已完成！</h2><p>共 '+flat.length+' 题，答对 '+correct+' 题</p></div>';
    showNextBar('chapter-end');
    return;
  }
  var item=flat[currentQuestionIndex];
  var card=document.createElement('div');
  card.className='card';
  var tag=document.createElement('div');
  tag.className='tag';
  tag.textContent=item.type+'  ·  第 '+(currentQuestionIndex+1)+' / '+flat.length+' 题';
  card.appendChild(tag);
  var title=document.createElement('div');
  title.className='q-title';
  title.textContent=item.q;
  card.appendChild(title);
  if(item.img){
    var imgEl=document.createElement('img');
    imgEl.src=item.img;
    imgEl.style.cssText='max-width:100%;display:block;margin:10px auto;border-radius:6px;';
    imgEl.onerror=function(){this.style.display='none';};
    card.appendChild(imgEl);
  }
  var ansArr=item.ans.split('');
  var isMulti=ansArr.length>1;
  var selected=[];
  var allButtons=[];
  for(var k=0;k<item.opts.length;k++){
    (function(opt, idx){
      var btn=document.createElement('button');
      btn.className='option';
      if(item.optImgs && item.optImgs[idx]){
        var letterSpan=document.createElement('span');
        letterSpan.textContent=opt+' ';
        letterSpan.style.cssText='display:inline-block;vertical-align:top;font-weight:600;margin-right:6px;';
        btn.appendChild(letterSpan);
        var optImg=document.createElement('img');
        optImg.src=item.optImgs[idx];
        optImg.style.cssText='max-width:85%;max-height:150px;display:inline-block;vertical-align:middle;border-radius:4px;';
        optImg.onerror=function(){this.style.display='none';};
        btn.appendChild(optImg);
      }else{
        btn.textContent=opt;
      }
      var letter=opt.charAt(0);
      btn.onclick=function(){
        if(btn.classList.contains('disabled'))return;
        if(isMulti){
          var ix=selected.indexOf(letter);
          if(ix===-1){selected.push(letter);btn.style.background='#d0e3ff';btn.style.borderColor='#4a90e2';}
          else{selected.splice(ix,1);btn.style.background='';btn.style.borderColor='';}
        }else{judgeOne([letter]);}
      };
      allButtons.push(btn);
      card.appendChild(btn);
    })(item.opts[k], k);
  }
  if(isMulti){
    var submitBtn=document.createElement('button');
    submitBtn.textContent='提交答案';
    submitBtn.style.cssText='margin-top:12px;padding:12px 20px;background:#4a90e2;color:#fff;border:none;border-radius:8px;font-size:15px;cursor:pointer;width:100%;';
    submitBtn.onclick=function(){
      if(selected.length===0){alert('请至少选择一个选项');return;}
      judgeOne(selected);
      submitBtn.disabled=true;
      submitBtn.style.background='#c5d5ea';
    };
    card.appendChild(submitBtn);
  }
  var expDiv=document.createElement('div');
  expDiv.className='explanation';
  expDiv.textContent=item.exp?'解析：'+item.exp:'';
  card.appendChild(expDiv);
  quiz.appendChild(card);

  function judgeOne(chosen){
    var isCorrect=false;
    if(isMulti){
      if(chosen.length===ansArr.length){
        var sc=chosen.slice().sort().join('');
        var sa=ansArr.slice().sort().join('');
        isCorrect=(sc===sa);
      }
    }else{
      isCorrect=ansArr.indexOf(chosen[0])!==-1;
    }
    for(var i=0;i<allButtons.length;i++){
      var b=allButtons[i];
      var letter=b.textContent.charAt(0);
      if(ansArr.indexOf(letter)!==-1)b.classList.add('correct');
      if(!isCorrect&&chosen.indexOf(letter)!==-1&&ansArr.indexOf(letter)===-1)b.classList.add('wrong');
      b.classList.add('disabled');
      b.style.background='';
      b.style.borderColor='';
    }
    if(isCorrect){
      correct++;
      answered++;
      expDiv.classList.add('show');
      document.getElementById('stats').textContent='已答 '+answered+' / '+flat.length+' 题，正确 '+correct+' 题';
      showNextBar(true);
      var countdown=3;
      var btn=document.querySelector('.quiz-nav .next-btn:last-child');
      var timer=setInterval(function(){
        countdown--;
        if(btn)btn.textContent='即将跳转… '+countdown;
        if(countdown<=0){clearInterval(timer);currentQuestionIndex++;renderOneQuestion();}
      },500);
    }else{
      answered++;
      document.getElementById('stats').textContent='已答 '+answered+' / '+flat.length+' 题，正确 '+correct+' 题';
      expDiv.classList.add('show');
      showNextBar(false);
    }
  }
}

function showNextBar(mode){
  var oldBar=document.getElementById('quiz-nav-bar');
  if(oldBar)oldBar.remove();
  var bar=document.createElement('div');
  bar.className='quiz-nav';
  bar.id='quiz-nav-bar';
  var flat=chapters[currentChapter]._flat;
  if(mode==='chapter-end'){
    var progress=document.createElement('div');
    progress.className='progress-text';
    progress.textContent='本章完成';
    bar.appendChild(progress);
    var prevBtn=document.createElement('button');
    prevBtn.className='next-btn';
    prevBtn.textContent='上一章';
    prevBtn.disabled=(currentChapter===0);
    prevBtn.onclick=function(){prevChapter();};
    bar.appendChild(prevBtn);
    var nextBtn=document.createElement('button');
    nextBtn.className='next-btn';
    nextBtn.textContent='下一章';
    nextBtn.disabled=(currentChapter===chapters.length-1);
    nextBtn.onclick=function(){nextChapter();};
    bar.appendChild(nextBtn);
    document.body.appendChild(bar);
    return;
  }
  var isLast=(currentQuestionIndex>=flat.length-1);
  if(isLast){
    var progress=document.createElement('div');
    progress.className='progress-text';
    progress.textContent='本章最后一题';
    bar.appendChild(progress);
    var prevBtn=document.createElement('button');
    prevBtn.className='next-btn';
    prevBtn.textContent='上一题';
    prevBtn.disabled=(currentQuestionIndex===0);
    prevBtn.onclick=function(){if(currentQuestionIndex>0){currentQuestionIndex--;renderOneQuestion();}};
    bar.appendChild(prevBtn);
    var nextChapterBtn=document.createElement('button');
    nextChapterBtn.className='next-btn';
    nextChapterBtn.textContent='下一章';
    nextChapterBtn.disabled=(currentChapter===chapters.length-1);
    nextChapterBtn.onclick=function(){nextChapter();};
    bar.appendChild(nextChapterBtn);
    document.body.appendChild(bar);
    return;
  }
  var autoNext=(mode===true);
  var progress=document.createElement('div');
  progress.className='progress-text';
  progress.textContent=(currentQuestionIndex+1)+' / '+flat.length;
  bar.appendChild(progress);
  var prevBtn=document.createElement('button');
  prevBtn.className='next-btn';
  prevBtn.textContent='上一题';
  prevBtn.disabled=(currentQuestionIndex===0);
  prevBtn.onclick=function(){if(currentQuestionIndex>0){currentQuestionIndex--;renderOneQuestion();}};
  bar.appendChild(prevBtn);
  var nextBtn=document.createElement('button');
  nextBtn.className='next-btn';
  nextBtn.textContent=autoNext?'即将跳转…':'下一题';
  nextBtn.disabled=autoNext;
  nextBtn.onclick=function(){currentQuestionIndex++;renderOneQuestion();};
  bar.appendChild(nextBtn);
  document.body.appendChild(bar);
}
// ===== 全局滑动手势：右划上一题，左划下一题 =====
(function () {
  var touchStartX = 0, touchStartY = 0, isHorizontal = false;
  document.addEventListener('touchstart', function (e) {
    var target = e.target;
    if (target.closest && target.closest('#quiz')) {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
      isHorizontal = false;
    } else {
      touchStartX = 0;
      touchStartY = 0;
      isHorizontal = false;
    }
  }, { passive: true });
  document.addEventListener('touchmove', function (e) {
    if (touchStartX === 0 && touchStartY === 0) return;
    var dx = e.touches[0].clientX - touchStartX;
    var dy = e.touches[0].clientY - touchStartY;
    if (!isHorizontal && Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy)) {
      isHorizontal = true;
    }
    if (isHorizontal) {
      e.preventDefault();
    }
  }, { passive: false });
  document.addEventListener('touchend', function (e) {
    if (touchStartX === 0 && touchStartY === 0) { isHorizontal = false; return; }
    var endX = e.changedTouches[0].clientX;
    var endY = e.changedTouches[0].clientY;
    var dx = endX - touchStartX;
    var dy = endY - touchStartY;
    if (Math.abs(dx) > 50 && Math.abs(dy) < 80) {
      var flat = chapters[currentChapter] && chapters[currentChapter]._flat;
      if (flat) {
        if (dx > 0) {
          if (currentQuestionIndex > 0) { currentQuestionIndex--; renderOneQuestion(); }
        } else {
          if (currentQuestionIndex < flat.length - 1) { currentQuestionIndex++; renderOneQuestion(); }
        }
      }
    }
    touchStartX = 0;
    touchStartY = 0;
    isHorizontal = false;
  }, { passive: true });
})();
// ===== 滑动手势结束 =====
window.scrollTo(0, 0);
document.documentElement.scrollLeft = 0;
document.body.scrollLeft = 0;
initChapterSelect();
switchChapter(0);
</script></body></html>
