    ]},
    {type:"配伍选择题",subs:[
      {q:"48. 省级药品监督管理部门，对放射性药品生产企业开展检查的频次是（）不少于一次",opts:["A.每季度","B.每半年","C.每年","D.每三年"],ans:"C",exp:"本题考查药品生产监督管理。省级药品监督管理部门，对放射性药品生产企业开展检查的频次是每年不少于一次。"},
      {q:"49. 根据《关于印发药品经营质量管理规范现场检查指导原则的通知》，药品监督管理部门针对疫苗仓储配送企业的检查频次是（）不少于一次",opts:["A.每季度","B.每半年","C.每年","D.每三年"],ans:"C",exp:"本题考查药品经营质量管理规范现场检查指导原则的主要内容。药品监督管理部门针对疫苗仓储配送企业的检查频次是每年不少于一次。"}

      {q:"52. 与境内上市药品共用生产线的药品在境外召回启动后，向所在地省级药品监督管理部门报告相关信息的是",opts:["A.药品上市许可持有人","B.境内代理人","C.境外药品上市许可持有人","D.药品批发企业"],ans:"B",exp:"本题考查药品召回的实施。与境内上市药品共用生产线的药品在境外召回启动后，境内代理人应当于境外召回启动后10个工作日内，向所在地省级药品监督管理部门报告召回药品的名称、规格、批次、召回原因等信息。"}

    {type:"配伍选择题",subs:[
      {q:"53. 复方地芬诺酯片上市许可持有人所持有的生产许可证分类码第一位为",opts:["A.大写字母A","B.大写字母B","C.小写字母d","D.大写字母C"],ans:"A",exp:"本题考查药品生产许可。复方地芬诺酯片属于第二类精神药品，其药品上市许可持有人不得委托生产，只能自行生产。复方地芬诺酯片上市许可持有人所持有的生产许可证分类码第一位为大写字母A。"},

    {type:"配伍选择题",subs:[
      {q:"56. 药品批发企业的出库记录应该包括",opts:["A.药品的通用名称、规格、剂型、数量、价格、生产厂商、供货单位、购货日期等","B.药品的通用名称、规格、批准文号、批号、剂型、有效期、生产厂商、生产日期、供货单位、到货日期、到货数量、验收合格数量、验收结果等","C.药品的通用名称、规格、生产厂商、购货单位、剂型、批号、有效期、销售数量、销售日期、单价、金额等","D.购货单位、药品的通用名称、剂型、规格、数量、批号、有效期、生产厂商、出库日期、质量状况和复核人员等"],ans:"D",exp:"本题考查药品经营质量管理规范-药品批发企业的流程管理。药品批发企业的出库记录应该包括：购货单位、药品的通用名称、剂型、规格、数量、批号、有效期、生产厂商、出库日期、质量状况和复核人员等。"},

    ]},
    {type:"配伍选择题",subs:[
      {q:"58. 药品批发企业，中药材与中药饮片应当",opts:["A.分开储存","B.分区陈列","C.专库储存","D.分库储存"],ans:"D",exp:"本题考查药品经营质量管理规范-药品批发企业的流程管理。中药材与中药饮片应当分库储存。"},

    {type:"配伍选择题",subs:[
      {q:"60. 储存药品的冷库制冷风机出风口距离（）米内、高于出风口的位置不得摆放药品",opts:["A.1","B.2","C.3","D.5"],ans:"A",exp:"本题考查药品经营质量管理规范附录文件。储存药品的冷库制冷风机出风口距离100厘米（1米）内、高于出风口的位置不得摆放药品。"},
      {q:"61. 运输状态下，温湿度自动监测系统记录频次是每（）分钟至少记录1次数据",opts:["A.1","B.2","C.3","D.5"],ans:"D",exp:"本题考查药品经营质量管理规范附录文件。运输状态下，温湿度自动监测系统记录频次是每5分钟至少记录1次数据。"},

      {q:"65. 通常会影响质量管理体系的完整性，企业违反后没有整改余地的属于",opts:["A.严重缺陷项目","B.主要缺陷项目","C.次要缺陷项目","D.一般缺陷项目"],ans:"A",exp:"本题考查药品经营质量管理规范现场检查指导原则的主要内容。通常会影响质量管理体系的完整性，企业违反后没有整改余地的属于严重缺陷项目。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"66. 重复给药的处方为",opts:["A.合格处方","B.不规范处方","C.用药不适宜处方","D.超常处方"],ans:"C",exp:"本题考查处方点评。根据处方点评的结果重复给药的处方为用药不适宜处方。"},
      {q:"67. 无正当理由为同一患者同时开具2种以上药理作用相同药物的处方为",opts:["A.合格处方","B.不规范处方","C.用药不适宜处方","D.超常处方"],ans:"D",exp:"本题考查处方点评。无正当理由为同一患者同时开具2种以上药理作用相同药物的处方为超常处方。"}

    {type:"配伍选择题",subs:[

    {type:"配伍选择题",subs:[
      {q:"71. 紧急情况下未经会诊同意或确需越处方权限使用的，处方限量不得超过1日用量的是",opts:["A.第二类精神药品（住院患者使用）","B.非限制使用级抗菌药物","C.限制使用级抗菌药物","D.特殊使用级抗菌药物"],ans:"D",exp:"本题考查抗菌药物的使用管理、抗菌药物应用监测。紧急情况下未经会诊同意或确需越处方权限使用特殊使用级抗菌药物的，处方限量不得超过1日用量。"},
      {q:"72. 预防感染、治疗轻度或者局部感染应当首选",opts:["A.第二类精神药品（住院患者使用）","B.非限制使用级抗菌药物","C.限制使用级抗菌药物","D.特殊使用级抗菌药物"],ans:"B",exp:"本题考查抗菌药物的使用管理、抗菌药物应用监测。预防感染、治疗轻度或者局部感染应当首选非限制使用级抗菌药物。"},
      {q:"73. 具有中级以上专业技术职务任职资格的医师方可开具处方的是",opts:["A.第二类精神药品（住院患者使用）","B.非限制使用级抗菌药物","C.限制使用级抗菌药物","D.特殊使用级抗菌药物"],ans:"C",exp:"本题考查抗菌药物的使用管理、抗菌药物应用监测。具有中级以上专业技术职务任职资格的医师方可开具处方的是限制使用级抗菌药物。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"74. 既属于列入食药物质管理，又属于列入《非首次进口药材品种目录》的是",opts:["A.山茱萸","B.黄芪","C.西红花","D.胖大海"],ans:"C",exp:"本题考查食药物质管理、进口药材的规定。山茱萸、西红花、黄芪为列入食药物质目录的品种，西红花、胖大海为列入《非首次进口药材品种目录》的品种。既属于列入食药物质管理，又属于列入《非首次进口药材品种目录》的是西红花。"},
      {q:"75. 既属于列入食药物质管理，又属于列入《国家重点保护的野生药材名录》的是",opts:["A.山茱萸","B.黄芪","C.西红花","D.胖大海"],ans:"A",exp:"本题考查食药物质管理、野生药材资源保护。山茱萸、西红花、黄芪为列入食药物质目录的品种，山茱萸为列入《国家重点保护的野生药材名录》的品种。既属于列入食药物质管理，又属于列入《国家重点保护的野生药材名录》的是山茱萸。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"76. 注射用A型肉毒毒素生产企业应当指定具有相应资质的药品经营企业作为注射用A型肉毒毒素的经营主体，并及时将经营情况向生产企业所在地",opts:["A.市级药品监督管理部门备案","B.市级药品监督管理部门批准","C.省级药品监督管理部门备案","D.省级药品监督管理部门批准"],ans:"C",exp:"本题考查医疗用毒性药品生产、经营管理。注射用A型肉毒毒素生产企业应当指定具有医疗用毒性药品收购经营资质的药品批发企业作为注射用A型肉毒毒素的经营企业，并及时将经营情况向生产企业所在地省级药品监督管理部门备案。"},
      {q:"77. 因医疗急需、运输困难等情况，区域性批发企业之间调剂麻醉药品的应当在调剂后相应时间内将调剂情况分别报所在地",opts:["A.市级药品监督管理部门备案","B.市级药品监督管理部门批准","C.省级药品监督管理部门备案","D.省级药品监督管理部门批准"],ans:"C",exp:"本题考查麻醉药品和精神药品经营。因医疗急需、运输困难等情况，区域性批发企业之间调剂麻醉药品的应当在调剂后2日内将调剂情况分别报所在地省级药品监督管理部门备案。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"78. 纳入麻醉药品销售渠道，仅能由麻醉药品全国性批发企业、区域性批发企业经销的是",opts:["A.亚砷酸注射液","B.小包装麻黄素","C.蛋白同化制剂","D.复方甘草片"],ans:"B",exp:"本题考查药品类易制毒化学品的管理。小包装麻黄素纳入麻醉药品销售渠道，仅能由麻醉药品全国性批发企业、区域性批发企业经销。"},
      {q:"79. 药品批发企业从其他药品批发企业购进的，只能销售给本省的药品零售企业和医疗机构的是",opts:["A.亚砷酸注射液","B.小包装麻黄素","C.蛋白同化制剂","D.复方甘草片"],ans:"D",exp:"本题考查含特殊药品复方制剂的经营管理。药品批发企业从其他药品批发企业购进的，只能销售给本省的药品零售企业和医疗机构的是含特殊药品复方制剂（如：复方甘草片）。"},
      {q:"80. 进口时无需办理《进口药品通关单》的是",opts:["A.亚砷酸注射液","B.小包装麻黄素","C.蛋白同化制剂","D.复方甘草片"],ans:"C",exp:"本题考查含兴奋剂药品的管理。办理进口时无需办理《进口药品通关单》的是麻醉药品、精神药品、蛋白同化制剂、肽类激素。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"81. 对于可用于儿童的药品需在（）注明“儿童必须在成人监护下使用”",opts:["A.【不良反应】","B.【注意事项】","C.【禁忌】","D.【用法用量】"],ans:"B",exp:"本题考查药品说明书管理规定。对于可用于儿童的药品需在【注意事项】注明“儿童必须在成人监护下使用”。"},
      {q:"82. 接种预防用生物制品后可能出现的偶然或一过性反应的描述，以及是否需要特殊处理的建议需要在（）列明",opts:["A.【不良反应】","B.【注意事项】","C.【禁忌】","D.【用法用量】"],ans:"A",exp:"本题考查药品说明书管理规定。接种预防用生物制品后可能出现的偶然或一过性反应的描述，以及是否需要特殊处理的建议需要在【不良反应】列明。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"83. 背包贩销售被污染的药品，尚不足以认定为“对人体健康造成严重危害”，销售金额9万元的",opts:["A.处3年以上10年以下有期徒刑，并处罚金","B.不构成犯罪，对企业处以货值金额10倍以上20倍以下罚款","C.处10年以上有期徒刑、无期徒刑或死刑，并处罚金或没收财产","D.按销售伪劣产品罪定罪处罚"],ans:"D",exp:"本题考查生产销售假（劣）药的刑事责任。销售被污染药品（劣药），尚不足以认定为“对人体健康造成严重危害”，销售金额9万元（超过5万元）的按销售伪劣产品罪定罪处罚。"},
      {q:"84. 医生销售假药，经医院出具医学证明，对人体肝脏导致一般功能障碍的",opts:["A.处3年以上10年以下有期徒刑，并处罚金","B.不构成犯罪，对企业处以货值金额10倍以上20倍以下罚款","C.处10年以上有期徒刑、无期徒刑或死刑，并处罚金或没收财产","D.按销售伪劣产品罪定罪处罚"],ans:"A",exp:"本题考查生产销售假（劣）药的刑事责任。销售假药，经医院出具医学证明对人体肝脏导致一般功能障碍的属于“对人体造成严重健康危害”，处3年以上10年以下有期徒刑，并处罚金。"},
      {q:"85. 医生在诊所销售假药且金额达到80万元的",opts:["A.处3年以上10年以下有期徒刑，并处罚金","B.不构成犯罪，对企业处以货值金额10倍以上20倍以下罚款","C.处10年以上有期徒刑、无期徒刑或死刑，并处罚金或没收财产","D.按销售伪劣产品罪定罪处罚"],ans:"C",exp:"本题考查生产销售假（劣）药的刑事责任。销售假药的金额达到80万元的属于“其他特别严重情节”，处10年以上有期徒刑、无期徒刑或死刑，并处罚金或没收财产。"}
    ]},

    // ===== 三、综合分析选择题（86-95） =====
    {type:"最佳选择题",q:"86. 在从业的过程当中仲某先后取得了药学类和中药学类别的执业药师资格，下列关于其取得执业药师职业资格证书说法正确的是",opts:["A.若仲某取得药学类高级职称，则参加中药学执业药师考试可以免试两科","B.若2017年仲某报考执业药师（药学类）通过了药事管理与法规考试，其余三科未通过的需要在2020年之前（包括2020年）通过才能保证2017年的成绩有效","C.仲某在西藏自治区参加考试通过了国家合格分数线，其考试成绩仅在西藏自治区内有效","D.考试的日常管理工作由相关部门委托给人力资源社会保障部人事考试中心负责"],ans:"B",exp:"本题考查执业药师职业资格考试管理。取得药学类高级职称可以免考药学类执业药师两科。通过了国家合格线后，其考试成绩在全国范围内有效。考试的日常管理工作由相关部门委托给国家药品监督管理局执业药师资格认证中心负责。"},
    {type:"最佳选择题",q:"87. 下列关于仲某申请相关执业药师注册注册程序的说法正确的是",opts:["A.仲某需要通过全国执业药师注册管理信息系统向西藏自治区药品监督管理部门申请注册","B.仲某取得药学执业药师资格后，又通过了中药学类执业药师考试，可以申请变更注册类别为药学类与中药学类，药品监督管理部门准予变更注册的，注册证有效期重新计算，有效期5年","C.仲某申请延续注册时，注册证有效期自旧证期满当日开始重新计算5年","D.若仲某因病无法在职在岗执业超过1个月的，其本人应当主动申请注销执业药师注册证"],ans:"A",exp:"本题考查执业药师注册。药品监督管理部门准予执业药师注册证变更注册的，注册证有效期不变。申请执业药师注册证延续注册时，注册证有效期自旧证期满之日次日起重新计算5年。执业药师无正当理由不在岗超过1个月的，可由执业药师本人或者其执业单位申请注销注册。"},
    {type:"最佳选择题",q:"88. 根据案例信息，仲某自行开展执业药师继续教育的说法错误的是",opts:["A.仲某参加直接由西藏自治区人力资源和社会保障部举办的执业药师继续教育活动的，主办方不得收取任何费用","B.基于仲某2022年的突出贡献，可由其用人单位出具证明，由省级药品监督管理部门确认符合要求的，最多可折算为当年继续教育60学时","C.仲某独立发表执业药师学术论文的，每一篇论文最多折算10学时","D.仲某因疾病等特殊原因无法完成2024年继续教育的，可于2025年补学完成上一年度规定的学时，其中专业科目至少为60学时"],ans:"B",exp:"本题考查执业药师继续教育管理。参与援藏、援疆、援青等援派工作期间视同完成年度继续教育学时。"},
    {type:"最佳选择题",q:"89. 下列关于该药业科技集团申请“恒古骨伤愈合剂”中药品种保护的说法错误的是",opts:["A.申请成功后，该品种适用于《中药品种保护条例》的管理范围","B.申请成功后，该品种首次可以申请长达20年的保护期限","C.申请成功后，若延长保护期限，则延长的保护期限不得超过首次的保护期限","D.国家药品监督管理局受理该品种保护申请后，需要在其政府网站予以公示，公示期期间，可以受理该品种的仿制申请"],ans:"D",exp:"本题考查中药品种保护。对已受理的中药品种保护申请，将在国家药品监督管理局政府网站予以公示。自公示之日起至作出行政决定期间，各地一律暂停受理该品种的仿制申请。"},
    {type:"最佳选择题",q:"90. 申请成功后，针对“恒古骨伤愈合剂”列入中药保护品种的保护措施和相应说法错误的是",opts:["A.该品种的处方组成、工艺制法在保护期内由获得《中药保护品种证书》的生产企业和有关的药品监督管理部门、单位和个人负责保密不得公开","B.除临床用药紧张另有规定外，该被批准保护的中药品种在保护期内仅限于已获得该品种的《中药保护品种证书》的企业生产","C.若该药业科技集团累计2年不缴纳保护品种年费的，省级药品监督管理部门将提前终止保护，收回其保护审评批件及证书提前终止保护","D.国家药品监督管理局将在政府网站和《中国医药报》上予以公告"],ans:"C",exp:"本题考查中药品种保护。累计2年不缴纳保护品种年费的，国家药品监督管理局将提前终止保护，收回其保护审评批件及证书。"},
    {type:"最佳选择题",q:"91. 下列关于维生素D钙片取得广告批准文号说法中错误的是",opts:["A.该广告批准文号中的“X”可以为“视”","B.提出该品种广告申请时其申请产品注册证明文件或者生产许可文件中剩余有效期最短的应当为3年","C.该品种的广告可以在全国范围内发布广告","D.该广告内容若需要改动的，应当重新提出广告申请审查"],ans:"B",exp:"本题考查药品广告的主管部门和申请审批。药品广告批准文号的有效期应当与产品注册证明文件、备案凭证或者生产许可文件最短的有效期一致。案例中2025年3月19日取得药品广告批准文号为【粤药广审（X）第260318-00012】，“260318”为其有效期的截止日期，即有效期到2026年03月18日，得知该广告批准文号有效期为1年。因此该品种的相关产品注册证明文件或者生产许可文件最短的有效期还剩余1年。"},
    {type:"最佳选择题",q:"92. 该药品广告的广告主是",opts:["A.甲药业集团","B.乙广告公司","C.丙生产企业","D.广东省电视台"],ans:"A",exp:"本题考查药品广告的相关界定。广告主是指为推销商品或者服务，自行或者委托他人设计、制作、发布广告的自然人、法人或者其他组织。该药品广告的广告主是甲药业集团。"},
    {type:"最佳选择题",q:"93. 下列关于发布该药品广告说法错误的是",opts:["A.不得使用科研单位、学术机构、行业协会或者专家、学者、医师、药师、临床营养师、患者等的名义或者形象作推荐、证明发布该药品广告","B.不得在针对未成年人的网站、网页、互联网应用程序、公众号等互联网媒介上发布该药品广告","C.可以宣传乙类非处方药“安全”“毒副作用小”的内容","D.可以在公众媒介发布该药品广告内容"],ans:"C",exp:"本题考查药品广告发布的规定和要求。药品广告不可以宣传药品“安全”“毒副作用小”等内容。"},
    {type:"最佳选择题",q:"94. 针对上述主体，相关药品监督管理部门检查频次由高到低分别是",opts:["A.甲=丙、乙、丁","B.甲、乙=丙、丁","C.丙、甲、乙、丁","D.丙、甲、乙=丁"],ans:"B",exp:"本题考查药品经营质量管理规范现场检查指导原则主要内容、药品生产监督管理。对药品生产企业的检查频次：①对麻醉药品、第一类精神药品、药品类易制毒化学品生产企业每季度检查不少于一次，甲为此种情形；②对疫苗、血液制品、放射性药品、医疗用毒性药品、无菌药品等高风险药品生产企业，每年不少于一次药品生产质量管理规范符合性检查，乙为此种情形；③对上述产品之外的药品生产企业，每年抽取一定比例开展监督检查，但应当在三年内对本行政区域内企业全部进行检查；④对原料、辅料、直接接触药品的包装材料和容器等供应商、生产企业每年抽取一定比例开展监督检查，五年内对本行政区域内企业全部进行检查，丁为此种情形。对药品经营企业的检查频次：①对麻醉药品和第一类精神药品、药品类易制毒化学品经营企业检查，每半年不少于1次；②对冷藏冷冻药品、血液制品、细胞治疗类生物制品、第二类精神药品、医疗用毒性药品、放射性药品经营企业、疫苗仓储配送企业检查，每年不少于1次，丙为此种情形；③对经营上述药品之外的其他药品经营企业检查，每3年不少于1次。所以频次：甲>乙=丙>丁，即B选项。"},
    {type:"最佳选择题",q:"95. 针对上述主体实施现场检查的说法中错误的是",opts:["A.相关省级药品监督管理部门负责对甲、乙的监督检查","B.相关省级药品监督管理部门负责对丁的监督检查","C.相关省级药品监督管理部门负责对丙的监督检查","D.应当按照零售企业检查项目对丙实施检查"],ans:"D",exp:"本题考查药品经营质量管理规范现场检查指导原则主要内容、药品生产监督管理。对药品零售连锁总部的现场检查应当按照批发企业检查项目实施检查。"},

    // ===== 四、多项选择题（96-100） =====
    {type:"多项选择题",q:"96. 下列关于药品上市许可持有人的说法正确的有",opts:["A.药品上市许可持有人销售其取得药品注册证书的放射性药品，需要符合经营放射性药品的经营条件，无需另行取得《放射性药品经营许可证》","B.经过国家药品监督管理局批准，药品上市许可持有人可以依法转让药品上市许可","C.药品上市许可持有人应当报告其获知的所有不良反应，按照可疑即报原则，直接通过国家药品不良反应监测系统报告","D.国产药品的定期安全性更新报告由药品上市许可持有人向国家药品不良反应监测中心提交"],ans:"ABC",exp:"本题考查药品不良反应报告与监测。国产药品的定期安全性更新报告向药品上市许可持有人、生产企业所在地省级药品不良反应监测机构提交；进口药品的定期安全性更新报告向国家药品不良反应监测中心提交。"},
    {type:"多项选择题",q:"97. 关于针对药品网络交易第三方平台检查类型的适用情形，以下应当开展常规检查的情形有",opts:["A.投诉举报、网络抽检等提示可能存在风险的","B.首次开展第三方平台业务的","C.未能及时识别、制止相关风险的","D.开展第三方平台业务无药品流通专业背景的"],ans:"BD",exp:"本题考查药品网络销售的总体要求。常规检查重点考虑因素为首次开展第三方平台业务的；开展第三方平台业务无药品流通专业背景的；第三方平台经营规模大、覆盖范围广、业务量较大的。有因检查重点考虑因素为网络监测、群众信访、投诉举报、舆情信息、网络抽检等提示可能存在风险的；未能及时识别、发现、制止、报告相关风险的；未严格审核管理平台内药品信息、链接和药品销售活动的；既往多次检查不符合要求的；管理体系与关键岗位负责人发生重大调整的；未及时整改监督检查发现缺陷项的；药品监管部门认为需要开展检查的其他情况。"},
    {type:"多项选择题",q:"98. 下列关于麻醉药品、精神药品的管理中说法有误的包括",opts:["A.供医疗、科学研究、教学使用的小包装的麻醉药品原料药可以由省级药品监督管理部门规定的药品批发企业经营","B.从事第二类精神药品批发业务的企业，可以将第二类精神药品销售给定点生产企业、具有第二类精神药品经营资格的药品批发企业、医疗机构、从事第二类精神药品零售的药品零售连锁企业","C.市级卫生健康主管部门自收到医疗机构变更申请之日起5日内完成《印鉴卡》变更手续，并将变更情况抄送所在地同级药品监督管理部门、公安机关，报省级卫生健康主管部门备案","D.麻醉药品和精神药品的寄件单位应事先向所在地省级药品监督管理部门申请办理《麻醉药品、精神药品邮寄证明》，邮寄证明一证一次有效"],ans:"AD",exp:"本题考查麻醉药品和精神药品储存与运输。供医疗、科学研究、教学使用的小包装的麻醉药品原料药可以由国家药品监督管理部门规定的药品批发企业经营。麻醉药品和精神药品的寄件单位应事先向所在地设区的市级药品监督管理部门申请办理《麻醉药品、精神药品邮寄证明》，邮寄证明一证一次有效。"},
    {type:"多项选择题",q:"99. 甲药品批发企业进口某境外品牌的人血白蛋白（治疗用生物制品），其标签标注生产日期为2023年5月8日，分装日期为2023年10月9日，有效期为2年，则该人血白蛋白的有效期可以标注为",opts:["A.2025年05月07日","B.2025年04月","C.2025年10月08日","D.2025年09月"],ans:"CD",exp:"本题考查药品包装标签管理规定。治疗用生物制品有效期的标注应自分装日期计算。有效期若标注到日，应当为起算日期对应年月日的前一天，有效期至2025年10月08日；若标注到月，应当为起算月份对应年月的前一月，有效期至2025年09月。"},
    {type:"多项选择题",q:"100. 根据药品安全法律责任的分类要求，下列仅属于行政处罚种类的包括",opts:["A.警告","B.没收违法所得","C.限制从业","D.行政拘留"],ans:"BCD",exp:"本题考查药品安全法律责任的界定和分类。行政处罚包括：①警告、通报批评；②罚款、没收违法所得、没收非法财物；③暂扣许可证件、降低资质等级、吊销许可证件；④限制开展生产经营活动、责令停产停业、责令关闭、限制从业；⑤行政拘留。行政处分包括：①警告；②记过；③记大过；④降级；⑤撤职；⑥开除。警告既属于行政处罚也属于行政处分。所以仅属于行政处罚的是没收违法所得、限制从业、行政拘留。"}
  ]
},
  {
  name: "押题密卷（九）·药事管理与法规",
  questions: [
    // ===== 一、最佳选择题（1-40） =====
    {type:"最佳选择题",q:"1. （）是建设健康中国的基本路径，（）是建设健康中国的根本目的",opts:["A.共建共享、全民健康","B.全民健康、共建共享","C.共建共享、全民医保","D.预防为主、全民健康"],ans:"A",exp:"本题考查健康中国的战略主题。共建共享是建设健康中国的基本路径，全民健康是建设健康中国的根本目的。"},
    {type:"最佳选择题",q:"2. 根据药品管理的分类，下列不属于管理分类的是",opts:["A.处方药和非处方药","B.抗菌药和抗肿瘤药","C.仿制药和原研药","D.甲类非处方药和乙类非处方药"],ans:"B",exp:"本题考查药品管理的分类。药品管理的分类包括：处方药与非处方药（包括甲类和乙类）、新药、仿制药、原研药、进口药品、医疗机构制剂、实行特殊管理的药品。抗菌药和抗肿瘤药属于药品本身的作用性质，不属于管理分类。"},
    {type:"最佳选择题",q:"3. 药品通用名的英文简称是",opts:["A.CADN","B.CADS","C.CADM","D.CADV"],ans:"A",exp:"本题考查药品命名的规定。我国的药品通用名称（CADN）是由国家药典委员会按国家药品通用名称命名原则制订的并报国家药品监督管理部门备案的药品法定名称。"},
    {type:"最佳选择题",q:"4. 下列不属于我国多层次医疗保障制度体系组成内容的是",opts:["A.商业健康保险","B.慈善捐赠","C.失业保险","D.医疗互助"],ans:"C",exp:"本题考查医疗保障制度概述。全面建成以基本医疗保险为主体，医疗救助为托底，补充医疗保险、商业健康保险、慈善捐赠、医疗互助共同发展的多层次医疗保障制度体系。"},
    {type:"最佳选择题",q:"5. 国家卫生健康委员会制定的规章和省级人民政府制定的规章对同一事项的规定不一致时，由（）裁决",opts:["A.国家卫生健康委员会","B.全国人民代表大会常务委员会","C.国务院","D.省人民代表大会常务委员会"],ans:"C",exp:"本题考查法的效力冲突及解决。国家卫生健康委员会制定的规章属于部门规章，省级人民政府制定的规章属于地方政府规章，部门规章和地方政府规章对同一事项的规定不一致时由国务院裁决。"},
    {type:"最佳选择题",q:"6. 下列选项中，属于行政强制措施的是",opts:["A.限制公民人身自由","B.限制开展生产活动","C.限制从业","D.限制开展经营活动"],ans:"A",exp:"本题考查行政强制。行政强制措施的种类包括：①限制公民人身自由；②查封场所设施或者财物；③扣押财物；④冻结存款、汇款。BCD均属于行政处罚。"},
    {type:"最佳选择题",q:"7. 下列关于药品标准的说法，错误的是",opts:["A.国务院药品监督管理部门会同国务院卫生健康主管部门组织药典委员会，负责国家药品标准的制定和修订","B.经国务院药品监督管理部门核准的药品质量标准高于国家药品标准的，按照国家药品标准执行","C.各省级药品监督管理部门应当根据中国国家药品标准收载品种实施情况及时调整各省级中药标准目录，废止同品种的省级中药标准","D.药品注册标准应当符合《中国药典》通用技术要求，不得低于《中国药典》的规定"],ans:"B",exp:"本题考查药品标准。经国务院药品监督管理部门核准的药品质量标准高于国家药品标准的，按照经核准的药品质量标准执行。"},
    {type:"最佳选择题",q:"8. 下列关于药物临床试验机构管理说法错误的是",opts:["A.药物临床试验机构应当符合相应条件，实行备案管理","B.仅开展与药物临床试验相关的生物样本等分析的机构，无需备案","C.药物临床试验机构未按照规定备案的，国家药品监督管理局不接受其完成的药物临床试验数据用于药品行政许可","D.疫苗临床试验应当由符合国务院药品监督管理部门和国务院卫生健康主管部门规定条件的二级甲等以上医疗机构或者省级以上疾病预防控制机构实施或者组织实施"],ans:"D",exp:"本题考查药物临床试验质量管理规范。疫苗临床试验应当由符合国务院药品监督管理部门和国务院卫生健康主管部门规定条件的三级医疗机构或者省级以上疾病预防控制机构实施或者组织实施。"},
    {type:"最佳选择题",q:"9. 对药物临床试验申请应当自受理之日起（）内决定是否同意开展，并通过药品审评中心网站通知申请人审批结果；逾期未通知的，视为（）",opts:["A.90日，同意","B.60日，不同意","C.90日，不同意","D.60日，同意"],ans:"D",exp:"本题考查药物临床试验质量管理规范。对药物临床试验申请应当自受理之日起60日内决定是否同意开展，并通过药品审评中心网站通知申请人审批结果；逾期未通知的，视为同意。"},
    {type:"最佳选择题",q:"10. 根据药品注册管理机构的事权划分，下列不属于国家药品监督管理局药品审评中心事权的是",opts:["A.药物临床试验申请审评工作","B.境内生产药品再注册申请审评工作","C.补充申请审评工作","D.境外生产药品再注册申请审评工作"],ans:"B",exp:"本题考查药品注册管理机构和事权划分。国家药品监督管理局药品审评中心负责药物临床试验申请、药品上市许可申请、补充申请和境外生产药品再注册申请等的审评。境内生产药品再注册申请的受理、审查和审批属于省级药品监督管理部门事权。"},
    {type:"最佳选择题",q:"11. 《药品生产许可证》的许可事项是指",opts:["A.质量负责人和质量受权人","B.生产地址和生产负责人","C.生产范围和生产地址","D.质量负责人和生产负责人"],ans:"C",exp:"本题考查药品生产许可证管理。《药品生产许可证》的许可事项是指生产地址和生产范围。"},
    {type:"最佳选择题",q:"12. 卫生（药）系列职称药学技术人员不包括",opts:["A.药师","B.主管药师","C.副主任药师","D.临床药师"],ans:"D",exp:"本题考查从事药品经营活动应具备的条件。卫生（药）系列职称包含：药士、药师、主管药师、副主任药师、主任药师。"},
    {type:"最佳选择题",q:"13. 药品上市许可持有人销售药品活动中的有关资质材料和销售凭证、记录保存不得少于（）年，且不少于药品有效期满后（）年",opts:["A.3,1","B.2,1","C.5,1","D.5,3"],ans:"C",exp:"本题考查经营管理总体要求。药品上市许可持有人销售药品活动中的有关资质材料和销售凭证、记录保存不得少于5年，且不少于药品有效期满后1年。"},
    {type:"最佳选择题",q:"14. 疫苗上市许可持有人不得向除（）外的其他任何单位或个人销售疫苗",opts:["A.接种单位","B.疾病预防控制机构","C.药品批发企业","D.药品生产企业"],ans:"B",exp:"本题考查药品上市许可持有人经营管理。疫苗上市许可持有人不得向除疾病预防控制机构外的其他任何单位或个人销售疫苗。"},
    {type:"最佳选择题",q:"15. 药品上市许可持有人不得在展销会、博览会、交易会、订货会、产品宣传会上",opts:["A.销售药品","B.赠送药品","C.预订药品","D.宣传药品"],ans:"B",exp:"本题考查药品经营管理。药品上市许可持有人不得在展销会、博览会、交易会、订货会、产品宣传会上现货销售药品或赠送药品。"},
    {type:"最佳选择题",q:"16. 下列药品中，药品零售企业禁止销售的是",opts:["A.医疗用毒性药品","B.含药品类易制毒化学品复方制剂","C.含麻醉药品复方制剂","D.注射用A型肉毒毒素"],ans:"D",exp:"本题考查药品零售的经营管理要求。药品零售企业不得经营注射用A型肉毒毒素，同时也不得经营麻醉药品和药品类易制毒化学品，但是含药品类易制毒化学品复方制剂和含麻醉药品复方制剂可以经营。"},
    {type:"最佳选择题",q:"17. 疫苗不得与（）混车、混箱运输",opts:["A.中药注射剂","B.保健食品","C.血液制品","D.医疗用毒性药品"],ans:"B",exp:"本题考查涉药储运行为的管理。疫苗与非药品不得混库储存或混车、混箱运输；疫苗与其他药品混库储存或混车、混箱运输时，应当采取有效措施，防止交叉污染与发生混淆。"},
    {type:"最佳选择题",q:"18. 药品网络销售的主体不包括",opts:["A.药品上市许可持有人","B.中药饮片生产企业","C.药品零售企业","D.医疗机构"],ans:"D",exp:"本题考查药品网络销售与平台服务管理要求。药品网络销售的主体，应当是具备保证网络销售药品安全能力（包括交易全程信息真实、准确、完整、可追溯以及对消费者个人信息保护等）的药品上市许可持有人（含中药饮片生产企业）或药品经营企业。"},
    {type:"最佳选择题",q:"19. 省级药品监督管理部门应当在第三方平台完成备案后（）个月内，组织对其开展现场检查，并确保之后（）不少于1次检查，引导其合法有序开展经营",opts:["A.3，每半年","B.3，每年","C.6，每2年","D.6，每年"],ans:"B",exp:"本题考查药品网络销售与平台服务管理要求。省级药品监督管理部门应当在第三方平台完成备案后3个月内，组织对其开展现场检查，并确保之后每年不少于1次检查，引导其合法有序开展经营。"},
    {type:"最佳选择题",q:"20. 国家对药品经营实施许可制度，在中华人民共和国境内经营药品必须依法持有《药品经营许可证》，除了",opts:["A.药品上市许可持有人销售其依法持有的药品","B.经营无特殊管理要求的中药材","C.经营特殊管理的麻醉药品","D.经营未实施审批管理的中药饮片"],ans:"B",exp:"本题考查药品经营许可。国家对药品经营实施许可制度，在中华人民共和国境内经营药品必须依法持有《药品经营许可证》（经营无特殊管理要求的中药材、药品上市许可持有人批发其依法持有的药品除外）。"},
    {type:"最佳选择题",q:"21. 二级以上医院药学部门负责人应当具有高等学校药学专业或者临床药学专业（）以上学历，及本专业（）技术职务任职资格",opts:["A.大专，高级","B.本科，中级","C.大专，中级","D.本科，高级"],ans:"D",exp:"本题考查医疗机构药学部门管理。二级以上医院药学部门负责人应当具有高等学校药学专业或者临床药学专业本科以上学历，及本专业高级技术职务任职资格。"},
    {type:"最佳选择题",q:"22. 下列关于药品采购的品种限制，说法错误的是",opts:["A.同一通用名称药品的品种，注射剂型和口服剂型各不得超过3种","B.同一通用名称药品的品种，处方组成类同的复方制剂1~2种","C.只允许同一药品，两种规格的存在","D.遴选儿童用药（仅限于药品说明书中有明确儿童适应症和儿童用法用量的药品）时，可不受“一品两规”限制"],ans:"A",exp:"本题考查公立医疗机构药品集中带量采购。同一通用名称药品的品种，注射剂型和口服剂型各不得超过2种。"},
    {type:"最佳选择题",q:"23. 对于处方的描述最准确的是",opts:["A.指出注册的执业医师和执业助理医师在诊疗活动中为患者开具并作为患者用药凭证的医疗文书","B.指出取得药学专业技术职务任职资格的药学专业技术人员审核、调配、核对，并作为患者用药凭证的医疗文书","C.指出注册的执业医师和执业助理医师在诊疗活动中为患者开具的、由取得药学专业技术职务任职资格的药学专业技术人员审核、调配、核对，并作为患者用药凭证的医疗文书","D.除（）和（）之外，通常情况下的中药材是农副产品，不能直接用于药品生产或入药配伍使用"],ans:"C",exp:"本题考查处方的一般规定。处方是指由注册的执业医师和执业助理医师在诊疗活动中为患者开具的、由取得药学专业技术职务任职资格的药学专业技术人员审核、调配、核对，并作为患者用药凭证的医疗文书。"},
    {type:"最佳选择题",q:"24. 除（）和（）之外，通常情况下的中药材是农副产品，不能直接用于药品生产或入药配伍使用",opts:["A.道地药材，鲜用药材","B.毒性中药材，鲜用药材","C.毒性中药材，罂粟壳","D.罂粟壳，道地药材"],ans:"C",exp:"本题考查中药与中药分类。除毒性中药材和罂粟壳之外，通常情况下的中药材是农副产品，不能直接用于药品生产或入药配伍使用。"},
    {type:"最佳选择题",q:"25. 中成药通用名命名基本原则不包括",opts:["A.科学简明，避免重名","B.规范命名，避免夸大疗效","C.用词精炼，通俗易懂","D.体现传统文化特色"],ans:"C",exp:"本题考查中成药的通用名称命名。中成药通用名命名基本原则包括：科学简明，避免重名；规范命名，避免夸大疗效；体现传统文化特色。"},
    {type:"最佳选择题",q:"26. 《中医药法》规定，生产符合国家规定条件的来源于古代经典名方的中药复方制剂，在申请药品批准文号时，可以仅提供",opts:["A.药效学研究资料","B.药理学研究资料","C.非临床安全性研究资料","D.临床试验资料"],ans:"C",exp:"本题考查古代经典名方中药复方制剂的管理。《中医药法》规定，生产符合国家规定条件的来源于古代经典名方的中药复方制剂，在申请药品批准文号时，可以仅提供非临床安全性研究资料。"},
    {type:"最佳选择题",q:"27. （）由国务院卫生健康主管部门会同国务院财政部门等组织集中招标或者统一谈判，形成并公布中标价格或者成交价格，各省、自治区、直辖市实行统一采购",opts:["A.免疫规划疫苗","B.国家免疫规划疫苗以外的其他免疫规划疫苗","C.非免疫规划疫苗","D.国家免疫规划疫苗"],ans:"D",exp:"本题考查疫苗上市后管理。国家免疫规划疫苗由国务院卫生健康主管部门会同国务院财政部门等组织集中招标或者统一谈判，形成并公布中标价格或者成交价格，各省、自治区、直辖市实行统一采购。"},
    {type:"最佳选择题",q:"28. 违反相关规定，擅自进出口血液制品或者出口原料血浆的，由省级以上药品监督管理部门没收所进出口的血液制品或者所出口的原料血浆和违法所得，并处所进出口的血液制品或者所出口的原料血浆总值",opts:["A.1倍以上5倍以下的罚款","B.2倍以上5倍以下的罚款","C.3倍以上5倍以下的罚款","D.5倍以上10倍以下的罚款"],ans:"C",exp:"本题考查进出口血液制品的审批。违反相关规定，擅自进出口血液制品或者出口原料血浆的，由省级以上药品监督管理部门没收所进出口的血液制品或者所出口的原料血浆和违法所得，并处所进出口的血液制品或者所出口的原料血浆总值3倍以上5倍以下的罚款。"},
    {type:"最佳选择题",q:"29. 单位剂量麻黄碱类药物含量大于（）的含麻黄碱类复方制剂，列入必须凭处方销售的处方药管理",opts:["A.30mg（含30mg）","B.90mg（不含30mg）","C.30mg（不含30mg）","D.90mg（含30mg）"],ans:"C",exp:"本题考查含麻黄碱类复方制剂的管理。将单位剂量麻黄碱类药物含量大于30mg（不含30mg）的含麻黄碱类复方制剂，列入必须凭处方销售的处方药管理。"},
    {type:"最佳选择题",q:"30. 应当在药品说明书中列出全部辅料名称的是",opts:["A.注射剂和处方药","B.注射剂和非处方药","C.处方药和非处方药","D.注射剂和原研药"],ans:"B",exp:"本题考查药品说明书的编写和修改要求。药品说明书应当列出全部活性成分或者组方中的全部中药药味，注射剂和非处方药还应当列出所用的全部辅料名称。"},
    {type:"最佳选择题",q:"31. 2025年10月19日，张某看见一药品广告，其批准文号为：川药广审（视）第250709-10334号，下列关于该广告说法正确的是",opts:["A.该广告可继续在全国范围内发布","B.该广告由广东的广告审查机关审查","C.该广告涉及的药品是处方药","D.该广告不得发布"],ans:"D",exp:"本题考查药品广告的申请和审批。通过广告批准文号中间6位数得知该广告有效期截止日期为2025年7月9日，已然过期，所以该广告不得发布。"},
    {type:"最佳选择题",q:"32. 药品安全信息公开应当遵循的原则不包括",opts:["A.及时","B.准确","C.高效","D.客观"],ans:"C",exp:"本题考查药品安全信息。药品安全信息公开应当遵循全面、及时、准确、客观、公正的原则。"},
    {type:"最佳选择题",q:"33. 根据药品包装标签中标识的印刷要求，下列不需要印有专用标识的是",opts:["A.甲类非处方药","B.乙类非处方药","C.含药品类易制毒化学品复方制剂","D.放射性药品"],ans:"C",exp:"本题考查药品包装标签中标识的印刷要求。含药品类易制毒化学品复方制剂无专用标识。"},
    {type:"最佳选择题",q:"34. 境外医疗器械注册人、备案人和在境外销售国产医疗器械的注册人、备案人发现或获知在境外发生导致或可能导致严重伤害或者死亡的可疑不良事件的，应当在（）日内报告",opts:["A.7","B.20","C.15","D.30"],ans:"D",exp:"本题考查医疗器械不良事件的处理。境外医疗器械注册人、备案人和在境外销售国产医疗器械的注册人、备案人发现或获知在境外发生导致或可能导致严重伤害或者死亡的可疑不良事件的，应当在30日内报告。"},
    {type:"最佳选择题",q:"35. 下列不属于风险程度较高的化妆品新原料的是",opts:["A.具有防腐功能的新原料","B.具有防脱发功能的新原料","C.具有防晒功能的新原料","D.具有着色功能的新原料"],ans:"B",exp:"本题考查化妆品的界定和分类。具有防腐、防晒、着色、染发、祛斑美白功能的化妆品新原料为风险程度较高的化妆品新原料。"},
    {type:"最佳选择题",q:"36. 国产保健食品注册号格式为",opts:["A.国食健注G+4位年代号+6位顺序号","B.国食健注G+4位年代号+4位顺序号","C.国食健字G+4位年代号+4位顺序号","D.国食健注J+4位年代号+4位顺序号"],ans:"B",exp:"本题考查保健食品注册与备案管理。国产保健食品注册号格式为：国食健注G+4位年代号+4位顺序号。"},
    {type:"最佳选择题",q:"37. 生产、销售、使用假药、劣药、不符合强制性标准或者不符合经注册的产品技术要求的第三类医疗器械，以孕产妇、儿童、危重病人为主要使用对象的",opts:["A.可以从重处罚","B.可以从轻处罚","C.应当从重处罚","D.应当从轻处罚"],ans:"C",exp:"本题考查行政处罚裁量情形。生产、销售、使用假药、劣药、不符合强制性标准或者不符合经注册的产品技术要求的第三类医疗器械，以孕产妇、儿童、危重病人为主要使用对象的应当从重处罚。"},
    {type:"最佳选择题",q:"38. 未取得药品生产许可证、药品经营许可证或者医疗机构制剂许可证生产、销售药品的，责令关闭，没收违法生产、销售的药品和违法所得，并处违法生产、销售的药品货值金额",opts:["A.十五倍以上三十倍以下的罚款","B.十倍以上二十倍以下的罚款","C.十五倍以上五十倍以下的罚款","D.十倍以上三十倍以下的罚款"],ans:"A",exp:"本题考查无证生产、经营药品相关的法律责任。未取得药品生产许可证、药品经营许可证或者医疗机构制剂许可证生产、销售药品的，责令关闭，没收违法生产、销售的药品和违法所得，并处违法生产、销售的药品货值金额十五倍以上三十倍以下的罚款。"},
    {type:"最佳选择题",q:"39. 某地药品监管部门检查发现，一家药店销售的中药饮片“XX风湿灵胶囊”中非法添加了未标示的化学药物“双氯芬酸钠”（一种西药止痛成分），且该添加行为未经批准。根据《中华人民共和国药品管理法》，该批药品应被界定为",opts:["A.假药（属于药品所含成分与国家药品标准规定的成分不符）","B.劣药（属于药品成分的含量不符合国家药品标准）","C.假药（属于以非药品冒充药品）","D.劣药（属于超过有效期的药品）"],ans:"A",exp:"本题考查假（劣）药的情形界定。关键信息：非法添加了未标示的化学药物“双氯芬酸钠”。故属于药品所含成分与国家药品标准规定的成分不符，为假药。"},
    {type:"最佳选择题",q:"40. 生产、销售、提供劣药的，下列情形应当认定为刑法第一百四十二条规定的“对人体健康造成严重危害”是",opts:["A.致人重度残疾以上的","B.造成三人以上重伤的","C.造成轻伤的","D.造成五人以上轻度残疾的"],ans:"C",exp:"本题考查生产、销售、提供劣药的刑事责任。具有下列情形之一的，应当认定为刑法第一百四十二条规定的“对人体健康造成严重危害”：①造成轻伤或者重伤的；②造成轻度残疾或者中度残疾的；③造成器官组织损伤导致一般功能障碍或者严重功能障碍的。"},

    // ===== 二、配伍选择题（41-85） =====
    {type:"配伍选择题",subs:[
      {q:"41. 企业销售假药，对其相关责任人员的罚款为",opts:["A.所获收入百分之三十以上三倍以下","B.所获收入百分之十以上百分之五十以下","C.所获收入百分之五十以上五倍以下","D.所获收入一倍以上十倍以下"],ans:"A",exp:"本题考查生产、销售、使用假（劣）药的行政责任。生产、销售假药，生产、销售劣药且情节严重的，对相关责任人员：没收违法行为发生期间自本单位所获收入，并处所获收入30%以上3倍以下的罚款；终身禁止从事药品生产经营活动，还可由公安机关处5日以上15日以下的拘留。"},
      {q:"42. 企业严重违反药品质量管理规范且情节严重的，对其相关责任人员的罚款为",opts:["A.所获收入百分之三十以上三倍以下","B.所获收入百分之十以上百分之五十以下","C.所获收入百分之五十以上五倍以下","D.所获收入一倍以上十倍以下"],ans:"B",exp:"本题考查违反药品质量管理规范的法律责任。违反药品质量管理规范情节严重的，对相关责任人员，没收违法行为发生期间自本单位所获收入，并处所获收入10%以上50%以下的罚款，10年直至终身禁止从事药品生产经营活动。"},

var currentChapter=0,answered=0,correct=0;
function initChapterSelect(){var sel=document.getElementById('chapterSelect');sel.innerHTML='';for(var i=0;i<chapters.length;i++){var opt=document.createElement('option');opt.value=i;opt.textContent=chapters[i].name;sel.appendChild(opt);}}
function switchChapter(index){currentChapter=parseInt(index);answered=0;correct=0;renderChapter();document.getElementById('chapterSelect').value=currentChapter;}
function prevChapter(){if(currentChapter>0)switchChapter(currentChapter-1);}
function nextChapter(){if(currentChapter<chapters.length-1)switchChapter(currentChapter+1);}
function updateNavButtons(){document.getElementById('prevBtn').disabled=(currentChapter===0);document.getElementById('nextBtn').disabled=(currentChapter===chapters.length-1);}
var currentQuestionIndex=0;

function renderChapter(){
  var ch=chapters[currentChapter];
  document.getElementById('chapterTitle').textContent=ch.name;
  var flat=[];
  for(var i=0;i<ch.questions.length;i++){
    var item=ch.questions[i];
    if(item.subs){
      for(var j=0;j<item.subs.length;j++){
        flat.push({type:'配伍选择题',q:item.subs[j].q,opts:item.subs[j].opts,ans:item.subs[j].ans,optImgs:item.subs[j].optImgs,img:item.subs[j].img});
      }
    }else{
      flat.push(item);
    }
  }
  ch._flat=flat;
  currentQuestionIndex=0;
  answered=0;
  correct=0;
  renderOneQuestion();
  updateNavButtons();
}

function renderOneQuestion(){
  var ch=chapters[currentChapter];
  var flat=ch._flat;
  var quiz=document.getElementById('quiz');
  quiz.innerHTML='';
  document.getElementById('stats').textContent='已答 '+answered+' / '+flat.length+' 题，正确 '+correct+' 题';
  var oldBar=document.getElementById('quiz-nav-bar');
  if(oldBar)oldBar.remove();
  if(currentQuestionIndex>=flat.length){
    quiz.innerHTML='<div class="card" style="text-align:center;padding:40px 20px;"><h2>🎉 本章已完成！</h2><p>共 '+flat.length+' 题，答对 '+correct+' 题</p></div>';
    showNextBar('chapter-end');
    return;
  }
  var item=flat[currentQuestionIndex];
  var card=document.createElement('div');
  card.className='card';
  var tag=document.createElement('div');
  tag.className='tag';
  tag.textContent=item.type+'  ·  第 '+(currentQuestionIndex+1)+' / '+flat.length+' 题';
  card.appendChild(tag);
  var title=document.createElement('div');
  title.className='q-title';
  title.textContent=item.q;
  card.appendChild(title);
  if(item.img){
    var imgEl=document.createElement('img');
    imgEl.src=item.img;
    imgEl.style.cssText='max-width:100%;display:block;margin:10px auto;border-radius:6px;';
    imgEl.onerror=function(){this.style.display='none';};
    card.appendChild(imgEl);
  }
  var ansArr=item.ans.split('');
  var isMulti=ansArr.length>1;
  var selected=[];
  var allButtons=[];
  for(var k=0;k<item.opts.length;k++){
    (function(opt, idx){
      var btn=document.createElement('button');
      btn.className='option';
      if(item.optImgs && item.optImgs[idx]){
        var letterSpan=document.createElement('span');
        letterSpan.textContent=opt+' ';
        letterSpan.style.cssText='display:inline-block;vertical-align:top;font-weight:600;margin-right:6px;';
        btn.appendChild(letterSpan);
        var optImg=document.createElement('img');
        optImg.src=item.optImgs[idx];
        optImg.style.cssText='max-width:85%;max-height:150px;display:inline-block;vertical-align:middle;border-radius:4px;';
        optImg.onerror=function(){this.style.display='none';};
        btn.appendChild(optImg);
      }else{
        btn.textContent=opt;
      }
      var letter=opt.charAt(0);
      btn.onclick=function(){
        if(btn.classList.contains('disabled'))return;
        if(isMulti){
          var ix=selected.indexOf(letter);
          if(ix===-1){selected.push(letter);btn.style.background='#d0e3ff';btn.style.borderColor='#4a90e2';}
          else{selected.splice(ix,1);btn.style.background='';btn.style.borderColor='';}
        }else{judgeOne([letter]);}
      };
      allButtons.push(btn);
      card.appendChild(btn);
    })(item.opts[k], k);
  }
  if(isMulti){
    var submitBtn=document.createElement('button');
    submitBtn.textContent='提交答案';
    submitBtn.style.cssText='margin-top:12px;padding:12px 20px;background:#4a90e2;color:#fff;border:none;border-radius:8px;font-size:15px;cursor:pointer;width:100%;';
    submitBtn.onclick=function(){
      if(selected.length===0){alert('请至少选择一个选项');return;}
      judgeOne(selected);
      submitBtn.disabled=true;
      submitBtn.style.background='#c5d5ea';
    };
    card.appendChild(submitBtn);
  }
  var expDiv=document.createElement('div');
  expDiv.className='explanation';
  expDiv.textContent=item.exp?'解析：'+item.exp:'';
  card.appendChild(expDiv);
  quiz.appendChild(card);

  function judgeOne(chosen){
    var isCorrect=false;
    if(isMulti){
      if(chosen.length===ansArr.length){
        var sc=chosen.slice().sort().join('');
        var sa=ansArr.slice().sort().join('');
        isCorrect=(sc===sa);
      }
    }else{
      isCorrect=ansArr.indexOf(chosen[0])!==-1;
    }
    for(var i=0;i<allButtons.length;i++){
      var b=allButtons[i];
      var letter=b.textContent.charAt(0);
      if(ansArr.indexOf(letter)!==-1)b.classList.add('correct');
      if(!isCorrect&&chosen.indexOf(letter)!==-1&&ansArr.indexOf(letter)===-1)b.classList.add('wrong');
      b.classList.add('disabled');
      b.style.background='';
      b.style.borderColor='';
    }
    if(isCorrect){
      correct++;
      answered++;
      expDiv.classList.add('show');
      document.getElementById('stats').textContent='已答 '+answered+' / '+flat.length+' 题，正确 '+correct+' 题';
      showNextBar(true);
      var countdown=3;
      var btn=document.querySelector('.quiz-nav .next-btn:last-child');
      var timer=setInterval(function(){
        countdown--;
        if(btn)btn.textContent='即将跳转… '+countdown;
        if(countdown<=0){clearInterval(timer);currentQuestionIndex++;renderOneQuestion();}
      },500);
    }else{
      answered++;
      document.getElementById('stats').textContent='已答 '+answered+' / '+flat.length+' 题，正确 '+correct+' 题';
      expDiv.classList.add('show');
      showNextBar(false);
    }
  }
}

function showNextBar(mode){
  var oldBar=document.getElementById('quiz-nav-bar');
  if(oldBar)oldBar.remove();
  var bar=document.createElement('div');
  bar.className='quiz-nav';
  bar.id='quiz-nav-bar';
  var flat=chapters[currentChapter]._flat;
  if(mode==='chapter-end'){
    var progress=document.createElement('div');
    progress.className='progress-text';
    progress.textContent='本章完成';
    bar.appendChild(progress);
    var prevBtn=document.createElement('button');
    prevBtn.className='next-btn';
    prevBtn.textContent='上一章';
    prevBtn.disabled=(currentChapter===0);
    prevBtn.onclick=function(){prevChapter();};
    bar.appendChild(prevBtn);
    var nextBtn=document.createElement('button');
    nextBtn.className='next-btn';
    nextBtn.textContent='下一章';
    nextBtn.disabled=(currentChapter===chapters.length-1);
    nextBtn.onclick=function(){nextChapter();};
    bar.appendChild(nextBtn);
    document.body.appendChild(bar);
    return;
  }
  var isLast=(currentQuestionIndex>=flat.length-1);
  if(isLast){
    var progress=document.createElement('div');
    progress.className='progress-text';
    progress.textContent='本章最后一题';
    bar.appendChild(progress);
    var prevBtn=document.createElement('button');
    prevBtn.className='next-btn';
    prevBtn.textContent='上一题';
    prevBtn.disabled=(currentQuestionIndex===0);
    prevBtn.onclick=function(){if(currentQuestionIndex>0){currentQuestionIndex--;renderOneQuestion();}};
    bar.appendChild(prevBtn);
    var nextChapterBtn=document.createElement('button');
    nextChapterBtn.className='next-btn';
    nextChapterBtn.textContent='下一章';
    nextChapterBtn.disabled=(currentChapter===chapters.length-1);
    nextChapterBtn.onclick=function(){nextChapter();};
    bar.appendChild(nextChapterBtn);
    document.body.appendChild(bar);
    return;
  }
  var autoNext=(mode===true);
  var progress=document.createElement('div');
  progress.className='progress-text';
  progress.textContent=(currentQuestionIndex+1)+' / '+flat.length;
  bar.appendChild(progress);
  var prevBtn=document.createElement('button');
  prevBtn.className='next-btn';
  prevBtn.textContent='上一题';
  prevBtn.disabled=(currentQuestionIndex===0);
  prevBtn.onclick=function(){if(currentQuestionIndex>0){currentQuestionIndex--;renderOneQuestion();}};
  bar.appendChild(prevBtn);
  var nextBtn=document.createElement('button');
  nextBtn.className='next-btn';
  nextBtn.textContent=autoNext?'即将跳转…':'下一题';
  nextBtn.disabled=autoNext;
  nextBtn.onclick=function(){currentQuestionIndex++;renderOneQuestion();};
  bar.appendChild(nextBtn);
  document.body.appendChild(bar);
}
// ===== 全局滑动手势：右划上一题，左划下一题 =====
(function () {
  var touchStartX = 0, touchStartY = 0, isHorizontal = false;
  document.addEventListener('touchstart', function (e) {
    var target = e.target;
    if (target.closest && target.closest('#quiz')) {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
      isHorizontal = false;
    } else {
      touchStartX = 0;
      touchStartY = 0;
      isHorizontal = false;
    }
  }, { passive: true });
  document.addEventListener('touchmove', function (e) {
    if (touchStartX === 0 && touchStartY === 0) return;
    var dx = e.touches[0].clientX - touchStartX;
    var dy = e.touches[0].clientY - touchStartY;
    if (!isHorizontal && Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy)) {
      isHorizontal = true;
    }
    if (isHorizontal) {
      e.preventDefault();
    }
  }, { passive: false });
  document.addEventListener('touchend', function (e) {
    if (touchStartX === 0 && touchStartY === 0) { isHorizontal = false; return; }
    var endX = e.changedTouches[0].clientX;
    var endY = e.changedTouches[0].clientY;
    var dx = endX - touchStartX;
    var dy = endY - touchStartY;
    if (Math.abs(dx) > 50 && Math.abs(dy) < 80) {
      var flat = chapters[currentChapter] && chapters[currentChapter]._flat;
      if (flat) {
        if (dx > 0) {
          if (currentQuestionIndex > 0) { currentQuestionIndex--; renderOneQuestion(); }
        } else {
          if (currentQuestionIndex < flat.length - 1) { currentQuestionIndex++; renderOneQuestion(); }
        }
      }
    }
    touchStartX = 0;
    touchStartY = 0;
    isHorizontal = false;
  }, { passive: true });
})();
// ===== 滑动手势结束 =====
window.scrollTo(0, 0);
document.documentElement.scrollLeft = 0;
document.body.scrollLeft = 0;
initChapterSelect();
switchChapter(0);
</script></body></html>
