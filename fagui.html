    // ===== 三、综合分析选择题（86-95） =====
    {type:"最佳选择题",q:"86. 根据案例一，在药物临床试验期间，用于防治严重危及生命或者严重影响生存质量的疾病，且尚无有效防治手段或者与现有治疗手段相比有足够证据表明具有明显临床优势的创新药或者改良型新药，申请人可以申请适用",opts:["A.附条件批准程序","B.特别审批程序","C.突破性治疗药物程序","D.关联审评审批制度"],ans:"C",exp:"药物临床试验期间，用于防治严重危及生命或者严重影响生存质量的疾病，且尚无有效防治手段或者与现有治疗手段相比有足够证据表明具有明显临床优势的创新药或者改良型新药等，申请人可以申请适用突破性治疗药物程序。"},
    {type:"最佳选择题",q:"87. 根据案例二，国家药品监督管理局在对该抗生素制剂注册申请时，对化学原料药、辅料及直接接触药品的包装材料和容器可以实施",opts:["A.附条件批准程序","B.特别审批程序","C.突破性治疗药物程序","D.关联审评审批制度"],ans:"D",exp:"国家药品监督管理局建立化学原料药、辅料及直接接触药品的包装材料和容器（以下简称原辅包）关联审评审批制度。"},
    {type:"最佳选择题",q:"88. 关于药品批发企业甲向药品零售连锁企业总部丁销售三唑仑的行为，说法正确的是",opts:["A.三唑仑属于麻醉药品，不得向药品零售连锁企业丁销售","B.三唑仑属于第一类精神药品，不得向丁销售","C.三唑仑属于第二类精神药品，不得向丁销售","D.三唑仑属于第二类精神药品，可以向丁销售"],ans:"B",exp:"三唑仑属于第一类精神药品，药品零售连锁企业不得销售。"},
    {type:"最佳选择题",q:"89. 药品批发企业甲可以向B省、C省的相关批发企业或医疗机构销售布桂嗪等药品，则药品批发企业甲经营布桂嗪、三唑仑的资质审批部门是",opts:["A.国家药品监督管理局","B.省级药品监督管理部门","C.市级药品监督管理部门","D.市级卫生健康主管部门"],ans:"A",exp:"布桂嗪是麻醉药品；三唑仑是第一类精神药品；其他所有药品是第二类精神药品。药品批发企业甲在跨省供应麻醉药品和第一类精神药品，属于全国性批发企业，由国家药品监督管理部门批准，并予以公布。"},
    {type:"最佳选择题",q:"90. 下列关于麻醉药品和精神药品的管理，错误的是",opts:["A.《麻醉药品、第一类精神药品购用印鉴卡》的批准部门是市级卫生健康主管部门","B.《麻醉药品、第一类精神药品购用印鉴卡》的有效期为5年","C.执业医师成为自己开具盐酸吗啡注射剂针剂属于违法行为","D.第二类精神药品一般每张处方不超过7日常用量"],ans:"B",exp:"《麻醉药品、第一类精神药品购用印鉴卡》的有效期为3年。"},
    {type:"最佳选择题",q:"91. 下列关于甲药品上市许可持有人的行为，说法错误的是",opts:["A.若甲药品上市许可持有人自行生产化学药B，应当取得药品生产许可证","B.若甲药品上市许可持有人自行销售放射性药品A，应当取得《放射性药品经营许可证》","C.若甲药品上市许可持有人委托丙药品生产企业生产化学药B，应当向甲所在地省级药品监督管理部门申请办理药品生产许可证","D.若甲药品上市许可持有人委托丁药品批发企业销售化学药B，应当签订委托协议"],ans:"B",exp:"药品上市许可持有人自行销售放射性药品A，无需另行取得《放射性药品经营许可证》。"},
    {type:"最佳选择题",q:"92. 关于乙药品上市许可持有人的行为，说法正确的是",opts:["A.乙药品上市许可持有人可以和丙药品生产企业签订生物制品D的委托生产、销售协议","B.乙药品上市许可持有人可以和丁药品批发企业签订中成药C的委托生产协议","C.乙药品上市许可持有人可以委托丁药品批发企业销售生物制品D，丁可以再委托第三方进行销售，但需要签订委托协议","D.若乙药品上市许可持有人跨省委托丁药品批发企业销售生物制品D，需要同时向乙和丁所在地省级药品监督管理部门报告"],ans:"D",exp:"药品上市许可持有人开展委托销售、储存、运输活动的，应当向其所在地省级药品监督管理部门报告；跨省委托销售、储存、运输的，还应当同时报告受托企业所在地省级药品监督管理部门。药品上市许可持有人可以和丙药品生产企业签订生物制品D的委托生产协议，不能签订委托销售协议；持有人不得委托药品经营企业生产药品；受托经营企业不得再次委托销售。"},
    {type:"最佳选择题",q:"93. 若甲药品上市许可持有人自行销售化学药B，下列说法符合要求的是",opts:["A.自行销售化学药B应当取得药品经营许可证","B.自行销售化学药B无需取得药品经营许可证","C.自行零售化学药B应当取得药品经营许可证，自行批发化学药B无需取得药品经营许可证","D.自行零售化学药B无需取得药品经营许可证，自行批发化学药B应当取得药品经营许可证"],ans:"C",exp:"药品上市许可持有人自行零售药品应当取得药品经营许可证，自行批发药品无需取得药品经营许可证。"},
    {type:"最佳选择题",q:"94. 下列情形中，不属于无证经营的行为是",opts:["A.药品上市许可持有人未取得药品经营许可证销售所持有的药品给药品批发企业","B.在城乡集市贸易市场设点销售的药品超出批准经营的药品范围的","C.未经批准，擅自在城乡集市贸易市场设点销售药品","D.药品经营企业和医疗机构变更药品经营许可事项，应当办理变更登记手续而未办理的，由原发证部门给予警告，责令限期补办变更登记手续，逾期不补办的，宣布其《药品经营许可证》无效，仍从事药品生产经营活动的"],ans:"A",exp:"药品上市许可持有人自行批发药品无需取得药品经营许可证，A选项不属于无证经营。其余三个选项都属于其他按照无证经营处罚的情形。"},
    {type:"最佳选择题",q:"95. 对甲门诊部从不具有药品经营资格的企业非法购进药品(含需低温冷藏的胰岛素)，且在运输和存储过程中未对需冷藏药品进行冷藏，未造成严重情节的情形，可能作出的处罚是",opts:["A.对该诊所处以没收违法所得9.46万元、罚款16.92万元的行政处罚","B.对该诊所处以没收违法所得9.46万元、罚款100.2万元的行政处罚","C.对该诊所处以没收违法所得9.46万元、责令限期整改","D.对该诊所处以没收违法所得9.46万元、罚款75.71万元的行政处罚"],ans:"D",exp:"药品上市许可持有人、药品生产企业、药品经营企业或者医疗机构未从药品上市许可持有人或者具有药品生产、经营资格的企业购进药品的，责令改正，没收违法购进的药品和违法所得，并处违法购进药品货值金额二倍以上十倍以下的罚款；情节严重的，并处货值金额十倍以上三十倍以下的罚款，吊销药品批准证明文件、药品生产许可证、药品经营许可证或者医疗机构执业许可证；货值金额不足五万元的，按五万元计算。材料货值金额9.46万元，未造成严重情节，处罚金额为9.46万元×2倍～9.46万元×10倍，得18.92万元～94.6万元，只有D符合要求。"},

    // ===== 四、多项选择题（96-100） =====
    {type:"多项选择题",q:"96. 在药品零售企业中，不得由他人代为履行职责的岗位包括",opts:["A.质量管理岗位","B.处方调配岗位","C.中药饮片调剂岗位","D.处方审核岗位"],ans:"AD",exp:"质量管理岗位、处方审核岗位的职责不得由其他岗位人员代为履行。"},
    {type:"多项选择题",q:"97. 药师调剂处方时必须做到“四查十对”，其中“四查”包括",opts:["A.查处方","B.查药品","C.查用法用量","D.查用药合理性"],ans:"ABD",exp:"“四查十对”：查处方，对科别、姓名、年龄；查药品，对药名、剂型、规格、数量；查配伍禁忌，对药品性状、用法用量；查用药合理性，对临床诊断。"},
    {type:"多项选择题",q:"98. 药品广告不得出现的情形包括",opts:["A.“安全无毒副作用”","B.“家庭必备、免费治疗、免费赠送”","C.“无效退款、保险公司保险”","D.“本广告仅供医学药学专业人士阅读”"],ans:"ABC",exp:"广告不得出现“安全无毒副作用”“家庭必备、免费治疗、免费赠送”“无效退款、保险公司保险”。处方药广告还应当显著标明“本广告仅供医学药学专业人士阅读”，非处方药广告还应当显著标明非处方药专用标识（OTC）和“请按药品说明书或者在药师指导下购买和使用”。"},
    {type:"多项选择题",q:"99. 非处方药根据以下原则遴选：应用安全、疗效确切、质量稳定、使用方便。其中，关于“应用安全”的说法，正确的有",opts:["A.无潜在毒性，不引起蓄积中毒","B.长期临床使用证实安全性大，基本无不良反应","C.不易引起依赖性，无“三致”作用","D.医疗用毒性药品、麻醉药品以及精神药品原则上不能作为非处方药，但个别麻醉药品与少数精神药品可作为“限复方制剂活性成分”使用"],ans:"BD",exp:"“应用安全”要求无潜在毒性，不易引起蓄积中毒，不引起依赖性。"},
    {type:"多项选择题",q:"100. 下列属于新的药品不良反应和按照新的药品不良反应处理的有",opts:["A.说明书中已有描述，但不良反应发生的性质、程度、后果或者频率比说明书描述更严重的","B.说明书中已有描述，但不良反应发生的性质、程度、后果或者频率与说明书描述不一致的","C.药品说明书中未载明的不良反应","D.首次获知的过期药品导致的有害反应"],ans:"ABC",exp:"新的药品不良反应是指药品说明书中未载明的不良反应。说明书中已有描述，但不良反应发生的性质、程度、后果或者频率与说明书描述不一致或者更严重的，按照新的药品不良反应处理。过期药品导致的不属于药品不良反应，不良反应必须以合格药品为前提。"}
  ]
},
  {
  name: "押题密卷（五）",
  questions: [
    // ===== 一、最佳选择题（1-40） =====
    {type:"最佳选择题",q:"1. 为全面推进健康中国建设，国务院办公厅发布《关于印发“十四五”国民健康规划的通知》（国办发〔2022〕11号）。关于药品安全管理，明确的两项主要任务是",opts:["A.保障药品供应和保障药品质量安全","B.保障药品质量安全和夯实中医药高质量发展基础","C.保障药品供应和夯实中医药高质量发展基础","D.建立健全化学药品保障机制和夯实中医药高质量发展基础"],ans:"B",exp:"为全面推进健康中国建设，关于药品安全管理，明确了保障药品质量安全和夯实中医药高质量发展基础两项主要任务。"},
    {type:"最佳选择题",q:"2. 下列兴奋剂管理不符合要求的是",opts:["A.含兴奋剂药品的管理可体现为三个层次，实施特殊管理，实施严格管理和实施处方药管理","B.兴奋剂目录发布执行后的第9个月首日起，药品生产企业所生产的含兴奋剂目录新列入物质的药品，必须在包装标识或产品说明书上标注“运动员慎用”字样","C.蛋白同化制剂、肽类激素的验收、检查、保管、销售和出入库登记记录应当保存至超过蛋白同化制剂、肽类激素有效期2年","D.进口蛋白同化制剂、肽类激素，进口单位应当提交申请，符合相关的条件，发给《进口药品通关单》"],ans:"D",exp:"进口供医疗使用，或因教学、科研需要的蛋白同化制剂、肽类激素，进口单位应当提交申请，符合相关的条件，发给《进口准许证》。进口单位持省级药品监督管理部门核发的药品进口准许证向海关办理报关手续。进口蛋白同化制剂、肽类激素无需办理《进口药品通关单》。"},
    {type:"最佳选择题",q:"3. 药品零售企业存放、陈列药品的设备应当保持清洁卫生，不得放置与销售活动无关的物品，并采取防虫、防鼠等措施，防止污染药品。下列符合药品陈列要求的是",opts:["A.外用药与其他药品分区摆放","B.处方药、非处方药分开陈列","C.拆零销售的药品集中存放于拆零专区","D.按剂型、用途、规格以及储存要求分类陈列，并设置醒目标志"],ans:"C",exp:"处方药、非处方药分区陈列。按剂型、用途以及储存要求分类陈列，并设置醒目标志。拆零销售的药品集中存放于拆零专柜或者专区。外用药与其他药品分开摆放。"},
    {type:"最佳选择题",q:"4. 根据《地区性民间习用药材管理办法（试行）》，下列不符合规定的是",opts:["A.地区性民间习用药材是指被本草、医籍、方志等记载，且国家药品标准未收载、不具有药品注册标准，而在局部地区有多年药用习惯的中药材","B.地区性民间习用药材兼顾“地区性民间习用”和“药用”的特点","C.省级药品监督管理部门制定修订地区性民间习用药材的省级中药材标准","D.城乡集市贸易市场可以出售地区性民间习用药材，包括省级中药材标准中明确记载具有剧毒、大毒的中药材"],ans:"D",exp:"城乡集市贸易市场可以出售地区性民间习用药材，《医疗用毒性药品管理办法》中收载的毒性中药品种以及省级中药材标准中明确记载具有剧毒、大毒的中药材除外。"},
    {type:"最佳选择题",q:"5. 根据行为人违反药品法律法规的性质和社会危害程度不同，药品安全法律责任可以分为三类。下列不属于药品安全法律责任的是",opts:["A.刑事责任","B.民事责任","C.行政责任","D.违宪责任"],ans:"D",exp:"根据违法行为所违反的法律的性质，可以把法律责任分为民事责任、行政责任、刑事责任。"},
    {type:"最佳选择题",q:"6. 下列不属于中药饮片处方适宜性审核的是",opts:["A.毒麻贵细饮片是否按规定开方","B.中药饮片要单独开具处方","C.中药饮片处方用药与中医诊断（病名和证型）是否相符","D.中药饮片的煎法、用法、脚注等是否完整、准确"],ans:"B",exp:"中药饮片、中药注射剂要单独开具处方，属于处方规范性审核。"},
    {type:"最佳选择题",q:"7. 需要对涉案药品进行检验才可认定为假药或劣药的药品是",opts:["A.过期药品","B.未标明或者更改有效期、产品批号的药品","C.被污染的药品","D.标明的适应症或者功能主治超出规定范围的药品"],ans:"C",exp:"对公安机关在办理危害药品安全犯罪案件中商请药品监督管理部门提供检验、认定意见。对标明的适应症或者功能主治超出规定范围的药品，过期药品，未标明或者更改有效期、产品批号的药品，以及其他有充分证据证明其为假药或者劣药的，无需送药品检验机构检验，可以直接出具认定意见。"},
    {type:"最佳选择题",q:"8. 药品经营企业通过网络销售药品，应当依据依法批准的经营方式和经营范围开展，属于不得在网络销售的药品是",opts:["A.斑螯","B.西洋参","C.石斛","D.乳香"],ans:"A",exp:"政策法规明确规定禁止网络销售的药品：中药配方颗粒、医疗机构制剂、麻醉药品、精神药品、医疗用毒性药品、放射性药品、药品类易制毒化学品、血液制品、疫苗、依托咪酯注射剂。斑螯属于医疗用毒性药品。"},
    {type:"最佳选择题",q:"9. 省级药品监督管理部门发布的药品质量公告，在发布后向国家药品监督管理局提出备案申请的时限为",opts:["A.5个工作日内","B.7个工作日内","C.15个工作日内","D.60个工作日内"],ans:"A",exp:"省级药品监督管理部门发布的药品质量公告，应当及时通过国家药品监督管理局网站向社会公布，并在发布后5个工作日内报国家药品监督管理局备案。"},
    {type:"最佳选择题",q:"10. 根据对药品生产环节的监督要求，下列说法中错误的是",opts:["A.药品生产企业应当确定需进行的确认与验证，按照确认与验证计划实施生产活动","B.中药饮片符合国家药品标准或者省级药品监督管理部门制定的炮制规范的，方可出厂、销售","C.药品生产企业应当建立药品上市放行规程，明确出厂放行的标准、条件","D.药品上市许可持有人、药品生产企业应当每年进行自检，监控药品生产质量管理规范的实施情况"],ans:"C",exp:"药品上市许可持有人建立药品上市放行规程，药品生产企业建立药品出厂放行规程。"},
    {type:"最佳选择题",q:"11. 下列不符合自种、自采、自用中草药规定的是",opts:["A.不得自种自采自用国家规定需特殊管理的医疗用毒性中草药、麻醉药品原植物和濒稀野生植物药材","B.乡村中医药技术人员自种自采自用的中草药，只限于其所在的村医疗机构内使用","C.自种自采自用的中草药应加工成中药制剂供患者使用","D.允许乡村中医药技术人员自种、自采、自用不需特殊加工炮制的植物中草药"],ans:"C",exp:"自种自采自用的中草药不得上市流通，不得加工成中药制剂。"},
    {type:"最佳选择题",q:"12. 药品监督管理部门按照药品经营质量管理规范现场检查指导原则，对不同风险等级的企业依职责实施药品GSP情况的检查。对于经营雄黄的企业检查频次是",opts:["A.每半年不少于1次","B.每年不少于1次","C.每3年不少于1次","D.每5年不少于1次"],ans:"B",exp:"检查频次为：①对麻醉药品和第一类精神药品、药品类易制毒化学品经营企业检查，每半年不少于1次；②对冷藏冷冻药品、血液制品、细胞治疗类生物制品、第二类精神药品、医疗用毒性药品（雄黄属于毒性中药品种）、放射性药品经营企业、疫苗仓储配送企业检查，每年不少于1次；③对经营上述药品之外的其他药品经营企业检查，每3年不少于1次。"},
    {type:"最佳选择题",q:"13. 药品监督管理部门在对某药品零售连锁企业进行飞行检查时，记录了部分该企业日常的工作流程，不符合规定的是",opts:["A.质量管理部门在验收药品时逐批抽样验收，验收结束后，将抽取的完好样品放回原包装箱，加封并标示","B.对从事冷藏冷冻药品储存、运输等工作的人员进行相关法律法规和专业知识培训","C.对直接接触药品岗位的员工需每2年进行一次健康检查并建立健康档案","D.药品零售连锁门店在销售药品时，应当为顾客开具销售凭证"],ans:"C",exp:"药品零售企业应当对直接接触药品岗位的人员进行岗前及年度健康检查，并建立健康档案。患有传染病或者其他可能污染药品的疾病的，不得从事直接接触药品的工作。"},
    {type:"最佳选择题",q:"14. 下列关于境外生产药品分包装备案管理说法有误的是",opts:["A.申请分包装的境外生产药品应已取得药品注册证书","B.药品分包装用大包装的包装规格已获得《进口药品注册证》且在有效期内的，可直接进行境外生产药品分包装的备案","C.按照《境外生产药品分包装备案程序》和要求备案的境外生产药品分包装，同步申请核发药品批准文号","D.同一药品上市许可持有人的同一品种应当由一个药品生产企业分包装，分包装的期限不得超过药品注册证书的有效期"],ans:"C",exp:"按照《境外生产药品分包装备案程序》和要求备案的境外生产药品分包装，不再核发药品批准文号。"},
    {type:"最佳选择题",q:"15. 根据药品的管理与分类，新药的定义是",opts:["A.不得发布广告的药品","B.与原研药质量和疗效一致的药品","C.未在中国境内外上市销售的药品","D.在中国境外生产，在中国境内准予销售的药品"],ans:"C",exp:"新药是指未在中国境内外上市销售的药品。医疗机构制剂不得发布广告。与原研药质量和疗效一致的药品是仿制药。在中国境外生产，在中国境内准予销售的药品是进口药品的定义。"},
    {type:"最佳选择题",q:"16. 下列行政处罚中，可以申请听证程序的是",opts:["A.个人因违法行为被处以100元的罚款","B.个人因违规操作被降低资质等级","C.对法人组织违规行为进行警告","D.对法人组织处以2000元罚款"],ans:"B",exp:"行政机关作出以下行政处罚决定之前，应当告知当事人有要求举行听证的权利：①较大数额罚款；②没收较大数额违法所得、没收较大价值非法财物；③降低资质等级或吊销许可证件；④责令停产停业、责令关闭、限制从业。当违法事实确凿、有法定依据、拟作出数额较小的罚款（对公民处200元以下，对法人或者其他组织处3000元以下的罚款）或者警告时，可以适用简易程序，当场作出行政处罚决定。"},
    {type:"最佳选择题",q:"17. 使用前应当向国家药品监督管理局备案的化妆品新原料是",opts:["A.具有防晒功能的新原料","B.具有防脱发功能的新原料","C.具有着色功能的新原料","D.具有美白功能的新原料"],ans:"B",exp:"具有防腐、防晒、着色、染发、祛斑美白功能的化妆品新原料，经国家药品监督管理局注册后方可使用；其他化妆品新原料应当在使用前向国家药品监督管理局备案。"},
    {type:"最佳选择题",q:"18. 根据《医院中药饮片管理规范》，三级医院应配备的中药学技术人员和中药饮片验收人员的资质分别为",opts:["A.主任中药师，初级以上职称","B.副主任中药师以上，中级以上专业技术职称","C.主管中药师，初级以上职称","D.主任中药师，中级以上专业技术职称"],ans:"B",exp:"三级医院应当至少配备一名副主任中药师以上专业技术人员；负责中药饮片验收的，在二级以上医院应当是具有中级以上专业技术职称和饮片鉴别经验的人员。"},
    {type:"最佳选择题",q:"19. 国家鼓励医疗机构根据本医疗机构临床用药需要配制和使用中药制剂，支持应用传统工艺配制中药制剂，支持以中药制剂为基础研制中药新药，关于医疗机构中药制剂管理的说法，正确的是",opts:["A.医疗机构配制的中药制剂不得在市场上销售或者变相销售，可以在本医疗机构内发布广告宣传","B.医疗机构配制的中药制剂品种，必须依法取得制剂批准文号","C.委托配制中药制剂，应当向受托方所在地省级药品监督管理部门备案","D.由中药饮片经粉碎后制成的胶囊剂进行配制，实行备案管理"],ans:"D",exp:"备案管理的传统中药制剂包括：由中药饮片经水提取制成的颗粒剂以及由中药饮片经粉碎后制成的胶囊剂。传统中药制剂不得在市场上销售或者变相销售，不得发布医疗机构制剂广告。医疗机构配制的中药制剂品种，应当依法取得制剂批准文号。但是，仅应用传统工艺配制的中药制剂品种，向医疗机构所在地省级药品监督管理部门备案后即可配制，不需要取得制剂批准文号。委托配制中药制剂，应当向委托方所在地省级药品监督管理部门备案。"},
    {type:"最佳选择题",q:"20. 下列关于药品专用标识的说法，错误的是",opts:["A.“免疫规划”专用标识应当印刷在疫苗最小外包装的顶面的正中处，颜色为红色","B.麻醉药品专用标志颜色为天蓝色与白色相间","C.精神药品专用标志颜色为绿色与白色相间","D.放射性药品的标志颜色为红黄组合"],ans:"A",exp:"“免疫规划”专用标识应当印刷在疫苗最小外包装的顶面的正中处，颜色为宝石蓝色。"},
    {type:"最佳选择题",q:"21. 下列关于古代经典名方中药复方制剂的管理说法错误的是",opts:["A.申请简化注册审批上市的品种剂型应当与古代医籍记载完全一致","B.古代经典名方具体目录由国务院中医药主管部门会同药品监督管理部门制定","C.涉及幼儿用药人群的古代经典名方，不得实施简化注册审批","D.符合实施简化注册审批的古代经典名方制剂申请上市，免报药效学研究及临床试验资料"],ans:"A",exp:"来源于国家公布目录中的古代经典名方且无上市品种（已按规定简化注册审批上市的品种除外）的中药复方制剂申请上市，符合以下条件的，实施简化注册审批：①处方中不含配伍禁忌或药品标准中标识有“剧毒”“大毒”及经现代毒理学证明有毒性的药味；②处方中药味及所涉及的药材均有国家药品标准；③制备方法与古代医籍记载基本一致；④除汤剂可制成颗粒剂外，剂型应与古代医籍记载一致；⑤给药途径与古代医籍记载一致，日用饮片量与古代医籍记载相当；⑥功能主治应当采用中医术语表述，与古代医籍记载基本一致；⑦适用范围不包括传染病，不涉及孕妇、婴幼儿等特殊用药人群。"},
    {type:"最佳选择题",q:"22. 常规情况下，麻醉药品区域性批发企业之间可以购销的药品是",opts:["A.二氢埃托啡","B.小包装麻黄素","C.地西泮","D.羟考酮"],ans:"C",exp:"区域性批发企业之间因医疗急需、运输困难等特殊情况需要调剂麻醉药品和第一类精神药品的，应当在调剂后2日内将调剂情况分别报所在地省级药品监督管理部门备案。常规情况下，区域性批发企业之间不得购销麻醉药品和第一类精神药品。A选项D选项均为麻醉药品。麻醉药品区域性批发企业之间不得购销药品类易制毒化学品单方制剂和小包装麻黄素。地西泮为第二类精神药品，麻醉药品区域性批发企业之间可以购销。"},
    {type:"最佳选择题",q:"23. 某药品标签标注生产日期为2025年1月1日，有效期24个月，其有效期标注符合要求的是",opts:["A.2027年1月1日","B.2026.12.31.","C.2026/6","D.2027年12月31日"],ans:"B",exp:"年份用四位数字表示，月、日各用两位数表示。其具体标注格式为“有效期至XXXX年XX月”或者“有效期至XXXX年XX月XX日”；也可以用数字和其他符号表示为“有效期至XXXX.XX.”或者“有效期至XXXX/XX/XX”等。有效期标注到月的，起算月份对应生产日期年前1月；标注到日的，起算日期对应生产日期年月日前一日。"},
    {type:"最佳选择题",q:"24. 药品批发企业在从事药品经营活动中，应当遵循“诚实守信、依法经营”的原则。关于药品批发企业经营过程中，违反药品经营质量管理规范的是",opts:["A.在产品宣传会现场与其他企业签订药品销售合同","B.将中药材切片包装后，粘贴中药饮片的标签进行销售","C.将一批连翘销售给药品零售连锁企业总部，并如实开具发票","D.与药品上市许可持有人签订委托协议，受托销售氨酚双氢可待因片"],ans:"B",exp:"禁止以中药材及初加工产品冒充中药饮片销售，非法加工中药饮片。氨酚双氢可待因片为含特殊药品的复方制剂，可以委托药品经营企业销售。"},
    {type:"最佳选择题",q:"25. 药品上市许可持有人委托他人生产药品时不需要具备的条件是",opts:["A.有依法经过资格认定的药学技术人员","B.有与药品生产相适应的厂房、设施、设备和卫生环境","C.有能对所生产药品进行质量管理和质量检验的机构、人员","D.有保证药品质量的规章制度，并符合药品生产质量管理规范要求"],ans:"B",exp:"委托他人生产制剂的药品上市许可持有人，应当具备的条件包括：符合生产条件要求的技术人员和管理人员；有能对所生产药品进行质量管理和质量检验的机构、人员；有保证药品质量的规章制度，并符合药品生产质量管理规范要求。"},
    {type:"最佳选择题",q:"26. 未按照规定报告疑似药品不良反应的，责令限期改正，给予警告；逾期不改正的，责令停产停业整顿，并处十万元以上一百万元以下的罚款的违法行为主体是",opts:["A.药品上市许可持有人","B.药品批发企业","C.药品零售企业","D.医疗机构"],ans:"A",exp:"药品上市许可持有人未按照规定开展药品不良反应监测或者报告疑似药品不良反应的，责令限期改正，给予警告；逾期不改正的，责令停产停业整顿，并处十万元以上一百万元以下的罚款。药品经营企业未按照规定报告疑似药品不良反应的，责令限期改正，给予警告；逾期不改正的，责令停产停业整顿，并处五万元以上五十万元以下的罚款。医疗机构未按照规定报告疑似药品不良反应的，责令限期改正，给予警告；逾期不改正的，处五万元以上五十万元以下的罚款。"},
    {type:"最佳选择题",q:"27. 关于药品广告的申请与审批，不符合要求的是",opts:["A.药品广告审查申请应当依法向生产企业或者进口代理人等广告主所在地广告审查机关提出","B.广告审查机关收到申请人提交的申请后，应当在5个工作日内作出受理或者不予受理决定","C.某药品广告批准文号为：X药广审（视）第250806-10000号，该药品广告可以发布至2027年8月5日","D.经广告审查机关审查通过并向社会公开的药品广告，可以依法在全国范围内发布"],ans:"C",exp:"广告批准文号的文书格式为：X药／械／食健／食特广审（视／声／文）第000000-00000号，前6位数字是该广告的有效期截止日，故该药品广告发布至2025年8月6日。"},
    {type:"最佳选择题",q:"28. 关于国家基本药物管理表述有误的是",opts:["A.国家基本药物遴选应当按照防治必需、安全有效、价格低廉、使用方便、中西药并重、基本保障、临床必需和基层能够配备的原则进行","B.基本药物在使用时要坚持基本药物的主导地位，强化医疗机构基本药物使用管理","C.含有国家濒危野生动植物药材成分的药品不得纳入国家基本药物","D.独家生产的药品纳入国家基本药物目录时应当经过单独论证，但急抢救用药除外"],ans:"A",exp:"基本药物遴选原则包括：防治必需、安全有效、价格合理、使用方便、中西药并重、基本保障、临床首选和基层能够配备。"},
    {type:"最佳选择题",q:"29. 属于行政机关不予公开的政府信息是",opts:["A.机构职能","B.政府集中采购信息","C.公务员家庭情况信息","D.行政事业性收费信息"],ans:"C",exp:"行政机关公开政府信息，采取主动公开和依申请公开的方式。依法确定为国家秘密的政府信息，法律、行政法规禁止公开的政府信息，以及公开后可能危及国家安全、公共安全、经济安全、社会稳定的政府信息，不予公开。"},
    {type:"最佳选择题",q:"30. 不符合个人携带少量自用药品进出境管理规定的情形是",opts:["A.王某向海关人员出具医疗诊断书，称因病从国外携带一支咪达唑仑注射剂入境","B.海关人员发现郭某随身携带数量合理的麻黄碱化学品入境","C.医师赵某携带少量麻醉药品入境，并向海关人员出示执业医师资格证","D.柳某因携带药品数量超过自用合理数量范围，通过货物渠道进行报关"],ans:"C",exp:"医务人员为医疗需要携带少量麻醉药品和精神药品出入境的，应当持所在地省级药品监督管理部门发放的携带麻醉药品和精神药品证明，海关凭携带麻醉药品和精神药品证明放行。"},
    {type:"最佳选择题",q:"31. 根据《反不正当竞争法》，关于经营者不正当竞争行为的说法，错误的是",opts:["A.从事商品生产、经营或者提供服务的自然人、法人和非法人组织都有可能是不正当竞争行为的经营者","B.经营者在生产经营活动中，应当遵循自愿、平等、公平、诚信的原则，遵守法律和商业道德","C.经营者在生产经营活动中，违反反不正当竞争法规定，扰乱市场竞争秩序，损害其他经营者或者消费者的合法权益的行为是不正当竞争行为","D.经营者向交易相对方支付折扣、向中间人支付佣金的，如实入账的行为属于商业贿赂行为"],ans:"D",exp:"经营者在交易活动中，可以以明示方式向交易相对方支付折扣，或者向中间人支付佣金。经营者向交易相对方支付折扣、向中间人支付佣金的，应当如实入账。接受折扣、佣金的经营者也应当如实入账。以上行为属于合法行为。"},
    {type:"最佳选择题",q:"32. 药品监督管理部门在监督检查时发现，某药品零售企业正在销售含麻黄碱类药品，以下行为不符合管理要求的是",opts:["A.未开架销售非处方药的含麻黄碱类复方制剂，由专人管理，销售时不用登记患者身份信息","B.该零售企业的执业药师对于含麻黄碱类药品的处方进行审方，确认剂量在合理范围内","C.对于单位剂量麻黄碱含量大于30mg的药品按处方药管理","D.对于非处方药的含麻黄碱类复方制剂一次销售不得超过2个最小包装"],ans:"A",exp:"药品零售企业销售含麻黄碱类药物时应当查验购买者的身份证原件，并对其姓名和身份证号码予以登记。"},
    {type:"最佳选择题",q:"33. 下列属于目前国家按照药品管理，其上市需要按照《药品注册管理办法》规定的注册程序进行审评审批，符合要求的，发放药品注册证书的体外诊断试剂是",opts:["A.用于血源筛查和采用放射性核素标记的体外诊断试剂","B.用于肿瘤早期筛查和采用化学发光标记的体外诊断试剂","C.用于遗传病诊断和采用荧光原位杂交技术的体外诊断试剂","D.用于药物浓度监测和采用酶联免疫吸附法的体外诊断试剂"],ans:"A",exp:"在体外诊断试剂中，用于血源筛查和采用放射性核素标记的体外诊断试剂，目前国家按照药品管理，其上市需要按照《药品注册管理办法》规定的注册程序进行审评审批，符合要求的，发放药品注册证书；企业生产经营行为按照药品生产、经营等法规规定进行管理。"},
    {type:"最佳选择题",q:"34. 药品应当从允许药品进口的口岸进口，并由进口药品企业向口岸所在地药品监督管理部门备案。关于药品进口管理的说法，错误的是",opts:["A.海关凭药品监督管理部门出具的进口药品通关单办理通关手续","B.允许药品进口的口岸由省级药品监督管理部门会同省级人民政府提出，报海关总署批准","C.药品应当从允许药品进口的口岸进口，并由进口药品企业向口岸所在地药品监督管理部门备案","D.疗效不确切、不良反应大或危害人体健康的药品不得进口"],ans:"B",exp:"允许药品进口的口岸由国家药品监督管理局会同海关总署提出，报国务院批准。"},
    {type:"最佳选择题",q:"35. 关于保健食品的说法，错误的是",opts:["A.保健食品是指声称具有特定保健功能或者以补充维生素、矿物质为目的的食品","B.使用保健食品原料目录以外原料的保健食品应当经国务院食品安全监督管理部门注册","C.首次进口的保健食品中属于补充维生素、矿物质等营养物质的，应当报国务院食品安全监督管理部门备案","D.保健食品属于地方特色食品，由省级食品安全监督管理部门对其制定食品安全地方标准"],ans:"D",exp:"保健食品不属于地方特色食品，不得对其制定食品安全地方标准。"},
    {type:"最佳选择题",q:"36. 冷藏、冷冻药品属于温度敏感性药品，不符合温湿度自动监测系统管理的是",opts:["A.系统温湿度数据的测定值应当符合储存、运输药品的贮藏温湿度要求，且具备自动生成温湿度监测记录的功能","B.温湿度自动监测系统由测点终端、管理主机、不间断电源以及相关软件等组成","C.当发生供电中断等突发情况时，系统应当采用短信通讯的方式，向至少3名指定人员发出报警信息","D.仓库、冷藏车内测点终端不得少于1个，冷藏箱、保温箱内测点终端不得少于2个"],ans:"D",exp:"仓库、冷藏车内测点终端不得少于2个，冷藏箱、保温箱内测点终端不得少于1个。"},
    {type:"最佳选择题",q:"37. 为贯彻落实《药品管理法》《疫苗管理法》，加强境外药品上市许可持有人管理，下列说法不正确的是",opts:["A.境外持有人与其指定的境内责任人承担连带责任","B.省级药品监督管理部门负责本行政区域内境内责任人的监督管理","C.进口药品首次办理进口备案时，省级药品监督管理部门应当查验进口药品说明书是否载明境内责任人信息","D.境外持有人所持有的药品注册证书被注销或吊销的，该品种的境内责任人所在地省级药品监督管理部门负责在国家药品业务应用系统内进行相关标记"],ans:"C",exp:"进口药品首次办理进口备案时，口岸药品监督管理局应当查验进口药品说明书是否载明境内责任人信息。"},
    {type:"最佳选择题",q:"38. 根据《药品管理法》，下列生产、销售药品行为中，按生产、销售劣药应当从重行政处罚定性的是",opts:["A.某药厂生产成分含量不符合规定的生物制品","B.某药店销售的儿童药品为保健品冒充","C.某社区医院给老人注射的药品已变质","D.某中药批发企业销售的药品所标的适应症超出规定范围"],ans:"A",exp:"当事人有下列情形之一的，应当给予从重行政处罚：①以麻醉药品、精神药品、医疗用毒性药品、放射性药品、药品类易制毒化学品冒充其他药品，或者以其他药品冒充上述药品的。②生产、销售、使用假药、劣药、不符合强制性标准或者不符合经注册的产品技术要求的第三类医疗器械，以孕产妇、儿童、危重病人为主要使用对象的。③生产、销售、使用的生物制品、注射剂药品属于假药、劣药的。④生产、销售、使用假药、劣药，不符合强制性标准或者不符合经注册备案的产品技术要求的医疗器械，造成人身伤害后果的。⑤生产、销售、使用假药、劣药，经处理后再犯；生产、销售、使用不符合强制性标准或者经注册的产品技术要求的医疗器械，经处理后三年内再犯的。⑥在自然灾害、事故灾难、公共卫生事件、社会安全事件等突发事件发生时期，生产、销售、使用用于应对突发事件的药品系假药、劣药，或者用于应对突发事件的医疗器械不符合强制性标准或者不符合经注册备案的产品技术要求的。⑦因药品、医疗器械违法行为受过刑事处罚的。⑧法律、法规、规章规定的其他应当从重行政处罚情形。BCD均为假药。"},
    {type:"最佳选择题",q:"39. 应由药品监督管理部门对法定代表人、主要负责人、直接负责的主管人员和其他责任人员，没收违法行为发生期间自本单位所获收入，并处所获收入百分之十以上百分之五十以下的罚款，十年直至终身禁止从事药品生产经营等活动的违法行为是",opts:["A.销售的药品属于假药","B.生产的疫苗属于劣药情节严重的","C.药品生产企业违反药品生产质量管理规范情节严重的","D.疫苗上市许可持有人违反质量管理规范情节严重的"],ans:"C",exp:"药品生产企业未遵守药品生产质量管理规范的，对责任人员，没收违法所得收入，并处所获收入10%以上50%以下的罚款，十年直至终身禁止从事药品生产经营等活动。生产、销售假药，对责任人员，没收违法所获收入，并处所获收入30%以上3倍以下的罚款，终身禁止从事药品生产经营活动，并可以由公安机关处五日以上十五日以下的拘留。生产、销售的疫苗属于假药，或者生产、销售的疫苗属于劣药且情节严重的，对责任人员，没收违法所获收入，并处所获收入1倍以上10倍以下的罚款，终身禁止从事药品生产经营活动，由公安机关处五日以上十五日以下拘留。疫苗上市许可持有人违反药品相关质量管理规范的，对责任人员，没收违法行为发生期间自本单位所获收入，并处所获收入50%以上5倍以下的罚款，十年内直至终身禁止从事药品生产经营活动。"},
    {type:"最佳选择题",q:"40. 关于申请医保定点零售药店应具备的条件说法正确的是",opts:["A.至少有2名取得执业药师资格证书或具有药学、临床药学、中药学专业技术资格证书的药师","B.至少有1名熟悉医疗保障法律法规和相关制度规定的专(兼)职医保管理人员负责管理医保费用","C.按药品经营质量管理规范要求，开展药品分类分区管理，并对所售药品设立明确的医保用药标识","D.符合法律法规和使用省级的医保编码"],ans:"C",exp:"申请医保定点零售药店应按药品经营质量管理规范要求，开展药品分类分区管理，并对所售药品设立明确的医保用药标识。至少有1名取得执业药师资格证书或具有药学、临床药学、中药学专业技术资格证书的药师。至少有2名熟悉医疗保障法律法规和相关制度规定的专（兼）职医保管理人员负责管理医保费用。建立医保药品等基础数据库，按规定使用国家统一医保编码。"},

    // ===== 二、配伍选择题（41-85） =====
    {type:"配伍选择题",subs:[
      {q:"41. 属于分布区域缩小，资源处于衰竭状态的重要野生药材物种是",opts:["A.黄连","B.虎骨","C.石斛","D.黄芪"],ans:"A",exp:"二级保护野生药材物种系指分布区域缩小，资源处于衰竭状态的重要野生药材物种，黄连属于二级。"},
      {q:"42. 属于禁止采摘的野生药材物种是",opts:["A.黄连","B.虎骨","C.石斛","D.黄芪"],ans:"B",exp:"禁止采猎一级保护野生药材物种，虎骨为一级。"},
      {q:"43. 属于采猎者必须持有采药证，且资源严重减少的主要常用野生药材物种",opts:["A.黄连","B.虎骨","C.石斛","D.黄芪"],ans:"C",exp:"采猎、收购二、三级保护野生药材物种必须按照批准的计划执行。采猎者必须持有采药证，资源严重减少的主要常用野生药材物种为三级，石斛为三级。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"44. 甲是在中国药学岗位工作的法国籍人士，药学大学专科毕业，报考执业药师考试需在药学或中药学岗位工作满足的年限为",opts:["A.1年","B.2年","C.4年","D.5年"],ans:"C",exp:"凡中华人民共和国公民和获准在我国境内就业的外籍人员，均可申请参加执业药师职业资格考试。取得药学类、中药学类专业大专学历，在药学或中药学岗位工作满4年。"},
      {q:"45. 乙是香港人士，中医学硕士，考执业药师考试需在药学或中药学岗位工作满足的年限为",opts:["A.1年","B.2年","C.4年","D.5年"],ans:"B",exp:"取得药学类、中药学类专业第二学士学位、研究生班毕业或硕士学位，在药学或中药学岗位工作满1年；取得药学类、中药学类相关专业相应学历或学位的人员，在药学或中药学岗位工作的年限相应增加1年。中医学属于相关专业，因此中医学硕士需在药学或中药学岗位工作满足的年限为2年。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"46. 属于药品零售连锁企业必须凭处方销售的药品是",opts:["A.麦角胺","B.枸杞","C.右美沙芬","D.复方氨酚烷胺胶囊"],ans:"C",exp:"第二类精神药品、医疗用毒性药品、禁止零售的药品以外其他按兴奋剂管理的药品、含麻醉药品的复方口服溶液，药品零售企业必须凭处方销售，右美沙芬属于第二类精神药品。"},
      {q:"47. 药品零售企业不得经营的药品是",opts:["A.麦角胺","B.枸杞","C.右美沙芬","D.复方氨酚烷胺胶囊"],ans:"A",exp:"药品零售企业不得经营放射性药品、体内诊断试剂、体外诊断试剂(药品)、疫苗、药品类易制毒化学品、第一类精神药品、注射用A型肉毒毒素、终止妊娠药品（包括含有“米非司酮”成分的所有药品制剂）、蛋白同化制剂、肽类激素(胰岛素除外)、中药配方颗粒、医疗机构制剂、麻醉药品以及我国法律法规规定的其他禁止零售的药品。麦角胺属于药品类易制毒化学品。"},
      {q:"48. 储存时需双人双锁，且不得网络销售的药品是",opts:["A.麦角胺","B.枸杞","C.右美沙芬","D.复方氨酚烷胺胶囊"],ans:"A",exp:"禁止网络销售的药品有：中药配方颗粒、医疗机构制剂、麻醉药品、精神药品、医疗用毒性药品、放射性药品、药品类易制毒化学品、血液制品、疫苗、依托咪酯注射剂。右美沙芬和麦角胺均不得网络销售。麦角胺属于药品类易制毒化学品，储存时需要双人双锁。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"49. 医疗机构配制制剂为假药，并且情节严重的，吊销医疗机构制剂许可证，不受理制剂许可的时限为",opts:["A.3年","B.5年","C.10年","D.终身"],ans:"B",exp:"生产、销售假药的，没收违法生产、销售的药品和违法所得，责令停产停业整顿，吊销药品批准证明文件，并处违法生产、销售的药品货值金额15倍以上30倍以下的罚款；货值金额不足10万元的，按10万元计算；情节严重的，吊销药品生产许可证、药品经营许可证或者医疗机构制剂许可证，10年内不受理其相应申请；药品上市许可持有人为境外企业的，10年内禁止其药品进口。"},
      {q:"50. 药品上市许可持有人为境外企业的，在我国境内销售的药品为假药，并且情节严重的，禁止其药品进口的时限为",opts:["A.3年","B.5年","C.10年","D.终身"],ans:"C",exp:"药品上市许可持有人为境外企业的，在我国境内销售的药品为假药，并且情节严重的，禁止其药品进口的时限为10年。"},
      {q:"51. 生产、销售假药，对法定代表人、主要负责人、直接负责的主管人员和其他责任人员禁止从事药品生产经营活动的时限为",opts:["A.3年","B.5年","C.10年","D.终身"],ans:"D",exp:"生产、销售假药，对法定代表人、主要负责人、直接负责的主管人员和其他责任人员，没收违法行为发生期间自本单位所获收入，并处所获收入百分之三十以上三倍以下的罚款，终身禁止从事药品生产经营活动，并可以由公安机关处五日以上十五日以下的拘留。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"52. 对于部分专利药品、独家生产药品的采购方式是",opts:["A.谈判采购","B.定点生产、议价采购","C.直接挂网采购","D.招标采购"],ans:"A",exp:"谈判采购药品用于部分专利药品、独家生产药品，建立公开透明、多方参与的价格谈判机制。"},
      {q:"53. 对于多家企业生产的非专利药品的采购方式是",opts:["A.谈判采购","B.定点生产、议价采购","C.直接挂网采购","D.招标采购"],ans:"D",exp:"招标采购用于临床用量大、采购金额高、多家企业生产的基本药物和非专利药品，医院按中标价格采购。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"54. 公民、法人或者其他组织认为行政行为侵犯其合法权益，可以自知道或者应当知道该行政行为之日起提起行政复议的期限为",opts:["A.5日","B.15日","C.30日","D.60日"],ans:"D",exp:"公民、法人或者其他组织认为行政行为侵犯其合法权益，可以自知道或者应当知道该行政行为之日起60日内提起行政复议。"},
      {q:"55. 行政复议机关收到行政复议申请后，审查做出是否受理决定的期限为",opts:["A.5日","B.15日","C.30日","D.60日"],ans:"A",exp:"行政复议机关收到行政复议申请后，应在5日内进行审查决定是否受理。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"56. 已列入《非首次进口药材品种目录》的药品是",opts:["A.罂粟壳","B.草茎","C.西洋参","D.蟾酥"],ans:"C",exp:"已列入《非首次进口药材品种目录》的中药材进口品种主要有：西洋参、乳香、没药及血竭、西红花、高丽红参、甘草、石斛、豆蔻、沉香、砂仁、胖大海等。"},
      {q:"57. 每张处方不得超过3日用量，连续使用不得超过7日，成人一次的常用量为每天3～6克的药品是",opts:["A.罂粟壳","B.草茎","C.西洋参","D.蟾酥"],ans:"A",exp:"罂粟壳不得单方发药，必须凭有麻醉药处方权的执业医师签名的淡红色处方方可调配，每张处方不得超过3日用量，连续使用不得超过7日，成人一次的常用量为每天3～6克。处方保存3年备查。"},
      {q:"58. 纳入食药物质目录管理，只能作为香辛料和调味品使用的药品是",opts:["A.罂粟壳","B.草茎","C.西洋参","D.蟾酥"],ans:"B",exp:"丁香、八角茴香、山药、山楂、乌梅、木瓜、龙眼肉（桂圆）、决明子、百合、阿胶、枣（大枣、酸枣、黑枣）、罗汉果、郁李仁、金银花、姜（生姜、干姜）、藿香、党参、铁皮石斛、西洋参、黄芪、灵芝、山茱萸、天麻、杜仲叶、当归等常见的中药材都被纳入食药物质目录管理。当归、山奈、西红花、草果、姜黄、荜茇只能作为香辛料和调味品使用。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"59. 处方药转换为非处方药的流程中，通过技术评价并拟予转换的品种，将在药品评价中心网站进行公示的期限为",opts:["A.15日","B.1个月","C.3个月","D.6个月"],ans:"B",exp:"药品上市许可持有人提出处方药转换为非处方药的申请或建议，相关资料直接报送药品评价中心。药品评价中心依据相关技术原则和要求组织开展技术评价，通过技术评价并拟予转换的品种，将在药品评价中心网站进行为期1个月的公示。"},
      {q:"60. 列入国家实施停产报告的短缺药品清单的药品，药品上市许可持有人有计划停止生产的，应当向药品监督管理部门报告，其报告时间应当为计划停产实施前的",opts:["A.15日","B.1个月","C.3个月","D.6个月"],ans:"D",exp:"列入国家实施停产报告的短缺药品清单的药品，药品上市许可持有人停止生产的，应当在计划停产实施6个月前向所在地省（区、市）药品监督管理部门报告。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"61. 承担药品严重不良反应、严重不良事件原因的实验研究工作的是",opts:["A.中国食品药品检定研究院","B.国家药品监督管理局药品审评中心","C.国家药品监督管理局食品药品审核查验中心","D.国家药品监督管理局药品评价中心"],ans:"A",exp:"中国食品药品检定研究院承担药品、医疗器械、化妆品质量标准、技术规范、技术要求、检验检测方法的制修订以及技术复核工作。组织开展检验检测新技术、新方法、新标准研究。承担相关产品严重不良反应、严重不良事件原因的实验研究工作。"},
      {q:"62. 组织开展药品不良反应、药物滥用监测工作的是",opts:["A.中国食品药品检定研究院","B.国家药品监督管理局药品审评中心","C.国家药品监督管理局食品药品审核查验中心","D.国家药品监督管理局药品评价中心"],ans:"D",exp:"国家药品监督管理局药品评价中心组织开展药品不良反应、医疗器械不良事件、化妆品不良反应、药物滥用监测工作。"},

    {type:"配伍选择题",subs:[

    ]},
    {type:"配伍选择题",subs:[

      {q:"82. 消费者有权要求经营者提供质量保障、价格合理、计量正确的商品，这种消费者权利属于",opts:["A.知识获取权","B.公平交易权","C.真相知悉权","D.安全保障权"],ans:"B",exp:"消费者享有公平交易的权利。经营者与消费者进行交易，应当遵循自愿、平等、公平、诚实信用的原则。消费者在购买商品或者接受服务时，有权获得质量保障、价格合理、计量正确等公平交易条件，有权拒绝经营者的强制交易行为。"}
    ]},

    // ===== 三、综合分析选择题（86-95） =====
    {type:"最佳选择题",q:"86. 关于开具的处方，说法正确的是",opts:["A.处方开具当日有效，一般不得超过3日用量","B.患者6岁，处方颜色应为淡黄色，并在右上角标注“儿科”字样","C.处方应当准确规范书写，并妥善保存一年备查","D.患者情况特殊，依据处方外流等相关规定，医疗机构应当禁止就诊人员持处方到药品零售企业购买药品"],ans:"C",exp:"患者男6岁，为儿童，儿科药品处方由调剂处方药品的医疗机构妥善保存1年。处方开具当日有效，普通处方一般不得超过7日用量，急诊处方不得超过3日用量。儿科处方颜色应为淡绿色，并在右上角标注“儿科”字样。除麻醉药品、精神药品、医疗用毒性药品和儿科处方外，医疗机构不得限制门诊就诊人员持处方到药品零售企业购药，是限制不是禁止。"},
    {type:"最佳选择题",q:"87. 药师郑某在审核过程中发现，开具的处方存在问题，联系执业医师赵某驳回该处方并给出修改建议，下列关于驳回建议说法正确的是",opts:["A.中药饮片需要单独开方，存在处方不规范行为，需要重新开具处方","B.处方用药与诊断不相符，存在处方不适宜的情况，需要重新开具处方","C.中药饮片的每张处方不得超过5种药品，存在处方不规范行为，需要重新开具处方","D.医师赵某并未在处方中签名，属于不合法处方，需要重新开具处方"],ans:"A",exp:"中药饮片和中药注射剂要单独开具处方，赵某开具的处方中，中药饮片和中成药在一张处方中列明，属于不规范处方，需要重新开具处方。处方中开具的药品符合患者症状要求，不存在不适宜的情况。西药、中成药处方每一种药品应另起一行，每张处方不得超过5种药品。医师赵某并未在处方中签名，属于不规范处方。"},
    {type:"最佳选择题",q:"88. 关于医疗机构采购处方中所使用的中药饮片和中成药的说法，正确的是",opts:["A.医疗机构必须从中药饮片生产企业购进处方中所列中药饮片","B.在遴选小儿清肺化痰颗粒时，应遵守“一品两规”和药品总品种数限制","C.在遴选小儿清肺化痰颗粒及其他儿童所用的中成药时，应满足不同年龄层次患儿的需求","D.处方中所列的中药饮片和中成药，医疗机构均应通过省级药品集中采购平台采购"],ans:"C",exp:"儿童用药应当满足不同年龄层次患儿需求，属于因特殊诊疗需要使用其他剂型和剂量规格药品的情况，各医疗机构要放宽对儿童适宜品种、剂型、规格的配备限制。医疗机构应当从药品上市许可持有人或者具有药品生产、经营资格的企业购进药品；但是，购进未实施审批管理的中药饮片除外。遴选儿童用药时（仅限于药品说明书中有明确儿童适应症和儿童用法用量的药品），可不受“一品两规”和药品总品种数限制。医院使用的所有药品（不含中药饮片）均应通过省级药品集中采购平台采购。"},
    {type:"最佳选择题",q:"89. 关于“X中药配方颗粒”的管理，不符合要求的是",opts:["A.“X中药配方颗粒”上市前，由生产企业报A省药品监督管理部门备案","B.“X中药配方颗粒”销售至C省中医院，应当符合C省药品监督管理部门制定的标准","C.“X中药配方颗粒”实行单位定量包装，必须凭处方为患者开具使用","D.“X中药配方颗粒”生产时使用从B批发企业购进X饮片"],ans:"D",exp:"生产企业应当自行炮制用于中药配方颗粒生产的中药饮片。"},
    {type:"最佳选择题",q:"90. 根据材料，患者使用的“X中药配方颗粒”医保支付时符合规定的是",opts:["A.不纳入医保支付范围","B.因X饮片为医保甲类，故“X中药配方颗粒”参照甲类管理","C.因“X中药配方颗粒”无国家药品标准，故参照乙类管理","D.因X饮片已纳入医保支付范围，故“X中药配方颗粒”参照乙类管理"],ans:"D",exp:"中药饮片品种已纳入医保支付范围的，各省级医保部门可综合考虑临床需要、基金支付能力和价格等因素，经专家评审后将与中药饮片对应的中药配方颗粒纳入支付范围，并参照乙类管理。"},
    {type:"最佳选择题",q:"91. 某省药品监督管理部门对A药业有限公司抽查检验费用归属说法正确的是",opts:["A.检验费用由某省药品监督管理部门承担，所抽检的药品样品费用由A药业有限公司承担","B.检验费用、所抽检的药品样品费用都由某省药品监督管理部门承担","C.检验费用由A药业有限公司承担，所抽检的药品样品费用由某省药品监督管理部门承担","D.检验费用、所抽检的药品样品费用都由A药业有限公司承担"],ans:"B",exp:"药品监督管理部门根据监督管理的需要，可以对药品质量进行抽查检验。抽查检验应当按照规定抽样，并不得收取任何费用；抽样应当购买样品。所以某省药品监督管理部门此次抽查检验的费用均由某省药品监督管理部门承担。"},
    {type:"最佳选择题",q:"92. 对于A药业有限公司代理的日本某制药公司所生产的中药注射剂的行为，下列说法中正确的是",opts:["A.该中药注射剂在中国首次销售前需要完成指定检验","B.该中药注射剂在中国每次销售前都需要完成指定检验","C.该中药注射剂如果已经取得药品生产批准证明文件，并经药品生产企业检验合格，则无需再进行指定检验","D.该中药注射剂在日本进行生产前就应当完成指定检验"],ans:"A",exp:"必须经过指定检验，否则不得销售或者进口的药品有：首次在中国销售的药品；国家药品监督管理部门规定的生物制品；国务院规定的其他药品。对于这些药品，虽然已经取得药品生产批准证明文件，并经药品生产企业检验合格，但是如果在销售前没有经过药品检验机构对其药品实施检验，仍然会认定该销售行为是违法行为。"},
    {type:"最佳选择题",q:"93. L药品在中国进行召回时，下列说法中正确的是",opts:["A.因某境外制药公司是L药品的上市许可持有人，因此中国境内L药品的召回由该境外制药公司负责实施，并向中国国家药品监督管理局报告药品召回和处理情况","B.中国境内L药品的召回应当由该境外制药公司指定的境内代理人负责实施，并向国家药品监督管理局报告药品召回和处理情况","C.中国境内L药品的召回应当由该境外制药公司指定的境内代理人负责实施。并向其所在地的省级药品监督管理部门和省级卫生健康主管部门报告药品召回和处理情况","D.中国境内L药品的召回由中国国家药品监督管理局实施，召回完成后由境外制药公司负责赔偿损失等事项"],ans:"C",exp:"境外生产药品涉及在境内实施召回的，应当由境外药品上市许可持有人指定的在中国境内履行药品上市许可持有人义务的企业法人（境内代理人）组织实施。境内代理人在境内实施药品召回的，应当按照《药品召回管理办法》的规定组织实施召回，并向其所在地省级药品监督管理部门和卫生健康主管部门报告药品召回和处理情况。"},
    {type:"最佳选择题",q:"94. L药品如果需要销毁，下列操作中正确的是",opts:["A.必须在储存召回L药品所在地县级以上药品监督管理部门或者公证机构监督下销毁","B.必须在储存召回L药品所在地省级以上药品监督管理部门或者公证机构监督下销毁","C.必须在储存召回L药品所在地县级以上药品监督管理部门或者卫生健康主管部门监督下销毁","D.必须在储存召回L药品所在地省级以上药品监督管理部门或者卫生健康主管部门监督下销毁"],ans:"A",exp:"召回药品需要销毁的，应当在药品上市持有人、药品生产企业或者储存召回药品所在地县级以上药品监督管理部门或者公证机构监督下销毁。"},
    {type:"最佳选择题",q:"95. 在召回完成后，召回实施主体将药品召回和处理情况向所在地省级药品监督管理部门和卫生健康主管部门报告的期限为",opts:["A.一级召回、二级召回、三级召回均在10个工作日完成该报告","B.一级召回、二级召回、三级召回均在15个工作日完成该报告","C.一级召回、二级召回、三级召回均在30个工作日完成该报告","D.一级召回在1日内、二级召回在3日内、三级召回在7日内完成该报告"],ans:"A",exp:"在召回完成后10个工作日内，将药品召回和处理情况向所在地省级药品监督管理部门和卫生健康主管部门报告。"},

    // ===== 四、多项选择题（96-100） =====
    {type:"多项选择题",q:"96. 2024年10月，国家药品监督管理局、国家中医药管理局发布《关于支持珍稀濒危中药材替代品研制有关事项的公告》(2024年第129号)，下列属于现阶段重点支持用于中药生产替代品研制的中药材有",opts:["A.羚羊角","B.牛黄","C.穿山甲","D.冬虫夏草"],ans:"ABCD",exp:"结合中药资源和具体品种情况，现阶段重点支持穿山甲、羚羊角、牛黄、熊胆粉、冬虫夏草等珍稀濒危中药材用于中药生产的替代品的研制。"},
    {type:"多项选择题",q:"97. 下列药品中一定不得作为乙类非处方药的有",opts:["A.含有毒性(有毒)药材的中成药","B.发生过不良事件的中成药","C.组方中没有国家标准药材的中成药","D.中西药复方制剂"],ans:"AD",exp:"以下情况下不应作为乙类非处方药：①儿童用药（有儿童用法用量的均包括在内，维生素、矿物质类除外）；②化学药品含抗菌药物、激素等成分的；③中成药含毒性药材（包括大毒和有毒）和重金属的口服制剂、含大毒药材的外用制剂；④严重不良反应发生率达万分之一以上；⑤中成药组方中包括无国家或省级药品标准药材的（药食同源的除外）；⑥中西药复方制剂；⑦辅助用药。"},
    {type:"多项选择题",q:"98. 我国进出口药品实行分类和目录管理，属于我国公布的药品进出口管理目录有",opts:["A.《生物制品目录》","B.《麻醉药品管制品种目录》","C.《出口药品目录》","D.《精神药品管制品种目录》"],ans:"ABD",exp:"我国公布的药品进出口管理目录有：《进口药品目录》《精神药品管制品种目录》《麻醉药品管制品种目录》和《生物制品目录》。"},
    {type:"多项选择题",q:"99. 根据国家药品监督管理部门发布的《关于对医疗机构应用传统工艺配制中药制剂实施备案管理的公告》，下列属于传统中药制剂实行备案管理的有",opts:["A.由中药饮片经粉碎后制成的胶囊剂","B.由中药饮片用传统方法提取制成的酊剂","C.由中药饮片用传统方法提取制成的酒剂","D.由中药饮片制成的中药配方颗粒"],ans:"ABC",exp:"备案管理的传统中药制剂包括：①由中药饮片经粉碎或仅经水或油提取制成的固体（丸剂、散剂、丹剂、锭剂等）、半固体（膏滋、膏药等）和液体（汤剂等）传统剂型。②由中药饮片经水提取制成的颗粒剂。③由中药饮片经粉碎后制成的胶囊剂。④由中药饮片用传统方法提取制成的酊剂、酒剂。中药配方颗粒不得作为传统中药制剂实行备案管理。"},
    {type:"多项选择题",q:"100. 药材进口单位是指中国境内办理首次进口药材审批的申请人或者办理进口药材备案的单位，下列属于药材进口单位的有",opts:["A.中成药上市许可持有人","B.中药生产企业","C.具有中药饮片经营范围的药品批发企业","D.具有中医诊疗科室的中医院"],ans:"ABC",exp:"药材进口单位是指办理首次进口药材审批的申请人或者办理进口药材备案的单位，应当是中国境内的中成药上市许可持有人、中药生产企业，以及具有中药材或者中药饮片经营范围的药品经营企业。"}
  ]
},
 {
  name: "押题密卷（六）",
  questions: [
    // ===== 一、最佳选择题（1-40） =====
    {type:"最佳选择题",q:"1. 下列关于健康中国战略的描述，错误的是",opts:["A.健康中国战略主题是“共建共享、全民健康”","B.健康中国战略以人民健康为中心","C.健康中国战略坚持以基层为重点，以科学发展为动力","D.健康中国战略坚持预防为主、防治结合、中西医并重"],ans:"C",exp:"健康中国战略坚持以基层为重点，以改革创新为动力。"},
    {type:"最佳选择题",q:"2. 下列关于基本医疗卫生服务的内涵与原则的说法，错误的是",opts:["A.医疗卫生事业应当坚持公益性原则","B.基本医疗服务由国家免费提供","C.医疗卫生与健康事业应当坚持以人民为中心，为人民健康服务","D.卫生健康工作理念从以治病为中心转变到以人民健康为中心"],ans:"B",exp:"基本公共卫生服务由国家免费提供。"},
    {type:"最佳选择题",q:"3. 下列关于药品命名的规定，不正确的是",opts:["A.药品的通用名称是由国家药典委员会制订的并报国家药品监督管理局备案的药品法定名称","B.已经作为药品通用名称的，该名称不得作为药品商标使用，不受专利和行政保护等的影响","C.药品的化学名称根据药物的化学成分、化学结构，按照相关规则而命名","D.相同通用名的药品，即使药品上市许可持有人不同，商品名也必须相同"],ans:"D",exp:"相同通用名的药品，由于药品上市许可持有人的不同，可以有不同的商品名。"},
    {type:"最佳选择题",q:"4. 执业药师独立公开发表执业药师类学术论文，每人每年最多可以获得的继续教育学时数是",opts:["A.90学时","B.60学时","C.40学时","D.10学时"],ans:"B",exp:"执业药师独立公开发表执业药师类学术论文，每篇最多折算为10学时，每人每年最多折算为60学时。"},
    {type:"最佳选择题",q:"5. 关于法律效力层级和法律冲突解决的说法，错误的是",opts:["A.上位法效力高于下位法","B.同一位阶的法之间，新规定优于旧规定","C.部门规章与地方政府规章不一致时，由国务院裁决","D.行政法规之间对于同一事项的新的一般规定与旧的特别规定不一致，不能确定如何适用时，由全国人民代表大会常务委员会裁决"],ans:"D",exp:"行政法规之间对同一事项的新的一般规定与旧的特别规定不一致，不能确定如何适用时，由国务院裁决。"},
    {type:"最佳选择题",q:"6. 甲药品零售企业取得了罂粟壳中药饮片的经营资质，在其药品经营许可证经营范围项目标注格式正确的是",opts:["A.“罂粟壳中药饮片”","B.“麻醉药品（罂粟壳）”","C.“中药饮片（含罂粟壳）”","D.药品零售企业禁止经营罂粟壳，因此经营范围中不得出现罂粟壳"],ans:"C",exp:"药品零售企业经营罂粟壳中药饮片、毒性中药饮片等，应当在“中药饮片”经营范围中予以单独标注，如“中药饮片（含罂粟壳）”“中药饮片（含毒性中药饮片）”。"},
    {type:"最佳选择题",q:"7. 下列关于仅从事乙类非处方药零售活动的规定描述，不正确的是",opts:["A.仅从事乙类非处方药零售活动的实施告知承诺制审批","B.申请人向所在地市县级药品监督管理部门提交申请材料和承诺书","C.形式审查符合条件的，药品监督管理部门应当准予许可，5个工作日之内向其颁发药品经营许可证","D.药品监督管理部门应当自许可决定作出之日起3个月内对其组织开展技术审查和现场检查"],ans:"C",exp:"申请人向所在地市县级药品监督管理部门提交申请材料和承诺书后，形式审查符合条件的，药品监督管理部门应当准予许可，当日向其颁发药品经营许可证。"},
    {type:"最佳选择题",q:"8. 行政强制的分类包括行政强制措施和行政强制执行。下列不属于行政强制措施的是",opts:["A.冻结存款、汇款","B.限制公民人身自由","C.依法处理或拍卖查封、扣押的场所、设施或财物","D.扣押财物"],ans:"C",exp:"依法处理或拍卖查封、扣押的场所、设施或财物属于行政强制执行。"},
    {type:"最佳选择题",q:"9. 下列关于药品上市许可持有人委托销售管理的描述，不正确的是",opts:["A.委托销售的，应当委托符合条件的药品经营企业","B.受托药品经营企业不得再次委托销售","C.委托销售放射性药品，受托方应当取得《放射性药品经营许可证》","D.经药品监督管理部门批准，中药配方颗粒可以委托销售"],ans:"D",exp:"所有药品经营企业的经营范围都无法涵盖疫苗和中药配方颗粒，这两类药品不得委托销售。"},
    {type:"最佳选择题",q:"10. 下列关于第二类精神药品零售管理的规定，不正确的是",opts:["A.销售第二类精神药品时需要查验个人消费者身份证信息","B.不得向未成年人销售第二类精神药品","C.第二类精神药品不得陈列","D.第二类精神药品必须凭第二类精神药品专用处方销售"],ans:"A",exp:"销售第二类精神药品时，药学服务人员应当确认个人消费者为成年人，不确定时可查验个人消费者身份证信息，不得向未成年人销售第二类精神药品。"},
    {type:"最佳选择题",q:"11. 药品监督管理部门在检查中发现药品零售企业违规销售含米非司酮成分的复方制剂，且导致消费者乙服药后送医抢救，药品监督管理部门对甲的罚款符合规定的是",opts:["A.处2万元以上5万元以下的罚款","B.处5万元以上10万元以下的罚款","C.处10万元以上20万元以下的罚款","D.处15万元以上30万元以下的罚款"],ans:"C",exp:"药品零售企业销售国家禁止零售的药品，法律、行政法规未作规定的，责令限期改正处5万元以上10万元以下罚款；造成危害后果的，处10万元以上20万元以下罚款。"},
    {type:"最佳选择题",q:"12. 下列药品中不得再次委托运输的是",opts:["A.含麻黄碱类复方制剂","B.含麻醉药品的复方制剂","C.含精神药品的复方制剂","D.医疗用毒性药品"],ans:"D",exp:"疫苗、麻醉药品、精神药品、医疗用毒性药品、放射性药品、药品类易制毒化学品等特殊管理的药品以及中药配方颗粒不得再次委托运输。"},
    {type:"最佳选择题",q:"13. 根据药品监督管理部门制定的年度检查计划，对药品生产企业遵守药品生产质量管理规范情况开展的监督检查为",opts:["A.许可检查","B.特殊检查","C.有因检查","D.常规检查"],ans:"D",exp:"根据药品监督管理部门制定的年度检查计划，对药品上市许可持有人、药品生产、经营企业、药品使用单位遵守有关规定情况开展的监督检查为常规检查。"},
    {type:"最佳选择题",q:"14. 药品批发企业在验收药品时应逐批抽样验收，抽取的样品应具有代表性。下列药品中在药品验收时可以不开箱检查的药品是",opts:["A.外包装及封签完整的原料药","B.药品生产企业有特殊质量控制要求的药品","C.同一批号的药品","D.零货、拼箱的药品"],ans:"A",exp:"在药品验收时可以不开箱检查的药品是：外包装及封签完整的原料药、实施批签发管理的生物制品。"},
    {type:"最佳选择题",q:"15. 药品零售企业在经营下列药品时不一定需要凭处方销售的药品是",opts:["A.所有注射剂","B.含麻醉药品的复方口服溶液","C.肿瘤治疗药物","D.含麻黄碱类复方制剂"],ans:"D",exp:"并不是所有含麻黄碱类复方制剂都要凭处方销售，麻黄碱含量大于30mg（不含30mg）的含麻黄碱类复方制剂按处方药管理，零售药店需要凭处方销售。"},
    {type:"最佳选择题",q:"16. 下列关于进口临床急需少量药品管理的说法，错误的是",opts:["A.医疗机构因临床急需进口少量药品的，经国家药品监督管理局或国务院授权的省级人民政府批准，可以进口","B.进口的药品应当在指定的医疗机构内用于特定医疗目的，不得擅自扩大使用单位或使用目的","C.医疗机构凭药监部门出具的关于临床急需少量药品进口复函向口岸药品监督管理部门申请办理《进口药品通关单》，经口岸药品检验机构检验合格后方可进口并使用","D.适用药品范围是国内无注册上市、无企业生产或短时期内无法恢复生产的境外已上市临床急需少量药品"],ans:"C",exp:"医疗机构凭药监部门出具的关于临床急需少量药品进口复函向口岸药品监督管理部门申请办理《进口药品通关单》，此类进口药品，无需进行口岸检验。"},
    {type:"最佳选择题",q:"17. 根据《麻醉药品和精神药品管理条例》，下列关于麻醉药品和精神药品零售规定的说法，不符合规定的是",opts:["A.第一类精神药品不得零售","B.罂粟壳必须凭盖有乡镇卫生院以上医疗机构公章的处方销售，不得生用，严禁单味零售","C.非连锁药品零售企业销售第二类精神药品时，应确保购药者为成年人","D.从事第二类精神药品零售业务的企业应凭处方零售第二类精神药品，第二类精神药品一般每张处方不得超过7日常用量"],ans:"C",exp:"非连锁药品零售企业不得经营第二类精神药品。"},
    {type:"最佳选择题",q:"18. 非处方药应遵循“应用安全、疗效确切、质量稳定、使用方便”的基本原则，下列说法中不符合“疗效确切”要求的是",opts:["A.药物不需要经常调整剂量","B.药物作用针对性强","C.药物功能主治明确","D.药物连续使用不易引起耐药性"],ans:"D",exp:"非处方药遴选原则中的“疗效确切”是指：①药物作用针对性强，功能主治明确；②药物不需要经常调整剂量；③连续使用不引起耐药性。D选项错在“不易”这个词。"},
    {type:"最佳选择题",q:"19. 下列关于医疗机构药事管理机构的描述，不正确的是",opts:["A.药事管理组织是促进临床合理用药、科学管理医疗机构药事工作、具有学术研究性质的内部咨询机构","B.二级以上医院设立药事管理与药物治疗学委员会","C.药事管理与药物治疗学委员会由高级技术职务任职资格的药学、临床医学、护理和医院感染管理、医疗行政管理等人员组成","D.药事管理组织属于医疗机构常设行政部门"],ans:"D",exp:"药事管理组织是促进临床合理用药、科学管理医疗机构药事工作、具有学术研究性质的内部咨询机构，既不是行政管理部门，也不属于常设机构。"},
    {type:"最佳选择题",q:"20. 下列关于药品委托生产管理的说法中，错误的是",opts:["A.药品委托生产的委托方应具有能对所生产药品进行质量管理和质量检验的机构、人员","B.药品委托生产时，应向持有人所在地的省级药品监督管理部门申请办理《药品生产许可证》","C.受托方不得将接受委托生产的药品再次委托第三方生产","D.药品委托生产后，负责该药品生产环节质量管理责任的主体由持有人转变为受托方"],ans:"D",exp:"持有人不得通过质量协议将法定只能由持有人履行的义务和责任委托给受托方承担。"},
    {type:"最佳选择题",q:"21. 下列关于医疗机构儿童用药采购的说法，错误的是",opts:["A.儿童用药仅限于药品说明书中有明确儿童适应症和儿童用法用量的药品","B.遴选儿童用药时，也要受到“一品两规”和药品总品种数的限制，医疗机构药品采购必须按规范的流程执行","C.儿童用药应当满足不同年龄层次患儿需求","D.属于因特殊诊疗需要使用其他剂型和剂量规格药品的情况，各医疗机构要放宽对儿童适宜品种、剂型、规格的配备限制"],ans:"B",exp:"遴选儿童用药时，可不受“一品两规”和药品总品种数限制，进一步拓宽儿童用药范围。"},
    {type:"最佳选择题",q:"22. 下列关于复方甘草片的购销行为中，符合规定的是",opts:["A.药品生产企业使用现金交易复方甘草片","B.具有蛋白同化制剂、肽类激素批发资质的药品批发企业方可经营复方甘草片","C.个人消费者使用现金向药品零售企业购买复方甘草片","D.药品零售连锁企业可以直接销售复方甘草片，非连锁零售企业不得销售复方甘草片"],ans:"C",exp:"企业之间不得使用现金交易含特殊药品复方制剂。批发含麻黄碱类复方制剂要求具有蛋白同化制剂、肽类激素批发资质，批发复方甘草片并无此资质要求。药品零售连锁企业或非连锁企业均可经营含特殊药品复方制剂。"},
    {type:"最佳选择题",q:"23. 下列关于医疗机构制剂管理的内容，不正确的是",opts:["A.为医疗机构下发医疗机构制剂批准文号的单位是省级药品监督管理部门","B.医疗机构制剂批准文号的有效期为3年，有效期届满前3个月提出再注册申请","C.医疗机构制剂仅限于本单位临床需要而市场上无供应的品种","D.经省级药品监督管理部门批准，医疗机构可以配制临床需要而市场上无供应的大株红景天注射液"],ans:"D",exp:"不得作为医疗机构制剂申报的情形包括：除变态反应原外的生物制品；含有未经国家药品监督管理局批准的活性成分的品种；市场上已有供应的品种；医疗用毒性药品；中药、化学药组成的复方制剂；放射性药品；中药注射剂。大株红景天注射液属于中药注射剂，医疗机构不得配制。"},
    {type:"最佳选择题",q:"24. 道地中药材，是指经过中医临床长期应用优选出来的，产在特定地域，与其他地区所产同种中药材相比，品质和疗效更好，且质量稳定，具有较高知名度的中药材。下列关于道地中药材管理的描述，错误的是",opts:["A.《全国道地药材生产基地建设规划（2018—2025年）》提出到2025年全国建成道地药材生产基地总面积达到2500万亩以上","B.地理标志产品是优良品质的代表","C.目前被批准为地理标志的中药材主要为道地药材","D.采取地理标志产品保护有助于保护中药材的产品质量和现代加工工艺"],ans:"D",exp:"采取地理标志产品保护有助于保护中药材的产品质量和传统生产工艺。"},
    {type:"最佳选择题",q:"25. 疫苗上市许可持有人违反疫苗储存、运输管理规范有关冷链储存要求的行为，其应承担的法律责任可能为",opts:["A.由省级以上人民政府药品监督管理部门责令改正，给予警告，没收违法所得","B.责令疫苗上市许可持有人对违法储存的疫苗予以销毁","C.情节严重的，对疫苗上市许可持有人处违法储存疫苗货值金额10倍以上30倍以下的罚款，货值金额不足10万元的，按10万元计算","D.情节严重的，疫苗上市许可持有人的法定代表人5年内禁止从事药品生产经营活动"],ans:"C",exp:"A选项应由县级以上人民政府药品监督管理部门责令改正，给予警告，没收违法所得。B选项应由县级以上人民政府药品监督管理部门对违法储存的疫苗予以销毁。D选项情节严重的，疫苗上市许可持有人的法定代表人10年内直至终身禁止从事药品生产经营活动。"},
    {type:"最佳选择题",q:"26. 下列关于毒性中药饮片管理的描述，错误的是",opts:["A.产地集中的品种，如附子、朱砂、雄黄等按省区确定2—3个定点企业","B.毒性中药饮片包装要有突出、鲜明的毒药标志","C.定点生产的毒性中药饮片，应销往具有经营毒性中药饮片资格的经营单位或直销到医疗单位","D.毒性中药饮片实行专人、专库（柜）、专账、专用衡器、双人双锁保管"],ans:"A",exp:"产地集中的品种，如附子、朱砂、雄黄等全国集中统一定点生产，供全国使用。"},
    {type:"最佳选择题",q:"27. 下列对于血液制品生产管理的说法中，不符合规定的是",opts:["A.血液制品生产单位不得向无《单采血浆许可证》的单采血浆站收集原料血浆","B.血液制品生产单位对于经复检不合格的原料血浆，不得投料生产，并自行按规定程序和方法予以销毁，并作记录","C.新建血液制品生产单位的，应经国家药品监督管理局进行立项审查同意后，由省级药品监督管理部门按规定审核批准","D.血液制品生产单位生产国内已经生产的品种，必须依法向国家药品监督管理局申请产品批准文号"],ans:"B",exp:"血液制品生产单位对于经复检不合格的原料血浆，不得投料生产，并必须在省级药品监督管理部门监督下按规定程序和方法予以销毁，并作记录。"},
    {type:"最佳选择题",q:"28. 下列不属于化学药注册类别的是",opts:["A.化学药创新药","B.化学药改良型新药","C.同名同方药","D.仿制药"],ans:"C",exp:"同名同方药为中药的注册类别。"},
    {type:"最佳选择题",q:"29. 根据《化妆品监督管理条例（草案）》，按照放管并重要求，规定对化妆品产品和原料按风险高低分别实行注册和备案管理，并简化流程，下列关于化妆品管理的说法，错误的是",opts:["A.国家对特殊化妆品实行注册管理，对普通化妆品实行备案管理","B.化妆品新原料是在我国境内首次使用于化妆品的天然或者人工原料，经国家药品监督管理局注册后方可使用","C.用于染发、烫发、祛斑美白、防晒、防脱发的化妆品属于特殊化妆品","D.儿童化妆品指适用于年龄在12岁以下（含12岁）儿童，具有清洁、保湿、爽身、防晒等功效的化妆品，专有标识颜色为金色"],ans:"B",exp:"对具有防腐、防晒、着色、染发、祛斑美白功能的新原料，经国家药品监督管理局注册后方可使用；其他的新原料应当在使用前向国家药品监督管理局备案。"},
    {type:"最佳选择题",q:"30. 药品包装通常特指为在流通过程中保护药品，方便储运和促进销售，按一定的技术标准制作的容器、材料和辅助物等物品，用于盛放药品，起到防护作用。下列关于药品包装的说法，不正确的是",opts:["A.药品的每个最小销售单元的包装必须按规定印有或贴有标签并附说明书","B.药品的外包装指内包装以外的包装，按由里向外分为中包装和大包装","C.药品的内包装指外包装以内的包装，内包装应当符合药用要求，符合保障人体健康、安全的标准","D.药品最小销售单元的包装属于外包装"],ans:"D",exp:"药品的内包装系指直接与药品接触的包装（也称“药包材”）。药品最小销售单元的包装属于内包装。"},
    {type:"最佳选择题",q:"31. 根据《药品管理法》规定，生产、销售的疫苗属于劣药且情节严重的，对企业相关责任人员追究的行政责任不包括",opts:["A.没收违法行为发生期间自本单位所获收入","B.处5万元以上15万元以下的罚款","C.终身禁止从事药品生产经营活动","D.由公安机关处5日以上15日以下拘留"],ans:"B",exp:"生产、销售的疫苗属于劣药且情节严重的，由省级以上药品监督管理部门对法定代表人、主要负责人、直接负责的主管人员和关键岗位人员以及其他责任人员，没收违法行为发生期间自本单位所获收入，并处所获收入1倍以上10倍以下的罚款，终身禁止从事药品生产经营活动，由公安机关处5日以上15日以下拘留。B选项错误。"},
    {type:"最佳选择题",q:"32. 根据《反兴奋剂条例》，下列关于蛋白同化制剂、肽类激素管理的说法中，错误的是",opts:["A.蛋白同化制剂、肽类激素属于实施特殊管理的含兴奋剂药品","B.蛋白同化制剂、肽类激素的包装标识或说明书上应注明“运动员慎用”字样","C.药品生产企业可向药品零售企业销售肽类激素中的胰岛素","D.医疗机构对蛋白同化制剂、肽类激素的处方保存2年"],ans:"A",exp:"蛋白同化制剂、肽类激素属于实施严格管理的含兴奋剂药品。"},
    {type:"最佳选择题",q:"33. 负责药品、医疗器械、保健食品和特殊医学用途配方食品广告审查的部门是",opts:["A.省级市场监督管理部门","B.省级药品监督管理部门","C.省级市场监督管理部门、药品监督管理部门","D.国务院市场监督管理部门"],ans:"C",exp:"负责药品、医疗器械、保健食品和特殊医学用途配方食品广告审查的部门是省级市场监督管理部门、药品监督管理部门。"},
    {type:"最佳选择题",q:"34. 根据《中华人民共和国药品管理法》的有关规定，对生产、销售、使用假药进行行政处罚时不属于从重处罚的是",opts:["A.零售药店明知某药品是假药而销售，对人体健康造成伤害的","B.药品生产企业生产属于假药的血液制品","C.医疗机构明知某麻醉药品片剂已经变质，仍对患者进行使用","D.药品批发企业明知某中药注射剂为假药，仍进行销售"],ans:"C",exp:"以麻醉药品、精神药品、医疗用毒性药品、放射性药品、药品类易制毒化学品冒充其他药品，或者以其他药品冒充上述药品的需要从重处罚，C选项仅仅是给患者使用了属于假药的麻醉药品，并无冒充其他药品的行为。"},
    {type:"最佳选择题",q:"35. 根据《药品类易制毒化学品管理办法》，下列关于药品类易制毒化学品经营行为的说法中，错误的是",opts:["A.药品类易制毒化学品单方制剂仅能由麻醉药品全国性批发企业和区域性批发企业经销，不得零售","B.药品类易制毒化学品经营企业之间不得购销药品类易制毒化学品原料药","C.麻醉药品区域性批发企业之间不得购销药品类易制毒化学品的单方制剂","D.未实行药品批准文号管理的药品类易制毒化学品品种应纳入药品类易制毒化学品单方制剂渠道经营"],ans:"D",exp:"未实行药品批准文号管理的药品类易制毒化学品品种应纳入药品类易制毒化学品原料药渠道经营。"},
    {type:"最佳选择题",q:"36. 下列行为中，不属于按未遵守药品经营质量管理规范且情节严重的情形给予处罚的是",opts:["A.药品经营企业对已识别的风险未及时采取有效的风险控制措施，造成严重后果","B.药品经营质量管理和质量控制过程中，票据不真实，存在虚假欺骗行为","C.药品上市许可持有人委托不具备相应资质条件的企业销售药品","D.药品生产企业未配备专门质量受权人履行药品出厂放行责任"],ans:"D",exp:"D选项属于未遵守药品生产质量管理规范且情节严重的，并非未遵守药品经营质量管理规范。"},
    {type:"最佳选择题",q:"37. 2025年6月，甲药品上市许可持有人向其所在地的药品广告审查机关递交资料为其生产的药品A申请广告，在甲递交的资料中药品A的《药品注册证书》的有效期限最短，有效期至2028年6月。药品广告审查机关批准的药品A药品广告批准文号的有效期为",opts:["A.1年","B.2年","C.3年","D.5年"],ans:"C",exp:"药品广告批准文号的有效期：与产品注册证明文件、备案凭证或者生产许可文件最短的有效期一致；产品注册证明文件、备案凭证或者生产许可文件未规定有效期的，广告批准文号有效期为2年。由题干可知甲递交资料中药品A的《药品注册证书》的有效期最短，有效期至2028年6月，也就是还有3年有效期，因此药品广告审查机关批准的药品A药品广告批准文号的有效期为3年。"},
    {type:"最佳选择题",q:"38. 下列销售行为中，不属于不正当有奖销售行为的是",opts:["A.所设奖的兑奖条件信息不明确，影响兑奖","B.谎称有奖","C.故意让内定人员中奖","D.抽奖式的有奖销售，最高奖的金额为3万元"],ans:"D",exp:"抽奖式的有奖销售，最高奖的金额超过5万元的为不正当有奖销售行为。3万元未超过5万元，不属于不正当有奖销售。"},
    {type:"最佳选择题",q:"39. 根据《疫苗管理法》，下列关于疫苗上市后管理的规定中，错误的是",opts:["A.疾病预防控制机构以外的单位和个人不得向接种单位供应疫苗","B.疫苗的接收、购进、储存、配送等记录，应保存至疫苗有效期满后不少于5年备查","C.疫苗上市许可持有人向疾病预防控制机构指定的接种单位配送免疫规划疫苗时，可以收取运输费用","D.接受疫苗委托配送的企业不得再次委托配送疫苗"],ans:"C",exp:"免疫规划疫苗不得收费。"},
    {type:"最佳选择题",q:"40. 下列关于违反中医药法相关规定的法律责任说法正确的是",opts:["A.医疗机构应用传统工艺配制中药制剂未按照规定备案的，按照生产劣药给予处罚","B.医疗机构未按备案材料载明的要求配制中药制剂的，按照生产假药给予处罚","C.委托配制中药制剂应备案而未备案的，责令改正，没收违法所得，并处5万元以下罚款，向社会公告相关信息","D.在中药材种植过程中使用剧毒、高毒农药的，情节严重的，对其直接负责的主管人员和其他直接责任人员处10日以上15日以下的拘留"],ans:"B",exp:"医疗机构应用传统工艺配制中药制剂未按照规定备案的，按照生产假药给予处罚。委托配制中药制剂应备案而未备案的，责令改正，没收违法所得，并处3万元以下罚款，向社会公告相关信息。在中药材种植过程中使用剧毒、高毒农药的，情节严重的，对其直接负责的主管人员和其他直接责任人员处5日以上15日以下的拘留。"},

    // ===== 二、配伍选择题（41-85） =====
    {type:"配伍选择题",subs:[
      {q:"41. 属于不能纳入国家基本药物目录遴选范围的是",opts:["A.非临床治疗首选的品种","B.因被纳入诊疗项目等原因，无法单独收费的药品","C.被有关部门列入负面清单的药品","D.国家药品监督管理局撤销其药品批准证明文件的药品"],ans:"A",exp:"不能纳入国家基本药物目录遴选范围的情形包括：①主要用于滋补保健作用，易滥用的品种；②非临床治疗首选的品种；③因严重不良反应，国家药品监督管理局明确规定暂停生产、销售或者使用的品种；④含有国家濒危野生动植物药材的品种；⑤违背国家法律、法规，或者不符合伦理要求的品种。"},
      {q:"42. 属于需要从国家基本药物目录中调出的是",opts:["A.非临床治疗首选的品种","B.因被纳入诊疗项目等原因，无法单独收费的药品","C.被有关部门列入负面清单的药品","D.国家药品监督管理局撤销其药品批准证明文件的药品"],ans:"D",exp:"需要从国家基本药物目录中调出的情形包括：①药品标准被取消的；②国家药品监督管理局撤销其药品批准证明文件的；③发生严重不良反应，经过评估不宜作为国家基本药物使用的；④根据药物经济学评价，可被风险效益比或者成本效益比更优的品种替代的。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"43. 新药上市申请、首次申请上市仿制药、首次申请上市境外生产药品，进行的检验属于",opts:["A.抽查检验","B.指定检验","C.注册检验","D.复验"],ans:"C",exp:"新药上市申请、首次申请上市仿制药、首次申请上市境外生产药品，进行的检验属于注册检验。"},
      {q:"44. 结果由药品监督管理部门以药品质量公告形式发布的检验属于",opts:["A.抽查检验","B.指定检验","C.注册检验","D.复验"],ans:"A",exp:"结果由药品监督管理部门以药品质量公告形式发布的检验属于抽查检验。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"45. C表示",opts:["A.单体药品零售企业","B.药品零售连锁企业门店","C.药品零售连锁企业总部","D.企业药品批发企业"],ans:"B",exp:"两位分类代码为大写英文字母，第一位A表示批发企业，B表示药品零售连锁总部，C表示零售连锁门店，D表示单体药品零售企业。"},
      {q:"46. B表示",opts:["A.单体药品零售企业","B.药品零售连锁企业门店","C.药品零售连锁企业总部","D.企业药品批发企业"],ans:"C",exp:"两位分类代码为大写英文字母，第一位A表示批发企业，B表示药品零售连锁总部，C表示零售连锁门店，D表示单体药品零售企业。"},
      {q:"47. D表示",opts:["A.单体药品零售企业","B.药品零售连锁企业门店","C.药品零售连锁企业总部","D.企业药品批发企业"],ans:"A",exp:"两位分类代码为大写英文字母，第一位A表示批发企业，B表示药品零售连锁总部，C表示零售连锁门店，D表示单体药品零售企业。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"48. 药物临床试验期间，应对重大突发公共卫生事件急需的疫苗，经评估获益大于风险的可以申请",opts:["A.突破性治疗药物","B.附条件批准","C.优先审评审批","D.特别审批"],ans:"B",exp:"药物临床试验期间，应对重大突发公共卫生事件急需的疫苗，经评估获益大于风险的可以申请附条件批准。"},
      {q:"49. 药品上市许可申请时，临床急需的短缺药品可以申请",opts:["A.突破性治疗药物","B.附条件批准","C.优先审评审批","D.特别审批"],ans:"C",exp:"药品上市许可申请时，临床急需的短缺药品可以申请优先审评审批。"},
      {q:"50. 突发公共卫生事件发生后，国家药品监督管理局可对突发公共卫生事件应急所需防治药品实行",opts:["A.突破性治疗药物","B.附条件批准","C.优先审评审批","D.特别审批"],ans:"D",exp:"突发公共卫生事件发生后，国家药品监督管理局可对突发公共卫生事件应急所需防治药品实行特别审批。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"51. 药品零售企业不得经营的药品是",opts:["A.特殊使用级抗菌药物","B.第一类精神药品","C.第二类精神药品","D.体外诊断试剂（器械）"],ans:"B",exp:"药品零售企业不得经营的药品包括：放射性药品、体内诊断试剂、体外诊断试剂（药品）、疫苗、药品类易制毒化学品、第一类精神药品、注射用A型肉毒毒素、终止妊娠药品（包括含有“米非司酮”成分的所有药品制剂）、蛋白同化制剂、肽类激素（胰岛素除外）、中药配方颗粒、医疗机构制剂麻醉药品以及我国法律法规规定的其他禁止零售的药品。"},
      {q:"52. 药品零售企业可以经营但不得陈列的药品是",opts:["A.特殊使用级抗菌药物","B.第一类精神药品","C.第二类精神药品","D.体外诊断试剂（器械）"],ans:"C",exp:"药品零售企业不得陈列的药品包括：罂粟壳中药饮片、毒性中药饮片、第二类精神药品。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"53. 严重药品不良反应的报告时限为不迟于获知该不良反应信息后的（ ）日",opts:["A.7","B.10","C.15","D.30"],ans:"C",exp:"严重药品不良反应的报告时限为不迟于获知该不良反应信息后的15日。"},
      {q:"54. 非严重药品不良反应的报告时限为不迟于获知该不良反应信息后的（ ）日",opts:["A.7","B.10","C.15","D.30"],ans:"D",exp:"非严重药品不良反应的报告时限为不迟于获知该不良反应信息后的30日。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"55. 属于医疗用毒性药品的是",opts:["A.亚砷酸钾","B.去甲麻黄素","C.麦角胺咖啡因片","D.右丙氧芬"],ans:"A",exp:"亚砷酸钾属于医疗用毒性药品。"},
      {q:"56. 属于第二类精神药品的是",opts:["A.亚砷酸钾","B.去甲麻黄素","C.麦角胺咖啡因片","D.右丙氧芬"],ans:"C",exp:"麦角胺咖啡因片属于第二类精神药品。"},
      {q:"57. 属于麻醉药品的是",opts:["A.亚砷酸钾","B.去甲麻黄素","C.麦角胺咖啡因片","D.右丙氧芬"],ans:"D",exp:"右丙氧芬属于麻醉药品。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"58. 药品上市许可持有人发现其生产并已上市的某药品可能引起严重健康危害，于是制定召回计划并发出召回通知，应在（ ）日内通知有关药品经营企业停止销售该药品，并向所在地省级药品监督管理部门备案",opts:["A.1","B.3","C.7","D.10"],ans:"A",exp:"可能引起严重健康危害的属于一级召回，应在1日内通知有关药品经营企业停止销售该药品，并向所在地省级药品监督管理部门备案调查评估报告、召回计划、召回通知。"},
      {q:"59. 药品上市许可持有人发现其生产并已上市的某药品外包装印制的企业商标存在文字印刷错误，决定将其召回，在召回实施过程中每（ ）日向所在地省级药品监督管理部门报告药品召回的进展情况",opts:["A.1","B.3","C.7","D.10"],ans:"C",exp:"不引起健康危害的属于三级召回，在召回实施过程中每7日向所在地省级药品监督管理部门报告药品召回的进展情况。"},
      {q:"60. 药品上市许可持有人发现其生产并已上市的某药品存在暂时的健康危害，决定将其召回，在召回完成后的（ ）个工作日内将药品召回和处理情况向所在地省级药品监督管理部门和卫生健康主管部门报告",opts:["A.1","B.3","C.7","D.10"],ans:"D",exp:"引起可逆的或暂时的健康危害的属于二级召回，应在召回完成后的10个工作日内将药品召回和处理情况向所在地省级药品监督管理部门和卫生健康主管部门报告。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"61. 张某开设了一家私人诊所，向患者提供了常用药品和急救药品以外的药品，该行为应定性为",opts:["A.无证经营药品","B.生产假药","C.无证生产药品","D.从无证生产、经营企业购进药品"],ans:"A",exp:"个人设置的门诊部、诊所等医疗机构向患者提供的药品超出规定的范围和品种的，按无证经营处罚。"},
      {q:"62. 甲药品零售连锁企业门店从李某处购进了5盒降糖药，该行为应定性为",opts:["A.无证经营药品","B.生产假药","C.无证生产药品","D.从无证生产、经营企业购进药品"],ans:"D",exp:"药品零售连锁企业门店从个人处购进药品属于从无证生产、经营企业购进药品。"},
      {q:"63. 乙药品生产企业未经批准私自变更生产地址，该行为应定性",opts:["A.无证经营药品","B.生产假药","C.无证生产药品","D.从无证生产、经营企业购进药品"],ans:"C",exp:"药品上市许可持有人和药品生产企业变更生产地址、生产范围应当经批准而未经批准的，按无证生产处罚。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"64. 属于禁止网络销售的药品是",opts:["A.依托咪酯注射剂","B.头孢拉定胶囊","C.美扑伪麻片","D.雌二醇地屈孕酮片"],ans:"A",exp:"禁止网络销售的药品包括：中药配方颗粒、医疗机构制剂、麻醉药品、精神药品、医疗用毒性药品、放射性药品、药品类易制毒化学品、血液制品、疫苗、依托咪酯注射剂。"},
      {q:"65. 属于禁止网络零售的药品是",opts:["A.依托咪酯注射剂","B.头孢拉定胶囊","C.美扑伪麻片","D.雌二醇地屈孕酮片"],ans:"C",exp:"禁止网络零售（主要）的药品包括：《兴奋剂目录》所列的肽类激素和蛋白同化制剂（胰岛素除外）；注射剂（降糖类药物除外）；含麻黄碱类复方制剂（不包括含麻黄的中成药）；含麻醉药品口服复方制剂。C选项美扑伪麻片属于含麻黄碱类复方制剂，禁止网络零售。"}

    {type:"最佳选择题",q:"86. 关于开具的处方，说法正确的是",opts:["A.处方开具当日有效，一般不得超过3日用量","B.患者6岁，处方颜色应为淡黄色，并在右上角标注“儿科”字样","C.处方应当准确规范书写，并妥善保存一年备查","D.患者情况特殊，依据处方外流等相关规定，医疗机构应当禁止就诊人员持处方到药品零售企业购买药品"],ans:"B",exp:"处方颜色：儿科处方为淡黄色，右上角标注“儿科”。处方开具当日有效，一般不得超过7日用量；急诊处方一般不得超过3日用量。处方保存期限：普通处方、急诊处方、儿科处方保存1年，医疗用毒性药品、第二类精神药品处方保存2年，麻醉药品和第一类精神药品处方保存3年。医疗机构不得限制就诊人员持处方到药品零售企业购药。"},

    {type:"多项选择题",q:"96. 抗肿瘤药物临床应用实行分级管理，根据安全性、可及性、经济性等因素将抗肿瘤药物分为限制使用级和普通使用级。下列药物中属于限制使用级抗肿瘤药物的包括",opts:["A.药物毒副作用大，纳入毒性药品管理的抗肿瘤药物","B.上市时间短的新型抗肿瘤药物","C.用药经验少的新型抗肿瘤药物","D.价格昂贵、经济负担沉重的抗肿瘤药物"],ans:"ABCD",exp:"限制使用级抗肿瘤药物包括：①药物毒副作用大，纳入毒性药品管理，适应症严格，禁忌证多，须由具有丰富临床经验的医务人员使用，使用不当可能对人体造成严重损害的抗肿瘤药物；②上市时间短、用药经验少的新型抗肿瘤药物；③价格昂贵、经济负担沉重的抗肿瘤药物。"},
    {type:"多项选择题",q:"97. 下列属于不得发布广告的产品有",opts:["A.医疗机构配制的制剂","B.戒毒治疗的医疗器械","C.军队特需药品","D.精神药品"],ans:"ABCD",exp:"不得发布广告的产品包括：①麻醉药品、精神药品、放射性药品；②军队特需药品、军队医疗机构配制的制剂；③医疗机构配制的制剂；④依法停止或禁止生产、销售或使用的药品、医疗器械、保健食品和特殊医学用途配方食品；⑤医疗用毒性药品、药品类易制毒化学品、戒毒治疗的药品和戒毒治疗的医疗器械。"},
    {type:"多项选择题",q:"98. 下列关于麻醉药品和精神药品购销管理的说法中，错误的",opts:["A.区域性批发企业从定点生产企业购进麻醉药品和第一类精神药品制剂，须经国家药品监督管理部门批准","B.全国性批发企业向取得麻醉药品和第一类精神药品使用资格的医疗机构销售麻醉药品，须经医疗机构所在地省级卫生健康主管部门批准","C.由于特殊地理位置的原因，区域性批发企业需要就近向其他省、自治区、直辖市行政区域内取得麻醉药品和第一类精神药品使用资格的医疗机构销售麻醉药品的，应当经企业所在地省级药品监督管理部门批准","D.区域性批发企业间因医疗急需、运输困难等特殊情况需要调剂第一类精神药品，应当在调剂后2日内将调剂情况分别报所在地省级药品监督管理部门备案"],ans:"AB",exp:"区域性批发企业从定点生产企业购进麻醉药品和第一类精神药品制剂，须经区域性批发企业所在地省级药品监督管理部门批准。全国性批发企业向取得麻醉药品和第一类精神药品使用资格的医疗机构销售麻醉药品，须经医疗机构所在地省级药品监督管理部门批准。"},
    {type:"多项选择题",q:"99. 下列有关仿制药的相关要求描述，错误的包括",opts:["A.仿制药要求与原研药品具有相同的活性成分、剂型、规格、适应症、给药途径、处方工艺和药品疗效","B.专利到期前一年尚未提出注册申请的产品属于国家鼓励仿制的药品品种","C.已上市的原研药品无法追溯的或者已经撤市的，如符合药品注册标准，仍旧可以按照仿制药的要求申请注册上市","D.按照药品管理的体外诊断试剂，经申请人评估认为无需或者不能开展药物临床试验的，可以直接提出药品上市申请"],ans:"AC",exp:"仿制药要求与原研药品具有相同的活性成分、剂型、规格、适应症、给药途径和用法用量，不强调处方工艺与原研药品一致。已上市药品的原研药品无法追溯或者原研药品已经撤市的，建议不再申请仿制，如坚持提出仿制药申请，原则上不能以仿制药的技术要求予以批准，应按照新药的要求开展相关研究。"},
    {type:"多项选择题",q:"100. 关于特殊医学用途配方食品和婴幼儿配方食品管理的说法，错误的有",opts:["A.特殊医学用途配方食品上市应经国家药品监督管理部门注册","B.婴幼儿配方食品生产企业应从原料进厂到成品出厂的全过程质量控制，对出厂的婴幼儿配方食品实施逐批检验","C.特殊医学用途配方食品的注册证有效期为5年","D.婴幼儿配方食品的产品配方应当经国务院食品安全监督管理部门注册"],ans:"AD",exp:"特殊医学用途配方食品应经国务院食品安全监督管理部门注册。婴幼儿配方食品生产企业应当将食品原料、食品添加剂、产品配方及标签等事项向省级食品安全监督管理部门备案。"}
  ]
},
  {
  name: "押题密卷（七）",
  questions: [
    // ===== 一、最佳选择题（1-40） =====
    {type:"最佳选择题",q:"1. 根据药物临床试验机构应当具备的基本条件，下列表述正确的是",opts:["A.对于新备案的药物临床试验机构或者增加临床试验专业、地址变更的，应当在90个工作日内开展首次监督检查","B.注册申请人委托备案的药物临床试验机构开展药物临床试验，可自行或者聘请第三方对委托的药物临床试验机构进行评估","C.疫苗临床试验应当由符合国家药品监督管理局和国务院卫生健康主管部门规定条件的二级甲等以上医疗机构实施或者组织实施","D.新药I期临床试验或者临床风险较高需要临床密切监测的药物临床试验，可以由二级以上医疗机构实施"],ans:"B",exp:"本题考查药品研制过程与质量管理规范。注册申请人委托备案的药物临床试验机构开展药物临床试验，可自行或者聘请第三方对委托的药物临床试验机构进行评估。对于新备案的药物临床试验机构或者增加临床试验专业、地址变更的，应当在60个工作日内开展首次监督检查。疫苗临床试验应当由符合国家药品监督管理局和国务院卫生健康主管部门规定条件的三级医疗机构或者省级以上疾病预防控制机构实施或者组织实施。新药I期临床试验或者临床风险较高需要临床密切监测的药物临床试验，应当由三级医疗机构实施。"},
    {type:"最佳选择题",q:"2. 下列关于个人携带药品进出境的说法，不正确的是",opts:["A.随身携带的个人自用少量药品，应以自用、合理数量为限，并接受口岸药品监督管理局监管","B.可以携带第一类药品类易制毒化学品单方制剂","C.超过自用合理数量范围的药品，应通过货物渠道进行报关处置","D.未经批准进口少量境外已合法上市的药品，情节较轻的，可依法减轻或免予处罚"],ans:"A",exp:"本题考查药品进口管理。进出境人员随身携带的个人自用少量药品，必须以“自用、合理数量”为限，并接受海关监管，而非口岸药品监督管理局监管。"},
    {type:"最佳选择题",q:"3. 根据《医疗机构药事管理规定》，下列关于医疗机构药学专业技术人员配备比例及药学部门负责人要求的说法，不正确的是",opts:["A.二级综合医院药剂科的药学人员中，具有高等医药院校临床药学或药学专业全日制本科毕业以上学历的应不低于药学专业技术人员总数的20%","B.三级综合医院药学部药学人员中，具有副高级以上药学专业技术职务任职资格的应不低于15%","C.二级以上医院药学部门负责人应当具有高等学校药学专业或临床药学专业本科以上学历，及本专业高级技术职务任职资格","D.除诊所、卫生所、医务室等以外的其他医疗机构药学部门负责人应具有高等学校药学专业专科以上或中等学校药学专业毕业学历，及药师以上专业技术职务任职资格"],ans:"B",exp:"本题考查医疗机构药学部门管理。三级综合医院药学部药学人员中，副高级以上职称的比例应不低于13%，而教学医院需达到15%。因此B选项说15%是不正确的。"},
    {type:"最佳选择题",q:"4. 根据《执业药师职业资格制度规定》，下列人员中，符合执业药师职业资格考试报名条件的是",opts:["A.王某，护理学专业本科学历，在医疗机构药学部门工作满2年","B.赵某，药学专业大专学历，在药品经营企业从事药学工作满4年","C.钱某，持有药学专业副高级职称，但目前在化妆品公司从事销售工作","D.孙某，为外籍人士，拥有药学博士学位，目前在其国籍地从事药品研发工作"],ans:"B",exp:"本题考查执业药师职业资格考试。护理学专业属于相关专业，本科学历需在药学岗位工作满3年，A错误。药学专业大专学历，在药学岗位工作满4年，符合报名条件，B正确。免试部分科目需在药学或中药学岗位工作，钱某不在药学岗位，不符合，C错误。外籍人员需获准在我国境内就业，孙某未在中国境内就业，D错误。"},
    {type:"最佳选择题",q:"5. 关于药物警戒制度概述及药品不良反应报告和监测的说法，错误的是",opts:["A.药物警戒可以涵盖药物临床试验和上市后阶段，不仅包括药品不良反应，还包括其他与用药有关的有害反应","B.药品群体不良事件指同一药品在使用过程中，在相对集中的时间、区域内，对一定数量人群的身体健康或者生命安全造成损害或者威胁，需要予以紧急处置的事件","C.国产药品的定期安全性报告向上市许可持有人、生产企业所在地省级药品不良反应监测机构提交","D.药品经营企业发现药品不良反应，应当通过药品不良反应监测系统报告发现或获知的药品不良反应，也可向药品上市许可持有人直接报告"],ans:"D",exp:"本题考查药品不良反应报告和监测。药品经营企业发现药品不良反应，直接向药品上市许可持有人报告。医疗机构及个人发现药品不良反应，可以通过药品不良反应监测系统报告，也可向药品上市许可持有人直接报告。D选项说药品经营企业可通过系统报告，错误。"},
    {type:"最佳选择题",q:"6. 根据现行职责分工，下列由市场监督管理部门承担的职责是",opts:["A.负责药品、医疗器械和化妆品上市后风险管理","B.依法制定地方中药材标准、中药饮片炮制规范并监督实施，配合实施基本药物制度","C.依法查处不正当竞争行为，开展价格监督检查","D.组织制定国家药物政策和国家基本药物制度"],ans:"C",exp:"本题考查药品管理工作相关部门。市场监督管理部门负责市场综合监督管理，依法实施反垄断执法、价格监督检查和反不正当竞争，查处市场交易中的违法违规行为。"},
    {type:"最佳选择题",q:"7. 根据省级中药标准的相关规定，下列哪一品种可以收载于省级中药饮片炮制规范中",opts:["A.无本地区临床习用历史的药材","B.已有国家药品标准的中药配方颗粒","C.国内新发现的药材的传统药用部位","D.本地区临床习用且无国家药品标准的中药饮片"],ans:"D",exp:"本题考查药品标准。省级中药标准禁止收载：无本地区临床习用历史的药材、中药饮片；已有国家药品标准的药材、中药饮片、中药配方颗粒；国内新发现的药材；药材新的药用部位等。因此本地区临床习用且无国家药品标准的中药饮片可以收载。"},
    {type:"最佳选择题",q:"8. 下列选项最能体现行政许可“依申请行为”的特征的是",opts:["A.市场监管局对食品生产企业开展定期卫生检查","B.企业向生态环境局申请排污许可证","C.交通局对违规车辆依法作出罚款处罚","D.住建局主动向符合条件的企业颁发资质证书"],ans:"B",exp:"本题考查行政许可。行政许可的“依申请行为”特征强调其被动性，以行政相对人申请为前提，行政机关不得主动作出许可。企业主动申请排污许可证，行政机关根据申请作出许可决定，符合特征。"},
    {type:"最佳选择题",q:"9. 药品上市后应当以补充申请方式申报，经批准后实施的变更是",opts:["A.某持有人申请转让药品上市许可","B.感冒清热颗粒药品包装标签内容的变更","C.中药饮片分包装","D.药品经营过程中的微小变更"],ans:"A",exp:"本题考查药品上市后与再注册。以补充方式申报变更的情形包括：药品生产过程中的重大变更；药品说明书中涉及有效性内容以及增加安全性风险；持有人转让药品上市许可。"},
    {type:"最佳选择题",q:"10. 关于药品召回的说法，不正确的是",opts:["A.使用药品可能引起可逆的或暂时的健康危害的适用于二级召回","B.对不符合药品标准但尚不影响安全性、有效性的中药饮片，能够通过返工等方式解决该问题的，可以适当处理后不能再上市","C.药品上市许可持有人对召回药品的处理应当有详细的记录，记录应当保存5年且不得少于药品有效期后1年","D.在召回完成后10个工作日内，将药品召回和处理情况向所在地省级卫生健康主管部门报告即可"],ans:"D",exp:"本题考查药品召回与分类。召回完成后，应将药品召回和处理情况向所在地省级药品监督管理部门和卫生健康主管部门报告，而非仅向卫生健康主管部门报告。"},
    {type:"最佳选择题",q:"11. 下列关于药品批发企业储存、运输冷藏冷冻药品的设施设备说法不正确的是",opts:["A.储存疫苗的企业应配备两个以上独立冷库","B.冷藏车具有自动调控温度、显示温度、存储和读取温度监测数据的功能，冷藏箱及保温箱具有外部显示和采集箱体内温度数据的功能","C.所有备用冷库处于可随时启用状态，确保某个冷库出现故障时可及时将库存疫苗转移至其他同温区冷库，杜绝疫苗脱离冷链","D.储存疫苗的冷库应做到不可合并储存的每个储存温区疫苗冷库至少两用一备"],ans:"D",exp:"本题考查药品经营质量管理规范——药品批发企业的条件。储存疫苗的冷库应做到不可合并储存的每个储存温区疫苗冷库至少一用一备，而非两用一备。"},
    {type:"最佳选择题",q:"12. A省药品监督管理部门对辖区内某中医院飞行检查时发现该医院将本院配制的医疗机构制剂通过经销商渠道，流入医院周边药店进行销售，涉及货值金额5.2万元，未造成情节严重，下列属于该医疗机构可能承担的罚款金额有",opts:["A.5万元","B.12万元","C.8万元","D.10万元"],ans:"B",exp:"本题考查医疗机构将其配制的制剂在市场上销售的法律责任。处货值金额2倍至5倍罚款；货值金额不足5万的，按5万计算。货值5.2万元，罚款区间为10.4万至26万，12万在此区间。"},
    {type:"最佳选择题",q:"13. 下列规范性文件中，属于由总理签署国务院令进行公布生效的有",opts:["A.《云南省药品管理条例》","B.《药品管理法》","C.《放射性药品管理办法》","D.《甘肃省麻醉药品管理条例》"],ans:"C",exp:"本题考查法的基本知识。行政法规由国务院制定，总理签署国务院令公布。《放射性药品管理办法》属于行政法规。《药品管理法》属于法律，《云南省药品管理条例》《甘肃省麻醉药品管理条例》属于地方性法规。"},
    {type:"最佳选择题",q:"14. 根据《药品管理法》，下列关于药品上市许可持有人的权利和义务的说法，不正确的有",opts:["A.建立上市后研究，对突破性批准的药品，应当采取相应风险管理措施，并在规定期限内按照要求完成相关研究；逾期未按照要求完成研究或者不能证明其获益大于风险的，国家药品监督管理局应当依法处理","B.药品上市许可持有人应当建立药品上市放行规程，对药品生产企业出厂放行的药品进行审核，经质量受权人签字后方可放行","C.对附条件批准的药品，药品上市许可持有人应当采取相应风险管理措施，并在规定期限内按照要求完成相关研究，逾期未按照要求完成研究的，国家药品监督管理部门应当依法处理，直至注销药品注册证书","D.药品上市许可持有人依法转让药品上市许可时，受让方应当满足药品上市许可持有人的能力要求，履行药品上市许可持有人义务"],ans:"A",exp:"本题考查药品上市许可持有人的义务。对附条件批准的药品，应当采取相应风险管理措施，并在规定期限内按照要求完成相关研究；逾期未按照要求完成研究或者不能证明其获益大于风险的，国家药品监督管理局应当依法处理，直至注销药品注册证书。A选项表述不完整。"},
    {type:"最佳选择题",q:"15. 药物临床试验是指以人体（患者或健康受试者）为对象的试验，关于药物临床试验管理的说法，不正确的是",opts:["A.生物等效性试验，是指用生物利用度研究的方法，以药物动力学参数为指标","B.药物临床试验机构应当符合相应条件，实行备案管理","C.药物临床试验主要研究者应当具有高级职称并参加过3个以上药物临床试验","D.药物临床试验机构应具有《医疗机构执业许可证》，具有二级甲等以上资质"],ans:"A",exp:"本题考查药品研制过程与质量管理规范。生物等效性试验，是指用生物利用度研究的方法，以药代动力学参数为指标。A选项将“药代动力学”误写为“药物动力学”。"},
    {type:"最佳选择题",q:"16. 下列关于医疗器械经营环节和使用环节的管理要求中，说法正确的是",opts:["A.植入类医疗器械进货查验记录和销售记录保存期限不得少于2年","B.医疗机构配置大型医用设备的，应经省级市场监督管理部门批准取得大型医用设备配置许可证","C.对产品安全性、有效性不受流通过程影响的第二类医疗器械，可以免予经营备案","D.医疗器械经营许可证有效期5年，届满前6至2个月期间，提出延续申请"],ans:"C",exp:"本题考查医疗器械经营与使用管理。对产品安全性、有效性不受流通过程影响的第二类医疗器械，可以免予经营备案。植入类医疗器械记录应永久保存；大型医用设备配置许可证由省级以上卫生健康主管部门批准；医疗器械经营许可证延续申请应在届满前90个工作日至30个工作日期间提出。"},
    {type:"最佳选择题",q:"17. 由于特殊地理位置的原因，云南省区域性批发企业需要就近向四川省内取得第一类精神药品使用资格的医疗机构销售第一类精神药品的，下述审批过程符合规定是",opts:["A.经四川省药品监督管理部门批准","B.经云南省药品监督管理部门批准","C.向云南省药品监督管理部门备案","D.向四川省药品监督管理部门备案"],ans:"B",exp:"本题考查麻醉药品和精神药品经营。区域性批发企业需要就近向其他省、自治区、直辖市行政区域内取得麻醉药品和第一类精神药品使用资格的医疗机构销售麻醉药品和第一类精神药品的，应当经企业所在地省级药品监督管理部门批准。"},
    {type:"最佳选择题",q:"18. 关于医疗机构制剂管理的说法，错误的是",opts:["A.制剂室负责人和药检室负责人不得互相兼任","B.医疗机构配制制剂，应当有能够保证制剂质量的设施、管理制度、检验仪器和卫生环境，应当按照经核准的工艺进行，所需的原料、辅料和包装材料等应当符合食用要求","C.对临床需要而市场无供应的麻醉药品和精神药品，持有医疗机构制剂许可证和印鉴卡的医疗机构需要配制制剂的，应当经所在地省级药品监督管理部门批准","D.医疗机构制剂批准文号的有效期为3年。有效期届满需要继续配制的，申请人应当在有效期届满前3个月按照原申请配制程序提出再注册申请，报送有关资料"],ans:"B",exp:"本题考查医疗机构配制制剂许可管理。医疗机构配制制剂，所需的原料、辅料和包装材料等应当符合药用要求，而非食用要求。"},
    {type:"最佳选择题",q:"19. 下列关于我国医药卫生体制改革重点任务的表述，正确的是",opts:["A.公共卫生服务体系以基层医疗卫生机构为单一建设主体","B.医疗服务体系坚持以营利性医疗机构为主导","C.医疗保障体系以基本医疗保障为主体，商业健康保险为补充","D.药品供应保障体系核心是建立多元化进口药品管理制度"],ans:"C",exp:"本题考查深化医药卫生体制改革。医疗保障体系以基本医疗保障为主体，其他补充保险和商业健康保险为补充。公共卫生服务体系需建立专业公共卫生服务网络与基层医疗卫生服务网络协同的功能，并非以基层机构为单一主体。医疗服务体系坚持公立医疗机构为主导，营利性机构为补充。药品供应保障体系以国家基本药物制度为基础。"},
    {type:"最佳选择题",q:"20. 根据相关规定，下列关于药品分类的表述，不正确的是",opts:["A.实行特殊管理的药品包括疫苗、血液制品、麻醉药品、精神药品、医疗用毒性药品、放射性药品、药品类易制毒化学品，但不包括含特殊药品复方制剂和兴奋剂等","B.原研药属于境内外首个获准上市的药品，具有完整和充分的安全性、有效性数据作为上市申请的依据","C.进口药品是指在中国境外生产，在中国境内准予注册销售的药品","D.医疗机构制剂不得上市销售，也不得发布广告"],ans:"A",exp:"本题考查药品的界定和特点。实行特殊管理的药品包括疫苗、血液制品、麻醉药品、精神药品、医疗用毒性药品、放射性药品、药品类易制毒化学品、含特殊药品复方制剂和兴奋剂等。A选项说不包括含特殊药品复方制剂和兴奋剂，错误。"},
    {type:"最佳选择题",q:"21. 下列关于医疗保障定点管理的表述，正确的是",opts:["A.医疗保障经办机构负责制定医疗机构定点管理政策","B.统筹地区卫生健康部门根据区域卫生规划确定定点医疗机构资源配置","C.参保人员凭定点医药机构处方在定点零售药店购买医保目录内药品发生的费用可由统筹基金按规定支付","D.定点零售药店的确定由医疗保障行政部门直接负责"],ans:"C",exp:"本题考查医疗保障定点管理。医疗机构定点管理政策由医疗保障行政部门制定，而非经办机构，A错误。统筹地区医疗保障行政部门根据区域卫生规划等确定定点医疗机构资源配置，而非卫生健康部门，B错误。定点零售药店的确定由医疗保障经办机构负责，而非行政部门，D错误。"},
    {type:"最佳选择题",q:"22. 下列关于医保药品使用费用支付原则的说法，正确的是",opts:["A.参保人使用乙类药品时，个人先行自付比例由国家医疗保障行政部门统一确定","B.新纳入《基本医疗保险药品目录》的中药饮片，同步确定支付标准","C.国家组织药品集中采购中选的非独家药品，按集中采购规定确定支付标准","D.基本医疗保险基金支付药品费用时，无需药师或执业药师审查处方"],ans:"C",exp:"本题考查基本医疗保险药品目录管理。对于非独家药品，国家组织药品集中采购的中选药品，其支付标准按集中采购的相关规定确定。乙类药品个人先行自付比例由省级或统筹地区医疗保障行政部门确定，而非国家统一规定。中药饮片的支付标准不适用“同步确定”原则。基金支付需经药师或执业药师审查处方。"},
    {type:"最佳选择题",q:"23. 根据药品零售连锁企业总部经营规范，下列属于被明确禁止的违规操作的是",opts:["A.从药品上市许可持有人处购进药品","B.为他人违法经营药品提供资质证明文件","C.使用银行对公账户进行药品购销业务往来","D.凭医师处方向参保人员销售胰岛素"],ans:"B",exp:"本题考查药品零售企业经营管理。明确禁止“为他人违法经营药品提供场所、资质证明文件、票据等条件”。"},
    {type:"最佳选择题",q:"24. 根据《药品网络销售的总体要求和清单管理》，下列关于药品经营企业网络销售相关记录保存时限的说法，正确的是",opts:["A.保存时限至少为3年，且不少于药品有效期后1年","B.保存时限至少为5年，且不少于药品有效期后1年","C.保存时限至少为5年，无需考虑药品有效期","D.保存时限不少于药品有效期后1年，无需固定年限"],ans:"B",exp:"本题考查药品网络销售的总体要求。药品经营企业购销等相关记录保存时限原则上均为至少5年，且不少于药品有效期后1年。"},
    {type:"最佳选择题",q:"25. 根据《药品经营质量管理规范》，关于药品采购活动的要求，下列说法错误的是",opts:["A.企业采购时需确定供货单位、购入药品及销售人员的合法性，并签订质量保证协议","B.审核首营企业时，需查验其《药品生产许可证》或《药品经营许可证》复印件（加盖公章原印章）","C.采购首营品种时，仅需审核药品的价格证明文件，无需查验批准证明文件","D.企业与供货单位签订的质量保证协议中，需明确双方质量责任及药品运输的质量保证条款"],ans:"C",exp:"本题考查药品经营质量管理规范——药品批发企业的流程管理。采购首营品种时，必须审核药品的合法性，并索取加盖供货单位公章原印章的生产或进口批准证明文件复印件，而非仅审核价格证明文件。"},
    {type:"最佳选择题",q:"26. 根据《药品经营许可证管理办法》，关于药品监督管理部门审核批准开办药品经营企业申请的说法，正确的是",opts:["A.审批部门自受理申请之日起20个工作日内完成审核，技术审查、现场检查等时间计入该期限","B.若申请材料不全，药品监督管理部门应在5个工作日内一次性告知申请人补正材料","C.符合条件的，应自许可决定作出之日起5个工作日内颁发药品经营许可证","D.不予许可的，仅需口头告知申请人理由，但无需说明技术审查或现场检查的问题"],ans:"C",exp:"本题考查药品经营许可证管理。药品监督管理部门应自许可决定作出之日起5个工作日内颁发药品经营许可证。技术审查、现场检查、企业整改等时间不计入20个工作日的审核期限。补正材料时限未明确规定。不予许可应书面说明理由。"},
    {type:"最佳选择题",q:"27. 根据《药品经营质量管理规范》，下列关于从事药品零售活动人员配备及经营条件的说法，正确的是",opts:["A.某药店仅经营乙类非处方药，配备了经县级药品监督管理部门考核合格的药品销售业务人员","B.某零售连锁门店经营处方药与甲类非处方药，未配备执业药师，但配备了依法经过资格认定的药学技术人员","C.某商超内的药品零售区域与食品区混合陈列，但设置了独立的营业区域","D.某药品零售连锁总部批准门店超出其经营范围销售中药饮片"],ans:"B",exp:"本题考查药品经营管理。经营处方药、甲类非处方药需配备“依法经过资格认定的药师或者其他药学技术人员”。仅经营乙类非处方药可配备“经设区的市级药品监督管理部门考核合格的药品销售业务人员”，A错。药品零售场所需与非药品区域分开设置，C错。连锁门店经营范围不得超过总部，D错。"},
    {type:"最佳选择题",q:"28. 根据疫苗配送管理要求，下列关于从事疫苗配送企业专业技术人员配备的说法，正确的是",opts:["A.应当配备3名具有药学专业专科学历、中级职称、5年疫苗管理经验的技术人员","B.应当配备2名具有预防医学专业本科以上学历、初级职称、3年疫苗技术工作经历的人员","C.应当配备2名具有微生物学专业本科以上学历、中级职称、2年疫苗管理工作经历的人员","D.应当配备2名具有医学专业本科以上学历、中级职称、3年以上疫苗技术工作经历的人员"],ans:"D",exp:"本题考查药品经营质量管理规范——药品批发企业的条件。疫苗配送企业专业技术人员数量要求：≥2名；学历要求：预防医学、药学、微生物学或医学专业本科以上学历；职称要求：中级以上专业技术职称；工作经历：3年以上从事疫苗管理或技术工作经历。"},
    {type:"最佳选择题",q:"29. 根据医疗机构药品采购与配备管理规定，下列行为符合规定的是",opts:["A.某个人诊所除配备常用药品外，还购进了抗肿瘤药用于癌症患者止痛","B.医院外科科室从药品上市许可持有人处直接采购了一批抗生素","C.核医学科经药事管理委员会审核后购用本专业所需的放射性药品","D.某医院从无药品经营资质的企业购进实施审批管理的中药饮片"],ans:"C",exp:"本题考查药品购进渠道与质量管理。临床使用的药品由药学部门统一采购供应。经药事管理与药物治疗学委员会（组）审核同意，核医学科可以购用、调剂本专业所需的放射性药品。个人设置的诊所仅能配备常用药品和急救药品，抗肿瘤药不属于该范围，A错。医疗机构购进药品应从有资质的企业购进，B、D错。"},
    {type:"最佳选择题",q:"30. 下列药品中，在药品标签和说明书中不需要印有专有标识的是",opts:["A.云南白药气雾剂","B.板蓝根颗粒","C.单位剂量含麻黄碱35mg的复方制剂","D.丁丙诺啡透皮贴剂"],ans:"C",exp:"本题考查药品名称、商标和专有标识管理要求。含麻黄碱类复方制剂无专有标识。云南白药气雾剂属于外用药；板蓝根颗粒属于非处方药；丁丙诺啡透皮贴剂属于第二类精神药品，均有专有标识。"},
    {type:"最佳选择题",q:"31. 下列关于药品广告发布媒体限制的说法，不正确的是",opts:["A.处方药广告应当显著标明“本广告仅供医学药学专业人士阅读”","B.处方药广告只能在国家卫生健康委员会和国家药品监督管理局共同指定的医学、药学专业刊物上发布","C.可以使用与处方药名称相同的商标发布广告，但也不得利用该商标、企业字号为各种活动冠名进行广告宣传","D.非药品广告不得有涉及药品的宣传"],ans:"C",exp:"本题考查药品广告发布的规定和要求。不得利用处方药的名称为各种活动冠名进行广告宣传，不得使用与处方药名称相同的商标、企业字号在医学、药学专业刊物以外的媒介变相发布广告，也不得利用该商标、企业字号为各种活动冠名进行广告宣传。"},
    {type:"最佳选择题",q:"32. 关于某省《重点监控合理用药药品目录》的管理，下列说法正确的是",opts:["A.目录更新调整的时间间隔原则上不短于2年，以保证临床用药稳定性","B.纳入目录管理的药品品种一般为20个，便于集中监控重点品种","C.目录调整流程包括启动调整、地方遴选推荐、专家评审、公布结果4个阶段","D.对调整出原目录的药品，地方卫生健康行政部门应继续监控至少1年，以跟踪用药情况"],ans:"D",exp:"本题考查重点监控药品临床应用管理。对调出目录的药品，需继续监控至少1年。目录更新调整的时间原则上不短于3年，纳入目录的药品品种一般为30个，调整阶段包括启动调整、地方遴选推荐、专家汇总、公布结果。"},
    {type:"最佳选择题",q:"33. 根据中药材生产质量管理规范，下列说法正确的是",opts:["A.企业在基地选址范围内完成至少一个生产周期种植后，须具备一个收获期的中药材质量检测数据，以证明符合内控标准","B.采收受病虫草害影响的中药材时，可与正常药材共同采收处理，但需额外标注异常情况","C.产地加工过程中，阴干药材可在阳光下短时间暴晒以加快干燥，但需控制暴晒时长不超过2小时","D.企业需将全过程关键环节记录保存至该批中药材销售后至少3年以上，以满足追溯要求"],ans:"D",exp:"本题考查中药材的生产、经营和使用管理。记录需保存至销售后至少3年。企业需完成至少一个生产周期种植且有两个收获期的质量检测数据，A错。受病虫草害影响的中药材必须单独采收处置，不能与正常药材混收，B错。阴干药材严禁暴晒，C错。"},
    {type:"最佳选择题",q:"34. 下列关于毒性中药饮片与中药配方颗粒监管要求的说法，正确的是",opts:["A.市场需求量大的毒性中药饮片，各省区可确定2~3个定点生产企业","B.中药配方颗粒可在取得《药品经营许可证》的零售药店销售","C.毒性中药饮片如生巴豆需全国集中统一定点生产，供全国使用","D.中药配方颗粒跨省销售时，生产企业无需向使用地省级药品监督管理部门备案"],ans:"A",exp:"本题考查毒性中药饮片与中药配方颗粒生产、经营管理。市场需求量大、生产较多的毒性中药饮片，按省区确定2~3个定点企业。中药配方颗粒不得在医疗机构以外销售，B错。产地集中的毒性中药饮片实行全国集中统一定点生产，C错。中药配方颗粒跨省销售时，生产企业需报使用地省级药品监督管理部门备案，D错。"},
    {type:"最佳选择题",q:"35. 根据《中药品种保护条例》，下列关于中药保护品种的说法，正确的是",opts:["A.对特定疾病有显著疗效的中药品种可申请一级保护","B.中药二级保护品种的保护期限可以是10年","C.相当于国家一级保护野生药材物种人工制成品的中药品种可申请一级保护","D.中药保护品种在保护期内向国外申请注册时，可直接向境外监管机构提交申请"],ans:"C",exp:"本题考查中药品种保护。相当于国家一级保护野生药材物种的人工制成品，属于申请一级保护的条件之一。“对特定疾病有显著疗效”属于二级保护品种的申请条件，A错。中药二级保护品种的保护期限为7年，B错。中药保护品种在保护期内向国外申请注册时，必须经国家药品监督管理部门批准同意，D错。"},
    {type:"最佳选择题",q:"36. 根据《疫苗管理法》及相关规定，下列关于疫苗委托配送管理的说法，正确的是",opts:["A.疫苗上市许可持有人在同一省级行政区域内选取的区域配送企业原则上不得超过2家","B.疫苗上市许可持有人委托配送疫苗时，应当向国家药品监督管理部门报告委托情况","C.疾病预防控制机构委托配送企业分发疫苗的，应当向市级卫生健康主管部门报告","D.接受委托配送疫苗的企业可再次委托符合条件的单位完成配送工作"],ans:"A",exp:"本题考查疫苗上市后管理。疫苗上市许可持有人在同一省级行政区域内选取疫苗区域配送企业时，原则上不得超过2家。委托配送的报告部门应为省级药品监督管理部门，B错。疾病预防控制机构委托配送时，应向同级药品监督管理部门和卫生健康主管部门报告，C错。接受委托的配送疫苗的企业严禁再次委托，D错。"},
    {type:"最佳选择题",q:"37. 下列关于蛋白同化制剂、肽类激素销售管理的说法，正确的是",opts:["A.某蛋白同化制剂生产企业向药品零售企业销售司坦唑醇（蛋白同化制剂）","B.某肽类激素批发企业向医疗机构销售促红细胞生成素，要求处方保存1年","C.某药品零售企业凭执业医师处方向患者销售胰岛素，处方保存2年","D.某具备资质的批发企业将列入兴奋剂目录的生长激素销售给个人"],ans:"C",exp:"本题考查含兴奋剂药品管理。医疗机构只能凭依法享有处方权的执业医师开具的处方向患者提供蛋白同化制剂、肽类激素，处方应当保存2年。蛋白同化制剂的生产企业仅能向医疗机构、同类资质生产企业、具有经营资质的批发企业销售，严禁向零售企业销售（胰岛素除外），A错。处方保存2年，B错。不得卖给个人，D错。"},
    {type:"最佳选择题",q:"38. 根据《最高人民法院、最高人民检察院关于办理危害药品安全刑事案件适用法律若干问题的解释》，下列情形应认定为生产、销售假药的“其他特别严重情节”的是",opts:["A.生产假药导致2人中度残疾","B.销售假药金额15万元，且假药以青年人为主要使用对象","C.提供假药造成5人轻度残疾，且假药属于医疗用毒性药品","D.生产假药引发较大突发公共卫生事件"],ans:"C",exp:"本题考查生产、销售、提供假（劣）药的刑事责任。其他特别严重情节包括：致人重度残疾以上的；造成3人以上重伤、中度残疾或者器官组织损伤导致严重功能障碍的；造成5人以上轻度残疾或者器官组织损伤导致一般功能障碍的；造成10人以上轻伤的；引发重大、特别重大突发公共卫生事件的；生产、销售、提供假药的金额50万元以上的；生产、销售、提供假药的金额20万元以上，不满50万元，并具有酌情从重处罚情形之一的。"},
    {type:"最佳选择题",q:"39. 根据《药品网络销售监督管理办法》，下列关于违反网络零售处方药要求的法律责任说法，正确的是",opts:["A.药品网络零售企业未履行处方审核义务，情节严重的，处5万元以上20万元以下罚款","B.药品网络交易第三方平台未履行电子处方管理义务，造成危害后果的，处10万元以上20万元以下罚款","C.药品网络零售企业未履行调配标记管理义务，责令限期改正，处5万元以上10万元以下罚款","D.药品网络交易第三方平台未履行电子处方管理义务，一般情形下处10万元以上20万元以下罚款"],ans:"B",exp:"本题考查违反药品网络销售监督管理的法律责任。药品网络交易第三方平台未履行电子处方管理相关义务的，责令限期改正，处5万元以上10万元以下罚款；造成危害后果的，处10万元以上20万元以下罚款。药品网络零售企业未履行处方审核、调配和标记管理等义务的，责令限期改正，处3万元以上5万元以下罚款；情节严重的，处5万元以上10万元以下罚款。"},
    {type:"最佳选择题",q:"40. 某药品生产企业未按照规定建立并实施药品追溯制度，药品监管部门首次检查时责令其限期改正并给予警告。若该企业逾期未改正，根据《药品管理法》，监管部门应作出的处罚是",opts:["A.处5万元以上10万元以下罚款","B.处10万元以上50万元以下罚款","C.处50万元以上100万元以下罚款","D.吊销《药品生产许可证》"],ans:"B",exp:"本题考查违反药品研制、注册、生产管理要求的法律责任。未建立并实施药品追溯制度的行为，初次违法时监管部门会“责令限期改正，给予警告”；若逾期未改正，则处10万元以上50万元以下罚款。"},

    // ===== 二、配伍选择题（41-85） =====
    {type:"配伍选择题",subs:[
      {q:"41. 属于行政强制执行的是",opts:["A.限制从业","B.划拨存款","C.罚金","D.冻结存款、汇款"],ans:"B",exp:"划拨存款属于行政强制执行行为。"},
      {q:"42. 属于行政强制措施的是",opts:["A.限制从业","B.划拨存款","C.罚金","D.冻结存款、汇款"],ans:"D",exp:"冻结存款、汇款属于行政强制措施行为。"},
      {q:"43. 属于行政处罚的是",opts:["A.限制从业","B.划拨存款","C.罚金","D.冻结存款、汇款"],ans:"A",exp:"限制从业属于行政处罚。罚金属于刑事责任。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"44. 可分为评价抽检和监督抽检的是",opts:["A.抽查检验","B.指定检验","C.复验","D.注册检验"],ans:"A",exp:"抽查检验可分为评价抽检和监督抽检。"},
      {q:"45. 应当进行的样品检验和标准复核属于",opts:["A.抽查检验","B.指定检验","C.复验","D.注册检验"],ans:"D",exp:"注册检验包括样品检验和标准复核。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"46. 铁路运输时需用到行李车运输的精神药品是",opts:["A.罂粟壳","B.麦角胺咖啡因片","C.A型肉毒毒素","D.丁丙诺啡"],ans:"D",exp:"铁路运输时，采用行李车或集装箱运输麻醉药品和第一类精神药品。丁丙诺啡属于第一类精神药品。"},
      {q:"47. 在零售药店销售必须配方使用，严禁单味零售，不得生用的药品是",opts:["A.罂粟壳","B.麦角胺咖啡因片","C.A型肉毒毒素","D.丁丙诺啡"],ans:"A",exp:"罂粟壳零售规定：凭盖有乡镇卫生院以上医疗机构公章的医生处方配方使用；严禁单味零售，不得生用。"},
      {q:"48. 开具处方时使用白色处方，且一般每张处方不得超过7日常用量的药品是",opts:["A.罂粟壳","B.麦角胺咖啡因片","C.A型肉毒毒素","D.丁丙诺啡"],ans:"B",exp:"零售第二类精神药品时，处方应经执业药师或其他依法经过资格认定的药学技术人员复核，一般每张处方不得超过7日常用量。麦角胺咖啡因片属于第二类精神药品。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"49. 药品零售连锁企业经批准方可经营的是",opts:["A.盐酸麻黄碱注射液","B.氨酚待因片","C.酚麻美敏片","D.复方曲马多片"],ans:"D",exp:"复方曲马多片属于第二类精神药品，药品零售连锁企业经批准方可经营。"},
      {q:"50. 必须具备蛋白同化制剂、肽类激素资质的批发企业才能批发的药品是",opts:["A.盐酸麻黄碱注射液","B.氨酚待因片","C.酚麻美敏片","D.复方曲马多片"],ans:"C",exp:"具有蛋白同化制剂、肽类激素定点批发资质的药品经营企业，方可从事含麻黄碱类复方制剂的批发业务。酚麻美敏片属于含麻黄碱类复方制剂。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"51. 根据《药品召回管理办法》，主动召回的主体为",opts:["A.药品上市许可持有人","B.药品生产企业","C.药品经营企业","D.药品监督管理部门"],ans:"A",exp:"主动召回是指药品上市许可持有人对可能存在的质量问题或者其他安全隐患进行调查和评估，确定药品存在质量问题或者其他安全隐患的，由该持有人决定并实施的召回。"},
      {q:"52. 根据《药品召回管理办法》，认为持有人召回药品不彻底的，责令其召回药品的主体为",opts:["A.药品上市许可持有人","B.药品生产企业","C.药品经营企业","D.药品监督管理部门"],ans:"D",exp:"责令召回是指药品上市许可持有人应当召回药品而未主动召回的，或认为持有人召回药品不彻底的，药品监督管理部门责令药品上市许可持有人召回药品。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"53. 医疗机构炮制中药饮片备案时提供虚假材料的，没收违法所得，并处罚款的数额为",opts:["A.3万元以下","B.5万元以下","C.5年内","D.10年内"],ans:"A",exp:"举办中医诊所、委托配制中药制剂、炮制中药饮片应备案而未备案的，或备案时提供虚假材料的，由中医药主管部门和药品监督管理部门按照各自职责分工责令改正，没收违法所得，并处3万元以下罚款，向社会公告相关信息。"},
      {q:"54. 举办中医诊所备案时提供虚假材料，被相关部门处罚后拒不改正的，责令停止相关活动，其直接责任人员不得从事中医药相关活动的时间是",opts:["A.3万元以下","B.5万元以下","C.5年内","D.10年内"],ans:"C",exp:"拒不改正的，责令停止相关活动，其直接责任人员5年内不得从事中医药相关活动。"},

    // ===== 三、综合分析选择题（86-95） =====
    {type:"最佳选择题",q:"86. 关于A企业的行为，下列说法正确的是",opts:["A.存放药品于注册地址外的仓库未报备，违反药品GSP关于储存管理的规定","B.委托未通过GSP认证的企业运输药品，仅需向所在地省级药监部门报告","C.向无证诊所销售药品属于合法商业行为，未开具发票仅违反财务规定","D.零售药品时无需再次验证购货单位资质，因已取得经营许可证"],ans:"A",exp:"根据材料，药品上市许可持有人零售药品时需符合GSP规定，且禁止在核准地址以外的场所储存药品（需按变更仓库地址申请）。委托不符合GSP的企业运输药品属于禁止类行为，向无合法资质单位销售药品及未开具发票均属于禁止类行为。"},
    {type:"最佳选择题",q:"87. B公司的下列行为中，属于《药品经营管理》禁止类行为的是",opts:["A.聘用“挂证”执业药师骗取经营许可","B.向连锁药店总部销售第二类精神药品","C.委托符合GSP的企业储存药品","D.如实记录药品购销存数据"],ans:"A",exp:"禁止药品批发企业采用“挂证”执业药师骗取经营许可证。"},
    {type:"最佳选择题",q:"88. 关于药品批发企业跨省经营的管理要求，下列说法错误的是",opts:["A.跨省设置仓库需经企业所在地和仓库所在地省级药监部门同意","B.跨省委托运输需向两地省级药监部门报告","C.跨省委托储存需按变更仓库地址申请","D.跨省仓库无需纳入企业统一计算机系统管理"],ans:"D",exp:"根据材料，药品批发企业跨省设置仓库需纳入统一计算机系统管理。"},
    {type:"最佳选择题",q:"89. 关于甲企业生产假药的法律责任，下列说法正确的是",opts:["A.没收违法所得及假药，并处货值金额10倍罚款（250万元）","B.责令停产停业整顿，吊销药品注册证书，并处750万元罚款","C.对法定代表人仅处没收违法所得，无需附加罚款","D.公安机关对责任人员处3日拘留，终身禁止从事药品经营活动"],ans:"B",exp:"根据《疫苗管理法》第八十条，生产的疫苗属于假药的，货值金额不足50万元按50万元计算，罚款倍数为15-50倍。50万元×15=750万元。对责任人员需没收违法所得，并处1-10倍罚款，公安机关处5～15日拘留。"},
    {type:"最佳选择题",q:"90. 针对甲企业违反疫苗运输管理规范的行为，监管部门的处理措施正确的是",opts:["A.责令改正，给予警告，销毁违法运输的疫苗，并处15万元罚款","B.情节严重的，并处运输疫苗货值金额3倍罚款（24万元）","C.拒不改正的，处10万元以上30万元以下罚款","D.情节严重的，对责任人员处违法所得5倍罚款，终身禁止从业"],ans:"D",exp:"初次违反冷链运输规定且拒不改正的，罚款20万-100万元。情节严重时，罚款为货值金额10-30倍（货值8万元按10万元计算，10×10=100万元起）。对责任人员应处违法所得50%-5倍罚款，终身禁止从业。"},
    {type:"最佳选择题",q:"91. 关于甲公司申请《购用证明》的表述，正确的是",opts:["A.应向国家药监局申请，省级无权核发","B.《购用证明》有效期应为6个月，此处错误","C.省级药品监督管理部门有权核发，有效期3个月符合规定","D.《购用证明》可多次使用，甲公司可重复使用"],ans:"C",exp:"申请《购用证明》的单位，向所在地省级药品监督管理部门或者省级药品监督管理部门确定并公布的设区的市级药品监督管理部门提出申请，经审查，符合规定的，由省级药品监督管理部门发给《购用证明》。"},
    {type:"最佳选择题",q:"92. 甲公司的下列行为中，违反药品类易制毒化学品管理规定的是",opts:["A.向本省取得《购用证明》的乙公司销售原料药","B.将单方制剂直接销售给区域性批发企业丁公司","C.乙公司转售原料药至外省丙公司","D.乙公司以现金方式支付货款"],ans:"B",exp:"药品类易制毒化学品单方制剂（如盐酸麻黄碱注射液）必须由生产企业销售给麻醉药品全国性批发企业，甲公司直接销售给区域性批发企业丁公司违反规定。"},
    {type:"最佳选择题",q:"93. 关于该医院制剂室设立条件的说法，正确的是",opts:["A.制剂室负责人与药检室负责人可互相兼任，符合岗位设置要求","B.与药品生产企业共用配制设备属于正常协作，未违反制剂管理规定","C.必须取得《医疗机构制剂许可证》方可配制制剂，该医院已合规取得","D.配制中药制剂无需省级药监局批准，按《中医药法》可直接配制"],ans:"C",exp:"根据材料，医疗机构配制制剂必须取得《医疗机构制剂许可证》。制剂室负责人与药检室负责人不得互相兼任，不得与其他单位共用配制设备。配制中药制剂仍需省级药监局批准，除非法律另有规定。"},
    {type:"最佳选择题",q:"94. 医院变更配制地址未申请的行为，下列说法正确的是",opts:["A.无需申请，属于登记事项变更","B.属于许可事项变更，应在变更前30日申请","C.属于登记事项变更，应在核准后30日内申请","D.属于许可事项变更，可在变更后补正申请"],ans:"B",exp:"配制地址变更属于许可事项变更，应在变更前30日向原批准机关申请，不可事后补正。登记事项变更包括机构名称、法定代表人等，与配制地址无关。"},
    {type:"最佳选择题",q:"95. 关于“复方黄芪口服液”批准文号的表述，错误的是",opts:["A.批准文号格式应为“京药制字Z20210015”（Z代表中药制剂）","B.该文号有效期至2024年12月31日，2025年配制需重新申请再注册","C.再注册申请应在有效期届满前3个月提出","D.该医疗机构制剂批准文号正确"],ans:"D",exp:"中药制剂批准文号代码应为Z，而该文号为“京药制字H20210015”（H代表化学制剂），代码错误。批准文号有效期3年，届满前3个月申请再注册。"},

    // ===== 四、多项选择题（96-100） =====
    {type:"多项选择题",q:"96. 下列属于无需进行广告内容审查的情形有",opts:["A.医疗器械在传单上仅宣传产品名称的","B.非处方药在电视上仅宣传商品名称的","C.处方药在指定的药学专业刊物上仅宣传通用名称的","D.特殊医学用途配方食品在指定的医学专业刊物上仅宣传产品名称的"],ans:"ABCD",exp:"药品、医疗器械、保健食品和特殊医学用途配方食品广告中只宣传产品名称（含药品通用名称和药品商品名称）的，不再对其内容进行审查。"},
    {type:"多项选择题",q:"97. 根据药品经营质量管理规范的规定，关于药品零售配送质量管理的说法错误的有",opts:["A.药品零售企业制定配送质量管理制度和评审制度，应当配备专职人员负责配送质量管理工作","B.药品需独立包装，不得与其他产品合并包装","C.配送药品的配送箱箱体应选用透气性高、防水性高、导热性低的材质","D.冷冻产品、高温熟食快餐等与药品储存要求有明显温度差异的商品同药品不得混箱、混车配送"],ans:"ABCD",exp:"①药品零售企业制定配送质量管理制度和评审制度，配备专职或兼职人员负责配送质量管理工作。②药品需独立包装，不得与其他产品合并包装（医疗器械、保健食品除外）。③配送药品的配送箱箱体应选用透气性低、防水性高、导热性低的材质。④冷冻产品、高温熟食快餐等与药品储存要求有明显温度差异的商品同药品混箱、混车配送的，应当采取隔温封装等有效措施，且必须按照药品GSP有关要求予以验证，验证数据可确保配送过程中零售药品持续符合储存要求的方可混箱。"},
    {type:"多项选择题",q:"98. 下列药品上市许可持有人销售行为符合《中华人民共和国药品管理法》的有",opts:["A.药品上市许可持有人必须自行销售其取得药品注册证书的药品","B.药品上市许可持有人自行销售其取得注册证的放射性药品的，无需申请取得放射性药品经营许可证","C.药品上市许可持有人从事药品零售活动时，应当向药品监督管理部门申请药品经营许可证","D.若持有人委托销售药品，药品上市许可持有人和受托经营企业应当签订委托协议和销售协议，并严格履行协议约定的义务"],ans:"BC",exp:"①药品上市许可持有人可以自行销售其取得药品注册证书的药品，也可以委托符合条件的药品经营企业销售。②药品上市许可持有人自行销售其取得注册证的放射性药品销售活动的，无需申请取得放射性药品经营许可证。③药品上市许可持有人从事药品零售活动时，应当向药品监督管理部门申请药品经营许可证。④药品上市许可持有人委托销售药品的，药品上市许可持有人和受托经营企业应当签订委托协议，无需再签订销售协议。"},
    {type:"多项选择题",q:"99. 下列医疗器械按照风险程度由高到低的排列顺序正确的有",opts:["A.听诊器（无电能）、脑电图机、微波手术刀","B.高频电刀、血压计、手术帽","C.输血器、医学影像处理软件、透气胶带","D.体温计、（中医用）针灸针、体外反搏装置"],ans:"BC",exp:"①第三类医疗器械具有较高风险，风险程度由高到低的排列应按照第三类、第二类、第一类进行排序。听诊器（无电能）为第一类，脑电图机为第二类，微波手术刀为第三类，A错误。②高频电刀为第三类，血压计为第二类，手术帽为第一类，B正确。③输血器为第三类，医学影像处理软件为第二类，透气胶带为第一类，C正确。④体温计、（中医用）针灸针为第二类，体外反搏装置为第三类，D错误。"},
    {type:"多项选择题",q:"100. 关于医院药师的职责的说法，正确的有",opts:["A.参与临床药物治疗，进行个体化药物治疗方案的设计与实施","B.参加查房、会诊、病例讨论和疑难、危重患者的医疗救治","C.开展药品质量监测，药品严重不良反应和药品损害的收集、整理、报告工作","D.建立药品遴选制度，审核本临床科室申请的新购入药品"],ans:"ABC",exp:"①参与临床药物治疗，进行个体化药物治疗方案的设计与实施属于医院药师的职责。②参加查房、会诊、病例讨论和疑难、危重患者的医疗救治属于医院药师的职责。③开展药品质量监测，药品严重不良反应和药品损害的收集、整理、报告工作属于医院药师的职责。④建立药品遴选制度，审核本临床科室申请的新购入药品属于药事管理与药物治疗学委员会的职责。"}
  ]
},
  {
  name: "押题密卷（八）·药事管理与法规",
  questions: [
    // ===== 一、最佳选择题（1-40） =====
    {type:"最佳选择题",q:"1. 关于全面深化药品医疗器械监管改革的说法，错误的是",opts:["A.进一步提升我国医药产业原始创新","B.进一步提高审评审批效率","C.提出推进生物制品（疫苗）批签发授权、促进仿制药质量提升等措施","D.到2035年，建成与医药创新和产业发展相适应的监管体系"],ans:"D",exp:"本题考查全面深化药品医疗器械监管改革。到2027年，建成与医药创新和产业发展相适应的监管体系。到2035年，基本实现监管现代化。D选项错误。"},
    {type:"最佳选择题",q:"2. 下列关于药品安全风险管理要求说法错误的是",opts:["A.药品安全风险管理的第一环节就是新药研发环节的风险管理，主要包括了非临床研究的风险管理和临床试验的风险管理","B.药品自然风险来源于用药差错、不合理用药、药品质量问题、政策制度设计及管理导致的风险，是我国药品安全风险的关键因素","C.对附条件批准的药品，药品上市许可持有人应当采取相应风险管理措施，并在规定期限内按照要求完成相关研究","D.研发期间安全性更新报告应当每满一年提交一次，于药物临床试验获准后每满1年后的2个月内提交"],ans:"B",exp:"本题考查药品安全与风险管理。药品自然风险来源于已知或者未知的药品不良反应。药品人为风险来源于用药差错、不合理用药、药品质量问题、政策制度设计及管理导致的风险，是我国药品安全风险的关键因素。B选项错误。"},
    {type:"最佳选择题",q:"3. 下列关于国家基本药物管理说法错误的是",opts:["A.建立国家基本药物制度的主要目标有规范药品生产流通使用行为，促进合理用药，减轻群众负担","B.国家基本药物工作委员会办公室设在国家卫生健康委员会，由国家卫生健康委员会承担国家基本药物工作委员会的日常工作","C.发生群体药品不良事件的药物应当调出国家基本药物目录","D.药品集中采购平台和医疗机构信息系统应对基本药物标注，提示医疗机构优先采购、医师优先使用"],ans:"C",exp:"本题考查国家基本药物管理。发生严重药品不良反应，经过评估不宜作为国家基本药物使用的应当从国家基本药物目录调出。药品不良反应不等同于药品不良事件。C选项错误。"},
    {type:"最佳选择题",q:"4. 下列属于行政规章的是",opts:["A.《易制毒化学品管理条例》","B.《医疗用毒性药品管理办法》","C.《疫苗管理法》","D.《药品进口管理办法》"],ans:"D",exp:"本题考查法的渊源。行政规章包括部门规章和地方政府规章。《药品进口管理办法》是部门规章，属于行政规章。《易制毒化学品管理条例》《医疗用毒性药品管理办法》是行政法规。《疫苗管理法》属于法律。"},
    {type:"最佳选择题",q:"5. 下列不属于省级药品监督管理部门主要职责的是",opts:["A.制定药品零售和使用、医疗器械经营和使用、化妆品经营环节安全监管制度","B.负责组织开展药品、医疗器械、化妆品生产环节以及药品批发、药品零售连锁企业总部、药品互联网销售第三方平台监督检查","C.实施执业药师资格准入制度，负责执业药师注册管理制度","D.负责本行政区域内境外药品上市许可持有人指定的境内责任人的监督管理"],ans:"A",exp:"本题考查药品监督管理部门。市、县级药品监督管理部门制定药品零售和使用、医疗器械经营和使用、化妆品经营环节安全监管制度。A选项错误。"},
    {type:"最佳选择题",q:"6. 行政处罚的设定，是指行政处罚应由哪个机关，以什么形式来规定的权限。根据《行政处罚法》，关于行政处罚设定的说法错误的是",opts:["A.法律可以设定各种行政处罚并对限制人身自由的行政处罚权创设持有专属权","B.行政法规可以设立包括限制人身自由的行政处罚","C.地方性法规可以设立除限制人身自由、吊销企业营业执照以外的行政处罚","D.除法律、法规和规章以外的其他规范性文件不得设定行政处罚"],ans:"B",exp:"本题考查行政处罚。行政法规可以设立除限制人身自由以外的行政处罚。B选项错误。"},
    {type:"最佳选择题",q:"7. 关于药品研制过程与质量管理规范说法错误的是",opts:["A.中药创新药处方来源于古代经典名方或者中医临床经验方，如处方组成、临床定位、用法用量等与既往临床应用基本一致，采用与临床使用药物基本一致的传统工艺，且可通过人用经验初步确定功能主治、适用人群、用药方案和临床获益等的，可不开展非临床有效性研究","B.来源于临床实践的中药新药，人用经验能在临床定位、适用人群筛选、疗程探索、剂量探索等方面提供研究、支持证据的，可不开展Ⅲ期临床试验","C.新药I期临床试验应当由三级医疗机构实施","D.对于已上市药品的临床试验用药品档案应当至少保存至药品退市后2年"],ans:"B",exp:"本题考查药品研制过程与质量管理规范。来源于临床实践的中药新药，人用经验能在临床定位、适用人群筛选、疗程探索、剂量探索等方面提供研究、支持证据的，可不开展Ⅱ期临床试验。B选项错误。"},
    {type:"最佳选择题",q:"8. 下列关于新药上市注册管理说法错误的是",opts:["A.药品审评中心对药物临床试验申请应当自受理之日起60日内决定是否同意开展，逾期未通知的，视为同意","B.申请人拟开展生物等效性试验的，应当按照要求在药品审评中心网站完成生物等效性试验备案后，按照备案的方案开展相关研究工作","C.对纳入突破性治疗药物程序的药物，在药品上市许可申请时可纳入优先审评审批程序","D.对纳入优先审评审批程序的药品上市许可申请，临床急需的境外已上市境内未上市的罕见病药品，审评时限为130个工作日"],ans:"D",exp:"本题考查药品上市注册。对纳入优先审评审批程序的药品上市许可申请，临床急需的境外已上市境内未上市的罕见病药品，审评时限为70个工作日。D选项错误。"},
    {type:"最佳选择题",q:"9. 下列关于原料药、辅料和包装材料的关联审评审批说法错误的是",opts:["A.药品审评中心建立原料药、药用辅料和药包材登记平台与数据库","B.关联的原辅包通过了技术审评，登记平台标识为“I”","C.各省级药品监督管理部门对登记状态标识为“A”的原料药，按照药品进行上市后管理，开展药品GMP检查","D.化学原料药登记人应当在药品批准证明文件有效期届满前12个月至6个月期间，在线提交药品再注册申请"],ans:"B",exp:"本题考查原料药、辅料和包装材料的关联审评审批。关联的原辅包通过了技术审评，登记平台标识为“A”。B选项错误。"},
    {type:"最佳选择题",q:"10. 下列关于药物警戒和药品追溯说法正确的是",opts:["A.药品信息化追溯体系应包含药品追溯系统、药品追溯协同服务平台（国家药品监督管理局药品审评中心负责建设）和药品追溯监管系统","B.药物警戒质量管理规范（GVP）目的是规范和指导药品上市许可持有人和药品检验机构的药物警戒活动","C.药品追溯码标识应当遵循易识别性、清晰性、显著性的基本原则，可被扫码设备和人眼识读","D.药品上市许可持有人的法定代表人或主要负责人应指定药物警戒负责人，设立专门机构，配备专职或兼职人员，建立健全药物警戒相关管理制度和体系文件"],ans:"C",exp:"本题考查药品追溯。A选项药品追溯协同服务平台由国家药品监督管理局信息中心负责建设。B选项药物警戒质量管理规范目的是规范和指导药品上市许可持有人和药品注册申请人的药物警戒活动。D选项应配备专职人员，而非专职或兼职人员。"},
    {type:"最佳选择题",q:"11. 下列有关境外药品上市许可持有人指定中国境内责任人的管理说法错误的是",opts:["A.境外持有人应当在药品首次进口销售后，通过国家药品业务应用系统向所在地省级药品监督管理部门报告其指定的境内责任人，并上传指定境内责任人的授权材料","B.对于在中国境内上市的单一药品品种，境外持有人应当为其指定唯一的中国境内责任人","C.进口药品首次办理进口备案时，口岸药品监督管理局应当查验进口药品说明书是否载明境内责任人信息","D.境外持有人变更境内责任人的，自授权书生效后15个工作日内通过国家药品业务应用系统向变更后所在地省级药品监督管理部门报告"],ans:"A",exp:"本题考查境外药品上市许可持有人指定中国境内责任人的管理。境外持有人应当在药品首次进口销售前，通过国家药品业务应用系统向所在地省级药品监督管理部门报告其指定的境内责任人，并上传指定境内责任人的授权材料。A选项错误。"},
    {type:"最佳选择题",q:"12. 应当向省级药品监督管理部门办理《药品经营许可证》许可事项变更的是",opts:["A.甲非连锁药品零售企业委托储存的","B.乙药品批发企业委托运输的","C.丙药品批发企业跨省设置仓库的","D.丁药品零售连锁企业总部委托运输的"],ans:"C",exp:"本题考查药品经营许可证管理。《药品经营许可证》许可事项变更包括：经营方式、经营地址、经营范围、仓库地址（包括增减仓库、异地设库、委托储存）。药品零售企业向市县级药品监督管理部门申请办理《药品经营许可证》许可事项变更。C选项跨省设置仓库属于仓库地址变更，向省级药品监督管理部门申请。"},
    {type:"最佳选择题",q:"13. 下列关于药品经营许可管理说法正确的是",opts:["A.药品零售企业取得化学药经营范围的，可以经营化学原料药","B.药品经营许可证的编号格式中两位分类代码的第一位为大写英文字母，第二位为小写英文字母，其中第一位大写字母C代表零售连锁门店","C.仅从事乙类非处方药零售活动的，药品监督管理部门应当自许可决定作出之日起3个月内组织现场检查","D.药品监督管理部门不予受理药品经营企业在药品经营许可证有效期届满前2个月内提出的重新审查发证的申请"],ans:"C",exp:"本题考查药品经营许可证管理。A选项药品零售企业不得经营化学原料药。B选项药品经营许可证的编号格式中两位分类代码的第一位为大写英文字母，第二位为大写英文字母。D选项药品经营企业在药品经营许可证有效期届满前2个月内提出重新审查发证申请的，导致在法定的工作时限内药品经营许可证有效期已经届满，但发证机关还未作出决定的药品经营企业应当自觉停止药品经营活动，待发证机关准予许可后，方可恢复药品经营。"},
    {type:"最佳选择题",q:"14. 甲药品批发企业于2025年采购一批次阿莫西林胶囊，已知该批次阿莫西林胶囊于2027年过期，相关资质材料、购进凭证、记录可以保存至",opts:["A.2027年","B.2028年","C.2029年","D.2031年"],ans:"D",exp:"本题考查药品经营总体要求。药品批发企业购进销售药品活动中的有关资质材料和购进销售凭证、记录保存不得少于5年，且不少于药品有效期满后1年。2025年采购，至少保存5年，即到2030年，且不少于2028年，所以2031年符合。"},
    {type:"最佳选择题",q:"15. 下列可由药品上市许可持有人委托销售，但不得再次委托运输的是",opts:["A.放射性药品、麻醉药品","B.药品类易制毒化学品、疫苗","C.疫苗、中药配方颗粒","D.中药配方颗粒、放射性药品"],ans:"A",exp:"本题考查涉药储存运输的管理、药品上市许可持有人经营管理。不可以委托销售疫苗、中药配方颗粒。疫苗、麻醉药品、精神药品、医疗用毒性药品、放射性药品、药品类易制毒化学品等特殊管理的药品以及中药配方颗粒不得再次委托运输。A选项正确。"},
    {type:"最佳选择题",q:"16. 下列药品可以委托生产且可由药品零售企业通过互联网销售的是",opts:["A.右美沙芬口服单方制剂","B.葡萄糖注射剂","C.依托咪酯注射剂","D.含麻黄的中成药"],ans:"D",exp:"本题考查药品网络销售的总体要求。禁止非法网络销售的有精神药品、医疗用毒性药品、麻醉药品、放射性药品、药品类易制毒化学品、血液制品、疫苗、医疗机构制剂、中药配方颗粒、依托咪酯注射剂。禁止网络零售的药品：①注射剂（降糖类药物除外）；②含麻黄碱类复方制剂（不包括含麻黄的中成药）；③含麻醉药品口服复方制剂；④《兴奋剂目录》所列的蛋白同化制剂和肽类激素（胰岛素除外）。D选项含麻黄的中成药可以网络零售。"},
    {type:"最佳选择题",q:"17. 药品零售企业经营细胞治疗类生物制品匹配的人员任职资格是",opts:["A.具有药学专业大学本科以上学历、执业药师资格和3年以上药品经营质量管理工作经历，在质量管理工作中具备正确判断和保障实施的能力","B.具备执业药师资格和3年以上药品经营质量管理工作经历，能独立解决经营过程中的质量问题","C.具备药学中专或者医学、生物、化学等相关专业大学专科以上学历或者具有药学初级以上专业技术职称","D.具有临床医学、预防医学、免疫学、微生物学等专业本科以上学历、执业药师资格，并经过相关产品上市许可持有人培训考核合格"],ans:"D",exp:"本题考查药品经营管理。申请经营血液制品、细胞治疗类生物制品的药品零售企业，应当具备与经营品种相适应的质量保证能力和产品信息化追溯能力。经营细胞治疗类生物制品的药品零售企业还应当具备与指定医疗机构电子处方信息互联互通的条件，配备的执业药师应当具有临床医学、预防医学、免疫学、微生物学等专业本科以上学历，并经过相关产品上市许可持有人培训考核合格。"},
    {type:"最佳选择题",q:"18. 根据药品经营质量管理规范，药品批发企业对于退货药品，可以采取的验收抽样方式是",opts:["A.至少检查一个最小包装","B.抽样比例加倍、检查至最小包装单位","C.抽样比例加倍且可不打开最小包装","D.不开箱检查"],ans:"B",exp:"本题考查药品经营质量管理规范-药品批发企业的流程管理。药品批发企业应当采取抽样比例加倍、检查至最小包装单位等方式加强对退货药品的收货、验收管理，保证退货环节药品的质量和安全，防止混入假冒药品。"},
    {type:"最佳选择题",q:"19. 下列均属于药品零售企业不得陈列，且必须凭处方销售的药品是",opts:["A.毒性中药饮片、含麻黄碱类复方制剂","B.罂粟壳中药饮片、小包装的直接口服中药饮片","C.第二类精神药品、毒性中药饮片","D.第二类精神药品、含麻黄碱类复方制剂"],ans:"C",exp:"本题考查药品经营质量管理规范-药品零售企业的管理、药品零售企业处方药的管理规定。药品零售企业不得陈列毒性中药饮片、罂粟壳中药饮片、第二类精神药品。必须凭处方销售：所有注射剂、医疗用毒性药品、第二类精神药品等。C选项正确。"},
    {type:"最佳选择题",q:"20. 下列关于药品进口管理说法错误的是",opts:["A.我国公布的药品进出口管理目录有《进口药品目录》《精神药品管制品种目录》《麻醉药品管制品种目录》和《生物制品目录》","B.医疗机构进口临床急需少量药品，应当经过口岸药品检验所检验，并与经营企业签订协议，经营企业应当与境外生产企业签订协议","C.医务人员为医疗需要携带少量麻醉药品和精神药品出入境的，应当持所在地省级药品监管部门发放的携带麻醉药品和精神药品证明","D.进口药品若属于麻醉药品，还需要向国家药品监督管理局申请进口准许证，符合规定的，在3个工作日内出具进口准许证"],ans:"B",exp:"本题考查药品进口管理。医疗机构进口临床急需少量药品，无需经过口岸药品检验所检验。B选项错误。"},
    {type:"最佳选择题",q:"21. 下列关于医疗机构药事管理的组织机构说法错误的是",opts:["A.药品监督管理部门成立省级、地市级药事管理与药物治疗学委员会，为本地区药事管理和药学服务提供技术支持","B.药事管理与药物治疗学委员会负责建立药品遴选制度，审核本临床科室申请的新购入药品、调整药品品种或者供应企业和申报医院制剂等事宜","C.药事管理与药物治疗学委员会委员由具有高级技术职务任职资格的药学、临床医学、护理和医院感染管理、医疗行政管理等人员组成","D.药事管理与药物治疗学委员会（组）设副主任委员若干，由药学和医务部门负责人担任"],ans:"A",exp:"本题考查医疗机构药事管理概述。卫生健康主管部门成立国家级、省级、地市级药事管理与药物治疗学委员会，分别为全国和本地区药事管理和药学服务提供技术支持。A选项错误。"},
    {type:"最佳选择题",q:"22. 紧密型医联体用药目录应当根据临床用药需求变化、国家基本药物目录和国家医保药品目录调整等情况实行动态调整",opts:["A.调整周期不超过1年","B.调整周期不超过2年","C.调整周期不超过3年","D.调整周期不超过5年"],ans:"A",exp:"本题考查医疗机构药品采购管理。紧密型医联体用药目录应当根据临床用药需求变化、国家基本药物目录和国家医保药品目录调整等情况实行动态调整，调整周期不超过1年。"},
    {type:"最佳选择题",q:"23. 下列有关于抗肿瘤药物临床应用管理的说法有误的是",opts:["A.首次抗肿瘤药物治疗方案应当由肿瘤诊疗能力强的医疗机构或省级卫生健康行政部门按照相应标准和程序遴选的其他医疗机构制订并实施","B.鼓励由二级以上医疗机构制订并实施首次抗肿瘤药物治疗方案","C.医疗机构应当通过治疗效果评估、处方点评等方式加强抗肿瘤药物临床应用的管理，并每半年至少开展一次专项处方点评，评价抗肿瘤药物处方的适宜性、合理性","D.开展肿瘤诊疗服务的二级以上医疗机构，应当在药事管理与药物治疗学委员会下设立抗肿瘤药物管理工作组"],ans:"B",exp:"本题考查抗肿瘤药物临床应用管理。鼓励由三级医疗机构制订并实施首次抗肿瘤药物治疗方案。B选项错误。"},
    {type:"最佳选择题",q:"24. 下列关于中药材管理的说法中正确的是",opts:["A.地区性民间习用药材应当在产地所在地省级药品监督管理部门行政区域内使用，不可以跨省使用","B.根据临床用药需求，结合中药资源和具体品种情况，现阶段仅支持牛黄、熊胆粉用于中药生产的替代品的研制","C.对内服中成药处方中含豹骨的品种，一律将豹骨去掉，不用代用品","D.目前被批准为地理标志的中药材主要为道地药材"],ans:"D",exp:"本题考查道地中药材保护。A选项地区性民间习用药材原则上在产地所在地省级药品监督管理部门行政区域内使用，确有临床使用需求的，可以跨省使用。B选项现阶段重点支持穿山甲、羚羊角、牛黄、熊胆粉、冬虫夏草等珍稀濒危中药材用于中药生产的替代品的研制。C选项对内服中成药处方中含豹骨的品种，可根据具体品种的有关情况，替代或减去豹骨。"},
    {type:"最佳选择题",q:"25. 下列关于中药配方颗粒监督管理的说法中有误的是",opts:["A.中药配方颗粒生产企业应当履行药品全生命周期的主体责任和相关义务，实施生产全过程管理，建立追溯体系，逐步实现来源可查、去向可追，加强风险管理","B.生产中药配方颗粒所需中药材，能人工种植养殖的，应当优先使用来源于符合中药材生产质量管理规范要求的中药材种植养殖基地的中药材","C.无国家药品标准的中药配方颗粒跨省使用的，应当符合使用地省级药品监督管理部门制定的标准","D.中药饮片品种已纳入医保支付范围的，经专家评审后将与中药饮片对应的中药配方颗粒纳入支付范围，并参照甲类管理"],ans:"D",exp:"本题考查中药饮片生产、经营管理。中药饮片品种已纳入医保支付范围的，各省级医保部门可综合考虑临床需要、基金支付能力和价格等因素，经专家评审后将与中药饮片对应的中药配方颗粒纳入支付范围，并参照乙类管理。D选项错误。"},
    {type:"最佳选择题",q:"26. 下列关于疫苗上市后管理说法错误的是",opts:["A.境外疫苗持有人原则上应当指定境内一家具备冷链药品质量保证能力的药品批发企业统一销售其同一品种疫苗，履行在销售环节的义务，并承担责任","B.疾病预防控制机构委托配送企业配送疫苗的，应当向同级药品监督管理部门和卫生健康主管部门报告","C.疫苗非临床研究、临床试验及血液制品生产等特殊情形所需的疫苗，相关使用单位向所在地省级卫生健康管理部门报告后，可向疫苗上市许可持有人或者疾病预防控制机构采购","D.疫苗上市许可持有人应当对疫苗配送企业的配送能力进行评估，严格控制配送企业数量，保证配送过程持续符合法定要求。在同一省级行政区域内选取疫苗区域配送企业原则上不得超过2家"],ans:"C",exp:"本题考查疫苗上市后管理。疫苗非临床研究、临床试验及血液制品生产等特殊情形所需的疫苗，相关使用单位向所在地省级药品监督管理部门报告后，可向疫苗上市许可持有人或者疾病预防控制机构采购。C选项错误。"},
    {type:"最佳选择题",q:"27. 下列不全是麻醉药品、精神药品的是",opts:["A.安钠咖片、盐酸氯卡色林、盐酸纳呋拉啡","B.复方地芬诺酯片、枸橼酸咖啡因注射液、吡仑帕奈口服混悬液","C.麦角胺咖啡因片、咪达唑仑注射剂、依托咪酯注射剂","D.富马酸泰吉利定注射剂、美沙酮胶囊、氨酚氢可酮片"],ans:"C",exp:"本题考查麻醉药品、精神药品目录。依托咪酯属于第二类精神药品（在中国境内批准上市的含依托咪酯的药品制剂除外）。C选项均为精神药品，不符合“不全是”。"},
    {type:"最佳选择题",q:"28. 下列关于放射性药品的管理说法正确的是",opts:["A.放射性药品是指用于预防、临床诊断或者治疗的放射性核素制剂或者其标记药物","B.开办放射性药品生产企业，经所在省级药品监督管理部门审查同意，由所在省级药品监督管理部门发给《放射性药品生产许可证》","C.放射性药品的药品上市许可持有人委托销售放射性药品的，受托方应当取得《放射性药品经营许可证》","D.《放射性药品使用许可证》有效期为5年，期满前6个月到2个月期间，医疗单位应当向原发证的行政部门重新提出申请，经审核批准后，换发新证"],ans:"C",exp:"本题考查放射性药品管理。A选项放射性药品是指用于临床诊断或者治疗的放射性核素制剂或者其标记药物，无预防。B选项经所在地省级国防科技工业主管部门审查同意，所在省级药品监督管理部门审核批准后，由所在省级药品监督管理部门发给《放射性药品生产许可证》。D选项《放射性药品使用许可证》有效期为5年，期满前6个月医疗单位应当向原发证的行政部门重新提出申请，经审核批准后，换发新证。"},
    {type:"最佳选择题",q:"29. 下列关于药品分包装行为、包装标签管理说法错误的是",opts:["A.同一药品上市许可持有人的同一品种应当由一个药品生产企业分包装，分包装的期限不得超过药品注册证书的有效期","B.同一药品上市许可持有人生产的同一药品，分别按照处方药与非处方药管理的，两者的包装颜色应当明显区别","C.药品的每个中包装必须按照规定印有或者贴有标签并附说明书","D.除片剂、胶囊剂外，境外生产药品分包装的药品应完成内包装，药品分包装的药品生产企业应当持有《药品生产许可证》"],ans:"C",exp:"本题考查药品包装标签管理规定。药品的每个最小销售包装必须按照规定印有或者贴有标签并附说明书。C选项错误。"},
    {type:"最佳选择题",q:"30. 仅在处方药说明书列入的项目不包括",opts:["A.【儿童用药】","B.【作用类别】","C.【老年用药】","D.【孕妇及哺乳期妇女用药】"],ans:"B",exp:"本题考查药品说明书管理规定。仅在处方药说明书列入的项目包括：【儿童用药】、【老年用药】、【孕妇及哺乳期妇女用药】。【作用类别】属于仅化学药非处方药品列出的项目。"},
    {type:"最佳选择题",q:"31. 下列关于药品说明书、标签、商标和专有标识的印刷规定说法错误的是",opts:["A.药品标签可以印制“企业防伪标识”“企业形象标志”“企业识别码”等文字图案","B.不得选用草书、篆书等不易识别的字体印刷通用名称，字体颜色应当使用黑色或者白色","C.说明书可以单色印刷非处方药专有标识，但必须在标识上方标示“甲类”或“乙类”字样","D.对于既可内服，又可以外用的中药、天然药物，可以不标注外用药品标识"],ans:"C",exp:"本题考查药品说明书、标签、商标和专有标识的印刷规定。说明书可以单色印刷非处方药专有标识，但必须在标识下方标示“甲类”或“乙类”字样。C选项错误。"},
    {type:"最佳选择题",q:"32. 国家实行药品安全信用档案管理的主体不包括",opts:["A.药品研制单位","B.药品经营企业","C.医疗器械生产企业","D.药品使用单位"],ans:"D",exp:"本题考查药品安全信息。国家对药品、医疗器械生产企业、经营企业和研制单位实行药品安全信用档案管理，不包括使用单位。"},
    {type:"最佳选择题",q:"33. 下列关于医疗器械管理说法错误的是",opts:["A.对用于治疗罕见疾病、严重危及生命且尚无有效治疗手段的疾病和应对公共卫生事件等急需的医疗器械，受理注册申请的药品监督管理部门可以作出附条件批准决定","B.《医疗器械生产许可证》有效期届满延续的，医疗器械生产企业应当在有效期届满90个工作日至30个工作日期间，向原发证部门提出延续申请","C.根据医疗器械的经营监督管理要求，实施四级监管的企业，设区的市级药品监督管理部门每年组织检查不少于一次，其中每两年全项目检查不少于一次","D.医疗器械的三级召回是针对使用该医疗器械引起危害的可能性较小但仍需要召回的"],ans:"C",exp:"本题考查医疗器械的经营与使用管理。根据医疗器械的经营监督管理要求，实施四级监管的企业，设区的市级药品监督管理部门每年组织全项目检查不少于一次。C选项错误。"},
    {type:"最佳选择题",q:"34. 不属于化妆品，但参照普通化妆品管理的是",opts:["A.香皂","B.牙膏","C.儿童化妆品","D.祛斑化妆品"],ans:"B",exp:"本题考查化妆品的界定和分类。牙膏不属于化妆品的定义，但是参照普通化妆品管理。"},
    {type:"最佳选择题",q:"35. 下列相关注册证号格式错误的是",opts:["A.国产保健食品注册号：国食健注G+4位年代号+4位顺序号","B.全营养配方食品注册号：国食注字TY+4位年代号+4位顺序号","C.特定全营养配方食品注册号：国食注字TY+4位年代号+4位顺序号","D.婴幼儿配方乳粉产品配方注册号：京食注字TY+4位年代号+4位顺序号"],ans:"D",exp:"本题考查特殊食品管理。婴幼儿配方乳粉产品配方注册号为：国食注字YP+4位年代号+4位顺序号。D选项错误。"},
    {type:"最佳选择题",q:"36. 下列违法行为在实施相应行政处罚时，罚款货值金额按照“不足5万元，按照5万元计算”的是",opts:["A.接种单位更换疫苗标签信息，当作知名厂家品种进行接种使用的","B.药品零售企业无处方销售处方药，造成危害后果的","C.药品零售连锁门店从药品上市许可持有人处购进药品的","D.医疗机构未按照备案材料载明的要求配制中药制剂的"],ans:"C",exp:"本题考查从无证生产、经营企业购入药品的法律责任。药品零售连锁门店从药品上市许可持有人处购进药品属于从无证企业购入药品，承担的法律责任为责令改正，没收违法购进的药品和违法所得，并处违法购进药品货值金额2倍以上10倍以下的罚款；情节严重的，并处货值金额10倍以上30倍以下的罚款，吊销药品经营许可证；货值金额不足5万元的，按5万元计算。C选项正确。"},
    {type:"最佳选择题",q:"37. 下列药品经营企业的违规情形中，即使存在及时改正且未影响药品安全质量的情节，也应按无证经营且不能给予减轻处罚的是",opts:["A.甲药品批发企业超经营范围销售中药饮片的","B.乙药品批发企业超经营范围销售米非司酮的","C.丙药品零售企业未经批准变更质量负责人的","D.丁药品批发企业药品经营许可证超过有效期继续经营人血白蛋白的"],ans:"D",exp:"本题考查无证生产、经营药品相关的法律责任。药品经营企业未经批准变更许可事项或者药品经营许可证超过有效期继续开展药品经营活动的，药品监督管理部门按照无证经营药品的规定给予处罚，但是，有下列情形之一，药品经营企业及时改正，不影响药品质量安全的，给予减轻处罚：①药品经营企业超出许可的经营方式、经营地址从事药品经营活动的；②超出经营范围经营的药品不属于疫苗、麻醉药品、精神药品、药品类易制毒化学品、医疗用毒性药品、血液制品、细胞治疗类生物制品的；③药品经营许可证超过有效期但符合申请办理药品经营许可证要求的；④依法可以减轻处罚的其他情形。人血白蛋白属于血液制品，所以D不能减轻。"},
    {type:"最佳选择题",q:"38. 疫苗配送企业违反疫苗储存、运输管理规范有关冷链储存、运输要求的，应承担的法律责任不包括",opts:["A.县级以上药品监督管理部门责令改正，给予警告，对违法储存、运输的疫苗予以销毁","B.对拒不改正的，对疫苗配送单位处以20万元以上100万元以下的罚款","C.情节严重的，对疫苗配送单位处违法储存、运输疫苗货值金额10倍以上30倍以下的罚款，货值金额不足10万元的，按10万元计算","D.情节严重的，对主要负责人等关键岗位人员没收违法行为期间从本单位所获收入，并处所获收入30%以上3倍以下的罚款"],ans:"D",exp:"本题考查违反疫苗管理规定的法律责任。对关键岗位人员处所获收入50%以上5倍以下的罚款，而非30%以上3倍以下。D选项错误。"},
    {type:"最佳选择题",q:"39. 以加工、提炼制毒物品制造毒品为目的购买麻黄碱类复方制剂，构成犯罪的以",opts:["A.销售伪劣产品罪定罪处罚","B.走私制毒物品罪定罪处罚","C.非法买卖制毒物品罪定罪处罚","D.制造毒品罪定罪处罚"],ans:"D",exp:"本题考查其他违反药品管理规定的法律责任。以加工、提炼制毒物品制造毒品为目的，购买麻黄碱类复方制剂的以制造毒品罪定罪处罚。"},
    {type:"最佳选择题",q:"40. 根据行政处罚裁量情形，下列情形中不符合“应当从重行政处罚”情形的是",opts:["A.以淀粉冒充药品类易制毒化学品的","B.生产以危重病人为使用对象的假药","C.销售的第二类医疗器械不符合备案的产品技术要求，造成人身伤害后果的","D.因药品、医疗器械违法行为受过行政处罚的"],ans:"D",exp:"本题考查行政处罚裁量情形。因药品、医疗器械违法行为受过刑事处罚的应当从重行政处罚。D选项是行政处罚，不符合。"},

    {type:"配伍选择题",subs:[
      {q:"41. 申请医保定点的零售企业应当取得《药品经营许可证》并在注册地址经营至少（）个月",opts:["A.2","B.3","C.5","D.6"],ans:"B",exp:"本题考查医疗保障定点管理。申请医保定点的零售企业应当取得《药品经营许可证》并在注册地址经营至少3个月。"},
      {q:"42. 根据执业药师继续教育学时管理，担任药品监管部门举办的有关执业药师工作的学术会议报告人，最多按照实际报告时间的（）倍计算学时",opts:["A.2","B.3","C.5","D.6"],ans:"D",exp:"本题考查执业药师继续教育管理。担任药品监管部门举办的有关执业药师工作的学术会议报告人，最多按照实际报告时间的6倍计算学时。"}

    {type:"配伍选择题",subs:[
      {q:"43. 根据《行政诉讼法》，人民法院应当在立案之日起（）个月内作出第一审判决",opts:["A.3","B.6","C.7","D.12"],ans:"B",exp:"本题考查行政诉讼。根据《行政诉讼法》，人民法院应当在立案之日起6个月内作出第一审判决。"},
      {q:"44. 经过抽查检验，对有证据证明可能危害人体健康的药品及其有关资料，药品监督管理部门可以查封、扣押，并在（）日内作出行政处罚决定",opts:["A.3","B.6","C.7","D.12"],ans:"C",exp:"本题考查药品质量监督检验。经过抽查检验，对有证据证明可能危害人体健康的药品及其有关资料，药品监督管理部门可以查封、扣押，并在7日内作出行政处罚决定。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"45. 组织开展国家药品标准宣传培训与技术咨询的是",opts:["A.国家药品监督管理局食品药品审核查验中心","B.国家药品监督管理局药品审评中心","C.国家药典委员会","D.国家药品监督管理局安全应急演练中心"],ans:"C",exp:"本题考查药品监督管理专业技术机构。组织开展国家药品标准宣传培训与技术咨询的是国家药典委员会。"},
      {q:"46. 药品注册标准是经药品注册申请人提出，由（）核定，在批准药品上市许可、补充申请时发给药品上市许可持有人的质量标准",opts:["A.国家药品监督管理局食品药品审核查验中心","B.国家药品监督管理局药品审评中心","C.国家药典委员会","D.国家药品监督管理局安全应急演练中心"],ans:"B",exp:"本题考查药品标准。药品注册标准是经药品注册申请人提出，由国家药品监督管理局药品审评中心核定，在批准药品上市许可、补充申请时发给药品上市许可持有人的质量标准。"},
