ze:16px;border-radius:8px;border:1px solid #b8e0b3;background:#fbfef9}.quiz-nav{position:fixed;bottom:0;left:0;right:0;background:#f4fbf0;padding:12px 16px;box-shadow:0 -2px 10px rgba(0,0,0,.06);display:flex;gap:10px;align-items:center;justify-content:space-between;z-index:100;max-width:860px;margin:0 auto}.next-btn{padding:14px 24px;background:#8cc98f;color:#fff;border:none;border-radius:8px;font-size:16px;cursor:pointer;flex:1}.next-btn:hover{background:#76b579}.next-btn:disabled{background:#cce8cd;cursor:not-allowed}.progress-text{font-size:15px;color:#5a6b5c;white-space:nowrap}@media(max-width:600px){body{padding:10px;padding-bottom:90px;font-size:16px}.card{padding:14px}.q-title{font-size:17px;line-height:1.85}.option{padding:14px;font-size:16px}.nav-bar{display:none}}{body{padding:8px;padding-bottom:90px}.card{padding:12px}.q-title{font-size:15px}.option{padding:12px;font-size:15px}.nav-bar{display:none}}html,body{overflow-x:hidden;touch-action:pan-y}

.q-title img{max-width:100%;height:auto}</style></head><body><h1>法规 冲刺卷</h1><div class="chapter-select"><select id="chapterSelect" onchange="switchChapter(this.value)"></select></div><div class="chapter-title" id="chapterTitle"></div><div class="stats" id="stats"></div><div id="quiz"></div><div class="nav-bar"><button class="nav-btn" id="prevBtn" onclick="prevChapter()">上一章</button><button class="nav-btn" id="nextBtn" onclick="nextChapter()">下一章</button></div><script>
var chapters=[
{
  name: "押题密卷（一）",
  questions: [
    // ===== 一、最佳选择题（1-40） =====
    {type:"最佳选择题",q:"1. 健康中国建设应遵循的原则是",opts:["A.健康优先、共建共享、科学发展、公平公正","B.健康优先、改革创新、预防为主、公平公正","C.健康优先、改革创新、科学发展、公平公开","D.健康优先、改革创新、科学发展、公平公正"],ans:"D",exp:"健康中国建设遵循的原则是健康优先、改革创新、科学发展、公平公正。"},
    {type:"最佳选择题",q:"2. 下列关于医保药品目录的分类与调整说法错误的是",opts:["A.“甲类药品”是临床治疗必需、使用广泛、疗效确切、同类药品中价格或治疗费用较低的药品","B.“乙类药品”是可供临床治疗选择使用，疗效确切、同类药品中比“甲类药品”价格或治疗费用略高的药品","C.《药品目录》中工伤保险和生育保险支付药品纳入“乙类药品”管理","D.协议期内谈判药品纳入“乙类药品”管理"],ans:"C",exp:"《药品目录》包括限工伤保险基金准予支付费用的品种、限生育保险基金准予支付费用的品种。工伤保险和生育保险支付药品费用时不区分甲、乙类。"},
    {type:"最佳选择题",q:"3. 下列不属于执业药师不予注册的情形的是",opts:["A.受刑事处罚，自刑罚执行完毕之日起到申请注册之日不满3年的","B.未按规定完成继续教育学习的","C.持有《执业药师职业资格证书》不满3年的","D.近3年有新增不良信息记录的"],ans:"C",exp:"不予注册的情形有：(1)不具备完全民事行为能力的；(2)甲、乙类传染病传染期，精神病发病期等健康状况不适宜或者不能胜任执业药师业务工作的；(3)受刑事处罚，自刑罚执行完毕之日起到申请注册之日不满3年的；(4)未按规定完成继续教育学习的；(5)近3年有新增不良信息记录的。"},
    {type:"最佳选择题",q:"4. 独立承担药品监管部门执业药师类研究课题项目且课题项目结项的，当年度每项最多折算继续教育学时为",opts:["A.60学时","B.40学时","C.30学时","D.20学时"],ans:"B",exp:"独立承担药品监管部门、人力资源社会保障部门或者相关行业协会学会的执业药师类研究课题，或者独立承担相关科研基金项目，课题项目结项的，当年度每项最多折算为40学时。"},
    {type:"最佳选择题",q:"5. 由国务院在法定职权范围内，为实施宪法和法律制定的规范性法律文件，由总理签署以国务院令公布的是",opts:["A.部门规章","B.行政法规","C.地方政府规章","D.地方性法规"],ans:"B",exp:"行政法规指国务院在法定职权范围内，为实施宪法和法律制定的规范性法律文件，行政法规由总理签署以国务院令形式公布。"},
    {type:"最佳选择题",q:"6. 根据《行政处罚法》，违法行为事实确凿、有法定依据、拟作出数额较小的罚款时，可以适用简易程序。其中对公民的罚款数额为",opts:["A.50元以下","B.100元以下","C.200元以下","D.3000元以下"],ans:"C",exp:"当违法事实确凿、有法定依据、拟作出数额较小的罚款（对法人或其他组织处3000元以下，对公民处200元以下的罚款）或者警告时，适用于简易程序。"},
    {type:"最佳选择题",q:"7. 设区的市级、县级药品不良反应监测机构应当对收到的药品不良反应报告的真实性、完整性和准确性进行审核。严重药品不良反应报告的审核和评价完成时间要求是",opts:["A.3个工作日内","B.7个工作日内","C.15个工作日内","D.30个工作日内"],ans:"A",exp:"严重药品不良反应报告的审核和评价应当自收到报告之日起3个工作日内完成，其他报告的审核和评价应当在15个工作日内完成。"},
    {type:"最佳选择题",q:"8. 下列关于药品注册管理的说法错误的是",opts:["A.药品注册管理应遵循公开、公平、公正原则，以临床价值为导向","B.药品注册包括药物临床试验申请、药品上市许可申请、补充申请、再注册申请等许可事项，以及其他备案或者报告事项","C.药品注册按照中药、化学药、生物制品和诊断试剂等进行分类注册管理","D.境外生产药品的注册申请按照药品的细化分类和相应的申报资料要求执行"],ans:"C",exp:"药品注册按照中药、化学药和生物制品等进行分类注册管理。"},
    {type:"最佳选择题",q:"9. 下列关于仿制药说法错误的是",opts:["A.仿制药是指仿制已上市原研药品的药品","B.同品种药品通过一致性评价的药品生产企业达到3家以上的，在药品集中采购等方面，原则上不再选用未通过一致性评价的品种","C.国家药品监督管理局建立通过仿制药质量和疗效一致性评价的化学药品目录集","D.仿制药要求与原研药品具有相同的活性成分、剂型、规格、适应症、给药途径、处方工艺和药品疗效"],ans:"D",exp:"仿制药要求与原研药品具有相同的活性成分、剂型、规格、适应症、给药途径和用法用量，不强调处方工艺与原研药品一致，但强调仿制药品必须与原研药品质量和疗效一致。"},
    {type:"最佳选择题",q:"10. 关于药品上市许可持有人执行《药品生产质量管理规范》的说法，错误的是",opts:["A.企业应当建立符合药品质量管理要求的质量目标，确保所生产的药品符合生产和使用要求","B.药品生产所用的原辅料、与药品直接接触的包装材料应当符合相应的质量标准","C.药品的生产和包装均应当按照批准的艺术规程和操作规程进行操作，符合药品生产许可和注册批准的要求","D.质量管理部门应当对所有生产用物料供应商进行质量评估"],ans:"A",exp:"企业应当建立符合药品质量管理要求的质量目标，将药品注册的有关安全、有效和质量可控的所有要求，系统地贯彻到药品生产、控制及产品放行、贮存、发运的全过程中，确保所生产的药品符合预定用途和注册要求。"},
    {type:"最佳选择题",q:"11. 关于药物临床试验的说法，错误的是",opts:["A.药物临床试验是决定候选药物能否成为新药上市销售的关键阶段","B.药物临床试验分为I期临床试验、II期临床试验、III期临床试验、IV期临床试验","C.新药在批准上市前，申请新药注册应完成I、II、III期临床试验","D.药物临床试验是指以人体为对象的试验"],ans:"B",exp:"药物临床试验分为I期临床试验、II期临床试验、III期临床试验、IV期临床试验以及生物等效性试验。"},
    {type:"最佳选择题",q:"12. 下列药品中不属于药品零售企业的经营范围的是",opts:["A.放射性药品","B.血液制品","C.细胞治疗类生物制品","D.医疗用毒性药品"],ans:"A",exp:"药品零售企业不得经营放射性药品。"},
    {type:"最佳选择题",q:"13. 下列关于药品经营许可证管理说法错误的是",opts:["A.药品经营许可证有效期为5年，药品经营企业应当在有效期届满前6个月至2个月期间，向发证机关提出重新审查发证申请","B.药品经营许可证编号格式为“省份简称+四位年号+四位顺序号”","C.仅从事乙类非处方药零售活动的实施告知承诺制审批，药品监督管理部门应当自许可决定作出之日起3个月内对其组织开展技术审查和现场检查","D.药品批发企业申请药品经营许可证由省级药品监督管理部门负责审批"],ans:"B",exp:"药品经营许可证编号格式为“省份简称+两位分类代码+四位地区代码+五位顺序号”。"},
    {type:"最佳选择题",q:"14. 在药品网络销售中第三方平台应当保存本平台内的药品展示、交易记录与投诉举报等记录信息，相关记录信息保存期限为",opts:["A.有效期满后不少于5年","B.至少5年且不少于有效期满后1年","C.至少3年且不少于有效期满后1年","D.不少于5年"],ans:"B",exp:"第三方平台应当保存本平台内的药品展示、交易记录与投诉举报等记录信息，相关记录信息保存期限至少5年，且不少于药品有效期满后1年。"},
    {type:"最佳选择题",q:"15. 下列关于药品拆零销售管理说法错误的是",opts:["A.负责拆零销售的人员应经过专门培训","B.拆零的工作台及工具应保持清洁、卫生，防止交叉污染","C.拆零销售应当使用洁净、卫生的包装，包装上注明药品名称、规格、数量、用法、用量、批号、有效期以及药店名称等内容","D.拆零销售期间应保留药品最小销售单元包装，但需将说明书原件及时提供给消费者，以便患者正确使用药品"],ans:"D",exp:"拆零销售期间保留原包装和说明书。提供药品说明书原件或者复印件。并非必须提供说明书原件。"},
    {type:"最佳选择题",q:"16. 下列关于药品陈列管理说法错误的是",opts:["A.按剂型、用途、规格、价格及储存要求分类陈列，并设置醒目标志","B.药品放置于货架(柜)，摆放整齐有序，避免阳光直射","C.处方药不得采用开架自选的方式陈列和销售","D.冷藏药品放置在冷藏设备中，按规定对温度进行监测和记录"],ans:"A",exp:"药品的陈列应当按剂型、用途以及储存要求分类陈列，并设置醒目标志，类别标签字迹清晰、放置准确。无需按照价格分类陈列。"},
    {type:"最佳选择题",q:"17. 验证使用的温度传感器应当适用被验证设备的测量范围，其最大允许误差为",opts:["A.±0.1℃","B.±0.5℃","C.±1.0℃","D.±2.0℃"],ans:"B",exp:"验证使用的温度传感器应当适用被验证设备的测量范围，其最大允许误差为±0.5℃，并经法定计量机构校准，校准证书复印件为验证报告的必要附件。"},
    {type:"最佳选择题",q:"18. 下列关于销售处方药与非处方管理说法中错误的是",opts:["A.未依法获取药品经营许可证(零售)的药品上市许可持有人不得直接向病患者推荐、销售处方药、非处方药","B.零售药店凭处方销售处方药，处方保留不少于5年","C.消费者自行开架选购含麻黄碱类复方制剂非处方药时，药品零售企业一次销售不得超过2个最小包装","D.药品零售企业销售含麻黄碱类复方制剂应当查验购买者的身份证原件，并对其姓名和身份证号码予以登记"],ans:"C",exp:"消费者无处方购买含麻黄碱类复方制剂（非处方药）时，药品零售企业一次销售不得超过2个最小包装。药品零售企业不得开架销售含麻黄碱类复方制剂，应当设置专柜由专人管理、专册登记。"},
    {type:"最佳选择题",q:"19. 进口麻醉药品和精神药品的应当取得进口准许证，此证件的发证部门是",opts:["A.国家药品监督管理局","B.省级药品监督管理部门","C.口岸药品监督管理部门","D.海关"],ans:"A",exp:"进、出口麻醉药品和精神药品的，应当取得国家药品监督管理局颁发的进口准许证、出口准许证。"},
    {type:"最佳选择题",q:"20. 根据《药品检查管理办法(试行)》规定，下列不属于药品经营企业现场检查项目分级的是",opts:["A.严重缺陷项目","B.主要缺陷项目","C.一般缺陷项目","D.轻微缺陷项目"],ans:"D",exp:"指导原则检查项目分为三级，分别为：严重缺陷项目，备注为**，又称为“一票否决项”。主要缺陷项目，备注为*，为相对重要的检查项目。一般缺陷项目，无备注符号，为相对一般的检查项目。"},
    {type:"最佳选择题",q:"21. 医疗机构需要合理确定采购范围和采购量，医院采购计划要按照不低于上年度药品实际用量的比例是",opts:["A.80%","B.70%","C.60%","D.50%"],ans:"A",exp:"医院要按照不低于上年度药品实际使用量的80%制定采购计划。"},
    {type:"最佳选择题",q:"22. 下列关于医疗机构中药制剂说法中错误的是",opts:["A.国家鼓励医疗机构根据本医疗机构临床用药需要配制和使用中药制剂","B.国家支持应用传统工艺配制中药制剂","C.医疗机构应用传统工艺配制的中药制剂品种，应当依法取得制剂批准文号","D.中药配方颗粒不属于传统中药制剂"],ans:"C",exp:"医疗机构配制的中药制剂品种，应当依法取得制剂批准文号。但是仅应用传统工艺配制的中药制剂品种，向医疗机构所在地省级药品监督管理部门备案后即可配制，不需要取得制剂批准文号。"},
    {type:"最佳选择题",q:"23. 下列药品中不属于重点监控药品目录品种的是",opts:["A.肠外营养药物","B.抗肿瘤药物","C.质子泵抑制剂","D.儿童用药"],ans:"D",exp:"重点监控药品目录中的药品应当是临床使用不合理问题较多、使用金额异常偏高、对用药合理性影响较大的化学药品和生物制品。重点包括辅助用药、抗肿瘤药物、抗微生物药物、质子泵抑制剂、糖皮质激素、肠外营养药物等。"},
    {type:"最佳选择题",q:"24. 下列不属于道地中药材特点的是",opts:["A.品种优良","B.有适宜的生长环境与采收时间","C.产量丰富，质量稳定","D.具有在中医理论指导下良好的疗效"],ans:"C",exp:"道地中药材具有以下特点：①品种优良；②有适宜的生长环境与采收时间；③具有在中医理论指导下良好的疗效。"},
    {type:"最佳选择题",q:"25. 下列不属于国家野生保护药材的是",opts:["A.金钱白花蛇","B.刺五加","C.独活","D.防风"],ans:"C",exp:"金钱白花蛇属于二级保护药材；刺五加、防风属于三级保护药材。独活不属于野生保护药材。"},
    {type:"最佳选择题",q:"26. 下列关于中药材和中药饮片以及中成药的管理说法错误的是",opts:["A.中药材不得直接用于临床配方","B.中成药生产投料均应为中药饮片","C.生产中药饮片的企业必须取得《药品生产许可证》","D.中药配方颗粒的质量监管，纳入中成药的质量管理范畴"],ans:"D",exp:"中药配方颗粒是由单味中药饮片经水提、分离、浓缩、干燥、制粒而成的颗粒，按中医临床处方调配后供患者冲服，其纳入中药饮片质量管理范畴。"},
    {type:"最佳选择题",q:"27. 下列关于注射用A型肉毒毒素生产经营管理说法错误的是",opts:["A.药品生产企业应制定A型肉毒毒素制剂年度生产计划","B.注射用A型肉毒毒素可以销售至取得《医疗机构执业许可证》的医疗机构","C.购买注射用A型肉毒毒素应办理《购用证明》","D.注射用A型肉毒毒素每次处方剂量不得超过二日用量"],ans:"C",exp:"购买注射用A型肉毒毒素无需办理《购用证明》。"},
    {type:"最佳选择题",q:"28. 根据《关于加强含麻黄碱类复方制剂管理有关通知》，以下关于麻黄碱类复方制剂的管理要求，说法错误的是",opts:["A.零售企业销售含麻黄碱的复方制剂需凭处方销售，无处方不得销售","B.含麻黄碱类的复方制剂一律不得通过互联网向个人消费者销售","C.零售企业销售含麻黄碱类的复方制剂不得开架销售，应设置专柜，由专人管理","D.药品零售企业销售含麻黄碱类复方制剂，应当查验购买者的身份证"],ans:"A",exp:"单位剂量麻黄碱类药物含量大于30mg（不含30mg）按处方药管理。除处方药按处方剂量销售外，含麻黄碱类复方制剂非处方药一次销售不得超过2个最小包装。"},
    {type:"最佳选择题",q:"29. 《放射性药品生产企业许可证》的发证部门是",opts:["A.省级国防科技工业主管部门","B.国家药品监督管理局","C.省级药品监督管理部门","D.国务院环境保护主管部门"],ans:"C",exp:"经所在地省级国防科技工业主管部门审查同意，所在地省级药品监督管理部门审核批准后，由所在地省级药品监督管理部门发给《放射性药品生产许可证》。"},
    {type:"最佳选择题",q:"30. 接种预防用生物制品后可能出现的偶然或一过性反应的描述应当在说明书中的项目是",opts:["A.【不良反应】","B.【注意事项】","C.【禁忌】","D.警示语"],ans:"A",exp:"预防用生物制品【不良反应】应包括接种后可能出现的偶然或者一过性反应的描述，以及对于出现的不良反应是否需要特殊处理建议。"},
    {type:"最佳选择题",q:"31. 接受委托提供广告设计、制作、代理服务的自然人、法人或者其他组织。即提供广告设计、制作、代理服务的广告商是",opts:["A.广告主","B.广告经营者","C.广告发布者","D.药品广告"],ans:"B",exp:"广告经营者是指接受委托提供广告设计、制作、代理服务的自然人、法人或者其他组织。即提供广告设计、制作、代理服务的广告商。"},
    {type:"最佳选择题",q:"32. 下列选项中不属于药品安全监管信息公开清单内容的是",opts:["A.公开事项","B.具体内容","C.公开原因","D.公开部门"],ans:"C",exp:"药品安全监管信息公开清单包括公开事项、具体内容、公开时限、公开部门等。"},
    {type:"最佳选择题",q:"33. 消费者在购买、使用商品和接受服务时，享有人格尊严、民族风俗习惯得到尊重的权利，这体现了消费者的权利是",opts:["A.自主选择权","B.隐私保护权","C.安全保障权","D.公平交易权"],ans:"B",exp:"隐私保护权是指消费者在购买、使用商品和接受服务时，享有人格尊严、民族风俗习惯得到尊重的权利，享有个人信息依法得到保护的权利。"},
    {type:"最佳选择题",q:"34. 根据医疗器械分类管理规定，下列均属于第二类医疗器械的是",opts:["A.体温计、(中医用)针灸针、无菌医用手套","B.避孕帽、血压计、核磁共振成像设备","C.手术显微镜、听诊器、医用放大镜","D.橡皮膏、血管内导管、医学影像处理软件"],ans:"A",exp:"第二类医疗器械：如血压计、体温计、心电图机、脑电图机、手术显微镜、（中医用）针灸针、助听器（非植入式）、皮肤吻合器、避孕套、避孕帽、无菌医用手套、医学影像处理软件等。B选项核磁共振成像设备为第三类医疗器械。C选项听诊器、医用放大镜为第一类医疗器械。D选项橡皮膏为第一类医疗器械，血管内导管为第三类医疗器械。"},
    {type:"最佳选择题",q:"35. 下列关于化妆品的说法错误的是",opts:["A.国家按照风险程度对化妆品、化妆品原料实行分类管理","B.普通化妆品应经省级药品监督管理部门备案管理","C.《化妆品生产许可证》由省级药品监督管理部门颁发","D.特殊化妆品经国家药品监督管理局注册管理"],ans:"B",exp:"国产普通化妆品应当在上市销售前向备案人所在地省级药品监督管理部门备案。进口普通化妆品应当在进口前向国家药品监督管理局备案。"},
    {type:"最佳选择题",q:"36. 下列关于保健食品的界定与管理说法错误的是",opts:["A.具有特定保健功能或以补充矿物质、维生素为目的","B.适宜于全体人群，具有调节机体功能作用","C.保健食品不得与普通食品或者药品混放销售","D.国务院食品安全监督管理部门会同国务院卫生行政部门、国家中医药管理部门制定保健食品原料目录"],ans:"B",exp:"保健食品适宜于特定人群食用，具有调节机体功能，不以治疗疾病为目的。"},
    {type:"最佳选择题",q:"37. 根据《疫苗管理法》第八十二条规定疫苗上市许可持有人违反药品相关质量管理规范的，依法可处以处罚的情形不包括",opts:["A.责令改正，给予警告","B.拒不改正的，处20万元以上50万元以下的罚款","C.情节严重的，处50万元以上300万元以下的罚款","D.法定代表人、主要负责人处所获收入1倍以上10倍以下的罚款"],ans:"D",exp:"疫苗上市许可持有人或者其他单位违反质量管理规范的，由县级以上人民政府药品监督管理部门责令改正，给予警告；拒不改正的，处20万元以上50万元以下的罚款；情节严重的，处50万元以上300万元以下的罚款，责令停产停业整顿，直至吊销药品相关批准证明文件、药品生产许可证等，对法定代表人、主要负责人、直接负责的主管人员和关键岗位人员以及其他责任人员，没收违法行为发生期间自本单位所获收入，并处所获收入50%以上5倍以下的罚款，10年内直至终身禁止从事药品生产经营活动。"},
    {type:"最佳选择题",q:"38. 根据《药品管理法》相关规定，下列药品中不属于劣药的是",opts:["A.药品成分的含量不符合国家药品标准","B.被污染的药品","C.未注明产品批号的药品","D.药品所标明的适应症超出规定范围"],ans:"D",exp:"有下列情形之一的为劣药：①药品成分的含量不符合国家药品标准；②被污染的药品；③未标明或者更改有效期的药品；④未注明或者更改产品批号的药品；⑤超过有效期的药品；⑥擅自添加防腐剂、辅料的药品；⑦其他不符合药品标准的药品。药品所标明的适应症超出规定范围属于假药的界定情形。"},
    {type:"最佳选择题",q:"39. 下列情形中属于不予行政处罚的是",opts:["A.违法行为轻微并及时改正，没有造成危害后果的","B.主动消除或者减轻药品、医疗器械和化妆品违法行为危害后果的","C.主动供述药品监督管理部门尚未掌握的违法行为的","D.销售假药、劣药以孕产妇、儿童、危重病人为主要使用对象"],ans:"A",exp:"违法行为轻微并及时改正，没有造成危害后果的，不予行政处罚。"},
    {type:"最佳选择题",q:"40. 申药品经营企业因临时经营需要变造药品经营许可证，修改证书批准时间，期间共计营业收入3.8万元，后经药监部门检查发现，可处罚款金额为",opts:["A.罚款5000元","B.罚款3.8万元","C.罚款38万元","D.罚款380万元"],ans:"C",exp:"根据《药品管理法》第一百二十二条规定，伪造、变造、出租、出借、非法买卖许可证或者药品批准证明文件的，没收违法所得，并处违法所得1倍以上5倍以下的罚款，违法所得不足十万元的，按十万元计算。3.8万元不足10万，则罚款金额在10万-50万之间。符合区间值为C选项。"},

    // ===== 二、配伍选择题（41-85） =====
    {type:"配伍选择题",subs:[
      {q:"41. 首次在中国销售的药品应进行的检验是",opts:["A.监督抽检","B.评价抽检","C.指定检验","D.复验"],ans:"C",exp:"《药品管理法》规定下列药品在销售前或者进口时，必须经过指定药品检验机构进行检验，检验不合格的，不得销售或者进口：首次在中国销售的药品；国家药品监督管理部门规定的生物制品；国务院规定的其他药品。"},
      {q:"42. 当事人对药品检验结果有异议的，可以向原药品检验机构或者上一级药品监督管理部门设置或者指定的药品检验机构申请的检验是",opts:["A.监督抽检","B.评价抽检","C.指定检验","D.复验"],ans:"D",exp:"当事人对药品检验结果有异议的，可以自收到药品检验结果之日起7日内向原药品检验机构或者上一级药品监督管理部门设置或者指定的药品检验机构申请复验。"},
      {q:"43. 药品监督管理部门根据监管需要对质量可疑药品进行的检验是",opts:["A.监督抽检","B.评价抽检","C.指定检验","D.复验"],ans:"A",exp:"监督抽检是指药品监督管理部门根据监管需要对质量可疑药品进行的抽查检验。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"44. 根据《药品召回管理办法》，药品可能或者已经引起暂时或可逆的健康危害的属于",opts:["A.一级召回","B.二级召回","C.三级召回","D.四级召回"],ans:"B",exp:"二级召回指使用该药品可能或者已经引起可逆的或暂时的健康危害的。"},
      {q:"45. 根据《药品召回管理办法》，药品可能或者已经引起严重健康危害的属于",opts:["A.一级召回","B.二级召回","C.三级召回","D.四级召回"],ans:"A",exp:"一级召回指使用该药品可能或者已经引起严重健康危害的。"},
      {q:"46. 根据《药品召回管理办法》，药品一般不会引起健康危害，但由于其他原因需要收回的属于",opts:["A.一级召回","B.二级召回","C.三级召回","D.四级召回"],ans:"C",exp:"三级召回指使用该药品一般不引起健康危害，但因其他原因需收回的。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"47. 根据《药品管理法》有关规定，经( )批准，药品上市许可持有人可以转让药品上市许可",opts:["A.药品评价中心","B.省级药品监督管理部门","C.国家药品监督管理局","D.药品审评中心"],ans:"C",exp:"经国家药品监督管理局批准，药品上市许可持有人可以转让药品上市许可。"},
      {q:"48. 《关于化学原料药再注册管理等有关事项的公告》明确对化学原料药实施再注册管理，境内生产化学原料药由( )开展再注册",opts:["A.药品评价中心","B.省级药品监督管理部门","C.国家药品监督管理局","D.药品审评中心"],ans:"B",exp:"境内生产化学原料药由属地省级药品监管部门开展再注册。"},
      {q:"49. 《药品注册管理办法》规定，境外生产药品再注册申请由持有人向( )提出",opts:["A.药品评价中心","B.省级药品监督管理部门","C.国家药品监督管理局","D.药品审评中心"],ans:"D",exp:"境外生产药品再注册申请由持有人向药品审评中心提出。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"50. 根据GAP要求，生产质量管理负责人需要具有中药学、药学或者农学等相关专业大专及以上学历，且需要有一定的实践经验，对实践经验的最低要求是",opts:["A.1年以上","B.3年以上","C.5年以上","D.7年以上"],ans:"B",exp:"生产质量管理负责人应当有中药学、药学或者农学等相关专业大专及以上学历并有中药材生产、质量管理3年以上实践经验。"},
      {q:"51. 中药饮片批发企业质量负责人应当具备的质量管理工作经验最低要求是",opts:["A.1年以上","B.3年以上","C.5年以上","D.7年以上"],ans:"B",exp:"药品批发企业质量负责人应当具备3年以上药品经营质量管理工作经历。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"52. 对特定疾病有特殊疗效的中药品种，且要求首次保护期限为10年，可申请",opts:["A.四级保护中药品种","B.三级保护中药品种","C.二级保护中药品种","D.一级保护中药品种"],ans:"D",exp:"对特定疾病有特殊疗效的中药品种，且要求首次保护期限为10年，可申请一级保护中药品种。"},
      {q:"53. 对特定疾病有显著疗效的中药品种可申请",opts:["A.四级保护中药品种","B.三级保护中药品种","C.二级保护中药品种","D.一级保护中药品种"],ans:"C",exp:"对特定疾病有显著疗效的中药品种可申请二级保护中药品种。"}
    ]},

    // ===== 三、综合分析选择题（86-95） =====
    {type:"最佳选择题",q:"86. 甲企业因设备升级改造，欲将其旗下一款中成药委托给乙企业进行生产，关于此行为以下说法正确的是",opts:["A.甲企业应当建立药品上市放行规程，对药品生产企业出厂放行的药品进行审核，经质量受权人签字后方可放行","B.甲企业应与乙企业签订委托生产销售协议和质量协议，向药品上市许可持有人所在地省级药品监督管理部门申请办理《药品生产许可证》","C.乙企业接受甲企业委托后，对该药品全生命周期承担管理责任","D.甲企业与乙企业签订委托生产协议，协议有效期为5年，期满前6个月需重新签订"],ans:"A",exp:"药品上市许可持有人应当建立药品上市放行规程，对药品生产企业出厂放行的药品进行审核，经质量受权人签字后方可放行。药品上市许可持有人不得委托药品生产企业进行药品销售活动，因此签订的是委托生产协议而非委托生产销售协议。药品上市许可持有人对药品全生命周期承担管理责任，作为受托方的药品生产企业只需承担药品生产环节责任。法规中对于委托生产协议并未规定有效期。"},
    {type:"最佳选择题",q:"87. 甲企业将旗下3款药品委托给丙企业进行销售，下列关于销售行为说法错误的是",opts:["A.甲企业可以自行销售其取得药品注册证书的药品","B.甲企业应与丙企业签订委托协议，并严格履行协议约定的义务","C.甲企业从事药品销售活动时，应当取得药品经营许可证","D.丙企业接收甲企业的药品委托销售后，不得将药品再次委托第三方销售"],ans:"C",exp:"药品上市许可持有人从事药品零售活动的，应当取得药品经营许可证；从事批发活动的，无需取得药品经营许可证。“销售”包括批发和零售两种行为，不是都需要取得药品经营许可证。"},
    {type:"最佳选择题",q:"88. 药品监督管理部门经调查发现零售药店长期存在无处方卖处方药，执业药师不在岗未挂牌明示等的情况，针对此次调查结果有关部门可以做出的处罚是",opts:["A.处2000元以上2万元以下罚款","B.处5万元以上20万元以下罚款","C.处20万元以上50万元以下罚款","D.处50万元以上200万元以下罚款"],ans:"B",exp:"药品零售企业在药品经营活动中有下列行为之一的，由药品监督管理部门责令限期改正；逾期不改正的，处5000元以上5万元以下罚款；造成危害后果的，处5万元以上20万元以下罚款：①未按规定凭处方销售处方药的；②以买药品赠药品或者买商品赠药品等方式向公众直接或者变相赠送处方药、甲类非处方药的；③执业药师不在岗未挂牌告知或者处方未经执业药师审核即销售处方药的。"},
    {type:"最佳选择题",q:"89. 药店老板在收到药品监督管理部门的处罚通知后，对其作出的行政处罚决定表示不服，决定申请行政复议，其提出行政复议申请的时间是",opts:["A.知道该行政行为之日起60日内","B.知道该行政行为之日起6个月内","C.知道该行政行为之日起30日内","D.知道该行政行为之日起15日内"],ans:"A",exp:"公民、法人或者其他组织认为行政行为侵犯其合法权益，可以自知道或者应当知道该行政行为之日起60日内提出行政复议申请。"},
    {type:"最佳选择题",q:"90. 经行政复议后，药店老板对决定依然不服，则向人民法院起诉的时间为",opts:["A.收到复议决定书之日起5日内","B.收到复议决定书之日起7日内","C.收到复议决定书之日起15日内","D.收到复议决定书之日起60日内"],ans:"C",exp:"对经行政复议案件的决定不服的，可在收到复议决定书之日起15日内向人民法院起诉。"},
    {type:"最佳选择题",q:"91. 针对甲作为批发企业的要求及销售行为，以下说法错误的是",opts:["A.甲企业经过销售人员的对接和沟通，双方在签订销售合同的情况下将药品卖给药店","B.甲企业制定年度培训计划并开展培训，对从事特殊管理药品和冷藏药品的工作人员进行相关专业知识培训","C.甲企业的质量负责人应该是执业药师","D.甲企业在销售药品应开具发票，做到票、账、货、款一致"],ans:"A",exp:"禁止不经药品零售连锁总部，直接向药品零售连锁企业门店销售药品。乙企业是丙药店的总部，丙药店的药品应从总部获得。"},
    {type:"最佳选择题",q:"92. 甲企业从上游厂家购进了一批药品，现已到货准备收货验收，下列关于收货验收行为说法错误的是",opts:["A.需冷藏储存药品，甲企业收货时发现温度不符合直接拒收","B.冷藏、冷冻药品在冷库内待验","C.针对同一批号的药品，甲企业采用抽样验收的方式","D.待验药品应标示红色色标，暂不得出库销售"],ans:"D",exp:"待验区、待确定的药品标示黄色。"},
    {type:"最佳选择题",q:"93. 为扩大销售范围和销售路径，甲企业欲独立开发药品网站，自建平台进行网络销售活动，下列药品中不得网络销售的是",opts:["A.蛋白同化制剂","B.体外诊断试剂（药品）","C.胰岛素","D.第二类精神药品"],ans:"D",exp:"中药配方颗粒、医疗机构制剂、麻醉药品、精神药品、医疗用毒性药品、放射性药品、药品类易制毒化学品、血液制品、疫苗、依托咪酯注射剂禁止网络销售。"},
    {type:"最佳选择题",q:"94. 针对资料中销售未注明产品批号的药品，该药店的罚款金额可能是",opts:["A.3万元","B.10万元","C.50万元","D.300万元"],ans:"C",exp:"未注明产品批号的药品属于劣药。生产、销售劣药的，处违法生产、销售的药品货值金额10倍以上20倍以下的罚款；违法零售的药品货值金额不足1万元的，按1万元计算。该药店涉案金额为3万元，则罚款区间为30万-60万。符合要求的是C选项。"},
    {type:"最佳选择题",q:"95. 经药品监督管理部门检查确定药店涉及儿童感冒药违法销售行为，依法应当从重处罚，下列情形中不属于应当从重处罚的是",opts:["A.销售假药以孕产妇为主要使用对象的","B.生产假药的金额20万元以上","C.生产假药经处理后再犯","D.销售的注射剂药品属于劣药的"],ans:"B",exp:"①生产、销售、使用假药、劣药、不符合强制性标准或者不符合经注册的产品技术要求的第三类医疗器械，以孕产妇、儿童、危重病人为主要使用对象的；②生产、销售、使用的生物制品、注射剂药品属于假药、劣药的；③生产、销售、使用假药、劣药，经处理后再犯均属于应当从重行政处罚情形。生产、销售、提供假药的金额20万元以上不满50万元的属于刑事责任中的其他严重情节。"},

    // ===== 四、多项选择题（96-100） =====
    {type:"多项选择题",q:"96. 以下不属于必须凭处方销售的药品的有",opts:["A.复方曲马多片","B.含麻黄碱类复方制剂（单位剂量麻黄碱含量30mg）","C.复方地芬诺酯片","D.复方氨酚烷胺胶囊"],ans:"BD",exp:"①复方曲马多片列入第二类精神药品管理，凭处方药销售；②单位剂量麻黄碱类药物含量大于30mg（不含30mg）按处方药管理；③复方地芬诺酯片为第二类精神药品，按处方药管理；④复方氨酚烷胺胶囊为甲类非处方药。"},
    {type:"多项选择题",q:"97. 关于疫苗的上市后管理，说法正确的有",opts:["A.疾病预防控制机构配送非免疫规划疫苗不得收取储存、运输费用","B.疫苗储存、运输的全过程应始终处于规定的温度环境，不得脱离冷链，且定时监测、记录温度","C.非免疫规划疫苗由国务院卫生健康主管部门会同国务院财政部门等组织集中招标或者统一谈判，形成并公布中标价格或者成交价格，各省、自治区、直辖市实行统一采购","D.疫苗上市许可持有人应当按照规定，建立真实、准确、完整的销售记录，并保存至疫苗有效期满后不少于5年备查"],ans:"BD",exp:"①疫苗上市许可持有人、疾病预防控制机构可以自行配送疫苗，也可以委托符合条件的疫苗配送单位配送疫苗。疾病预防控制机构配送非免疫规划疫苗可以收取储存、运输费用。②疫苗储存、运输的全过程应始终处于规定的温度环境，不得脱离冷链，且定时监测、记录温度。③国家免疫规划疫苗由国务院卫生健康主管部门会同国务院财政部门等组织集中招标或者统一谈判，形成并公布中标价格或者成交价格，各省、自治区、直辖市实行统一采购。国家免疫规划疫苗以外的其他免疫规划疫苗、非免疫规划疫苗由各省、自治区、直辖市通过省（区、市）公共资源交易平台组织采购。④疫苗上市许可持有人应当按照规定，建立真实、准确、完整的销售记录，并保存至疫苗有效期满后不少于5年备查。"},
    {type:"多项选择题",q:"98. 根据《抗菌药物临床应用管理办法》，关于抗菌药物的更换或清退说法错误的有",opts:["A.更换抗菌药物经过药事管理与药物治疗学委员会讨论通过后执行","B.临床科室、药学部门、抗菌药物管理工作组可以提出清退或者更换意见","C.清退抗菌药物经药事管理与药物治疗学委员会二分之一以上成员同意后执行","D.清退的抗菌药物品种原则上不得重新进入本机构抗菌药物供应目录"],ans:"CD",exp:"①更换抗菌药物的程序：经过药事管理与药物治疗学委员会讨论通过后执行。②临床科室、药学部门、抗菌药物管理工作组可以提出清退或者更换意见。③清退抗菌药物经过抗菌药物管理工作组二分之一以上成员同意后执行，并报药事管理与药物治疗学委员会备案。④更换或清退的抗菌药物品种（品规）原则上12个月内不得重新进入本机构抗菌药物供应目录。"},
    {type:"多项选择题",q:"99. 下列属于药品不良反应报告主体的有",opts:["A.药品上市许可持有人","B.药品生产企业","C.药品经营企业","D.医疗机构"],ans:"ABC",exp:"药品不良反应报告主体包括药品上市许可持有人、药品生产企业、药品经营企业和医疗机构。"},
    {type:"多项选择题",q:"100. 下列关于医疗器械经营环节和使用环节的管理要求中，说法不正确的有",opts:["A.植入类医疗器械进货查验记录和销售记录保存期限不得少于5年","B.医疗机构配置大型医用设备的，应经省级药品监督管理部门批准取得大型医用设备配置许可证","C.经营医疗器械应建立并执行进货查验记录制度","D.从事第一、二类医疗器械批发业务以及第三类医疗器械零售业务的经营企业应当建立销售记录制度"],ans:"ABD",exp:"①植入类医疗器械进货查验记录和销售记录应永久保存。②医疗机构配置大型医用设备的，应经省级以上卫生健康主管部门批准取得大型医用设备配置许可证。③经营医疗器械应建立并执行进货查验记录制度。④从事第二、三类医疗器械批发业务以及第三类医疗器械零售业务的经营企业应当建立销售记录制度。"}
  ]
},
  {
  name: "押题密卷（二）",
  questions: [
    // ===== 一、最佳选择题（1-40） =====
    {type:"最佳选择题",q:"1. 根据药品的界定和特点，药品的质量特性主要表现为",opts:["A.有效性、安全性、时效性、专属性","B.有效性、安全性、稳定性、均一性","C.有效性、安全性、时效性、稳定性","D.有效性、安全性、稳定性、专属性"],ans:"B",exp:"药品的质量特性主要表现为：有效性、安全性、稳定性、均一性。"},
    {type:"最佳选择题",q:"2. 下列说法中符合处方书写规则的是",opts:["A.处方书写应当字迹清楚，不得修改","B.中药饮片、中成药要单独开具处方","C.处方医师的专用签章应与院内药学部门留样备查的式样一致","D.药品名称应当使用规范的中文、英文、拉丁文或者缩写体书写"],ans:"C",exp:"处方应当字迹清楚，不得涂改，如需修改，应当在修改处签名并注明修改日期。中药饮片、中药注射剂要单独开具处方。药品名称应当使用规范的中文名称书写，没有中文名称的可以使用规范的英文名称书写。"},
    {type:"最佳选择题",q:"3. 药品经营许可证变更分为许可事项变更和登记事项变更。下列不属于许可事项变更的是",opts:["A.委托储存","B.异地设库","C.质量负责人","D.经营方式"],ans:"C",exp:"登记事项变更是指企业名称、统一社会信用代码、法定代表人、主要负责人、质量负责人等事项的变更。"},
    {type:"最佳选择题",q:"4. 中药是指在我国中医药理论指导下使用的药用物质及其制剂。不属于中药优势的是",opts:["A.资源优势","B.疗效优势","C.预防保健优势","D.质量优势"],ans:"D",exp:"中药的资源优势、疗效优势、预防保健优势及市场前景越来越被国际社会认可，对促进世界医药科学的发展和生命健康的维护发挥了重要作用。"},
    {type:"最佳选择题",q:"5. 下列关于处方权的说法，错误的是",opts:["A.执业医师应当经过麻醉药品使用知识和规范化管理的培训，并考核合格后取得麻醉药品的处方权","B.医师不得为自己开具第二类精神药品处方","C.经注册的执业助理医师在医疗机构开具的处方，应当经所在执业地点执业医师签名或加盖专用签章后方有效","D.经注册的执业医师在执业地点签名留样或专用签章备案后取得相应的处方权"],ans:"B",exp:"医师不得为自己开具麻醉药品和第一类精神药品处方，其中不包括第二类精神药品。"},
    {type:"最佳选择题",q:"6. 根据《国家药品监督管理局关于药品信息化追溯体系建设的指导意见》的要求，承担药品追溯系统建设主要责任的是",opts:["A.药品上市许可持有人和药品生产企业","B.药品监督管理部门和药品上市许可持有人","C.药品经营企业和药品使用单位","D.药品监督管理部门和卫生健康主管部门"],ans:"A",exp:"药品上市许可持有人和药品生产企业承担药品追溯系统建设的主要责任。"},
    {type:"最佳选择题",q:"7. 关于药品注册标准说法正确的是",opts:["A.药品注册标准是经药品注册申请人提出，由国家药品监督管理局药品审评中心核定","B.药品注册标准应当符合《中国药典》通用技术要求，不得高于《中国药典》的规定","C.药品注册标准和《中国药典》为国家药品标准","D.药品注册标准是指国内已有生产、疗效较好，需要统一标准，但尚未载入《中国药典》的品种质量标准"],ans:"A",exp:"药品注册标准是经药品注册申请人提出，由国务院药品监督管理部门药品审评中心核定，国务院药品监督管理部门在批准药品上市许可、补充申请时发给药品上市许可持有人的经核准的质量标准。药品注册标准应当符合《中国药典》通用技术要求，不得低于《中国药典》的规定。国务院药品监督管理部门颁布的《中国药典》和药品标准为国家药品标准（注册标准不属于）。"},
    {type:"最佳选择题",q:"8. 根据《药品零售企业执业药师药学服务指南》，药品零售企业应当按照药品GSP的要求，以促进人体健康为中心，开展药学服务活动，实现服务的规范化、科学化、人性化，以满足个人消费者合理用药需求。下列药品零售企业药学服务要求的说法，错误的是",opts:["A.药品零售企业不得采用兼职人员收集、传递药学服务信息","B.销售含兴奋剂类药品时，药学服务人员应当告知个人消费者“运动员慎用”","C.销售第二类精神药品时，药学服务人员应当确认个人消费者为成年人，不确定时可查验个人消费者身份证信息","D.销售毒性中药品种时，药学服务人员应当做到计量准确，不得超出规定的剂量"],ans:"A",exp:"药品零售企业应当安排专职或兼职人员收集、传递药学服务信息，定期对药学服务开展情况进行分析、交流和评价。"},
    {type:"最佳选择题",q:"9. 《中药材生产质量管理规范》（Good Agricultural Practice，GAP）是中药材规范化生产和质量管理的基本要求。下列不符合规定的是",opts:["A.中药材生产基地一般应当选址于道地产区，在非道地产区选址，应当提供充分文献或者科学数据证明其适宜性","B.种植中药材优先选用高效、低毒生物农药，尽量减少或避免使用除草剂、杀虫剂、杀菌剂等化学农药；并尽可能使用最低剂量、降低使用次数","C.鲜用药材的保存禁止使用保鲜剂和防腐剂","D.中药材贮存过程禁止使用硫黄熏蒸"],ans:"C",exp:"鲜用药材保存方法：如冷藏、砂藏、罐贮、生物保鲜等，并明确保存条件和保存时限；原则上不使用保鲜剂和防腐剂，如必须使用应当符合国家相关规定。"},
    {type:"最佳选择题",q:"10. 执业药师应当按照国家专业技术人员继续教育的有关规定接受继续教育，更新专业知识，提高业务水平。下列说法中不符合执业药师继续教育要求的是",opts:["A.执业药师应当自取得执业药师职业资格证书的次年起开始参加继续教育","B.执业药师每年参加的继续教育不少于90学时","C.执业药师参加省级以上药品监管部门、人力资源社会保障部门以及执业药师继续教育机构组织的脱产培训，每天最多按8学时计算","D.执业药师因伤、病、孕等特殊原因无法在当年度完成继续教育学时的，由执业药师用人单位出具证明，可视同完成当年继续教育学时"],ans:"D",exp:"执业药师因伤、病、孕等特殊原因无法在当年度完成继续教育学时的，由执业药师用人单位出具证明，可于下一年度内补学完成上一年度规定的学时。"},
    {type:"最佳选择题",q:"11. 下列关于药品收货验收的做法，错误的是",opts:["A.收货人员核实运输方式是否符合要求，对到货药品逐批进行收货、验收，做到票、账、货一致","B.企业在验收药品时应逐批抽样验收，抽取的样品应具有代表性","C.冷藏冷冻药品到货时，不符合温度要求的，入库前须经质量管理部门确认","D.中药材、中药饮片的验收记录应当注明产地"],ans:"C",exp:"冷藏冷冻药品到货时，不符合温度要求的应拒收。"},
    {type:"最佳选择题",q:"12. 2025年7月28日，某省药品监督管理部门监督检查中发现，该省甲生产企业生产的A药品成分不符合规定，货值金额15万元。根据《药品管理法》，药品监督管理部门给予其的行政处罚不包括",opts:["A.吊销A药品批准证明文件","B.责令停产停业整顿","C.没收违法生产、销售的药品和违法所得","D.处以150万元罚款"],ans:"D",exp:"生产、销售假药的，没收违法生产、销售的药品和违法所得，责令停产停业整顿，吊销药品批准证明文件，并处违法生产、销售的药品货值金额15倍以上30倍以下的罚款；货值金额不足10万元的，按10万元计算；情节严重的，吊销药品生产许可证、药品经营许可证或者医疗机构制剂许可证，10年内不受理其相应申请；药品上市许可持有人为境外企业的，10年内禁止其药品进口。题目中货值金额为15万元，15万×15倍=225万，15万×30倍=450万。故罚款金额应在225万～450万之间。"},
    {type:"最佳选择题",q:"13. 医疗机构配制的制剂，应当是本单位临床需要而市场上没有供应的品种，医疗机构可以自行配制的品种是",opts:["A.中药注射剂","B.中药、化学药品组成的复方制剂","C.放射性药品","D.精神药品"],ans:"D",exp:"不得作为医疗机构制剂申报的情形：除变态反应原外的生物制品；含有未经国家药品监督管理局批准的活性成分的品种；市场上已有供应的品种；医疗用毒性药品；中药、化学药组成的复方制剂；放射性药品；中药注射剂。根据《麻醉药品和精神药品管理条例》第四十三条规定，对临床需要而市场无供应的麻醉药品和精神药品，持有医疗机构制剂许可证和印鉴卡的医疗机构需要配制制剂的，应当经所在地省级药品监督管理部门批准。"},
    {type:"最佳选择题",q:"14. 下列关于中药配方颗粒的规定，不符合要求的是",opts:["A.上市前由生产企业报所在地省级药品监督管理部门备案","B.生产企业应当取得《药品生产许可证》，并同时具有中药饮片和颗粒剂生产范围","C.无国家药品标准的中药配方颗粒不得跨省使用","D.接受委托配送中药配方颗粒的企业不得再次委托配送"],ans:"C",exp:"无国家药品标准的中药配方颗粒跨省使用的，应当符合使用地省级药品监督管理部门制定的标准。"},
    {type:"最佳选择题",q:"15. 对药品进行安全风险管理是保障药品安全的重要手段，下列说法中错误的是",opts:["A.药品本身就具有不可避免的安全风险","B.药品安全风险可分为人为风险和自然风险","C.人为风险是药品内在属性，属于药品设计风险","D.自然风险来源于已知或者未知的药品不良反应"],ans:"C",exp:"药品安全的自然风险，又称“必然风险”“固有风险”，是药品的内在属性，属于药品设计风险。药品安全的自然风险是客观存在的，来源于已知或者未知的药品不良反应。药品安全的人为风险，属于“偶然风险”的范畴，是指人为有意或无意违反法律法规而造成的药品安全风险，存在于药品的研制、生产、经营、使用各个环节。人为风险属于药品的制造风险和使用风险，主要来源于不合理用药、用药差错、药品质量问题、政策制度设计及管理导致的风险，是我国药品安全风险的关键因素。"},
    {type:"最佳选择题",q:"16. 开办药品经营企业，应当取得营业执照后，依管理权限向企业所在地县级以上药品监督管理部门提交申请材料。胡某开办的药品零售企业由药品监督管理部门实施告知承诺制审批，该零售企业为",opts:["A.仅经营处方药","B.仅经营非处方药","C.仅经营甲类非处方药","D.仅经营乙类非处方药"],ans:"D",exp:"仅从事乙类非处方药零售活动的实施告知承诺制审批。"},
    {type:"最佳选择题",q:"17. 负责本行政区域内药物非临床安全性评价研究机构的日常监督管理工作的部门是",opts:["A.国家药品监督管理局药品评价中心","B.省级药品监督管理部门","C.中国食品药品检定研究院","D.省级卫生健康主管部门"],ans:"B",exp:"省级药品监督管理部门负责本行政区域内药物非临床安全性评价研究机构的日常监督管理工作，组织开展监督检查，查处违法行为。"},
    {type:"最佳选择题",q:"18. 下列关于血液制品的管理说法，错误的是",opts:["A.人血白蛋白属于血液制品","B.开办血液制品经营单位，由省级药品监督管理部门审核批准","C.原料血浆经复检发现有血液途径传播的疾病的，必须通知供应血浆的单采血浆站，并及时上报所在地省级药品监督管理部门","D.擅自进出口血液制品的，没收所进出口的血液制品违法所得，并处所进出口的血液制品总值3倍以上5倍以下的罚款"],ans:"C",exp:"原料血浆经复检发现有血液途径传播的疾病的，必须通知供应血浆的单采血浆站，并及时上报所在地省级卫生健康主管部门。"},
    {type:"最佳选择题",q:"19. 某药品零售企业明知A药品已被污染，仍向患者销售该药品，药品单价为20元，患者服用药品后出现心悸，随后就医花费300元。受害人向该零售药店提出赔偿申请外，还可以要求惩罚性赔偿。增加的惩罚性赔偿金额为",opts:["A.200","B.600","C.960","D.1000"],ans:"D",exp:"对生产假劣药或者明知假劣药仍销售使用的，受害人可以要求惩罚性赔偿等。生产假药、劣药或者明知是假药、劣药仍然销售、使用的，受害人或者其近亲属除请求赔偿损失外，还可以请求支付价款十倍或者损失三倍的赔偿金；增加赔偿的金额不足一千元的，为一千元。题目中药品价款的10倍和损失的3倍均不足1000元，故增加的赔偿金额为1000元。"},
    {type:"最佳选择题",q:"20. 在药品批发企业中，下列需要具有执业药师资格的岗位是",opts:["A.企业负责人","B.质量负责人","C.质量管理工作人员","D.药品销售人员"],ans:"B",exp:"企业质量负责人需要具有大学本科以上学历、执业药师资格和3年以上药品经营质量管理工作经历，在质量管理工作中具备正确判断和保障实施的能力。"},
    {type:"最佳选择题",q:"21. 下列关于A型肉毒毒素的管理要求，不符合规定的是",opts:["A.药品生产企业应制定A型肉毒毒素制剂年度生产计划，严格按照年度生产计划和药品GMP要求进行生产","B.药品零售企业不得经营除注射用A型肉毒毒素以外的其他毒性药品","C.经指定的经营企业直接将注射用A型肉毒毒素销售至已取得《医疗机构执业许可证》的医疗机构或医疗美容机构","D.注射用A型肉毒毒素购进、销售台账，应保存至超过药品有效期2年备查"],ans:"B",exp:"药品零售企业不得经营注射用A型肉毒毒素。"},
    {type:"最佳选择题",q:"22. 根据药品监督检查管辖的要求，承担疫苗和血液制品巡查工作的是",opts:["A.中国食品药品检定研究院","B.国家药品监督管理局审评中心","C.国家药品监督管理局食品药品审核查验中心","D.国家药品监督管理局评价中心"],ans:"C",exp:"食品药品审核查验中心负责承担疫苗、血液制品巡查工作。"},
    {type:"最佳选择题",q:"23. 下列关于药品网络经营的说法，错误的是",opts:["A.在企业对企业模式中，允许药品批发企业通过自建网站将药品销售给药品生产企业","B.药品零售企业通过自建网站，向个人消费者销售药品及提供相关药学服务，并按照药品GSP要求配送至个人消费者的经营模式为B-to-C模式","C.药品网络交易第三方平台模式是通过网络系统为药品网络交易活动中的购销双方提供网络药品交易服务的经营模式，药品网络交易第三方平台提供者在特殊情况下可以直接从事药品网络销售活动","D.个人消费者通过网络下单购买药品，赴就近的药品零售企业经营场所获取药品和相关药学服务为“网订店取”的方式"],ans:"C",exp:"药品网络交易第三方平台提供者不得直接从事药品网络销售活动。"},
    {type:"最佳选择题",q:"24. 下列法律规范中属于行政法规的是",opts:["A.《湖北省药品管理条例》","B.《医疗用毒性药品管理办法》","C.《疫苗管理法》","D.《药品经营质量管理规范》"],ans:"B",exp:"行政法规的格式为《XX条例/办法》，其中涉及药品管理的“办法”为《医疗用毒性药品管理办法》和《放射性药品管理办法》。《湖北省药品管理条例》属于地方性法规，《疫苗管理法》属于法律，《药品经营质量管理规范》属于部门规章。"},
    {type:"最佳选择题",q:"25. 药品批发企业从药品批发企业购进的复方甘草片，不能销售至",opts:["A.本省的药品零售企业","B.本市的药品零售连锁企业","C.本省的医疗机构","D.本市的药品批发企业"],ans:"D",exp:"药品批发企业从药品上市许可持有人直接购进的复方甘草片、复方地芬诺酯片等含特殊药品复方制剂，可以将此类药品销售给其他批发企业、零售企业和医疗机构；如果从药品批发企业购进的，只能销售给本省（区、市）的药品零售企业和医疗机构。"},
    {type:"最佳选择题",q:"26. 关于药品上市许可持有人权利与义务说法正确的是",opts:["A.药品上市许可持有人应建立并实施季度报告制度","B.经省级药品监督管理部门批准，药品上市许可持有人可以转让药品上市许可","C.药品上市许可持有人可以委托符合条件的药品生产企业生产销售药品","D.药品上市许可持有人应建立药品上市放行规程并严格执行"],ans:"D",exp:"药品上市许可持有人应当建立药品上市放行规程，对药品生产企业出厂放行的药品进行审核，经质量受权人签字后方可放行。不符合国家药品标准的，不得放行。药品上市许可持有人应当建立并实施年度报告制度。经国家药品监督管理部门批准，药品上市许可持有人可以依法转让药品上市许可。药品上市许可持有人可以委托符合条件的药品生产企业生产药品，委托销售需委托符合条件的药品经营企业。"},
    {type:"最佳选择题",q:"27. 下列关于医疗机构药事管理的说法，错误的是",opts:["A.医疗机构药事管理主要职责是对药品采购、储存、配制、调剂、分发的管理以及药品的经济管理","B.医疗机构药事管理是指以患者为中心，以临床医学为基础，对临床用药全过程进行有效的组织实施与管理","C.加强药事管理，促进药学服务模式转变，推进药学服务从“以药品为中心”转变为“以患者为中心”，从“以保障药品供应为中心”转变为“在保障药品供应的基础上，以重点加强药学专业技术服务、参与临床用药为中心”","D.公立医院在向患者调配药品时实行“零差率”政策"],ans:"B",exp:"医疗机构药事管理是指以患者为中心，以临床药学为基础，对临床用药全过程进行有效的组织实施与管理。"},
    {type:"最佳选择题",q:"28. 医疗机构应当严格控制本医疗机构抗菌药物供应目录的品种数量。其中，碳青霉烯类抗菌药物注射剂型严格控制在",opts:["A.1个品规内","B.2个品规内","C.3个品规内","D.5个品规内"],ans:"C",exp:"碳青霉烯类抗菌药物注射剂型严格控制在3个品规内。"},
    {type:"最佳选择题",q:"29. 下列关于药品批发企业禁止类行为的说法，错误的是",opts:["A.不得以中药材及初加工产品冒充中药饮片销售，非法加工中药饮片","B.不得向药品零售企业销售第二类精神药品","C.不得销售药品不开具发票","D.不得购进销售医疗机构制剂"],ans:"B",exp:"药品批发企业不得向非连锁药品零售企业销售第二类精神药品。"},
    {type:"最佳选择题",q:"30. 药品标签可以印制",opts:["A.XX监制","B.企业形象标志","C.原装正品","D.印刷企业"],ans:"B",exp:"药品标签不得印制“XX省专销”“原装正品”“进口原料”“驰名商标”“专利药品”“XX监制”“XX总经销”“XX总代理”等字样。但是，“企业防伪标识”“企业识别码”“企业形象标志”等文字图案可以印制。以企业名称等作为标签底纹的，不得以突出显示某一名称来弱化药品通用名称。“印刷企业”“印刷批次”等与药品的使用无关的，不得在药品标签中标注。"},
    {type:"最佳选择题",q:"31. 药品GSP是为保证药品在流通全过程中始终符合质量标准，不适用于药品经营质量管理规范的环节是",opts:["A.药品运输","B.药品储存","C.药品使用","D.药品采购"],ans:"C",exp:"药品上市许可持有人、药品经营企业应当严格执行药品GSP，依法从事药品经营活动，拒绝任何虚假欺骗行为，在药品采购、储存、销售、运输等环节采取有效的质量控制措施，确保药品质量，并按照国家有关要求，建立药品追溯体系，实现药品可追溯。"},
    {type:"最佳选择题",q:"32. 下列不属于广告申请人的是",opts:["A.取得药品注册证明文件的持有人","B.取得第一类医疗器械备案证的持有人","C.授权同意的保健食品生产企业","D.使用特殊医学用途配方食品的医疗机构"],ans:"D",exp:"药品、医疗器械、保健食品和特殊医学用途配方食品注册证明文件或者备案凭证持有人及其授权同意的生产、经营企业为广告申请人，可以委托代理人办理药品、医疗器械、保健食品和特殊医学用途配方食品广告审查申请。"},
    {type:"最佳选择题",q:"33. 药品上市许可持有人对召回药品的处理应当有详细的记录，记录应当保存的期限为",opts:["A.至少5年","B.5年且不得少于药品有效期后1年","C.至少3年","D.3年且不得少于药品有效期后1年"],ans:"B",exp:"药品上市许可持有人对召回药品的处理应当有详细的记录，记录应当保存5年且不得少于药品有效期后1年。"},
    {type:"最佳选择题",q:"34. 下列行为中，属于行政处罚的是",opts:["A.查封场所","B.责令停产停业","C.加处罚款","D.判处有期徒刑"],ans:"B",exp:"行政处罚种类主要包括：警告、通报批评；罚款、没收违法所得、没收非法财物；暂扣许可证件、降低资质等级、吊销许可证件；限制开展生产经营活动、责令停产停业、责令关闭、限制从业；行政拘留。查封场所属于行政强制措施，加处罚款属于行政强制执行，有期徒刑属于刑事责任。"},
    {type:"最佳选择题",q:"35. 对可能危及人身、财产安全的商品和服务，应当向消费者作出真实的说明和明确的警示，并说明和标明正确使用商品或者接受服务的方法以及防止危害发生的方法，属于经营者义务中的",opts:["A.保证安全的义务","B.保证质量的义务","C.真实标记的义务","D.提供准确信息的义务"],ans:"A",exp:"经营者应当保证其提供的商品或者服务符合保障人身、财产安全的要求。对可能危及人身、财产安全的商品和服务，应当向消费者作出真实的说明和明确的警示，并说明和标明正确使用商品或者接受服务的方法以及防止危害发生的方法。"},
    {type:"最佳选择题",q:"36. 执业药师只有经过注册后，方可进行执业活动。下列关于执业药师注册管理表述有误的是",opts:["A.申请人通过全国执业药师注册管理系统向执业所在地省、自治区、直辖市药品监督管理部门申请注册","B.取得《执业药师职业资格证书》，是申请执业药师注册的条件之一","C.未按规定完成继续教育学习的，不予注册","D.执业药师注册证有效期为5年，需要延续注册的，申请人应当在证书有效期满前6个月前提出延续申请"],ans:"D",exp:"执业药师注册证有效期为5年，办理延续注册的须在有效期满30日前向所在地省级药品监督管理部门提出申请。"},
    {type:"最佳选择题",q:"37. 药品广告的内容应当以真实、合法为首要条件，以国家药品监督管理局核准的说明书为准，下列符合药品广告内容要求的是",opts:["A.不得发布未成年人药品广告","B.处方药广告应当显著标明非处方药专用标识(OTC)和“请按药品说明书或者在药师指导下购买和使用”","C.不得利用处方药的名称为各种活动冠名进行广告宣传","D.非处方药广告应当显著标明“本广告仅供医学药学专业人士阅读”"],ans:"C",exp:"在针对未成年人的网站、网页、互联网应用程序、公众号等互联网媒介上不得发布医疗、药品、保健食品、特殊医学用途配方食品、医疗器械、化妆品、酒类、美容广告，以及不利于未成年人身心健康的网络游戏广告。不是不得发布未成年人药品广告。非处方药广告应当显著标明非处方药专用标识（OTC）和“请按药品说明书或者在药师指导下购买和使用”。处方药广告应当显著标明“本广告仅供医学药学专业人士阅读”。"},
    {type:"最佳选择题",q:"38. 企业应当根据药品的质量特性对药品进行储存。下列关于药品批发企业储存与养护药品的说法，正确的是",opts:["A.储存药品相对湿度（RH）为30%～70%","B.药品按批号堆码，不同批号的药品不得混垛，垛间距≥10厘米","C.中药材和中药饮片应当分开储存","D.被退回的药品应当标示黄色色标"],ans:"D",exp:"储存药品相对湿度（RH）为35%～75%。药品按批号堆码，不同批号的药品不得混垛，垛间距≥5厘米。中药材和中药饮片分库储存。在人工作业的库房储存药品，按质量状态实行色标管理（合格药品为绿色，不合格药品为红色，待确定、退回的药品为黄色）。"},
    {type:"最佳选择题",q:"39. 药品经营企业未经批准变更许可事项或者药品经营许可证超过有效期继续开展药品经营活动的，及时改正，不影响药品质量安全的，可以给予减轻处罚的情形不包括",opts:["A.甲药品零售单体药店经营第二类精神药品","B.乙药品批发企业药品经营许可证过期但符合申请办理药品经营许可证要求","C.丙药品零售企业在小区内向患者销售乙类非处方药","D.丁药品批发企业经营范围为化学药、中成药，向戊零售企业销售黄芪中药饮片"],ans:"A",exp:"药品经营企业未经批准变更许可事项或者药品经营许可证超过有效期继续开展药品经营活动的，及时改正，不影响药品质量安全的，给予减轻处罚：①药品经营企业超出许可的经营方式、经营地址从事药品经营活动的；②超出经营范围经营的药品不属于疫苗、麻醉药品、精神药品、药品类易制毒化学品、医疗用毒性药品、血液制品、细胞治疗类生物制品的；③药品经营许可证超过有效期但符合申请办理药品经营许可证要求的；④依法可以减轻处罚的其他情形。"},
    {type:"最佳选择题",q:"40. 药品批发企业销售药品应当如实开具发票，做到票、账、货、款一致。下列不属于药品销售记录列明的项目是",opts:["A.购货日期","B.生产厂商","C.药品剂型","D.药品规格"],ans:"A",exp:"销售记录包括药品的通用名称、规格、剂型、批号、有效期、生产厂商、购货单位、销售数量、单价、金额、销售日期等内容。购货日期为药品采购记录的记录事项。"},

    // ===== 二、配伍选择题（41-85） =====
    {type:"配伍选择题",subs:[
      {q:"41. 不得纳入《基本医疗保险药品目录》的是",opts:["A.中药饮片","B.避孕药品","C.儿童果味维C含片","D.医疗机构制剂"],ans:"B",exp:"不得纳入《基本医疗保险药品目录》药品为避孕药品。注意：一般情况下果味制剂也不能纳入《基本医疗保险药品目录》，但特别情况下儿童用药除外。"},
      {q:"42. 可以纳入《基本医疗保险药品目录》，其甲乙分类由省级医疗保障部门确定的是",opts:["A.中药饮片","B.避孕药品","C.儿童果味维C含片","D.医疗机构制剂"],ans:"A",exp:"中药饮片在纳入《基本医疗保险药品目录》后，只列出准予支付和不得纳入基金支付的饮片范围，甲乙分类由省级医疗保障部门确定。"},
      {q:"43. 可以纳入《基本医疗保险药品目录》，并且全部按照乙类管理的是",opts:["A.中药饮片","B.避孕药品","C.儿童果味维C含片","D.医疗机构制剂"],ans:"D",exp:"省级医疗保障部门按国家规定纳入《药品目录》的民族药、医疗机构制剂纳入“乙类药品”管理。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"44. 生产时应向省级药品监督管理部门申请许可的，具有中度风险的医疗器械是",opts:["A.输血器","B.反光镜","C.医用放大镜","D.皮肤吻合器"],ans:"D",exp:"从事第二类、第三类医疗器械生产活动，应当经所在地省、自治区、直辖市药品监督管理部门批准，依法取得医疗器械生产许可证。具有中度风险的医疗器械属于第二类。皮肤吻合器为第二类医疗器械。"},
      {q:"45. 经营时应向市级药品监督管理部门申请备案的医疗器械是",opts:["A.输血器","B.反光镜","C.医用放大镜","D.皮肤吻合器"],ans:"D",exp:"经营第三类医疗器械实行许可管理，经营第二类医疗器械实行备案管理，经营第一类医疗器械不需要许可和备案。"},
      {q:"46. 上市时应向国家药品监督管理部门申请注册的境内生产的医疗器械是",opts:["A.输血器","B.反光镜","C.医用放大镜","D.皮肤吻合器"],ans:"A",exp:"境内第三类医疗器械由国务院药品监督管理部门审查，批准后发给医疗器械注册证。输血器为第三类医疗器械。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"47. 出口准许证有效期不超过",opts:["A.3个月","B.5个月","C.1年","D.5年"],ans:"A",exp:"出口准许证有效期不超过3个月（不跨自然年）。"},
      {q:"48. 进口准许证有效期为",opts:["A.3个月","B.5个月","C.1年","D.5年"],ans:"C",exp:"进口准许证有效期为1年（可以跨自然年使用）。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"49. 向国外转让处方组成、工艺制法时，应当按照国家有关保密的规定办理的是",opts:["A.中药一级保护品种","B.中药二级保护品种","C.中药三级保护品种","D.中药四级保护品种"],ans:"A",exp:"向国外转让中药一级保护品种的处方组成、工艺制法，应当按照国家有关保密的规定办理。"},
      {q:"50. 从天然药物中提取的有效物质及特殊制剂可以申请",opts:["A.中药一级保护品种","B.中药二级保护品种","C.中药三级保护品种","D.中药四级保护品种"],ans:"B",exp:"从天然药物中提取的有效物质及特殊制剂可以申请中药二级保护品种。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"51. 退回的药品包装件破损或包装封签被拆启，药品零售企业质量管理人员认定不符合要求的",opts:["A.可继续销售","B.允许返工处理","C.不得继续销售","D.不允许返工处理"],ans:"C",exp:"退回的药品包装件破损或包装封签被拆启，药品零售企业质量管理人员应当认定不符合要求，不得继续销售。"},
      {q:"52. 退回的药品包装件完好且包装封签未拆启，经药品零售企业质量管理人员确认符合要求的",opts:["A.可继续销售","B.允许返工处理","C.不得继续销售","D.不允许返工处理"],ans:"A",exp:"退回的药品包装件完好且包装封签未拆启，经药品零售企业质量管理人员确认符合要求的，可继续销售。"},
      {q:"53. 退回的冷藏、冷冻药品配送温度记录出现缺失的",opts:["A.可继续销售","B.允许返工处理","C.不得继续销售","D.不允许返工处理"],ans:"C",exp:"退回的药品存在质量问题（包括但不限于冷藏、冷冻药品配送温度记录超出规定的温度或温度记录出现缺失等），不得继续销售。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"54. 安徽省某药品上市许可持有人生产的化学药品的批准文号格式为",opts:["A.国药准字H+四位年号+四位顺序号","B.国药准字HC+四位年号+四位顺序号","C.国药准字Z+四位年号+四位顺序号","D.国药准字ZC+四位年号+四位顺序号"],ans:"A",exp:"安徽省为境内，境内生产的药品批准文号格式为：国药准字H(Z、S)+四位年号+四位顺序号；其中H代表化学药，Z代表中药，S代表生物制品。所以安徽省某药品上市许可持有人生产的化学药品的批准文号格式为：国药准字H+四位年号+四位顺序号。"},
      {q:"55. 香港地区某药品上市许可持有人生产的中成药的批准文号格式为",opts:["A.国药准字H+四位年号+四位顺序号","B.国药准字HC+四位年号+四位顺序号","C.国药准字Z+四位年号+四位顺序号","D.国药准字ZC+四位年号+四位顺序号"],ans:"D",exp:"港澳台地区生产的药品批准文号格式为：国药准字H(Z、S)C+四位年号+四位顺序号。所以香港地区某药品上市许可持有人生产的中成药的批准文号格式为：国药准字ZC+四位年号+四位顺序号。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"56. 首次购进药品证明文件的复印件保存",opts:["A.超过药品有效期1年，但不得少于3年","B.超过药品有效期1年，但不得少于5年","C.不得少于3年","D.不得少于5年"],ans:"D",exp:"医疗机构应妥善保存首次购进药品加盖供货单位原印章的前述证明文件的复印件，保存期不得少于5年。"},
      {q:"57. 验收记录必须按规定保存",opts:["A.超过药品有效期1年，但不得少于3年","B.超过药品有效期1年，但不得少于5年","C.不得少于3年","D.不得少于5年"],ans:"A",exp:"购进药品应当逐批验收，并建立真实、完整的药品验收记录，验收记录必须按规定保存至超过药品有效期1年，但不得少于3年。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"58. 负责提出医疗服务和药品价格政策的建议的部门是",opts:["A.市场监督管理部门","B.药品监督管理部门","C.卫生健康主管部门","D.医疗保障主管部门"],ans:"C",exp:"卫生健康主管部门负责提出医疗服务和药品价格政策的建议。"},

    ]},
    {type:"配伍选择题",subs:[
      {q:"78. 经营者在生产经营活动中不当利用不同类别的商业标识制造市场混淆，使消费者误认为是他人商品或者与他人存在特定联系。该经营者的行为属于",opts:["A.混淆行为","B.网络不正当竞争行为","C.虚假宣传行为","D.不正当有奖销售"],ans:"A",exp:"混淆行为是指经营者在生产经营活动中采取不实手段对自己的商品、服务做虚假表示、说明或者承诺，或者不当利用不同类别的商业标识制造市场混淆，使误认为是他人商品或者与他人存在特定联系。"},

    {type:"配伍选择题",subs:[

      {q:"81. 承担全国执业药师管理信息系统的建设、管理和维护工作，收集报告相关信息的是",opts:["A.国家药品监督管理局食品药品审核查验中心","B.国家药品监督管理局执业药师资格认证中心","C.国家药品监督管理局高级研修学院","D.省级药品监督管理局"],ans:"B",exp:"执业药师资格认证中心承担全国执业药师管理信息系统的建设、管理和维护工作，收集报告相关信息。"},

    ]},
    {type:"配伍选择题",subs:[
      {q:"83. 只属于行政处罚不属于行政处分的是",opts:["A.警告","B.吊销许可证件","C.赔偿损失","D.拘役"],ans:"B",exp:"行政处罚种类有：①警告、通报批评；②罚款、没收违法所得、没收非法财物；③暂扣许可证件、降低资质等级、吊销许可证件；④限制开展生产经营活动、责令停产停业、责令关闭、限制从业；⑤行政拘留。"},
      {q:"84. 既属于行政处罚又属于行政处分的是",opts:["A.警告","B.吊销许可证件","C.赔偿损失","D.拘役"],ans:"A",exp:"行政处分种类：警告、记过、记大过、降级、撤职、开除六种。行政处罚中也有警告。"},
      {q:"85. 属于刑事处罚主刑的是",opts:["A.警告","B.吊销许可证件","C.赔偿损失","D.拘役"],ans:"D",exp:"刑事责任包括主刑和附加刑两种。主刑，是对犯罪分子适用的主要刑罚。它只能独立使用，不能相互附加适用。主刑分为管制、拘役、有期徒刑、无期徒刑和死刑。附加刑分为罚金、没收财产。对犯罪的外国人也可以独立或附加适用驱逐出境。赔偿损失属于民事责任。"}

    {type:"最佳选择题",q:"86. 王某无需具备的资质是",opts:["A.熟悉中草药知识和栽培技术","B.具有中草药辨识能力","C.具备中医学专业中级以上专业技术职称","D.熟练掌握中医基本理论、技能和自种自采中草药的性味功用"],ans:"C",exp:"自种自采自用中草药的人员应同时具备以下条件：①熟悉中草药知识和栽培技术、具有中草药辨识能力；②熟练掌握中医基本理论、技能和自种自采中草药的性味功用、临床疗效、用法用量、配伍禁忌、毒副反应、注意事项等。"},
    {type:"最佳选择题",q:"87. 根据我国现行法规，王某的上述行为中合法的是",opts:["A.在自家后院种植洋金花中药材","B.将自采的柴胡在其所在的村卫生院给村民李某治疗感冒","C.将自种的板蓝根加工成板蓝根颗粒后用于本村患者的诊疗","D.将黄芩销售给邻镇卫生院"],ans:"B",exp:"洋金花为毒性中药品种，不得自种自采自用。自种自采自用的中药材不得加工成中药制剂，不得上市流通。"},
    {type:"最佳选择题",q:"88. 2024年3月之前，对XX药业有限公司企业性质描述最为准确的是",opts:["A.XX药业有限公司为自行生产中药饮片的药品上市许可持有人","B.XX药业有限公司为委托生产中药饮片的药品上市许可持有人","C.XX药业有限公司为自行生产中成药的药品上市许可持有人","D.XX药业有限公司为委托生产中成药的药品上市许可持有人"],ans:"C",exp:"《药品生产许可证》分类码：A代表自行生产的药品上市许可持有人、B代表委托生产的药品上市许可持有人、C代表接受委托的药品生产企业、D代表原料药生产企业；小写字母用于区分制剂属性，h代表化学药、z代表中成药、s代表生物制品、d代表按药品管理的体外诊断试剂、y代表中药饮片、q代表医用气体、t代表特殊药品、x代表其他。故2024年3月之前生产许可证分类码“Az”的含义为自行生产中成药的药品上市许可持有人。"},
    {type:"最佳选择题",q:"89. 对XX药业有限公司在2024年3月作出的企业发展规划，说法正确的是",opts:["A.XX药业有限公司扩展生产范围事项需向A省药品监督管理部门提出变更申请，A省药品监督管理部门收到申请后应在15日内作出是否准予变更的决定","B.XX药业有限公司需在更换了质量负责人后10日内，向A省药品监督管理部门申请变更登记，A省药品监督管理部门收到该申请后30日内办理变更手续","C.如果XX药业有限公司委托同省内一家药品生产企业进行生产活动得到批准，则XX药业有限公司生产许可证分类码中需增加大写字母C","D.XX药业有限公司在完成生产范围、质量负责人变更后其药品生产许可证有效期从2024年3月重新算起"],ans:"A",exp:"药品生产许可证的许可事项包括生产地址和生产范围，因此扩展生产范围属于许可事项变更。变更《药品生产许可证》许可事项的，向原发证机关提出《药品生产许可证》变更申请。未经批准，不得擅自变更许可事项。原发证机关应当自收到企业变更申请之日起15日内作出是否准予变更的决定。变更质量负责人属于登记事项变更，变更《药品生产许可证》登记事项的，应当在市场监督管理部门核准变更或者企业完成变更后30日内，向原发证机关申请《药品生产许可证》变更登记。原发证机关应当自收到企业变更申请之日起10日内办理变更手续。如果XX药业有限公司委托同省内一家药品生产企业进行生产活动得到批准，作为委托方的XX药业有限公司生产许可证分类码中需增加大写字母B。变更后的《药品生产许可证》有效期不变。"},
    {type:"最佳选择题",q:"90. 以上药品说明书中【药品名称】列出顺序正确的是",opts:["A.商品名称、通用名称、英文名称、汉语拼音","B.通用名称、英文名称、通用名称、汉语拼音","C.通用名称、商品名称、英文名称、汉语拼音","D.英文名称、商品名称、通用名称、汉语拼音"],ans:"C",exp:"【药品名称】按：通用名称、商品名称、英文名称、汉语拼音的顺序列出。"},
    {type:"最佳选择题",q:"91. 仅处方药说明书要求具有的事项不包括",opts:["A.【作用类别】","B.【孕妇及哺乳期妇女用药】","C.【儿童用药】","D.【老年用药】"],ans:"A",exp:"【作用类别】（仅化学药品非处方药说明书有此项）。【孕妇及哺乳期妇女用药】【儿童用药】【老年用药】仅处方药有此项。"},
    {type:"最佳选择题",q:"92. 材料中【XXXX】【XXXX】【XXXX】【XXXX】【XXXX】【XXXX】【XXXX】【XXXX】【XXXX】【XXXX】【XXXX】分别对应",opts:["A.警示语、禁忌、注意事项","B.不良反应、禁忌、注意事项","C.禁忌、注意事项、不良反应","D.禁忌、不良反应、警示语"],ans:"B",exp:"【不良反应】处方药应当实事求是地详细列出该药品不良反应，并按不良反应的严重程度、发生的频率或症状的系统性列出；尚不清楚有无不良反应的，可在该项下以“尚不明确”来表述。【禁忌】处方药应当列出该药品不能应用的各种情况，例如禁止应用该药品的人群、疾病等情况；尚不清楚有无禁忌的，可在该项下以“尚不明确”来表述。【注意事项】处方药应当列出使用时必须注意的问题，包括需要慎用的情况。"},
    {type:"最佳选择题",q:"93. 检查中发现，某药品零售企业在日常的促销活动中，以“买N赠1”等方式，向顾客赠送送近效期的甲类非处方药，该行为未造成危害后果。依据相关法律法规，该药品零售企业应当处以",opts:["A.责令限期改正，逾期不改正的；处1000元以上5000元以下的罚款","B.责令限期改正，逾期不改正的；处5000元以上5万元以下的罚款","C.责令限期改正，逾期不改正的；处5元以上30万元以下的罚款","D.责令限期改正，逾期不改正的；处30元以上50万元以下的罚款"],ans:"B",exp:"药品零售企业在药品经营活动中有下列行为之一的，由药品监督管理部门责令限期改正；逾期不改正的，处5000元以上5万元以下罚款；造成危害后果的，处5万元以上20万元以下罚款：①未按规定凭处方销售处方药的；②以买药品赠药品或者买商品赠药品等方式向公众直接或者变相赠送处方药、甲类非处方药的；③执业药师不在岗未挂牌告知或者处方未经执业药师审核即销售处方药的。"},
    {type:"最佳选择题",q:"94. 在此次检查过程中，下列企业行为中不符合药品经营质量管理规范的是",opts:["A.甲药品批发企业采购药品时向供货单位索取发票并妥善保存","B.乙药品批发企业将采购的一批普通药品不入本企业仓库，直接发往购货的药品零售企业","C.丙药品批发企业对存在质量问题的药品，存放于标志明显的专用场所，并做好隔离，不得销售","D.丁药品批发企业质量管理部门配备专职人员负责药品不良反应监测、报告工作"],ans:"B",exp:"药品直调指将本企业已采购的药品不入本企业仓库，而是从供货单位直接发送到购货单位的行为。在灾情、疫情、突发事件或者临床紧急救治等情形时，可开展药品直调。并且企业应当建立专门的采购记录，保证有效的质量跟踪和追溯。非特殊情况的日常经营中，企业一律不得采用直调方式购销药品。"},
    {type:"最佳选择题",q:"95. 某药品零售连锁企业为扩大销售渠道，提高品牌影响，已开通零售配送服务。关于该企业制定的零售配送管理制度，符合规定的是",opts:["A.为确保配送药品质量安全，药品需独立包装，不得和其他任何产品合并包装","B.配送药品箱体选用透气性高，防水性高，导热性低的材质","C.寄递配送单至少写明消费者的姓名及联系方式","D.包装封签为一次性使用，拆启后不可恢复"],ans:"D",exp:"药品需独立包装，不得与其他产品合并包装（医疗器械、保健食品除外）。配送药品的配送箱箱体应选用透气性低、防水性高、导热性低的材质。在包装件外部加贴寄递配送单，寄递配送单至少需载明药品零售企业名称及联系方式、配送企业名称及联系方式、药品储存要求（如常温、阴凉、冷藏、冷冻等）等信息，寄递配送单可做封签使用。包装封签应当做到一经拆启，无法恢复至原状。"},

    // ===== 四、多项选择题（96-100） =====
    {type:"多项选择题",q:"96. 习近平法治思想的主要内容集中体现为“十一个坚持”，属于“十一个坚持”的有",opts:["A.坚持以党为中心","B.坚持党对全面依法治国的领导","C.坚持依宪治国、依宪执政","D.坚持建设中国特色社会主义法治体系"],ans:"BCD",exp:"习近平法治思想的主要内容集中体现为“十一个坚持”：①坚持党对全面依法治国的领导；②坚持以人民为中心；③坚持中国特色社会主义法治道路；④坚持依宪治国、依宪执政；⑤坚持在法治轨道上推进国家治理体系和治理能力现代化；⑥坚持建设中国特色社会主义法治体系；⑦坚持依法治国、依法执政、依法行政共同推进，法治国家、法治政府、法治社会一体建设；⑧坚持全面推进科学立法、严格执法、公正司法、全民守法；⑨坚持统筹推进国内法治和涉外法治；⑩坚持建设德才兼备的高素质法治工作队伍；⑪坚持抓住领导干部这个“关键少数”。注意是以“人民”为中心。"},
    {type:"多项选择题",q:"97. 最小外包装上，须标明“免费”字样以及“免疫规划”专用标识的疫苗有",opts:["A.非免疫规划疫苗","B.各省(区、市)人民政府增加的免费向公民提供的疫苗","C.百白破疫苗","D.县级以上人民政府组织的应急接种所使用的疫苗"],ans:"BC",exp:"纳入国家免疫规划的疫苗制品的最小外包装上，须标明“免费”字样以及“免疫规划”专用标识。国家免疫规划的疫苗包括：卡介苗、乙肝疫苗、脊髓灰质炎疫苗、百白破疫苗、麻风疫苗、麻腮风疫苗、甲肝疫苗、乙脑疫苗、流感疫苗、甲型肝炎疫苗、流行性感冒疫苗、水痘疫苗、狂犬病疫苗、流感嗜血杆菌疫苗等，以及各省（区、市）人民政府增加的免费向公民提供的疫苗。"},
    {type:"多项选择题",q:"98. 在药品注册核查过程中，应当进行药品注册生产现场核查和上市前药品生产质量管理规范检查的药品有",opts:["A.创新药","B.仿制药","C.改良型新药","D.生物制品"],ans:"ACD",exp:"应当进行药品注册生产现场核查和上市前药品生产质量管理规范检查的药品包括：创新药、改良型新药、生物制品。对于仿制药等，根据是否已获得相应生产范围药品生产许可证且已有同剂型品种上市等情况，基于风险进行药品注册生产现场核查、上市前药品生产质量管理规范检查。"},
    {type:"多项选择题",q:"99. 下列产品中，药品零售企业不得经营的有",opts:["A.第一类精神药品","B.体外诊断试剂(医疗器械)","C.胰岛素以外的肽类激素","D.注射用A型肉毒毒素"],ans:"ACD",exp:"药品零售企业不得经营放射性药品、体内诊断试剂、体外诊断试剂（药品）、疫苗、药品类易制毒化学品、第一类精神药品、注射用A型肉毒毒素、终止妊娠药品（包括含有“米非司酮”成分的所有药品制剂）、蛋白同化制剂、肽类激素（胰岛素除外）、中药配方颗粒、医疗机构制剂、麻醉药品以及我国法律法规规定的其他禁止零售的药品。"},
    {type:"多项选择题",q:"100. 下列关于限制使用级抗菌药物说法正确的有",opts:["A.限制使用级抗菌药物对细菌耐药性影响较大","B.经长期临床应用证明安全、有效，价格相对较高","C.首选用于免疫功能低下合并感染、局部感染","D.具有中级以上专业技术职务任职资格的医师有权开具其处方"],ans:"ABD",exp:"限制使用级用于严重感染、免疫功能低下合并感染，或病原菌只对限制使用级抗菌药物敏感的情形。非限制使用级抗菌药物用于预防感染，治疗轻度感染或局部感染首选。"}
  ]
},
 {
  name: "押题密卷（三）",
  questions: [
    // ===== 一、最佳选择题（1-40） =====
    {type:"最佳选择题",q:"1. 关于《“健康中国2030”规划纲要》中，健康中国建设应遵循的原则，错误的是",opts:["A.把健康摆在优先发展的战略地位，立足国情，将促进健康的理念融入公共政策制定实施的全过程","B.坚持市场机制作用，以市场发展为主导，政府部门加快改革创新，形成具有中国特色、促进全民健康的制度体系","C.把握健康领域发展规律，坚持预防为主、防治结合、中西医并重，转变服务模式，构建整合型医疗卫生服务体系","D.公平公正，以农村和基层为重点，推动健康领域基本公共服务均等化，维护基本医疗卫生服务的均等化"],ans:"B",exp:"健康中国建设主要遵循以下原则：①健康优先；②改革创新；③科学发展；④公平公正。其中改革创新是指坚持政府主导，发挥市场机制作用，加快关键环节改革步伐，形成具有中国特色、促进全民健康的制度体系。B选项表述有误。"},
    {type:"最佳选择题",q:"2. 下列关于药品研制与质量管理说法不正确的是",opts:["A.药物临床试验机构应当具有医疗机构执业许可证，具有二级甲等以上资质，且有能承担药物临床试验的研究人员","B.药物临床试验主要研究者应当具有高级职称并参加过3个以上药物临床试验","C.仅开展与药物临床试验相关的生物样本等分析的机构，需按照要求进行备案","D.药物临床试验受试者的权益和安全是考虑的首要因素，优先于对科学和社会的获益"],ans:"C",exp:"仅开展与药物临床试验相关的生物样本等分析的机构，无需备案。药物临床试验机构应当具有医疗机构执业许可证，具有二级甲等以上资质，且有能承担药物临床试验的研究人员；其中主要研究者应当具有高级职称并参加过3个以上药物临床试验。药物临床试验受试者的权益和安全是考虑的首要因素，优先于对科学和社会的获益。"},
    {type:"最佳选择题",q:"3. 国家基本药物工作委员会，由多部门共同组成，承担其日常工作的部门是",opts:["A.国家发展和改革委员会","B.国家药品监督管理局","C.国家中医药管理局","D.国家卫生健康委员会"],ans:"D",exp:"国家基本药物工作委员会由国家卫生健康委员会、国家发展和改革委员会、工业和信息化部、国家监察委员会、财政部、人力资源和社会保障部、商务部、国家药品监督管理局、国家中医药管理局组成。办公室设在国家卫生健康委员会，承担国家基本药物工作委员会的日常工作。"},
    {type:"最佳选择题",q:"4. 根据国家医保局财政部《关于建立医疗保障待遇清单制度的意见》（医保发[2021]5号），国家医疗保障基本制度包括基本医疗保险、补充医疗保险和医疗救助制度。其中，帮助困难群众获得基本医疗保险服务并减轻其医疗费用负担的制度安排是",opts:["A.补充医疗保险","B.基本医疗保险","C.医疗救助","D.城乡居民基本医疗保险"],ans:"C",exp:"国家医疗保障基本制度包括基本医疗保险、补充医疗保险和医疗救助制度，其中帮助困难群众获得基本医疗保险服务并减轻其医疗费用负担的制度安排是医疗救助制度。"},
    {type:"最佳选择题",q:"5. 下列关于仿制药说法错误的是",opts:["A.仿制已上市原研药品不强调处方工艺与原研药品一致，但强调仿制药品必须与原研药品质量和疗效一致","B.国家鼓励仿制临床必需、疗效确切、供应短缺的仿制药","C.对同品种药品通过一致性评价的药品生产企业达到2家以上的，在药品集中采购等方面，原则上不再选用未通过一致性评价的品种","D.申请注册的仿制药没有达到与原研药质量和疗效一致的不予批准"],ans:"C",exp:"对同品种药品通过一致性评价的药品生产企业达到3家以上的，在药品集中采购等方面，原则上不再选用未通过一致性评价的品种。"},
    {type:"最佳选择题",q:"6. 《药品网络销售监督管理办法》属于",opts:["A.部门规章","B.行政法规","C.法律","D.地方政府规章"],ans:"A",exp:"《药品网络销售监督管理办法》属于部门规章。部门规章是国务院各部、委员会等具有行政管理职能的机构制定，应当经过部务会议或者委员会会议决定，由部门首长签署命令予以公布。格式特点为《××办法/规范/规定》。"},
    {type:"最佳选择题",q:"7. 下列职责中，不属于省级药品监督管理部门职责的是",opts:["A.药品批发企业行政许可审批","B.依法制定地方中药材标准及中药饮片炮制规范","C.负责药品、医疗器械、化妆品上市风险管理","D.实施执业药师准入制度，负责执业药师注册管理工作"],ans:"C",exp:"药品、医疗器械、化妆品的上市后风险管理属于国家药品监督管理部门的职能，其余选项均为省级药品监督管理部门职责。"},
    {type:"最佳选择题",q:"8. 下列事项中，属于处方适宜性审核内容的是",opts:["A.处方前记、正文和后记是否符合《处方管理办法》等有关规定文字是否正确、清晰、完整","B.处方开具人是否根据《执业医师法》取得医师资格，并执业注册","C.用法用量中是否使用“遵医嘱”“自用”等含糊不清字句","D.处方中是否存在配伍禁忌"],ans:"D",exp:"适宜性审核的内容是看用药是否正确，是否与诊断相符。故处方是否存在配伍禁忌属于适宜性审核。处方前记、正文和后记是否符合《处方管理办法》等有关规定文字是否正确、清晰、完整和用法用量中是否使用“遵医嘱”“自用”等含糊不清字句属于规范性审核；处方开具人是否根据《执业医师法》取得医师资格，并执业注册属于合法性审核。"},
    {type:"最佳选择题",q:"9. 下列关于药品标准的说法，错误的是",opts:["A.国家药品监督管理局制定的《国家中药饮片炮制规范》属于中药饮片的国家药品标准","B.国家药品标准包含《中国药典》和国家药品监督管理局颁布的药品标准","C.《中国药典》是国家药品标准的核心，由国家卫生健康委员会编撰并发布","D.药品注册标准应当符合《中国药典》的通用技术要求，不得低于《中国药典》的规定"],ans:"C",exp:"国家药品标准包含《中国药典》和国家药品监督管理局颁布的药品标准。其中，《中国药典》是国家药品标准的核心，具有法律地位，每5年发布一版，由国家药典委员会编撰，国家药品监督管理局发布。"},
    {type:"最佳选择题",q:"10. 依照《反兴奋剂条例》的规定，以下对兴奋剂药品的管理说法错误的是",opts:["A.含兴奋剂药品应在包装标识或产品说明书上注明“运动员慎用”字样","B.国家对蛋白同化制剂、肽类激素实施严格管理","C.医疗机构蛋白同化制剂、肽类激素处方应当保存2年","D.零售药店只能凭依法享有处方权的执业医师开具的处方向患者提供蛋白同化制剂、肽类激素"],ans:"D",exp:"医疗机构只能凭依法享有处方权的执业医师开具的处方向患者提供蛋白同化制剂、肽类激素。药品零售企业不得经营蛋白同化制剂或肽类激素（除胰岛素外）。"},
    {type:"最佳选择题",q:"11. 以下关于药品广告发布媒体的限制的说法，错误的是",opts:["A.处方药和非处方药只准在国家卫生健康委员会和国家药品监督管理局共同指定的专业性医学、药学专业刊物上发布广告","B.非药品广告不得有涉及药品的宣传","C.不得违反科学规律，明示或者暗示可以治疗所有疾病或者正常生活和治疗病症所必需等内容","D.医疗机构配制的制剂不得发布广告"],ans:"A",exp:"处方药只准在国家卫生健康委员会和国家药品监督管理局共同指定的专业性医学、药学专业刊物上发布广告。"},
    {type:"最佳选择题",q:"12. 行政许可是指行政机关根据公民、法人和其他组织的申请经依法审查，准予其从事特定活动的行为。下列关于行政许可特征、原则和申请程序的说法不正确的是",opts:["A.行政许可是一种依申请行为，申请人提出申请是行政许可的前提，也是启动行政程序的基础","B.行政许可是一种要式行政行为，通常是法定的许可证件或是签章","C.行政许可的基本原则包括法定原则、公开原则、公平公正原则、高效便民原则","D.符合形式要件的行政许可申请即应当受理，受理后即进入审查环节，药品领域的审查均为形式审查"],ans:"D",exp:"行政机关受理行政许可申请后，即进入审查环节。审查分为形式审查和实质审查。形式审查一般限于登记类事项，药品领域的审查，均为实质审查。"},
    {type:"最佳选择题",q:"13. 药品零售企业要有保证药品质量的质量管理制度，符合质量管理与追溯要求的信息管理系统，符合药品经营质量管理规范要求。下列关于经营细胞治疗类生物制品的药品零售企业应具备的条件和要求说法，不包括的是",opts:["A.应具备与经营规模相适应的质量保证能力和产品信息化追溯能力","B.应具备与指定医疗机构电子处方互联互通的条件","C.应配备具备临床医学、微生物学、免疫学、预防医学等专业的本科以上学历的执业药师，并确保经过相关产品持有人培训考核","D.应具备与经营规模和品种相适应的自营仓库，并具备冷链环境和设施"],ans:"D",exp:"药品批发企业要求具备与经营规模相适应的自营仓库。药品零售企业仅要求有与经营规模相适应的营业场所、设备、陈列、仓储、设施设备以及卫生环境。"},
    {type:"最佳选择题",q:"14. 关于医疗机构抗菌药物的遴选和定期评估制度的说法，错误的是",opts:["A.抗菌药物管理工作组三分之二以上成员审议同意，并经药事管理与药物治疗学委员会三分之二以上委员审核同意后方可列入采购供应目录","B.抗菌药物的目录中，碳青霉烯类抗菌药物注射剂型严格控制在3个品规内","C.临床科室、药学部门、抗菌药物管理工作组可以提出清退或者更换意见","D.清退或者更换的抗菌药物品种或者品规不得再重新进入本医疗机构抗菌药物供应目录"],ans:"D",exp:"清退或者更换的抗菌药物品种或者品规原则上12个月内不得重新进入本医疗机构抗菌药物供应目录。"},
    {type:"最佳选择题",q:"15. 除个别情况外，经营药品必须依法持有《药品经营许可证》，下列关于《药品经营许可证》的说法正确的是",opts:["A.药品零售连锁企业总部的《药品经营许可证》的审批部门应为市县级药品监督管理部门","B.药品零售连锁企业总部收购其他零售企业时，如果实际经营地址、经营范围没有发生变化的，可以按照变更药品经营许可证办理","C.《药品经营许可证》编号中，两位分类代码包含大写字母和小写字母，其中第一位字母A代表药品批发企业，B代表药品零售连锁企业总部","D.仅从事非处方药零售活动的实施告知承诺制审批，取得《药品经营许可证》"],ans:"B",exp:"药品批发企业、药品零售连锁企业总部的经营许可证审批部门为省级药品监督管理部门。《药品经营许可证》编号中，分类码为两位大写字母。第一位字母A代表药品批发企业、B代表药品零售连锁企业总部、C代表药品零售连锁门店、D代表单体药品零售企业；第二位A代表法人企业、B代表非法人企业。仅从事乙类非处方药零售活动的实施告知承诺制审批。"},
    {type:"最佳选择题",q:"16. 药品上市许可持有人承担药品经营活动的总体责任，下列关于药品上市许可持有人从事经营活动的说法错误的",opts:["A.禁止销售药品不开具发票","B.不得委托销售疫苗和中药配方颗粒","C.自行经营放射性药品的，无需取得《放射性药品经营许可证》","D.禁止向零售连锁企业销售第二类精神药品"],ans:"D",exp:"药品上市许可持有人禁止向非连锁药品零售企业销售第二类精神药品。"},
    {type:"最佳选择题",q:"17. 下列关于药品零售企业药学服务的要求说法不正确的是",opts:["A.药品零售企业应安排专职或者兼职人员收集、传递药学服务信息，定期对药学服务开展情况进行分析、交流和评价","B.销售中药饮片的药品零售企业，应配备执业药师（药学）或药学技术人员审核处方药物相反、相畏、禁忌、剂量等内容，调配正确后，指导个人消费者煎服方法和使用要求","C.药品零售企业应当在营业场所内开展合理用药、安全用药的科普宣传，向个人消费者提供疾病科普宣传，引导个人消费者科学、合理使用药品","D.销售含兴奋剂类药品时，药学服务人员应当核实药品说明书和标签中“运动员慎用”标注情况，并告知个人消费者“运动员慎用”"],ans:"B",exp:"药品零售企业销售中药饮片时，执业药师（中药学）或中药学药学技术人员应当审核处方药物相反、相畏、禁忌、剂量等内容，做到调配正确、计量准确，使用洁净、卫生的包装，并告知个人消费者煎煮器具要求，指导个人消费者中药饮片的先煎、后下、烊化等煎服方法；销售毒性中药品种时，药学服务人员应当做到计量准确，不得超出规定的剂量。"},
    {type:"最佳选择题",q:"18. 下列属于商业贿赂行为的是",opts:["A.经营者在交易活动中，以明示方式向交易相对方支付折扣，并如实入账的","B.经营者私下给相关单位主要负责人相关财物，以谋取交易机会或者竞争优势","C.以贿赂手段获取权利人的商业秘密","D.通过虚假交易生成不真实的销量数据、用户好评的“刷单炒信”"],ans:"B",exp:"商业贿赂行为包括：①经营者不得采用财物或者其他手段贿赂相关单位或者个人，以谋取交易机会或者竞争优势。②经营者的工作人员进行贿赂的，应当认定为经营者的行为；但是，经营者有证据证明该工作人员的行为与为经营者谋取交易机会或者竞争优势无关的除外。"},
    {type:"最佳选择题",q:"19. 药品上市许可持有人、药品生产企业、药品经营企业委托储存运输药品的，应当委托符合药品GSP的企业实施药品储存运输活动，下列涉药储存、运输行为中，不完全正确的是",opts:["A.药品上市许可持有人委托储存、运输药品的，应将受托方的储存运输行为纳入己方的质量管理体系，与其签订委托协议，约定双方药品质量责任、委托储存运输操作规程等内容，并对受托方进行监督","B.药品上市许可持有人委托储存、运输放射性药品的，应签订质量保证协议，确保药品储存、运输过程符合药品GSP的要求，受托方不得再次委托储存、运输","C.药品批发企业开展委托运输活动的，应当向其所在地省级药品监督管理部门报告，跨省委托运输的还应报告受托企业所在地省级药品监督管理部门","D.接受委托运输中药配方颗粒的单位应当依法开展药品运输活动，受托方再次委托运输的，应当征得委托方同意，并签订质量保障协议，确保运输过程符合GSP要求"],ans:"D",exp:"接受储存、运输药品的单位应当按照药品GSP的要求开展药品储存、运输活动，履行委托协议约定的义务，并承担相应的法律责任。受托方不得再次委托储存。受托方再次委托运输的，应当征得委托方同意，并签订质量保证协议，确保药品运输过程符合药品GSP的要求。疫苗、麻醉药品、精神药品、医疗用毒性药品、放射性药品、药品类易制毒化学品等特殊管理的药品以及中药配方颗粒不得再次委托运输。"},
    {type:"最佳选择题",q:"20. 药品说明书由药品生产企业依照国家规定的格式要求，以及批准的内容编写。应当列出所用的全部辅料名称的药品是",opts:["A.控缓释制剂","B.注射剂","C.糖浆剂","D.胶囊剂"],ans:"B",exp:"注射剂和非处方药，应当列出所用的全部辅料名称。"},
    {type:"最佳选择题",q:"21. 《药品管理法》第五十三条规定，从事药品经营活动，应当遵守药品经营质量管理规范要求，下列药品批发的经营质量管理规范主要内容说法错误的是",opts:["A.从事冷藏冷冻药品储存、运输等工作的人员应当接受相关法律法规和专业知识培训且必须考核合格后上岗","B.储存运输冷藏、冷冻药品的企业应当配备两个以上独立冷库","C.运输药品应当使用封闭式货物运输工具","D.直接接触药品岗位的人员应当进行岗前及年度健康检查，并建立健康档案"],ans:"B",exp:"储存运输冷藏、冷冻药品的企业，应当配备与其经营规模和品种相适应的冷库。储存疫苗的企业应当配备两个以上独立冷库，并做到不可合并储存的每个储存温区疫苗冷库至少一用一备，且所有备用冷库处于可随时启用状态，确保某个冷库出现故障时可及时将库存疫苗转移至其他同温区冷库，杜绝疫苗脱离冷链。"},
    {type:"最佳选择题",q:"22. 企业采购活动应当确定供货单位、购入药品及供货单位销售人员的合法性，并与供货单位签订质量保证协议。下列有关药品批发企业采购活动说法不正确的是",opts:["A.灾情、疫情、突发事件或者临床紧急救治等特殊情形时，企业可采用直调方式购销药品，建立专门的采购记录，保证有效的质量跟踪和追溯","B.采购首营品种应当审核药品的合法性，索取并审核加盖供货单位公章原印章的药品生产或者进口批准证明文件复印件，确认无误后方可采购","C.企业采购中药材、中药饮片应建立采购记录，采购记录的内容只包含药品的通用名称、剂型、规格、生产厂商、供货单位、数量、价格、购货日期","D.企业索取的采购发票应当列明药品的通用名称、规格、单位、数量、单价、金额等；不能全部列明的，应当附《销售货物或者提供应税劳务清单》，并加盖供货单位发票专用章原印章、注明税票号码"],ans:"C",exp:"企业采购药品应建立采购记录，采购记录的内容应包含药品的通用名称、剂型、规格、生产厂商、供货单位、数量、价格、购货日期等内容，采购中药材、中药饮片的，还应标明产地。"},
    {type:"最佳选择题",q:"23. 关于药品召回的说法，正确的是",opts:["A.使用该药品可能引起可逆的或暂时的健康危害的适用于三级召回","B.作出药品召回决定后，一级召回3日内通知到药品生产企业、药品经营企业、药品使用单位等","C.持有人对召回药品的处理应当有详细的记录，记录应当保存5年且不得少于药品有效期后1年","D.在召回完成后10个工作日内，将药品召回和处理情况向所在地省级药品监督管理部门报告即可"],ans:"C",exp:"持有人对召回药品的处理应当有详细的记录，记录应当保存5年且不得少于药品有效期后1年。使用该药品可能引起可逆的或暂时的健康危害的适用于二级召回。作出药品召回决定后，一级召回1日内通知到药品生产企业、药品经营企业、药品使用单位等。在召回完成后10个工作日内，将药品召回和处理情况向所在地省级药品监督管理部门和卫生健康主管部门报告。"},
    {type:"最佳选择题",q:"24. 企业应当按照规定的程序和要求对到货药品逐批进行收货、验收，防止不合格药品入库。以下关于药品批发企业收货、验收的要求，正确是",opts:["A.药品到货时，收货人员应当首先核实运输方式是否符合要求，冷藏冷冻药品在阴凉库内验收合格后，应尽快转入冷库，确保温度在规定范围内","B.企业应当对每次到货的药品进行逐批逐件验收，确保到货药品符合入库标准要求","C.药品生产企业有特殊质量控制要求的药品，开箱检查验收时，可不打开最小包装","D.外包装及封签完整的中成药，可不开箱检查"],ans:"C",exp:"药品到货时，收货人员应当首先核实运输方式是否符合要求，对不符合运输方式的应当拒收。冷藏冷冻药品应当在冷库内待验。企业应当对每次到货的药品进行逐批抽样验收，抽取的样品应当具有代表性。同一批号的药品应当至少检查一个最小包装（有特殊质量控制要求或者打开最小包装可能影响药品质量的情形除外）；外包装及封签完整的原料药、实施批签发管理的生物制品，可不开箱检查。"},
    {type:"最佳选择题",q:"25. 关于特殊医学用途配方食品管理的说法，错误的是",opts:["A.特殊医学用途婴儿配方食品用于0月龄至12月龄","B.特殊医学用途配方食品参照药品管理的要求予以对待，规定该类食品应当经国家药品监督管理部门注册","C.特医食品标签按照规定标示“不适用于非目标人群使用”“本品禁止用于肠外营养支持和静脉注射”","D.特殊医学用途配方食品注册号的格式为：国食注字TY+4位年号+4位顺序号"],ans:"B",exp:"特殊医学用途配方食品经国家食品安全监督管理部门注册。"},
    {type:"最佳选择题",q:"26. 以下关于麻醉药品和精神药品在经营过程中的要求，说法正确的是",opts:["A.药品经营企业不得经营麻醉药品和第一类精神药品","B.药品经营企业不得经营麻醉药品原料药和第一类精神药品原料药（小包装原料药除外）","C.药品经营企业不得经营麻醉药品和精神药品原料药","D.从事麻醉药品、第一类精神药品批发业务的全国性批发企业、区域性批发企业，可以从事第二类精神药品批发业务"],ans:"D",exp:"药品经营企业不得经营麻醉药品原料药和第一类精神药品原料药；但小包装的供医疗、科学研究、教学使用的，可由国家药品监督管理部门规定的药品批发企业经营。从事麻醉药品、第一类精神药品批发业务的全国性批发企业、区域性批发企业，可以从事第二类精神药品批发业务。"},
    {type:"最佳选择题",q:"27. 根据药品管理法规，在药品零售企业中，下列哪种药品禁止陈列",opts:["A.胰岛素注射液","B.罂粟壳中药饮片","C.抗过敏滴眼液","D.外用止痒药膏"],ans:"B",exp:"药品零售企业陈列要求中，第二类精神药品、毒性中药饮片和罂粟壳中药饮片不得陈列。胰岛素注射液属于处方药，零售药店可以陈列销售，但必须凭医师处方，不得开架销售。抗过敏滴眼液、外用止痒药膏均属于外用药，需要和其他药品分开陈列。"},
    {type:"最佳选择题",q:"28. 药品零售企业销售处方药与非处方药的说法不正确的是",opts:["A.药品零售企业可不凭医师处方销售甲类非处方药，但执业药师应当主动向个人消费者提供用药指导","B.药品零售企业不得采用开架自选的方式销售处方药，也不得采用“捆绑搭售”“买商品赠药品”等方式直接或变相赠送销售处方药、非处方药","C.消费者持医师处方购买含麻黄碱类复方制剂时，药品零售企业执业药师应当认真审核处方，确认处方剂量在合理的治疗需求范围内，方可凭处方剂量销售","D.零售企业销售乙类非处方药时，执业药师或其他药学技术人员应当根据个人消费者咨询需求，提供科学合理的用药指导"],ans:"B",exp:"药品零售企业不得采用开架自选的方式销售处方药，也不得采用“捆绑搭售”“买商品赠药品”“买N赠1”“满N减1”“药品满N元减×元”“药品满N元包邮（免配送费）”等方式直接或变相赠送销售处方药、甲类非处方药（包括通过网络销售的渠道）。非处方药包括甲类非处方药、乙类非处方药。乙类非处方药可以赠送销售。"},
    {type:"最佳选择题",q:"29. 根据国家药品监督管理局综合司发布《关于中药饮片生产企业采购产地加工（趁鲜切制）中药材有关问题的复函》（药监综药管函[2021]367号），下列关于产地趁鲜切制中药材的规定描述，不正确的是",opts:["A.中药饮片生产企业可以采购具备健全质量管理体系的产地加工企业生产的产地趁鲜切制中药材用于中药饮片生产","B.趁鲜切制中药材，虽改变了中药材形态、性质，但减少了中药材经干燥、浸润、切制、再干燥的加工环节，一定程度上有利于保障中药材质量","C.趁鲜切制是产地加工的方式之一，是按照传统加工方法将采收的新鲜中药材初制成片、块、段、瓣等","D.中药饮片生产企业对采购的鲜切药材承担质量管理责任，对鲜切药材应当入库验收，按照中药饮片GMP要求和国家药品标准或者省级炮制规范进行净制、炮炙等生产加工，并经检验合格后，方可销售"],ans:"B",exp:"趁鲜切制是产地加工的方式之一，是按照传统加工方法将采收的新鲜中药材切制成片、块、段、瓣等，虽改变了中药材形态，但未改变中药材性质，且减少了中药材经干燥、浸润、切制、再干燥的加工环节，一定程度上有利于保障中药材质量。"},
    {type:"最佳选择题",q:"30. 下列关于药品标签、说明书的说法，不正确的是",opts:["A.内包装系指直接与药品接触的包装","B.外包装指内包装以外的包装，按由里向外分为中包装和大包装","C.药品的每个最小销售单元的包装必须按规定印有或贴有标签并附说明书","D.内标签包装尺寸过小的，至少标注：有效期、规格、产品批号、药品商品名称等内容"],ans:"D",exp:"内标签包装尺寸过小的，至少标注：有效期、规格、产品批号、药品通用名称等内容。"},
    {type:"最佳选择题",q:"31. 以下批准文号中属于港澳台地区生产的第二类医疗器械的是",opts:["A.粤械注准 20252630001","B.京械注许 20252630002","C.国械注进 20252630003","D.国械注许 20252630004"],ans:"D",exp:"香港、澳门、台湾地区医疗器械的注册、备案，参照进口医疗器械办理，进口第二类医疗器械找国药监进行注册，所以前三个字是国械注，根据注册形式的不同，境内用“准”字，进口用“进”字，港澳台用“许”字，题干中医疗器械批准文号应为国械注许XXXXXXXXXXX。"},
    {type:"最佳选择题",q:"32. 国家鼓励研制开发临床有效的中药品种，对质量稳定、疗效确切的中药品种实行分级保护制度。下列适用于二级保护的中药品种是",opts:["A.从天然药物中提取的有效物质及特殊制剂","B.相当于国家一级保护的野生药材物种的人工制成品","C.来源于古代经典名方的中药复方制剂","D.用于预防和治疗特殊疾病的中成药"],ans:"A",exp:"适用于中国境内生产制造的中药品种，包括中成药、天然药物的提取物及其制剂和中药人工制品。不包括来源于古代经典名方的中药复方制剂。申请中药二级保护品种应符合下列条件之一：符合上述一级保护的品种或者已经解除一级保护的品种；对特定疾病有显著疗效的；从天然药物中提取的有效物质及特殊制剂。用于预防和治疗特殊疾病的中成药、相当于国家一级保护的野生药材物种的人工制成品属于一级保护的情形。"},
    {type:"最佳选择题",q:"33. 根据《药品管理法》第一百一十六条、一百一十七条规定，生产、销售假药、劣药的，应收收违法生产、销售的药品和违法所得，并处违法生产、销售的药品货值金额相应倍数的罚款，下列情形中，假药、劣药认定及其罚款倍数的说法，完全正确的是",opts:["A.变质的止咳糖浆，认定为假药，应处货值金额十到二十倍罚款","B.擅自添加乙基纤维素（药用辅料）的化学药，认定为假药，应处货值金额十五到三十倍罚款","C.使用糯米压片冒充治疗冠心病的药品，认定为劣药，应处货值金额十五到三十倍罚款","D.过期的葡萄糖注射液，认定为劣药，应处货值金额十到二十倍罚款"],ans:"D",exp:"根据《药品管理法》第一百一十七条规定，生产、销售劣药的，没收违法生产、销售的药品和违法所得，并处违法生产、销售的药品货值金额十倍以上二十倍以下的罚款；根据《药品管理法》第一百一十六条规定，生产、销售假药的，没收违法生产、销售的药品和违法所得，责令停产停业整顿，吊销药品批准证明文件，并处违法生产、销售的药品货值金额十五倍以上三十倍以下的罚款。变质的药品、用非药品冒充其他药品均为假药情形，擅自添加防腐剂或辅料、超过效期的药品均为劣药。"},
    {type:"最佳选择题",q:"34. 下列关于药品生产许可不正确的是",opts:["A.从事药品生产活动，应当经所在地省级药品监督管理部门批准","B.受托方不得将接受委托生产的药品再次委托第三方生产","C.生物制品不得委托生产","D.《药品生产许可证》分为正本和副本，许可事项是指生产地址和生产范围"],ans:"C",exp:"含麻黄碱类复方制剂、麻醉药品及其复方制剂、精神药品及其复方制剂、医疗用毒性药品、药品类易制毒化学品、血液制品不得委托生产；但是，国家药品监督管理局另有规定的除外。"},
    {type:"最佳选择题",q:"35. 下列有关疫苗的说法错误的是",opts:["A.省级人民政府在执行国家免疫规划时增加的疫苗属于免疫规划疫苗","B.疫苗上市许可持有人、疾病预防控制机构可以自行配送疫苗，也可以委托符合条件的疫苗配送单位配送疫苗","C.疾病预防控制机构配送非免疫规划疫苗不得收取储存、运输费用","D.纳入国家免疫规划的疫苗，其最小外包装应标注：“免费”字样以及“免疫规划”专用标识"],ans:"C",exp:"疾病预防控制机构配送非免疫规划疫苗可以收取储存、运输费用。"},
    {type:"最佳选择题",q:"36. 根据《药品管理法》第一百一十五条规定，下列情形，可以按照未取得许可证生产、销售药品进行处罚，但可给予从轻处罚的情形是",opts:["A.个人设置的门诊部、诊所等医疗机构向患者提供的药品超出规定的范围和品种的","B.提供虚假的材料或者采取其他手段骗取药品经营许可证的","C.超出经营范围经营的药品不属于疫苗、麻醉药品、精神药品的","D.未经批准开展药物临床试验的"],ans:"C",exp:"药品经营企业未经批准变更许可事项或者药品经营许可证超过有效期继续开展药品经营活动的，药品监督管理部门按照《药品管理法》第一百一十五条的规定给予处罚，但是，有下列情形之一，药品经营企业及时改正，不影响药品质量安全的，给予减轻处罚：①药品经营企业超出许可的经营方式、经营地址从事药品经营活动的；②超出经营范围经营的药品不属于疫苗、麻醉药品、精神药品、药品类易制毒化学品、医疗用毒性药品、血液制品、细胞治疗类生物制品的；③药品经营许可证超过有效期但符合申请办理药品经营许可证要求的；④依法可以减轻处罚的其他情形。A选项的情形可以按照无证生产、经营处罚，但不属于可以从轻处罚的情形。"},
    {type:"最佳选择题",q:"37. 药品上市许可持有人未按规定配备专门的质量受权人履行药品上市放行责任，应承担的法律责任说法不正确的是",opts:["A.其相关责任人员10年直至终身禁止从事药品生产经营活动","B.逾期不改正的处10万元以上50万元以下的罚款","C.处50万元以上200万元以下的罚款","D.责令停业整顿，直至吊销药品批准证明文件、药品生产许可证"],ans:"B",exp:"根据《药品管理法》第一百二十六条规定，除该法另有规定的情形外，药品上市许可持有人未遵守药品生产质量管理规范，责令限期改正，给予警告；逾期不改正的，处十万元以上五十万元以下的罚款；情节严重的，处五十万元以上二百万元以下的罚款，责令停产停业整顿直至吊销药品批准证明文件、药品生产许可证、药品经营许可证等，其相关责任人员10年直至终身禁止从事药品生产经营活动。药品上市许可持有人未配备专门质量受权人履行药品上市放行责任属于违法情节严重的情形，故应按照50万元到200万元以下进行罚款。"},
    {type:"最佳选择题",q:"38. 三级教学综合医院药学部药学专业技术人员中具有副高级以上药学专业技术职务任职资格的应当不低于",opts:["A.13%","B.15%","C.20%","D.30%"],ans:"B",exp:"三级综合医院药学部药学专业技术人员中具有副高级以上药学专业技术职务任职资格的应当不低于13%，教学医院应当不低于15%。"},
    {type:"最佳选择题",q:"39. 血液制品，特指各种人血浆蛋白制品。关于血液制品原料管理的说法，错误的是",opts:["A.血液制品生产单位不得向无《单采血浆许可证》的单采血浆站或者未与其签订质量责任书的单采血浆站及其他任何单位收集原料血浆","B.血液制品生产单位在原料血浆投料生产前，必须使用有产品批准文号并经国家药品生物制品检定机构逐批检定合格的体外诊断试剂，对每一人份血浆进行全面复检，并作检测记录","C.原料血浆经复检不合格的，不得投料生产","D.原料血浆经复检发现有血液途径传播的疾病的，必须通知供应血浆的单采血浆站，并及时上报所在地省级药品监督管理部门"],ans:"D",exp:"原料血浆经复检发现有血液途径传播的疾病的，必须通知供应血浆的单采血浆站，并及时上报所在地省级卫生健康主管部门。"},
    {type:"最佳选择题",q:"40. 根据《药品管理法》规定，未取得药品批准证明文件、生产、进口药品的情形，情节严重的，企业法人、主要负责人、直接负责的主管人员和其他责任人员禁止从事药品生产经营活动的时间是",opts:["A.5年","B.3年","C.终身禁止","D.10年直至终身禁止"],ans:"D",exp:"根据《药品管理法》第一百二十四条第一款第一项规定，未取得药品批准证明文件生产、进口药品的，没收违法生产、进口、销售药品和违法所得以及专门用于违法生产的原料、辅料、包装材料和生产设备，责令停产停业整顿，并处违法生产、进口、销售的药品货值金额十五倍以上三十倍以下的罚款；货值金额不足十万元的，按十万元计算；情节严重的，吊销药品批准证明文件直至吊销药品生产许可证、药品经营许可证或者医疗机构制剂许可证，对法定代表人、主要负责人、直接负责的主管人员和其他责任人员，没收违法行为发生期间自本单位所获收入，并处所获收入百分之三十以上三倍以下的罚款，十年直至终身禁止从事药品生产经营活动，并可以由公安机关处五日以上十五日以下的拘留。"},

    // ===== 二、配伍选择题（41-85） =====
    {type:"配伍选择题",subs:[
      {q:"41. 参加国家教育行政主管部门承认的药学类、中药学类以及相关专业大学专科以上学历（学位）教育，获得学历（学位）当年度最多折算",opts:["A.60学时","B.90学时","C.30学时","D.40学时"],ans:"B",exp:"参加国家教育行政主管部门承认的药学类、中药学类以及相关专业大学专科以上学历（学位）教育，获得学历（学位）当年度最多折算90学时。"},
      {q:"42. 执业药师继续教育内容包括公需科目和专业科目，其中专业科目的学时一般不少于",opts:["A.60学时","B.90学时","C.30学时","D.40学时"],ans:"A",exp:"执业药师应当自取得执业药师职业资格证书的次年起开始参加继续教育，每年参加的继续教育不少于90学时。其中，专业科目学时一般不少于总学时的三分之二，即专业科目学时一般不少于60学时。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"43. 放射性药品生产企业监督检查频率为",opts:["A.每季度不少于1次","B.每年不少于1次","C.每年抽取一定比例开展检查，3年内对本行政区域内企业全部进行检查","D.每年抽取一定比例开展检查，5年内对本行政区域内企业全部进行检查"],ans:"B",exp:"疫苗、血液制品、放射性药品、医疗用毒性药品、无菌药品等高风险药品生产企业监督检查频率为每年不少于1次。"},
      {q:"44. 无菌药品生产企业监督检查频率为",opts:["A.每季度不少于1次","B.每年不少于1次","C.每年抽取一定比例开展检查，3年内对本行政区域内企业全部进行检查","D.每年抽取一定比例开展检查，5年内对本行政区域内企业全部进行检查"],ans:"B",exp:"疫苗、血液制品、放射性药品、医疗用毒性药品、无菌药品等高风险药品生产企业监督检查频率为每年不少于1次。"},
      {q:"45. 药品类易制毒化学品生产企业监督检查频率为",opts:["A.每季度不少于1次","B.每年不少于1次","C.每年抽取一定比例开展检查，3年内对本行政区域内企业全部进行检查","D.每年抽取一定比例开展检查，5年内对本行政区域内企业全部进行检查"],ans:"A",exp:"麻醉药品、第一类精神药品、药品类易制毒化学品药品生产企业监督检查频率为每季度不少于1次。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"46. 承担盐业和国家储备盐行政管理、中药材生产扶持项目管理、国家药品储备工作的部门是",opts:["A.医疗保障主管部门","B.卫生健康管理部门","C.市场监督管理部门","D.工业和信息化管理部门"],ans:"D",exp:"工业和信息化部门的职责关键词是：工业发展、生物医药、中药材生产扶持项目、药品储备等。"},
      {q:"47. 负责药品、医疗器械、保健食品、特殊医学用途配方食品广告审查和监督处罚的部门是",opts:["A.医疗保障主管部门","B.卫生健康管理部门","C.市场监督管理部门","D.工业和信息化管理部门"],ans:"C",exp:"市场监督管理部门职责的关键词是：管理同级药品监督管理部门、市场行为监督、药品价格监督检查、广告审查和监督等。"},
      {q:"48. 建立建全覆盖城乡居民的多层次医疗保障体系，不断提高医疗保障水平，推进“医疗、医保、医药”三医联动改革的部门是",opts:["A.医疗保障主管部门","B.卫生健康管理部门","C.市场监督管理部门","D.工业和信息化管理部门"],ans:"A",exp:"医疗保障主管部门职责的关键词是：医疗保障制度/目录、“三医联动”、医药服务价格制定等。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"49. 境内生产药品的药品批准文号是",opts:["A.国药准字H(Z、S)+四位年号+四位顺序号","B.国药准字H(Z、S)C+四位年号+四位顺序号","C.国药准字H(Z、S)J+四位年号+四位顺序号","D.H(Z、S)+四位年号+四位顺序号"],ans:"A",exp:"境内生产药品的批准文号：国药准字H(Z、S)+四位年号+四位顺序号。"},
      {q:"50. 境外生产药品的药品批准文号",opts:["A.国药准字H(Z、S)+四位年号+四位顺序号","B.国药准字H(Z、S)C+四位年号+四位顺序号","C.国药准字H(Z、S)J+四位年号+四位顺序号","D.H(Z、S)+四位年号+四位顺序号"],ans:"C",exp:"境外生产药品的批准文号：国药准字H(Z、S)J+四位年号+四位顺序号。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"51. 为急诊慢性病重度疼痛患者开具三唑仑片的处方限量为",opts:["A.不得超过7日常用量","B.不得超过15日常用量","C.1日常用量","D.1次常用量"],ans:"A",exp:"为门（急）诊癌症疼痛患者和中、重度慢性疼痛患者开具的麻醉药品、第一类精神药品其他剂型（比如片剂）每张处方不得超过7日常用量。"},
      {q:"52. 盐酸哌替啶注射剂处方限量为",opts:["A.不得超过7日常用量","B.不得超过15日常用量","C.1日常用量","D.1次常用量"],ans:"D",exp:"盐酸哌替啶处方限量为1次常用量。"},
      {q:"53. 盐酸二氢埃托啡注射剂处方限量为",opts:["A.不得超过7日常用量","B.不得超过15日常用量","C.1日常用量","D.1次常用量"],ans:"D",exp:"盐酸二氢埃托啡处方限量为1次常用量。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"54. 药品监督管理部门接到举报，辖下一家药品零售企业存在违规销售过期药品的情形，为防止证据损毁，药监部门依法对该药店实施查封、扣押店内销售药品的行为属于",opts:["A.行政强制措施","B.行政强制执行","C.行政处罚","D.行政复议"],ans:"A",exp:"为了防止证据损毁、制止违法行为、避免危害发生及控制危险扩大等情形，行政机关对公民的人身自由和其他组织财务实施暂时性的控制行为属于行政强制措施行为。包括：冻结存款、汇款；扣押财物；查封场所、设施或财物；限制公民人身自由。"},
      {q:"55. 某药品零售企业对药品监督管理部门对其做出的罚款5万元，并责令停业整顿的处罚决定不服，可在规定时间内，向上级行政主管部门提出的申请是",opts:["A.行政强制措施","B.行政强制执行","C.行政处罚","D.行政复议"],ans:"D",exp:"公民、法人或者其他组织认为行政主体的行政行为侵犯其合法权益，依法向行政复议机关提出行政复议申请。可以申请行政复议申请的情形，举例：对行政机关作出的行政处罚决定、行政强制措施、行政强制执行决定不服的。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"56. 不得在药品零售企业销售的药品是",opts:["A.麦角新碱注射液","B.碳酸钙D3片","C.盐酸氟西汀胶囊(抗抑郁药)","D.维生素C片"],ans:"A",exp:"药品零售企业不得经营麻醉药品、放射性药品、第一类精神药品、终止妊娠药品（包括含有“米非司酮”成分的所有药品制剂）、蛋白同化制剂、肽类激素（胰岛素除外）、药品类易制毒化学品、体内诊断试剂、体外诊断试剂（药品）以及我国法律法规规定的其他禁止零售的药品。麦角新碱注射液属于药品类易制毒化学品。"},
      {q:"57. 药品零售企业可以销售，但必须凭处方销售的药品是",opts:["A.麦角新碱注射液","B.碳酸钙D3片","C.盐酸氟西汀胶囊(抗抑郁药)","D.维生素C片"],ans:"C",exp:"药品零售企业必须做到严格凭处方销售：所有注射剂、医疗用毒性药品、第二类精神药品、禁止零售的药品以外其他按兴奋剂管理的药品、精神障碍治疗药（抗精神病、抗焦虑、抗躁狂、抗抑郁药）、抗病毒药（逆转录酶抑制剂和蛋白酶抑制剂）、肿瘤治疗药、含麻醉药品的复方口服溶液、部分激素和抗菌药（未列入非处方药目录的品种）等。盐酸氟西汀胶囊（抗抑郁药）属于必须凭处方销售的药品，碳酸钙D3片、维生素C片均为非处方药。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"58. 按照可疑即报原则，直接通过国家药品不良反应监测系统报告发现或获知药品不良反应的是",opts:["A.药品上市许可持有人","B.医疗机构及个人","C.药品经营企业","D.药品不良反应监测中心"],ans:"A",exp:"药品上市许可持有人报告获知的所有不良反应，按照可疑即报原则，直接通过国家药品不良反应监测系统报告发现或获知的药品不良反应。"},
      {q:"59. 直接向药品上市许可持有人报告发现或获知的药品不良反应的是",opts:["A.药品上市许可持有人","B.医疗机构及个人","C.药品经营企业","D.药品不良反应监测中心"],ans:"C",exp:"药品经营企业直接向药品上市许可持有人报告发现或获知的药品不良反应。"},
      {q:"60. 通过药品不良反应监测系统报告发现或获知的药品不良反应，也可向药品上市许可持有人直接报告的是",opts:["A.药品上市许可持有人","B.医疗机构及个人","C.药品经营企业","D.药品不良反应监测中心"],ans:"B",exp:"医疗机构及个人通过药品不良反应监测系统报告发现或获知的药品不良反应，也可向药品上市许可持有人直接报告。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"61. 药品批发企业，中药材、中药饮片应",opts:["A.分开储存","B.分库储存","C.分区陈列","D.集中存放"],ans:"B",exp:"企业应当根据药品的质量特性对药品进行储存，药品与非药品、外用药与其他药品分开储存，中药材和中药饮片分库储存；特殊管理的药品应当按照国家有关规定储存；零货药品应当集中存放。"},
      {q:"62. 药品零售企业，处方药、非处方药应",opts:["A.分开储存","B.分库储存","C.分区陈列","D.集中存放"],ans:"C",exp:"药品零售企业陈列药品应当符合：处方药、非处方药分区陈列，并有处方药、非处方药专用标识。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"63. 用于治疗轻度感染首选的抗菌药物是",opts:["A.非限制使用级抗菌药物","B.限制使用级抗菌药物","C.特殊使用级抗菌药物","D.非特殊使用级抗菌药物"],ans:"A",exp:"用于预防感染、轻度感染、局部感染首选非限制使用级抗菌药物。"},

    {type:"配伍选择题",subs:[
      {q:"76. 对麻醉药品的药品生产企业的检查频次是",opts:["A.每季度不少于1次","B.每半年不少于1次","C.每年不少于1次","D.每3年不少于1次"],ans:"A",exp:"省级药品监督管理部门应当根据药品品种、剂型、管制类别等特点，结合国家药品安全总体情况、药品安全风险警示信息、重大药品安全事件及其调查处理信息等，以及既往检查、检验、不良反应监测、投诉举报等情况确定检查频次：对麻醉药品、第一类精神药品、药品类易制毒化学品生产企业每季度检查不少于一次。"},

      {q:"78. 对第一类精神药品的药品经营企业的检查频次是",opts:["A.每季度不少于1次","B.每半年不少于1次","C.每年不少于1次","D.每3年不少于1次"],ans:"B",exp:"对麻醉药品和第一类精神药品、药品类易制毒化学品经营企业检查，每半年不少于1次。"}

    {type:"配伍选择题",subs:[

    {type:"配伍选择题",subs:[
      {q:"81. 兴奋剂目录发布执行后的第9个月首日起，药品生产企业所生产的含兴奋剂目录新列入物质的药品，必须在包装标识或产品说明书上标注的是",opts:["A.“运动员慎用”字样","B.“请仔细阅读说明书并按说明使用或在药师指导下购买和使用”","C.“请在医师或者临床营养师指导下使用”","D.“请仔细阅读说明书并在医师指导下使用”"],ans:"A",exp:"兴奋剂目录发布执行后的第9个月首日起，药品生产企业所生产的含兴奋剂目录新列入物质的药品，必须在包装标识或产品说明书上标注“运动员慎用”字样。"},
      {q:"82. 注册号为“国食注字TY+4位年号+4位顺序号”，其广告应当显著标明的是",opts:["A.“运动员慎用”字样","B.“请仔细阅读说明书并按说明使用或在药师指导下购买和使用”","C.“请在医师或者临床营养师指导下使用”","D.“请仔细阅读说明书并在医师指导下使用”"],ans:"C",exp:"特殊医学用途配方食品注册号的格式为：国食注字TY+4位年号+4位顺序号，其中TY代表特殊医学用途配方食品。特殊医学用途配方食品广告应当显著标明适用人群：“不适用于非目标人群使用”“请在医师或者临床营养师指导下使用”。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"83. 根据行政处罚的裁量，不予处罚的情形是",opts:["A.受到他人胁迫，违法销售药品的","B.违法行为在1年内没有被发现的","C.药品生产企业生产的中药注射剂属于劣药的","D.不满十四周岁的未成年人有违法行为的"],ans:"D",exp:"不满十四周岁的未成年人有违法行为的，不予行政处罚，但责令监护人加以管教。违法行为在2年内没有被发现的，不再给予行政处罚。"},

      {q:"85. 根据行政处罚的裁量，应当从重处罚的情形是",opts:["A.受到他人胁迫，违法销售药品的","B.违法行为在1年内没有被发现的","C.药品生产企业生产的中药注射剂属于劣药的","D.不满十四周岁的未成年人有违法行为的"],ans:"C",exp:"生产、销售、使用的生物制品、注射剂属于假药、劣药的情形应当从重行政处罚。"}
    ]},

    // ===== 三、综合分析选择题（86-95） =====
    {type:"最佳选择题",q:"86. 下列关于S大药房申请医保定点零售药店应具备的条件，说法错误的是",opts:["A.至少有1名取得执业药师资格证书或具有药学、临床药学、中药学专业技术资格证书的药师，且注册地在该零售药店所在地","B.在注册地址正式经营至少3个月","C.至少有1名熟悉医疗保障法律法规和相关制度规定的专（兼）职医保管理人员负责管理医保费用","D.按药品经营质量管理规范要求，开展药品分类分区管理，并对所售药品设立明确的医保用药标识"],ans:"C",exp:"申请医保定点的零售药店应当具备的条件：取得药品经营许可证，并同时符合以下条件：①在注册地址正式经营至少3个月；②至少有1名取得执业药师资格证书或具有药学、临床药学、中药学专业技术资格证书的药师，且注册地在该零售药店所在地，药师须签订1年以上劳动合同且在合同期内；③至少有2名熟悉医疗保障法律法规和相关制度规定的专（兼）职医保管理人员负责管理医保费用，并签订1年以上劳动合同且在合同期内；④按药品经营质量管理规范要求，开展药品分类分区管理，并对所售药品设立明确的医保用药标识；⑤具有符合医保协议管理要求的医保药品管理制度、财务管理制度、医保人员管理制度、统计信息管理制度和医保费用结算制度；⑥具备符合医保协议管理要求的信息系统技术和接口标准，实现与医保信息系统有效对接，为参保人员提供直接联网结算，建立医保药品等基础数据库，按规定使用国家统一医保编码；⑦符合法律法规和省级及以上医疗保障行政部门规定的其他条件。"},
    {type:"最佳选择题",q:"87. 参保人员凭定点医药机构处方在定点零售药店购买医保目录内药品发生的费用可由统筹基金按规定支付。下列关于《基本医疗保险药品目录》药品分类、支付的说法不正确的是",opts:["A.除中药饮片外，原则上新纳入《药品目录》的药品同步确定支付标准","B.国家《药品目录》中的西药和中成药分为“甲类药品”和“乙类药品”，其中，协议期内谈判药品按照乙类支付","C.医保药品目录中列出了基本医疗保险、工伤保险和生育保险基金准予支付的中药饮片，同时列出了不得纳入基金支付的饮片范围","D.《药品目录》中，“乙类药品”个人先行自付的比例由国家医疗保障行政部门确定"],ans:"D",exp:"国家《药品目录》中的西药和中成药分为“甲类药品”和“乙类药品”。参保人使用“甲类药品”按基本医疗保险规定的支付标准及分担办法支付；使用“乙类药品”按基本医疗保险规定的支付标准，先由参保人自付一定比例后，再按基本医疗保险规定的分担办法支付。“乙类药品”个人先行自付的比例由省级或统筹地区医疗保障行政部门确定。"},
    {type:"最佳选择题",q:"88. 根据抗菌药物的使用分级，上述材料中关于头孢哌酮舒巴坦钠治疗疾病的使用指征和要求说法正确的是",opts:["A.用于预防感染，治疗轻度感染或局部感染","B.用于严重感染、免疫功能低下合并感染","C.头孢哌酮舒巴坦钠不得在门诊使用","D.紧急情况下未经会诊同意或确需越处方权限使用的，处方量不得超过1日用量"],ans:"B",exp:"限制级抗菌药头孢哌酮舒巴坦钠用于严重感染、免疫功能低下合并感染，或病原菌只对限制使用级抗菌药物敏感的情形。"},
    {type:"最佳选择题",q:"89. 患者出现严重腹泻（每日8-10次水样便），伴腹痛、发热，确诊为艰难梭菌感染相关性腹泻，导致住院时间延长。该不良反应属于",opts:["A.严重药品不良反应","B.新的药品不良反应","C.群体不良反应","D.一般不良反应"],ans:"A",exp:"严重药品不良反应包括：导致死亡；导致住院或住院时间延长；致畸、致癌、致出生缺陷；导致危及生命；导致显著的（永久的）人体伤残或器官功能的损伤。"},
    {type:"最佳选择题",q:"90. 乙企业获得网络销售资格的报告部门为",opts:["A.省级药品监督管理部门","B.市县级药品监督管理部门","C.互联网信息管理部门","D.国家药品监督管理部门"],ans:"B",exp:"药品网络销售企业应当填写“药品网络销售企业报告信息表”，向药品监督管理部门报告企业名称、药品生产许可证或者药品经营许可证、网站名称、应用程序名称、IP地址、域名等信息。药品上市许可持有人、药品批发企业向所在地省级药品监督管理部门报告；药品零售企业向所在地市县级药品监督管理部门报告。题中乙企业为药品零售连锁企业门店，应当向市县级药品监督管理部门报告。"},
    {type:"最佳选择题",q:"91. 根据《药品网络销售监督管理办法》规定，下列药品不得在乙企业的网店销售的是",opts:["A.胰岛素注射液","B.桑菊感冒片","C.中药饮片雄黄","D.复方对乙酰氨基酚片"],ans:"C",exp:"根据《药品管理法》第六十一条，明确禁止非法网络销售的药品有：麻醉药品、精神药品、医疗用毒性药品、放射性药品、药品类易制毒化学品、血液制品、疫苗、医疗机构制剂、中药配方颗粒。题中中药饮片雄黄为医疗用毒性中药品种，不得网络销售。"},
    {type:"最佳选择题",q:"92. 甲企业制定了统一的药品配送质量管理制度和评审制度，并配备了专职人员负责本连锁药品配送质量管理工作。下列药品零售配送的规定，不正确的是",opts:["A.每年至少开展一次零售配送的内审，委托配送的开展外审","B.寄递配送单至少需载明药品零售企业名称及联系方式、配送企业名称及联系方式、药品储存要求（如常温、阴凉、冷藏、冷冻等）等信息，寄递配送单可做封签使用","C.配送药品的车辆应当为封闭式运输工具，车厢内设置有带物理隔离的药品专门存放区域","D.配送需要冷藏冷冻的生物制品时，确需中转暂存的，储存场所应当符合药品贮藏要求"],ans:"D",exp:"药品零售企业配送冷藏、冷冻药品的人员配备要求、设施设备与配送过程应当符合GSP的相关规定，且冷藏、冷冻药品在配送途中严禁中转暂存。"},
    {type:"最佳选择题",q:"93. 药店拟经营电子血压计、无菌医用手套、体温计等产品属于第几类医疗器械",opts:["A.第一类医疗器械","B.第二类医疗器械","C.第三类医疗器械","D.第四类医疗器械"],ans:"B",exp:"第二类医疗器械有血压计、体温计、脑电图机、心电图机、（中医用）针灸针、助听器、避孕套、避孕帽、无菌医用手套、手术显微镜、皮肤吻合器、医学影像处理软件等。"},
    {type:"最佳选择题",q:"94. 药店拟经营电子血压计、无菌医用手套、体温计等产品需要申报的方式为",opts:["A.向市级药品监督管理部门备案","B.经市级药品监督管理部门许可","C.不需许可和备案，直接经营","D.向省级药品监督管理部门备案"],ans:"A",exp:"第二类医疗器械经营分类管理要求为：向市级药品监督管理部门备案。"},
    {type:"最佳选择题",q:"95. 对于风险程度较低的医疗器械经营企业，经营监管级别属于",opts:["A.一级监管","B.二级监管","C.三级监管","D.四级监管"],ans:"A",exp:"风险程度较低的企业：除二、三、四级监管以外的其他医疗器械经营企业。县级负责药品监督管理的部门每年随机抽取本行政区域25%以上的企业进行监督检查，4年达到全覆盖。必要时，对新增经营业态的企业进行现场核查。"},

    // ===== 四、多项选择题（96-100） =====
    {type:"多项选择题",q:"96. 根据《药品管理法》的有关规定，经国家药品监督管理局或国务院授权的省级人民政府批准，医疗机构可以进口临床急需少量药品，上述临床急需少量药品的应当满足的条件包括",opts:["A.用于治疗罕见病的","B.用于防治严重危及生命疾病且尚无有效治疗或预防手段的","C.用于防治严重危及生命疾病且具有明显临床优势的药品","D.用于治疗细菌感染引起的各类重症疾病的"],ans:"ABC",exp:"根据《药品管理法》的有关规定，医疗机构因临床急需进口少量药品的，经国家药品监督管理局或国务院授权的省级人民政府批准，可以进口。适用药品范围：国内无注册上市、无企业生产或短时期内无法恢复生产的境外已上市临床急需少量药品。临床急需少量药品应当满足以下条件之一：①用于治疗罕见病的；②用于防治严重危及生命疾病且尚无有效治疗或预防手段的；③用于防治严重危及生命疾病且具有明显临床优势的药品。"},
    {type:"多项选择题",q:"97. 下列关于医疗用毒性药品管理的说法，正确的有",opts:["A.红粉、水银、阿托品均为西药毒性药品品种","B.毒性药品每次配料，必须经二人以上复核无误，并详细记录每次生产所用原料和成品数，经手人要签字备查","C.药品零售企业不得经营注射用A型肉毒毒素","D.对处方未注明“生用”的毒性中药，应当付炮制品"],ans:"BCD",exp:"①红粉、水银为中药毒性药品品种。②毒性药品每次配料，必须经二人以上复核无误，并详细记录每次生产所用原料和成品数，经手人要签字备查。③注射用A型肉毒毒素，未经指定的药品经营企业不得购销；药品零售企业不得经营。④对处方未注明“生用”的毒性中药，应当付炮制品。"},
    {type:"多项选择题",q:"98. 下列关于《药品生产许可证》分类码的说法，正确的有",opts:["A.大写字母A代表自行生产的药品上市许可持有人","B.大写字母C代表接受委托的药品生产企业","C.大写字母B代表委托生产的药品上市许可持有人","D.大写字母D代表原料药生产企业"],ans:"ABCD",exp:"《药品生产许可证》分类码包含大写字母和小写字母，其中大写字母用于归类药品上市许可持有人和产品类型，小写字母用于区分制剂属性。大写字母：A代表自行生产的药品上市许可持有人、B代表委托生产的药品上市许可持有人、C代表接受委托的药品生产企业、D代表原料药生产企业。"},
    {type:"多项选择题",q:"99. 根据我国关于广告的有关规定，下列可以成为广告申请人的有",opts:["A.经持有人授权同意的药品经营企业","B.药品上市许可持有人","C.持有保健食品备案凭证的企业","D.医疗器械的使用单位"],ans:"ABC",exp:"药品、医疗器械、保健食品和特殊医学用途配方食品注册证明文件或备案凭证持有人及其授权同意的生产、经营企业可以申请发布广告。"},
    {type:"多项选择题",q:"100. 在进行处方书写时，符合书写要求的情形包括",opts:["A.使用规范的中文、英文、拉丁文书号处方的用法用量","B.使用规范的中文名称书写药品名称，没有中文名称的可书写规范的英文名称","C.可以使用“遵医嘱”的方式告知患者用法用量","D.用法用量中不得出现“自用”字样"],ans:"ABD",exp:"药品用法可用规范的中文、英文、拉丁文或者缩写体书写但不得使用“遵医嘱”“自用”等含糊不清字句。"}
  ]
},
  {
  name: "押题密卷（四）",
  questions: [
    // ===== 一、最佳选择题（1-40） =====
    {type:"最佳选择题",q:"1. 根据《药品管理法》第二十九条规定，列入国家药品标准的药品名称为",opts:["A.药品通用名称","B.药品商品名称","C.化学名称","D.专利药名"],ans:"A",exp:"《药品管理法》第二十九条规定，列入国家药品标准的药品名称为药品通用名称。"},
    {type:"最佳选择题",q:"2. 除急救、抢救用药外，下列关于独家生产品种纳入国家基本药物目录的说法，正确的是",opts:["A.需要价格谈判","B.需要单独论证","C.不得纳入目录","D.可优先纳入目录"],ans:"B",exp:"除急救、抢救用药外，独家生产品种纳入国家基本药物目录应当经过单独论证。"},
    {type:"最佳选择题",q:"3. 下列均属于部门规章的是",opts:["A.《疫苗管理法》《药品注册管理办法》","B.《药品生产监督管理办法》《放射性药品管理办法》","C.《药品经营质量管理规范》《药品经营和使用质量监督管理办法》","D.《易制毒化学品管理条例》《药品说明书和标签管理规定》"],ans:"C",exp:"A选项《疫苗管理法》属于法律；B选项《放射性药品管理办法》属于行政法规；D选项《易制毒化学品管理条例》属于行政法规。"},
    {type:"最佳选择题",q:"4. 承担生物制品批签发相关工作的专业机构是",opts:["A.中国食品药品检定研究院","B.国家药品监督管理局药品审评中心","C.国家药品监督管理局食品药品审核查验中心","D.国家药品监督管理局药品评价中心"],ans:"A",exp:"中国食品药品检定研究院承担生物制品批签发相关工作。"},
    {type:"最佳选择题",q:"5. 下列不属于行政处罚的是",opts:["A.没收违法所得","B.吊销许可证件","C.行政拘留","D.罚金"],ans:"D",exp:"罚金属于刑事责任，罚款才属于行政处罚。"},
    {type:"最佳选择题",q:"6. 执业药师的执业单位不包括",opts:["A.药品批发企业","B.药品生产企业","C.药品使用单位","D.药品检验机构"],ans:"D",exp:"执业药师执业单位为药品生产、经营（含批发和零售）、使用及其他需要提供药学服务的单位。药品检验机构不属于执业药师的执业单位。"},
    {type:"最佳选择题",q:"7. 经调查评估后，确定药品存在质量问题或者其他安全隐患的，应当立即决定并实施召回。持有人作出药品一级召回决定的，应当发出召回通知，通知到药品生产企业、药品经营企业、药品使用单位，该通知时限是",opts:["A.1日内","B.3日内","C.7日内","D.10个工作日内"],ans:"A",exp:"持有人作出药品召回决定的，一级召回在1日内，二级召回在3日内，三级召回在7日内，应当发出召回通知，通知到药品生产企业、药品经营企业、药品使用单位等，同时向所在地省级药品监督管理部门备案调查评估报告、召回计划和召回通知。"},
    {type:"最佳选择题",q:"8. 关于药品再注册的说法错误的是",opts:["A.境内生产药品上市许可持有人应当在药品注册证书有效期届满前6个月提交药品再注册申请","B.境外生产药品再注册申请应当在药品注册证书有效期届满前6个月由持有人向药品审评中心提出","C.药品注册证书有效期为5年","D.制剂选用未在原辅包登记平台登记、相关研究资料随药品制剂注册申请一并提交的化学原料药，关联审评审批通过后，该化学原料药再注册随关联制剂一起完成"],ans:"A",exp:"境内生产药品上市许可持有人应当在药品注册证书有效期届满前12个月至6个月期间，提交药品再注册申请，而非前6个月。"},
    {type:"最佳选择题",q:"9. 温湿度自动监测系统应当自动对药品储存运输过程中的温湿度进行不间断监测和记录，测点温湿度数据的采集频率是",opts:["A.每分钟至少更新1次","B.每2分钟至少更新1次","C.每5分钟至少更新1次","D.每30分钟至少更新1次"],ans:"A",exp:"温湿度自动监测系统应当自动对药品储存运输过程中的温湿度进行不间断监测和记录，测点温湿度数据每分钟至少更新采集1次。"},
    {type:"最佳选择题",q:"10. 关于药品零售企业经营和质量管理人员的资质要求，说法正确的是",opts:["A.质量管理、验收、采购人员应当具有药学或者医学、生物、化学等相关专业学历或者药学专业技术职称","B.处方调配人员应当是执业药师","C.中药饮片调剂人员应当具备中药调剂员资格","D.中药饮片质量管理、验收、采购人员应当具有药学中专以上学历或者具有药学专业中级以上专业技术职称"],ans:"A",exp:"药品零售企业处方审核人员应当是执业药师，不是处方调配人员；中药饮片调剂人员应当具有中药学中专以上学历或者具备中药调剂员资格，两个条件符合一个即可；中药饮片质量管理、验收、采购人员应当具有中药学中专以上学历或者具有中药学专业初级以上专业技术职称。"},
    {type:"最佳选择题",q:"11. 负责审批药品零售连锁企业门店《药品经营许可证》的部门是",opts:["A.国家药品监督管理局","B.省级药品监督管理部门","C.市县级药品监督管理部门","D.省级卫生健康部门"],ans:"C",exp:"药品批发企业、药品零售连锁企业总部的经营许可由省级药品监督管理部门负责审批，药品零售企业（含药品零售连锁企业门店）的经营许可由市县级药品监督管理部门负责审批。"},
    {type:"最佳选择题",q:"12. 下列行为中受托方可以再次委托的是",opts:["A.持有人委托生产药品","B.持有人委托销售药品","C.持有人委托储存药品","D.持有人委托运输药品"],ans:"D",exp:"受托方不得再次委托生产、销售和储存。受托方再次委托运输的，应当征得委托方同意，并签订质量保证协议，确保药品运输过程符合药品GSP的要求。疫苗、麻醉药品、精神药品、医疗用毒性药品、放射性药品、药品类易制毒化学品等特殊管理的药品以及中药配方颗粒不得再次委托运输。"},
    {type:"最佳选择题",q:"13. 属于药品批发企业的严重缺陷项目，但不属于药品零售企业的严重缺陷项目的是",opts:["A.购进药品索取发票","B.储存疫苗配备2个以上独立冷库","C.经营条件与经营范围规模相适应","D.经营场所配备冷藏药品专用陈列设备"],ans:"B",exp:"A选项属于药品批发企业和药品零售企业共有的严重缺陷项目，C选项和D选项是只属于药品零售企业的严重缺陷项目。"},
    {type:"最佳选择题",q:"14. 关于药品上市许可持有人的经营行为，不符合要求的是",opts:["A.以展销会、博览会、交易会、订货会、产品宣传会等方式签订药品购销合同","B.未取得药品经营许可证从事药品批发活动","C.按规定直接向药品零售连锁企业总部销售药品","D.授权派出医药代表从事学术推广、技术咨询、药品销售等活动"],ans:"D",exp:"药品上市许可持有人可授权派出医药代表从事学术推广、技术咨询等活动，但不得要求其承担药品销售任务（包括价格谈判）。"},
    {type:"最佳选择题",q:"15. 执业药师或其他药学技术人员应当根据个人消费者咨询需求，提供科学合理的用药指导是当药品零售企业销售",opts:["A.处方药时","B.非处方药时","C.甲类非处方药时","D.乙类非处方药时"],ans:"D",exp:"销售甲类非处方药时，执业药师应当主动向个人消费者提供用药指导；销售乙类非处方药时，执业药师或其他药学技术人员应当根据个人消费者咨询需求，提供科学合理的用药指导。"},
    {type:"最佳选择题",q:"16. 关于临床急需少量药品批准进口要求的说法，错误的是",opts:["A.医疗机构因临床急需进口少量药品的，经国务院批准方可进口","B.进口的药品应当在指定的医疗机构内用于特定医疗目的，不得擅自扩大使用单位或使用目的","C.鉴于氯巴占属于国家麻醉药品和精神药品品种目录中第二类精神药品，进口时还需要向国家药品监督管理局申请进口准许证","D.医疗机构应当与经营企业签订协议，经营企业应当与境外生产企业签订协议，明确双方责任，保证药品质量"],ans:"A",exp:"医疗机构因临床急需进口少量药品的，经国家药品监督管理局或国务院授权的省级人民政府批准，可以进口。"},
    {type:"最佳选择题",q:"17. 关于医疗机构制剂管理的说法，错误的是",opts:["A.医疗机构配制的制剂，应当是本单位临床需要而市场上没有供应的品种","B.制剂室负责人、药检室负责人、制剂质量管理组织负责人应当为本单位在职药学专业人员，且制剂室负责人和药检室负责人不得互相兼任","C.《医疗机构制剂许可证》有效期为5年，分正本和副本，具有同等法律效力","D.《医疗机构制剂许可证》变更分为许可事项变更和登记事项变更，许可事项变更是指医疗机构名称、配制地址、配制范围的变更"],ans:"D",exp:"《医疗机构制剂许可证》变更分为许可事项变更和登记事项变更，许可事项变更是指制剂室负责人、配制地址、配制范围的变更。医疗机构名称的变更属于登记事项变更。"},
    {type:"最佳选择题",q:"18. 关于抗肿瘤药物临床应用管理的说法，错误的是",opts:["A.抗肿瘤药物，是指通过细胞杀伤、免疫调控、内分泌调节等途径，在细胞、分子水平进行作用，达到抑制肿瘤生长或消除肿瘤的药物，一般包括化学治疗药物、分子靶向治疗药物、免疫治疗药物、内分泌治疗药物等","B.医疗机构应当建立抗肿瘤药物管理组织并配备专职人员负责本机构的抗肿瘤药物管理工作，建立健全本机构抗肿瘤药物管理工作制度","C.医疗机构抗肿瘤药物应当由药学部门统一采购供应，其他科室或部门不得从事抗肿瘤药物的采购、调剂活动","D.抗肿瘤药物临床应用实行分级管理。根据安全性、可及性、经济性等因素，将抗肿瘤药物分为限制使用级和普通使用级"],ans:"B",exp:"医疗机构应当建立抗肿瘤药物管理组织或由专（兼）职人员负责本机构的抗肿瘤药物管理工作，建立健全本机构抗肿瘤药物管理工作制度。可由专（兼）职人员负责，并非要求必须专职人员负责。"},
    {type:"最佳选择题",q:"19. 处方点评结果分为合理处方和不合理处方。其中，不合理处方不包括",opts:["A.不规范处方","B.超常处方","C.用药不适宜处方","D.不合法处方"],ans:"D",exp:"不合理处方包括不规范处方、用药不适宜处方及超常处方。"},
    {type:"最佳选择题",q:"20. 《中药材生产质量管理规范》是中药材规范化生产和质量管理的基本要求，其英文是",opts:["A.Good Supply Practice","B.Good Clinical Practice","C.Good Agricultural Practice","D.Good Manufacture Practice"],ans:"C",exp:"《中药材生产质量管理规范》（Good Agricultural Practice，GAP）是中药材规范化生产和质量管理的基本要求。"},
    {type:"最佳选择题",q:"21. 首次进口药材需要取得进口药材批件，发给一次性进口药材批件的部门是",opts:["A.国家药品监督管理局","B.省级药品监督管理部门","C.省级卫生健康管理部门","D.口岸药品监督管理部门"],ans:"B",exp:"省级药品监督管理部门对符合要求的，发给一次性进口药材批件。"},
    {type:"最佳选择题",q:"22. 关于医疗机构中药饮片管理规范的说法，正确的是",opts:["A.对存在“十八反”、“十九畏”、妊娠禁忌、超过常用剂量等可能引起用药安全问题的处方，应当由药师确认（“双签字”）或重新开具处方后方可调配","B.二级以上医院应当由主任中药师专业技术人员负责调剂复核工作","C.二级以上医院中药饮片调配后，必须经复核后方可发出，复核率应当达到95%","D.中药饮片调配每剂重量误差应当在±5%以内"],ans:"D",exp:"A应当由处方医师确认（“双签字”）；B应当由主管中药师以上专业技术人员负责调剂复核工作；C复核率应当达到100%；D每剂重量误差应当在±5%以内，正确。"},
    {type:"最佳选择题",q:"23. 关于疫苗采购和配送的说法，错误的是",opts:["A.国家免疫规划疫苗由国务院卫生健康主管部门会同国务院财政部门等组织集中招标或者统一谈判，形成并公布中标价格或者成交价格，各省、自治区、直辖市实行统一采购","B.疫苗上市许可持有人应当按照采购合同约定，向疾病预防控制机构和接种单位供应疫苗","C.疫苗上市许可持有人、疾病预防控制机构可以自行配送疫苗，也可以委托符合条件的疫苗配送单位配送疫苗","D.疫苗上市许可持有人委托配送疫苗的，在同一省级行政区域内选取疫苗区域配送企业原则上不得超过2家"],ans:"B",exp:"疫苗上市许可持有人应当按照采购合同约定，向疾病预防控制机构供应疫苗。疾病预防控制机构应当按照规定向接种单位供应疫苗。疾病预防控制机构以外的单位和个人不得向接种单位供应疫苗，接种单位不得接收该疫苗。"},
    {type:"最佳选择题",q:"24. 药品零售连锁企业经批准可以从事第二类精神药品零售业务，负责审批的部门是",opts:["A.国家药品监督管理局","B.省级药品监督管理部门","C.市级药品监督管理部门","D.县级药品监督管理部门"],ans:"C",exp:"经所在地设区的市级药品监督管理部门批准，实行统一进货、统一配送、统一管理的药品零售连锁企业可以从事第二类精神药品零售业务。"},
    {type:"最佳选择题",q:"25. 下列属于医疗用毒性药品的是",opts:["A.伪麻黄碱","B.杜仲","C.麦角酸","D.洋金花"],ans:"D",exp:"洋金花属于毒性药品中药品种。B选项属于国家二级保护野生药材物种，A和C选项属于药品类易制毒化学品。"},
    {type:"最佳选择题",q:"26. 根据《反不正当竞争法》，通过生成不真实的销量数据、用户好评的“刷单炒信”行为，定义为",opts:["A.虚假宣传行为","B.混淆行为","C.网络不正当竞争行为","D.诋毁商誉行为"],ans:"A",exp:"通过生成不真实的销量数据、用户好评的“刷单炒信”行为，定义为虚假宣传行为。"},
    {type:"最佳选择题",q:"27. 关于履行“三包”或其他责任的义务，说法错误的是",opts:["A.经营者采用网络、电视、电话、邮购等方式销售商品，消费者有权自收到商品之日起7日内退货，除法律规定的情形外，无需说明理由，退回商品的运费由消费者承担","B.经营者应当自收到退回商品之日起7日内返还消费者支付的商品价款","C.经营者提供的商品或者服务不符合质量要求的，消费者可以依照国家规定、当事人约定退货，或者要求经营者履行更换、修理等义务","D.经营者提供的商品或者服务不符合质量要求的，消费者可以自收到商品之日起7日内退货，消费者应当承担运输等必要费用"],ans:"D",exp:"经营者提供的商品或者服务不符合质量要求的，消费者可以自收到商品之日起7日内退货，经营者应当承担运输等必要费用，不是消费者承担。"},
    {type:"最佳选择题",q:"28. 医疗器械注册人、备案人、生产经营企业、使用单位发现或获知导致严重伤害、可能导致严重伤害或死亡的，应当报告的时限要求是",opts:["A.7日内","B.15日内","C.20日内","D.30日内"],ans:"C",exp:"医疗器械注册人、备案人、生产经营企业、使用单位发现或获知导致死亡的可疑不良事件的，应当在7日内报告；导致严重伤害、可能导致严重伤害或死亡的，应当在20日内报告。"},
    {type:"最佳选择题",q:"29. 关于化妆品管理的说法，错误的是",opts:["A.用于染发、烫发、祛斑美白、防晒、防脱发的化妆品以及宣称新功效的化妆品为特殊化妆品","B.国产特殊化妆品注册编号：国妆特字+四位年份数+本年度注册产品顺序数","C.特殊化妆品注册证有效期为5年，有效期届满需要延续注册的，应当在有效期届满30个工作日前提出延续注册的申请","D.化妆品生产许可证有效期为3年"],ans:"D",exp:"化妆品生产许可证有效期为5年。"},
    {type:"最佳选择题",q:"30. 首次进口的保健食品中属于补充维生素、矿物质等营养物质的，应当报",opts:["A.国务院食品安全监督管理部门注册","B.国务院食品安全监督管理部门备案","C.省级食品安全监督管理部门注册","D.省级食品安全监督管理部门备案"],ans:"B",exp:"使用保健食品原料目录以外原料的保健食品和首次进口的保健食品应当经国务院食品安全监督管理部门注册。但是，首次进口的保健食品属于补充维生素、矿物质等营养物质的，应当报国务院食品安全监督管理部门备案。其他保健食品应当报省级食品安全监督管理部门备案。"},
    {type:"最佳选择题",q:"31. 关于婴幼儿配方乳粉产品配方的界定、注册与生产管理，说法错误的是",opts:["A.婴幼儿配方乳粉产品配方，是指生产婴幼儿配方乳粉使用的食品原料、食品添加剂及其使用量，以及产品中营养成分的含量","B.婴幼儿配方乳粉产品配方注册证书有效期为5年","C.婴幼儿配方乳粉产品配方注册号格式为：国食注字TY+四位年代号+四位顺序号","D.婴幼儿配方乳粉的产品配方应当经国务院食品安全监督管理部门注册"],ans:"C",exp:"婴幼儿配方乳粉产品配方注册号格式为：国食注字YP+四位年代号+四位顺序号。"},
    {type:"最佳选择题",q:"32. 下列药品认定为假药的是",opts:["A.变质的药品","B.被污染的药品","C.超过有效期的药品","D.未注明产品批号的药品"],ans:"A",exp:"变质的药品认定为假药。其他选项均认定为劣药。"},
    {type:"最佳选择题",q:"33. 以生产、销售、提供假、劣药的共同犯罪论处的情形不包括",opts:["A.明知他人生产、销售、提供假药、劣药，而提供生产、经营场所、设备或者运输、储存、保管、邮寄、网络销售渠道等便利条件的","B.明知他人生产、销售、提供假药、劣药，而提供资金、贷款、账号、发票、证明、许可证件的","C.明知药品为假药、劣药，仍然进行广告宣传及销售的","D.明知他人生产、销售、提供假药、劣药，而提供生产技术或者原料、辅料、包装材料、标签、说明书的"],ans:"C",exp:"以生产、销售、提供假、劣药的共同犯罪论处的情形应当是明知他人生产、销售、提供假药、劣药，而提供相应便利，C只属于销售假、劣药，不属于共同犯罪的情形。"},
    {type:"最佳选择题",q:"34. 以加工、提炼制毒物品制造毒品为目的，购买麻黄碱类复方制剂，或者运输、携带、寄递麻黄碱类复方制剂进出境，构成犯罪的，应承担的法律责任为",opts:["A.以制造毒品罪定罪处罚","B.以非法买卖制毒物品罪定罪处罚","C.以走私制毒物品罪定罪处罚","D.以非法经营罪定罪处罚"],ans:"A",exp:"以加工、提炼制毒物品制造毒品为目的，购买麻黄碱类复方制剂，或者运输、携带、寄递麻黄碱类复方制剂进出境的，依照《刑法》第三百四十七条规定，以制造毒品罪定罪处罚。"},
    {type:"最佳选择题",q:"35. 药品生产企业、药品经营企业、医疗机构拒不配合召回的，处",opts:["A.一万元以上十万元以下的罚款","B.十万元以上五十万元以下的罚款","C.十万元以上二十万元以下的罚款","D.五十万元以上一百万元以下的罚款"],ans:"B",exp:"药品生产企业、药品经营企业、医疗机构拒不配合召回的，处十万元以上五十万元以下的罚款。"},
    {type:"最佳选择题",q:"36. 下列关于仿制药质量和疗效一致性评价的说法，错误的是",opts:["A.参比制剂由国家药品监督管理局征询专家意见后确定，可以选择原研药品，也可以选择国际公认的同种药品","B.在规定期限内未通过质量一致性评价的仿制药，不予再注册","C.化学药品新注册分类实施前批准上市的各基本药物品种在内的仿制药，自首家品种通过一致性评价后，其他药品生产企业的相同品种原则上应在2年内完成一致性评价","D.通过质量一致性评价的品种，药品监督管理部门允许其在说明书和标签上予以标注"],ans:"C",exp:"化学药品新注册分类实施前批准上市的含基本药物品种在内的仿制药，自首家品种通过一致性评价后，其他药品生产企业的相同品种原则上应在3年内完成一致性评价。"},
    {type:"最佳选择题",q:"37. 下列关于药品不良反应的说法，错误的是",opts:["A.药品不良事件不同于药品不良反应，它通常指药品作用于机体，除发挥治疗功效外，有时还会产生某些与药品治疗目的无关的对人体有损害的反应，它不以“合格药品”为前提条件","B.药品上市许可持有人是药品安全责任的主体，应当开展药品上市后不良反应监测，主动收集、跟踪分析疑似药品不良反应信息，对已识别风险的药品及时采取风险控制措施","C.个例药品不良反应的收集和报告是药品不良反应监测工作的基础，也是药品上市许可持有人应履行的基本法律责任","D.医疗机构应当先通过药品不良反应监测系统报告发现或获知的药品不良反应，再向药品上市许可持有人直接报告"],ans:"D",exp:"医疗机构及个人通过药品不良反应监测系统报告发现或获知的药品不良反应，也可向药品上市许可持有人直接报告。没有要求两个途径都必须报告。"},
    {type:"最佳选择题",q:"38. 下列关于药品生产质量管理规范的要求，错误的是",opts:["A.药品GMP作为质量管理体系的一部分，是药品生产管理、经营管理和质量控制的基本要求","B.设备的设计、选型、安装、改造和维护必须符合预定用途，应当尽可能降低产生污染、交叉污染、混淆和差错的风险，便于操作、清洁、维护，以及必要时进行的消毒或灭菌","C.生产过程中应当尽可能采取措施，防止污染和交叉污染","D.各部门负责人应当确保所有人员正确执行生产工艺、质量标准、检验方法和操作规程，防止偏差的产生"],ans:"A",exp:"药品GMP作为质量管理体系的一部分，是药品生产管理和质量控制的基本要求。"},
    {type:"最佳选择题",q:"39. 下列关于药品质量监督检验的类型的说法，错误的是",opts:["A.药品抽查检验应当按照规定抽样，并不得收取任何费用，抽样购买样品所需费用按照国务院规定列支","B.与已有国家标准收载的同品种使用的检测项目和检测方法一致，或者经审评可评估药品标准科学性、可行性和合理性的，在药品注册检验时可不再进行标准复核","C.生物制品必须经过指定药品检验机构进行指定检验，检验不合格的，不得销售或者进口","D.当事人对药品检验结果有异议的，可以自收到药品检验结果之日起7日内申请复验"],ans:"C",exp:"疫苗类制品、血液制品、用于血源筛查的体外诊断试剂以及国家药品监督管理局规定的其他生物制品必须经过指定药品检验机构进行指定检验，检验不合格的，不得销售或者进口。并非所有生物制品都需要指定检验。"},
    {type:"最佳选择题",q:"40. 关于深化医药卫生体制改革的说法，正确的是",opts:["A.坚持基本医疗卫生事业的公益属性，以提高医疗质量和效率为导向，以非公立医疗机构为主体、公立医疗机构为补充，扩大医疗服务资源供给","B.坚持基本医疗卫生事业的公正属性，以提高医疗质量和效率为导向，以公立医疗机构为主体、非公立医疗机构为补充，扩大医疗服务资源供给","C.坚持基本医疗卫生事业的公益属性，以提高医疗质量和效率为导向，以公立医疗机构为主体、非公立医疗机构为补充，扩大医疗服务资源供给"],ans:"C",exp:"坚持基本医疗卫生事业的公益属性，以提高医疗质量和效率为导向，以公立医疗机构为主体、非公立医疗机构为补充，扩大医疗服务资源供给。"},
