<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>冲刺卷刷题</title><style>*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;max-width:860px;margin:0 auto;padding:16px;padding-bottom:90px;background:#e8f5e0;color:#2c3e50;font-size:17px;line-height:1.8;letter-spacing:0.3px}h1{font-size:22px;text-align:center;color:#2c3e50}.chapter-title{text-align:center;font-size:19px;font-weight:600;color:#3a6b3d;margin:12px 0}.stats{text-align:center;margin-bottom:16px;font-size:15px;color:#5a6b5c}.card{background:#f4fbf0;border-radius:10px;padding:18px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.04)}.q-title{font-weight:600;margin-bottom:14px;line-height:1.9;font-size:18px;color:#1a1a1a}.option{display:block;width:100%;text-align:left;padding:14px 16px;margin:10px 0;border:1px solid #cce8cd;border-radius:8px;background:#fbfef9;cursor:pointer;font-size:17px;line-height:1.6}.option:hover{background:#d8f0da;border-color:#8cc98f}.option.correct{background:#d4edda;border-color:#28a745;color:#155724}.option.wrong{background:#f8d7da;border-color:#dc3545;color:#721c24}.option.disabled{pointer-events:none;opacity:.85}.explanation{display:none;margin-top:12px;padding:12px 16px;background:#eef7ea;border-left:4px solid #8cc98f;border-radius:4px;font-size:16px;line-height:1.8;color:#444}.explanation.show{display:block}.tag{display:inline-block;font-size:13px;background:#d5eccf;color:#3a6b3d;padding:3px 10px;border-radius:10px;margin-bottom:10px}.sub-q{margin:14px 0;padding-left:8px;border-left:3px solid #b8e0b3}.nav-bar{display:none}.nav-btn{flex:1;padding:12px;background:#8cc98f;color:#fff;border:none;border-radius:8px;font-size:15px;cursor:pointer}.nav-btn:hover{background:#76b579}.nav-btn:disabled{background:#c5d5ea;cursor:not-allowed}.chapter-select{text-align:center;margin-bottom:16px}.chapter-select select{padding:10px 14px;font-size:16px;border-radius:8px;border:1px solid #b8e0b3;background:#fbfef9}.quiz-nav{position:fixed;bottom:0;left:0;right:0;background:#f4fbf0;padding:12px 16px;box-shadow:0 -2px 10px rgba(0,0,0,.06);display:flex;gap:10px;align-items:center;justify-content:space-between;z-index:100;max-width:860px;margin:0 auto}.next-btn{padding:14px 24px;background:#8cc98f;color:#fff;border:none;border-radius:8px;font-size:16px;cursor:pointer;flex:1}.next-btn:hover{background:#76b579}.next-btn:disabled{background:#cce8cd;cursor:not-allowed}.progress-text{font-size:15px;color:#5a6b5c;white-space:nowrap}@media(max-width:600px){body{padding:10px;padding-bottom:90px;font-size:16px}.card{padding:14px}.q-title{font-size:17px;line-height:1.85}.option{padding:14px;font-size:16px}.nav-bar{display:none}}{body{padding:8px;padding-bottom:90px}.card{padding:12px}.q-title{font-size:15px}.option{padding:12px;font-size:15px}.nav-bar{display:none}}html,body{overflow-x:hidden;touch-action:pan-y}
#quiz{touch-action:pan-y}.chapter-select{width:100%;max-width:100%;box-sizing:border-box;padding:0 0}

.q-title img{max-width:100%;height:auto}</style></head><body><h1>西药二冲刺卷</h1><div class="chapter-select"><select id="chapterSelect" onchange="switchChapter(this.value)"></select></div><div class="chapter-title" id="chapterTitle"></div><div class="stats" id="stats"></div><div id="quiz"></div><div class="nav-bar"><button class="nav-btn" id="prevBtn" onclick="prevChapter()">上一章</button><button class="nav-btn" id="nextBtn" onclick="nextChapter()">下一章</button></div><script>
var chapters=[
{
  name: "押题密卷（一）",
  questions: [
    // ===== 一、最佳选择题（1-40） =====
    {type:"最佳选择题",q:"1. 对γ-氨基丁酸A型（GABA_A）受体靶向作用较强的非苯二氮䓬类药物是",opts:["A.雷美替胺","B.佐匹克隆","C.苯巴比妥","D.三唑仑","E.地西泮"],ans:"B",exp:"本题考查镇静催眠药的分类与作用机制。非苯二氮䓬类药物包括佐匹克隆、唑吡坦、扎来普隆等，其镇静催眠作用是基于对γ-氨基丁酸A型受体的苯二氮䓬结合位点的激动效应。雷美替胺属于褪黑素类，苯巴比妥属于巴比妥类，三唑仑和地西泮属于苯二氮䓬类。"},
    {type:"最佳选择题",q:"2. 关于左旋多巴临床用药评价的说法，错误的是",opts:["A.是帕金森病对症治疗最有效的药物","B.尤其是运动徐缓相关症状显著应首选","C.口服吸收后广泛分布于体内各组织，有30%～50%进入中枢神经系统","D.未进入中枢的药物在脑外脱羧成多巴胺","E.需与外周多巴脱羧酶抑制剂组成复方制剂"],ans:"C",exp:"左旋多巴口服吸收后广泛分布于体内各组织，有30%～50%到达全身循环，但进入中枢神经系统的药物不到1%，绝大部分在脑外脱羧成多巴胺。"},
    {type:"最佳选择题",q:"3. 第一代抗精神病药物中，诱发癫痫发作风险最高和最低的药物分别是",opts:["A.氯丙嗪、氟哌啶醇","B.氯氮平、氟哌啶醇","C.碳酸锂、氯丙嗪","D.氯丙嗪、阿立哌唑","E.氯丙嗪、舒必利"],ans:"A",exp:"第一代抗精神病药物可诱发癫痫发作，其中以氯丙嗪风险最高，氟哌啶醇风险最低。有癫痫发作史或头部创伤者危险性更高。"},
    {type:"最佳选择题",q:"4. 关于非甾体抗炎药（NSAIDs）作用特点的说法，错误的是",opts:["A.通过抑制中枢前列腺素的合成发挥解热作用","B.产生中等强度的镇痛作用，镇痛作用部位主要在中枢","C.大多数NSAIDs具有抗炎作用，但对乙酰氨基酚几乎没有抗炎作用","D.对肌肉、关节、关节周围的软组织的疼痛和肿胀有一定缓解作用，是风湿病中常用的对症药物","E.通过抑制血小板中血栓素A2(TXA2)的合成，而减少血小板聚集"],ans:"B",exp:"NSAIDs可产生中等程度镇痛作用，镇痛作用部位主要在外周，不是中枢，故B错误。"},
    {type:"最佳选择题",q:"5. 在类风湿关节炎的治疗中，首选的锚定药物是",opts:["A.柳氮磺吡啶","B.吗替麦考酚酯","C.双醋瑞因","D.甲氨蝶呤","E.环磷酰胺"],ans:"D",exp:"在类风湿关节炎的治疗中，甲氨蝶呤是首选的锚定药物。狼疮性肾炎诱导缓解多选用环磷酰胺或吗替麦考酚酯；柳氮磺吡啶多用于炎症性肠病；双醋瑞因用于治疗退行性关节疾病。"},
    {type:"最佳选择题",q:"6. 关于乙酰半胱氨酸药理作用与临床评价的说法，错误的是",opts:["A.通过刺激胃黏膜，引起轻微的恶心，反射性引起支气管黏膜腺体分泌增加，降低痰液黏性，痰液得到稀释而易于咳出","B.黏痰溶解作用在pH7.0时最强，在酸性环境下作用显著减弱","C.具有较强的黏痰溶解作用，还可用于对乙酰氨基酚中毒的解救","D.支气管哮喘、有消化道溃疡病史者慎用","E.口服吸收后在小肠黏膜和肝脏存在首关效应"],ans:"A",exp:"乙酰半胱氨酸属于黏痰溶解剂，其分子中所含巯基能使白色黏痰中的黏多糖蛋白多肽链中的二硫键断裂，还可通过分解核糖核酸酶，使脓性痰中的DNA纤维断裂，故不仅能溶解白色黏痰，还能溶解脓性痰。A项描述的是恶心性祛痰药的作用机制。"},
    {type:"最佳选择题",q:"7. 不推荐小于18岁患者使用，闭角型青光眼、前列腺增生患者需慎用的药物是",opts:["A.布地奈德","B.茶碱","C.噻托溴铵","D.孟鲁司特","E.色甘酸钠"],ans:"C",exp:"噻托溴铵属于M胆碱受体拮抗剂，可引起抗胆碱能效应（口干、便秘、尿潴留、眼内压升高、视物模糊），不推荐小于18岁患者使用，闭角型青光眼、前列腺增生、膀胱颈梗阻、心律失常者慎用。"},
    {type:"最佳选择题",q:"8. 可特异性抑制回肠胆汁酸转运蛋白（IBAT），减少回肠远端胆汁酸的再摄取，从而减轻患者的胆汁淤积性瘙痒症状的药物是",opts:["A.氯马昔巴特","B.考来烯胺","C.熊去氧胆酸","D.硫普罗宁","E.多烯磷脂酰胆碱"],ans:"A",exp:"氯马昔巴特属于回肠胆汁酸转运蛋白（IBAT）抑制剂，可通过抑制回肠远端胆汁酸的再摄取，增加胆汁酸通过结肠的清除，降低血清中胆汁酸的浓度，减轻患者的胆汁淤积性瘙痒症状。"},
    {type:"最佳选择题",q:"9. 患者，男，35岁，计划长途航海旅行，既往有严重晕船史。可选用的易通过血脑屏障发挥抗晕动病作用的药物是",opts:["A.丁溴东莨菪碱","B.多潘立酮","C.东莨菪碱","D.山莨菪碱","E.阿瑞匹坦"],ans:"C",exp:"东莨菪碱属于抗胆碱M受体药，易通过血-脑屏障和胎盘屏障，对呼吸中枢具有兴奋作用，但对大脑皮层有明显的抑制作用，有镇静、催眠作用，此外还能抗晕船、晕车，可用于全身麻醉前给药、预防和控制晕动病等。"},
    {type:"最佳选择题",q:"10. 葡醛内酯具有保护肝脏和解毒作用，其作用机制是",opts:["A.促进肝细胞膜再生，起到稳定、保护、修复细胞膜的作用","B.参与体内三羧酸循环及糖代谢，能改善肝脏的合成，有解毒、灭活激素等功能","C.转变为葡萄糖醛酸，与含有酚基、羟基、羧基和氨基的代谢产物、毒物或药物结合，形成无毒的葡萄糖醛酸结合物，经尿中排出","D.提供硫基解毒和保护肝细胞作用","E.广泛抑制各种炎症通路介导的肝脏炎症反应，减轻肝脏的病理损害"],ans:"C",exp:"葡醛内酯在体内转变为葡萄糖醛酸，后者是人体内重要的解毒物质之一，能与肝脏或肠内含有酚基、羟基、羧基和氨基的代谢产物、毒物或药物结合，形成无毒的葡萄糖醛酸结合物，经尿中排出。"},
    {type:"最佳选择题",q:"11. 维拉帕米因显著抑制窦房结自律性和房室结传导，禁用于",opts:["A.窦性心动过速","B.窦性心动过缓","C.劳力型心绞痛","D.二度或三度房室传导阻滞","E.变异型心绞痛"],ans:"D",exp:"维拉帕米主要减慢窦房结的自律性和抑制房室结传导，故病窦综合征患者和二度或三度房室传导阻滞患者禁用，窦性心动过缓和一度房室传导阻滞患者慎用。"},
    {type:"最佳选择题",q:"12. 在胃肠道吸收完全，无肝脏首关效应，生物利用度近100%，且药物原型即具药理活性的硝酸酯类药物是",opts:["A.硝酸异山梨酯","B.单硝酸异山梨酯","C.硝普钠","D.硝苯地平","E.硝酸甘油"],ans:"B",exp:"单硝酸异山梨酯在胃肠道吸收完全，无肝脏首关效应，生物利用度近100%。由于本身具有药理活性，可于30～60分钟起效，作用持续3～6小时。"},
    {type:"最佳选择题",q:"13. 患者，男，55岁，良性前列腺增生症病史2年，最近出现明显头痛、乏力，查体：血压162/95mmHg，拟进行降压治疗，宜选用的抗高血压药物是",opts:["A.氨氯地平","B.氢氯噻嗪","C.普萘洛尔","D.特拉唑嗪","E.硝普钠"],ans:"D",exp:"特拉唑嗪属于α1受体拮抗药，对前列腺和外周血管平滑肌上的α1受体都有拮抗作用，可扩张血管，从而降低血压，还可松弛前列腺平滑肌，缓解膀胱梗阻的动力性因素，减轻下尿路症状，适用于高血压合并良性前列腺增生症患者。"},
    {type:"最佳选择题",q:"14. 室性心律失常伴有左室功能不全，轻度传导系统病变首选",opts:["A.普鲁卡因胺","B.利多卡因","C.普罗帕酮","D.美西律","E.奎尼丁"],ans:"D",exp:"美西律为Ib类轻度阻滞钠通道的抗心律失常药，对短动作电位时程的心房肌无效，仅用于室性心律失常。美西律具有负性肌力作用轻微、促心律失常作用发生率低等优点；室性心律失常患者若伴有左室功能不全、轻度传导系统病变应首选美西律。"},
    {type:"最佳选择题",q:"15. 阿替普酶发挥药效的作用靶点是",opts:["A.血栓素A2(TXA2)","B.凝血酶","C.血小板","D.抗凝血酶","E.纤溶酶原"],ans:"E",exp:"溶栓药如阿替普酶的作用机制为通过将体内无活性的纤溶酶原激活转化为活性的纤溶酶，利用后者溶解血栓中的纤维蛋白。故作用靶点为纤溶酶原。"},
    {type:"最佳选择题",q:"16. 关于促血小板生成药的描述，正确的是",opts:["A.重组人血小板生成素需每日或隔日皮下注射，适用于实体瘤化疗后的血小板减少症，但需避免使血小板计数升至正常值以防止血栓风险","B.人白介素-11每周注射1次，主要用于实体瘤化疗后的血小板减少症","C.罗普司亭是一种口服TPO受体激动剂，需空腹服用以避免与食物相互作用","D.艾曲泊帕乙醇胺可与含钙、镁的抗酸药同服，且不受饮食限制","E.阿伐曲泊帕必须与奶制品同服以增强疗效，且无需监测肝功能"],ans:"A",exp:"重组人血小板生成素需每日或隔日皮下注射给药1次，可用于治疗实体瘤化疗后所致的血小板减少症，在应用时不应试图使血小板计数达到正常值，以防止血栓风险。人白介素-11需每日皮下注射1次。罗普司亭属于小分子拟肽类血小板生成素受体激动剂，每周注射给药1次。艾曲泊帕乙醇胺应空腹给药，与食物或其他药品至少间隔2小时以上。阿伐曲泊帕不受饮食限制。"},
    {type:"最佳选择题",q:"17. 通过抑制CDK4/6活性，诱导造血干细胞暂时停滞在G1期，从而减少化疗药物对骨髓细胞损伤的药物是",opts:["A.曲拉西利","B.利可君","C.重组人血小板生成素","D.重组人粒细胞刺激因子","E.重组人促红素"],ans:"A",exp:"曲拉西利属于细胞周期蛋白依赖性激酶（CDK）4和6短暂性抑制剂，化疗前给药，短暂将骨髓细胞阻滞在G1期，避免化疗损伤，且药效短暂可逆，半衰期仅14小时，用药32小时后骨髓造血干/祖细胞即逐渐恢复增殖，对骨髓的全系不良反应均有保护作用。"},
    {type:"最佳选择题",q:"18. 属于男性勃起功能障碍一线治疗药物的是",opts:["A.非那雄胺","B.前列地尔","C.罂粟碱","D.酚妥拉明","E.西地那非"],ans:"E",exp:"口服5型磷酸二酯酶抑制药是男性勃起功能障碍（ED）的一线治疗，代表药品有西地那非、伐地那非、他达拉非等。当ED患者口服药物无效时可以考虑阴茎自行注射作为二线方案，常用药物有前列地尔、罂粟碱、酚妥拉明。"},
    {type:"最佳选择题",q:"19. 在FDA妊娠用药安全类别中属于X类，可导致男性胎儿外生殖器发育畸形，妊娠期妇女不要接触其破碎片剂的药物是",opts:["A.5α还原酶抑制药","B.5型磷酸二酯酶抑制药","C.α1受体拮抗药","D.M受体拮抗药","E.β1受体激动药"],ans:"A",exp:"5α还原酶抑制药在FDA妊娠用药安全类别中属于X类，可导致男性胎儿外生殖器发育畸形，为妊娠期妇女禁忌。妊娠期妇女或备孕妇女不要接触破碎非那雄胺片剂，因可能被皮肤吸收继而导致男性胎儿畸形。"},
    {type:"最佳选择题",q:"20. 可减少胰腺的外分泌和内分泌，用于预防和治疗胰腺外科手术后并发症的药物是",opts:["A.胰岛素","B.胰高血糖素","C.胰酶","D.奥曲肽","E.生长抑素"],ans:"E",exp:"生长抑素可减少胰腺的内分泌和外分泌，用于预防和治疗胰腺外科手术后并发症；还可抑制胃泌素和胃酸以及胃蛋白酶分泌，治疗上消化道出血；可抑制胰高血糖素分泌，有效治疗糖尿病酮症酸中毒。"},
    {type:"最佳选择题",q:"21. 关于肾上腺皮质激素的说法，错误的是",opts:["A.肾上腺皮质激素是一类甾体激素","B.盐皮质激素由肾上腺皮质球状带分泌，可调节水、电解质代谢","C.糖皮质激素由肾上腺皮质束状带分泌，可调节糖、蛋白质、脂肪代谢","D.氮皮质激素由肾上腺皮质网状带分泌，包括孕激素、雌激素和雄激素","E.不同糖皮质激素药物的抗炎作用及等效剂量无明显差异"],ans:"E",exp:"人工合成糖皮质激素对糖皮质激素受体及盐皮质激素受体的亲和力差异明显，具体表现在对水盐代谢和糖代谢的影响上，不同糖皮质激素药物的抗炎作用及等效剂量区别也较大。"},
    {type:"最佳选择题",q:"22. 属于胰高血糖素样肽-1受体激动剂，一般一周1次皮下注射的是",opts:["A.艾塞那肽","B.利司那肽","C.利拉鲁肽","D.司美格鲁肽","E.替尔泊肽"],ans:"D",exp:"根据药代动力学特点，胰高糖素样肽-1受体激动剂可分为：短效制剂贝那鲁肽、艾塞那肽及利司那肽，一般需要一日1～3次皮下注射；长效制剂利拉鲁肽，需要一日1次皮下注射；超长效制剂司美格鲁肽、度拉糖肽、艾塞那肽周制剂及洛塞那肽，一般一周1次皮下注射。替尔泊肽属于GIP/GLP-1双受体激动剂。"},
    {type:"最佳选择题",q:"23. 关于阿仑膦酸钠临床应用注意的叙述，错误的是",opts:["A.治疗前须纠正钙代谢紊乱、维生素D缺乏","B.治疗过程中可能会引发低钙血症，应同时补钙","C.早餐前至少30min用200ml温开水送服","D.服后30min内不宜进食和卧床","E.用药期间应保持良好的口腔卫生，关注牙齿松动、疼痛或肿胀等问题"],ans:"B",exp:"双膦酸盐类药物会促进钙元素在骨骼中矿化沉积，增加血钙向骨钙的转移，应用双膦酸盐类药物治疗可能会引发低钙血症，因此接受双膦酸盐类药物治疗前需要纠正低钙血症；确保维生素D和元素钙的摄入充分，但需要注意口服双膦酸盐制剂（如阿仑膦酸钠）应避免和钙剂同一时间服用，以避免口服钙剂影响双膦酸盐在胃肠道吸收。"},
    {type:"最佳选择题",q:"24. 不属于长效避孕药的是",opts:["A.复方己酸羟孕酮注射液","B.左炔诺孕酮炔雌醚片","C.复方庚酸炔诺酮注射液","D.孕酮节育器","E.孕二烯酮炔雌醇片"],ans:"E",exp:"长效避孕药包括口服长效避孕药、注射长效避孕针、埋植剂、含药阴道环、含药宫内节育器。孕二烯酮炔雌醇片为短效口服避孕药。"},
    {type:"最佳选择题",q:"25. 青霉素的抗菌谱不包括",opts:["A.肺炎链球菌","B.梅毒螺旋体","C.军团菌","D.草绿色链球菌","E.导致气性坏疽的梭状芽孢杆菌"],ans:"C",exp:"青霉素可应用于革兰阳性球菌、草绿色链球菌和肠球菌属所致心内膜炎、梭状芽孢杆菌所致破伤风、气性坏疽、白喉、流行性脑脊髓膜炎、鼠咬热、梅毒、钩端螺旋体病等。军团菌不在青霉素抗菌谱内。"},
    {type:"最佳选择题",q:"26. 关于亚胺培南西司他丁的描述，错误的是",opts:["A.为时间依赖性抗菌药物","B.抗菌作用机制与头孢菌素类药物相似","C.用于肾功能不全者应减少给药剂量","D.可用于敏感菌所致脑膜炎","E.可用于病原菌未明严重感染的经验性治疗"],ans:"D",exp:"亚胺培南西司他丁可能导致惊厥等严重中枢神经系统不良反应，不宜用于中枢神经系统感染患者。"},
    {type:"最佳选择题",q:"27. 关于大环内酯类抗菌药物相互作用的叙述，正确的是",opts:["A.阿奇霉素与抗凝药合用，增强抗凝药的作用","B.克拉霉素与华法林合用，可降低华法林血药浓度","C.克拉霉素因抑制肝药酶CYP2C9，可增加辛伐他汀的肌毒性","D.红霉素与卡马西平合用，可加速卡马西平的代谢","E.红霉素与多潘立酮合用，可减轻Q-T间期延长的不良反应"],ans:"A",exp:"阿奇霉素可能增强抗凝血药的作用，合并使用时，应严密监测凝血酶原时间。克拉霉素属于肝药酶抑制剂，与华法林合用可增加华法林血药浓度；克拉霉素可抑制CYP3A4，使辛伐他汀代谢减慢，血药浓度增加，导致肌毒性增加；红霉素可抑制卡马西平代谢，增加其血药浓度；红霉素与多潘立酮合用可增加Q-T间期延长风险。"},
    {type:"最佳选择题",q:"28. 患者，男，43岁，因使用林可霉素出现抗生素相关性腹泻，怀疑为艰难梭菌感染所致，该患者宜使用的治疗药物是",opts:["A.头孢唑林","B.克林霉素","C.万古霉素","D.青霉素","E.替加环素"],ans:"C",exp:"口服万古霉素可用于经甲硝唑治疗无效的艰难梭菌所致假膜性肠炎患者。"},
    {type:"最佳选择题",q:"29. 患者，男，45岁，因脑膜炎住院，经实验室检查为铜绿假单胞菌感染，且对碳青霉烯类药物耐药，应选用的治疗药物是",opts:["A.氨曲南","B.万古霉素","C.利奈唑胺","D.四环素","E.多黏菌素"],ans:"E",exp:"多黏菌素抗菌谱窄，对革兰阴性菌尤其是铜绿假单胞菌有效，可用于对碳青霉烯类药物耐药的铜绿假单胞菌所致脑膜炎的治疗。氨曲南对铜绿假单胞菌有效，但不易透过血-脑屏障，不宜用于脑膜炎；万古霉素、利奈唑胺及四环素对铜绿假单胞菌疗效不佳。"},
    {type:"最佳选择题",q:"30. 患者，女，28岁，近期出现尿频、尿急、尿痛，且外阴瘙痒伴有泡沫状黄白色稀薄分泌物，诊断为滴虫性阴道炎，可选用的治疗药物是",opts:["A.呋喃妥因","B.阿莫西林","C.甲硝唑","D.吡喹酮","E.酮康唑"],ans:"C",exp:"甲硝唑属于硝基咪唑类抗菌药物，对厌氧菌具有强大抗菌活性，对原虫包括滴虫、阿米巴和蓝氏贾第鞭毛虫也具有强大抗原虫作用，临床上可用于阴道滴虫病等寄生虫病治疗。"},
    {type:"最佳选择题",q:"31. 结核病化学治疗遵循的5项基本原则是",opts:["A.早期、单药、适量、规律、全程","B.早期、联合、足量、规律、全程","C.早期、联合、少量、规律、全程","D.早期、联合、适量、规律、全程","E.早期、联合、适量、规律、短程"],ans:"D",exp:"结核病化学治疗遵循早期、联合、适量、规律、全程5项基本原则。"},
    {type:"最佳选择题",q:"32. 以下属于抗肝炎病毒药物的是",opts:["A.奥司他韦、玛巴洛沙韦","B.阿昔洛韦、膦甲酸钠","C.阿德福韦酯、利巴韦林","D.齐多夫定、阿兹夫定","E.扎那米韦、西多福韦"],ans:"C",exp:"抗肝炎病毒药物有：治疗慢性乙型肝炎药阿德福韦酯、替诺福韦酯、替比夫定、拉米夫定、恩替卡韦；治疗慢性丙型肝炎药维帕他韦-索磷布韦、利巴韦林、波普瑞韦、特拉匹韦、达拉他韦、阿舒瑞韦等；干扰素。奥司他韦、玛巴洛沙韦、扎那米韦属于抗流感病毒药物；阿昔洛韦、膦甲酸钠、西多福韦属于抗疱疹病毒药物；齐多夫定、阿兹夫定属于抗艾滋病病毒药物。"},
    {type:"最佳选择题",q:"33. 为治疗阿米巴肝脓肿的首选药物的是",opts:["A.巴龙霉素","B.甲硝唑","C.双碘喹啉","D.氯喹","E.伯氨喹"],ans:"B",exp:"甲硝唑为治疗阿米巴肝脓肿的首选药物，但不能根除包囊，故患者还应接受肠道内抗阿米巴药物的全疗程治疗。"},
    {type:"最佳选择题",q:"34. 大剂量使用后可出现出血性膀胱炎的抗肿瘤药物是",opts:["A.长春新碱","B.环磷酰胺","C.替尼泊苷","D.奥沙利铂","E.甲氨蝶呤"],ans:"B",exp:"出血性膀胱炎是泌尿系统毒性的表现，使用异环磷酰胺及大剂量环磷酰胺时会出现，这是由于代谢物丙烯醛所致。"},
    {type:"最佳选择题",q:"35. 关于甲氨蝶呤相互作用的叙述，错误的是",opts:["A.丙磺舒可减慢甲氨蝶呤的排泄","B.顺铂可减慢甲氨蝶呤的排泄","C.碳酸氢钠可加速甲氨蝶呤的排泄","D.维生素C与甲氨蝶呤合用，可增加甲氨蝶呤的毒副作用","E.乙胺嘧啶与甲氨蝶呤同用，可增加甲氨蝶呤的毒副作用"],ans:"D",exp:"维生素C与甲氨蝶呤合用，可消除甲氨蝶呤化疗引起的恶心，但对其在尿液中的排泄无明显影响，不增加毒副作用。甲氨蝶呤与丙磺舒、水杨酸类合用可减慢排泄；与碳酸氢钠等碱性药物合用可促进排泄；与顺铂等肾毒性药合用可减慢排泄；与氨苯蝶啶、乙胺嘧啶等抗叶酸药同用毒副作用增加。"},
    {type:"最佳选择题",q:"36. 关于微量元素描述，错误的是",opts:["A.铁有利于维持正常的造血功能","B.锌可维持蛋白结构功能和调节基因表达的功能","C.硒具有抗氧化、增强免疫、调节甲状腺素的作用","D.钴是维生素B2的重要组成部分","E.碘具有促进生长发育，参与脑发育，调节新陈代谢等作用"],ans:"D",exp:"钴是维生素B12的重要组成成分，体内钴主要以维生素B12的形式发挥作用，不是维生素B2。"},
    {type:"最佳选择题",q:"37. 为专供糖尿病患者使用的肠内全营养制剂的药物是",opts:["A.肠内营养乳剂（TPF-D）","B.肠内营养粉剂（TP）","C.复方氨基酸注射液（18AA）","D.赖氨酸注射液","E.中/长链脂肪乳注射液（C8-24）"],ans:"A",exp:"肠内营养乳剂（TPF-D）为糖尿病型肠内营养乳剂，为专供糖尿病患者使用的肠内全营养制剂。肠内营养粉剂（TP）为标准型肠内营养药。复方氨基酸注射液（18AA）、赖氨酸注射液、中/长链脂肪乳注射液（C8-24）为肠外营养药。"},
    {type:"最佳选择题",q:"38. 左卡巴斯汀是一种强效、长效、速效、具有高度选择性的鼻用抗过敏药，其所拮抗的受体是",opts:["A.M受体","B.α受体","C.β受体","D.H1受体","E.H2受体"],ans:"D",exp:"左卡巴斯汀是一种强效、长效、速效、具有高度选择性的组胺H1受体拮抗药。"},
    {type:"最佳选择题",q:"39. 用于治疗疥疮的药物有",opts:["A.苯甲酸苄酯搽剂、硫黄乳膏、克罗米通乳膏","B.克霉唑乳膏、克罗米通乳膏、维A酸软膏","C.克罗米通乳膏、过氧苯甲酰凝胶、硫黄乳膏","D.苯甲酸苄酯搽剂、咪康唑乳膏、特比萘芬软膏","E.莫匹罗星软膏、过氧化氢溶液、维A酸软膏"],ans:"A",exp:"疥疮治疗药物有克罗米通、苯甲酸苄酯、硫黄。克霉唑、咪康唑和特比萘芬属于局部用抗真菌药；维A酸和过氧苯甲酰属于痤疮治疗药物；莫匹罗星属于局部外用抗生素；过氧化氢属于消毒防腐药。"},
    {type:"最佳选择题",q:"40. 外用糖皮质激素药物分为弱效、中效、强效和极强效四类，下列药物中分别属于弱效、强效和极强效外用糖皮质激素的是",opts:["A.1.0%醋酸氢化可的松乳膏、0.05%醋酸地塞米松乳膏、0.1%氟轻松乳膏","B.0.01%醋酸氟轻松乳膏、0.1%曲安奈德软膏、0.1%哈西奈德乳膏","C.0.05%丙酸氟替卡松乳膏、0.025%丙酸倍氯米松软膏、0.05%丙酸氯倍他索软膏","D.0.1%丁酸氢化可的松乳膏、0.05%卤米松乳膏、0.1%氟轻松乳膏","E.1.0%醋酸氢化可的松乳膏、0.1%哈西奈德乳膏、0.1%氟轻松乳膏"],ans:"E",exp:"外用糖皮质激素分为：弱效1.0%醋酸氢化可的松、0.01%醋酸氟轻松；中效0.05%醋酸地塞米松、0.1%丁酸氢化可的松、0.1%曲安奈德、0.05%丙酸氟替卡松；强效0.1%糠酸莫米松、0.025%丙酸倍氯米松、0.1%哈西奈德；极强效0.05%卤米松、0.1%氟轻松、0.05%丙酸氯倍他索。故分别属于弱效、强效和极强效的是E。"},

    // ===== 二、配伍选择题（41-90） =====
    {type:"配伍选择题",subs:[
      {q:"41. 通过抑制5-HT及NE再摄取，增强中枢5-HT能及NE能神经功能的抗抑郁药是",opts:["A.帕罗西汀","B.度洛西汀","C.米氮平","D.吗氯贝胺","E.瑞波西汀"],ans:"B",exp:"5-HT及NE再摄取抑制剂的代表药物有文拉法辛、度洛西汀，主要通过抑制5-HT及NE再摄取，增强中枢5-HT能及NE能神经功能而发挥抗抑郁作用。"},
      {q:"42. 通过抑制A型单胺氧化酶，减少NE、5-HT及多巴胺的降解，增强NE、5-HT和多巴胺能神经功能的抗抑郁药是",opts:["A.帕罗西汀","B.度洛西汀","C.米氮平","D.吗氯贝胺","E.瑞波西汀"],ans:"D",exp:"吗氯贝胺属于单胺氧化酶抑制剂，可抑制A型单胺氧化酶，减少NE、5-HT及多巴胺的降解，增强NE、5-HT和多巴胺能神经功能，而发挥抗抑郁作用。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"43. 可导致尿酸盐在泌尿道形成结石，治疗期间需大量饮水以增加尿量，酌情给予碳酸氢钠，并注意酸碱平衡的药物是",opts:["A.秋水仙碱","B.非布司他","C.苯溴马隆","D.别嘌醇","E.塞来昔布"],ans:"C",exp:"苯溴马隆为促进尿酸排泄药，可使血尿酸降低、尿尿酸升高，可能导致尿酸盐在泌尿道形成结石，治疗期间需大量饮水以增加尿量，为促使尿液碱化，酌情给予碳酸氢钠，并注意酸碱平衡。"},
      {q:"44. 可致超敏反应综合征，建议应用前做基因（HLA-B*5801）筛查的药物是",opts:["A.秋水仙碱","B.非布司他","C.苯溴马隆","D.别嘌醇","E.塞来昔布"],ans:"D",exp:"别嘌醇为抑制尿酸生成药，可引起超敏反应综合征，建议应用前做基因（HLA-B*5801）筛查。"},
      {q:"45. 可致可逆性的维生素B12吸收不良，长期使用还可引起骨髓造血功能抑制的药物是",opts:["A.秋水仙碱","B.非布司他","C.苯溴马隆","D.别嘌醇","E.塞来昔布"],ans:"A",exp:"秋水仙碱可致可逆性的维生素B12吸收不良，长期使用还可引起骨髓造血功能抑制。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"46. 具有成瘾性的中枢性镇咳药是",opts:["A.二氧丙嗪","B.氯化铵","C.可待因","D.苯丙哌林","E.羧甲司坦"],ans:"C",exp:"可待因属于中枢性镇咳药，为麻醉性药品，具有成瘾性。"},
      {q:"47. 没有成瘾性，兼有中枢和外周镇咳作用的药物是",opts:["A.二氧丙嗪","B.氯化铵","C.可待因","D.苯丙哌林","E.羧甲司坦"],ans:"D",exp:"苯丙哌林兼具中枢及外周镇咳作用，为非麻醉性镇咳药，无成瘾性。二氧丙嗪属于中枢性镇咳药，未见耐受性和成瘾性。氯化铵和羧甲司坦属于祛痰药。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"48. 便秘和腹泻发生风险较低的抗酸药是",opts:["A.氢氧化铝","B.三硅酸镁","C.氯丙嗪","D.铝碳酸镁","E.甲氧氯普胺"],ans:"D",exp:"铝可引起便秘，镁有导泻作用，铝碳酸镁同时含有镁和铝，能降低便秘和腹泻的发生风险。"},
      {q:"49. 易透过血-脑屏障，常引起锥体外系反应的胃肠动力药是",opts:["A.氢氧化铝","B.三硅酸镁","C.氯丙嗪","D.铝碳酸镁","E.甲氧氯普胺"],ans:"E",exp:"甲氧氯普胺为胃肠动力药，易透过血-脑屏障，常引起锥体外系反应，常见嗜睡和倦怠。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"50. 属于长效的5-HT3受体拮抗剂，半衰期约40小时的药物是",opts:["A.帕洛诺司琼","B.乌司奴单抗","C.昂丹司琼","D.聚乙二醇","E.维得利珠单抗"],ans:"A",exp:"昂丹司琼、帕洛诺司琼属于5-HT3受体拮抗剂，其中帕洛诺司琼是长效的，半衰期约40小时。"},
      {q:"51. 属于渗透性泻药，可用于治疗成人及8岁以上儿童便秘的药物是",opts:["A.帕洛诺司琼","B.乌司奴单抗","C.昂丹司琼","D.聚乙二醇","E.维得利珠单抗"],ans:"D",exp:"聚乙二醇属于渗透性泻药，可用于成人及8岁以上儿童（含8岁）便秘。"},
      {q:"52. 属于α4β7整合素抑制剂药物的是",opts:["A.帕洛诺司琼","B.乌司奴单抗","C.昂丹司琼","D.聚乙二醇","E.维得利珠单抗"],ans:"E",exp:"维得利珠单抗是一种人源化单克隆抗体，属于α4β7整合素抑制剂。乌司奴单抗属于IL-12/IL-23拮抗剂。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"53. 患者，男，55岁。诊断为高血压（BP 150/100mmHg），有雷诺现象，寒冷或情绪变化时，指端皮肤苍白、青紫。该患者不宜选用的降压药是",opts:["A.普萘洛尔","B.氨氯地平","C.吲达帕胺","D.赖诺普利","E.硝普钠"],ans:"A",exp:"普萘洛尔为非选择性β受体拮抗剂，可收缩外周血管，导致雷诺征样四肢冰冷，伴有雷诺综合征的高血压患者不宜应用。"},
      {q:"54. 患者，男，45岁。高血压病史8年（BP峰值180/110mmHg），合并冠心病及双侧肾动脉狭窄。该患者不宜选用的降压药是",opts:["A.普萘洛尔","B.氨氯地平","C.吲达帕胺","D.赖诺普利","E.硝普钠"],ans:"D",exp:"血管紧张素转换酶抑制剂如赖诺普利的禁忌包括：①双侧肾动脉狭窄；②高钾血症；③妊娠期妇女。"},
      {q:"55. 患者，女，65岁，肾功能不全（eGFR35mL/min），嗜铬细胞瘤手术后出现阵发性高血压。控制血压过程中需每日测定血浆氰化物或硫氰酸盐浓度的药物是",opts:["A.普萘洛尔","B.氨氯地平","C.吲达帕胺","D.赖诺普利","E.硝普钠"],ans:"E",exp:"老年人应用硝普钠须注意肾功能减退对本品排泄的影响，肾功能不全应用硝普钠超过48～72h者，每日须测定血浆中氰化物或硫氰酸盐，保持硫氰酸盐不超过100μg/ml；氰化物不超过3μmol/ml。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"56. 患者，男，63岁，突发胸骨后压榨性疼痛3分钟，考虑为心绞痛急性发作。此时最宜选用的抗心绞痛药物是",opts:["A.硝酸异山梨酯","B.硝普钠","C.阿托伐他汀","D.瑞舒伐他汀","E.硝酸甘油"],ans:"E",exp:"硝酸甘油舌下含服吸收迅速完全，起效最快，2～3min起效，5min达最大效应，舌下含化硝酸甘油作为心绞痛急性发作首选。"},
      {q:"57. 患者，男，59岁，重度肾功能损害（肌酐清除率<30ml/min），LDL-C 5.2mmol/L。需长期使用且无需调整剂量的调血脂药物是",opts:["A.硝酸异山梨酯","B.硝普钠","C.阿托伐他汀","D.瑞舒伐他汀","E.硝酸甘油"],ans:"C",exp:"重度肾功能损害者（肌酐清除率<30ml/min），使用阿托伐他汀不需调整剂量，禁用瑞舒伐他汀。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"58. 可明显抑制肝药酶CYP2C19，应避免与氯吡格雷联合应用的药物是",opts:["A.奥美拉唑","B.兰索拉唑","C.布洛芬","D.甲氨蝶呤","E.奎尼丁"],ans:"A",exp:"氯吡格雷是前药，部分经CYP2C19介导代谢为活性代谢产物，奥美拉唑或艾司奥美拉唑为肝药酶CYP2C19强效抑制剂，可导致氯吡格雷活性代谢产物转化减少，血小板抑制作用降低，故不推荐氯吡格雷与奥美拉唑或艾司奥美拉唑联合使用。"},
      {q:"59. 可减弱阿司匹林的不可逆抗血小板作用，降低阿司匹林的心血管保护作用的药物是",opts:["A.奥美拉唑","B.兰索拉唑","C.布洛芬","D.甲氨蝶呤","E.奎尼丁"],ans:"C",exp:"布洛芬会干扰阿司匹林对血小板的不可逆抑制作用，降低阿司匹林的心血管保护作用，应避免合用。"},
      {q:"60. 为强效P-糖蛋白（P-gp）抑制剂，应避免与达比加群酯联合应用的药物是",opts:["A.奥美拉唑","B.兰索拉唑","C.布洛芬","D.甲氨蝶呤","E.奎尼丁"],ans:"E",exp:"达比加群酯为外流转运体P-糖蛋白的底物，与强效P-糖蛋白抑制剂（胺碘酮、维拉帕米、克拉霉素、奎尼丁、决奈达隆）合用，可导致达比加群的血药浓度升高，应避免合用。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"61. 患者进行胃大部切除术后出现巨幼红细胞性贫血，内因子抗体阳性（血清叶酸正常）。最适宜的治疗药物是",opts:["A.硫酸亚铁","B.叶酸","C.维生素B12","D.罗特西普","E.十一酸睾酮"],ans:"C",exp:"叶酸与维生素B12主要用于巨幼红细胞性贫血，其中维生素B12可用于由内因子缺乏导致的巨幼红细胞性贫血。"},
      {q:"62. 输血依赖型β-地中海贫血患者，血红蛋白持续低于80g/L。可减少输血需求的药物是",opts:["A.硫酸亚铁","B.叶酸","C.维生素B12","D.罗特西普","E.十一酸睾酮"],ans:"D",exp:"罗特西普可调控红细胞成熟过程，适用于输血依赖型β-地中海贫血的成人患者。硫酸亚铁用于防治各种原因引起的缺铁性贫血；十一酸睾酮可用于再生障碍性贫血的辅助治疗。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"63. 布美他尼能特异性地抑制NaCl的重吸收，产生强效的利尿作用，发挥该药效的作用部位是",opts:["A.远曲小管末端和皮质部集合管","B.髓袢升支粗段","C.髓质部集合管","D.近曲小管","E.远曲小管近端"],ans:"B",exp:"布美他尼属于袢利尿药，主要作用部位在髓袢升支粗段，通过抑制Na+-K+-2Cl-共转运体，产生强效的利尿作用。"},
      {q:"64. 吲达帕胺可以增强NaCl和水的排出，产生温和持久的利尿作用，发挥该药效的作用部位是",opts:["A.远曲小管末端和皮质部集合管","B.髓袢升支粗段","C.髓质部集合管","D.近曲小管","E.远曲小管近端"],ans:"E",exp:"吲达帕胺属于中效利尿药，作用于远曲小管近端，通过抑制Na+-Cl-共转运体的功能，产生温和持久的利尿作用。"},
      {q:"65. 依普利酮能竞争性结合盐皮质激素受体而产生留钾利尿作用，发挥该药效的作用部位是",opts:["A.远曲小管末端和皮质部集合管","B.髓袢升支粗段","C.髓质部集合管","D.近曲小管","E.远曲小管近端"],ans:"A",exp:"依普利酮属于盐皮质激素受体拮抗药，作用于远曲小管末端和集合管（主要是皮质部集合管），竞争性结合盐皮质激素受体而产生留钾利尿作用。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"66. 为人工合成的四碘甲状腺原氨酸，在外周被转化为T3，然后通过与T3受体结合发挥作用的药物是",opts:["A.左甲状腺素","B.美托洛尔","C.大剂量碘剂","D.丙硫氧嘧啶","E.甲巯咪唑"],ans:"A",exp:"左甲状腺素（L-T4）为人工合成的四碘甲状腺原氨酸，在外周被转化为T3，然后通过与T3受体结合发挥作用。"},
      {q:"67. 能抑制过氧化酶系统，减少甲状腺激素的生成，能减少甲状腺外组织中的T4转化为T3的药物是",opts:["A.左甲状腺素","B.美托洛尔","C.大剂量碘剂","D.丙硫氧嘧啶","E.甲巯咪唑"],ans:"D",exp:"丙硫氧嘧啶、甲巯咪唑为硫脲类抗甲状腺药，通过抑制过氧化物酶活性，使酪氨酸碘化缩合过程受阻，减少甲状腺激素的生成。丙硫氧嘧啶通过抑制脱碘酶活性而减少甲状腺外组织中的T4转化为T3。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"68. 皮下注射后缓慢释放，血药浓度无明显峰值的胰岛素/胰岛素类似物是",opts:["A.人胰岛素注射液","B.精蛋白人胰岛素注射液","C.门冬胰岛素注射液","D.德谷门冬双胰岛素注射液","E.甘精胰岛素注射液（U300）"],ans:"E",exp:"甘精胰岛素注射液（U300）为长效胰岛素类似物，皮下注射，维持时间可达36h，具有长效、平稳的特点，血药浓度无明显峰值。"},
      {q:"69. 起效迅速，维持时间长，兼顾餐后血糖和基础血糖控制的胰岛素/胰岛素类似物是",opts:["A.人胰岛素注射液","B.精蛋白人胰岛素注射液","C.门冬胰岛素注射液","D.德谷门冬双胰岛素注射液","E.甘精胰岛素注射液（U300）"],ans:"D",exp:"德谷门冬双胰岛素注射液为双胰岛素类似物，其中门冬胰岛素起效迅速，德谷胰岛素作用维持时间长，兼顾餐后血糖和基础血糖的控制。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"70. 可引起液体潴留、体重增加，增加心力衰竭风险的降糖药物是",opts:["A.利拉鲁肽","B.达格列净","C.瑞格列奈","D.阿卡波糖","E.罗格列酮"],ans:"E",exp:"噻唑烷二酮类胰岛素增敏剂（如罗格列酮）的典型不良反应有：体重增加、液体潴留，增加心力衰竭和女性骨折的风险。"},
      {q:"71. 可降低血压、减轻体重，可能引起急性肾损伤的降糖药物是",opts:["A.利拉鲁肽","B.达格列净","C.瑞格列奈","D.阿卡波糖","E.罗格列酮"],ans:"B",exp:"钠-葡萄糖协同转运蛋白2抑制剂（如达格列净）的典型不良反应为生殖泌尿道感染，还可降低血压、减轻体重，罕见酮症酸中毒（主要发生在1型糖尿病患者）、急性肾损伤、骨折风险和足趾截肢。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"72. 更适用于老年人、肾功能减退及1α羟化酶缺乏或减少的患者的调节骨代谢药物是",opts:["A.碳酸钙","B.维生素D","C.骨化三醇","D.特立帕肽","E.雷洛昔芬"],ans:"C",exp:"骨化三醇、阿法骨化醇、艾地骨化醇都是维生素D在人体内的活性代谢物，不需要肾脏1α羟化酶羟化即可发挥生理活性，此类药物更适用于老年人、肾功能减退及1α羟化酶缺乏或减少的患者。"},
      {q:"73. 仅适用于绝经后女性，不适用于男性患者的调节骨代谢药物是",opts:["A.碳酸钙","B.维生素D","C.骨化三醇","D.特立帕肽","E.雷洛昔芬"],ans:"E",exp:"雷洛昔芬是选择性雌激素受体调节剂，仅用于绝经后女性，不适用于男性患者。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"74. 经过肝、肾双途径清除的抗菌药物是",opts:["A.两性霉素B","B.利福平","C.头孢他啶","D.异烟肼","E.莫西沙星"],ans:"E",exp:"经肝、肾双途径清除的药物有：美洛西林、哌拉西林、头孢哌酮、头孢曲松、头孢噻肟、氨曲南、环丙沙星、莫西沙星等。"},
      {q:"75. 主要通过肾脏清除的抗菌药物是",opts:["A.两性霉素B","B.利福平","C.头孢他啶","D.异烟肼","E.莫西沙星"],ans:"C",exp:"主要经肾脏清除的药物有：氨基糖苷类、糖肽类、头孢唑林、头孢他啶、头孢吡肟、多黏菌素、羧苄西林、左氧氟沙星、亚胺培南、美罗培南、磺胺类等。两性霉素B、利福平和异烟肼主要通过肝脏清除。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"76. 可用于脑膜炎的第二代头孢菌素类药物的是",opts:["A.头孢呋辛","B.头孢哌酮","C.头孢吡肟","D.头孢孟多","E.头孢吡普"],ans:"A",exp:"头孢呋辛和头孢孟多都属于第二代头孢菌素类药物，此类药物在脑脊液中浓度较低，除了头孢呋辛外均不适用于脑膜炎的治疗。"},
      {q:"77. 可用于中性粒细胞减少伴发热的第四代头孢菌素类药物的是",opts:["A.头孢呋辛","B.头孢哌酮","C.头孢吡肟","D.头孢孟多","E.头孢吡普"],ans:"C",exp:"第四代头孢菌素类药物包括头孢吡肟和头孢匹罗，其中头孢吡肟常用于治疗中性粒细胞减少伴发热。"},

    // ===== 三、综合分析选择题（91-95） =====
    {type:"最佳选择题",q:"91. 丁苯酞为我国开发的1类新药，能促进中枢神经功能改善和恢复，对缺血性脑卒中所致脑损伤，可阻断其多个病理环节，具有较强的抗脑缺血作用，但用药前应考虑患者的过敏史，禁用的情况为",opts:["A.对芹菜过敏","B.对牛奶过敏","C.对肽质过敏","D.对海鲜过敏","E.对花生过敏"],ans:"A",exp:"丁苯酞禁用于对芹菜过敏者（芹菜中所含的左旋芹菜甲素与本药的化学结构相同）以及有严重出血倾向者。"},
    {type:"最佳选择题",q:"92. 半年后，患者出现脑卒中继发的认知障碍和记忆力下降，可用于改善该患者记忆及思维功能减退的药物是",opts:["A.倍他司汀","B.司来吉兰","C.吡拉西坦","D.苯海索","E.硫辛酸"],ans:"C",exp:"吡拉西坦能促进脑内ATP，促进乙酰胆碱合成并增强神经兴奋的传导，具有促进脑内代谢作用。可以对抗由物理因素、化学因素所致的脑功能损伤。对缺氧所致的逆行性健忘有改进作用。用于脑外伤、脑动脉硬化、脑血管病等多种原因所致的记忆及思维功能减退。"},
    {type:"最佳选择题",q:"93. 阿托伐他汀常用的起始给药方案是",opts:["A.5mg,q12h","B.10mg,qd","C.20mg,qd","D.40mg,qod","E.80mg,qod"],ans:"B",exp:"成人应用阿托伐他汀初始剂量为一次10mg，一日1次。应根据低密度脂蛋白胆固醇基线水平、治疗目标和患者的治疗效果进行剂量的个体化调整。剂量调整时间间隔应为4周或更长。"},
    {type:"最佳选择题",q:"94. 患者规律治疗并改变生活方式（控制饮食、增强运动），一个月后复查：总胆固醇5.17mmol/L，甘油三酯14.40mmol/L，尿酸395μmol/L，该患者宜联用的药物是",opts:["A.二甲双胍","B.考来烯胺","C.非诺贝特","D.依那普利","E.别嘌醇"],ans:"C",exp:"贝丁酸类药物（如非诺贝特）是降低TG为主要目标的首选药。"},
    {type:"最佳选择题",q:"95. 联用上述药物后，患者需定期监测的指标不包括",opts:["A.总胆固醇","B.甘油三酯","C.肌酸激酶","D.ALT、AST","E.肺功能"],ans:"E",exp:"由于他汀类和贝丁酸类药物均有潜在损伤肝功能的可能，并有发生肌炎和肌病的危险，合用时不良反应的发生风险增加，治疗期间建议定期监测血象、肝功能、血胆固醇、甘油三酯、低密度脂蛋白、肌酸激酶等，不包括肺功能。"},

    // ===== 四、多项选择题（96-100） =====
    {type:"多项选择题",q:"96. 属于肿瘤坏死因子（TNF-α）抑制剂的有",opts:["A.依那西普","B.阿达木单抗","C.英夫利西单抗","D.司库奇尤单抗","E.托法替布"],ans:"ABC",exp:"肿瘤坏死因子（TNF-α）抑制剂有：①融合蛋白类：依那西普；②单克隆抗体类：阿达木单抗和英夫利西单抗。司库奇尤单抗属于IL-17抑制剂。托法替布属于JAK抑制剂。"},
    {type:"多项选择题",q:"97. 患者，女，34岁，因“阵发性上腹绞痛伴恶心、呕吐”就诊，诊断为胃痉挛。医生开具硫酸阿托品片，医嘱：0.3～0.6mg/次，一日3次。该患者在用药期间可能出现的不良反应有",opts:["A.口鼻咽喉干燥","B.排尿困难","C.胃肠动力低下","D.心率减慢","E.便秘"],ans:"ABCE",exp:"阿托品属于抗胆碱M受体药，会引起抗胆碱能效应，包括口鼻咽喉干燥、便秘、出汗减少、瞳孔散大、视物模糊、眼睑炎、眼压升高、排尿困难、心悸、皮肤潮红、胃肠动力低下、胃食管反流等。"},
    {type:"多项选择题",q:"98. 关于磺达肝癸钠药理作用与药学特点的说法，正确的有",opts:["A.通过增强抗凝血酶活性发挥抗凝作用","B.选择性抑制Xa，不影响Ⅱa活性，也不影响血小板功能","C.皮下注射生物利用度达100%","D.平均分子量比低分子量肝素更小","E.消除半衰期比低分子量肝素更短"],ans:"ABCD",exp:"磺达肝癸钠是人工合成的选择性Xa抑制剂，通过增强抗凝血酶活性发挥抗凝作用，使Xa被快速抑制，不影响Ⅱa活性，也不影响血小板的功能，皮下注射生物利用度达100%。磺达肝癸钠的平均分子量为1728.08，比低分子量肝素（约4000Da～5000Da）更小。磺达肝癸钠可以皮下注射，也可以静脉给药，消除半衰期约为17～21小时，比低分子量肝素（3～7小时）更长。"},
    {type:"多项选择题",q:"99. 关于奥利司他药理作用及临床应用的说法，正确的有",opts:["A.是长效和强效的特异性胃肠道脂肪酶抑制剂","B.其有效性和安全性良好，是目前首选的口服减肥药","C.往往引起令人不适的胃肠道副作用，患者常无法耐受","D.可使脂溶性维生素的吸收减少","E.可用于继发性肥胖（如甲状腺功能减退），安全性良好"],ans:"ABCD",exp:"奥利司他是长效和强效的特异性胃肠道脂肪酶抑制剂；临床应用研究证实，奥利司他有效性和安全性良好，是目前首选的口服减肥药；奥利司他往往引起令人不适的胃肠道副作用，患者常无法耐受，用药前需要仔细告知患者副作用情况；奥利司他可使脂溶性维生素的吸收减少，如正在服用含有维生素A、D和E的制剂，应在服用本品2h后或在睡前服用；奥利司他禁用于慢性吸收不良综合征、胆汁淤积患者，继发性肥胖（如甲状腺功能减退）。"},
    {type:"多项选择题",q:"100. 抗菌谱可覆盖毛霉菌属的抗真菌药物有",opts:["A.氟康唑","B.米卡芬净","C.伊曲康唑","D.艾沙康唑","E.两性霉素B"],ans:"DE",exp:"抗菌谱可覆盖毛霉菌属的抗真菌药物有：两性霉素B、泊沙康唑、艾沙康唑。选项中为艾沙康唑和两性霉素B。"}
  ]
},
  {
  name: "押题密卷（二）",
  questions: [
    // ===== 一、最佳选择题（1-40） =====
    {type:"最佳选择题",q:"1. 现有抗癫痫药的最常见作用机制是阻滞电压依赖性的钠通道，下列抗癫痫药物中具有钠通道阻滞作用的是",opts:["A.卡马西平、苯巴比妥、苯妥英钠","B.卡马西平、苯妥英钠、拉莫三嗪","C.苯妥英钠、乙琥胺、苯巴比妥","D.卡马西平、丙戊酸钠、加巴喷丁","E.丙戊酸钠、氯硝西泮、唑尼沙胺"],ans:"B",exp:"有钠通道阻滞作用的抗癫痫药物有苯妥英钠、卡马西平、奥卡西平、唑尼沙胺、拉莫三嗪、托吡酯。苯巴比妥直接促进氯离子内流。乙琥胺、加巴喷丁属于钙通道阻滞剂。丙戊酸钠、氯硝西泮属于γ-氨基丁酸调节剂。"},
    {type:"最佳选择题",q:"2. 关于抗抑郁药使用注意事项的说法，正确的是",opts:["A.选药时应因人而异，须全面考虑患者症状特点、年龄、躯体状况、药物的耐受性、有无合并症","B.为尽快达到有效治疗浓度，通常第1周给予负荷剂量，之后每日小剂量维持","C.抗抑郁药起效缓慢，一般4～6周方显效，米氮平起效较快，通常1～3天显效","D.应定期轮换使用不同品种的抗抑郁药，以免引起药物耐受","E.以单胺氧化酶抑制剂替换氟西汀时，应该间隔2周时间"],ans:"A",exp:"抗抑郁药的应用因人而异，须全面考虑患者症状特点、年龄、躯体状况、药物的耐受性、有无合并症，予以个体化合理用药。使用抗抑郁药时，应从小剂量开始，逐增剂量。抗抑郁药起效缓慢，一般4～6周方显效，即便是起效较快的抗抑郁药如米氮平、文拉法辛也需要1周左右时间。氟西汀需停药5周才能换用单胺氧化酶抑制剂。"},
    {type:"最佳选择题",q:"3. 属于乙酰胆碱酯酶抑制剂，临床上用于改善轻、中度老年性痴呆症状的药物是",opts:["A.多奈哌齐","B.吡拉西坦","C.丁苯酞","D.艾地苯醌","E.胞磷胆碱钠"],ans:"A",exp:"乙酰胆碱酯酶抑制剂的代表药物有石杉碱甲、多奈哌齐、利斯的明（卡巴拉汀）、加兰他敏，可抑制胆碱酯酶活性，阻止乙酰胆碱的水解，提高脑内乙酰胆碱含量，从而缓解因胆碱能神经功能缺陷所引起的记忆和认知功能障碍。"},
    {type:"最佳选择题",q:"4. 关于对乙酰氨基酚临床应用的说法，错误的是",opts:["A.用于成人退热，一次0.3～0.6g，一日3～4次","B.用于儿童退热，一次10～15mg/kg，每隔4～6小时给药1次","C.解热用药一般不超过10日","D.用于成人骨性关节炎，口服缓释片，一次0.65～1.3g，8小时一次","E.成人一日最大剂量不超过2g"],ans:"C",exp:"对乙酰氨基酚用于退热镇痛，成人一次0.3～0.6g，一日3～4次；一日量不得超过2g，退热疗程一般不超过3日，镇痛不宜超过10日。儿童一次10～15mg/kg，每隔4～6小时给药1次。用于骨性关节炎，成人常用量口服缓释片，一次0.65～1.3g，8小时一次，一日最大剂量不超过2g。"},
    {type:"最佳选择题",q:"5. 别嘌醇不能用于痛风性关节炎急性发作期的原因是",opts:["A.可引起超敏反应综合征","B.起效较慢，2～4周方显效","C.促使组织内尿结晶重新溶解","D.使尿酸盐沉积到肾脏，形成结石","E.可引起骨髓造血功能抑制"],ans:"C",exp:"别嘌醇是抑制尿酸生成药，本身不能控制痛风性关节炎的急性炎症症状，不能作为抗炎药使用，因为本品促使尿酸结晶重新溶解时可再次诱发并加重关节炎急性期症状，必须在痛风性关节炎的急性炎症症状消失后（一般在发作后2周左右）方开始应用。"},
    {type:"最佳选择题",q:"6. 关于镇咳药作用强度的比较，正确的是",opts:["A.喷托维林<苯丙哌林<可待因","B.可待因<苯丙哌林<喷托维林","C.苯丙哌林<喷托维林<可待因","D.苯丙哌林<可待因<喷托维林","E.喷托维林<可待因<苯丙哌林"],ans:"E",exp:"喷托维林镇咳作用强度约为可待因的1/3。苯丙哌林镇咳作用较强，为可待因的2～4倍。故三者镇咳作用强度比较：喷托维林<可待因<苯丙哌林。"},
    {type:"最佳选择题",q:"7. 关于双歧杆菌三联活菌临床应用注意的说法，错误的是",opts:["A.无需冷藏，室温贮藏即可","B.口服给药，一日2次，一次胶囊2～4粒，重症加倍","C.婴幼儿服用时可将胶囊内药粉用温开水或温牛奶冲服","D.与铋剂、酸、活性炭、酊剂等药物应错时分开服用","E.溶解时水温不宜超过40℃"],ans:"A",exp:"双歧杆菌三联活菌需要冷藏（2～8℃）。双歧杆菌三联活菌为活菌制剂，铋剂、酸、活性炭、酊剂等能抑制、吸附或杀灭活菌，故应错时分开服用，一般需要间隔2～3小时，且溶解时水温不宜超过40℃。口服，一日2次，一次胶囊2～4粒，重症加倍，婴幼儿服用时可将胶囊内药粉用温开水或温牛奶冲服。"},
    {type:"最佳选择题",q:"8. 患者，女，28岁，孕34周。因每周排便≤2次就诊，诊断为妊娠期功能性便秘。宜选用的治疗药物是",opts:["A.麻油","B.乳果糖","C.硫酸镁","D.普芦卡必利","E.利那洛肽"],ans:"B",exp:"聚乙二醇、乳果糖对胎儿无不良影响，可作为妊娠期便秘患者的首选泻药。"},
    {type:"最佳选择题",q:"9. 对乙酰氨基酚过量摄入后，N-乙酰苯亚胺基醌在肝脏产生过多，无法被肝脏的内源性谷胱甘肽及时中和，N-乙酰苯亚胺基醌具有高度的肝毒性，可导致肝细胞损害、坏死甚至肝衰竭。对乙酰氨基酚过量中毒的特异性解毒药是",opts:["A.甘草酸二铵","B.葡醛内酯","C.硫普罗宁","D.乙酰半胱氨酸"],ans:"D",exp:"乙酰半胱氨酸是还原型谷胱甘肽的前体，能在肝脏中转化为谷胱甘肽，维持或恢复肝内谷胱甘肽水平，是对乙酰氨基酚过量中毒的特异性解毒药。"},
    {type:"最佳选择题",q:"10. 患者，男，60岁，肾移植后使用环孢素预防排斥反应，新诊断为高胆固醇血症。不宜选用的调血脂药是",opts:["A.依折麦布","B.普罗布考","C.阿托伐他汀","D.普伐他汀","E.烟酸"],ans:"C",exp:"环孢素是CYP3A4强抑制剂，阿托伐他汀经肝药酶CYP3A4代谢，两者合用可增加阿托伐他汀的血药浓度，增加肌病发生的危险性。"},
    {type:"最佳选择题",q:"11. 二氢吡啶类钙通道阻滞剂的典型不良反应，不包括",opts:["A.反射性心率加快","B.面部潮红","C.踝部水肿","D.牙龈增生","E.血管神经性水肿"],ans:"E",exp:"二氢吡啶类钙通道阻滞剂（如硝苯地平）常见不良反应包括：反射性交感神经激活导致心跳加快、面部潮红、踝部水肿、牙龈增生等。血管神经性水肿为ACEI类药物（XX普利）的严重不良反应。"},
    {type:"最佳选择题",q:"12. 硝酸甘油治疗心绞痛的主要机制是",opts:["A.阻断钙通道，选择性扩张冠脉，增加心肌供血","B.拮抗β受体，降低心肌耗氧量","C.减慢心率，降低心肌耗氧量","D.扩张动脉和静脉，降低耗氧量；扩张冠脉，改善局部缺血","E.抑制心肌收缩力，降低心肌耗氧量"],ans:"D",exp:"硝酸甘油进入机体在血管平滑肌内经谷胱甘肽转移酶催化释放NO，激活鸟苷酸环化酶，降低胞浆中Ca2+浓度，从而舒张血管平滑肌，表现为：①降低心肌耗氧量：扩张静脉，降低前负荷；扩张动脉，降低后负荷；②增加缺血区血液供应：选择性扩张冠状动脉心外膜区输送血管，开放侧支循环；③保护心肌细胞，减轻缺血性损伤；④轻微的抗血小板聚集作用。"},
    {type:"最佳选择题",q:"13. 与钠通道解离时间长，对钠通道抑制作用强的药物是",opts:["A.奎尼丁","B.利多卡因","C.普罗帕酮","D.索他洛尔","E.维拉帕米"],ans:"C",exp:"普罗帕酮属于Ic类抗心律失常药，阻滞钠通道失活，与钠通道解离时间长，抑制钠通道作用强。"},
    {type:"最佳选择题",q:"14. 关于华法林药物代谢和药效学特点的描述，错误的是",opts:["A.华法林通过抑制维生素K环氧化物还原酶复合体1（VKOR1）发挥抗凝作用","B.VKORC1基因多态性是导致华法林用药个体差异的决定性因素","C.华法林的S-对映体主要由CYP3A4代谢，R-对映体主要由CYP2C9代谢","D.S-对映体的抗凝效力是R-对映体的3～5倍","E.CYP2C9基因多态性对华法林药效影响显著"],ans:"C",exp:"华法林的S-对映体的抗凝效力是R-对映体的3～5倍，S-对映体主要由CYP2C9代谢，R-对映体主要由CYP1A2和CYP3A4代谢，故华法林的药效更受CYP2C9影响。华法林可抑制维生素K环氧化物还原酶复合体1（VKORC1），阻断维生素K的再生循环，VKORC1基因多态性是华法林个体间用药差异的决定性因素。"},
    {type:"最佳选择题",q:"15. 仅在体外循环回路中发挥抗凝作用，在体内迅速失活的药物是",opts:["A.甲磺酸萘莫司他","B.那曲肝素钙","C.华法林","D.氯吡格雷","E.阿替普酶"],ans:"A",exp:"甲磺酸萘莫司他是人工合成的丝氨酸蛋白酶抑制剂，具有在体外循环回路中发挥抗凝作用、在体内迅速失活的优势，出血风险低。那曲肝素钙属于低分子量肝素，在体内、体外均有抗凝作用。华法林仅在体内具有抗凝作用。氯吡格雷属于抗血小板药。阿替普酶属于溶栓药。"},
    {type:"最佳选择题",q:"16. 关于妊娠期抗凝治疗药物选择的叙述，正确的是",opts:["A.华法林是妊娠期首选的抗凝药物，因其不易通过胎盘屏障","B.低分子量肝素是妊娠期首选的抗凝药物，因其给药相对容易且不会通过胎盘屏障","C.达比加群酯可作为妊娠期抗凝的替代选择，因其口服方便且无胎儿风险","D.肝素因半衰期长且使用方便，是妊娠期抗凝的最佳选择","E.利伐沙班在妊娠期使用最安全，因其治疗窗宽且无需监测"],ans:"B",exp:"低分子量肝素给药相对容易且不会通过胎盘屏障，出血风险较低，是妊娠期首选的抗凝药。妊娠期禁用达比加群酯、利伐沙班、华法林（具有高血栓栓塞风险的机械心脏瓣膜的妊娠期女性除外）。肝素起效快、失效快。"},
    {type:"最佳选择题",q:"17. 关于抗贫血药作用特点的说法，错误的是",opts:["A.补铁首选口服亚铁形式，同服维生素C可促进铁吸收，铁剂的吸收有黏膜自限现象，铁剂过多导致中毒可用去铁胺救治","B.口服铁剂后4～5日，血液中网织红细胞数即可上升，血红蛋白恢复正常，为了避免口服铁剂导致的便秘、腹痛、牙齿黑染等不良反应及时停止补铁","C.在使用叶酸和维生素B12治疗巨幼红细胞性贫血时，需要监测钾离子的血液浓度","D.重组人促红素一般适用于肾性贫血，应同时补充铁剂、叶酸和维生素B12","E.注射铁剂可用于口服铁剂后不奏效者"],ans:"B",exp:"口服铁剂后4～5日，血液中网织红细胞数可上升，在血红蛋白恢复正常后，仍需继续服用铁剂3～6个月，以补充缺失的贮存铁量。若口服铁剂后不奏效者可改为注射型铁剂。维生素B12会降低血钾浓度，因此在使用叶酸和维生素B12治疗巨幼红细胞性贫血时，需要监测钾离子的血液浓度。重组人促红素用于肾性贫血应同时补充铁剂、叶酸和维生素B12。"},
    {type:"最佳选择题",q:"18. 患者，男，64岁，既往有磺胺类药物过敏史，近期诊断出充血性心力衰竭，为减轻患者液体潴留，可选择的药物是",opts:["A.呋塞米","B.依他尼酸","C.氢氯噻嗪","D.布美他尼","E.吲达帕胺"],ans:"B",exp:"利尿药可以改善水肿症状，是心衰治疗中唯一能够控制体液潴留的药物。患者既往有磺胺过敏史，禁止使用有磺酰胺（脲）基团的药物，包括：①袢利尿药（呋塞米、布美他尼）；②噻嗪类和类噻嗪类利尿药（氢氯噻嗪、吲达帕胺）。而依他尼酸不含磺酰胺（脲）基团，不会引起磺胺样过敏反应。"},
    {type:"最佳选择题",q:"19. 索利那新可抑制逼尿肌不自主收缩，从而改善膀胱储尿功能，其作用机制为",opts:["A.非选择性拮抗M受体","B.选择性拮抗M3受体","C.选择性激动β3受体","D.选择性拮抗α1受体","E.选择性激动M3受体"],ans:"B",exp:"索利那新是高选择性M3受体拮抗剂，通过选择性作用于膀胱，拮抗乙酰胆碱与介导逼尿肌收缩的M3受体结合，抑制逼尿肌不自主收缩，从而改善膀胱储尿功能。"},
    {type:"最佳选择题",q:"20. 可用于治疗中枢性尿崩症和夜间遗尿症的药物是",opts:["A.促皮质素","B.醋酸去氨加压素","C.重组人生长激素","D.生长抑素","E.糖皮质激素"],ans:"B",exp:"醋酸去氨加压素具有较强的抗利尿作用及较弱的加压作用，临床用于治疗中枢性尿崩症、夜间遗尿症（6岁或以上的患者）。"},
    {type:"最佳选择题",q:"21. 属于长效糖皮质激素，生物效应可维持20～36小时的药物是",opts:["A.氢化可的松","B.泼尼松","C.曲安西龙","D.帕拉米松","E.倍他米松"],ans:"E",exp:"糖皮质激素根据药代动力学特征及作用时间可分为：①短效（8～12小时）：氢化可的松、可的松；②中效（12～36小时）：泼尼松、泼尼松龙、甲泼尼龙、曲安西龙等；③长效（20～36小时）：地塞米松、倍他米松；④关节腔内注射（36～72小时）：醋酸曲安奈德、醋酸甲泼尼龙、帕拉米松。"},
    {type:"最佳选择题",q:"22. 胰岛素的药理作用不包括",opts:["A.加速葡萄糖的无氧酵解和有氧氧化","B.促进肝糖原和肌糖原的合成和贮存","C.促进脂肪的合成，抑制脂肪分解","D.促进蛋白质的合成，抑制蛋白质分解","E.减少钾从细胞外液进入组织细胞内，纠正低血钾"],ans:"E",exp:"胰岛素的药理作用：①对糖代谢的影响：可增加葡萄糖的利用，能加速葡萄糖的无氧酵解和有氧氧化，促进肝糖原和肌糖原的合成和贮存，抑制糖原分解和糖异生，因而能使血糖降低；②对脂肪代谢的影响：促进脂肪的合成，抑制脂肪分解，使酮体生成减少，纠正酮症酸血症的各种症状；③对蛋白质代谢的影响：能促进蛋白质的合成，抑制蛋白质分解；④对血钾的影响：胰岛素和葡萄糖合用时，还可促使钾从细胞外液进入组织细胞内，纠正细胞内钾离子的缺乏。"},
    {type:"最佳选择题",q:"23. 关于磺酰脲类药物用药监护和管理的说法，不正确的是",opts:["A.对空腹血糖较高者，宜选用长效的格列齐特和格列美脲","B.餐后血糖升高者宜选用格列吡嗪、格列喹酮","C.对轻、中度肾功能不全者，宜选用格列喹酮","D.对急性心肌梗死者，急性期可使用格列美脲、格列吡嗪","E.格列本脲降糖作用强，持续时间长，一旦出现低血糖，纠正起来很困难"],ans:"D",exp:"对既往发生心肌梗死或存在心血管疾病高危因素者，宜选用格列美脲、格列吡嗪，不宜选用格列本脲。对急性心肌梗死者，急性期可使用胰岛素，急性期后再选择磺酰脲类药。"},
    {type:"最佳选择题",q:"24. 与米索前列醇片序贯合并使用，可用于终止停经49日内妊娠的药物是",opts:["A.左炔诺孕酮","B.米非司酮","C.雌二醇","D.庚酸炔诺酮","E.黄体酮"],ans:"B",exp:"米非司酮与米索前列醇片序贯合并使用，可用于终止停经49日内的妊娠。"},
    {type:"最佳选择题",q:"25. 对致病菌的杀菌效应和临床疗效取决于Cmax，而与作用时间和细菌接触的时间关系不密切，因此为提高疗效，一般推荐日剂量单次给药的抗菌药物是",opts:["A.阿莫西林","B.头孢噻肟","C.红霉素","D.莫西沙星","E.克林霉素"],ans:"D",exp:"喹诺酮类抗菌药（如莫西沙星）属于浓度依赖性抗菌药物，该类药物对致病菌的杀菌效应和临床疗效取决于Cmax，而与作用时间和细菌接触的时间关系不密切，即血浆峰浓度Cmax越高，清除致病菌的作用越迅速、越强。因此，提高此类抗菌药物疗效的策略主要是提高血浆峰浓度，一般推荐日剂量单次给药方案。阿莫西林、头孢噻肟、红霉素、克林霉素属于时间依赖性抗菌药物。"},
    {type:"最佳选择题",q:"26. 舒巴坦可与头孢哌酮制成复方制剂增强抗菌作用，舒巴坦属于",opts:["A.头霉素类抗菌药物","B.碳青霉烯类抗菌药物","C.单环β-内酰胺类抗菌药物","D.β-内酰胺酶抑制剂","E.乙酰转移酶抑制剂"],ans:"D",exp:"舒巴坦为β-内酰胺酶抑制剂，可抑制多种β-内酰胺酶活性包括超广谱β-内酰胺酶（ESBLs），常与β-内酰胺类抗生素（如头孢哌酮）配伍成复方制剂，保护β-内酰胺类抗生素不被水解失活，增强对产β-内酰胺酶细菌的抗菌能力，但其自身内在抗菌活性极弱。"},
    {type:"最佳选择题",q:"27. 利奈唑胺为抑菌剂，对肺炎链球菌可呈杀菌作用，其抗菌作用机制是",opts:["A.与细菌核糖体30S亚单位结合，抑制蛋白质的合成","B.与细菌核糖体50S亚单位结合，抑制蛋白质的合成","C.作用于二氢叶酸还原酶，干扰细菌叶酸代谢","D.作用于二氢叶酸合成酶，干扰细菌叶酸代谢","E.选择性干扰细菌DNA旋转酶或拓扑异构酶IV，抑制DNA的合成和复制而导致细菌死亡"],ans:"B",exp:"利奈唑胺的抗菌作用机制是与细菌核糖体50S亚单位结合，抑制mRNA与核糖体连接，阻止70S起始复合物的形成，从而抑制细菌蛋白质的合成。"},
    {type:"最佳选择题",q:"28. 患者，女，24岁，使用呋喃妥因肠溶片后出现与缺乏葡萄糖-6-磷酸脱氢酶有关的不良反应是",opts:["A.狼疮样反应","B.溶血性贫血","C.消化道反应","D.弥漫性间质性肺炎","E.急性单纯性下尿路感染"],ans:"B",exp:"葡萄糖-6-磷酸脱氢酶缺乏者使用呋喃妥因可引起溶血性贫血。"},
    {type:"最佳选择题",q:"29. 乙胺丁醇为人工合成抗结核药，使用期间可能出现的不良反应是",opts:["A.类流感样综合征、排泄物呈橘红色","B.关节痛、眼或皮肤黄染","C.球后视神经炎、高尿酸血症","D.耳蜗神经功能障碍、肾小管肿胀","E.周围神经炎、肝毒性"],ans:"C",exp:"乙胺丁醇的不良反应有：①球后视神经炎：视物模糊、红绿色盲或视力减退，视力变化可分单侧或双侧；②过敏反应；③关节肿痛、急性痛风、高尿酸血症；④周围神经炎；⑤胃肠道反应。"},
    {type:"最佳选择题",q:"30. 关于奥司他韦临床用药评价的描述，错误的是",opts:["A.服用前后，均可以接种三价灭活流感疫苗","B.为前药，其活性代谢产物为奥司他韦羧酸酯","C.应在首次出现流感症状48小时以内使用","D.既可用于1岁及以上人群甲型和乙型流感的治疗，也可用于预防","E.为妊娠期首选抗流感病毒药物"],ans:"D",exp:"奥司他韦可用于1岁及以上人群甲型和乙型流感的治疗，和13岁及以上人群甲型和乙型流感的预防。"},
    {type:"最佳选择题",q:"31. 以下属于抗新型冠状病毒药物的是",opts:["A.奈玛特韦/利托那韦","B.扎那米韦","C.索磷布韦-维帕他韦","D.阿德福韦酯","E.膦甲酸钠"],ans:"A",exp:"抗新型冠状病毒药有：①小分子药物：莫诺拉韦、瑞德西韦、阿兹夫定、奈玛特韦/利托那韦、先诺特韦/利托那韦、来瑞特韦等；②单克隆抗体：贝特洛韦单抗、安巴韦单抗/罗米司韦单抗。扎那米韦属于抗流感病毒药物。索磷布韦-维帕他韦属于抗丙型肝炎病毒药物。阿德福韦酯属于抗乙型肝炎病毒药物。膦甲酸钠属于抗疱疹病毒药物。"},
    {type:"最佳选择题",q:"32. 属于防治盘尾丝虫病的首选药物的是",opts:["A.伯氨喹","B.阿苯达唑","C.伊维菌素","D.吡喹酮","E.巴龙霉素"],ans:"C",exp:"伊维菌素是抗肠道线虫药，为防治盘尾丝虫病的首选药物。"},
    {type:"最佳选择题",q:"33. 为抗体药物偶联物，适用于接受了紫杉醇类联合曲妥珠单抗为基础的新辅助治疗后仍残存侵袭性病灶的人表皮生长因子受体-2（HER-2）阳性早期乳腺癌患者的辅助治疗的抗肿瘤药是",opts:["A.曲妥珠单抗","B.帕妥珠单抗","C.西妥昔单抗","D.恩美曲妥珠单抗","E.拉帕替尼"],ans:"D",exp:"恩美曲妥珠单抗为抗体药物偶联物，适用于接受了紫杉醇类联合曲妥珠单抗为基础的新辅助治疗后仍残存侵袭性病灶的人表皮生长因子受体-2（HER-2）阳性早期乳腺癌患者的辅助治疗；接受了紫杉醇类和曲妥珠单抗治疗的HER-2阳性、不可切除局部晚期或转移性乳腺癌患者。曲妥珠单抗、帕妥珠单抗、西妥昔单抗为单克隆抗体类药物。拉帕替尼为酪氨酸激酶抑制剂。"},
    {type:"最佳选择题",q:"34. 酪氨酸激酶抑制剂的主要代谢酶是",opts:["A.CYP2C19","B.CYP3A4","C.CYP2C9","D.CYP2D6","E.CYP2E1"],ans:"B",exp:"多数酪氨酸激酶抑制剂通过肝药酶CYP3A4代谢，可受肝药酶诱导剂与肝药酶抑制剂影响。"},
    {type:"最佳选择题",q:"35. 维A酸用于治疗",opts:["A.慢性粒细胞白血病急变期、加速期","B.转移性结直肠癌和晚期、转移性或复发性非小细胞肺癌","C.非小细胞肺癌、乳腺癌","D.急性早幼粒细胞白血病（APL）的诱导","E.不能切除的局部晚期或转移性胃癌"],ans:"D",exp:"维A酸主要用于急性早幼粒细胞白血病（APL）的诱导缓解治疗和维持治疗。"},
    {type:"最佳选择题",q:"36. 氯化钾用于治疗",opts:["A.甲状旁腺功能亢进症术后的“骨饥饿综合征”","B.各种原因所致的水中毒","C.普鲁卡因胺引起的心律失常伴有酸血症","D.洋地黄中毒引起的多源性期前收缩或快速型心律失常","E.高钾血症、饥饿性酮症"],ans:"D",exp:"氯化钾可用于防治低钾血症，治疗洋地黄中毒引起的频发性、多源性期前收缩或快速型心律失常。氯化钾用于甲状旁腺功能亢进术后的“骨饥饿综合征”。浓氯化钠主要用于各种原因所致的水中毒及严重的低钠血症。乳酸钠用于高钾血症或普鲁卡因胺引起的心律失常伴有酸血症者。葡萄糖用于补充能量和体液、高钾血症、饥饿性酮症。"},
    {type:"最佳选择题",q:"37. 属于乳酸钠适应证的是",opts:["A.饥饿性酮症","B.代谢性碱中毒","C.代谢性酸中毒","D.低钾血症","E.韦尼克脑病"],ans:"C",exp:"乳酸钠具有碱化体液或尿液作用，可用于代谢性酸中毒；还可用于高钾血症或普鲁卡因胺引起的心律失常伴有酸血症者。"},
    {type:"最佳选择题",q:"38. 口腔治疗控制疼痛最常用的药物是",opts:["A.免疫调节药","B.抗炎镇痛药","C.消毒防腐药","D.局部麻醉药","E.抗感染药"],ans:"D",exp:"口腔治疗控制疼痛最常用的药物是局部麻醉药，如利多卡因、复方盐酸阿替卡因、普鲁卡因、甲哌卡因、丁卡因等。"},
    {type:"最佳选择题",q:"39. 特比萘芬用于浅部真菌感染，其作用机制为",opts:["A.干扰真菌细胞膜麦角固醇的合成而导致真菌死亡","B.使细胞膜的渗透性增加，钾离子和其他内容物溶出，细胞死亡","C.干扰真菌的核酸合成及功能","D.非竞争性、可逆性抑制角鲨烯环氧化酶","E.作用于真菌细胞壁，主要影响壳多糖、葡聚糖、甘露聚糖和甘露聚糖-蛋白质复合体"],ans:"D",exp:"特比萘芬属于丙烯胺类抗真菌药，为角鲨烯环氧化酶的非竞争性、可逆性抑制剂。"},
    {type:"最佳选择题",q:"40. 可用于治疗白癜风和银屑病的药物是",opts:["A.托法替布","B.煤焦油","C.阿达帕林","D.甲氧沙林","E.莫匹罗星"],ans:"D",exp:"甲氧沙林可口服也可以外用，主要治疗白癜风和银屑病等。托法替布、煤焦油属于银屑病治疗药物。阿达帕林属于痤疮治疗药物。莫匹罗星为抗生素，主要用于革兰阳性球菌引起的感染。"},

    // ===== 二、配伍选择题（41-90） =====
    {type:"配伍选择题",subs:[
      {q:"41. 阿片类药物与阿托品合用，可发生的风险是",opts:["A.胆绞痛","B.低血压","C.麻痹性肠梗阻","D.惊厥","E.低血糖"],ans:"C",exp:"阿片类镇痛药与抗胆碱药尤其是阿托品合用，不仅能加重便秘，还可增加麻痹性肠梗阻和尿潴留危险。"},
      {q:"42. 阿片类药物与硫酸镁合用，可发生的风险是",opts:["A.胆绞痛","B.低血压","C.麻痹性肠梗阻","D.惊厥","E.低血糖"],ans:"B",exp:"硫酸镁与阿片类镇痛药合用可增强中枢抑制，增加呼吸抑制和低血压风险。"},
      {q:"43. 阿片类药物与吗氯贝胺合用，可发生的风险是",opts:["A.胆绞痛","B.低血压","C.麻痹性肠梗阻","D.惊厥","E.低血糖"],ans:"D",exp:"单胺氧化酶抑制剂（如吗氯贝胺）与阿片类镇痛药尤其是吗啡、哌替啶合用可发生严重的，甚至致死的不良反应，包括躁狂、多汗、僵直、呼吸抑制、昏迷、惊厥和高热。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"44. 可引起肝损伤，12岁以下儿童禁用的非甾体抗炎药是",opts:["A.双氯芬酸","B.塞来昔布","C.吲哚美辛","D.尼美舒利","E.对乙酰氨基酚"],ans:"D",exp:"尼美舒利可引起肝损伤，12岁以下儿童禁用。"},
      {q:"45. 不良反应大，不作为治疗关节炎的首选药，仅在其他非甾体抗炎药无效时才考虑使用的药物是",opts:["A.双氯芬酸","B.塞来昔布","C.吲哚美辛","D.尼美舒利","E.对乙酰氨基酚"],ans:"C",exp:"吲哚美辛可兴奋中枢，加重癫痫、帕金森及精神疾病患者病情，不良反应较大，治疗关节炎已不作为首选用药，仅在其他非甾体抗炎药无效时才考虑使用。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"46. 为骨关节炎白细胞介素-1（IL-1）的重要抑制剂，具有止痛、抗炎及退热作用的药物是",opts:["A.依那西普","B.司库奇尤单抗","C.双醋瑞因","D.甲氨蝶呤","E.来氟米特"],ans:"C",exp:"双醋瑞因为骨关节炎白细胞介素-1（IL-1）的重要抑制剂，可诱导软骨生成，具有止痛、抗炎及退热作用，但不抑制前列腺素合成。"},
      {q:"47. 通过抑制合成嘧啶的二氢乳清酸脱氢酶，使活化淋巴细胞的生长受抑制的药物是",opts:["A.依那西普","B.司库奇尤单抗","C.双醋瑞因","D.甲氨蝶呤","E.来氟米特"],ans:"E",exp:"来氟米特主要通过抑制合成嘧啶的二氢乳清酸脱氢酶，使活化淋巴细胞的生长受抑制。依那西普是一种融合蛋白类肿瘤坏死因子（TNF-α）抑制剂。司库奇尤单抗属于IL-17（白细胞介素-17）抑制剂。甲氨蝶呤通过抑制细胞内二氢叶酸还原酶，使嘌呤合成受抑制，同时具有抗炎作用。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"48. 具有较强的黏液溶解作用，适用于大量黏膜阻塞而引起的呼吸困难，还可治疗环磷酰胺引起的出血性膀胱炎的药物是",opts:["A.氯化铵","B.福莫特罗","C.茶碱","D.氟替卡松","E.乙酰半胱氨酸"],ans:"E",exp:"乙酰半胱氨酸具有较强的黏痰溶解作用，不仅能溶解白色黏痰，也能溶解脓性痰，适用于大量黏痰阻塞而引起的呼吸困难，如急性和慢性支气管炎、慢性阻塞性肺疾病、肺炎、肺气肿等引起的痰液黏稠、咳痰困难。乙酰半胱氨酸还可保护细胞免受氧自由基等毒性物质的损害，故还可用于对乙酰氨基酚中毒的解救，治疗环磷酰胺引起的出血性膀胱炎。"},
      {q:"49. 长期吸入给药可能引起口腔、咽喉部的念珠菌感染，使用后应立即漱口的药物是",opts:["A.氯化铵","B.福莫特罗","C.茶碱","D.氟替卡松","E.乙酰半胱氨酸"],ans:"D",exp:"氟替卡松属于吸入型肾上腺糖皮质激素，少数长期吸入给药患者可能引起口腔、咽喉部的念珠菌感染，表现为声音嘶哑、咽部不适，吸药后用水漱口及局部应用抗霉菌药物可降低发生率。"},
      {q:"50. 对胃肠道刺激性大，可见血性呕吐物或柏油样大便的药物是",opts:["A.氯化铵","B.福莫特罗","C.茶碱","D.氟替卡松","E.乙酰半胱氨酸"],ans:"C",exp:"茶碱属于黄嘌呤类药物，由于对胃肠道刺激性大，可见血性呕吐物或柏油样大便。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"51. 在5-HT3受体拮抗剂联合地塞米松的基础上，加用可拮抗P物质对中枢NK-1受体的致吐作用，显著改善高致吐风险药物所致的CINV的药物是",opts:["A.奥氮平","B.阿瑞匹坦","C.甲氧氯普胺","D.昂丹司琼","E.劳拉西泮"],ans:"B",exp:"NK-1受体拮抗剂（如阿瑞匹坦），可拮抗P物质对中枢NK-1受体的致吐作用，在5-HT3受体拮抗剂联合地塞米松的基础上，加用NK-1受体拮抗剂能更显著改善高致吐风险药物所致的CINV。"},
      {q:"52. 主要作为辅助药物，用于减轻地塞米松所致焦虑，也可用于减少预期性恶心呕吐的药物是",opts:["A.奥氮平","B.阿瑞匹坦","C.甲氧氯普胺","D.昂丹司琼","E.劳拉西泮"],ans:"E",exp:"苯二氮䓬类药物（如劳拉西泮和阿普唑仑）单独应用时止吐作用相对较弱，主要作为辅助药物，用于减轻地塞米松所致焦虑和甲氧氯普胺所致静坐不能，也可用于减少预期性的恶心呕吐。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"53. 既能拮抗多巴胺D2受体，又能抑制乙酰胆碱酯酶活性的胃肠动力药是",opts:["A.伊托必利","B.甲氧氯普胺","C.多潘立酮","D.莫沙必利","E.曲美布汀"],ans:"A",exp:"伊托必利既可拮抗多巴胺D2受体活性，又能抑制乙酰胆碱酯酶活性。"},
      {q:"54. 能选择性激动5-HT4受体，促进乙酰胆碱释放的胃肠动力药是",opts:["A.伊托必利","B.甲氧氯普胺","C.多潘立酮","D.莫沙必利","E.曲美布汀"],ans:"D",exp:"莫沙必利属于5-HT4受体激动剂，可选择性激动5-HT4受体，促进乙酰胆碱释放。甲氧氯普胺可拮抗中枢及外周多巴胺D2受体。多潘立酮可拮抗外周多巴胺D2受体。曲美布汀属于功能性胃肠病治疗药。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"55. 属于钠通道阻滞剂，对短动作电位时程的心房肌无效，仅用于室性心律失常的药物是",opts:["A.利多卡因","B.索他洛尔","C.硝苯地平","D.普鲁卡因胺","E.维拉帕米"],ans:"A",exp:"利多卡因属于Ib类钠通道阻滞剂，对短动作电位时程的心房肌无效，因此仅用于室性心律失常。普鲁卡因胺属于Ia类钠通道阻滞剂，为广谱抗心律失常药，可用于室上性和室性心律失常的治疗。"},
      {q:"56. 选择性的作用于窦房结和房室结上L-型钙通道，通过减慢房室结传导速度，减低窦房结自律性从而减慢心率的抗心律失常药是",opts:["A.利多卡因","B.索他洛尔","C.硝苯地平","D.普鲁卡因胺","E.维拉帕米"],ans:"E",exp:"非二氢吡啶类钙通道阻滞剂（如维拉帕米、地尔硫䓬）对窦房结和房室结处的钙通道具有选择性，而对血管选择性差，通过减慢房室结传导速度，减低窦房结自律性从而减慢心率。硝苯地平属于二氢吡啶类钙通道阻滞剂，主要作用于血管平滑肌上的L型钙通道，发挥舒张血管和降压作用。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"57. 福辛普利用于高血压的初始剂量是",opts:["A.每次5mg","B.每次10mg","C.每次20mg","D.每次80mg","E.每次150mg"],ans:"B",exp:"福辛普利用于高血压，初始剂量一次10mg，一日1次。"},
      {q:"58. 厄贝沙坦用于高血压的初始剂量是",opts:["A.每次5mg","B.每次10mg","C.每次20mg","D.每次80mg","E.每次150mg"],ans:"E",exp:"厄贝沙坦用于高血压，初始剂量一次150mg，一日1次。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"59. 宜现配现用，溶液的保存与应用不应超过24h，且遇光易变质的抗高血压药是",opts:["A.阿利吉仑","B.硝苯地平","C.福辛普利","D.硝普钠","E.普萘洛尔"],ans:"D",exp:"硝普钠溶液的保存与应用不应超过24h，溶液遇光易变质，需在避光输液瓶中静脉滴注，不可静脉注射，应缓慢静滴或使用微量输液泵。"},
      {q:"60. 长期使用突然停药可发生反跳现象的抗高血压药是",opts:["A.阿利吉仑","B.硝苯地平","C.福辛普利","D.硝普钠","E.普萘洛尔"],ans:"E",exp:"长期应用β受体拮抗剂突然停药可发生反跳现象，即原有症状加重或出现新的表现，称之为撤药综合征。如需停用β受体拮抗剂应逐步撤药，至少经过3天，一般为2周。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"61. 可逆性地抑制血小板COX-1，减少TXA2的合成，使血小板无法聚集的药物是",opts:["A.阿司匹林","B.氯吡格雷","C.替罗非班","D.吲哚布芬","E.替格瑞洛"],ans:"D",exp:"阿司匹林、吲哚布芬属于血栓素A2（TXA2）抑制剂，可抑制环氧化酶-1（COX-1），减少血栓素A2（TXA2）合成，使血小板无法聚集。其中，吲哚布芬对血小板COX-1的抑制作用可逆，阿司匹林对血小板COX-1的抑制作用不可逆。"},
      {q:"62. 可直接、可逆性地拮抗P2Y12受体，起效更快的药物是",opts:["A.阿司匹林","B.氯吡格雷","C.替罗非班","D.吲哚布芬","E.替格瑞洛"],ans:"E",exp:"噻氯匹定和氯吡格雷属于不可逆性P2Y12受体拮抗剂，替格瑞洛可直接、可逆地抑制P2Y12受体，起效更快。"},
      {q:"63. 可逆性地拮抗血小板糖蛋白（GP）IIb/IIIa受体的药物是",opts:["A.阿司匹林","B.氯吡格雷","C.替罗非班","D.吲哚布芬","E.替格瑞洛"],ans:"C",exp:"阿昔单抗、替罗非班和依替巴肽属于血小板糖蛋白（GP）IIb/IIIa受体拮抗剂，阿昔单抗作用不可逆；替罗非班和依替巴肽作用可逆。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"64. 可促进凝血因子合成的药物是",opts:["A.卡络磺钠","B.蛇毒血凝酶","C.氨甲环酸","D.甲萘氢醌","E.艾曲泊帕乙醇胺"],ans:"D",exp:"维生素K是肝脏合成凝血因子（II、VII、IX、X）必不可少的辅因子，维生素K类药物包括维生素K1、维生素K4（甲萘氢醌）、甲萘醌。"},
      {q:"65. 可促进纤维蛋白原转化为纤维蛋白的药物是",opts:["A.卡络磺钠","B.蛇毒血凝酶","C.氨甲环酸","D.甲萘氢醌","E.艾曲泊帕乙醇胺"],ans:"B",exp:"蛇毒血凝酶是从蛇毒中分离出的活性成分，可促进纤维蛋白原转化为纤维蛋白，而发挥止血作用。卡络磺钠属于毛细血管止血药。氨甲环酸属于抗纤维蛋白溶解药。艾曲泊帕乙醇胺属于促血小板生成药。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"66. 易引起直立性低血压、眩晕，甚至有“首剂效应”的药物是",opts:["A.普适泰","B.多沙唑嗪","C.非那雄胺","D.赛洛多辛","E.他达拉非"],ans:"B",exp:"非选择性α1受体拮抗药（如多沙唑嗪）对前列腺和外周血管平滑肌上α1受体都有拮抗作用，因此，在使用过程中易发生直立性低血压、眩晕，甚至有“首剂效应”和出现晕厥。赛洛多辛是具有尿路选择性α1受体拮抗药，很少发生低血压。"},
      {q:"67. 易引起性功能障碍，如性欲下降、勃起功能障碍、射精障碍的药物是",opts:["A.普适泰","B.多沙唑嗪","C.非那雄胺","D.赛洛多辛","E.他达拉非"],ans:"C",exp:"5α还原酶抑制剂（非那雄胺）可引起性功能障碍，如性欲下降、勃起功能障碍、射精障碍。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"68. 属于葡萄糖激酶激活剂的药物是",opts:["A.米格列奈","B.米格列醇","C.度拉糖肽","D.艾托格列净","E.多格列艾汀"],ans:"E",exp:"葡萄糖激酶激活剂的代表药品为多格列艾汀。"},
      {q:"69. 属于α-葡萄糖苷酶抑制剂的药物是",opts:["A.米格列奈","B.米格列醇","C.度拉糖肽","D.艾托格列净","E.多格列艾汀"],ans:"B",exp:"α-葡萄糖苷酶抑制剂的代表药品有阿卡波糖、伏格列波糖、米格列醇。米格列奈属于格列奈（非磺酰脲）类促胰岛素分泌药。度拉糖肽属于胰高血糖素样肽-1受体激动剂。艾托格列净属于钠-葡萄糖协同转运蛋白2抑制剂。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"70. 降血糖能力受滤过的葡萄糖负荷和渗透性利尿的限制，重度肾功能不全者不建议使用的药物是",opts:["A.格列齐特","B.达格列净","C.西格列汀","D.二甲双胍","E.瑞格列奈"],ans:"B",exp:"达格列净属于钠-葡萄糖协同转运蛋白2抑制剂，其降低血糖和糖化血红蛋白的能力受滤过的葡萄糖负荷和这类药物引起的渗透性利尿的限制，在重度肾功能不全患者中降糖效果显著下降，不建议使用。"},
      {q:"71. 以原型由肾脏从尿中排出，清除迅速，肾功能不全者应在造影前或检查时停用的药物是",opts:["A.格列齐特","B.达格列净","C.西格列汀","D.二甲双胍","E.瑞格列奈"],ans:"D",exp:"二甲双胍以原型由肾脏从尿中排出，清除迅速，肾功能不全患者eGFR>60ml/(min·1.73m²)应在造影前或检查时停用二甲双胍，在检查完至少48小时且复查肾功能无恶化后可继续用药。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"72. 快速静脉输注，在血液中可与钙螯合形成复合物，导致肾衰竭的药物是",opts:["A.雷洛昔芬","B.鲑降钙素","C.特立帕肽","D.唑来膦酸","E.阿法骨化醇"],ans:"D",exp:"快速静脉输注双膦酸盐类（如唑来膦酸），在血液中可与钙螯合形成复合物，导致肾衰竭。"},
      {q:"73. 正在或既往患有血栓、静脉血栓栓塞性疾病者禁用的药物是",opts:["A.雷洛昔芬","B.鲑降钙素","C.特立帕肽","D.唑来膦酸","E.阿法骨化醇"],ans:"A",exp:"雌激素受体调节剂雷洛昔芬可能增加静脉血栓栓塞事件的危险性，对正在或既往患有血栓、静脉血栓栓塞性疾病者，包括深静脉血栓、肺栓塞、视网膜静脉血栓者禁用。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"74. 头霉素类抗菌药物抗菌谱与第二代头孢菌素类似，但对大多数超广谱β-内酰胺酶稳定，且对拟杆菌属等厌氧菌具有抗菌活性。属于头霉素类抗菌药物的是",opts:["A.美罗培南","B.拉氧头孢","C.头孢唑林","D.头孢西丁","E.氨曲南"],ans:"D",exp:"头霉素类抗菌药物包括：头孢美唑、头孢西丁、头孢米诺、头孢替坦；此类药物抗菌谱与第二代头孢菌素类相似，但对大多数超广谱β-内酰胺酶稳定，且对拟杆菌属等厌氧菌具有抗菌活性。"},
      {q:"75. 碳青霉烯类抗菌药物对革兰阳性菌、革兰阴性菌、需氧菌、厌氧菌均有疗效，在多重耐药菌感染、需氧菌与厌氧菌混合感染、重症感染及免疫缺陷患者感染中发挥重要作用。属于碳青霉烯类抗菌药物的是",opts:["A.美罗培南","B.拉氧头孢","C.头孢唑林","D.头孢西丁","E.氨曲南"],ans:"A",exp:"碳青霉烯类抗菌药物的代表药品有美罗培南、亚胺培南、比阿培南、厄他培南等；此类药物抗菌谱广，包括革兰阳性菌、革兰阴性菌、需氧菌、厌氧菌，临床适应证广，在多重耐药菌感染、需氧菌与厌氧菌混合感染、重症感染及免疫缺陷患者感染等的抗菌治疗中发挥着重要作用。拉氧头孢属于氧头孢烯类抗菌药物。头孢唑林属于头孢菌素类抗菌药物。氨曲南属于单环β-内酰胺类抗菌药物。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"76. 目前只有注射剂型，仅限于治疗其他抗生素不适用的复杂感染的药物是",opts:["A.甲硝唑","B.四环素","C.替加环素","D.克林霉素","E.万古霉素"],ans:"C",exp:"替加环素肠道吸收不足，目前只有注射剂型，且仅限于治疗其他抗生素不适用的复杂感染，并需经过有经验的感染科医生或临床医生讨论后方可使用，比如用于成人及18岁以上患者复杂性腹腔感染、复杂性皮肤和皮肤软组织感染、社区获得性细菌性肺炎；8岁以上儿童患者复杂性腹腔感染、复杂性皮肤和皮肤软组织感染。"},
      {q:"77. 主要用于厌氧菌感染，且为金黄色葡萄球菌引起的急慢性骨髓炎及关节感染首选的药物是",opts:["A.甲硝唑","B.四环素","C.替加环素","D.克林霉素","E.万古霉素"],ans:"D",exp:"克林霉素属于林可霉素类药物，此类药物临床上主要用于厌氧菌感染的治疗，且体内分布较好，可渗透入骨骼，是治疗金黄色葡萄球菌引起的急慢性骨髓炎及关节感染的首选药。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"78. 与林可霉素类药物联合使用，可发生拮抗作用，且可抑制肝微粒体酶活性的药物是",opts:["A.奥沙利铂","B.羟喜树碱","C.氯霉素","D.多柔比星","E.左氧氟沙星"],ans:"C",exp:"氯霉素属于酰胺醇类抗菌药物，可抑制肝微粒体酶的活性，导致乙内酰脲类抗癫痫药代谢减慢；与抗菌作用机制相似的大环内酯类和林可霉素类抗菌药物联合使用，可发生拮抗作用。"},
      {q:"79. 与氢氧化铝或乳酸钙合用，可导致吸收量降低，且可抑制肝微粒体酶活性的药物是",opts:["A.奥沙利铂","B.羟喜树碱","C.氯霉素","D.多柔比星","E.左氧氟沙星"],ans:"E",exp:"左氧氟沙星为喹诺酮类抗菌药物，可抑制肝微粒体酶的活性，延长茶碱的消除半衰期；含铝、钙、铁等多价阳离子的制剂可降低其吸收量，避免同服。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"80. 患者，女，29岁，因阴道滴虫病口服甲硝唑治疗，用药期间聚会饮酒后出现全身皮肤潮红、头晕、头痛、胸闷、呼吸困难、言语混乱、意识障碍等症状，该反应称为",opts:["A.红人综合征","B.特异质反应","C.双硫仑样反应","D.赫氏反应","E.I型变态反应"],ans:"C",exp:"服用甲硝唑期间或之后5～7日内饮酒或服用含有乙醇的药物、食物以及外用乙醇均可抑制乙醛脱氢酶活性，使乙醛代谢为乙酸的路径受阻，从而导致乙醛在体内蓄积，引起双硫仑样反应，临床可表现为颜面潮红、头痛、头晕、胸闷、呼吸困难等症状。"},
      {q:"81. 患者，男，54岁，因肺炎链球菌所致心内膜炎使用万古霉素治疗，滴注期间患者出现心跳骤停、喘鸣、呼吸困难、上部躯体发红等症状，该反应称为",opts:["A.红人综合征","B.特异质反应","C.双硫仑样反应","D.赫氏反应","E.I型变态反应"],ans:"A",exp:"万古霉素和去甲万古霉素快速滴注时可出现血压降低，甚至心跳骤停，以及喘鸣、呼吸困难、上部躯干发红等红人综合征的表现，故滴注速度应慢。"}

    {type:"配伍选择题",subs:[

var currentChapter=0,answered=0,correct=0;
function initChapterSelect(){var sel=document.getElementById('chapterSelect');sel.innerHTML='';for(var i=0;i<chapters.length;i++){var opt=document.createElement('option');opt.value=i;opt.textContent=chapters[i].name;sel.appendChild(opt);}}
function switchChapter(index){currentChapter=parseInt(index);answered=0;correct=0;renderChapter();document.getElementById('chapterSelect').value=currentChapter;}
function prevChapter(){if(currentChapter>0)switchChapter(currentChapter-1);}
function nextChapter(){if(currentChapter<chapters.length-1)switchChapter(currentChapter+1);}
function updateNavButtons(){document.getElementById('prevBtn').disabled=(currentChapter===0);document.getElementById('nextBtn').disabled=(currentChapter===chapters.length-1);}
var currentQuestionIndex=0;

function renderChapter(){
  var ch=chapters[currentChapter];
  document.getElementById('chapterTitle').textContent=ch.name;
  var flat=[];
  for(var i=0;i<ch.questions.length;i++){
    var item=ch.questions[i];
    if(item.subs){
      for(var j=0;j<item.subs.length;j++){
        flat.push({type:'配伍选择题',q:item.subs[j].q,opts:item.subs[j].opts,ans:item.subs[j].ans,optImgs:item.subs[j].optImgs,img:item.subs[j].img});
      }
    }else{
      flat.push(item);
    }
  }
  ch._flat=flat;
  currentQuestionIndex=0;
  answered=0;
  correct=0;
  renderOneQuestion();
  updateNavButtons();
}

function renderOneQuestion(){
  var ch=chapters[currentChapter];
  var flat=ch._flat;
  var quiz=document.getElementById('quiz');
  quiz.innerHTML='';
  document.getElementById('stats').textContent='已答 '+answered+' / '+flat.length+' 题，正确 '+correct+' 题';
  var oldBar=document.getElementById('quiz-nav-bar');
  if(oldBar)oldBar.remove();
  if(currentQuestionIndex>=flat.length){
    quiz.innerHTML='<div class="card" style="text-align:center;padding:40px 20px;"><h2>🎉 本章已完成！</h2><p>共 '+flat.length+' 题，答对 '+correct+' 题</p></div>';
    showNextBar('chapter-end');
    return;
  }
  var item=flat[currentQuestionIndex];
  var card=document.createElement('div');
  card.className='card';
  var tag=document.createElement('div');
  tag.className='tag';
  tag.textContent=item.type+'  ·  第 '+(currentQuestionIndex+1)+' / '+flat.length+' 题';
  card.appendChild(tag);
  var title=document.createElement('div');
  title.className='q-title';
  title.textContent=item.q;
  card.appendChild(title);
  if(item.img){
    var imgEl=document.createElement('img');
    imgEl.src=item.img;
    imgEl.style.cssText='max-width:100%;display:block;margin:10px auto;border-radius:6px;';
    imgEl.onerror=function(){this.style.display='none';};
    card.appendChild(imgEl);
  }
  var ansArr=item.ans.split('');
  var isMulti=ansArr.length>1;
  var selected=[];
  var allButtons=[];
  for(var k=0;k<item.opts.length;k++){
    (function(opt, idx){
      var btn=document.createElement('button');
      btn.className='option';
      if(item.optImgs && item.optImgs[idx]){
        var letterSpan=document.createElement('span');
        letterSpan.textContent=opt+' ';
        letterSpan.style.cssText='display:inline-block;vertical-align:top;font-weight:600;margin-right:6px;';
        btn.appendChild(letterSpan);
        var optImg=document.createElement('img');
        optImg.src=item.optImgs[idx];
        optImg.style.cssText='max-width:85%;max-height:150px;display:inline-block;vertical-align:middle;border-radius:4px;';
        optImg.onerror=function(){this.style.display='none';};
        btn.appendChild(optImg);
      }else{
        btn.textContent=opt;
      }
      var letter=opt.charAt(0);
      btn.onclick=function(){
        if(btn.classList.contains('disabled'))return;
        if(isMulti){
          var ix=selected.indexOf(letter);
          if(ix===-1){selected.push(letter);btn.style.background='#d0e3ff';btn.style.borderColor='#4a90e2';}
          else{selected.splice(ix,1);btn.style.background='';btn.style.borderColor='';}
        }else{judgeOne([letter]);}
      };
      allButtons.push(btn);
      card.appendChild(btn);
    })(item.opts[k], k);
  }
  if(isMulti){
    var submitBtn=document.createElement('button');
    submitBtn.textContent='提交答案';
    submitBtn.style.cssText='margin-top:12px;padding:12px 20px;background:#4a90e2;color:#fff;border:none;border-radius:8px;font-size:15px;cursor:pointer;width:100%;';
    submitBtn.onclick=function(){
      if(selected.length===0){alert('请至少选择一个选项');return;}
      judgeOne(selected);
      submitBtn.disabled=true;
      submitBtn.style.background='#c5d5ea';
    };
    card.appendChild(submitBtn);
  }
  var expDiv=document.createElement('div');
  expDiv.className='explanation';
  expDiv.textContent=item.exp?'解析：'+item.exp:'';
  card.appendChild(expDiv);
  quiz.appendChild(card);

  function judgeOne(chosen){
    var isCorrect=false;
    if(isMulti){
      if(chosen.length===ansArr.length){
        var sc=chosen.slice().sort().join('');
        var sa=ansArr.slice().sort().join('');
        isCorrect=(sc===sa);
      }
    }else{
      isCorrect=ansArr.indexOf(chosen[0])!==-1;
    }
    for(var i=0;i<allButtons.length;i++){
      var b=allButtons[i];
      var letter=b.textContent.charAt(0);
      if(ansArr.indexOf(letter)!==-1)b.classList.add('correct');
      if(!isCorrect&&chosen.indexOf(letter)!==-1&&ansArr.indexOf(letter)===-1)b.classList.add('wrong');
      b.classList.add('disabled');
      b.style.background='';
      b.style.borderColor='';
    }
    if(isCorrect){
      correct++;
      answered++;
      expDiv.classList.add('show');
      document.getElementById('stats').textContent='已答 '+answered+' / '+flat.length+' 题，正确 '+correct+' 题';
      showNextBar(true);
      var countdown=3;
      var btn=document.querySelector('.quiz-nav .next-btn:last-child');
      var timer=setInterval(function(){
        countdown--;
        if(btn)btn.textContent='即将跳转… '+countdown;
        if(countdown<=0){clearInterval(timer);currentQuestionIndex++;renderOneQuestion();}
      },500);
    }else{
      answered++;
      document.getElementById('stats').textContent='已答 '+answered+' / '+flat.length+' 题，正确 '+correct+' 题';
      expDiv.classList.add('show');
      showNextBar(false);
    }
  }
}

function showNextBar(mode){
  var oldBar=document.getElementById('quiz-nav-bar');
  if(oldBar)oldBar.remove();
  var bar=document.createElement('div');
  bar.className='quiz-nav';
  bar.id='quiz-nav-bar';
  var flat=chapters[currentChapter]._flat;
  if(mode==='chapter-end'){
    var progress=document.createElement('div');
    progress.className='progress-text';
    progress.textContent='本章完成';
    bar.appendChild(progress);
    var prevBtn=document.createElement('button');
    prevBtn.className='next-btn';
    prevBtn.textContent='上一章';
    prevBtn.disabled=(currentChapter===0);
    prevBtn.onclick=function(){prevChapter();};
    bar.appendChild(prevBtn);
    var nextBtn=document.createElement('button');
    nextBtn.className='next-btn';
    nextBtn.textContent='下一章';
    nextBtn.disabled=(currentChapter===chapters.length-1);
    nextBtn.onclick=function(){nextChapter();};
    bar.appendChild(nextBtn);
    document.body.appendChild(bar);
    return;
  }
  var isLast=(currentQuestionIndex>=flat.length-1);
  if(isLast){
    var progress=document.createElement('div');
    progress.className='progress-text';
    progress.textContent='本章最后一题';
    bar.appendChild(progress);
    var prevBtn=document.createElement('button');
    prevBtn.className='next-btn';
    prevBtn.textContent='上一题';
    prevBtn.disabled=(currentQuestionIndex===0);
    prevBtn.onclick=function(){if(currentQuestionIndex>0){currentQuestionIndex--;renderOneQuestion();}};
    bar.appendChild(prevBtn);
    var nextChapterBtn=document.createElement('button');
    nextChapterBtn.className='next-btn';
    nextChapterBtn.textContent='下一章';
    nextChapterBtn.disabled=(currentChapter===chapters.length-1);
    nextChapterBtn.onclick=function(){nextChapter();};
    bar.appendChild(nextChapterBtn);
    document.body.appendChild(bar);
    return;
  }
  var autoNext=(mode===true);
  var progress=document.createElement('div');
  progress.className='progress-text';
  progress.textContent=(currentQuestionIndex+1)+' / '+flat.length;
  bar.appendChild(progress);
  var prevBtn=document.createElement('button');
  prevBtn.className='next-btn';
  prevBtn.textContent='上一题';
  prevBtn.disabled=(currentQuestionIndex===0);
  prevBtn.onclick=function(){if(currentQuestionIndex>0){currentQuestionIndex--;renderOneQuestion();}};
  bar.appendChild(prevBtn);
  var nextBtn=document.createElement('button');
  nextBtn.className='next-btn';
  nextBtn.textContent=autoNext?'即将跳转…':'下一题';
  nextBtn.disabled=autoNext;
  nextBtn.onclick=function(){currentQuestionIndex++;renderOneQuestion();};
  bar.appendChild(nextBtn);
  document.body.appendChild(bar);
}
// ===== 全局滑动手势：右划上一题，左划下一题 =====
(function () {
  var touchStartX = 0, touchStartY = 0, isHorizontal = false;
  document.addEventListener('touchstart', function (e) {
    var target = e.target;
    if (target.closest && target.closest('#quiz')) {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
      isHorizontal = false;
    } else {
      touchStartX = 0;
      touchStartY = 0;
      isHorizontal = false;
    }
  }, { passive: true });
  document.addEventListener('touchmove', function (e) {
    if (touchStartX === 0 && touchStartY === 0) return;
    var dx = e.touches[0].clientX - touchStartX;
    var dy = e.touches[0].clientY - touchStartY;
    if (!isHorizontal && Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy)) {
      isHorizontal = true;
    }
    if (isHorizontal) {
      e.preventDefault();
    }
  }, { passive: false });
  document.addEventListener('touchend', function (e) {
    if (touchStartX === 0 && touchStartY === 0) { isHorizontal = false; return; }
    var endX = e.changedTouches[0].clientX;
    var endY = e.changedTouches[0].clientY;
    var dx = endX - touchStartX;
    var dy = endY - touchStartY;
    if (Math.abs(dx) > 50 && Math.abs(dy) < 80) {
      var flat = chapters[currentChapter] && chapters[currentChapter]._flat;
      if (flat) {
        if (dx > 0) {
          if (currentQuestionIndex > 0) { currentQuestionIndex--; renderOneQuestion(); }
        } else {
          if (currentQuestionIndex < flat.length - 1) { currentQuestionIndex++; renderOneQuestion(); }
        }
      }
    }
    touchStartX = 0;
    touchStartY = 0;
    isHorizontal = false;
  }, { passive: true });
})();
// ===== 滑动手势结束 =====
window.scrollTo(0, 0);
document.documentElement.scrollLeft = 0;
document.body.scrollLeft = 0;
initChapterSelect();
switchChapter(0);
</script></body></html>
