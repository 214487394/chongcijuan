    {type:"最佳选择题",q:"23. 不属于二甲双胍降血糖作用机制的是",opts:["A.作用于肝脏，抑制糖异生，减少肝糖输出","B.作用于外周组织和脂肪，提高胰岛素的敏感性，增加葡萄糖的摄取和利用","C.作用于肠道，抑制肠壁细胞摄取葡萄糖","D.提高胰高血糖素样肽-1水平","E.作用于肾脏，抑制肾小管对葡萄糖的重吸收，促进葡萄糖的排泄"],ans:"E",exp:"本题考查双胍类药物的临床用药评价。二甲双胍的降血糖机制包括：①作用于肝脏，抑制糖异生，减少肝糖输出；②作用于外周组织（肌肉、脂肪），改善肌肉糖原合成，降低游离脂肪酸水平，提高胰岛素的敏感性，增加对葡萄糖的摄取和利用；③作用于肠道，抑制肠壁细胞摄取葡萄糖，提高胰高血糖素样肽-1（GLP-1）水平。不包括作用于肾脏，抑制肾小管对葡萄糖的重吸收。"},
    {type:"最佳选择题",q:"24. 根据最近发布的中国居民膳食营养素参考摄入量建议，中国居民中青年推荐每日钙摄入量为",opts:["A.200mg","B.400mg","C.600mg","D.800mg","E.1000～1200mg"],ans:"D",exp:"本题考查钙剂和维生素D及其活性代谢物的药理作用与作用机制。充足的钙摄入对获得理想峰值骨量、缓解骨丢失、改善骨矿化和维护骨骼健康有益。最近发布的中国居民膳食营养素参考摄入量建议：中国居民中青年推荐每日钙摄入量为800mg（元素钙），50岁以上中老年、妊娠中晚期及哺乳期人群推荐每日摄入量为1000～1200mg。尽可能通过膳食摄入充足的钙，饮食中钙摄入不足时，可给予钙剂补充。"},
    {type:"最佳选择题",q:"25. 注射剂可用作长效避孕药，亦可用于绝经期后乳腺癌、子宫内膜癌的药物是",opts:["A.左炔诺孕酮","B.地屈孕酮","C.甲羟孕酮","D.黄体酮","E.去氧孕烯"],ans:"C",exp:"本题考查孕激素类的临床用药评价。甲羟孕酮可用于月经不调、功能失调性子宫出血及子宫内膜异位症等。注射液可用作长效避孕药，亦可用于绝经期后乳腺癌及子宫内膜癌。"},
    {type:"最佳选择题",q:"26. 患者，男，34岁，用青霉素治疗梅毒时出现寒战、咽痛、心率加快等症状，该不良反应称为",opts:["A.红人综合征","B.特异质反应","C.双硫仑样反应","D.赫氏反应","E.I型变态反应"],ans:"D",exp:"本题考查青霉素类抗菌药物的临床用药评价。应用青霉素治疗梅毒、钩端螺旋体病等疾病时，可由于病原体死亡导致寒战、咽痛、心率加快等症状加剧，称为吉-海反应，也称赫氏反应。"},
    {type:"最佳选择题",q:"27. 关于红霉素临床用药评价的描述，不正确的是",opts:["A.可作为青霉素类药物过敏患者的替代用药","B.可首选用于肺炎支原体肺炎患者","C.可首选用于军团菌病患者","D.可首选用于空肠弯曲菌肠炎患者","E.可首选用于抗生素相关性腹泻患者"],ans:"E",exp:"本题考查大环内酯类抗菌药物的临床用药评价。红霉素可作为青霉素过敏患者替代用药，还首选用于：①肺炎衣原体感染及其他衣原体感染；②百日咳；③肺炎支原体肺炎及其他支原体感染；④空肠弯曲菌肠炎；⑤军团菌病。抗生素相关性腹泻轻症患者停药即可，中、重度口服甲硝唑治疗，甲硝唑无效患者可口服万古霉素或去甲万古霉素治疗。红霉素不作为抗生素相关性腹泻的首选。"},
    {type:"最佳选择题",q:"28. 对革兰阳性菌具有强大抗菌活性，对革兰阴性菌作用弱的抗菌药物是",opts:["A.氨曲南","B.四环素","C.阿米卡星","D.氯霉素","E.万古霉素"],ans:"E",exp:"本题考查糖肽类抗菌药物的临床用药评价。糖肽类抗菌药物（如万古霉素）对革兰阳性菌具有强大的抗菌活性，对葡萄球菌（包括耐甲氧西林金黄色葡萄球菌和耐甲氧西林表皮葡萄球菌）、肠球菌、肺炎链球菌、溶血性与草绿色链球菌高度敏感，对厌氧菌、炭疽杆菌、白喉棒状杆菌、破伤风杆菌也高度敏感，对革兰阴性菌作用弱。"},
    {type:"最佳选择题",q:"29. 可与催化肽聚糖合成的磷酸烯醇丙酮酸转移酶不可逆性结合，使该酶灭活，阻断细菌细胞壁的合成，从而导致细菌死亡的药物是",opts:["A.利福平","B.甲氧苄啶","C.利奈唑胺","D.替加环素","E.磷霉素"],ans:"E",exp:"本题考查磷霉素的临床用药评价。磷霉素可与催化肽聚糖合成的磷酸烯醇丙酮酸转移酶不可逆性结合，使该酶灭活，阻断细菌胞壁的合成，从而导致细菌死亡。"},
    {type:"最佳选择题",q:"30. 用药期间或之后5～7日内饮酒、服用含有乙醇药物、食物以及外用乙醇，因抑制乙醛脱氢酶活性，使乙醛代谢为乙酸的路径受阻，导致乙醛在体内蓄积，从而引起双硫仑样反应的药物不包括",opts:["A.头孢哌酮","B.头孢美唑","C.奥硝唑","D.替硝唑","E.氟氧头孢"],ans:"C",exp:"本题考查硝基咪唑类抗菌药物的临床用药评价。引起双硫仑样反应的抗菌药物有：①头孢菌素类（头孢孟多、头孢替安、头孢尼西、头孢哌酮、头孢甲肟、头孢匹胺、头孢曲松）；②头霉素类（头孢美唑、头孢替坦、头孢米诺）；③氧头孢烯类（拉氧头孢、氟氧头孢）；④氯霉素；⑤硝基呋喃类（呋喃唑酮、呋喃妥因）；⑥硝基咪唑类（甲硝唑、替硝唑）。奥硝唑对乙醛脱氢酶无抑制作用，无双硫仑样反应。"},
    {type:"最佳选择题",q:"31. 下列关于异烟肼的叙述，不正确的是",opts:["A.对结核分枝杆菌具有高度抗菌作用，对繁殖期和静止期细菌均有强大杀灭作用","B.对巨噬细胞内及干酪病灶内的结核菌有杀灭作用，对细胞外及在中性或碱性环境中的结核菌无效","C.预防结核病时，既可单用，也可与其他抗结核药物联合使用，用药一般不超过2种","D.治疗结核病时，不可单独用药，需与其他抗结核药物组成不同的化疗方案","E.常见不良反应为周围神经炎，多见于慢乙酰化者，并与剂量有明显关系，常以手足感觉异常开始，继以肌力减退、反射减弱、肌痛，严重者有肌肉萎缩及共济失调"],ans:"B",exp:"本题考查异烟肼的临床用药评价。异烟肼对结核分枝杆菌具有高度抗菌作用，对繁殖期和静止期细菌均有强大杀灭作用，且不受环境pH的影响，对细胞内外结核菌都能杀灭。吡嗪酰胺对巨噬细胞内及干酪病灶内的结核菌有杀灭作用，对细胞外及在中性或碱性环境中的结核菌无效。"},
    {type:"最佳选择题",q:"32. 不属于阿昔洛韦适应证的是",opts:["A.单纯疱疹性脑膜炎","B.急性带状疱疹","C.水痘","D.免疫缺陷患者的巨细胞病毒感染","E.生殖器疱疹"],ans:"D",exp:"本题考查抗疱疹病毒药物的临床用药评价。阿昔洛韦口服给药可用于急性带状疱疹、初发生殖器疱疹、复发性生殖器疱疹、水痘；注射给药可用于重症生殖器疱疹初治、免疫缺陷患者皮肤黏膜单纯疱疹或严重带状疱疹、单纯疱疹性脑膜炎。阿昔洛韦对巨细胞病毒无效。"},
    {type:"最佳选择题",q:"33. 不能控制疟疾症状的发作，但可作为控制复发和阻止疟疾传播的首选药物的是",opts:["A.乙胺嘧啶","B.伯氨喹","C.复方蒿甲醚","D.青蒿素","E.氯喹"],ans:"B",exp:"本题考查抗疟药的临床用药评价。伯氨喹可杀灭间日疟、三日疟、恶性疟和卵形疟组织期的虫株，也可杀灭各种疟原虫的配子体，对红内期虫体的作用很弱，因此不能控制疟疾症状的发作，临床作为控制复发和阻止疟疾传播的首选药。"},
    {type:"最佳选择题",q:"34. 患者，男，34岁，因直肠癌化疗，医生叮嘱静脉滴注药物期间避免饮用冷水，该患者使用的化疗药物是",opts:["A.奥沙利铂","B.替尼泊苷","C.替莫唑胺","D.阿糖胞苷","E.吡柔比星"],ans:"A",exp:"本题考查破坏DNA的铂类化合物的临床用药评价。奥沙利铂神经毒性强，且为剂量依赖性毒性反应，静脉滴注期间不可食用冷食和饮用冷水，并应避免接触冰冷的物体。"},
    {type:"最佳选择题",q:"35. 可用于低钾血症和急、慢性肝炎的辅助治疗的药物是",opts:["A.氯化钠","B.葡萄糖","C.氯化钙","D.氯化钾","E.门冬氨酸钾镁"],ans:"E",exp:"本题考查门冬氨酸钾镁的临床用药评价。门冬氨酸钾镁可用于：①低钾血症、低钾及洋地黄中毒引起的心律失常；②心肌代谢障碍所致的心绞痛、心肌梗死、心肌炎后遗症，慢性心功能不全；③急性黄疸性肝炎、肝细胞功能不全和急、慢性肝炎的辅助治疗。"},
    {type:"最佳选择题",q:"36. 关于葡萄糖临床用药评价的描述，错误的是",opts:["A.可与胰岛素一起静脉滴注治疗高钾血症","B.应用高渗葡萄糖注射液时选用大静脉滴注","C.可诱发或加重强心苷类药物中毒","D.5%葡萄糖注射液可用于降低眼压及因颅压增加引起的各种病症","E.1型糖尿病患者应用高浓度葡萄糖时偶有发生高钾血症"],ans:"D",exp:"本题考查葡萄糖的临床用药评价。高渗葡萄糖（25%/50%葡萄糖注射液）可用于降低眼压及因颅压增加引起的各种病症。5%葡萄糖注射液是等渗溶液，不能用于降低眼压。"},
    {type:"最佳选择题",q:"37. 羟甲唑啉可收缩鼻黏膜血管，缓解鼻塞，其作用机制是",opts:["A.激动α1受体","B.激动α2受体","C.激动β受体","D.拮抗α1受体","E.拮抗α2受体"],ans:"A",exp:"本题考查耳鼻咽喉科用药的分类与代表药品。羟甲唑啉和赛洛唑啉属于血管收缩药，具有直接激动血管平滑肌的α1肾上腺素受体引起鼻腔黏膜血管收缩的作用，减轻炎症所致的充血和水肿。"},
    {type:"最佳选择题",q:"38. 属于阳离子型表面活性剂，具有广谱杀菌作用，可用于治疗咽喉炎的药物是",opts:["A.麻黄碱","B.西地碘","C.羟甲唑啉","D.度米芬","E.复方薄荷油"],ans:"D",exp:"本题考查耳鼻咽喉科用药的分类与代表药品。度米芬属于阳离子型表面活性剂，具有广谱杀菌作用，用于治疗咽喉炎、鹅口疮和口腔溃疡。"},
    {type:"最佳选择题",q:"39. 关于抗组胺药的描述，正确的是",opts:["A.第一代抗组胺药对受体选择性高，安全性好","B.特非那定为第一代抗组胺药，可导致Q-T间期延长","C.苯海拉明为第一代抗组胺药，可用于围手术期镇静、镇痛和止吐","D.前列腺增生、青光眼患者不宜使用第二代抗组胺药","E.第二代抗组胺药易透过血-脑屏障，广泛用于中枢神经系统和前庭疾病"],ans:"C",exp:"本题考查抗组胺药的临床用药评价。①第一代抗组胺药受体选择性差，易透过血-脑屏障，抑制中枢神经，镇静作用明显，广泛用于中枢神经系统和前庭疾病；②第一代抗组胺药会产生抗胆碱能、抗5-羟色胺、抗多巴胺作用，前列腺增生、青光眼患者不宜使用；③苯海拉明和异丙嗪属于第一代抗组胺药，可用于围手术期镇静、镇痛和止吐；④第二代抗组胺药不易透过血-脑屏障，对受体选择性高，安全性好；⑤阿司咪唑、特非那定属于第二代抗组胺药，可导致Q-T间期延长，危及生命，基于安全性考虑，已撤市。"},
    {type:"最佳选择题",q:"40. 银屑病治疗药物不包括",opts:["A.地蒽酚","B.三甲沙林","C.过氧乙酸","D.依奇珠单抗","E.卡泊三醇"],ans:"C",exp:"本题考查治疗银屑病药的分类与代表药品。治疗银屑病药包括：①局部用药：煤焦油、地蒽酚、鱼石脂、水杨酸、卡泊三醇、他卡西醇、他克莫司、三甲沙林、甲氧沙林、维A酸、他扎罗汀；②全身用药：糖皮质激素、甲氨蝶呤、依那西普、英夫利西单抗、阿达木单抗、司库奇尤单抗、依奇珠单抗、托法替布、乌帕替尼等。过氧乙酸属于消毒防腐药。"},

    // ===== 二、配伍选择题（41-90） =====
    {type:"配伍选择题",subs:[
      {q:"41. 可用于多发性硬化症所引起的严重但可逆的肌肉痉挛，也可用于因感染、退行性病变、外伤或肿瘤引起的脊髓痉挛状态的非苯二氮䓬类药物是",opts:["A.地西泮","B.佐匹克隆","C.唑吡坦","D.巴氯芬","E.卡马西平"],ans:"D",exp:"本题考查中枢肌松药的分类与临床用药评价。巴氯芬属于非苯二氮䓬类中枢性肌松药，可用于多发性硬化症所引起的严重但可逆的肌肉痉挛，也可用于因感染、退行性病变、外伤或肿瘤引起的脊髓痉挛状态。"},
      {q:"42. 可用于抗焦虑、镇静催眠、抗癫痫和抗惊厥，并缓解炎症所引起的反射性肌肉痉挛等症状的苯二氮䓬类药物是",opts:["A.地西泮","B.佐匹克隆","C.唑吡坦","D.巴氯芬","E.卡马西平"],ans:"A",exp:"本题考查苯二氮䓬类药物的临床用药评价。地西泮属于苯二氮䓬类药物，可用于抗焦虑、镇静催眠、抗癫痫和抗惊厥，并缓解炎症所引起的反射性肌肉痉挛等；也可用于治疗惊厥发作、紧张型头痛及家族性、老年性和特发性震颤，或手术麻醉前给药。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"43. 为典型抗精神病药物，主要作用于脑内多巴胺D2受体，易引起外周抗胆碱能反应的药物是",opts:["A.氯氮平","B.氯丙嗪","C.氟哌啶醇","D.碳酸锂","E.奥氮平"],ans:"B",exp:"本题考查抗精神病药的分类与临床用药评价。第一代抗精神病药为典型抗精神病药物，主要作用于脑内多巴胺D2受体，为D2受体拮抗剂，代表药物有氯丙嗪、硫利达嗪、氯哌噻吨、氟哌啶醇等，其中氯丙嗪、硫利达嗪易引起外周抗胆碱能反应（如口干、便秘、尿潴留、视物模糊）。"},
      {q:"44. 具有较高的5-HT2受体拮抗作用，可作为首发精神分裂症患者一线用药选择的药物是",opts:["A.氯氮平","B.氯丙嗪","C.氟哌啶醇","D.碳酸锂","E.奥氮平"],ans:"E",exp:"本题考查抗精神病药的分类与临床用药评价。第二代抗精神病药具有较高的5-HT2受体拮抗作用，也称为多巴胺-5-HT受体拮抗剂，代表药物有氯氮平、利培酮、奥氮平、喹硫平、齐拉西酮等，其中奥氮平、喹硫平、利培酮、齐拉西酮等已经作为首发患者的一线用药选择，而由于安全性和严重不良反应等因素，原则上不推荐氯氮平作为首发精神分裂症患者的一线治疗选择。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"45. 可抑制近端肾小管对尿酸盐的重吸收，使尿酸排出增加，从而降低血尿酸浓度，减少尿酸沉积的药物是",opts:["A.非布司他","B.秋水仙碱","C.丙磺舒","D.碳酸氢钠","E.对乙酰氨基酚"],ans:"C",exp:"本题考查抗痛风药的分类与作用机制。促进尿酸排泄药可抑制近端肾小管对尿酸盐的重吸收，使尿酸排出增加，从而降低血尿酸浓度，减少尿酸沉积，代表药物有丙磺舒、苯溴马隆。"},
      {q:"46. 可抑制黄嘌呤氧化酶，阻止次黄嘌呤和黄嘌呤代谢为尿酸，从而减少尿酸生成的药物是",opts:["A.非布司他","B.秋水仙碱","C.丙磺舒","D.碳酸氢钠","E.对乙酰氨基酚"],ans:"A",exp:"本题考查抗痛风药的分类与作用机制。抑制尿酸生成药可抑制黄嘌呤氧化酶，阻止次黄嘌呤和黄嘌呤代谢为尿酸，从而减少尿酸的生成，降低血尿酸和尿尿酸含量，代表药物有非布司他、别嘌醇。"},
      {q:"47. 可抑制粒细胞浸润和白细胞趋化、抑制磷脂酶A2、抑制局部细胞产生IL-6，从而控制关节局部疼痛、肿胀和炎症反应的药物是",opts:["A.非布司他","B.秋水仙碱","C.丙磺舒","D.碳酸氢钠","E.对乙酰氨基酚"],ans:"B",exp:"本题考查抗痛风药的分类与作用机制。秋水仙碱属于抑制粒细胞浸润炎症反应药，可抑制粒细胞浸润和白细胞趋化、抑制磷脂酶A2、抑制局部细胞产生IL-6等，从而控制关节局部疼痛、肿胀和炎症反应，适用于治疗痛风性关节炎急性发作和预防复发性痛风性关节炎的急性发作。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"48. 适用于干咳、咳嗽伴黏稠痰者，也可用于酸化尿液、纠正代谢性碱中毒的药物是",opts:["A.右美沙芬","B.氯化铵","C.茶碱","D.可待因","E.乙酰半胱氨酸"],ans:"B",exp:"本题考查恶心性和刺激性祛痰药的临床用药评价。氯化铵的适应证包括：①干咳以及痰不易咳出等；②酸化尿液；③纠正代谢性碱中毒。"},
      {q:"49. 适用于较严重的频繁干咳，也可用于局麻或全麻时镇静的药物是",opts:["A.右美沙芬","B.氯化铵","C.茶碱","D.可待因","E.乙酰半胱氨酸"],ans:"D",exp:"本题考查镇咳药的临床用药评价。可待因除了具有镇咳作用外，还具有较强的镇痛、镇静作用，可用于中度以上疼痛、局麻或全麻时镇静。"},
      {q:"50. 适用于哮喘急性发作的静脉辅助治疗，也可用于心源性肺水肿引起的哮喘的药物是",opts:["A.右美沙芬","B.氯化铵","C.茶碱","D.可待因","E.乙酰半胱氨酸"],ans:"C",exp:"本题考查黄嘌呤类药物（磷酸二酯酶抑制剂）的临床用药评价。哮喘急性发作单用β2受体激动剂效果不佳时，可配合静脉滴注茶碱类药物增加疗效；茶碱还可用于心源性肺水肿引起的哮喘。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"51. 可用于治疗十二指肠溃疡和胃溃疡，也可与米非司酮序贯使用，用于终止停经49日内的早期妊娠的药物是",opts:["A.凯普拉生","B.米索前列醇","C.乳果糖","D.聚乙二醇4000","E.莫沙必利"],ans:"B",exp:"本题考查前列腺素类抑酸剂的临床用药评价。米索前列醇属于前列腺素类抑酸剂，可用于治疗十二指肠溃疡和胃溃疡，以及治疗或预防由NSAIDs引起的消化性溃疡；也可与米非司酮序贯，用于终止停经49日内的早期妊娠。"},
      {q:"52. 可用于慢性功能性便秘，也可用于治疗和预防肝性脑病（肝昏迷或昏迷前状态）的药物是",opts:["A.凯普拉生","B.米索前列醇","C.乳果糖","D.聚乙二醇4000","E.莫沙必利"],ans:"C",exp:"本题考查泻药与便秘治疗药的临床用药评价。乳果糖的适应证：便秘、肝性脑病（用于治疗和预防肝昏迷或昏迷前状态）。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"53. 有类似糖皮质激素的非特异性抗炎作用，严重低钾血症、高钠血症、高血压患者禁用的药物是",opts:["A.葡醛内酯","B.熊去氧胆酸","C.联苯双酯","D.甘草酸二铵","E.多烯磷脂酰胆碱"],ans:"D",exp:"本题考查肝脏疾病用药的临床用药评价。甘草酸二铵属于肝脏抗炎药，有类似糖皮质激素的非特异性抗炎作用，可广泛抑制各种炎症通路介导的肝脏炎症反应。可引起低血钾，加重高血压，故严重低钾血症、高钠血症、高血压、心衰、肾功能衰竭患者禁用。"},
      {q:"54. 既能促进胆固醇性胆囊结石溶解，又能改善胆汁淤积性肝病的药物是",opts:["A.葡醛内酯","B.熊去氧胆酸","C.联苯双酯","D.甘草酸二铵","E.多烯磷脂酰胆碱"],ans:"B",exp:"本题考查胆疾病用药的临床用药评价。熊去氧胆酸属于利胆药，可促进胆汁酸分泌，抑制胆固醇在肠道内的重吸收，降低胆汁中胆固醇的饱和度，使胆固醇结石逐渐溶解、脱落、排出。同时，熊去氧胆酸通过促进肝细胞的分泌和免疫调节达到治疗胆汁淤积性肝病的目的。"},
      {q:"55. 降酶速度快、降幅大，适用于慢性肝炎患者ALT升高的药物是",opts:["A.葡醛内酯","B.熊去氧胆酸","C.联苯双酯","D.甘草酸二铵","E.多烯磷脂酰胆碱"],ans:"C",exp:"本题考查肝脏疾病用药的临床用药评价。联苯双酯具有降血清ALT的作用，但对降低AST的作用不明显。联苯双酯具有降酶速度快、降幅大的特点，降ALT的短期疗效好，但远期疗效较差。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"56. 须在肝脏中水解成开环羟基酸型方有药理活性的药物是",opts:["A.氟伐他汀","B.普伐他汀","C.阿托伐他汀","D.瑞舒伐他汀","E.辛伐他汀"],ans:"E",exp:"本题考查羟甲基戊二酰辅酶A还原酶抑制剂的临床用药评价。辛伐他汀、洛伐他汀属于脂溶性他汀，为内酯环型前药，须在肝脏中水解成开环β-羟基酸型才有药理活性，主要代谢酶均为CYP3A4。"},
      {q:"57. 不具有脂溶性，不经过肝脏细胞色素P450酶系代谢的药物是",opts:["A.氟伐他汀","B.普伐他汀","C.阿托伐他汀","D.瑞舒伐他汀","E.辛伐他汀"],ans:"B",exp:"本题考查羟甲基戊二酰辅酶A还原酶抑制剂的临床用药评价。普伐他汀、瑞舒伐他汀为水溶性他汀，不具有脂溶性，其中普伐他汀不经细胞色素P450酶代谢，瑞舒伐他汀的主要代谢酶为CYP2C9。"},
      {q:"58. 兼具脂溶性和水溶性，主要经肝药酶CYP2C9代谢的药物是",opts:["A.氟伐他汀","B.普伐他汀","C.阿托伐他汀","D.瑞舒伐他汀","E.辛伐他汀"],ans:"A",exp:"本题考查羟甲基戊二酰辅酶A还原酶抑制剂的临床用药评价。氟伐他汀、阿托伐他汀、匹伐他汀兼具水溶性和脂溶性，其中阿托伐他汀的主要代谢酶为CYP3A4，氟伐他汀、匹伐他汀的主要代谢酶为CYP2C9。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"59. 患者，女，42岁，冠心病、不稳定型心绞痛急性发作，伴高血压（160/90mmHg）和心动过速（120次/分），该患者宜选用的药物是",opts:["A.硝普钠","B.普萘洛尔","C.氨氯地平","D.依那普利","E.氢氯噻嗪"],ans:"B",exp:"本题考查β受体拮抗剂的临床用药评价。普萘洛尔为β受体拮抗剂，可减慢心率、降低心肌收缩力、降低心肌耗氧量，既可减轻心绞痛症状又可预防心肌梗死和改善预后，在临床上适用于高血压、心绞痛、快速型心律失常。"},
      {q:"60. 患者，女，58岁，高血压（160/100mmHg）合并糖尿病肾病（蛋白尿+++），该患者宜首选的药物是",opts:["A.硝普钠","B.普萘洛尔","C.氨氯地平","D.依那普利","E.氢氯噻嗪"],ans:"D",exp:"本题考查ACEI类的临床用药评价。依那普利为血管紧张素转换酶抑制剂（ACEI），可改善糖尿病患者多蛋白尿或微量蛋白尿，延缓肾脏损害。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"61. 无需与食物同服，可口服的直接凝血酶抑制剂是",opts:["A.硫酸亚铁","B.达比加群酯","C.利伐沙班","D.比伐卢定","E.阿哌沙班"],ans:"B",exp:"本题考查直接抗凝药的临床用药评价。直接凝血酶抑制剂的代表药物有达比加群酯、水蛭素、重组水蛭素、比伐芦定、阿加曲班，其中达比加群酯是可口服给药的，水蛭素、重组水蛭素、比伐芦定、阿加曲班均需注射给药。"},
      {q:"62. 为提高生物利用度，15mg或20mg的片剂应与食物同服的是",opts:["A.硫酸亚铁","B.达比加群酯","C.利伐沙班","D.比伐卢定","E.阿哌沙班"],ans:"C",exp:"本题考查直接抗凝药的临床用药评价。利伐沙班20mg片剂与食物同服后，与空腹服药相比，平均AUC提高39%，Cmax升高76%，提示几乎完全吸收，有较高的口服生物利用度，因此服用15mg和20mg剂量时，应与食物同服。"},
      {q:"63. 推荐与维生素C同服，以利于吸收的药物是",opts:["A.硫酸亚铁","B.达比加群酯","C.利伐沙班","D.比伐卢定","E.阿哌沙班"],ans:"A",exp:"本题考查铁剂的临床用药评价。酸性条件可促进铁剂的吸收，铁剂可与维生素C以及果汁一起服用。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"64. 能特异性作用于巨核细胞的血小板生成素（TPO）受体，调节巨核细胞增殖、分化与成熟，促进血小板生成的药物是",opts:["A.艾曲泊帕乙醇胺","B.氨基己酸","C.聚桂醇","D.卡络磺钠","E.特利加压素"],ans:"A",exp:"本题考查抗出血药的分类与代表药品。促血小板生成药能特异性作用于巨核细胞的血小板生成素（TPO）受体，调节巨核细胞增殖、分化与成熟，促进血小板生成。促血小板生成药的代表药品有重组人血小板生成素、人白介素-11、艾曲泊帕乙醇胺、海曲泊帕乙醇胺、阿伐曲泊帕、芦曲泊帕、罗普司亭。"},
      {q:"65. 是一种硬化剂，能使曲张静脉周围纤维化，压迫曲张静脉，从而达到止血目的的药物是",opts:["A.艾曲泊帕乙醇胺","B.氨基己酸","C.聚桂醇","D.卡络磺钠","E.特利加压素"],ans:"C",exp:"本题考查其他抗出血药的临床用药评价。聚桂醇是一种硬化剂，能使曲张静脉周围纤维化，压迫曲张静脉，达到止血目的。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"66. 可促进头发生长，临床上用于治疗男性雄激素性脱发的药物是",opts:["A.托特罗定","B.奥昔布宁","C.非那雄胺","D.坦索罗辛","E.普适泰"],ans:"C",exp:"本题考查5α还原酶抑制剂的临床用药评价。小剂量（规格为1mg/片，一次1片，一日1次）非那雄胺能够促进头发生长，临床上用于治疗男性雄激素性脱发。"},
      {q:"67. 属于植物制剂，可用于治疗慢性、非细菌性前列腺炎的药物是",opts:["A.托特罗定","B.奥昔布宁","C.非那雄胺","D.坦索罗辛","E.普适泰"],ans:"E",exp:"本题考查普适泰的临床用药评价。普适泰作为裸麦花粉提炼出来的一种植物制剂，可阻碍睾酮转化为二氢睾酮及抑制白三烯、前列腺素合成，用于治疗良性前列腺增生和慢性、非细菌性前列腺炎。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"68. 属于促胰岛素分泌药的是",opts:["A.格列喹酮","B.替尔泊肽","C.西格列他钠","D.德谷胰岛素","E.多格列艾汀"],ans:"A",exp:"本题考查口服降糖药与肠促胰素类降糖药的分类与代表药品。促胰岛素分泌药包括：①磺酰脲类：格列本脲、格列美脲、格列喹酮、格列齐特等；②格列奈（非磺酰脲）类：瑞格列奈、那格列奈、米格列奈。"},
      {q:"69. 属于肠促胰素类降糖药的是",opts:["A.格列喹酮","B.替尔泊肽","C.西格列他钠","D.德谷胰岛素","E.多格列艾汀"],ans:"B",exp:"本题考查口服降糖药与肠促胰素类降糖药的分类与代表药品。肠促胰素类降糖药包括：①胰高血糖素样肽-1受体激动剂：艾塞那肽、利拉鲁肽、贝那鲁肽、利司那肽、司美格鲁肽、度拉糖肽、洛塞那肽；②葡萄糖依赖性促胰岛素多肽（GIP）/GLP-1双受体激动剂：替尔泊肽。"},
      {q:"70. 属于胰岛素增敏剂的是",opts:["A.格列喹酮","B.替尔泊肽","C.西格列他钠","D.德谷胰岛素","E.多格列艾汀"],ans:"C",exp:"本题考查口服降糖药与肠促胰素类降糖药的分类与代表药品。胰岛素增敏剂包括：①噻唑烷二酮类：罗格列酮、吡格列酮；②过氧化物酶体增殖物激活受体（PPAR）泛激动剂：西格列他钠。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"71. 为人工合成的三碘甲状腺原氨酸，作用快而强，维持时间短，适用于黏液性水肿昏迷抢救的药物是",opts:["A.左甲状腺素","B.碘塞罗宁","C.碘化钾","D.丙硫氧嘧啶","E.卡比马唑"],ans:"B",exp:"本题考查甲状腺激素类药物的临床用药评价。左甲状腺素、碘塞罗宁为甲状腺激素类药，其中碘塞罗宁为人工合成的三碘甲状腺原氨酸，作用快而强，维持时间短，适用于黏液性水肿昏迷的抢救。左甲状腺素是人工合成的四碘甲状腺原氨酸，作用慢而持久。"},
      {q:"72. 在体内逐渐水解，游离出甲巯咪唑而发挥作用，作用起效较慢、维持时间较长，不适用于甲状腺危象的药物是",opts:["A.左甲状腺素","B.碘塞罗宁","C.碘化钾","D.丙硫氧嘧啶","E.卡比马唑"],ans:"E",exp:"本题考查硫脲类药物的临床用药评价。丙硫氧嘧啶、甲巯咪唑、卡比马唑为硫脲类抗甲状腺药，其中卡比马唑为前药，需游离出甲巯咪唑而发挥作用，起效慢，维持时间长，不适用于甲状腺危象。"},
      {q:"73. 大剂量时有抗甲状腺的作用，但服用时间过长时，不仅作用消失，且可使病情加重的药物是",opts:["A.左甲状腺素","B.碘塞罗宁","C.碘化钾","D.丙硫氧嘧啶","E.卡比马唑"],ans:"C",exp:"本题考查碘化钾的临床用药评价。大剂量的碘有抗甲状腺的作用，可用于甲亢危象患者治疗；甲亢外科手术治疗前使用大剂量碘剂，可减少甲状腺血供及术中出血，硬化甲状腺腺体，以便于手术操作。但由于其作用时间短暂（最多维持2周），且服用时间过长时，不仅作用消失，且可使病情加重，因此不能作为常规的抗甲状腺药。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"74. 用药期间有发生颌骨坏死的风险，对于需要接受侵入性牙科手术的患者需停用的药物是",opts:["A.特立帕肽","B.唑来膦酸","C.骨化三醇","D.雷洛昔芬","E.鲑降钙素"],ans:"B",exp:"本题考查双膦酸盐类的临床用药评价。接受双膦酸盐类药物（如唑来膦酸）治疗的癌症患者中有发生颌骨坏死的报告，通常与拔牙和/或局部感染伴愈合延迟相关。对于需要接受侵入性牙科手术的患者，停用双膦酸盐类药物治疗可以降低颌骨坏死的风险。"},
      {q:"75. 具有潜在的增加肿瘤风险的可能，连续使用时间一般不超过3个月的药物是",opts:["A.特立帕肽","B.唑来膦酸","C.骨化三醇","D.雷洛昔芬","E.鲑降钙素"],ans:"E",exp:"本题考查降钙素的临床用药评价。鉴于鼻喷剂型鲑降钙素具有潜在增加肿瘤风险的可能，鲑降钙素连续使用时间一般不超过3个月。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"76. 患者，男，45岁，痰培养结果为铜绿假单胞菌，宜选用的抗菌药物是",opts:["A.青霉素","B.苄星青霉素","C.阿莫西林","D.氨苄西林","E.哌拉西林"],ans:"E",exp:"本题考查青霉素类抗菌药物的分类与代表药品。哌拉西林属于抗铜绿假单胞菌青霉素类药物，对革兰阳性菌的作用较天然青霉素或氨基青霉素差，但对某些革兰阴性杆菌包括铜绿假单胞菌有抗菌活性。"},
      {q:"77. 患者，女，54岁，近期确诊为幽门螺杆菌感染，可与克拉霉素和质子泵抑制剂合用根除幽门螺杆菌的抗菌药物是",opts:["A.青霉素","B.苄星青霉素","C.阿莫西林","D.氨苄西林","E.哌拉西林"],ans:"C",exp:"本题考查青霉素类抗菌药物的临床用药评价。阿莫西林属于广谱青霉素类药物，可与克拉霉素和兰索拉唑联合治疗幽门螺杆菌感染，应一次1.0g，一日2次，餐后口服。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"78. 患者，女，55岁，因脑膜炎奈瑟菌感染住院，可选用无需根据肾功能调整给药剂量的抗菌药物是",opts:["A.头孢曲松","B.头孢孟多","C.头孢吡肟","D.头孢洛林","E.头孢唑林"],ans:"A",exp:"本题考查头孢菌素类抗菌药物的临床用药评价。头孢曲松为第三代头孢菌素类药物，有一定量渗入脑脊液中，可经验性用于感染性脑膜炎，且对于重度肾衰竭患者，无需调整给药剂量，其他头孢菌素类药物都需要调整给药剂量。"},
      {q:"79. 患者，男，43岁，既往有癫痫病史，中度肾功能不全。因铜绿假单胞菌感染，选择药物治疗，若不调整给药剂量，可能诱发癫痫的抗菌药物是",opts:["A.头孢曲松","B.头孢孟多","C.头孢吡肟","D.头孢洛林","E.头孢唑林"],ans:"C",exp:"本题考查头孢菌素类抗菌药物的临床用药评价。头孢吡肟属于第四代头孢菌素类药物，与第三代药物相比，抗铜绿假单胞菌作用增强，用于肾功能不全患者，需调整给药剂量，否则会引起癫痫发作。头孢唑林属于第一代头孢菌素类药物，用于肾功能不全者，若未调整剂量，也可诱发癫痫，但头孢唑林对铜绿假单胞菌无抗菌作用。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"80. 西司他丁和亚胺培南组成复方制剂的原因是",opts:["A.防止交叉过敏反应","B.诱导细菌对前者的耐药","C.增强对产β-内酰胺酶细菌的抗菌作用","D.促进前者在肝脏的代谢","E.阻止后者在肾脏被灭活"],ans:"E",exp:"本题考查碳青霉烯类抗菌药物的临床用药评价。亚胺培南在近端肾小管中被正常人类肾脱氢肽酶I灭活，西司他丁是肾脱氢肽酶的特异性抑制剂，联用西司他丁可防止亚胺培南在肾脏被灭活。"},
      {q:"81. 阿莫西林和克拉维酸钾组成复方制剂的原因是",opts:["A.防止交叉过敏反应","B.诱导细菌对前者的耐药","C.增强对产β-内酰胺酶细菌的抗菌作用","D.促进前者在肝脏的代谢","E.阻止后者在肾脏被灭活"],ans:"C",exp:"本题考查β-内酰胺酶抑制剂的临床用药评价。克拉维酸属于β-内酰胺酶抑制剂，与β-内酰胺类药物组成复方制剂，可增强对β-内酰胺酶细菌的抗菌作用。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"82. 为长PAE的时间依赖性抗菌药物，使用之后可导致光敏反应，应避免直接暴露于阳光或紫外线下 的药物是",opts:["A.万古霉素","B.阿米卡星","C.氨曲南","D.环丙沙星","E.米诺环素"],ans:"E",exp:"本题考查四环素类抗菌药物的临床用药评价。四环素类药物属于长PAE的时间依赖性抗菌药物，部分四环素类（多西环素、米诺环素、美他环素、地美环素）使用后，患者可能在日晒时有光敏现象，表现为日晒斑加重，早期以手足、口鼻的刺麻等感觉异常为主，继之在裸露的部位出现红斑，偶见大疱，数日或数周后可消失，少数病例出现丘疹性皮疹和荨麻疹，服药后应避免直接暴露于阳光或紫外线下，一旦皮肤有红斑应立即停药。"},
      {q:"83. 为有一定PAE的浓度依赖性抗菌药物，使用之后可导致光敏反应，应避免过度阳光或人工紫外线照射的药物是",opts:["A.万古霉素","B.阿米卡星","C.氨曲南","D.环丙沙星","E.米诺环素"],ans:"D",exp:"本题考查喹诺酮类抗菌药物的临床用药评价。喹诺酮类抗菌药物（如环丙沙星、左氧氟沙星等）属于有一定PAE的浓度依赖性抗菌药物，该类药物偶见光敏反应，使用后避免过度阳光或人工紫外线照射。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"84. 隐球菌对其耐药的抗真菌药物是",opts:["A.氟康唑","B.伊曲康唑","C.泊沙康唑","D.卡泊芬净","E.伏立康唑"],ans:"D",exp:"本题考查抗真菌药物抗菌谱总结。卡泊芬净和米卡芬净属于棘白菌素类抗真菌药，对隐球菌效果差。"},
      {q:"85. 曲霉菌对其耐药的抗真菌药物是",opts:["A.氟康唑","B.伊曲康唑","C.泊沙康唑","D.卡泊芬净","E.伏立康唑"],ans:"A",exp:"本题考查抗真菌药物抗菌谱总结。氟康唑属于三唑类抗真菌药，克柔念珠菌和曲霉菌对其耐药。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"86. 对丙型肝炎治愈率高，与维帕他韦制成复方制剂用于初治和复治的非肝硬化及肝硬化患者的药物是",opts:["A.替诺福韦酯","B.聚乙二醇干扰素α-2a","C.索磷布韦","D.恩替卡韦","E.利巴韦林"],ans:"C",exp:"本题考查治疗慢性丙型肝炎药的临床用药评价。索磷布韦对丙型肝炎治愈率高，与维帕他韦制成复方制剂用于初治和复治的非肝硬化及肝硬化患者，不需与利巴韦林联合使用。"},
      {q:"87. 对乙型肝炎病毒抑制率和HBeAg消失率或血清学转换率较高，停药后复发率较低的药物是",opts:["A.替诺福韦酯","B.聚乙二醇干扰素α-2a","C.索磷布韦","D.恩替卡韦","E.利巴韦林"],ans:"B",exp:"本题考查干扰素的临床用药评价。干扰素是目前公认治疗慢性乙型肝炎的重要药物，具有增强清除病毒的免疫功能和直接抑制病毒的作用。干扰素治疗慢性乙型肝炎在相对确定的疗程内患者的病毒抑制率和HBeAg消失率或血清学转换率较高，停药后复发率较低。取得持续应答的患者可改善远期预后，减少肝硬化和肝细胞癌的发生率，提高生存率。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"88. 属于破坏DNA的烷化剂类抗肿瘤药物的是",opts:["A.替莫唑胺","B.氟尿嘧啶","C.阿糖胞苷","D.羟喜树碱","E.柔红霉素"],ans:"A",exp:"本题考查直接影响DNA结构和功能的药物的分类与代表药品。破坏DNA的烷化剂类抗肿瘤药有氮芥、环磷酰胺、塞替派、白消安、替莫唑胺。"},
      {q:"89. 属于拓扑异构酶抑制剂类抗肿瘤药物的是",opts:["A.替莫唑胺","B.氟尿嘧啶","C.阿糖胞苷","D.羟喜树碱","E.柔红霉素"],ans:"D",exp:"本题考查直接影响DNA结构和功能的药物的分类与代表药品。拓扑异构酶抑制剂类抗肿瘤药包括：①拓扑异构酶I抑制剂：羟喜树碱、伊立替康、拓扑替康；②拓扑异构酶II抑制剂：依托泊苷、替尼泊苷。"},
      {q:"90. 属于蒽环类抗肿瘤抗生素的是",opts:["A.替莫唑胺","B.氟尿嘧啶","C.阿糖胞苷","D.羟喜树碱","E.柔红霉素"],ans:"E",exp:"本题考查蒽环类抗肿瘤抗生素的临床用药评价。蒽环类抗肿瘤抗生素有柔红霉素、多柔比星、表柔比星、吡柔比星、阿克拉阿霉素。氟尿嘧啶属于胸腺核苷酸合成酶抑制剂。阿糖胞苷属于DNA多聚酶抑制剂。"}
    ]},

    // ===== 三、综合分析选择题（91-95） =====
    {type:"最佳选择题",q:"91. 患者用药期间出现踝关节肿胀，到药房咨询，药师提示有可能引起该不良反应的药物是",opts:["A.沙美特罗替卡松吸入气雾剂","B.奥美拉唑肠溶片","C.硝苯地平控释片","D.阿司匹林肠溶片","E.单硝酸异山梨酯缓释片"],ans:"C",exp:"本题考查钙通道阻滞剂（CCB）的临床用药评价。CCB类（如硝苯地平）主要扩张小动脉，对小静脉和毛细血管作用较小，可导致下肢或踝部水肿。"},
    {type:"最佳选择题",q:"92. 关于单硝酸异山梨酯的描述，错误的是",opts:["A.是硝酸异山梨酯的主要活性代谢产物","B.与β受体拮抗剂联用可减少反射性心动过速的不良反应","C.与西地那非合用可协同增强抗心绞痛疗效，推荐临床联合使用","D.长期治疗需采用偏心给药（每日保持8～12小时无药期）以延缓耐受性的发生","E.缓释制剂可每日清晨给药一次，提高患者用药依从性"],ans:"C",exp:"本题考查硝酸酯类药物的临床用药评价。硝酸酯类药物与5型磷酸二酯酶抑制剂（如西地那非）合用，可显著增强硝酸酯类的舒张血管作用，从而发生显著性低血压，两者禁止合用。"},
    {type:"最佳选择题",q:"93. 该患者入院后血压波动于160～169/85～96mmHg，查肝、肾功能正常，需在原有高血压治疗方案的基础上加用抗高血压药。该患者不宜选用的药物是",opts:["A.依那普利","B.奥美沙坦酯","C.吲达帕胺","D.普萘洛尔","E.氢氯噻嗪"],ans:"D",exp:"本题考查β受体拮抗剂的临床用药评价。普萘洛尔属于非选择性β受体拮抗剂，可拮抗支气管平滑肌β2受体，引起支气管收缩，诱发支气管哮喘，支气管哮喘患者禁用非选择性β受体拮抗剂。"},
    {type:"最佳选择题",q:"94. 紫杉醇注射液赋形剂容易引起过敏，该患者应使用的抗过敏预处理方案是",opts:["A.西咪替丁、西替利嗪、东莨菪碱","B.西咪替丁、苯海拉明、奥美拉唑","C.西咪替丁、苯海拉明、雷尼替丁","D.地塞米松、苯海拉明、奥美拉唑","E.地塞米松、苯海拉明、西咪替丁"],ans:"E",exp:"本题考查紫杉醇类的临床用药评价。紫杉醇的过敏反应可能与赋形剂聚氧乙烯麻油有关，为预防过敏反应，应在治疗前12h及6h口服地塞米松20mg，治疗前30～60min肌内注射苯海拉明50mg并静脉注射西咪替丁300mg或雷尼替丁50mg。"},
    {type:"最佳选择题",q:"95. 紫杉醇不同剂型特点有所差别，以下关于紫杉醇不同剂型的描述，正确的是",opts:["A.白蛋白结合型紫杉醇应使用500ml 5%葡萄糖注射液作为溶剂","B.白蛋白结合型紫杉醇推荐在30min滴完","C.紫杉醇脂质体过敏反应发生率低，无需预防用药","D.紫杉醇脂质体无骨髓抑制的不良反应","E.紫杉醇注射液应使用聚氯乙烯（PVC）输液器"],ans:"B",exp:"本题考查紫杉醇不同剂型的特点比较。白蛋白结合型紫杉醇应使用100ml 0.9%氯化钠注射液作溶剂，推荐30min滴完。紫杉醇脂质体可导致骨髓抑制、过敏反应、神经毒性，其过敏反应发生率比紫杉醇注射液低，需预防用药。紫杉醇注射液应使用非聚氯乙烯输液器，不应接触聚氯乙烯（PVC）装置。"},

    // ===== 四、多项选择题（96-100） =====
    {type:"多项选择题",q:"96. 拟多巴胺类药通过直接补充多巴胺前体物或抑制多巴胺降解而产生抗帕金森病作用，下列属于拟多巴胺类药的是",opts:["A.复方左旋多巴","B.普拉克索","C.金刚烷胺","D.恩他卡朋","E.苯海索"],ans:"ABD",exp:"本题考查抗帕金森病药的分类与代表药品。帕金森病药物治疗主要包括拟多巴胺（DA）类、抗胆碱药两类经典的抗帕金森病药。其中，拟DA药包括：①复方左旋多巴：是DA的前体药物（左旋多巴）与外周多巴脱羧酶抑制剂（卡比多巴、苄丝肼等）组合；②DA受体激动剂：普拉克索、罗匹尼罗、吡贝地尔、罗替高汀、阿扑吗啡；③儿茶酚胺氧位甲基转移酶抑制剂：恩他卡朋、托卡朋。单胺氧化酶B抑制剂：司来吉兰、雷沙吉兰。抗胆碱类代表药品是苯海索。其他类的代表药品是金刚烷胺。"},
    {type:"多项选择题",q:"97. 关于口服补液盐临床应用的说法，正确的有",opts:["A.使用目的是纠正轻、中度脱水，从腹泻开始至腹泻停止都可以使用","B.婴幼儿使用本品时，需少量多次给药","C.口服补液盐Ⅲ是低渗性口服补液盐","D.少尿或无尿、严重脱水、有休克征象者禁用","E.开始饮用时，可出现胃肠道不适，可少量分次服用"],ans:"ABCDE",exp:"本题考查止泻药的临床用药评价。口服补液盐可预防和治疗腹泻引起的轻、中度脱水，从腹泻开始至腹泻停止都可以使用。婴幼儿使用本品时，需少量多次给药。口服补液盐Ⅲ是低渗性口服补液盐。禁忌证是少尿或无尿、严重脱水、有休克征象者、严重腹泻和呕吐者、肠梗阻、肠麻痹和肠穿孔等。开始饮用时，可出现胃肠道不适（恶心、呕吐、刺激感），可少量分次服用。"},
    {type:"多项选择题",q:"98. 肾功能不全患者无需调整剂量的抗凝药有",opts:["A.华法林","B.肝素","C.那曲肝素钙","D.达比加群酯","E.艾多沙班"],ans:"AB",exp:"本题考查抗凝药的特殊人群用药。①华法林几乎完全通过肝脏代谢失活，肾功能不全患者无需调整剂量；②肝素主要在肝脏代谢消除，肾功能不全者无需调整剂量；③那曲肝素钙为低分子量肝素，经肝脏代谢，原形药物经肾脏排泄的比例约10%，CrCl 30～50ml/min时剂量减少25%～33%；重度肾功能不全者禁用；④达比加群酯从肾脏消除的活性药物比例为80%，中度肾功能不全者用低剂量（110mg，一日2次）；CrCl<30ml/min者不推荐使用；⑤艾多沙班从肾脏消除的活性药物比例为50%，肾衰或透析者禁用；中度或重度不全（CrCl 15～50ml/min），剂量减半。"},
    {type:"多项选择题",q:"99. 可用于治疗乳腺癌的药物有",opts:["A.氟他胺","B.他莫昔芬","C.戈舍瑞林","D.阿那曲唑","E.甲羟孕酮"],ans:"BCDE",exp:"本题考查调节体内激素平衡抗肿瘤药适应证。可用于乳腺癌治疗的药物有：①雌激素受体拮抗剂：托瑞米芬、他莫昔芬、氟维司群；②芳香氨酶抑制剂：来曲唑、阿那曲唑、依西美坦；③孕激素类：甲羟孕酮、甲地孕酮；④促性腺激素释放激素（GnRH）激动剂/抑制剂：亮丙瑞林、戈舍瑞林、布舍瑞林。氟他胺属于抗雄激素类药物，用于晚期前列腺癌的治疗。"},
    {type:"多项选择题",q:"100. 可用于治疗干眼症的药物有",opts:["A.色甘酸钠","B.玻璃酸钠","C.甲基纤维素","D.贝美前列素","E.牛碱性成纤维细胞生长因子"],ans:"BCE",exp:"本题考查眼科用药的分类与代表药品。干眼症治疗药物有：①人工泪液：玻璃酸钠、甲基纤维素、聚乙烯醇、卡波姆940；②眼表抗炎药：糖皮质激素（氢化可的松、氟米龙）、免疫调节药；③促角膜修复类药物：牛碱性成纤维细胞生长因子、人表皮生长因子。"}
  ]
},
 {
  name: "押题密卷（五）",
  questions: [
    // ===== 一、最佳选择题（1-40） =====
    {type:"最佳选择题",q:"1. 依赖性小，不引起戒断反应和反跳性失眠，但可能发生泌乳素水平升高和睾酮水平下降的镇静催眠药是",opts:["A.氟西泮","B.佐匹克隆","C.雷美替胺","D.唑吡坦","E.水合氯醛"],ans:"C",exp:"本题考查褪黑素类的临床用药评价。雷美替胺属于褪黑素受体激动药，没有催眠副作用、戒断反应和反跳性失眠，并且依赖性小，但可能发生泌乳素水平升高和睾酮水平下降。"},
    {type:"最佳选择题",q:"2. 具有较强的α受体拮抗作用和血管扩张作用，主要用于急、慢性脑血管疾病和代谢性脑供血不足的药物是",opts:["A.尼麦角林","B.倍他司汀","C.银杏叶提取物","D.丁苯酞","E.胞磷胆碱钠"],ans:"A",exp:"本题考查抗记忆障碍及改善神经功能药的分类与作用机制。尼麦角林为半合成的麦角衍生物，具有较强的α受体拮抗作用和血管扩张作用，加强脑细胞的能量代谢、增加血氧及葡萄糖的利用以及促进神经递质多巴胺的转换、加强脑部蛋白质生物合成，从而增强神经传导、改善慢性脑功能损害。主要用于急、慢性脑血管疾病和代谢性脑供血不足。"},
    {type:"最佳选择题",q:"3. 关于抗帕金森病药作用特点的说法，错误的是",opts:["A.运动徐缓相关症状显著的帕金森病（PD）患者，应首选左旋多巴","B.对于年龄在70岁以下、有震颤问题困扰、不伴明显运动徐缓及步态障碍的PD患者，抗胆碱能药物作为单一疗法最有用","C.苯海索对于年龄较大或认知受损的PD患者效果较好","D.恩他卡朋单用无效，但与左旋多巴联用时可延长和加强左旋多巴的作用","E.金刚烷胺是作用相对较弱的抗帕金森病药物，其毒性小，治疗较年轻的早期或轻度PD患者最有用"],ans:"C",exp:"本题考查抗帕金森病药的临床用药评价。年龄较大患者和认知受损的PD患者特别容易出现记忆损害、意识模糊和幻觉，不应使用苯海索。"},
    {type:"最佳选择题",q:"4. 患儿，女，出生2个月后出现发热、流涕、啼哭不止，诊断为急性上呼吸道感染，体温39.5℃。该患儿宜使用的退热药物是",opts:["A.布洛芬","B.阿司匹林","C.贝诺酯","D.尼美舒利","E.对乙酰氨基酚"],ans:"E",exp:"本题考查解热、镇痛、抗炎药的临床用药评价。对乙酰氨基酚、布洛芬对于儿童发热较为安全有效，为儿童常用退热药。2个月以上婴幼儿可使用对乙酰氨基酚，6个月以上婴幼儿可使用布洛芬。"},
    {type:"最佳选择题",q:"5. 在不同的风湿免疫性疾病的治疗中，抗风湿药物的选择具有一定的倾向性。狼疮性肾炎诱导缓解多选用的药物是",opts:["A.甲氨蝶呤","B.环磷酰胺","C.柳氮磺吡啶","D.双醋瑞因","E.托法替布"],ans:"B",exp:"本题考查抗风湿药的临床应用。在不同的风湿免疫性疾病的治疗中，抗风湿药物的选择具有一定的倾向性。例如，在类风湿关节炎的治疗中，甲氨蝶呤是首选的锚定药物；狼疮性肾炎诱导缓解多选用环磷酰胺或吗替麦考酚酯；而柳氮磺吡啶多用于炎症性肠病。"},
    {type:"最佳选择题",q:"6. 尤其适用于血尿酸和24小时尿尿酸过多或有痛风结石、肾结石、泌尿系统结石患者的抗痛风药是",opts:["A.苯溴马隆","B.别嘌醇","C.碳酸氢钠","D.丙磺舒","E.秋水仙碱"],ans:"B",exp:"本题考查抑制尿酸生成药的临床用药评价。别嘌醇属于抑制尿酸生成药，尤其适用于血尿酸和24小时尿尿酸过多患者或有痛风结石、肾结石、泌尿系统结石、不宜应用促进尿酸排出药者。"},
    {type:"最佳选择题",q:"7. 关于秋水仙碱临床应用的说法，错误的是",opts:["A.用于急性期，初始剂量1mg，之后一次0.5mg，一日3次，最多每隔4小时给予1次，直至疼痛缓解或出现呕吐或腹泻","B.每一个疗程应停药3日，以免发生蓄积中毒","C.尽量避免静脉注射或长期给药","D.痛风性关节炎症状控制后立即停药，避免与降尿酸药联合应用","E.用药期间应定期监测血常规与肝肾功能"],ans:"D",exp:"本题考查秋水仙碱的临床用药评价。①秋水仙碱口服：用于急性期，初始剂量1mg，之后一次0.5mg，一日3次，最多每隔4小时给予1次，直至疼痛缓解或出现呕吐或腹泻，24小时最大剂量6mg。另一方案为一次1mg，一日3次，1周后剂量减半，疗程为2～3周；②秋水仙碱治疗急性痛风，每一个疗程应停药3日，以免发生蓄积中毒；③尽量避免静脉注射或长期给药。即使痛风发作期也不要静脉注射与口服并用；④痛风性关节炎症状控制后可继续减量、短程与促进尿酸排泄药联合应用以防痛风复发；⑤用药期间应定期监测血常规与肝肾功能。"},
    {type:"最佳选择题",q:"8. 关于可待因临床用药评价的说法，错误的是",opts:["A.适用于胸膜炎并发胸痛的严重干咳，痰液量较多者不宜联用祛痰药","B.属于麻醉药品，其采购、处方开具及使用等环节需严格遵守麻醉药品相关规定","C.为前药，经CYP2D6代谢为吗啡，超快代谢者易发生嗜睡、呼吸抑制，需禁用","D.18岁以下禁用含有可待因的咳嗽感冒药","E.可引起瞳孔变小，颅脑外伤或颅内病变者慎用"],ans:"A",exp:"本题考查镇咳药的临床用药评价。可待因适用于各种原因引起的剧烈干咳和刺激性咳嗽，尤其适合于伴有胸痛的剧烈干咳，如痰液量较多宜联用祛痰药。"},
    {type:"最佳选择题",q:"9. 更适用于重度哮喘及COPD患者长期维持治疗的方案是",opts:["A.吸入型糖皮质激素 + 长效β2受体激动剂 + 长效M胆碱受体拮抗剂","B.吸入型糖皮质激素 + 长效β2受体激动剂","C.吸入型糖皮质激素 + 短效β2受体激动剂","D.长效β2受体激动剂 + 长效M胆碱受体拮抗剂","E.短效β2受体激动剂 + 长效M胆碱受体拮抗剂"],ans:"A",exp:"本题考查各型哮喘的用药选择。哮喘治疗方案中的第4级和第5级患者在吸入糖皮质激素（ICS）+长效β2受体激动剂（LABA）治疗基础上可以联合吸入长效M胆碱受体拮抗剂（LAMA）。COPD患者往往副交感神经元进、β受体数减少，故对M胆碱受体拮抗剂更为敏感。新近上市的ICS+LABA+LAMA三联复合制剂，更适用于重度哮喘及COPD患者。"},
    {type:"最佳选择题",q:"10. 关于黄嘌呤类药物（磷酸二酯酶抑制剂）临床用药评价的说法，错误的是",opts:["A.进食可使多索茶碱的峰浓度降低、达峰时间延迟，应于餐前或餐后3小时服用","B.食物对沙丁胺醇无显著影响","C.沙美特罗无口服剂型","D.异丙托溴铵无口服剂型","E.噻托溴铵有口服剂型"],ans:"D",exp:"本题考查黄嘌呤类药物（磷酸二酯酶抑制剂）的临床用药评价。进食可使多索茶碱的峰浓度降低、达峰时间延迟，应于餐前或餐后3小时服用。食物对沙丁胺醇无显著影响。沙美特罗、异丙托溴铵、噻托溴铵无口服剂型。"},
    {type:"最佳选择题",q:"11. 关于H2受体拮抗剂临床用药评价的说法，正确的是",opts:["A.西咪替丁对性激素的影响较轻","B.雷尼替丁有轻度抗雄性激素作用，大剂量时可引起男性乳房发育、女性溢乳、性欲减退、阳痿、精子计数减少等，停药后即恢复","C.西咪替丁有轻度抗雄性激素作用，大剂量时可引起男性乳房发育、女性溢乳、性欲减退、阳痿、精子计数减少等，停药后即恢复","D.法莫替丁有轻度抗雄性激素作用，大剂量时可引起男性乳房发育、女性溢乳、性欲减退、阳痿、精子计数减少等，停药后即恢复","E.尼扎替丁有轻度抗雄性激素作用，大剂量时可引起男性乳房发育、女性溢乳、性欲减退、阳痿、精子计数减少等，停药后即恢复"],ans:"B",exp:"本题考查H2受体拮抗剂的临床用药评价。雷尼替丁对性激素的影响较轻。西咪替丁有轻度抗雄性激素作用，大剂量时可引起男性乳房发育、女性溢乳、性欲减退、阳痿、精子计数减少等，停药后即恢复。"},
    {type:"最佳选择题",q:"12. 关于多烯磷脂酰胆碱临床用药评价的说法，错误的是",opts:["A.多烯磷脂酰胆碱注射液严禁用电解质溶液（0.9%氯化钠溶液、林格液等）稀释","B.如需稀释，只能用5%、10%葡萄糖溶液或木糖醇注射液","C.多烯磷脂酰胆碱化学结构与肝细胞膜的天然成分一致，可增加肝细胞膜的完整性、稳定性和流动性，促进肝细胞膜再生","D.多烯磷脂酰胆碱注射液含苯甲醇，新生儿和早产儿禁用，口服制剂不得用于12岁以下儿童","E.多烯磷脂酰胆碱适用于以肝细胞膜损害为主的各类肝炎，但口服制剂可用于12岁以下儿童"],ans:"D",exp:"本题考查多烯磷脂酰胆碱的临床用药评价。多烯磷脂酰胆碱注射液严禁用电解质溶液（0.9%氯化钠溶液、林格液等）稀释，如需稀释，只能用5%、10%葡萄糖溶液或木糖醇注射液。多烯磷脂酰胆碱化学结构与肝细胞膜的天然成分一致，可增加肝细胞膜的完整性、稳定性和流动性，促进肝细胞膜再生，适用于以肝细胞膜损害为主的各类肝炎。多烯磷脂酰胆碱注射液含苯甲醇，给予新生儿和早产儿含有苯甲醇的制剂可导致致命性的“喘息综合征”，新生儿和早产儿禁用，口服制剂不得用于12岁以下儿童。"},

    {type:"最佳选择题",q:"24. 关于α1受体拮抗药临床用药评价的说法，正确的是",opts:["A.α1受体在不同组织器官中的受体亚型有所不同","B.坦索罗辛和赛洛多辛是具有尿路选择性的α1受体拮抗药，对位于前列腺、尿道和膀胱颈的α1A受体具有显著抑制作用，而对外周血管α1B受体的拮抗作用差，因此，在使用过程中二者很少发生低血压不良反应","C.非选择性α1受体拮抗药（特拉唑嗪、多沙唑嗪和阿夫唑嗪）对前列腺和外周血管平滑肌上α1受体都有拮抗作用，因此，在使用过程中易发生体位性低血压、眩晕，甚至有“首剂效应”和出现晕厥","D.酚妥拉明是非选择性α受体拮抗药","E.坦索罗辛和赛洛多辛是具有尿路选择性的α1受体拮抗药，对位于前列腺、尿道和膀胱颈的α1A受体具有显著抑制作用，而对外周血管α1B受体的拮抗作用差，因此，在使用过程中二者很少发生低血压不良反应；非选择性α1受体拮抗药（特拉唑嗪、多沙唑嗪和阿夫唑嗪）对前列腺和外周血管平滑肌上α1受体都有拮抗作用，因此，在使用过程中易发生体位性低血压、眩晕，甚至有“首剂效应”和出现晕厥；酚妥拉明是非选择性α受体拮抗药"],ans:"E",exp:"本题考查α1受体拮抗药的临床用药评价。α1受体在不同组织器官中的受体亚型有所不同，坦索罗辛和赛洛多辛是具有尿路选择性的α1受体拮抗药，对位于前列腺、尿道和膀胱颈的α1A受体具有显著抑制作用，而对外周血管α1B受体的拮抗作用差，因此，在使用过程中二者很少发生低血压不良反应。非选择性α1受体拮抗药（特拉唑嗪、多沙唑嗪和阿夫唑嗪）对前列腺和外周血管平滑肌上α1受体都有拮抗作用，因此，在使用过程中易发生体位性低血压、眩晕，甚至有“首剂效应”和出现晕厥。酚妥拉明是非选择性α受体拮抗药。"},

    {type:"配伍选择题",subs:[

      {q:"44. 可引起史蒂文斯-约翰逊综合征或中毒性表皮坏死松解症，推荐在开始治疗前筛查患者是否携带HLA-B*1502等位基因的抗癫痫药是",opts:["A.加巴喷丁","B.丙戊酸钠","C.左乙拉西坦","D.苯妥英钠","E.卡马西平"],ans:"E",exp:"本题考查卡马西平的临床用药评价。卡马西平可引起变态反应、史蒂文斯-约翰逊综合征或中毒性表皮坏死松解症、皮疹、荨麻疹、瘙痒、严重腹泻、红斑狼疮样综合征。对于亚裔患者，推荐在开始卡马西平治疗前筛查患者是否携带HLA-B*1502等位基因。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"45. 在一定程度上避免胃肠道的损害，但存在心血管不良反应风险的药物是",opts:["A.阿司匹林","B.塞来昔布","C.吲哚美辛","D.对乙酰氨基酚","E.布洛芬"],ans:"B",exp:"本题考查解热、镇痛、抗炎药的临床用药评价。塞来昔布属于选择性COX-2抑制剂，虽可在一定程度上避免胃肠道的损害，但因抑制血管内皮的前列腺素生成，使血管内的前列腺素和血小板中的血栓素动态平衡失调，导致血栓素升高促进血栓形成，因而存在心血管不良反应风险。"},
      {q:"46. 可用于预防血栓形成，以及用于心肌梗死和脑卒中后治疗的药物是",opts:["A.阿司匹林","B.塞来昔布","C.吲哚美辛","D.对乙酰氨基酚","E.布洛芬"],ans:"A",exp:"本题考查解热、镇痛、抗炎药的临床用药评价。阿司匹林以共价结合的方式不可逆地抑制COX，阻止血小板生物合成血栓素A2（TXA2），每日低剂量可用于预防血栓形成，以及用于心肌梗死和脑卒中后的治疗。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"47. 兼有中枢性和外周性镇咳作用，作用强度约为可待因的1/3的药物是",opts:["A.羧甲司坦","B.苯丙哌林","C.溴己新","D.喷托维林","E.愈创甘油醚"],ans:"D",exp:"本题考查镇咳药的分类与临床用药评价。苯丙哌林、喷托维林兼有中枢性和外周性镇咳作用，其中喷托维林镇咳作用强度约为可待因的1/3，苯丙哌林镇咳作用较强，为可待因的2～4倍。"},
      {q:"48. 可刺激胃黏膜，引起轻微的恶心，反射性引起支气管黏膜腺体分泌增加的祛痰药是",opts:["A.羧甲司坦","B.苯丙哌林","C.溴己新","D.喷托维林","E.愈创甘油醚"],ans:"E",exp:"本题考查祛痰药的分类与作用机制。愈创甘油醚属于恶心性和刺激性祛痰药，可刺激胃黏膜，引起轻微的恶心，反射性引起支气管黏膜腺体分泌增加，降低痰液黏性，痰液得到稀释而易于咳出。羧甲司坦和溴己新属于黏痰溶解剂。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"49. 患者，女，25岁，因夜里受凉后突发腹部绞痛，查体示肠鸣音亢进，诊断为胃肠道平滑肌痉挛。宜选用的治疗药物是",opts:["A.莫沙必利","B.奥美拉唑","C.山莨菪碱","D.西咪替丁","E.美沙拉秦"],ans:"C",exp:"本题考查解痉药的临床用药评价。山莨菪碱属于抗胆碱M受体药，此类药物可松弛胃肠平滑肌，从而解除平滑肌痉挛，缓解或消除胃肠平滑肌痉挛所致的绞痛。"},
      {q:"50. 患者，男，32岁，反复腹泻伴黏液脓血便3个月，结肠镜提示直肠及乙状结肠黏膜充血、糜烂，诊断为溃疡性结肠炎。宜选用的治疗药物是",opts:["A.莫沙必利","B.奥美拉唑","C.山莨菪碱","D.西咪替丁","E.美沙拉秦"],ans:"E",exp:"本题考查肠道抗炎药的临床用药评价。美沙拉秦的适应证：溃疡性结肠炎（包括急性发作期和防止复发的维持治疗）、克罗恩病急性发作。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"51. 高度致吐风险药物单日化疗的药物预防方案是",opts:["A.化疗前用单剂量5-HT3受体拮抗剂、地塞米松和NK-1受体拮抗剂的三药联合方案","B.建议用单一药物，如地塞米松、5-HT3受体拮抗剂或多巴胺受体拮抗剂（如甲氧氯普胺）预防呕吐","C.不必在化疗前常规给予止吐药物","D.推荐5-HT3受体拮抗剂、NK-1受体拮抗剂、地塞米松和多潘立酮的四联方案","E.推荐第1天采用5-HT3受体拮抗剂联合地塞米松，第2～3天继续使用地塞米松"],ans:"A",exp:"本题考查依据化疗药的催吐性选用止吐药。高度致吐风险药物单日化疗的药物预防方案：推荐化疗前用单剂量5-HT3受体拮抗剂、地塞米松和NK-1受体拮抗剂的三药联合方案。"},
      {q:"52. 中度致吐风险药物单日化疗的药物预防方案是",opts:["A.化疗前用单剂量5-HT3受体拮抗剂、地塞米松和NK-1受体拮抗剂的三药联合方案","B.建议用单一药物，如地塞米松、5-HT3受体拮抗剂或多巴胺受体拮抗剂（如甲氧氯普胺）预防呕吐","C.不必在化疗前常规给予止吐药物","D.推荐5-HT3受体拮抗剂、NK-1受体拮抗剂、地塞米松和多潘立酮的四联方案","E.推荐第1天采用5-HT3受体拮抗剂联合地塞米松，第2～3天继续使用地塞米松"],ans:"E",exp:"本题考查依据化疗药的催吐性选用止吐药。中度致吐风险药物单日化疗的药物预防方案：推荐第1天采用5-HT3受体拮抗剂联合地塞米松，第2～3天继续使用地塞米松。"},
      {q:"53. 低度致吐风险药物单日化疗的药物预防方案是",opts:["A.化疗前用单剂量5-HT3受体拮抗剂、地塞米松和NK-1受体拮抗剂的三药联合方案","B.建议用单一药物，如地塞米松、5-HT3受体拮抗剂或多巴胺受体拮抗剂（如甲氧氯普胺）预防呕吐","C.不必在化疗前常规给予止吐药物","D.推荐5-HT3受体拮抗剂、NK-1受体拮抗剂、地塞米松和多潘立酮的四联方案","E.推荐第1天采用5-HT3受体拮抗剂联合地塞米松，第2～3天继续使用地塞米松"],ans:"B",exp:"本题考查依据化疗药的催吐性选用止吐药。低度致吐风险药物单日化疗的药物预防方案：建议用单一药物，如地塞米松、5-HT3受体拮抗剂或多巴胺受体拮抗剂（如甲氧氯普胺）。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"54. 属于Ia类钠通道阻滞药，主要用于房颤和心房扑动的复律和危及生命的室性心律失常的药物是",opts:["A.索他洛尔","B.苯妥英钠","C.利多卡因","D.普罗帕酮","E.奎尼丁"],ans:"E",exp:"本题考查抗心律失常药的分类与作用机制。Ia类钠通道阻滞药包括奎尼丁和普鲁卡因胺，其中奎尼丁为广谱抗心律失常药，主要用于房颤和心房扑动的复律和危及生命的室性心律失常。"},
      {q:"55. 属于Ib类钠通道阻滞药，对短动作电位时程的心房肌无效，仅用于室性心律失常的药物是",opts:["A.索他洛尔","B.苯妥英钠","C.利多卡因","D.普罗帕酮","E.奎尼丁"],ans:"C",exp:"本题考查抗心律失常药的分类与作用机制。Ib类钠通道阻滞药包括苯妥英钠、美西律、利多卡因，其中利多卡因和美西律对短动作电位时程的心房肌无效，仅用于室性心律失常。索他洛尔属于钾通道阻滞剂，可延长动作电位时程。普罗帕酮属于Ic类明显（较强）阻滞钠通道药物。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"56. 在肠道刷状缘水平，通过选择性抑制NPC1L1转运蛋白，从而抑制饮食和胆汁胆固醇吸收的调节血脂药是",opts:["A.普伐他汀","B.普罗布考","C.考来烯胺","D.依折麦布","E.苯扎贝特"],ans:"D",exp:"本题考查其他调血脂药的临床用药评价。依折麦布为胆固醇吸收抑制剂，在肠道刷状缘水平通过选择性抑制NPC1L1转运蛋白从而抑制饮食和胆汁胆固醇在肠道的吸收，降低TC、LDL-C和ApoB水平。"},
      {q:"57. 通过竞争性抑制内源性胆固醇合成的限速酶（HMG-CoA还原酶），使肝细胞内胆固醇合成减少的调节血脂药是",opts:["A.普伐他汀","B.普罗布考","C.考来烯胺","D.依折麦布","E.苯扎贝特"],ans:"A",exp:"本题考查羟甲基戊二酰辅酶A还原酶抑制剂的临床用药评价。普伐他汀为羟甲基戊二酰辅酶A还原酶抑制剂，通过竞争性抑制内源性胆固醇合成限速酶（HMG-CoA还原酶），减少肝细胞内胆固醇合成。"},
      {q:"58. 具有显著的抗氧化作用，能抑制泡沫细胞的形成，并可消退已形成的动脉粥样硬化斑块的调节血脂药是",opts:["A.普伐他汀","B.普罗布考","C.考来烯胺","D.依折麦布","E.苯扎贝特"],ans:"B",exp:"本题考查其他调血脂药的临床用药评价。普罗布考为抗氧化剂，通过降低胆固醇合成与促进胆固醇分解，使血胆固醇和低密度脂蛋白降低，具有显著的抗氧化作用，延缓动脉粥样硬化斑块的形成，消退已形成的动脉粥样硬化斑块。考来烯胺属于胆酸螯合剂。苯扎贝特属于贝丁酸类药物。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"59. 可用于治疗弥漫性血管内凝血（DIC），过量导致的出血可用硫酸鱼精蛋白迅速缓解的药物是",opts:["A.肝素","B.低分子量肝素","C.重组链激酶","D.达比加群酯","E.华法林"],ans:"A",exp:"本题考查肝素类的临床用药评价。肝素过量导致的出血可用硫酸鱼精蛋白迅速缓解。低分子量肝素过量导致的出血也可用硫酸鱼精蛋白解救，但解救的效果可能不佳（鱼精蛋白能部分中和低分子量肝素）。"},
      {q:"60. 可用于治疗深静脉血栓形成或预防其复发，过量导致的出血可用依达赛珠单抗解救的药物是",opts:["A.肝素","B.低分子量肝素","C.重组链激酶","D.达比加群酯","E.华法林"],ans:"D",exp:"本题考查直接抗凝药的临床用药评价。达比加群酯过量导致的出血可用依达赛珠单抗解救。"},
      {q:"61. 可用于症状发生12小时内的急性心肌梗死，过量导致的出血可用氨基己酸解救的药物是",opts:["A.肝素","B.低分子量肝素","C.重组链激酶","D.达比加群酯","E.华法林"],ans:"C",exp:"本题考查溶栓药（溶栓酶）的临床用药评价。重组链激酶属于非特异性纤溶酶原激活剂，可同时激活血栓部位和血液循环中的纤溶酶原，过度消耗血液中的纤维蛋白原，引起低纤维蛋白原血症，继而发生出血。可用于症状发生12小时内的急性心肌梗死，过量导致的出血可用抗纤维蛋白溶解药（如氨基己酸）解救。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"62. 是症状性心力衰竭治疗基石的药物是",opts:["A.呋塞米","B.氢氯噻嗪","C.甘露醇","D.氨苯蝶啶","E.依普利酮"],ans:"A",exp:"本题考查袢利尿药的临床用药评价。心力衰竭常引起肺水肿，袢利尿药由于具有强效的利尿作用被写入国内外心力衰竭治疗指南中，是症状性心力衰竭治疗的基石。"},
      {q:"63. 为肝硬化腹水初始治疗首选的药物是",opts:["A.呋塞米","B.氢氯噻嗪","C.甘露醇","D.氨苯蝶啶","E.依普利酮"],ans:"E",exp:"本题考查留钾利尿药的临床用药评价。肝硬化患者的醛固酮水平通常会升高，使用袢利尿药治疗时，会发生利尿药抵抗，而螺内酯和依普利酮由于其抗醛固酮作用，成为肝硬化腹水初始治疗的首选药物。"},
      {q:"64. 可用于治疗创伤性脑损伤和脑水肿后颅内压升高的药物是",opts:["A.呋塞米","B.氢氯噻嗪","C.甘露醇","D.氨苯蝶啶","E.依普利酮"],ans:"C",exp:"本题考查渗透性利尿药（甘露醇）的临床用药评价。渗透性利尿药主要用于治疗创伤性脑损伤和脑水肿后颅内压升高（ICP），使用高渗的甘露醇治疗可在1小时内迅速降低升高的颅内压和脑容量。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"65. 可用于甲状腺抑制试验的药物是",opts:["A.丙硫氧嘧啶","B.胰岛素","C.左甲状腺素","D.卡比马唑","E.生长激素"],ans:"C",exp:"本题考查甲状腺激素类药物的临床用药评价。左甲状腺素的适应证包括：①非毒性的甲状腺肿；②甲状腺肿切除术后服用，以预防甲状腺肿复发；③各种原因引起的甲状腺功能减退；④甲状腺癌甲状腺切除术后；⑤甲状腺抑制试验。"},
      {q:"66. 可用于甲状腺危象治疗的药物是",opts:["A.丙硫氧嘧啶","B.胰岛素","C.左甲状腺素","D.卡比马唑","E.生长激素"],ans:"A",exp:"本题考查硫脲类抗甲状腺药的临床用药评价。丙硫氧嘧啶、卡比马唑为硫脲类抗甲状腺药，丙硫氧嘧啶可用于甲状腺危象的治疗；卡比马唑为前药，需游离出甲巯咪唑而发挥作用，起效慢，维持时间长，不适用于甲状腺危象。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"67. 起效迅速，持续时间短，控制餐后血糖更有效，临近餐前或餐后立刻给药也可以迅速达到有效的降血糖效果的胰岛素/胰岛素类似物是",opts:["A.门冬胰岛素注射液","B.人胰岛素注射液","C.精蛋白人胰岛素注射液","D.甘精胰岛素注射液","E.门冬胰岛素50注射液"],ans:"A",exp:"本题考查胰岛素及胰岛素类似物的临床用药评价。超短效胰岛素类似物（门冬胰岛素、赖脯胰岛素、谷赖胰岛素）起效迅速，持续时间短，能更加有效地控制餐后血糖。此外，用药时间较短效胰岛素灵活，即便是临近餐前或餐后立刻给药也可以迅速达到有效的降血糖效果。"},
      {q:"68. 餐前30min皮下注射，危急情况下可静脉输注，用于抢救糖尿病酮症酸中毒和高血糖高渗性昏迷的胰岛素/胰岛素类似物是",opts:["A.门冬胰岛素注射液","B.人胰岛素注射液","C.精蛋白人胰岛素注射液","D.甘精胰岛素注射液","E.门冬胰岛素50注射液"],ans:"B",exp:"本题考查胰岛素及胰岛素类似物的临床用药评价。短效胰岛素（人胰岛素），外观为无色透明溶液，餐前30min皮下注射，危急情况下可静脉输注，抢救糖尿病酮症酸中毒和高血糖高渗性昏迷。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"69. 治疗骨质疏松，地舒单抗的给药频次是",opts:["A.一日1次","B.隔日1次","C.每3个月1次","D.每6个月1次","E.一年1次"],ans:"D",exp:"本题考查调节骨代谢药的用法用量。地舒单抗用于骨折高风险的绝经后女性的骨质疏松症：推荐剂量为60mg，单次皮下注射，每6个月给药1次。"},
      {q:"70. 治疗骨质疏松，唑来膦酸的给药频次是",opts:["A.一日1次","B.隔日1次","C.每3个月1次","D.每6个月1次","E.一年1次"],ans:"E",exp:"本题考查调节骨代谢药的用法用量。唑来膦酸用于绝经后女性骨质疏松症：静脉滴注，一次5mg，一年1次。"}

    {type:"配伍选择题",subs:[
      {q:"71. 为结直肠癌的首选药之一的是",opts:["A.奥沙利铂","B.羟喜树碱","C.长春新碱","D.博来霉素","E.替尼泊苷"],ans:"A",exp:"本题考查破坏DNA的铂类化合物的临床用药评价。奥沙利铂是胃肠道癌的常用药，是结直肠癌的首选药之一。"},
      {q:"72. 为颅内肿瘤的首选药的是",opts:["A.奥沙利铂","B.羟喜树碱","C.长春新碱","D.博来霉素","E.替尼泊苷"],ans:"E",exp:"本题考查拓扑异构酶抑制剂的临床用药评价。替尼泊苷脂溶性高，可透过血-脑屏障，为颅内肿瘤的首选用药。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"73. 对青霉素类抗菌药物不敏感的病原菌是",opts:["A.溶血性链球菌","B.钩端螺旋体","C.葡萄球菌","D.军团菌","E.草绿色链球菌"],ans:"D",exp:"本题考查青霉素类抗菌药物的临床用药评价。青霉素可应用于：①革兰阳性球菌（如A组和B组溶血性链球菌、肺炎链球菌、对青霉素敏感的金黄色葡萄球菌等）所导致的各种感染；②草绿色链球菌和肠球菌属所导致的心内膜炎；③梭状芽孢杆菌所导致的破伤风、气性坏疽、白喉、流行性脑脊髓膜炎，鼠咬热、梅毒、钩端螺旋体病、奋森咽峡炎、放线菌病等。"},
      {q:"74. 对大环内酯类抗菌药物敏感的非典型病原菌是",opts:["A.溶血性链球菌","B.钩端螺旋体","C.葡萄球菌","D.军团菌","E.草绿色链球菌"],ans:"D",exp:"本题考查大环内酯类抗菌药物的临床用药评价。大环内酯类抗菌药的抗菌谱包括革兰阳性球菌、革兰阴性球菌、部分革兰阴性杆菌（如流感嗜血杆菌、百日咳杆菌等）、非典型致病原（军团菌、肺炎支原体、立克次体、衣原体）和厌氧消化球菌，对产β-内酰胺酶的葡萄球菌和耐甲氧西林金黄色葡萄球菌也有一定抗菌活性。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"75. 庆大霉素避免与头孢他啶在同一部位给药的原因是",opts:["A.有配伍禁忌","B.相互灭活","C.诱导耐药性的发生","D.促进后者在肾脏排泄","E.促进后者在肝脏代谢"],ans:"B",exp:"本题考查氨基糖苷类抗菌药物的临床用药评价。氨基糖苷类与β-内酰胺类（如青霉素类、头孢菌素类药物）混合可致相互灭活，故联合用药时不应在同一部位给药。"},
      {q:"76. 美罗培南诱发的癫痫避免使用丙戊酸钠治疗的原因是",opts:["A.有配伍禁忌","B.相互灭活","C.诱导耐药性的发生","D.促进后者在肾脏排泄","E.促进后者在肝脏代谢"],ans:"E",exp:"本题考查碳青霉烯类抗菌药物的临床用药评价。碳青霉烯类药物（如美罗培南）与丙戊酸钠合用时，可促进丙戊酸钠在肝脏代谢，导致其血浆药物浓度降至有效浓度以下，甚至引发癫痫，碳青霉烯类药物导致的癫痫发作避免使用丙戊酸钠治疗。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"77. 患者，男，45岁，因骨髓炎使用抗菌药物治疗，治疗期间出现严重水样腹泻及血压降低，该患者使用的药物是",opts:["A.甲硝唑","B.氯霉素","C.替加环素","D.阿米卡星","E.克林霉素"],ans:"E",exp:"本题考查林可霉素类抗菌药物的临床用药评价。克林霉素在疗程中甚至在疗程后数周有引起伴严重水样腹泻的假膜性肠炎的可能，且大剂量快速静脉滴注还可导致血压下降、心电图变化等。"},
      {q:"78. 患者，男，19岁，因伤寒使用抗菌药物治疗，治疗期间出现视神经炎伴白细胞和血小板减少，该患者使用的药物是",opts:["A.甲硝唑","B.氯霉素","C.替加环素","D.阿米卡星","E.克林霉素"],ans:"B",exp:"本题考查酰胺醇类抗菌药物的临床用药评价。氯霉素属于酰胺醇类抗菌药物，常见不良反应有：①胃肠道反应；②过敏反应；③神经系统：长期用药可出现周围神经炎和视神经炎；④先天性葡萄糖-6-磷酸脱氢酶不足的患者可发生溶血性贫血；长期服药可抑制肠道菌群而使维生素K合成受阻而出血。严重的不良反应有：①骨髓抑制：表现为贫血，或伴白细胞和血小板减少等；②再生障碍性贫血；③灰婴综合征；④肝毒性。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"79. 在酸性尿液中溶解度低，易出现结晶尿，必要时需服用碳酸氢钠，故不推荐用于尿路感染的抗菌药物是",opts:["A.呋喃妥因","B.磺胺嘧啶","C.呋喃唑酮","D.左氧氟沙星","E.万古霉素"],ans:"B",exp:"本题考查磺胺类抗菌药物的临床用药评价。磺胺类药物在用药期间应多饮水，保持正常尿量，以防结晶尿和结石的发生，必要时可服碱化尿液的药物。其中磺胺嘧啶在尿中溶解度低，不适用于尿路感染的治疗。"},
      {q:"80. 在酸性尿液中活性较强，不宜与碳酸氢钠合用，适用于急性单纯性下尿路感染的抗菌药物是",opts:["A.呋喃妥因","B.磺胺嘧啶","C.呋喃唑酮","D.左氧氟沙星","E.万古霉素"],ans:"A",exp:"本题考查硝基呋喃类抗菌药物的临床用药评价。呋喃妥因属于硝基呋喃类抗菌药物，其在酸性尿液中活性较强，碱性尿液中药效降低，不宜与碳酸氢钠等碱性药物合用。呋喃妥因用于由大肠埃希菌、肠球菌属、葡萄球菌属等所致急性单纯性下尿路感染，也可用于反复发作性尿路感染的预防。"},
      {q:"81. 肾功能不全患者使用后可导致结晶尿和碱性尿中毒，适用于复杂性尿路感染的抗菌药物是",opts:["A.呋喃妥因","B.磺胺嘧啶","C.呋喃唑酮","D.左氧氟沙星","E.万古霉素"],ans:"D",exp:"本题考查喹诺酮类抗菌药物的临床用药评价。喹诺酮类抗菌药物（如左氧氟沙星）主要经肾排泄，肾功能不全患者使用后可导致结晶尿和碱性尿中毒，左氧氟沙星适用于慢性支气管炎急性细菌感染、复杂性尿路感染、急性肾盂肾炎等。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"82. 通过与细菌细胞壁前体肽聚糖末端的D-丙氨酰-D-丙氨酸形成复合物，干扰甘氨酸五肽的连接，抑制细菌细胞壁合成的抗菌药物是",opts:["A.氨基糖苷类","B.酰胺醇类","C.硝基咪唑类","D.糖肽类","E.喹诺酮类"],ans:"D",exp:"本题考查糖肽类抗菌药物的代表药品与作用机制。糖肽类抗菌药物抗菌作用机制为与细菌细胞壁前体肽聚糖末端的D-丙氨酰-D-丙氨酸形成复合物，干扰甘氨酸五肽的连接，抑制细菌细胞壁合成。其作用部位与β-内酰胺类抗生素不同，不与青霉素类竞争结合部位。"},
      {q:"83. 通过抑制细菌DNA旋转酶和拓扑异构酶IV，抑制DNA合成和复制而导致细菌死亡的抗菌药物是",opts:["A.氨基糖苷类","B.酰胺醇类","C.硝基咪唑类","D.糖肽类","E.喹诺酮类"],ans:"E",exp:"本题考查喹诺酮类抗菌药物的代表药品与作用机制。喹诺酮类抗菌药物的作用机制是抑制细菌DNA旋转酶和拓扑异构酶IV，抑制DNA合成和复制而导致细菌死亡。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"84. 玛巴洛沙韦属于",opts:["A.神经氨酸酶抑制剂","B.RNA聚合酶抑制剂","C.血细胞凝集素抑制剂","D.M2离子通道阻滞剂","E.蛋白酶抑制剂"],ans:"B",exp:"本题考查抗流感病毒的分类与代表药品。RNA聚合酶抑制剂的代表药品有玛巴洛沙韦、法维拉韦。"},
      {q:"85. 阿比多尔属于",opts:["A.神经氨酸酶抑制剂","B.RNA聚合酶抑制剂","C.血细胞凝集素抑制剂","D.M2离子通道阻滞剂","E.蛋白酶抑制剂"],ans:"C",exp:"本题考查抗流感病毒的分类与代表药品。血细胞凝集素（HA）抑制剂的代表药品有阿比多尔。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"86. 属于胸腺核苷酸合成酶抑制剂，主要用于不能切除的局部晚期或转移性胃癌的抗肿瘤药物是",opts:["A.甲氨蝶呤","B.维A酸","C.替吉奥","D.阿糖胞苷","E.吉西他滨"],ans:"C",exp:"本题考查干扰核酸生物合成的药物的分类与临床用药评价。替吉奥属于胸腺核苷酸合成酶抑制剂，主要用于不能切除的局部晚期或转移性胃癌。"},
      {q:"87. 属于DNA多聚酶抑制剂，主要用于非小细胞肺癌和胰腺癌的抗肿瘤药物是",opts:["A.甲氨蝶呤","B.维A酸","C.替吉奥","D.阿糖胞苷","E.吉西他滨"],ans:"E",exp:"本题考查干扰核酸生物合成的药物的分类与临床用药评价。阿糖胞苷和吉西他滨属于DNA多聚酶抑制剂，其中吉西他滨主要用于非小细胞肺癌，胰腺癌，乳腺癌。"},
      {q:"88. 属于细胞分化诱导剂，主要用于急性早幼粒细胞白血病的诱导缓解治疗的抗肿瘤药物是",opts:["A.甲氨蝶呤","B.维A酸","C.替吉奥","D.阿糖胞苷","E.吉西他滨"],ans:"B",exp:"本题考查细胞分化诱导剂的临床用药评价。维A酸属于细胞分化诱导剂，主要用于急性早幼粒细胞白血病的诱导缓解治疗，也可用于维持治疗。甲氨蝶呤属于二氢叶酸还原酶抑制剂。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"89. 属于丙烯胺类抗真菌药，主要用于治疗皮肤癣菌病的药物是",opts:["A.灰黄霉素","B.两性霉素B","C.特比萘芬","D.阿莫罗芬","E.环吡酮胺"],ans:"C",exp:"本题考查局部用抗真菌药的代表药品与临床用药评价。特比萘芬属于丙烯胺类抗真菌药，外用治疗由皮肤癣菌，如红色毛癣菌、须癣毛癣菌、絮状表皮癣菌和犬小孢子菌等所致的浅表皮肤真菌感染。"},
      {q:"90. 属于吡啶酮类抗真菌药，主要用于治疗甲真菌病的药物是",opts:["A.灰黄霉素","B.两性霉素B","C.特比萘芬","D.阿莫罗芬","E.环吡酮胺"],ans:"E",exp:"本题考查局部用抗真菌药的代表药品与临床用药评价。环吡酮胺属于吡啶酮类抗真菌药，透性强，可渗透过甲板，用于治疗甲真菌病。"}
    ]},

    // ===== 三、综合分析选择题（91-95） =====
    {type:"最佳选择题",q:"91. 关于低分子量肝素抗凝作用机制的说法，正确的是",opts:["A.能使凝血级联的丝氨酸蛋白酶失活","B.通过增强抗凝血酶的活性，抑制凝血因子IIa和Xa发挥抗凝作用","C.体外试验具有直接的抗凝活性，可抑制体外凝血过程","D.能刺激脂蛋白脂肪酶的释放，加速血液循环中脂蛋白的清除","E.能直接激活凝血因子"],ans:"B",exp:"本题考查肝素类的临床用药评价。低分子量肝素通过增强抗凝血酶的活性，抑制凝血因子IIa和Xa发挥抗凝作用，且抑制Xa>IIa。"},
    {type:"最佳选择题",q:"92. 和肝素相比，关于低分子量肝素作用特点的说法，错误的是",opts:["A.起效更快，作用维持时间长","B.给药相对容易，皮下给药便于在门诊使用","C.剂量与抗凝药效之间相关性更好，多数情况无需实验室监测","D.发生肝素诱导的血小板减少症和骨质疏松的风险较低","E.用硫酸鱼精蛋白解救的效果可能不佳"],ans:"A",exp:"本题考查肝素类的临床用药评价。肝素起效快、失效快，低分子量肝素起效较肝素慢，作用持续时间较长。"},
    {type:"最佳选择题",q:"93. 为控制血糖，医生建议加服达格列净。达格列净的作用机制是",opts:["A.高选择性抑制胃肠二肽基肽酶-4","B.抑制肠内水解多糖、双糖的α-葡萄糖苷酶","C.激动肠道的胰高血糖素样肽-1受体","D.激活过氧化物酶体增殖物活化受体-γ（PPAR-γ）","E.抑制肾近端小管钠-葡萄糖协同转运蛋白2"],ans:"E",exp:"本题考查钠-葡萄糖协同转运蛋白2抑制剂的临床用药评价。达格列净属于钠-葡萄糖协同转运蛋白2抑制剂，可抑制肾脏对葡萄糖的重吸收，降低肾糖阈，通过增加尿液排泄的葡萄糖来降低血糖浓度。"},
    {type:"最佳选择题",q:"94. 服用达格列净过程中，需重点关注的不良反应不包括",opts:["A.低血压","B.急性胰腺炎","C.急性肾损伤","D.酮症酸中毒","E.生殖泌尿道感染"],ans:"B",exp:"本题考查钠-葡萄糖协同转运蛋白2抑制剂的临床用药评价。达格列净常见不良反应为生殖泌尿道感染；罕见的不良反应包括酮症酸中毒，主要发生在1型糖尿病患者；以及急性肾损伤、骨折风险和足趾截肢；可降低血压、减轻体重。"},
    {type:"最佳选择题",q:"95. 患者用药一段时间后，血糖控制不佳，拟调整降糖药物方案。该患者不宜选用的降糖药物是",opts:["A.甘精胰岛素","B.罗格列酮","C.阿卡波糖","D.利拉鲁肽","E.西格列汀"],ans:"B",exp:"本题考查胰岛素增敏剂的临床用药评价。罗格列酮属于噻唑烷二酮类胰岛素增敏剂，可能增加心力衰竭的风险，故禁用于心功能III级和IV级的心力衰竭患者，或者有心力衰竭病史患者。"},

    // ===== 四、多项选择题（96-100） =====
    {type:"多项选择题",q:"96. 下列病例中，需禁止或立即停用沙库巴曲缬沙坦钠的是",opts:["A.患者，男，54岁，慢性心衰（LVEF 35%），血压87/65mmHg","B.患者，男，47岁，慢性心衰（LVEF 38%），血钾5.8mmol/L（高钾血症）","C.患者，男，61岁，慢性心衰（LVEF 30%），重度肝功能损伤（Child-Pugh C级）","D.患者，男，75岁，高血压，慢性心力衰竭Ⅲ级，长期服用卡托普利","E.患者，女，52岁，慢性心衰（LVEF 35%），妊娠35周"],ans:"ABCDE",exp:"本题考查沙库巴曲缬沙坦钠的临床用药评价。①沙库巴曲缬沙坦钠可导致血压降低，避免用于低血压患者；②沙库巴曲缬沙坦钠可导致血钾升高，引起高钾血症，禁止用于高钾血症患者（血钾水平>5.4mmol/L）；③沙库巴曲缬沙坦钠用于重度肝功能不全者可导致药物蓄积，重度肝功能损伤者禁用；④沙库巴曲缬沙坦钠中含有ARB类药物缬沙坦，与ACEI类药物（如卡托普利）合用，可加重对肾脏的伤害，沙库巴曲缬沙坦钠禁止与ACEI类药物合用；⑤沙库巴曲缬沙坦钠禁用于中期和晚期妊娠女性。"},
    {type:"多项选择题",q:"97. 以下属于抗出血药物的有",opts:["A.蛇毒血凝酶","B.艾曲泊帕乙醇胺","C.达比加群酯","D.氨基己酸","E.替格瑞洛"],ans:"ABD",exp:"本题考查抗出血药的分类与代表药品。抗出血药包括：①维生素K类：维生素K1、维生素K4（甲萘氢醌）、甲萘醌；②凝血因子：人凝血酶原复合物、人纤维蛋白原、人凝血因子VII、重组人凝血因子VI、重组人凝血因子IX、重组人凝血因子VIIa；③蛇毒血凝酶：矛头蛇血凝酶、尖吻蛇血凝酶、白眉蛇血凝酶；④抗纤维蛋白溶解药：氨基己酸、氨甲环酸等；⑤毛细血管止血药：卡络磺钠、酚磺乙胺；⑥促血小板生成药：艾曲泊帕乙醇胺、重组人血小板生成素等；⑦血管硬化剂：聚桂醇；⑧肝素拮抗剂：硫酸鱼精蛋白；⑨收缩血管药：垂体后叶（注射液）、特利加压素。达比加群酯、替格瑞洛属于抗血栓药。"},
    {type:"多项选择题",q:"98. 可导致体重减轻的降糖药物有",opts:["A.钠-葡萄糖协同转运蛋白2抑制剂","B.肠促胰素类降糖药","C.磺酰脲类促胰岛素分泌药","D.双胍类","E.噻唑烷二酮类胰岛素增敏剂"],ans:"ABD",exp:"本题考查降糖药物的不良反应。导致体重减轻的降糖药物有：钠-葡萄糖协同转运蛋白2抑制剂、肠促胰素类降糖药、双胍类降糖药。导致体重增加的降糖药物有：磺酰脲类促胰岛素分泌药、格列奈类促胰岛素分泌药、胰岛素增敏剂。"},
    {type:"多项选择题",q:"99. 关于第五代头孢菌素类药物的描述，正确的有",opts:["A.头孢布烯属于第五代头孢菌素类药物","B.对革兰阳性菌的作用强于前四代","C.半衰期短，为2～3小时","D.几乎无抗生素后效应","E.对超广谱β-内酰胺酶高度稳定"],ans:"BCD",exp:"本题考查头孢菌素类抗菌药物的分类与各代头孢菌素类抗菌药物的对比。①第五代头孢菌素类药物有头孢洛林和头孢吡普，头孢布烯属于第三代头孢菌素类药物；②第五代头孢菌素对革兰阳性菌的作用强于前四代，尤其是对耐甲氧西林的金黄色葡萄球菌有效，对革兰阴性菌的作用与第四代头孢菌素类药物相似；③第五代头孢菌素半衰期短，为2～3小时；④头孢菌素类抗菌药物属于时间依赖性抗菌药物，几乎无抗生素后效应；⑤第五代头孢菌素对大部分β-内酰胺酶高度稳定，但可被大多数金属β-内酰胺酶和超广谱β-内酰胺酶水解。"},
    {type:"多项选择题",q:"100. 属于肝病适用型氨基酸制剂的有",opts:["A.复方氨基酸注射液3AA","B.复方氨基酸注射液6AA","C.复方氨基酸注射液9AA","D.复方氨基酸注射液18AA","E.复方氨基酸注射液20AA"],ans:"ABE",exp:"本题考查肠外营养药的分类与代表药品。肝病适用型氨基酸制剂有复方氨基酸注射液（3AA、6AA、20AA）。复方氨基酸注射液9AA为用于肾病的氨基酸制剂。复方氨基酸注射液18AA为平衡型氨基酸制剂。"}
  ]
},
  {
  name: "押题密卷（六）",
  questions: [
    // ===== 一、最佳选择题（1-40） =====
    {type:"最佳选择题",q:"1. 关于苯二氮䓬类药物作用特点的说法，错误的是",opts:["A.本类药的血浆蛋白结合率较高，在体内主要经肝脏代谢，代谢产物也有活性，经肾脏排泄","B.老年人使用本类药物可产生宿醉现象，须警惕跌倒发生","C.半衰期中等的劳拉西泮、阿普唑仑等连续应用时，一般无活性代谢产物蓄积，药物后遗作用小","D.本类药物连续使用易产生耐受性和依赖性","E.对焦虑型、夜间醒来次数较多的早醒者可选用地西泮，其起效快，作用时间长，醒后无不适感"],ans:"E",exp:"本题考查根据失眠状态合理选药。对焦虑型、夜间醒来次数较多或早醒者可选用氟西泮，其起效快，作用时间长，近似生理性睡眠，醒后无不适感。地西泮也属于长效药，但目前临床不常用于治疗失眠，因为其作用持续时间长并且可以导致活性代谢产物蓄积。"},
    {type:"最佳选择题",q:"2. 应用抗癫痫药具有致畸风险，应告知育龄女性服用抗癫痫药可能产生的后果，其中致畸风险最高的药物是",opts:["A.奥卡西平","B.拉莫三嗪","C.托吡酯","D.丙戊酸","E.左乙拉西坦"],ans:"D",exp:"本题考查抗癫痫病的特殊人群用药。应用抗癫痫药有致畸风险，有研究表明致畸风险，丙戊酸最高，其次是苯巴比妥和苯妥英，卡马西平和托吡酯居中。奥卡西平、拉莫三嗪和左乙拉西坦显示较高安全性。应告知育龄女性服用抗癫痫药可能产生的后果，计划妊娠或妊娠期女性应向专家咨询，并提供产前筛查。"},
    {type:"最佳选择题",q:"3. 能够促进神经传导和髓鞘的形成，可用于糖尿病多发性周围神经病变、Leigh综合征（亚急性坏死性脑脊髓病）、链霉素和卡那霉素中毒、噪音引起的（职业性）内耳听力损失药物是",opts:["A.银杏叶提取物","B.倍他司汀","C.硫辛酸","D.艾地苯醌","E.丁苯酞"],ans:"C",exp:"本题考查抗记忆障碍及改善神经功能的临床用药评价。硫辛酸为B族维生素，对神经系统的健康至关重要，可以促进神经传导和髓鞘的形成，用于糖尿病多发性周围神经病变、重体力劳动期间硫辛酸需求增加、Leigh综合征（亚急性坏死性脑脊髓病）、链霉素和卡那霉素中毒、噪音引起的（职业性）内耳听力损失。"},
    {type:"最佳选择题",q:"4. 可用于缓解药物诱发的锥体外系症状的药物是",opts:["A.苯海索","B.普拉克索","C.左旋多巴","D.恩他卡朋","E.司来吉兰"],ans:"A",exp:"本题考查苯海索的临床用药评价。苯海索属于中枢抗胆碱药，用药后可减轻流涎症状，缓解帕金森病症状及药物诱发的锥体外系症状。"},
    {type:"最佳选择题",q:"5. 关于阿片类镇痛药不良反应的说法，错误的是",opts:["A.吗啡急性中毒可出现呼吸深度抑制、瞳孔极度缩小、血压下降","B.强阿片类药物注射剂连续应用3-5日即可能产生身体和精神依赖性","C.注射给药后出现危象，可静脉注射美沙酮，必要时重复给药","D.哌替啶在体内可转变为毒性代谢产物去甲哌替啶，产生神经系统毒性","E.曲马多引起胃部不适的发生率更高，还有癫痫发作风险"],ans:"C",exp:"本题考查中枢镇痛药的临床用药评价。成瘾性镇痛药过量处理：距口服给药时间4～6小时内应即洗胃；注射给药后出现危象，可静脉注射纳洛酮，必要时重复给药。"},
    {type:"最佳选择题",q:"6. 属于小分子靶向药物，可口服的抗风湿药是",opts:["A.来氟米特","B.依那西普","C.托法替布","D.柳氮磺吡啶","E.司库奇尤单抗"],ans:"C",exp:"本题考查抗风湿药的分类与代表药品。托法替布属于靶向合成改善病情抗风湿药，是小分子靶向制剂，口服给药，可选择性抑制JAK激酶，减轻炎症反应和自身免疫性疾病的症状。"},
    {type:"最佳选择题",q:"7. 正在接受硫唑嘌呤治疗的患者，应禁用的药物是",opts:["A.碳酸氢钠","B.秋水仙碱","C.别嘌醇","D.苯溴马隆","E.非布司他"],ans:"E",exp:"本题考查抑制尿酸生成药的临床用药评价。非布司他与硫唑嘌呤或硫嘌呤同服会使硫唑嘌呤或硫嘌呤的血药浓度升高，从而导致其骨髓抑制等不良反应增强。因此非布司他禁用于正在接受硫唑嘌呤或硫嘌呤治疗的患者。别嘌醇与硫唑嘌呤或硫嘌呤同用时，后者的用量一般要减少至原剂量的1/4～1/3。"},
    {type:"最佳选择题",q:"8. 关于右美沙芬药理作用及临床用药评价的说法，错误的是",opts:["A.选择性地抑制延髓的咳嗽中枢，抑制支气管腺体的分泌，产生中枢性镇咳作用","B.口服吸收迅速","C.镇痛作用强度与可待因相等或略强","D.为第二类精神药品","E.适用于夜间咳嗽为主的患者"],ans:"C",exp:"本题考查镇咳药的临床用药评价。右美沙芬为第二类精神药品，口服吸收迅速，镇咳强度与可待因相等或略强，适用于夜间咳嗽为主的患者，无镇痛作用。右美沙芬属于中枢性镇咳药，选择性地抑制延髓的咳嗽中枢，抑制支气管腺体的分泌，产生中枢性镇咳作用。"},
    {type:"最佳选择题",q:"9. 关于β2受体激动剂临床用药评价的说法，错误的是",opts:["A.与洋地黄类药物联用，有诱发低血钾而造成心律不齐的可能性","B.SABA与吸入型肾上腺糖皮质激素联合应用，适用于中至重度慢性持续哮喘患者的长期治疗","C.班布特罗作用维持时间可达24小时，适用于有夜间哮喘症状的患者","D.长期使用可形成耐受性","E.SABA仅用于缓解急性症状，不用作长期维持治疗"],ans:"B",exp:"本题考查β2受体激动剂的临床用药评价。SABA（短效β2受体激动剂，如沙丁胺醇）仅用于缓解急性症状，不用作长期维持治疗。LABA（长效β2受体激动剂，如沙美特罗）与吸入型肾上腺糖皮质激素联合应用，适用于中至重度慢性持续哮喘患者的长期治疗。β2受体激动剂有诱发低血钾而造成心律不齐的可能性，特别是联用洋地黄类药物患者。班布特罗（特布他林的前体）作用维持时间可达24小时，适用于有夜间哮喘症状的患者。β2受体激动剂长期使用可形成耐受性，药效降低，使支气管痉挛不易缓解，哮喘加重。"},
    {type:"最佳选择题",q:"10. 能竞争性拮抗组胺与胃壁细胞上的H2受体结合，主要经肝脏代谢清除的药物是",opts:["A.米索前列醇","B.拉呋替丁","C.伏诺拉生","D.铝碳酸镁","E.法莫替丁"],ans:"B",exp:"本题考查H2受体拮抗剂的临床用药评价。H2受体拮抗剂（如拉呋替丁、法莫替丁），能竞争性地拮抗组胺与胃壁细胞上的H2受体结合，抑制组胺引起的胃酸分泌。西咪替丁和拉呋替丁主要经肝脏代谢清除，而法莫替丁、雷尼替丁、尼扎替丁、罗沙替丁主要以原型经肾脏清除。"},
    {type:"最佳选择题",q:"11. 用于治疗成年女性患者中通过轻泻剂难以充分缓解的慢性便秘症状的药物是",opts:["A.普罗布考","B.普芦卡必利","C.复方地芬诺酯","D.多潘立酮","E.昂丹司琼"],ans:"B",exp:"本题考查泻药与便秘治疗药的临床用药评价。普芦卡必利对胃排空和小肠传输无明显影响，可用于治疗成年女性患者中通过轻泻剂难以充分缓解的慢性便秘症状。"},
    {type:"最佳选择题",q:"12. 通过竞争性结合质子泵的钾离子，阻止K+的跨膜转运，从而抑制胃酸分泌的药物是",opts:["A.伏诺拉生","B.右兰索拉唑","C.西咪替丁","D.铝碳酸镁","E.哌仑西平"],ans:"A",exp:"本题考查钾离子竞争性酸阻滞剂（P-CABs）的临床用药评价。钾离子竞争性酸阻滞剂（P-CAB）代表药品包括伏诺拉生、替戈拉生和凯普拉生，通过竞争性结合质子泵的钾离子结合位点，阻止K+的跨膜转运，能够对质子泵产生可逆性的抑制，从而抑制胃酸分泌。"},
    {type:"最佳选择题",q:"13. 下列属于抗氧化类肝疾病用药的是",opts:["A.谷胱甘肽","B.多烯磷脂酰胆碱","C.甘草酸二铵","D.硫普罗宁","E.水飞蓟宾葡甲胺"],ans:"E",exp:"本题考查肝脏疾病用药的分类与代表药品。抗氧化药物包括水飞蓟素类（如水飞蓟宾葡甲胺）、联苯双酯和双环醇。谷胱甘肽、硫普罗宁属于肝脏解毒类药。多烯磷脂酰胆碱属于肝细胞膜修复保护剂。甘草酸二铵属于肝脏抗炎药。"},
    {type:"最佳选择题",q:"14. 关于ARB类药物作用特点的说法，错误的是",opts:["A.氯沙坦可被肝药酶CYP2C9和CYP3A4代谢，其代谢产物仍具有降压活性","B.肾功能损害患者使用厄贝沙坦无需调整剂量","C.肝功能明显损害的患者使用奥美沙坦无需调整剂量","D.可导致缓激肽、P物质堆积，引起咳嗽","E.除替米沙坦外，其他药物都是经双通道排泄"],ans:"D",exp:"本题考查ARB类的临床用药评价。ACEI类药物（XX普利）可导致缓激肽、P物质堆积，引起咳嗽等不良反应，而ARB类药不影响缓激肽降解，一般无咳嗽、血管神经性水肿的不良反应。氯沙坦可被肝药酶CYP2C9和CYP3A4代谢，在体内约14%的氯沙坦上的羟甲基可被肝脏氧化代谢为甲酸类的衍生物，其活性是氯沙坦的10～40倍。肾功能损害患者使用厄贝沙坦无需调整剂量。肝肾功能明显损害的患者使用奥美沙坦无需调整剂量。替米沙坦几乎完全经粪便排泄，其他药物都是经双通道排泄。"},
    {type:"最佳选择题",q:"15. 服用他汀类药物期间应监测血生化指标，其中超过正常值上限10倍，需检测有无血红蛋白尿及肾功能损伤，并立即停药的指标是",opts:["A.INR","B.Cr","C.CK","D.ALT","E.AST"],ans:"C",exp:"本题考查羟甲基戊二酰辅酶A还原酶抑制剂的临床用药评价。他汀类药物具有肌毒性，用药期间需监测肌酸激酶（CK）的水平，CK升高至大于正常值10倍以上的情况应考虑为横纹肌溶解症，需检测有无血红蛋白尿及肾功能损伤，并立即停用他汀类药物并给予水化治疗。"},
    {type:"最佳选择题",q:"16. 可降低胆固醇浓度，对甘油三酯浓度无影响或使之轻度升高的药物是",opts:["A.依折麦布","B.普罗布考","C.考来烯胺","D.匹伐他汀","E.非诺贝特"],ans:"C",exp:"本题考查其他调血脂药的临床用药评价。胆酸螯合剂（考来烯胺）可降低胆固醇浓度，对甘油三酯浓度无影响或使之轻度升高。"},
    {type:"最佳选择题",q:"17. 通过抑制衰竭心肌细胞膜上Na+，K+-ATP酶，提高细胞内Ca2+水平，从而发挥正性肌力作用的药物是",opts:["A.沙库巴曲缬沙坦钠","B.伊伐布雷定","C.达格列净","D.洋地黄毒苷","E.米力农"],ans:"D",exp:"本题考查强心苷类药物的临床用药评价。强心苷类药物通过抑制衰竭心肌细胞膜上Na+，K+-ATP酶，提高细胞内Ca2+水平，从而发挥正性肌力作用，代表药品有去乙酰毛花苷、地高辛、洋地黄毒苷、毒毛花苷K。"},
    {type:"最佳选择题",q:"18. 某类降压药对中青年患者效果较好，但在老年高血压患者中疗效较差，且不推荐作为无并发症的老年高血压或糖脂代谢异常患者的首选。该类降压药是",opts:["A.噻嗪类利尿剂","B.β受体拮抗剂","C.钙通道阻滞剂（CCB）","D.血管紧张素转换酶抑制剂（ACEI）","E.血管紧张素受体拮抗剂（ARB）"],ans:"B",exp:"本题考查β受体拮抗剂的临床用药评价。β受体拮抗剂主要适用于中青年患者，而在老年患者中其临床疗效劣于其他类别降压药物，因此无合并症的老年高血压患者一般不首选β受体拮抗剂。不宜首选β受体拮抗剂的高血压人群还包括糖脂代谢异常者。"},
    {type:"最佳选择题",q:"19. 减弱纤维蛋白形成的抗凝药有：维生素K拮抗剂、肝素类药物、直接抗凝药和丝氨酸蛋白酶抑制剂。分属这四类药物的是",opts:["A.华法林、达肝素钠、达比加群酯、萘莫司他","B.华法林、利伐沙班、那屈肝素钙、萘莫司他","C.华法林、磺达肝癸钠、利伐沙班、达比加群酯","D.肝素钠、华法林、达比加群酯、萘莫司他","E.华法林、贝米肝素钠、萘莫司他、阿司匹林"],ans:"A",exp:"本题考查抗血栓药的分类与代表药品。抗凝药包括：(1)维生素K拮抗剂：华法林。(2)肝素类：①肝素：肝素钠、肝素钙；②低分子量肝素：达肝素钠、那屈肝素钙、依诺肝素钠、贝米肝素钠；③人工合成品：磺达肝癸钠。(3)直接抗凝药：①直接凝血酶（IIa）抑制剂：达比加群酯、比伐芦定、阿加曲班、水蛭素、重组水蛭素；②直接Xa因子抑制剂：利伐沙班、阿哌沙班、艾多沙班。(4)丝氨酸蛋白酶抑制剂：萘莫司他。"},
    {type:"最佳选择题",q:"20. 对血小板以及血管平滑肌的5-HT受体具有特异性拮抗作用，可抑制5-HT和胶原蛋白引起的血小板聚集的药物是",opts:["A.沙格雷酯","B.阿司匹林","C.双嘧达莫","D.替格瑞洛","E.替罗非班"],ans:"A",exp:"本题考查抗血栓药的分类与代表药品。沙格雷酯属于5-羟色胺受体拮抗剂，对血小板以及血管平滑肌的5-HT受体具有特异性拮抗作用，可抑制5-HT和胶原蛋白引起的血小板聚集，还可抑制5-HT引起的血管平滑肌收缩。阿司匹林属于血栓素A2抑制剂。双嘧达莫属于磷酸二酯酶抑制剂。替格瑞洛属于P2Y12受体拮抗剂。替罗非班属于血小板糖蛋白（GP）IIb/IIIa受体拮抗剂。"},
    {type:"最佳选择题",q:"21. 可用于治疗白细胞减少症的药物不包括",opts:["A.小檗碱","B.人粒细胞巨噬细胞刺激因子","C.人粒细胞刺激因子","D.肌苷","E.利可君"],ans:"A",exp:"本题考查升白细胞药的代表药品。小檗碱为肠道抗感染药。升白细胞药物包括：①刺激因子类：人粒细胞刺激因子、人粒细胞巨噬细胞刺激因子；②其他升白细胞药：肌苷、利可君、腺嘌呤（维生素B4）、小檗胺、鲨肝醇、脱氧核苷酸钠。"},
    {type:"最佳选择题",q:"22. 属于盐皮质激素受体拮抗剂，不需分泌到管腔便可发挥利尿作用的药物是",opts:["A.氯噻酮","B.氨苯蝶啶","C.乙酰唑胺","D.托伐普坦","E.依普利酮"],ans:"E",exp:"本题考查利尿药的分类与作用部位。盐皮质激素受体拮抗药不与管腔受体结合，仅与细胞质靶点结合，因此它们是唯一不需要分泌到管腔发挥作用的利尿药。代表药物有螺内酯、依普利酮、非奈利酮。"},
    {type:"最佳选择题",q:"23. 在药理学上属于非选择性α1受体拮抗药，但在前列腺中的浓度高于血中药物浓度，因此较少发生心血管系统不良反应的药物是",opts:["A.多沙唑嗪","B.特拉唑嗪","C.阿夫唑嗪","D.坦索罗辛","E.赛洛多辛"],ans:"C",exp:"本题考查α1受体拮抗药的临床用药评价。非选择性α1受体拮抗药（特拉唑嗪、多沙唑嗪和阿夫唑嗪）对前列腺和外周血管平滑肌的α1受体都有拮抗作用，在使用过程中易发生体位性低血压、眩晕。阿夫唑嗪虽然在药理学上不属于尿路选择性α1受体拮抗药，但该药在前列腺中的浓度高于血中药物浓度，较少发生心血管系统不良反应，在临床上具有尿路选择性α1受体拮抗药的作用特点。"},
    {type:"最佳选择题",q:"24. 由腺垂体分泌，在人血浆中具有规律性昼夜节律变化，早晨睡醒前及后1h内达最高峰，下午6～11点最低的是",opts:["A.促皮质素","B.生长激素","C.生长抑素","D.糖皮质激素","E.去氨加压素"],ans:"A",exp:"本题考查促皮质素（ACTH）的临床用药评价。促皮质素由腺垂体分泌，人血浆中促皮质素（ACTH）水平具有规律性昼夜节律变化，一般睡眠后3～5h分泌频率增加，早晨睡醒前及后1h内达最高峰，以后渐减，下午6～11点最低。糖皮质激素由肾上腺皮质分泌。"},
    {type:"最佳选择题",q:"25. 关于甲状腺激素生理活性的说法，错误的是",opts:["A.甲状腺内囊状小泡分泌的甲状腺激素包括甲状腺素（四碘甲状腺原氨酸）和三碘甲状腺原氨酸","B.四碘甲状腺原氨酸是主要的生理活性物质","C.主要作用是维持正常生长发育，包括神经系统的发展和骨骼的生长","D.心脏是甲状腺激素的最重要靶器官","E.甲状腺激素可促进新陈代谢和增加产热"],ans:"B",exp:"本题考查甲状腺激素的生理活性。甲状腺内囊状小泡分泌的甲状腺激素包括四碘甲状腺原氨酸（T4）和三碘甲状腺原氨酸（T3）。T3是主要的生理活性物质，T4要转变为T3才能发挥作用。"},
    {type:"最佳选择题",q:"26. 作用于胰岛、肠道内分泌细胞以及肝脏等器官中的葡萄糖激酶靶点，通过改善2型糖尿病患者受损的葡萄糖激酶功能，促进葡萄糖刺激胰岛素分泌和GLP-1分泌，进而改善β细胞功能，减轻胰岛素抵抗，重塑机体血糖平衡生理调节机制的药物是",opts:["A.司美格鲁肽","B.多格列艾汀","C.西格列他钠","D.伏格列波糖","E.甘精胰岛素"],ans:"B",exp:"本题考查葡萄糖激酶激活剂的临床用药评价。多格列艾汀是葡萄糖激酶激活剂，作用于胰岛、肠道内分泌细胞以及肝脏等器官中的葡萄糖激酶靶点，通过改善2型糖尿病患者受损的葡萄糖激酶功能，促进葡萄糖刺激胰岛素分泌和GLP-1分泌，进而改善β细胞功能，减轻胰岛素抵抗，重塑机体血糖平衡生理调节机制。"},
    {type:"最佳选择题",q:"27. 不属于抑制骨吸收药的是",opts:["A.降钙素","B.阿仑膦酸钠","C.雷洛昔芬","D.地舒单抗","E.特立帕肽"],ans:"E",exp:"本题考查调节骨代谢药物的分类与代表药品。调节骨代谢的药物可分为：①钙剂（如碳酸钙）、维生素D及其活性代谢物（如骨化三醇、阿法骨化醇）；②抑制骨吸收药：双膦酸盐类（如阿仑膦酸钠）、替勃龙、雌激素类、RANKL抑制剂（如地舒单抗）、雷洛昔芬、降钙素等；③刺激骨形成药：氟制剂、甲状旁腺激素（如特立帕肽）、生长激素、骨生长因子等。"},
    {type:"最佳选择题",q:"28. 根据药动学/药效学（PK/PD）的特点，阿米卡星的评估指数是",opts:["A.血浆药物峰浓度与达峰时间比值（Cmax/Tmax）","B.血浆药时曲线下面积与血浆达峰时间比值（AUC/Tmax）","C.血浆药物峰浓度与最低抑菌浓度比值（Cmax/MIC）","D.血浆药物半衰期（t1/2）","E.血浆药物浓度高于最低抑菌浓度的维持时间（T>MIC）"],ans:"C",exp:"本题考查抗菌药物的药代动力学/药效学。阿米卡星属于浓度依赖性抗菌药物，此类药物对致病菌的杀菌效应和临床疗效取决于Cmax，而与作用时间和细菌接触的时间关系并不密切，即血浆峰浓度Cmax越高，清除致病菌的作用越迅速、越强。评估浓度依赖性抗菌药物的PK/PD指数主要有Cmax/MIC或AUC0～24/MIC。"},
    {type:"最佳选择题",q:"29. 关于β-内酰胺酶抑制剂药理作用与作用机制的描述，不正确的是",opts:["A.可抑制多种质粒介导的β-内酰胺酶的活性，包括ESBLs，具有极强的内在抗菌活性","B.不能抑制B类金属碳青霉烯酶","C.与β-内酰胺类抗生素组成复方制剂常用于需要抗菌药物广覆盖的感染","D.舒巴坦和他唑巴坦能抑制多种拟杆菌的染色体介导β-内酰胺酶","E.阿维巴坦与头孢他啶组成复方制剂，对大部分产碳青霉烯酶的细菌有抗菌活性"],ans:"A",exp:"本题考查β-内酰胺酶抑制剂的临床用药评价。β-内酰胺酶抑制剂内在抗菌活性极弱，但能抑制多种质粒介导的β-内酰胺酶的活性，包括超广谱β-内酰胺酶（ESBLs）。"},
    {type:"最佳选择题",q:"30. 关于硝基咪唑类抗菌药物临床用药评价的描述，错误的是",opts:["A.属于浓度依赖性抗菌药物","B.对需氧菌作用强大","C.妊娠前3个月禁用甲硝唑","D.可导致深色尿","E.可增强华法林作用，延长凝血酶原时间"],ans:"B",exp:"本题考查硝基咪唑类抗菌药物的临床用药评价。硝基咪唑类抗菌药物对革兰阴性菌和革兰阳性厌氧菌有良好抗菌活性，抗厌氧菌作用强大，对所有需氧菌无抗菌活性，为治疗原虫和厌氧菌感染的重要选用药物。"},
    {type:"最佳选择题",q:"31. 可用于免疫功能损害者耐阿昔洛韦的单纯疱疹病毒性皮肤黏膜感染，还可抑制HIV的逆转录酶的药物是",opts:["A.西多福韦","B.膦甲酸钠","C.伐昔洛韦","D.缬更昔洛韦","E.喷昔洛韦"],ans:"B",exp:"本题考查抗疱疹病毒药物的临床用药评价。膦甲酸钠属于焦磷酸类似物，对由于胸腺嘧啶激酶缺乏而引起的阿昔洛韦耐药的单纯疱疹病毒和水痘-带状疱疹病毒分离株以及大多数对更昔洛韦耐药的巨细胞病毒菌株有活性，还可抑制HIV的逆转录酶，并在体内对HIV有活性，临床用于艾滋病患者巨细胞病毒性视网膜炎和免疫功能损害患者耐阿昔洛韦的单纯疱疹病毒性皮肤黏膜感染的治疗。"},
    {type:"最佳选择题",q:"32. 用于治疗成人伴有进展为重症高风险因素的轻至中度新型冠状病毒感染的药物是",opts:["A.膦甲酸钠","B.奥司他韦","C.莫诺拉韦","D.阿德福韦酯","E.索磷布韦-维帕他韦"],ans:"C",exp:"本题考查抗新型冠状病毒的分类与代表药品。莫诺拉韦属于抗新型冠状病毒药，用于治疗成人伴有进展为重症高风险因素的轻至中度新型冠状病毒感染。膦甲酸钠属于抗疱疹病毒药。奥司他韦属于抗流感病毒药。阿德福韦酯和索磷布韦-维帕他韦属于抗肝炎病毒药。"},
    {type:"最佳选择题",q:"33. 奈韦拉平适用于",opts:["A.成人慢性丙型肝炎","B.人类免疫缺陷病毒（HIV-1）感染","C.成人伴有进展为重症高风险因素的轻至中度新型冠状病毒感染","D.成人甲型和乙型流感","E.艾滋病患者巨细胞病毒性视网膜炎"],ans:"B",exp:"本题考查抗艾滋病病毒药物的分类与代表药品。奈韦拉平属于抗艾滋病病毒药物，适用于治疗人类免疫缺陷病毒（HIV-1）感染，应与其他抗HIV-1药物联合用药。"},
    {type:"最佳选择题",q:"34. 依托泊苷作为首选药，用于",opts:["A.非小细胞肺癌化疗","B.小细胞肺癌化疗","C.颅内肿瘤化疗","D.结、直肠癌化疗","E.霍奇金淋巴瘤化疗"],ans:"B",exp:"本题考查拓扑异构酶抑制剂的临床用药评价。依托泊苷化疗指数较高，对单核细胞白血病有效，完全缓解率也高；对小细胞肺癌有显著疗效，为小细胞肺癌化疗首选药。"},
    {type:"最佳选择题",q:"35. 关于氟尿嘧啶相互作用的叙述，正确的是",opts:["A.与甲氨蝶呤合用，产生协同作用，先给予甲氨蝶呤再给予氟尿嘧啶","B.与四氢叶酸合用，可降低氟尿嘧啶毒性，先给予氟尿嘧啶再给予四氢叶酸","C.与奥沙利铂混合使用，有协同抗肿瘤作用","D.与奥沙利铂可通过同一静脉途径给药","E.与别嘌醇合用，可增加氟尿嘧啶骨髓抑制风险"],ans:"A",exp:"本题考查干扰核酸生物合成的药物（抗代谢药）的临床用药评价。①氟尿嘧啶与甲氨蝶呤合用，两者可产生协同作用，应当先给予甲氨蝶呤，4～6小时后再给予氟尿嘧啶；②氟尿嘧啶与四氢叶酸合用时，可降低氟尿嘧啶毒性，提高氟尿嘧啶疗效，应当先给予四氢叶酸，再用氟尿嘧啶；③奥沙利铂与氯化钠和碱性溶液（特别是氟尿嘧啶）之间存在配伍禁忌，所以奥沙利铂一定不能与上述制剂混合或通过同一静脉途径给药；④别嘌醇可以减轻氟尿嘧啶所引起的骨髓功能抑制，并可能改进治疗指数。"},
    {type:"最佳选择题",q:"36. 不属于氟他胺的不良反应的是",opts:["A.男性乳房女性化","B.肝功能异常","C.食欲增加","D.骨质疏松","E.失眠、困倦"],ans:"D",exp:"本题考查抗雄激素类（氟他胺）的临床用药评价。氟他胺的不良反应有：男性乳房女性化、溢乳、乳房触痛、腹泻、呕吐、食欲增加、失眠、困倦、性欲减退、暂时性肝功能异常、精子计数减少。"},
    {type:"最佳选择题",q:"37. 对原发性红细胞外期疟原虫有抑制作用，是较好的病因性预防药的是",opts:["A.乙胺嘧啶","B.伯氨喹","C.复方蒿甲醚","D.青蒿素","E.氯喹"],ans:"A",exp:"本题考查抗疟药的临床用药评价。乙胺嘧啶对原发性红细胞外期疟原虫有抑制作用，是较好的病因性预防药。"},
    {type:"最佳选择题",q:"38. 可用于口腔疾病的辅助治疗，对牙菌斑的形成有一定抑制作用的药物是",opts:["A.西吡氯铵","B.利多卡因","C.他克莫司","D.双氯芬酸","E.曲安奈德"],ans:"A",exp:"本题考查口腔科用药的分类与代表药品。西吡氯铵属于消毒防腐药，可用于口腔疾病的辅助治疗，也可用作日常口腔护理及清洁口腔，对牙菌斑的形成有一定抑制作用。"},
    {type:"最佳选择题",q:"39. 关于过氧苯甲酰临床应用的说法，错误的是",opts:["A.可用于皮肤急性炎症或破溃患者","B.为强氧化剂，易分解，遇有机物分解出新生态氧","C.为炎性痤疮首选外用抗菌药","D.避免用药部位过度日光照晒","E.可漂白毛发，不宜用在有毛发部位"],ans:"A",exp:"本题考查非抗生素类抗菌药（过氧苯甲酰）的临床用药评价。过氧苯甲酰为炎性痤疮首选外用抗菌药，但用药可出现过敏性接触性皮炎和干燥现象，皮肤急性炎症或破溃者禁用。"},
    {type:"最佳选择题",q:"40. 关于消毒防腐药使用注意事项的说法，不正确的是",opts:["A.氯己定含漱液可用于牙龈出血，长期使用可导致口腔黏膜与牙齿着色","B.戊二醛稀溶液可用于医疗器械消毒，误服后应避免洗胃和用催吐剂","C.依沙吖啶溶液可用于感染创面的清洗，也可口服用于口腔溃疡","D.呋喃西林可用于局部炎症及轻度化脓性皮肤病，用药后若有烧灼感、瘙痒、红肿等情况，应停药或就医","E.聚维酮碘可用于小面积皮肤、黏膜创口的消毒，用后不需用乙醇脱碘"],ans:"C",exp:"本题考查消毒防腐药的临床用药评价。依沙吖啶溶液用于外伤创面及感染创面的清洗，软膏用于各种小面积创伤、溃烂及感染性皮肤病，该药仅供外用，切忌口服。"},

    // ===== 二、配伍选择题（41-90） =====
    {type:"配伍选择题",subs:[
      {q:"41. 可抑制突触前膜对5-HT的再摄取，也可拮抗5-HT受体和中枢α2受体的药物是",opts:["A.文拉法辛","B.米氮平","C.西酞普兰","D.曲唑酮","E.瑞波西汀"],ans:"D",exp:"本题考查抗抑郁药的分类与作用机制。曲唑酮属于5-HT受体拮抗剂/再摄取抑制剂，可抑制突触前膜对5-HT的再摄取，并拮抗5-HT1受体、中枢α1受体，同时拮抗突触前膜α2受体增加去甲肾上腺素释放。"},
      {q:"42. 通过选择性抑制突触前膜对去甲肾上腺素的再摄取，增强中枢去甲肾上腺素能神经功能的药物是",opts:["A.文拉法辛","B.米氮平","C.西酞普兰","D.曲唑酮","E.瑞波西汀"],ans:"E",exp:"本题考查抗抑郁药的分类与作用机制。瑞波西汀属于选择性去甲肾上腺素再摄取抑制剂，通过选择性抑制突触前膜对去甲肾上腺素的再摄取，增强中枢去甲肾上腺素能神经的功能，从而发挥抗抑郁作用。文拉法辛属于5-HT及去甲肾上腺素再摄取抑制剂。米氮平属于去甲肾上腺素能及特异性5-HT能抗抑郁药。西酞普兰属于选择性5-HT再摄取抑制剂。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"43. 主要用于脊髓和大脑皮质下区域而产生肌肉松弛效果，用于急慢性软组织损伤、运动后的肌肉酸痛和中枢神经性病变导致的肌肉痉挛的药物是",opts:["A.吗啡","B.佐匹克隆","C.氯唑沙宗","D.奥沙普秦","E.双醋瑞因"],ans:"C",exp:"本题考查中枢肌松药的临床用药评价。氯唑沙宗属于中枢肌松药，主要作用于脊髓和大脑皮质下区域而产生肌肉松弛效果，用于急慢性软组织损伤、运动后的肌肉酸痛和中枢神经性病变导致的肌肉痉挛。"},
      {q:"44. 通过抑制COX-2，减少前列腺素的合成，对肌肉、关节、关节周围的软组织的疼痛和肿胀有一定缓解作用的药物是",opts:["A.吗啡","B.佐匹克隆","C.氯唑沙宗","D.奥沙普秦","E.双醋瑞因"],ans:"D",exp:"本题考查非甾体抗炎药的分类与作用机制。奥沙普秦属于非甾体抗炎药，通过抑制COX-2，减少前列腺素的合成，有镇痛、解热、抗炎作用，对肌肉、关节、关节周围的软组织的疼痛和肿胀有一定缓解作用，是风湿病中常用的对症药物。"},
      {q:"45. 可诱导软骨生成，具有止痛、抗炎及退热作用，但不抑制前列腺素合成，可延缓骨关节炎疾病进程的药物是",opts:["A.吗啡","B.佐匹克隆","C.氯唑沙宗","D.奥沙普秦","E.双醋瑞因"],ans:"E",exp:"本题考查抗风湿药的临床用药评价。双醋瑞因为骨关节炎白细胞介素-1（IL-1）的重要抑制剂，可诱导软骨生成，具有止痛、抗炎及退热作用；不抑制前列腺素合成；对骨关节炎有延缓疾病进程的作用。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"46. 属于巯基化合物，易被氧化，储存期间应避免接触空气、氧化剂的药物是",opts:["A.奥马珠单抗","B.美泊利珠单抗","C.噻托溴铵","D.异丙托溴铵","E.乙酰半胱氨酸"],ans:"E",exp:"本题考查黏痰溶解剂的临床用药评价。乙酰半胱氨酸为巯基化合物，易被氧化，可与金属离子络合，储存期间应避免接触空气、氧化剂、某些金属、橡胶。"},
      {q:"47. 属于M胆碱受体拮抗剂，由于起效慢，适用于慢性阻塞性肺疾病维持治疗，且每日给药1次的药物是",opts:["A.奥马珠单抗","B.美泊利珠单抗","C.噻托溴铵","D.异丙托溴铵","E.乙酰半胱氨酸"],ans:"C",exp:"本题考查平喘药的分类与代表药品。噻托溴铵属于长效M胆碱受体拮抗剂，起效慢，适用于慢性阻塞性肺疾病的维持治疗，口腔吸入给药，成人每次1粒，一日1次。"},
      {q:"48. 属于抗过敏平喘药，仅适用于治疗确诊为IgE介导的哮喘患者的药物是",opts:["A.奥马珠单抗","B.美泊利珠单抗","C.噻托溴铵","D.异丙托溴铵","E.乙酰半胱氨酸"],ans:"A",exp:"本题考查过敏介质阻释剂（奥马珠单抗）的临床用药评价。奥马珠单抗属于抗IgE单克隆抗体，仅适用于治疗确诊为IgE介导的哮喘患者。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"49. 通过抑制脑啡肽酶，减少肠道水和电解质过度分泌的药物是",opts:["A.聚卡波非钙","B.口服补液盐","C.洛哌丁胺","D.消旋卡多曲","E.双歧杆菌三联活菌"],ans:"D",exp:"本题考查止泻药的临床用药评价。消旋卡多曲属于抗分泌药，可抑制脑啡肽酶，减少肠道水和电解质过度分泌。"},
      {q:"50. 主治因肠道菌群失调引起的急慢性腹泻、便秘，不宜与抗酸药、抗菌药合用的药物是",opts:["A.聚卡波非钙","B.口服补液盐","C.洛哌丁胺","D.消旋卡多曲","E.双歧杆菌三联活菌"],ans:"E",exp:"本题考查止泻药的临床用药评价。双歧杆菌三联活菌属于微生态制剂，主治因肠道菌群失调引起的急慢性腹泻、便秘；抗酸药、抗菌药与可减弱其疗效，避免同服。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"51. 兼有中枢和外周多巴胺D2受体拮抗作用，易透过血-脑屏障，常见嗜睡和倦怠不良反应的药物是",opts:["A.甲氧氯普胺","B.东莨菪碱","C.多潘立酮","D.昂丹司琼","E.莫沙必利"],ans:"A",exp:"本题考查胃肠动力药的分类与临床用药评价。甲氧氯普胺兼有中枢和外周多巴胺D2受体拮抗作用，易透过血-脑屏障，故易引起锥体外系反应，常见嗜睡和倦怠的不良反应。"},
      {q:"52. 为外周多巴胺D2受体拮抗剂，与显著抑制CYP3A4酶的药物合用可导致Q-Tc间期延长的药物是",opts:["A.甲氧氯普胺","B.东莨菪碱","C.多潘立酮","D.昂丹司琼","E.莫沙必利"],ans:"C",exp:"本题考查胃肠动力药的分类与临床用药评价。多潘立酮是外周多巴胺D2受体拮抗剂，与显著抑制CYP3A4酶的药物合用可导致其的血药浓度增加，并可观察到有临床意义的Q-Tc间期改变，因此禁止多潘立酮与氟康唑、伏立康唑、克拉霉素、胺碘酮、伊曲康唑、泊沙康唑、利托那韦、沙奎那韦等药物合用。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"53. 属于α1和β受体拮抗剂，且脂溶性较强的抗高血压药物是",opts:["A.拉贝洛尔","B.阿替洛尔","C.美托洛尔","D.普萘洛尔","E.比索洛尔"],ans:"A",exp:"本题考查抗高血压药的分类与β受体拮抗剂的临床用药评价。属于α1和β受体拮抗剂的有拉贝洛尔、阿罗洛尔、卡维地洛，均为脂溶性药物。"},
      {q:"54. 属于选择性β1受体拮抗剂，且水溶性较强的抗高血压药物是",opts:["A.拉贝洛尔","B.阿替洛尔","C.美托洛尔","D.普萘洛尔","E.比索洛尔"],ans:"B",exp:"本题考查抗高血压药的分类与β受体拮抗剂的临床用药评价。属于选择性β1受体拮抗剂的有比索洛尔、美托洛尔、阿替洛尔，其中阿替洛尔为水溶性β受体拮抗剂，美托洛尔为脂溶性β受体拮抗剂，比索洛尔为水脂双溶性β受体拮抗剂。普萘洛尔属于非选择性β受体拮抗剂，其为脂溶性β受体拮抗剂。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"55. 患者，男，65岁，高血压病史4年，近期查体发现血尿酸水平偏高。该患者需避免使用的抗高血压药物是",opts:["A.卡托普利","B.氢氯噻嗪","C.氯沙坦","D.普萘洛尔","E.氨氯地平"],ans:"B",exp:"本题考查常用降压药种类的临床选择。氢氯噻嗪在使用期间会引起低血钾、低血钠、低血镁、高血糖、高血脂、高尿酸、高血钙、磺胺样过敏反应。高尿酸血症或有痛风病史患者慎用氢氯噻嗪。"},
      {q:"56. 患者，男，48岁，诊断为高血压合并甲状腺功能亢进，心率过快，宜选用的抗高血压药物是",opts:["A.卡托普利","B.氢氯噻嗪","C.氯沙坦","D.普萘洛尔","E.氨氯地平"],ans:"D",exp:"本题考查β受体拮抗剂的临床用药评价。普萘洛尔属于β受体拮抗剂，可用于治疗高血压，还可减慢窦性节律，减慢心房和房室结的传导，延长房室结的功能性不应期，因此也可用于治疗心律失常，以及用于控制甲状腺功能亢进症的心率加快。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"57. 属于前蛋白转化酶枯草溶菌素9（PCSK9）抑制剂的调节血脂药是",opts:["A.依洛尤单抗","B.苯扎贝特","C.阿托伐他汀","D.依折麦布","E.阿昔莫司"],ans:"A",exp:"本题考查调节血脂药的分类与代表药品。依洛尤单抗属于前蛋白转化酶枯草溶菌素9（PCSK9）抑制剂。"},
      {q:"58. 激动过氧化物酶体增殖物激活受体α（PPARα），显著增加LPL活性，减少ApoCIII合成的药物是",opts:["A.依洛尤单抗","B.苯扎贝特","C.阿托伐他汀","D.依折麦布","E.阿昔莫司"],ans:"B",exp:"本题考查其他调血脂药的临床用药评价。苯扎贝特属于贝丁酸类药物，是过氧化物酶体增殖物激活受体α（PPARα）的激动剂，能显著增加LPL活性，同时减少ApoCIII的合成，促进血清TG脂解及VLDL清除。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"59. 为非特异性纤溶酶原激活剂，易导致过敏反应的药物是",opts:["A.重组链激酶","B.尿激酶","C.瑞替普酶","D.替奈普酶","E.阿替普酶"],ans:"A",exp:"本题考查溶栓药（溶栓酶）的临床用药评价。重组链激酶和尿激酶是非选择性纤溶酶原激活剂，其中重组链激酶易导致过敏反应。"},
      {q:"60. 血浆清除半衰期短（4～5min），需持续静脉滴注，适用于血流不稳定的急性大面积肺栓塞的药物是",opts:["A.重组链激酶","B.尿激酶","C.瑞替普酶","D.替奈普酶","E.阿替普酶"],ans:"E",exp:"本题考查溶栓药（溶栓酶）的临床用药评价。阿替普酶血浆清除半衰期短（4～5min），需持续静脉滴注，适用于症状发生12小时内的急性心肌梗死、血流不稳定的急性大面积肺栓塞、症状发生4.5小时内的急性缺血性脑卒中（3h内用药最佳）。"},
      {q:"61. 血浆清除半衰期相对较长（14～16min），用于急性心肌梗死症状发生后12小时以内的溶栓治疗，静脉注射2次，两剂之间间隔30min的药物是",opts:["A.重组链激酶","B.尿激酶","C.瑞替普酶","D.替奈普酶","E.阿替普酶"],ans:"C",exp:"本题考查溶栓药（溶栓酶）的临床用药评价。瑞替普酶血浆清除半衰期为14～16min，比阿替普酶略长，用于急性心肌梗死症状发生后12小时以内的溶栓治疗，使用时静脉注射2次即可，两剂之间间隔30min。替奈普酶半衰期更长（20～24min），单次注射给药即可。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"62. 属于小分子拟肽类血小板生成素受体激动剂的是",opts:["A.罗普司亭","B.氨甲环酸","C.硫酸鱼精蛋白","D.聚桂醇","E.特利加压素"],ans:"A",exp:"本题考查抗出血药的分类与代表药品。促血小板生成药包括：①重组人血小板生成素、人白介素-11；②口服血小板生成素受体激动剂：艾曲泊帕乙醇胺、海曲泊帕乙醇胺、阿伐曲泊帕、芦曲泊帕；③小分子拟肽类血小板生成素受体激动剂：罗普司亭。"},
      {q:"63. 属于收缩血管药的是",opts:["A.罗普司亭","B.氨甲环酸","C.硫酸鱼精蛋白","D.聚桂醇","E.特利加压素"],ans:"E",exp:"本题考查抗出血药的分类与代表药品。垂体后叶（注射液）、特利加压素属于收缩血管药。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"64. 米拉贝隆属于",opts:["A.M受体拮抗药","B.α受体拮抗药","C.5型磷酸二酯酶抑制药","D.β受体激动药","E.5α还原酶抑制剂"],ans:"D",exp:"本题考查治疗膀胱过度活动症用药的分类与作用机制。治疗膀胱过度活动症用药主要包括：①M受体拮抗药：奥昔布宁、托特罗定、黄酮哌酯、索利那新、曲司氯铵、丙哌维林；②β3肾上腺素受体激动剂：米拉贝隆；③A型肉毒毒素。"},
      {q:"65. 爱普列特属于",opts:["A.M受体拮抗药","B.α受体拮抗药","C.5型磷酸二酯酶抑制药","D.β受体激动药","E.5α还原酶抑制剂"],ans:"E",exp:"本题考查治疗良性前列腺增生用药的分类与作用机制。治疗良性前列腺增生用药包括：①α1受体拮抗剂：第二代：哌唑嗪、特拉唑嗪、多沙唑嗪、阿夫唑嗪；第三代：坦索罗辛；②5α还原酶抑制剂：非那雄胺、爱普列特、度他雄胺。"},
      {q:"66. 阿伐那非属于",opts:["A.M受体拮抗药","B.α受体拮抗药","C.5型磷酸二酯酶抑制药","D.β受体激动药","E.5α还原酶抑制剂"],ans:"C",exp:"本题考查治疗男性勃起功能障碍药的分类与代表药品。5型磷酸二酯酶（PDE-5）抑制剂包括西地那非、伐地那非、他达拉非、阿伐那非、爱地那非，是勃起功能障碍首选治疗药物。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"67. 持续大剂量使用易引发，发病隐匿，影响在用药后1年内最为明显的不良反应主要表现在",opts:["A.皮肤和外貌","B.骨骼和肌肉","C.肾上腺皮质功能减退样症状","D.神经精神症状","E.血液系统"],ans:"B",exp:"本题考查糖皮质激素治疗的不良反应和常见并发症。持续大剂量应用糖皮质激素易引发运动系统（骨骼和肌肉）的不良反应，表现为骨质疏松，严重者出现自发性骨折、骨缺血性坏死（股骨头无菌性坏死）；肌病表现近端肌无力甚至肌萎缩。发病隐匿，对骨代谢的影响在用药后1年内最为明显，停药后可改善；肌病属少见并发症。"},
      {q:"68. 用药早期易出现，大剂量冲击治疗易发生的不良反应主要表现在",opts:["A.皮肤和外貌","B.骨骼和肌肉","C.肾上腺皮质功能减退样症状","D.神经精神症状","E.血液系统"],ans:"D",exp:"本题考查糖皮质激素治疗的不良反应和常见并发症。糖皮质激素用药早期易出现大剂量冲击治疗易发生精神与神经系统的不良反应，表现为睡眠紊乱、谵妄、意识模糊或定向障碍等神经症状和情绪不稳、轻躁狂、抑郁等精神病性症状。皮肤和外貌不良反应在较低剂量会发生。肾上腺皮质功能减退样症状是在减量过快或突然停用时出现。血液系统不良反应在治疗剂量即可出现。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"69. 艾塞那肽的给药方式是",opts:["A.一日1次，固定时间皮下注射","B.一日2次，早、晚餐前60分钟内皮下注射","C.餐前30min皮下注射","D.餐前5～10min或餐后立即皮下注射","E.一日2次，早、晚餐后60分钟内皮下注射"],ans:"B",exp:"本题考查肠促胰素类降糖药的临床用药评价。艾塞那肽仅皮下注射给药，推荐起始剂量为5μg，一日2次，于早餐和晚餐前60min内给药，餐后不可给药。"},
      {q:"70. 门冬胰岛素注射液的给药方式是",opts:["A.一日1次，固定时间皮下注射","B.一日2次，早、晚餐前60分钟内皮下注射","C.餐前30min皮下注射","D.餐前5～10min或餐后立即皮下注射","E.一日2次，早、晚餐后60分钟内皮下注射"],ans:"D",exp:"本题考查胰岛素和胰岛素类似物的临床用药评价。门冬胰岛素注射液为超短（速）效胰岛素类似物，用药时间较短效胰岛素灵活，餐前5～10min或餐后立即皮下注射。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"71. 为孕激素，大剂量具有抑制、延迟排卵和抑制子宫内膜的作用，可作紧急避孕药的是",opts:["A.米非司酮","B.左炔诺孕酮","C.双炔失碳酯","D.氯地孕酮","E.地屈孕酮"],ans:"B",exp:"本题考查性激素类避孕药的临床用药评价。左炔诺孕酮为孕激素，可与炔雌醇组成各种复方制剂作为短效口服避孕药，单方制剂可作为紧急避孕药，在无防护的性生活或避孕失败72小时内尽快口服，不宜作为常规避孕药。"},
      {q:"72. 为强抗孕激素，对受孕动物各期妊娠均有引产效应，可作为非手术性抗早孕药的是",opts:["A.米非司酮","B.左炔诺孕酮","C.双炔失碳酯","D.氯地孕酮","E.地屈孕酮"],ans:"A",exp:"本题考查性激素类避孕药的临床用药评价。米非司酮为强抗孕激素，对受孕动物各期妊娠均有引产效应，可作为非手术性抗早孕药，与米索前列醇片序贯合并使用，可用于终止停经49日内的妊娠。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"73. PK/PD指标为%T>MIC，用于严重肾功能衰竭患者，无需调整给药剂量的药物是",opts:["A.哌拉西林","B.苯唑西林","C.头孢他啶","D.环丙沙星","E.替加环素"],ans:"B",exp:"本题考查青霉素类抗菌药物的临床用药评价。青霉素类抗菌药物半衰期较短，属于时间依赖性且抗菌作用时间短的抗菌药物，根据药动学/药效学（PK/PD）的特点，评估指数为%T>MIC。青霉素类药物中苯唑西林、双氯西林、萘夫西林经非肾途径清除，严重肾功能衰竭者，无需调整给药剂量，而哌拉西林、氨苄西林、替卡西林需根据肾功能调整给药剂量。"},
      {q:"74. PK/PD指标为AUC0～24/MIC，用于严重肾功能衰竭患者，无需调整给药剂量的药物是",opts:["A.哌拉西林","B.苯唑西林","C.头孢他啶","D.环丙沙星","E.替加环素"],ans:"E",exp:"本题考查四环素类抗菌药物的临床用药评价。四环素类抗菌药物PAE或半衰期较长，抗菌作用时间延长，属于时间依赖性且抗菌作用时间较长的抗菌药物，根据药动学/药效学（PK/PD）的特点，替加环素的评估指数为AUC0～24/MIC。四环素类药物中替加环素、多西环素、奥马环素和依拉环素无需根据肾功能调整给药剂量。头孢菌素类药物中除了头孢曲松，其他头孢菌素类药物都需要根据肾功能调整给药剂量。环丙沙星属于浓度依赖性抗菌药物，评估指数为Cmax/MIC或AUC0～24/MIC，且肾功能不全未调整给药剂量易引发中枢神经系统反应。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"75. 应用头孢吡肟期间，若出现腹泻，需口服万古霉素，原因是",opts:["A.增加抗菌范围","B.预防低凝血酶原血症","C.预防周围神经炎","D.对抗艰难梭菌所致感染","E.抑制β-内酰胺酶"],ans:"D",exp:"本题考查头孢菌素类抗菌药物的临床用药评价。应用头孢吡肟期间，出现腹泻应考虑为艰难梭菌所致伪膜性肠炎。对轻症肠炎患者，仅停用头孢吡肟即可缓解；中、重度患者需甲硝唑口服，无效时考虑口服万古霉素或去甲万古霉素。"},
      {q:"76. 长期应用头孢哌酮，需补充维生素K，原因是",opts:["A.增加抗菌范围","B.预防低凝血酶原血症","C.预防周围神经炎","D.对抗艰难梭菌所致感染","E.抑制β-内酰胺酶"],ans:"B",exp:"本题考查头孢菌素类抗菌药物的临床用药评价。长期使用广谱头孢菌素类药物，可导致肠道菌群改变，导致维生素K合成受阻，引起低凝血酶原血症或出血倾向，长期大剂量应用头孢菌素类药物时（10日以上），需适当补充维生素K。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"77. 对大多数念珠菌属、隐球菌属有较好的抗菌活性，可用于泌尿系统真菌感染的药物是",opts:["A.两性霉素B","B.氟康唑","C.氟胞嘧啶","D.卡泊芬净","E.伊曲康唑"],ans:"B",exp:"本题考查三唑类的临床用药评价。氟康唑对大多数念珠菌属、隐球菌属有较好的抗菌活性，对曲霉菌无效，其主要经过肾脏清除或以原型排至尿液中，可用于泌尿系统真菌感染。"},
      {q:"78. 对念珠菌有较好的抗菌活性，其胶囊剂型是甲癣的一线治疗药物的是",opts:["A.两性霉素B","B.氟康唑","C.氟胞嘧啶","D.卡泊芬净","E.伊曲康唑"],ans:"E",exp:"本题考查三唑类的临床用药评价。伊曲康唑对念珠菌有较好的抗菌活性，其胶囊剂型广泛用于浅部真菌病的治疗，是甲癣的一线治疗药物。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"79. 治疗慢性丙型肝炎时最好与利巴韦林联合使用的药物是",opts:["A.阿德福韦酯","B.拉米夫定","C.索磷布韦-维帕他韦","D.恩替卡韦","E.聚乙二醇干扰素α-2a"],ans:"E",exp:"本题考查干扰素的临床用药评价。聚乙二醇干扰素α-2a可用于治疗慢性乙型肝炎和慢性丙型肝炎，治疗慢性丙型肝炎时最好与利巴韦林联合使用。"},
      {q:"80. 治疗慢性丙型肝炎时不需要与利巴韦林联合使用的药物是",opts:["A.阿德福韦酯","B.拉米夫定","C.索磷布韦-维帕他韦","D.恩替卡韦","E.聚乙二醇干扰素α-2a"],ans:"C",exp:"本题考查治疗慢性丙型肝炎药的临床用药评价。索磷布韦-维帕他韦属于抗丙型肝炎病毒药，为复方制剂，不需要与利巴韦林联合使用。阿德福韦酯、拉米夫定、恩替卡韦属于治疗慢性乙型肝炎病毒药物。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"81. 与多柔比星存在交叉耐药性的抗肿瘤药物是",opts:["A.奥沙利铂","B.甲氨蝶呤","C.氟他胺","D.紫杉醇","E.柔红霉素"],ans:"E",exp:"本题考查蒽环类抗肿瘤抗生素的临床用药评价。多柔比星与柔红霉素、长春新碱和放线菌素D呈现交叉耐药性。"},
      {q:"82. 与长春新碱同用，可增强第VIII对脑神经障碍的抗肿瘤药是",opts:["A.奥沙利铂","B.甲氨蝶呤","C.氟他胺","D.紫杉醇","E.柔红霉素"],ans:"A",exp:"本题考查长春碱类的临床用药评价。长春新碱与铂类药物（如奥沙利铂、顺铂等）同用，可能增强第VIII对脑神经障碍。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"83. 可用于治疗前列腺癌和乳腺癌的调节体内激素平衡药是",opts:["A.舒尼替尼","B.吉非替尼","C.戈舍瑞林","D.氟他胺","E.来曲唑"],ans:"C",exp:"本题考查促性腺激素释放激素（GnRH）激动剂/抑制剂的临床用药评价。戈舍瑞林、氟他胺和来曲唑属于调节体内激素平衡药，其中戈舍瑞林主要用于前列腺癌、绝经前期及围绝经期妇女的乳腺癌、子宫内膜异位症。氟他胺主要用于前列腺癌的治疗。来曲唑主要用于绝经后乳腺癌的治疗。"},
      {q:"84. 主要用于表皮生长因子受体（EGFR）基因具有敏感突变的局部晚期或转移性非小细胞肺癌患者的一线治疗的生物靶向治疗药物是",opts:["A.舒尼替尼","B.吉非替尼","C.戈舍瑞林","D.氟他胺","E.来曲唑"],ans:"B",exp:"本题考查靶向抗肿瘤药的适应证。吉非替尼和舒尼替尼属于生物靶向治疗药物，其中吉非替尼主要用于表皮生长因子受体（EGFR）基因具有敏感突变的局部晚期或转移性非小细胞癌（NSCLC）患者的一线治疗和既往接受过化学治疗的局部晚期或转移性非小细胞癌。"}
    ]},
    {type:"配伍选择题",subs:[
      {q:"85. 万古霉素用药过程中可导致红人综合征，为避免该不良反应，可联合使用的药物是",opts:["A.肾上腺素","B.西司他丁","C.葡萄糖酸钙","D.苯海拉明","E.利福平"],ans:"D",exp:"本题考查糖肽类抗菌药物的临床用药评价。糖肽类抗菌药物（如万古霉素）快速滴注时可出现上部躯体发红，称为红人综合征，主要由嗜碱性粒细胞和肥大细胞释放组胺引起的，用苯海拉明和减慢万古霉素滴注速度可以避免该反应的发生。"},

    {type:"多项选择题",q:"98. 关于抗酸药临床用药评价的说法，正确的有",opts:["A.口服后可中和胃酸，快速改善反酸、烧心和胃部不适症状，但药效持续时间短","B.氢氧化铝有效敛和局部止血作用，但可引起便秘，长期便秘者应慎用","C.铝剂能吸附胆盐，减少脂溶性维生素，特别是维生素A的吸收","D.碳酸氢钠碱化尿液后，可加快阿司匹林、青霉素从尿中排泄的速度","E.铝剂长期服用可引起低磷血症、老年人骨质疏松"],ans:"ABCDE",exp:"本题考查抗酸药的临床用药评价。①抗酸药是含钠、镁、铝或钙的弱碱性盐，口服后可中和胃酸，快速改善反酸、烧心和胃部不适症状。抗酸药药效持续时间短，空腹服用仅约30分钟；②氢氧化铝与胃酸生成氯化铝，有收敛和局部止血作用，但铝可引起便秘，长期便秘者应慎用；③铝剂能吸附胆盐，减少脂溶性维生素，特别是维生素A的吸收；④碳酸氢钠碱化尿液后，增加了尿中弱碱性药物（如奎尼丁、吗啡和伪麻黄碱等）的重吸收，也加快阿司匹林、青霉素和异烟肼等酸性药物从尿中排泄的速度；⑤铝剂抑制肠道内磷酸根的吸收，可能引起低磷血症。长期应用铝剂会导致老年人骨质疏松。"},
    {type:"多项选择题",q:"99. 肝素与低分子量肝素相比，具有的优势有",opts:["A.起效快、失效快，可根据需要更加灵活地调整剂量或停药","B.可用活化部分凝血活酶时间（APTT）监测肝素效果，也可用抗Xa活性进行监测","C.可用于肾衰竭或严重肾功能不全患者","D.可使用硫酸鱼精蛋白迅速逆转其作用","E.生物利用度高，发生血小板减少（HIT）的风险较低"],ans:"ABCD",exp:"本题考查肝素类的临床用药评价。肝素的优势有：①起效快、失效快，可根据需要更加灵活地调整剂量或停药（如外科手术或出血时）；②可用活化部分凝血活酶时间（APTT）监测肝素效果，该监测项目已普遍开展，也可用抗Xa活性进行监测；③主要在肝脏代谢清除，因此可用于肾衰竭或严重肾功能不全患者；④可使用硫酸鱼精蛋白迅速逆转其作用；⑤肝素生物利用度低（15%～30%），且肝素潜在不良反应多，包括HIT、皮肤不良反应以及长期用药引起的骨质疏松。"},

var currentChapter=0,answered=0,correct=0;
function initChapterSelect(){var sel=document.getElementById('chapterSelect');sel.innerHTML='';for(var i=0;i<chapters.length;i++){var opt=document.createElement('option');opt.value=i;opt.textContent=chapters[i].name;sel.appendChild(opt);}}
function switchChapter(index){currentChapter=parseInt(index);answered=0;correct=0;renderChapter();document.getElementById('chapterSelect').value=currentChapter;}
function prevChapter(){if(currentChapter>0)switchChapter(currentChapter-1);}
function nextChapter(){if(currentChapter<chapters.length-1)switchChapter(currentChapter+1);}
function updateNavButtons(){document.getElementById('prevBtn').disabled=(currentChapter===0);document.getElementById('nextBtn').disabled=(currentChapter===chapters.length-1);}
var currentQuestionIndex=0;

function renderChapter(){
  var ch=chapters[currentChapter];
  document.getElementById('chapterTitle').textContent=ch.name;
  var flat=[];
  for(var i=0;i<ch.questions.length;i++){
    var item=ch.questions[i];
    if(item.subs){
      for(var j=0;j<item.subs.length;j++){
        flat.push({type:'配伍选择题',q:item.subs[j].q,opts:item.subs[j].opts,ans:item.subs[j].ans,optImgs:item.subs[j].optImgs,img:item.subs[j].img});
      }
    }else{
      flat.push(item);
    }
  }
  ch._flat=flat;
  currentQuestionIndex=0;
  answered=0;
  correct=0;
  renderOneQuestion();
  updateNavButtons();
}

function renderOneQuestion(){
  var ch=chapters[currentChapter];
  var flat=ch._flat;
  var quiz=document.getElementById('quiz');
  quiz.innerHTML='';
  document.getElementById('stats').textContent='已答 '+answered+' / '+flat.length+' 题，正确 '+correct+' 题';
  var oldBar=document.getElementById('quiz-nav-bar');
  if(oldBar)oldBar.remove();
  if(currentQuestionIndex>=flat.length){
    quiz.innerHTML='<div class="card" style="text-align:center;padding:40px 20px;"><h2>🎉 本章已完成！</h2><p>共 '+flat.length+' 题，答对 '+correct+' 题</p></div>';
    showNextBar('chapter-end');
    return;
  }
  var item=flat[currentQuestionIndex];
  var card=document.createElement('div');
  card.className='card';
  var tag=document.createElement('div');
  tag.className='tag';
  tag.textContent=item.type+'  ·  第 '+(currentQuestionIndex+1)+' / '+flat.length+' 题';
  card.appendChild(tag);
  var title=document.createElement('div');
  title.className='q-title';
  title.textContent=item.q;
  card.appendChild(title);
  if(item.img){
    var imgEl=document.createElement('img');
    imgEl.src=item.img;
    imgEl.style.cssText='max-width:100%;display:block;margin:10px auto;border-radius:6px;';
    imgEl.onerror=function(){this.style.display='none';};
    card.appendChild(imgEl);
  }
  var ansArr=item.ans.split('');
  var isMulti=ansArr.length>1;
  var selected=[];
  var allButtons=[];
  for(var k=0;k<item.opts.length;k++){
    (function(opt, idx){
      var btn=document.createElement('button');
      btn.className='option';
      if(item.optImgs && item.optImgs[idx]){
        var letterSpan=document.createElement('span');
        letterSpan.textContent=opt+' ';
        letterSpan.style.cssText='display:inline-block;vertical-align:top;font-weight:600;margin-right:6px;';
        btn.appendChild(letterSpan);
        var optImg=document.createElement('img');
        optImg.src=item.optImgs[idx];
        optImg.style.cssText='max-width:85%;max-height:150px;display:inline-block;vertical-align:middle;border-radius:4px;';
        optImg.onerror=function(){this.style.display='none';};
        btn.appendChild(optImg);
      }else{
        btn.textContent=opt;
      }
      var letter=opt.charAt(0);
      btn.onclick=function(){
        if(btn.classList.contains('disabled'))return;
        if(isMulti){
          var ix=selected.indexOf(letter);
          if(ix===-1){selected.push(letter);btn.style.background='#d0e3ff';btn.style.borderColor='#4a90e2';}
          else{selected.splice(ix,1);btn.style.background='';btn.style.borderColor='';}
        }else{judgeOne([letter]);}
      };
      allButtons.push(btn);
      card.appendChild(btn);
    })(item.opts[k], k);
  }
  if(isMulti){
    var submitBtn=document.createElement('button');
    submitBtn.textContent='提交答案';
    submitBtn.style.cssText='margin-top:12px;padding:12px 20px;background:#4a90e2;color:#fff;border:none;border-radius:8px;font-size:15px;cursor:pointer;width:100%;';
    submitBtn.onclick=function(){
      if(selected.length===0){alert('请至少选择一个选项');return;}
      judgeOne(selected);
      submitBtn.disabled=true;
      submitBtn.style.background='#c5d5ea';
    };
    card.appendChild(submitBtn);
  }
  var expDiv=document.createElement('div');
  expDiv.className='explanation';
  expDiv.textContent=item.exp?'解析：'+item.exp:'';
  card.appendChild(expDiv);
  quiz.appendChild(card);

  function judgeOne(chosen){
    var isCorrect=false;
    if(isMulti){
      if(chosen.length===ansArr.length){
        var sc=chosen.slice().sort().join('');
        var sa=ansArr.slice().sort().join('');
        isCorrect=(sc===sa);
      }
    }else{
      isCorrect=ansArr.indexOf(chosen[0])!==-1;
    }
    for(var i=0;i<allButtons.length;i++){
      var b=allButtons[i];
      var letter=b.textContent.charAt(0);
      if(ansArr.indexOf(letter)!==-1)b.classList.add('correct');
      if(!isCorrect&&chosen.indexOf(letter)!==-1&&ansArr.indexOf(letter)===-1)b.classList.add('wrong');
      b.classList.add('disabled');
      b.style.background='';
      b.style.borderColor='';
    }
    if(isCorrect){
      correct++;
      answered++;
      expDiv.classList.add('show');
      document.getElementById('stats').textContent='已答 '+answered+' / '+flat.length+' 题，正确 '+correct+' 题';
      showNextBar(true);
      var countdown=3;
      var btn=document.querySelector('.quiz-nav .next-btn:last-child');
      var timer=setInterval(function(){
        countdown--;
        if(btn)btn.textContent='即将跳转… '+countdown;
        if(countdown<=0){clearInterval(timer);currentQuestionIndex++;renderOneQuestion();}
      },500);
    }else{
      answered++;
      document.getElementById('stats').textContent='已答 '+answered+' / '+flat.length+' 题，正确 '+correct+' 题';
      expDiv.classList.add('show');
      showNextBar(false);
    }
  }
}

function showNextBar(mode){
  var oldBar=document.getElementById('quiz-nav-bar');
  if(oldBar)oldBar.remove();
  var bar=document.createElement('div');
  bar.className='quiz-nav';
  bar.id='quiz-nav-bar';
  var flat=chapters[currentChapter]._flat;
  if(mode==='chapter-end'){
    var progress=document.createElement('div');
    progress.className='progress-text';
    progress.textContent='本章完成';
    bar.appendChild(progress);
    var prevBtn=document.createElement('button');
    prevBtn.className='next-btn';
    prevBtn.textContent='上一章';
    prevBtn.disabled=(currentChapter===0);
    prevBtn.onclick=function(){prevChapter();};
    bar.appendChild(prevBtn);
    var nextBtn=document.createElement('button');
    nextBtn.className='next-btn';
    nextBtn.textContent='下一章';
    nextBtn.disabled=(currentChapter===chapters.length-1);
    nextBtn.onclick=function(){nextChapter();};
    bar.appendChild(nextBtn);
    document.body.appendChild(bar);
    return;
  }
  var isLast=(currentQuestionIndex>=flat.length-1);
  if(isLast){
    var progress=document.createElement('div');
    progress.className='progress-text';
    progress.textContent='本章最后一题';
    bar.appendChild(progress);
    var prevBtn=document.createElement('button');
    prevBtn.className='next-btn';
    prevBtn.textContent='上一题';
    prevBtn.disabled=(currentQuestionIndex===0);
    prevBtn.onclick=function(){if(currentQuestionIndex>0){currentQuestionIndex--;renderOneQuestion();}};
    bar.appendChild(prevBtn);
    var nextChapterBtn=document.createElement('button');
    nextChapterBtn.className='next-btn';
    nextChapterBtn.textContent='下一章';
    nextChapterBtn.disabled=(currentChapter===chapters.length-1);
    nextChapterBtn.onclick=function(){nextChapter();};
    bar.appendChild(nextChapterBtn);
    document.body.appendChild(bar);
    return;
  }
  var autoNext=(mode===true);
  var progress=document.createElement('div');
  progress.className='progress-text';
  progress.textContent=(currentQuestionIndex+1)+' / '+flat.length;
  bar.appendChild(progress);
  var prevBtn=document.createElement('button');
  prevBtn.className='next-btn';
  prevBtn.textContent='上一题';
  prevBtn.disabled=(currentQuestionIndex===0);
  prevBtn.onclick=function(){if(currentQuestionIndex>0){currentQuestionIndex--;renderOneQuestion();}};
  bar.appendChild(prevBtn);
  var nextBtn=document.createElement('button');
  nextBtn.className='next-btn';
  nextBtn.textContent=autoNext?'即将跳转…':'下一题';
  nextBtn.disabled=autoNext;
  nextBtn.onclick=function(){currentQuestionIndex++;renderOneQuestion();};
  bar.appendChild(nextBtn);
  document.body.appendChild(bar);
}
// ===== 全局滑动手势：右划上一题，左划下一题 =====
(function () {
  var touchStartX = 0, touchStartY = 0, isHorizontal = false;
  document.addEventListener('touchstart', function (e) {
    var target = e.target;
    if (target.closest && target.closest('#quiz')) {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
      isHorizontal = false;
    } else {
      touchStartX = 0;
      touchStartY = 0;
      isHorizontal = false;
    }
  }, { passive: true });
  document.addEventListener('touchmove', function (e) {
    if (touchStartX === 0 && touchStartY === 0) return;
    var dx = e.touches[0].clientX - touchStartX;
    var dy = e.touches[0].clientY - touchStartY;
    if (!isHorizontal && Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy)) {
      isHorizontal = true;
    }
    if (isHorizontal) {
      e.preventDefault();
    }
  }, { passive: false });
  document.addEventListener('touchend', function (e) {
    if (touchStartX === 0 && touchStartY === 0) { isHorizontal = false; return; }
    var endX = e.changedTouches[0].clientX;
    var endY = e.changedTouches[0].clientY;
    var dx = endX - touchStartX;
    var dy = endY - touchStartY;
    if (Math.abs(dx) > 50 && Math.abs(dy) < 80) {
      var flat = chapters[currentChapter] && chapters[currentChapter]._flat;
      if (flat) {
        if (dx > 0) {
          if (currentQuestionIndex > 0) { currentQuestionIndex--; renderOneQuestion(); }
        } else {
          if (currentQuestionIndex < flat.length - 1) { currentQuestionIndex++; renderOneQuestion(); }
        }
      }
    }
    touchStartX = 0;
    touchStartY = 0;
    isHorizontal = false;
  }, { passive: true });
})();
// ===== 滑动手势结束 =====
window.scrollTo(0, 0);
document.documentElement.scrollLeft = 0;
document.body.scrollLeft = 0;
initChapterSelect();
switchChapter(0);
</script></body></html>
